localization:
  entries:
    amber_collector_slot_0: Amber Deposit
    amber_collector_slot_1: Sand Carting
    amber_collector_slot_2: Beach Gathering
    amber_collector: Amber Gatherers
    amber_collector_desc: Coastal crews search beaches and shallow pits for amber washed from older deposits. Baskets and cart teams help sort the amber and carry usable sand from the shore.
    pp_amber_collector_base_amber: Shore Amber
    pp_amber_collector_base_amber_desc: "The shore amber itself: what the sea gives before any gatherer improves on it."
    pp_amber_collector_no_beach_gathering: No Beach Gathering
    pp_amber_collector_no_beach_gathering_desc: "No one wades the surf with scoop nets; the gatherers only pick up amber cast on the beach."
    pp_amber_collector_basket_gathering: Basket Gathering
    pp_amber_collector_basket_gathering_desc: "After autumn storms the gatherers wade into the surf with long-handled scoop nets and catch the amber floating among the seaweed. On the Baltic coast the ruler often claimed the amber, and the shore was closely watched."
    pp_amber_collector_no_sand: No Sand Carting
    pp_amber_collector_no_sand_desc: "No sand is carted off the beach; the gatherers sift it where it lies and keep to the amber."
    pp_amber_collector_sand_horses: Horse-Drawn Sand
    pp_amber_collector_sand_horses_desc: "Horse carts haul away the beach sand the gatherers have sifted through. Builders and glassmakers inland buy it, and the horses make quick work of the loads."
    pp_amber_collector_sand_livestock: Ox-Drawn Sand
    pp_amber_collector_sand_livestock_desc: "Ox carts carry off the sifted beach sand in slow, heavy loads. Oxen cost less to keep than horses, and the sand still finds buyers among builders and glassmakers."
    pp_amber_collector_market_sales: Market Sales
    pp_amber_collector_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    amber_collector_slot_3: Market
icon:
  source_png: ../assets/icons/amber_collector.png
  output_dds: amber_collector.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for an amber collector, transparent background. Center a compact beach-gathering setup with a low wicker basket holding golden amber chunks, a simple wooden sieve, a small hand rake, pale beach sand, and one warm orange amber piece as the focal material. Use simplified readable shapes, visible painterly brushwork, softly outlined historical UI art, muted sand and wicker browns with amber orange accents, no text, no frame, not photorealistic, not cartoonish.

