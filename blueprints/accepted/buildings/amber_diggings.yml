localization:
  entries:
    amber_diggings_slot_0: Blue Earth Seam
    amber_diggings_slot_1: Spoil Carting
    amber_diggings_slot_2: Pit Digging
    amber_diggings: Amber Diggings
    amber_diggings_desc: "Where the [ShowBuildingTypeName('amber_collector')|e] searched the shore, these crews go after the source: timber-shored pits cut down to the dark blue earth that holds the amber, a windlass to bring it up, and sorting tables beside the spoil. Far more comes out of the ground than the sea ever gave up."
    pp_amber_diggings: Amber Regale
    pp_amber_diggings_desc: "The crown claims the amber of its shores as its own and pays to dig for more of it. [ShowBuildingTypeName('amber_diggings')|e] replace the old beach crews."
    pp_amber_diggings_base_amber: Blue Earth Seam
    pp_amber_diggings_no_spoil: No Spoil Carting
    pp_amber_diggings_spoil_horses: Horse-Drawn Spoil
    pp_amber_diggings_spoil_livestock: Ox-Drawn Spoil
    pp_amber_diggings_no_pit_digging: No Pit Digging
    pp_amber_diggings_shored_pits: Shored Pits
    pp_amber_diggings_market_sales: Market Sales
    pp_amber_diggings_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    amber_diggings_slot_3: Market
