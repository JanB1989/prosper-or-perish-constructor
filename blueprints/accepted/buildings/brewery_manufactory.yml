    pp_brewery_manufactory_legacy_millet_beer_workshop_maintenance_desc: "An older way of working, kept from the $beer_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_brewery_manufactory_legacy_rice_beer_workshop_maintenance: "$rice_beer_workshop_maintenance$ (Old Ways)"
    pp_brewery_manufactory_legacy_rice_beer_workshop_maintenance_desc: "An older way of working, kept from the $beer_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
