  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_brewery_manufactory_brewery_manufactory_maintenance
    - pp_brewery_manufactory_legacy_fruit_beer_workshop_maintenance
    - pp_brewery_manufactory_legacy_maize_beer_workshop_maintenance
    - pp_brewery_manufactory_legacy_millet_beer_workshop_maintenance
    - pp_brewery_manufactory_legacy_rice_beer_workshop_maintenance
  - name: slot_1
    methods:
    - pp_brewery_manufactory_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 3, own methods x1.7 goods in and out, margin +0.1
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = manufactory_startup_ramp_target
    category = consumer_goods_category
    employment_size = 0.325   # manufacturing tiers 2026-10-06: 0.25 after the employment cut x1.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    obsolete = beer_workshop
    unique_production_methods = {
        pp_brewery_manufactory_brewery_manufactory_maintenance = {
            lumber = 0.765 # casks, malt kiln and copper fuel
            wheat = 3.944
            tools = 0.196 # tools cut to a running cost (~10 %)
            manual_labor = 0.459
            produced = beer
            output = 3.719
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_brewery_manufactory_legacy_fruit_beer_workshop_maintenance = {
            icon_type = goods
            icon = fruit
            fruit = 2.19
            lumber = 0.62
            tools = 0.12
            manual_labor = 0.37
            produced = beer
            output = 2.36
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_brewery_manufactory_legacy_maize_beer_workshop_maintenance = {
            icon_type = goods
            icon = maize
            maize = 2.96
            pottery = 0.69
            manual_labor = 0.4
            produced = beer
            output = 2.36
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_brewery_manufactory_legacy_millet_beer_workshop_maintenance = {
            icon_type = goods
            icon = millet
            millet = 2.08
            lumber = 0.66
            tools = 0.12
            manual_labor = 0.41
            produced = beer
            output = 2.36
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_brewery_manufactory_legacy_rice_beer_workshop_maintenance = {
            icon_type = goods
            icon = rice
            rice = 2.08
            lumber = 0.66
            tools = 0.12
            manual_labor = 0.41
            produced = beer
            output = 2.36
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_brewery_manufactory_market_sales = {
            offset = 0.01
            produced = beer
            output = 0.005
            category = building_maintenance
        }
    }
    custom_tags = {
        midgame_manufactory
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.15
    raw_modifier = {
        local_pp_beer_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:beer_workshop } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
localization:
  entries:
    brewery_manufactory_slot_0: Brewery Manufactory Work
    pp_brewery_manufactory_brewery_manufactory_maintenance: Brewery Manufactory Brewery Manufactory Maintenance
    pp_brewery_manufactory_market_sales: Market Sales
    pp_brewery_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    brewery_manufactory_slot_1: Market
    pp_brewery_manufactory_legacy_fruit_beer_workshop_maintenance: "$fruit_beer_workshop_maintenance$ (Old Ways)"
    pp_brewery_manufactory_legacy_fruit_beer_workshop_maintenance_desc: "An older way of working, kept from the $beer_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_brewery_manufactory_legacy_maize_beer_workshop_maintenance: "$maize_beer_workshop_maintenance$ (Old Ways)"
    pp_brewery_manufactory_legacy_maize_beer_workshop_maintenance_desc: "An older way of working, kept from the $beer_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
