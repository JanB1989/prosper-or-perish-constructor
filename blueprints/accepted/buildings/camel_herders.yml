localization:
  entries:
    camel_herders: Camel Herders
    camel_herders_desc: Herding families drive their camels between desert wells and thorn-scrub grazing, raising calves for the caravans, the armies and the saddle.
    camel_herders_slot_0: Desert Grazing
    camel_herders_slot_1: Herding and Feeding
    camel_herders_slot_2: Market
    pp_camel_herders_base_camels: Desert Grazing
    pp_camel_herders_free_range: Free-Ranging Herds
    pp_camel_herders_millet_fodder: Millet and Sorghum Fodder
    pp_camel_herders_millet_fodder_desc: On the desert edge, herders carry their camels through the dry season on millet and sorghum grown for them.
    pp_camel_herders_well_circuits: Well Circuits
    pp_camel_herders_well_circuits_desc: The herds keep to a fixed round of dug wells and salty grazing, with water skins, buckets and salt carried along for the long marches.
    pp_camel_herders_dates_and_fish: Dates and Dried Fish
    pp_camel_herders_dates_and_fish_desc: Along the coasts, herders feed their camels date stones, spoiled dates and sun-dried sardines when the grazing fails.
    pp_camel_herders_market_sales: Market Sales
    pp_camel_herders_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
icon:
