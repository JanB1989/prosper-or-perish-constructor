localization:
  entries:
    camel_stud: Camel Stud
    camel_stud_desc: Walled breeding yards with picked sires, fodder stores and trained handlers raise strong baggage camels and swift riding camels for the caravans and the armies.
    camel_stud_slot_0: Desert Grazing
    camel_stud_slot_1: Stud Work
    camel_stud_slot_2: Provisioning
    camel_stud_slot_3: Market
    pp_camel_stud_provision: Provision with Camel
    pp_camel_stud_provision_desc: The household buys its own camels back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_camel_stud: Camel Studs
    pp_camel_stud_desc: Courts and great caravan houses keep picked sires in walled breeding yards, turning the herds of the desert into a steady supply of baggage and riding camels.
    pp_camel_stud_base_camels: Desert Grazing
    pp_camel_stud_no_primary: No Stud Work
    pp_camel_stud_hybrid_crossing: Hybrid Crossing
    pp_camel_stud_hybrid_crossing_desc: Two-humped sires crossed with dromedary dams give big, hardy baggage camels that carry heavier loads through cold and heat alike.
    pp_camel_stud_riding_strains: Riding Strains
    pp_camel_stud_riding_strains_desc: Picked bloodlines of light, swift dromedaries are raised and trained for couriers, raiders and the camel corps.
    pp_camel_stud_market_sales: Market Sales
    pp_camel_stud_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
icon:
  source_png: ../assets/icons/camel_stud.png
  output_dds: camel_stud.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The camel stud is a land-limited rural specialization and keeps camel margins close to break-even rather than driving fast payback.
  production_methods:
    pp_camel_stud_base_camels:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Passive grazing baseline intentionally stays below the global full-building target.
        output_throughput: Passive grazing baseline intentionally stays below the global full-building target.
        base_output_per_1k: Staple food buildings employ 1,250 per level (2026-10-05, Jan; camels a staple since 2026-10-07), same methods with more workers.
    pp_camel_stud_no_primary:
      production_efficiency: 1.0
    pp_camel_stud_hybrid_crossing:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Staple food buildings employ 1,250 per level (2026-10-05, Jan; camels a staple since 2026-10-07), same methods with more workers.
        output_throughput: Staple food buildings employ 1,250 per level (2026-10-05, Jan; camels a staple since 2026-10-07), same methods with more workers.
    pp_camel_stud_riding_strains:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Staple food buildings employ 1,250 per level (2026-10-05, Jan; camels a staple since 2026-10-07), same methods with more workers.
        output_throughput: Staple food buildings employ 1,250 per level (2026-10-05, Jan; camels a staple since 2026-10-07), same methods with more workers.
    pp_camel_stud_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_camel_stud_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
