footprint: urban_workshop
labour:
  class: craft_reformation
gate_method: pp_cannon_workshop_market_sales
building:
  key: cannon_workshop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_cannon_workshop_cannon_workshop_ammunition_stone_maintenance
    - pp_cannon_workshop_cannon_workshop_ammunition_lead_maintenance
    - pp_cannon_workshop_cannon_workshop_ammunition_iron_maintenance
  - name: slot_1
    methods:
    - pp_cannon_workshop_cannon_workshop_bronze_maintenance
    - pp_cannon_workshop_cannon_workshop_iron_maintenance
  - name: slot_2
    methods:
    - pp_cannon_workshop_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = 1125
    category = weapons_industry_category
    employment_size = 0.3
    obsolete = cannon_maker
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:cannon_workshop }
            add = {
                value = "market.market_price(goods:cannons)"
                multiply = 0.17600
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_cannon_workshop_cannon_workshop_ammunition_stone_maintenance = {
            stone = 0.096
            saltpeter = 0.096
            manual_labor = 0.033
            produced = cannons
            output = 0.08
            debug_max_profit = workshop_profit_margin
            category = workshop_input
