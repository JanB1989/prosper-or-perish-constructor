localization:
  entries:
    carrier_inn_slot_0: Road Network
    carrier_inn_slot_1: Carrier Crews
    carrier_inn: Carrier Inn
    carrier_inn_desc: Packhorses, carts and stable yards gather at the carrier inn before setting out along the roads. Its keepers turn scattered rural loads into regular traffic to the market.
    pp_carrier_inn_construction: Carrier Inn Construction
    pp_carrier_inn_maintenance: Pack Horses
    pp_carrier_inn_hand_porters: Hand Porters
    pp_carrier_inn_waybills_and_fitted_carts: Waybills and Fitted Carts
    pp_carrier_inn_logistics_network: Carrier Network
    pp_carrier_inn_logistics_network_desc: Regular carriers call at the inn on fixed days and take on loads, so some traffic keeps moving even when the inn's own stables stand empty.
icon:
  source_png: ../assets/icons/carrier_inn.png
  output_dds: carrier_inn.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a carrier inn, transparent background. Center a bold timber-and-stone roadside inn with a dark roof, stable arch, one large packhorse, and one covered cart. Make the land route unmistakable at low resolution with a broad tan road sweeping diagonally through the foreground; use strong silhouettes, high contrast, fewer tiny props, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Logistics buildings earn a thin wage in the floor-priced logistics good; their payoff is market access.
    input_throughput: Carrier inns keep animals, carts and provisions on the road for every level.
    output_throughput: The logistics good is a floor-priced wage; the real output is market access.
  production_methods:
    pp_carrier_inn_logistics_network:
      allow_rules:
        base_output_per_1k: "The logistics network method has no inputs on purpose: its slot always counts as supplied, so the building keeps part of its market access when it can buy nothing; its output is a floor-priced wage."
