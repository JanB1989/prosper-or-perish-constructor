localization:
  entries:
    cattle_farm: Cattle Farm
    cattle_farm_desc: Households graze cattle on common pasture and bring them in at night.
    cattle_farm_slot_0: Pastures
    cattle_farm_slot_1: Cultivation
    cattle_farm_slot_2: Provisioning
    pp_cattle_farm_base: Pastures
    pp_cattle_farm_no_cultivation: No Cultivation
    pp_cattle_farm_open_pasture: Open Pasture
    pp_cattle_farm_open_pasture_desc: Cattle graze the common land and salt licks keep them healthy.
    pp_cattle_farm_byres_yards: Byres and Yards
    pp_cattle_farm_byres_yards_desc: Byres and yards shelter the herd and gather its manure.
    pp_cattle_farm_provision: Provision with Livestock
    pp_cattle_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_cattle_farm_sell_surplus: Sell the Surplus
    pp_cattle_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
