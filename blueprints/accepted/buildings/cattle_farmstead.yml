localization:
  entries:
    cattle_farmstead: Cattle Farmstead
    cattle_farmstead_desc: Stall feeding and manure yards carry the herd through the lean months.
    cattle_farmstead_slot_0: Pastures
    cattle_farmstead_slot_1: Cultivation
    cattle_farmstead_slot_2: Provisioning
    pp_cattle_farmstead_base: Pastures
    pp_cattle_farmstead_no_cultivation: No Cultivation
    pp_cattle_farmstead_stall_feeding: Stall Feeding
    pp_cattle_farmstead_stall_feeding_desc: Cattle are fed in stalls on fodder and pulses.
    pp_cattle_farmstead_provision: Provision with Livestock
    pp_cattle_farmstead_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_cattle_farmstead_sell_surplus: Sell the Surplus
    pp_cattle_farmstead_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
