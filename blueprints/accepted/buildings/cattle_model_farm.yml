localization:
  entries:
    cattle_model_farm: Cattle Model Farm
    cattle_model_farm_desc: Selected breeding stock, dairies and fodder leys raise cattle on a larger managed farm.
    cattle_model_farm_slot_0: Pastures
    cattle_model_farm_slot_1: Cultivation
    cattle_model_farm_slot_2: Provisioning
    pp_cattle_model_farm_base: Pastures
    pp_cattle_model_farm_no_cultivation: No Cultivation
    pp_cattle_model_farm_dairy_breeding: Dairy and Breeding Herd
    pp_cattle_model_farm_dairy_breeding_desc: Selected bulls and planned dairies improve the herd.
    pp_cattle_model_farm_provision: Provision with Livestock
    pp_cattle_model_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_cattle_model_farm_sell_surplus: Sell the Surplus
    pp_cattle_model_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
