version: 2
tag: cattle_rotations
output_tag: cattle_farm_tier2
footprint: farm_land
labour:
  class: primary_reformation
  methods:
    pp_cattle_rotations_base: base
    pp_cattle_rotations_provision: keep
gate_method: pp_cattle_rotations_provision
upgrade_chain:
  family: cattle_farm
  tier: 2
  previous: cattle_farmstead
  next: cattle_model_farm
  unlock_advance: pp_farming_village_rotations
building:
  key: cattle_rotations
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_cattle_rotations_base
  - name: slot_1
    methods:
    - pp_cattle_rotations_no_cultivation
    - pp_cattle_rotations_ley_grazing
    - pp_cattle_rotations_transhumance
  - name: slot_2
    methods:
    - pp_cattle_rotations_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.10
    max_levels = farm_capacity_max_cattle_rotations
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = cattle_rotations
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = cattle_farmstead
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_cattle_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:livestock)"
                divide = "default_price(goods:livestock)"
                multiply = { value = 1 add = modifier:local_livestock_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_cattle_rotations_base = {
            manual_labor = 0.021
            produced = livestock
            output = 0.07
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_cattle_rotations_no_cultivation = {
            category = building_maintenance
        }
        pp_cattle_rotations_ley_grazing = {
            tools = 0.13
            horses = 0.089
            legumes = 0.29
            lumber = 0.079
            manual_labor = 0.16
            produced = livestock
            output = 0.97
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_cattle_rotations_transhumance = {
            horses = 0.11
            salt = 0.053
            tools = 0.089
            livestock = 0.17
            manual_labor = 0.13
            produced = livestock
            output = 0.97
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_cattle_rotations_provision = {
            livestock = 0.008
            produced = local_food
            output = 1.75
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_cattle_rotations = -1
      local_population_capacity = -2
    }

    modifier = {
        local_pp_farm_levels = 1
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.021
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_wheat_output_modifier = 0.01
        local_millet_output_modifier = 0.01
        local_maize_output_modifier = 0.01
        local_potato_output_modifier = 0.01
    }
localization:
  entries:
    cattle_rotations: Cattle Ley Farm
    cattle_rotations_desc: Sown leys and fodder crops let the herd graze fields that rest from grain.
    cattle_rotations_slot_0: Pastures
    cattle_rotations_slot_1: Cultivation
    cattle_rotations_slot_2: Provisioning
    pp_cattle_rotations_base: Pastures
    pp_cattle_rotations_no_cultivation: No Cultivation
    pp_cattle_rotations_ley_grazing: Ley Grazing
    pp_cattle_rotations_ley_grazing_desc: Cattle graze sown leys on fields resting from grain.
    pp_cattle_rotations_transhumance: Transhumance Drove
    pp_cattle_rotations_transhumance_desc: Drovers move the herd between summer and winter pastures.
    pp_cattle_rotations_provision: Provision with Livestock
    pp_cattle_rotations_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/cattle_rotations.png
  output_dds: cattle_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_cattle_rotations_base:
      production_efficiency: 1.0
    pp_cattle_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_cattle_rotations_ley_grazing:
      production_efficiency: 1.0
    pp_cattle_rotations_transhumance:
      production_efficiency: 1.0
    pp_cattle_rotations_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
