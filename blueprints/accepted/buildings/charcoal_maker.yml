localization:
  entries:
    charcoal_maker: Charcoal Clamp
    charcoal_maker_desc: Earth-covered clamps turn coppice poles and cordwood into charcoal for hearths and forges. Colliers seal each burn with clay and turf while dedicated mines handle true coal seams.
    pp_char_coal_maintenance: Earth Clamp Burning
    pp_charcoal_maker_market_sales: Market Sales
    pp_charcoal_maker_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    charcoal_maker_slot_1: Market

evaluation:
  allow_rules:
    profit_percent: Charcoal is intentionally kept to low margins so wood-fuel fallback production does not compete with true coal seams.
    input_throughput: Charcoal is intentionally below industrial throughput as a constrained local wood-fuel fallback.
    output_throughput: Charcoal is intentionally below industrial throughput as a constrained local wood-fuel fallback.
  production_methods:
    pp_char_coal_maintenance:
      production_efficiency: 1.05
    pp_charcoal_maker_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
