localization:
  entries:
    charcoal_maker: Charcoal Clamp
    charcoal_maker_desc: Earth-covered clamps and simple kilns turn coppiced wood into charcoal for hearths and forges. These wood-fuel yards are kept separate from true coal seams, where mined coal is worked by dedicated drifts.
    pp_char_coal_maintenance: Clamp Burning

