localization:
  entries:
    charcoal_maker: Charcoal Clamp
    charcoal_maker_desc: Earth-covered clamps turn coppice poles and cordwood into charcoal for hearths and forges. Colliers seal each burn with clay and turf while dedicated mines handle true coal seams.
    pp_char_coal_maintenance: Earth Clamp Burning
    pp_char_coal_maintenance_desc: "Colliers stack coppice poles around a central flue, cover the pile with turf and earth, and let it smoulder for days. Watched day and night, the wood chars slowly into charcoal for smiths and furnaces."
    pp_charcoal_maker_market_sales: Market Sales
    pp_charcoal_maker_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    charcoal_maker_slot_0: Peat Bog
    charcoal_maker_slot_1: Charcoal Burning
    charcoal_maker_slot_2: Market
    pp_charcoal_maker_no_peat_cutting: No Peat Cutting
    pp_charcoal_maker_no_peat_cutting_desc: "No peat is cut here, the colliers burn wood alone."
    pp_charcoal_maker_peat_cutting: Peat Cutting
    pp_charcoal_maker_peat_cutting_desc: "Colliers cut turf from the bog, stack it to dry and burn it beside their clamps, a fuel won without felling a tree. Only where the [location|e] has [ShowModifier('pp_wb_soil_peat')]."

evaluation:
  allow_rules:
    profit_percent: Charcoal is intentionally kept to low margins so wood-fuel fallback production does not compete with true coal seams.
    input_throughput: Charcoal is intentionally below industrial throughput as a constrained local wood-fuel fallback.
    output_throughput: Charcoal is intentionally below industrial throughput as a constrained local wood-fuel fallback.
  production_methods:
    pp_char_coal_maintenance:
      production_efficiency: 1.05
    pp_charcoal_maker_no_peat_cutting:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Empty selector method intentionally leaves charcoal output unchanged off peat soil.
    pp_charcoal_maker_peat_cutting:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Peat cutting is a small add-on on peat soil only, deliberately below the full-building throughput.
        output_throughput: Peat cutting is a small add-on on peat soil only, deliberately below the full-building throughput.
        base_output_per_1k: Peat cutting is a labour-only add-on on peat soil only (a quarter of the clamp charcoal, a little more in the retort), not a base yield.
    pp_charcoal_maker_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
