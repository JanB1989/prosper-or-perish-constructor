  entries:
    clay_washmill_slot_0: Clay Beds
    clay_washmill_slot_1: Clay Preparation
    clay_washmill_slot_2: Clay Refining
    clay_washmill: Clay Washmill
    clay_washmill_desc: Horse- or ox-driven pugmills turn clay inside brick-lined wash pits, mixing dug clay with water before it settles into a more regular body for brick, tile, and pottery work. Levigation ponds skim finer clay from the slurry while coarse grit settles out.
    pp_clay_washmill_base_clay: Surveyed Clay Beds
    pp_clay_washmill_no_preparation: No Clay Preparation
    pp_clay_washmill_horse_pugging: Horse Pugmill
    pp_clay_washmill_ox_pugging: Ox Pugmill
    pp_clay_washmill_no_refining: No Clay Refining
    pp_clay_washmill_levigation_ponds: Levigation Ponds
    pp_clay_washmill: Clay Washmills
    pp_clay_washmill_desc: Brick-lined wash pits, settling ponds, and horse- or ox-driven pugmills prepare more consistent clay for ceramic trades.
icon:
  source_png: ../assets/icons/clay_washmill.png
  output_dds: clay_washmill.dds
  size: 512
  prompt: >-
    EU5-inspired hand-painted strategy-game icon for Clay Washmill, transparent background.
    Center a compact historical horse-powered pugmill with a circular brick-lined wash pit,
    upright wooden pugmill barrel, central vertical shaft, long horse-yoke beam, small horse
    silhouette, wet clay slurry, red clay heap, barrow, and shovel. Large readable 2D icon
    cluster filling most of the canvas, warm clay reds and ochres, tan brick, dark weathered
    wood, muted blue water, no text, no letters, no frame, no modern machinery, not
    photorealistic, not cartoonish.

