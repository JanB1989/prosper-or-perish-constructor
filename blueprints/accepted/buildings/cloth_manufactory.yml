  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 1080
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    obsolete = cloth_workshop
    build_time = manufactory_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:cloth_manufactory }
            add = {
                value = "market.market_price(goods:cloth)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_cloth_manufactory_wool_cloth_manufactory_maintenance = {
            wool = 1.85
            dyes = 0.17
            manual_labor = 0.4
            produced = cloth
            output = 1.6
            category = guild_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_cloth_manufactory_cotton_cloth_manufactory_maintenance = {
            produced = cloth
            output = 1.6
            cotton = 1.54
            dyes = 0.17
            manual_labor = 0.41
            category = guild_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_cloth_manufactory_fiber_crops_cloth_manufactory_maintenance = {
