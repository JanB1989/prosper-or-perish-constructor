version: 2
tag: cloth_workshop
footprint: urban_workshop
labour:
  class: craft_reformation
gate_method: pp_cloth_workshop_market_sales
building:
  key: cloth_workshop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_cloth_workshop_fiber_crops_cloth_workshop_maintenance
    - pp_cloth_workshop_cotton_cloth_workshop_maintenance
    - pp_cloth_workshop_wool_cloth_workshop_maintenance
  - name: slot_1
    methods:
    - pp_cloth_workshop_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = 112
    category = consumer_goods_category
    employment_size = 0.3
    obsolete = cloth_guild
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:cloth_workshop }
            add = {
                value = "market.market_price(goods:cloth)"
                multiply = 0.17600
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_cloth_workshop_fiber_crops_cloth_workshop_maintenance = {
            fiber_crops = 1.1
            manual_labor = 0.24
            produced = cloth
            output = 0.72
            category = workshop_input
            debug_max_profit = workshop_profit_margin
        }
        pp_cloth_workshop_cotton_cloth_workshop_maintenance = {
            cotton = 0.91
            manual_labor = 0.31
            produced = cloth
            output = 0.88
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_cloth_workshop_wool_cloth_workshop_maintenance = {
            wool = 1.09
            manual_labor = 0.31
            produced = cloth
            output = 0.88
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_cloth_workshop_market_sales = {
            offset = 0.012
            produced = cloth
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = workshop_construction
    custom_tags = {
        workshop
    }
    modifier = {}
    increase_per_level_cost = 0.19
localization:
  entries:
    cloth_workshop_slot_0: Cloth Workshop Work
    pp_cloth_workshop_cotton_cloth_workshop_maintenance: Cloth Workshop Cotton Cloth Workshop Maintenance
    pp_cloth_workshop_wool_cloth_workshop_maintenance: Cloth Workshop Wool Cloth Workshop Maintenance
    pp_cloth_workshop_fiber_crops_cloth_workshop_maintenance: Cloth Workshop Fiber Crops Cloth Workshop Maintenance
    pp_cloth_workshop_market_sales: Market Sales
    pp_cloth_workshop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    cloth_workshop_slot_1: Market
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_cloth_workshop_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
