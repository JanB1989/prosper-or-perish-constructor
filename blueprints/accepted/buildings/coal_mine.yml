        profit_percent: Fireclay is an ancillary coal seam byproduct, intentionally less profitable than primary coal extraction.
        input_throughput: Fireclay is an ancillary coal seam byproduct, intentionally less profitable than primary coal extraction.
        output_throughput: Fireclay is an ancillary coal seam byproduct, intentionally less profitable than primary coal extraction.
