    pp_coal_mine_bell_pits:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Bell pits dig shallow seams by hand and windlass instead of with iron tools; a labour-heavy fallback for tool shortages, less productive than the main workings.
        input_throughput: Bell pits dig shallow seams by hand and windlass instead of with iron tools; a labour-heavy fallback for tool shortages, less productive than the main workings.
        output_throughput: Bell pits dig shallow seams by hand and windlass instead of with iron tools; a labour-heavy fallback for tool shortages, less productive than the main workings.
        amortization_months: Bell pits dig shallow seams by hand and windlass instead of with iron tools; a labour-heavy fallback for tool shortages, less productive than the main workings.
    pp_coal_mine_no_secondary:
      production_efficiency: 1.00
    pp_coal_mine_fireclay:
