localization:
  entries:
    coastal_shipping_office_slot_0: Coastal Network
    coastal_shipping_office_slot_1: Coastal Crews
    coastal_shipping_office: Coastal Shipping Office
    coastal_shipping_office_desc: Coasting masters, freight clerks and hired hands keep short-sea traffic moving between nearby ports. Their office turns loose cargo, small craft and quay labour into a steady coastal trade.
    pp_coastal_shipping_office_construction: Coastal Shipping Office Construction
    pp_coastal_shipping_office_maintenance: Coasting Crews
    pp_coastal_shipping_office_hand_crews: Hand Crews
    pp_coastal_shipping_office_rigged_coasters: Rigged Coasters
    pp_coastal_shipping_office_logistics_network: Coastal Pilots
    pp_coastal_shipping_office_logistics_network_desc: Local pilots and harbour masters bring passing coasters in and out, so some trade keeps moving along the coast even when the office's own ships lie idle.
icon:
  source_png: ../assets/icons/coastal_shipping_office.png
  output_dds: coastal_shipping_office.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a coastal shipping office, transparent background. Center a stone-and-timber shipping office on a quay with tar barrels, sailcloth, crates, a short pier, and one simple coasting vessel with a pale sail. Make the coast unmistakable at low resolution with a large blue sea shape and curved tan shoreline in the lower half; no river, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Logistics buildings earn a thin wage in the floor-priced logistics good; their payoff is market access.
    input_throughput: Coastal shipping offices keep coasters, tar, timber, victuals and quay crews working for every level.
    output_throughput: The logistics good is a floor-priced wage; the real output is market access.
  production_methods:
    pp_coastal_shipping_office_logistics_network:
      allow_rules:
        base_output_per_1k: "The logistics network method has no inputs on purpose: its slot always counts as supplied, so the building keeps part of its market access when it can buy nothing; its output is a floor-priced wage."
