localization:
  entries:
    MODIFIER_TYPE_DESC_pp_coastal_shipping_office_price_cost_modifier: Affects the cost of building a [ShowBuildingTypeName('coastal_shipping_office')|e].
    MODIFIER_TYPE_NAME_pp_coastal_shipping_office_price_cost_modifier: Coastal Shipping Office Cost
    coastal_shipping_office: Coastal Shipping Office
    coastal_shipping_office_desc: Coasting masters, freight clerks, and hired hands keep short-sea traffic moving between nearby ports. Their office turns loose cargo, small craft, and quay labor into a steadier coastal trade.
    pp_coastal_shipping_office_construction: Coastal Shipping Office Construction
    pp_coastal_shipping_office_maintenance: Coastal Shipping Office Maintenance
    pp_coastal_shipping_office_price: Coastal Shipping Office Price
icon:
  source_png: ../assets/icons/coastal_shipping_office.png
  output_dds: coastal_shipping_office.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a coastal shipping office, transparent background. Center a stone-and-timber shipping office on a quay with tar barrels, sailcloth, crates, a short pier, and one simple coasting vessel with a pale sail. Make the coast unmistakable at low resolution with a large blue sea shape and curved tan shoreline in the lower half; no river, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Maintenance-only logistics infrastructure consumes supplies while its payoff is carried by location modifiers.
    input_throughput: Coastal shipping offices intentionally keep modest labor but costly coasting, tar, timber, victual, and paper upkeep.
    output_throughput: Coastal shipping offices provide market access and building support rather than direct goods output.
