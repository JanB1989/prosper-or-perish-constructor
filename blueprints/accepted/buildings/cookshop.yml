  body: |2-
    	is_foreign = no
    # Non-raw producer with its own price key: 40 gold and a normal level cost since 2026-10-01 (was 75 gold and the
    # triple urbanisation-brake cost 0.39).
    # Farm reward (2026-10-03, Jan): one level per 5 standing staple food levels in the province (cookshop_max_level, counted in raw_modifier since 2026-10-03:
    # farms and orchards, and since 2026-10-03 fisheries, flocks, hunting forests and palm groves through
    # local_pp_staple_levels), about five
    # farm levels' throughput per level. Its recipes buy a little staple and drink and sell meals for offset at a thin
    # margin (dish 1.08, drink 1.2, at any store); its food is the flat local_monthly_food in its modifier, which
    # follows staffing and the inputs it gets, not the store.
    increase_per_level_cost = 0.13
    price = pp_cookshop_price
    	max_levels = cookshop_max_level
    	pop_type = laborers
    	employment_size = 1
    	category = consumer_goods_category
    	custom_tags = { pp_food_security_priority pp_direct_food_priority }
    	icon = cookshop
    	rural_settlement = yes
    	town = yes
    	city = yes
    	megalopolis = yes
    	# towns and up, or the province capital (2026-10-03, as the Public Kitchen). An allow, not a location_potential:
    	# a rank change would delete the building
    	allow = {
    		OR = {
    			NOT = { location_rank = location_rank:rural_settlement }
    			is_province_capital = yes
    		}
    	}
    	# AI (2026-10-03, farm reward): build them up to the cap wherever the farms allow, store or not. The AI values
    	# their food only while the province loses food, so elsewhere this positive weight carries them past their cost;
    	# more farms in the province weigh more. Divided by the owner's income like the farm weight (the AI's scores run
    	# about 30x higher in poor countries than in rich ones).
    	ai_construct_weight = {
    		value = 20
    		add = { value = pp_location_province_farm_levels divide = 40 max = 1 multiply = 40 }
    		divide = { value = scope:owner.monthly_income_total add = 10 }
    	}
    	build_time = workshop_build_time
    	construction_demand = workshop_construction
    	ai_forbid_shutdown = no
    	forbidden_for_estates = no
    	important_for_AI = yes
    	AI_ignore_available_worker_flag = yes
    	can_close = yes
