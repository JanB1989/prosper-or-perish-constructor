  possible_production_methods: []
  body: |2-
    	is_foreign = no
    # Non-raw producer with its own price key: 40 gold and a normal level cost since 2026-10-01 (was 75 gold and the
    # triple urbanisation-brake cost 0.39): the Cookshop is the answer to hunger outside the Tavern's towns, and it
    # pulls staple goods off the market.
    increase_per_level_cost = 0.13
    price = pp_cookshop_price
    	max_levels = cookshop_max_level
    	pop_type = laborers
    	employment_size = 1
    	category = consumer_goods_category
    	custom_tags = { pp_food_security_priority pp_direct_food_priority }
    	icon = cookshop
    	rural_settlement = yes
    	town = yes
    	city = yes
    	megalopolis = yes
    	# towns and up, or the province capital (2026-10-03, as the Public Kitchen). An allow, not a location_potential:
    	# a rank change would delete the building
    	allow = {
    		OR = {
    			NOT = { location_rank = location_rank:rural_settlement }
    			is_province_capital = yes
    		}
    	}
    	# AI (2026-10-03): Cookshops answer hunger. A province that holds about a year of food or more must not get more of
    	# them: their food would go to waste, and below their stop point the gate alone does not hold where staples are
    	# cheap. Farms around make a Cookshop more useful (staples close by). Divided by the owner's income like the farm
    	# weight (the AI's scores run about 30x higher in poor countries than in rich ones).
    	ai_construct_weight = {
    		value = 0
    		add = { value = 10 subtract = pp_location_stored_months divide = 10 min = 0 max = 1 multiply = 60 }
    		add = { value = pp_location_province_farm_levels divide = 40 max = 1 multiply = 40 }
    		divide = { value = scope:owner.monthly_income_total add = 10 }
    		# the veto is flat, not income-scaled: the AI scored Cookshops at 14-18 months up to about 100 and in hungry
    		# provinces up to about 400 (Mini World run 2026-10-03), so it has to outweigh any of that
    		subtract = { value = pp_location_stored_months subtract = 10 divide = 4 min = 0 max = 1 multiply = 10000 }
    	}
    	build_time = workshop_build_time
    	construction_demand = workshop_construction
    	ai_forbid_shutdown = no
    	forbidden_for_estates = no
    	important_for_AI = yes
    	AI_ignore_available_worker_flag = yes
    	can_close = yes
    	# ==========================================
    	# 2. TABLE BEVERAGES (pick ONE), served as Province Food
    	# - Baseline: well water (no trade goods; EU5 has no water good)
    	# - Upgrades: one drink good each (weights sum prior two-input recipes for similar cost)
    	# ==========================================
    	unique_production_methods = {
    		pp_cookshop_well_water = {
    			category = building_maintenance
    		}
    		pp_cookshop_coffee = {
