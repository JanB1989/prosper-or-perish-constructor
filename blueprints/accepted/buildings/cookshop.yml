evaluation:
  allow_rules:
    input_throughput: Farm reward (2026-10-03, Jan) - small on purpose, about five farm levels of throughput per level; the food is the flat modifier food.
    output_throughput: Farm reward (2026-10-03, Jan) - the meals sell for offset at a thin margin; the food is the flat modifier food.
    amortization_months: Thin fixed margins (dish 1.08, drink 1.2) so the kitchen is no money maker; the AI builds it by its construct weight.
    base_output_per_1k: Well Water is the always-available gate method (a little labour for offset at margin 1.2), not a production line.
