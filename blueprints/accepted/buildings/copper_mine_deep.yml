localization:
  entries:
    copper_mine_deep_slot_0: Copper Lode
    copper_mine_deep_slot_1: Ore Parting
    copper_mine_deep_slot_2: Deep Copper Workings
    copper_mine_deep_slot_3: Market
    copper_mine_deep: Deep Copper Works
    copper_mine_deep_desc: Drained shafts, horse whims, and coal-fired reverberatory furnaces let copper districts work deeper lodes and smelt poorer ores at the mine. Silver-bearing, gold-bearing, and tin-bearing stones are parted where the lode allows.
    pp_copper_mine_deep_base_copper: Surveyed Deep Copper Lode
    pp_copper_mine_deep_no_secondary: No Secondary Output
    pp_copper_mine_deep_silver: Liquation Parting
    pp_copper_mine_deep_gold: Auriferous Parting
    pp_copper_mine_deep_tin: Tin Lode Parting
    pp_copper_mine_deep_no_primary: No Deep Copper Workings
    pp_copper_mine_deep_horse_whim_hoisting: Horse-Whim Hoisting
    pp_copper_mine_deep_drained_shafts: Drained Shaft Workings
    pp_copper_mine_deep_reverberatory_smelting: Reverberatory Smelting
    pp_copper_mine_deep_market_sales: Market Sales
    pp_copper_mine_deep_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    pp_reverberatory_copper: Reverberatory Copper Smelting
    pp_reverberatory_copper_desc: Coal-fired reverberatory furnaces and deep drainage shafts let copper districts smelt poorer ores at the mine and keep the founders supplied.
