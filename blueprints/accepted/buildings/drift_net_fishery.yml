  size: 512
  prompt: EU5-inspired hand-painted strategy-game building icon for a Drift-Net Fishery on a perfectly flat magenta chroma-key background (#ff00ff). Center a compact coastal fishery with small open wooden boats, large hemp drift nets, cloth sail patches, salt sacks, barrels, fish baskets, and a modest shore landing. Use detailed historic bitmap cutout style, material-rich painterly brushwork, three-quarter view, readable maritime props, muted sea blues, tan nets, silver fish, weathered wood, no text, no frame, no modern trawler, no scenic landscape.

evaluation:
  production_methods:
    pp_drift_net_fishery_base_catch:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Passive coastal-water methods have little direct input cost; coastal drift nets carry the tier economy.
        amortization_months: Successor fishery keeps the same free coastal-water selection output while the worked method carries the tier economy.
        input_throughput: Passive coastal water output intentionally stays below full-building throughput.
        output_throughput: Passive coastal water output intentionally stays below full-building throughput.
    pp_drift_net_fishery_no_coastal_gear:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally produces no coastal gear output.
    pp_drift_net_fishery_coastal_drift_nets:
      production_efficiency: 1.05
      allow_rules:
        profit_percent: Coastal drift nets are accepted above the generic margin band as the worked successor fishery method.
        input_throughput: Drift-net fisheries keep a lower gear profile than offshore herring busses.
        output_throughput: Drift-net fisheries remain below the offshore herring-buss tier.
    pp_drift_net_fishery_no_worker_victuals:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally produces no household victuals.
    pp_drift_net_fishery_worker_victuals:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Household victuals are auxiliary worker food, not a standalone profit method.
        base_output_per_1k: Auxiliary worker victuals are sized from configured worker food need rather than the global no-input output band.
