version: 2
tag: elephant_hunting_grounds
footprint: farm_land
labour:
  class: primary_medieval
gate_method: pp_elephant_hunting_grounds_market_sales
building:
  key: elephant_hunting_grounds
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_elephant_hunting_grounds_elephant_hunting_grounds_maintenance
  - name: slot_1
    methods:
    - pp_elephant_hunting_grounds_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 1
    is_foreign = no
    # a land farm (herd land, 2026-10-27, Jan): free arable land sets the cap, Ori's flag still adds two levels
    max_levels = {
        value = farm_capacity_max_elephant_hunting_grounds
        if = {
            limit = {
                owner ?= {
                    has_variable = ori_double_elephant_hunting_ground_level_flag
                }
            }
            add = {
                desc = INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND
                value = 2
            }
        }
    }
    startup_ramp_target = rural_startup_ramp_target
    pop_type = peasants
    category = rgo_building_category
    employment_size = 1.0
    custom_tags = { farming_capacity }
    rural_settlement = yes
    country_potential = {
        produced_in_country:elephants > 0
    }
    location_potential = {
        raw_material = goods:elephants
    }
    build_time = rural_build_time
    unique_production_methods = {
        pp_elephant_hunting_grounds_elephant_hunting_grounds_maintenance = {
            produced = ivory
            output = 1.0
            tools = 0.12 # tusk saws and skinning knives: a small running cost
            weaponry = 0.2
            elephants = 0.4
            livestock = 0.17 # pack oxen and camp provisions for the hunting parties
            manual_labor = 0.74
            debug_max_profit = rural_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_elephant_hunting_grounds_market_sales = {
            offset = 0.012
            produced = ivory
            output = 0.003
            category = building_maintenance
        }
    }
    raw_modifier = {
      local_nobles_desired_pop = 0.01
      pp_levels_elephant_hunting_grounds = 1
      local_population_capacity = -2
    }
    construction_demand = village_construction
    increase_per_level_cost = 0.16
localization:
  entries:
    elephant_hunting_grounds_slot_0: '[ShowBuildingTypeName(''elephant_hunting_grounds'')|e] Work'
    pp_elephant_hunting_grounds_elephant_hunting_grounds_maintenance: Elephant Hunting
    elephant_hunting_grounds_slot_1: Market
    pp_elephant_hunting_grounds_market_sales: Market Sales
    pp_elephant_hunting_grounds_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_elephant_hunting_grounds_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
