version: 2
tag: eng_royal_forest
footprint: land_reserve
labour:
  class: primary_medieval
  methods:
    pp_eng_royal_forest_provision: keep
gate_method: pp_eng_royal_forest_market_sales
building:
  key: eng_royal_forest
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_eng_royal_forest_eng_royal_forest_maintenance
  - name: slot_1
    methods:
    - pp_eng_royal_forest_provision
  - name: slot_2
    methods:
    - pp_eng_royal_forest_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_special = yes
    is_foreign = no
    max_levels = 1
    startup_ramp_target = rural_startup_ramp_target
    pop_type = peasants
    forbidden_for_estates = yes
    category = government_category
    employment_size = 1.0
    # a staple food maker (2026-10-04): staffed with the farms and fisheries (pp_employment_priority.txt)
    custom_tags = { pp_food_security_priority pp_staple_food_priority }
    rural_settlement = yes
    country_potential = {
        has_or_had_tag = ENG
    }
    location_potential = {
        is_core_of = scope:actor
        development < 20
        NOR = {
            vegetation = farmland
        }
    }
    allow = {}
    # the AI answers a low province store (pp_food_urgency_weight, flat)
    ai_construct_weight = {
        value = 0
        add = pp_food_urgency_weight
    }
    build_time = rural_build_time
    expensive = yes
    allow_wrong_startup = yes
    unique_production_methods = {
        pp_eng_royal_forest_eng_royal_forest_maintenance = {
            produced = wild_game
            output = 1.0
            weaponry = 0.095
            wine = 0.095
            horses = 0.095
            manual_labor = 0.17
            debug_max_profit = rural_profit_margin
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_eng_royal_forest_provision = {
            wild_game = 0.08
            produced = local_food
            output = 0.96
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_eng_royal_forest_market_sales = {
            offset = 0.01
            produced = wild_game
            output = 0.01
            category = building_maintenance
        }
    }
    construction_demand = village_construction
    raw_modifier = {
      local_pp_staple_levels = 1  # counts toward the province's Cookshop cap like a farm level (a staple food maker)
    }

    modifier = {
        local_monthly_food = 1.5
        local_crown_estate_power = 0.5
        local_max_control = 0.05
        local_monthly_development_modifier = -0.1
        cannot_upgrade_location = yes
    }
    increase_per_level_cost = 0.23
localization:
  entries:
    eng_royal_forest_slot_0: Eng Royal Forest Work
    eng_royal_forest_slot_1: Provisioning
    eng_royal_forest_slot_2: Market
    pp_eng_royal_forest_provision: Provision with Game
    pp_eng_royal_forest_provision_desc: The household buys its own game back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_eng_royal_forest_eng_royal_forest_maintenance: Eng Royal Forest Eng Royal Forest Maintenance
    pp_eng_royal_forest_market_sales: Market Sales
    pp_eng_royal_forest_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_eng_royal_forest_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_eng_royal_forest_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
