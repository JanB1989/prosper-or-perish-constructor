  prompt: EU5-inspired hand-painted strategy-game icon for a Fiber Dressing Yard, transparent background. Center clay-lined retting pits with bundled flax or hemp stalks, drying fiber bundles, scutching boards, hackles, ceramic crocks, and a small charcoal brazier. Use readable painterly historical UI art, straw tan, fiber cream, earthen clay browns, muted charcoal black, no text, no frame, no modern machinery, no factory.

