  body: '{gold = 50}'
icon:
  source_png: ../assets/icons/field_management.png
  output_dds: field_management.dds
  size: 512
  prompt: 'Use case: historical-scene. Create one finished EU5-style building icon for FIELD MANAGEMENT. Material-rich realistic painterly historic bitmap cutout, three-quarter elevated view, matching the weathered timber, earthy materials and detailed miniature realism of Europa Universalis building icons. A compact isolated agricultural worksite: three broad adjacent strips showing crop rotation, golden ripe grain at back, rich green low crops in middle, dark freshly ploughed parallel furrows prominently in front. A substantial recognizable wooden mouldboard plough and a small two-wheeled wooden manure cart beside the furrows, short low dry-stone field boundary. Strong simple silhouette and big coherent color masses, deliberately readable at 48 and 64 pixels. Crops and plough are primary, no large house. Ground is a compact irregular thin patch, not a thick floating block. Entire subject within frame with narrow margin, fills 88% of square canvas. Warm side lighting, crisp focal forms, rich natural ochre earth and green colors. Perfectly flat solid pure magenta #FF00FF background for chroma key removal, including all gaps; no background shadow or magenta bounce. No sky, scenic backdrop, text, lettering, frame, symbols, modern equipment, rice paddies, stumps, cut timber or forest clearance. Produce 1024x1024.'
evaluation:
  production_methods:
    pp_field_management_maintenance:
      allow_rules:
        profit_percent: Land clearance is capacity infrastructure whose payoff is carried by location modifiers.
        input_throughput: Clearing crews provide light ongoing maintenance rather than full worked production.
        output_throughput: Land clearance provides capacity rather than a directly traded good.
