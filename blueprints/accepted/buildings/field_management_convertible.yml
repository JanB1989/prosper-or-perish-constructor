localization:
  entries:
    field_management_convertible: Convertible Husbandry
    field_management_convertible_desc: Fields alternate between grain and several years of grass and clover leys grazed by stock, so the land rests, is manured where it lies and returns heavier crops. Building it converts a level of Field Management.
    field_management_convertible_slot_0: Maintenance
    pp_field_management_convertible_leys: Clover and Grass Leys
    pp_field_management_convertible_stall_manure: Stall-Fed Manuring
    pp_field_management_convertible_marling: Marl Pits
    pp_field_management_convertible_price: Convertible Husbandry Price
    pp_field_management_convertible: Convertible Husbandry
    pp_field_management_convertible_desc: Alternating arable and ley pasture on the same fields keeps the soil in heart and lets more people live from the land already under the plough.
