icon:
  source_png: ../assets/icons/field_management_convertible.png
  output_dds: field_management_convertible.dds
  size: 512
  prompt: 'Use case: historical-scene. Generate one finished square 1024x1024 Europa Universalis-style building icon for CONVERTIBLE HUSBANDRY, sixteenth century. Match the reference images'' material-rich realistic painterly historic bitmap cutout style, detailed weathered wood, earthy materials, warm side lighting and elevated three-quarter perspective. Reference 1 is the approved style example; reference 2 is the earlier agricultural tier to form a family with, but create clearly different composition. Compact isolated agricultural worksite with lush green clover ley as dominant foreground mass, two clearly recognizable brown-and-white cattle grazing, golden cereal strip behind, small open-front weathered timber cattle shelter with thatched roof at rear right, wattle hurdle and modest manure cart beside the shelter. Cattle, clover and shelter form bold readable silhouettes at 48px. Thin irregular patch of earth, no floating block. Entire subject within frame, fills 88 percent with margin. Perfectly flat pure magenta #FF00FF chroma-key background in every gap, no magenta bounce or background shadows. No sky, landscape backdrop, text, labels, border, symbols, modern machinery. Produce only this single icon.'
