localization:
  entries:
    field_management_improved: Improved Husbandry
    field_management_improved_desc: Turnips and clover take the place of the fallow in a fixed rotation, seed is drilled in rows and hoed by horse, and the stock kept on the fodder manures every field in turn. Building it converts a level of Convertible Husbandry.
    field_management_improved_slot_0: Maintenance
    pp_field_management_improved_four_course: Four-Course Rotation
    pp_field_management_improved_drill: Drill and Horse-Hoe
    pp_field_management_improved_liming: Lime Kilns and Marl
    pp_field_management_improved_price: Improved Husbandry Price
    pp_field_management_improved: Improved Husbandry
    pp_field_management_improved_desc: Fodder crops in place of fallow, drilled seed and planned rotations let the same fields feed far more people than the old open-field routine.
