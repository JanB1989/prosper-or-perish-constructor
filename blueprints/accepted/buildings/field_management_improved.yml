icon:
  source_png: ../assets/icons/field_management_improved.png
  output_dds: field_management_improved.dds
  size: 512
  prompt: 'Use case: historical-scene. Generate one finished square 1024x1024 Europa Universalis-style building icon for IMPROVED HUSBANDRY, early eighteenth century. Reference 1 defines the approved material-rich realistic painterly historic bitmap cutout style; reference 2 shows the earlier agricultural tier. Create a clearly distinctive advanced worksite in this same family. Elevated three-quarter view, warm side lighting, weathered wood and rich earth. Large recognizable period wooden horse-drawn seed drill in foreground: wooden seed hopper, two large spoked wheels and a row of iron sowing coulters, long wooden shafts resting on earth, no horse needed. Behind it four compact orderly crop strips showing golden wheat, pale green leafy turnips, barley and lush dark green clover. Small squat rustic stone lime kiln at rear left with dark arched firing opening and a little pale limestone pile; low clipped hedge along rear edge. Machinery and kiln give strong readable silhouettes at 48px. Compact isolated thin irregular ground patch, no floating block. Subject entirely within frame, fills 88 percent with margin. Flat pure magenta #FF00FF chroma-key background in every gap, no magenta bounce or background shadow. No sky, scenic backdrop, text, border, emblems, tractor, engine, modern machinery. Produce only this single icon.'
