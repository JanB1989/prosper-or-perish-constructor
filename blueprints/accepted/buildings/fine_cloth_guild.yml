version: 2
tag: fine_cloth_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_fine_cloth_guild_market_sales
building:
  key: fine_cloth_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_fine_cloth_guild_standard_fine_cloth_guild_maintenance
    - pp_fine_cloth_guild_alum_fine_cloth_guild_maintenance
    - pp_fine_cloth_guild_fur_trim_guild_maintenance
  - name: slot_1
    methods:
    - pp_fine_cloth_guild_fine_cloth_guild_maintenance
    - pp_fine_cloth_guild_wool_weavers_maintenance
    - pp_fine_cloth_guild_spanish_cloth_maintenance
    - pp_fine_cloth_guild_silk_weavers_maintenance
  - name: slot_2
    methods:
    - pp_fine_cloth_guild_market_sales
  possible_production_methods: []
  body: |
    is_foreign = no
    pop_type = burghers
    max_levels = fine_cloth_guild_max_level
    startup_ramp_target = 120
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:fine_cloth_guild }
            add = {
                value = "market.market_price(goods:fine_cloth)"
                multiply = 0.11200
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_fine_cloth_guild_standard_fine_cloth_guild_maintenance = {
            produced = fine_cloth
            dyes = 0.12
            manual_labor = 0.084
            output = 0.08
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_fine_cloth_guild_alum_fine_cloth_guild_maintenance = {
            alum = 0.052
            dyes = 0.21
            manual_labor = 0.17
            produced = fine_cloth
            output = 0.16
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_fine_cloth_guild_fur_trim_guild_maintenance = {
            fur = 0.5
            manual_labor = 0.16
            produced = fine_cloth
            output = 0.16
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_fine_cloth_guild_fine_cloth_guild_maintenance = {
            cloth = 0.85
            manual_labor = 0.41
            produced = fine_cloth
            output = 0.4
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_fine_cloth_guild_wool_weavers_maintenance = {
            wool = 1.02
            manual_labor = 0.42
            produced = fine_cloth
            output = 0.4
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_fine_cloth_guild_spanish_cloth_maintenance = {
            allow = {
                custom_tooltip = {
                    text = has_unlocked_spanish_cloth_industry
                    has_variable = spanish_cloth_industry
                }
            }
            wool = 1.02
            manual_labor = 0.42
            produced = fine_cloth
            output = 0.4
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_fine_cloth_guild_silk_weavers_maintenance = {
            silk = 0.9
            manual_labor = 0.56
            produced = fine_cloth
            output = 0.56
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_fine_cloth_guild_market_sales = {
            offset = 0.012
            produced = fine_cloth
            output = 0.002
            category = building_maintenance
        }
    }
    custom_tags = {
        guild
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.57
    price = pp_fine_cloth_guild_price
prices:
  - key: pp_fine_cloth_guild_price
    body: |2-
      {gold = 100}
localization:
  entries:
    pp_fine_cloth_guild_price: Fine Cloth Guild Price
    fine_cloth_guild_slot_0: Fine Cloth Guild Work
    fine_cloth_guild_slot_1: Fine Cloth Guild Work
    pp_fine_cloth_guild_fine_cloth_guild_maintenance: Fine Cloth Guild Fine Cloth Guild Maintenance
    pp_fine_cloth_guild_wool_weavers_maintenance: Fine Cloth Guild Wool Weavers Maintenance
    pp_fine_cloth_guild_silk_weavers_maintenance: Fine Cloth Guild Silk Weavers Maintenance
    pp_fine_cloth_guild_spanish_cloth_maintenance: Fine Cloth Guild Spanish Cloth Maintenance
    pp_fine_cloth_guild_standard_fine_cloth_guild_maintenance: Fine Cloth Guild Standard Fine Cloth Guild Maintenance
    pp_fine_cloth_guild_alum_fine_cloth_guild_maintenance: Fine Cloth Guild Alum Fine Cloth Guild Maintenance
    pp_fine_cloth_guild_fur_trim_guild_maintenance: Fine Cloth Guild Fur Trim Guild Maintenance
