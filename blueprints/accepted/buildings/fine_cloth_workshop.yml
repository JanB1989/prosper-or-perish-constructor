localization:
  entries:
    fine_cloth_workshop_slot_0: "[ShowBuildingTypeName('fine_cloth_workshop')|e] Work"
    fine_cloth_workshop_slot_1: "[ShowBuildingTypeName('fine_cloth_workshop')|e] Work"
    pp_fine_cloth_workshop_fine_cloth_workshop_maintenance: Cloth Finishing
    pp_fine_cloth_workshop_fine_cloth_workshop_maintenance_desc: "Bought cloth is fulled, raised, shorn and pressed until it has a fine finish. Much English cloth was sent abroad raw and finished like this in Flanders and Holland."
    pp_fine_cloth_workshop_wool_weavers_workshop_maintenance: Wool Weaving
    pp_fine_cloth_workshop_wool_weavers_workshop_maintenance_desc: "The workshop weaves fine wool into broadcloth and the lighter new draperies, worsteds and serges. Flemish refugee weavers carried the new draperies to England in the sixteenth century."
    pp_fine_cloth_workshop_silk_weavers_workshop_maintenance: Silk Weaving
    pp_fine_cloth_workshop_silk_weavers_workshop_maintenance_desc: "Silk weavers work patterned velvets and brocades on draw looms for court and church. Lyon, Bursa and Suzhou were famed across the world for this work."
    pp_fine_cloth_workshop_spanish_cloth_workshop_maintenance: Merino Wool
    pp_fine_cloth_workshop_spanish_cloth_workshop_maintenance_desc: "Merino wool from Castile, the finest in Europe, is woven into soft, light woollens. Such cloth sold at the top of the market from Segovia to the Low Countries."
    pp_fine_cloth_workshop_standard_fine_cloth_workshop_maintenance: Standard Dyeing
    pp_fine_cloth_workshop_standard_fine_cloth_workshop_maintenance_desc: "The workshop keeps its own dyehouse, where the cloth is steeped in madder, woad and weld. It dyes in larger lots than a single master could handle."
    pp_fine_cloth_workshop_alum_fine_cloth_workshop_maintenance: Dyes with Alum
    pp_fine_cloth_workshop_alum_fine_cloth_workshop_maintenance_desc: "Cloth mordanted with alum takes fast scarlets and crimsons. These were the colours the buyers of fine cloth paid most for, and they marked the rich at a glance."
    pp_fine_cloth_workshop_fur_trim_workshop_maintenance: Fur Trims
    pp_fine_cloth_workshop_fur_trim_workshop_maintenance_desc: "Furs from the northern forests are cut and sewn as linings and borders. The fur trade through Novgorod and later Archangel fed the workshops of Europe."
    pp_fine_cloth_workshop_market_sales: Market Sales
    pp_fine_cloth_workshop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    fine_cloth_workshop_slot_2: Market
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_fine_cloth_workshop_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
