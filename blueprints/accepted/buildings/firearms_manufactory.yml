    pp_firearms_manufactory_ammunition_maintenance: Firearms Manufactory Ammunition
    firearms_manufactory_slot_1: Firearms Manufactory Work
    pp_firearms_manufactory_firearms_manufactory_maintenance: Firearms Manufactory Firearms Manufactory Maintenance
    pp_firearms_manufactory_market_sales: Market Sales
    pp_firearms_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    firearms_manufactory_slot_2: Market
    pp_firearms_manufactory_legacy_guns_guild_lumber_maintenance: "$guns_guild_lumber_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_guns_guild_lumber_maintenance_desc: "An older way of working, kept from the $gun_smith$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance: "$guns_workshop_ammunition_iron_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance_desc: "An older way of working, kept from the $guns_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
