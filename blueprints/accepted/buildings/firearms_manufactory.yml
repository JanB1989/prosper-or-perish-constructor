version: 2
tag: firearms_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
gate_method: pp_firearms_manufactory_market_sales
building:
  key: firearms_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_firearms_manufactory_ammunition_maintenance
    - pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance
  - name: slot_1
    methods:
    - pp_firearms_manufactory_firearms_manufactory_maintenance
    - pp_firearms_manufactory_legacy_guns_guild_lumber_maintenance
    - pp_firearms_manufactory_legacy_hand_cannon_guild_maintenance
    - pp_firearms_manufactory_legacy_guns_workshop_bronze_maintenance
  - name: slot_2
    methods:
    - pp_firearms_manufactory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 1350
    category = weapons_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    obsolete = guns_workshop
    build_time = manufactory_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:firearms_manufactory }
            add = {
                value = "market.market_price(goods:firearms)"
                multiply = 0.27680
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_firearms_manufactory_ammunition_maintenance = {
            icon_type = goods
            icon = lead
            lead = 0.12
            saltpeter = 0.23
            manual_labor = 0.052
            produced = firearms
            output = 0.216
            category = manufactory_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance = {
            icon_type = goods
            icon = iron
            iron = 0.094
            saltpeter = 0.094
            manual_labor = 0.047
