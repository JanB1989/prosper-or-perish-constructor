localization:
  entries:
    firearms_manufactory_slot_0: Ammunition
    pp_firearms_manufactory_ammunition_maintenance: Ammunition
    firearms_manufactory_slot_1: "[ShowBuildingTypeName('firearms_manufactory')|e] Work"
    pp_firearms_manufactory_firearms_manufactory_maintenance: Iron Firearms
    pp_firearms_manufactory_market_sales: Market Sales
    pp_firearms_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    firearms_manufactory_slot_2: Market
    pp_firearms_manufactory_legacy_guns_guild_lumber_maintenance: "$guns_guild_lumber_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_guns_guild_lumber_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('gun_smith')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance: "$guns_workshop_ammunition_iron_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_guns_workshop_ammunition_iron_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('guns_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_firearms_manufactory_legacy_guns_workshop_bronze_maintenance: "$guns_workshop_bronze_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_guns_workshop_bronze_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('guns_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_firearms_manufactory_legacy_hand_cannon_guild_maintenance: "$hand_cannon_guild_maintenance$ (Old Ways)"
    pp_firearms_manufactory_legacy_hand_cannon_guild_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('hand_cannon_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
