localization:
  entries:
    fishing_village_slot_0: Fishing grounds
    fishing_village_slot_1: Main Catch
    fishing_village_slot_2: Fishing method
    fishing_village_slot_3: Freshwater Works
    fishing_village_slot_4: Provisioning
    pp_arctic_fishing_village_maintenance: Arctic Fishing Village Maintenance
    pp_fishing_village_base_fish: Fishing Grounds
    pp_fishing_village_clinker_craft: Clinker boats
    pp_fishing_village_maintenance: Fishing Village Maintenance
    pp_fishing_village_no_freshwater_works: No Freshwater Works
    pp_fishing_village_no_primary: No Main Catch
    pp_fishing_village_provision: Provision with Fish
    pp_fishing_village_provision_desc: The household buys its own catch back and cooks for the province. Worth it while the province store is low and the good is cheap.
    pp_fishing_village_sell_surplus: Sell the Surplus
    pp_fishing_village_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
    pp_fishing_village_strand_line: Handline fishing
    pp_fishing_village_stew_ponds: Stew Ponds
    pp_fishing_village_wattle_weirs: Wattle Fish Weirs
    pp_distant_water_fishing: Distant-Water Fishing
    pp_distant_water_fishing_desc: Organize provisioned schooner fleets for rich offshore grounds, supported by salt, victuals, and naval supplies.
    pp_herring_buss: The Herring Buss
    pp_herring_buss_desc: Develop broad-beamed herring busses, drift nets, barrels, and salt-curing routines for longer offshore fishing voyages.
    pp_managed_fishponds: Managed Fishponds
    pp_managed_fishponds_desc: Manage local ponds, banks, and timber sluices so village fishers can keep freshwater fish close to market.
    pp_steam_trawling: Steam Trawling
    pp_steam_trawling_desc: Use coal-fired steam trawlers and specialized tools to work deeper fishing grounds at industrial scale.
    pp_wattle_fish_weirs: Wattle Fish Weirs
    pp_wattle_fish_weirs_desc: Build wicker traps, wattle fences, and river weirs that guide local fish into village catches.

evaluation:
  allow_rules:
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
  production_methods:
    pp_fishing_village_base_fish:
      production_efficiency: 1.00
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_fishing_village_no_primary:
      production_efficiency: 1.00
    pp_fishing_village_maintenance:
      production_efficiency: 1.05
    pp_arctic_fishing_village_maintenance:
      production_efficiency: 1.10
    pp_fishing_village_clinker_craft:
      production_efficiency: 1.05
    pp_fishing_village_wattle_weirs:
      production_efficiency: 1.10
    pp_fishing_village_stew_ponds:
      production_efficiency: 1.10
    pp_fishing_village_provision:
      allow_rules:
        profit_percent: Provisioning loses money at the Province Food floor by design; the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_fishing_village_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
