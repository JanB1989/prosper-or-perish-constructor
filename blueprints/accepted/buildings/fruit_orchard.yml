localization:
  entries:
    fruit_orchard_slot_0: Fruit Trees
    fruit_orchard_slot_1: Beekeeping
    fruit_orchard_slot_2: Orchard Work
    fruit_orchard_slot_3: Provisioning
    fruit_orchard_slot_4: Market
    pp_fruit_orchard_base_fruit: Fruit Trees
    pp_fruit_orchard_maintenance: Fruit Orchard Maintenance
    pp_fruit_orchard_no_primary: No Orchard Work
    pp_fruit_orchard_no_beekeeping: No Beekeeping
    pp_fruit_orchard_cottage_hives: Cottage Hives
    pp_fruit_orchard_cottage_hives_desc: A few skeps stand among the fruit trees. The bees work the blossom in spring and help it set, and the household takes the wax as a modest sideline.
    pp_fruit_orchard_provision: Provision with Fruit
    pp_fruit_orchard_provision_desc: The household buys its own fruit back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_fruit_orchard_market_sales: Market Sales
    pp_fruit_orchard_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
evaluation:
