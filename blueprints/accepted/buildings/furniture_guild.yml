version: 2
tag: furniture_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_furniture_guild_market_sales
building:
  key: furniture_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_furniture_guild_furniture_maintenance
  - name: slot_1
    methods:
    - pp_furniture_guild_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 1
    is_foreign = no
    pop_type = burghers
    max_levels = guild_max_level
    startup_ramp_target = 90
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:furniture_guild }
            add = {
                value = "market.market_price(goods:furniture)"
                multiply = 0.16000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_furniture_guild_furniture_maintenance = {
            lumber = 0.9
            dyes = 0.14
            tools = 0.09 # tools cut to a running cost (~10 %)
            beeswax = 0.08 # wax polish for the finish
            manual_labor = 0.38
            produced = furniture
            output = 0.8
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_furniture_guild_market_sales = {
            offset = 0.012
            produced = furniture
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.75
    price = pp_furniture_guild_price
prices:
  - key: pp_furniture_guild_price
    body: |2-
      {gold = 100}
localization:
  entries:
    pp_furniture_guild_price: Furniture Guild Price
    furniture_guild_slot_0: Furniture Guild Work
    pp_furniture_guild_furniture_maintenance: Furniture Guild Furniture Maintenance
    pp_furniture_guild_market_sales: Market Sales
    pp_furniture_guild_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    furniture_guild_slot_1: Market
evaluation:
  allow_rules:
    amortization_months: Non-raw producer under the building price brake (double price, triple level cost, 2026-09-30); slow payback is the point.
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_furniture_guild_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
