version: 2
tag: glass_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_glass_guild_market_sales
building:
  key: glass_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_glass_guild_glass_guild_maintenance
    - pp_glass_guild_metal_glass_guild_maintenance
  - name: slot_1
    methods:
    - pp_glass_guild_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 1, own methods x0.7 goods in and out
    audio_tier = 1
    is_foreign = no
    pop_type = burghers
    max_levels = guild_max_level
    startup_ramp_target = guild_startup_ramp_target
    category = basic_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    location_potential = {
        is_produced_in_location_market = goods:sand
    }
    build_time = guild_build_time
    unique_production_methods = {
        pp_glass_guild_glass_guild_maintenance = {
            lumber = 0.406 # furnace fuel and wood ash for potash flux
            sand = 0.658
            tools = 0.049 # tools cut to a running cost (~10 %)
            clay = 0.364 # clay crucibles (pots) for the melt
            manual_labor = 0.217
            produced = glass
            output = 0.525
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_glass_guild_metal_glass_guild_maintenance = {
            lumber = 0.539 # furnace fuel and wood ash for potash flux
            sand = 0.721
            tools = 0.065 # tools cut to a running cost (~10 %)
            lead = 0.154 # lead oxide flux for the lead glass
            manual_labor = 0.308
            produced = glass
            output = 0.7
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_glass_guild_market_sales = {
            offset = 0.012
            produced = glass
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = guild_construction
    modifier = {
        local_glass_output_modifier = -0.005  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    custom_tags = {
        guild
    }
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.45
    price = pp_glass_guild_price
    raw_modifier = {
        local_pp_glass_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
prices:
  - key: pp_glass_guild_price
    body: |2-
      {gold = 100}
localization:
  entries:
    pp_glass_guild_price: Glass Guild Price
    glass_guild_slot_0: Glass Guild Work
    pp_glass_guild_glass_guild_maintenance: Glass Guild Glass Guild Maintenance
    pp_glass_guild_metal_glass_guild_maintenance: Glass Guild Metal Glass Guild Maintenance
    pp_glass_guild_market_sales: Market Sales
    pp_glass_guild_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    glass_guild_slot_1: Market
evaluation:
  allow_rules:
    amortization_months: Non-raw producer under the building price brake (double price, triple level cost, 2026-09-30); slow payback is the point.
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_glass_guild_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
