version: 2
tag: glass_mill
footprint: mill_works
labour:
  class: craft_revolutions
gate_method: pp_glass_mill_market_sales
building:
  key: glass_mill
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_glass_mill_glassmill_maintenance
    - pp_glass_mill_legacy_glass_guild_maintenance
    - pp_glass_mill_legacy_metal_glass_workshop_maintenance
  - name: slot_1
    methods:
    - pp_glass_mill_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 5
    is_foreign = no
    pop_type = laborers
    is_mill = yes
    max_levels = mills_max_level
    startup_ramp_target = 1264
    category = basic_industry_category
    employment_size = 1.0
    town = yes
    city = yes
    megalopolis = yes
    build_time = mills_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:glass_mill }
            add = {
                value = "market.market_price(goods:glass)"
                multiply = 0.64000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_glass_mill_glassmill_maintenance = {
            lumber = 0.95 # packing crates and annealing lehr fuel
            sand = 5.5 # larger batch, more cullet losses
            tools = 0.37 # tools cut to a running cost (~10 %)
            coal = 3.02 # coal-fired tank furnaces
            manual_labor = 0.49
            produced = glass
            output = 3.2
            debug_max_profit = mills_profit_margin
            category = guild_input
        }
        pp_glass_mill_legacy_glass_guild_maintenance = {
            icon_type = goods
            icon = glass
            lumber = 0.98
            sand = 1.58
            tools = 0.12
            clay = 0.88
            manual_labor = 0.52
            produced = glass
            output = 1.01
            debug_max_profit = mills_profit_margin
            category = guild_input
        }
        pp_glass_mill_legacy_metal_glass_workshop_maintenance = {
            icon_type = building_type
            icon = glass_workshop
            lumber = 1.75
            sand = 2.4
            tools = 0.21
            lead = 0.58
            manual_labor = 0.71
            produced = glass
            output = 1.8
            debug_max_profit = mills_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_glass_mill_market_sales = {
            offset = 0.012
            produced = glass
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = glassworks
    custom_tags = {
        lategame_manufactory
    }
    construction_demand = manufactory_construction
    raw_modifier = {
        local_burghers_desired_pop = 0.05
    }
    increase_per_level_cost = 0.15
localization:
  entries:
    glass_mill_slot_0: Glass Mill Work
    pp_glass_mill_glassmill_maintenance: Glass Mill Glassmill Maintenance
    pp_glass_mill_market_sales: Market Sales
    pp_glass_mill_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    glass_mill_slot_1: Market
    pp_glass_mill_legacy_glass_guild_maintenance: "$glass_guild_maintenance$ (Old Ways)"
    pp_glass_mill_legacy_glass_guild_maintenance_desc: "An older way of working, kept from the $glass_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_glass_mill_legacy_metal_glass_workshop_maintenance: "$metal_glass_workshop_maintenance$ (Old Ways)"
    pp_glass_mill_legacy_metal_glass_workshop_maintenance_desc: "An older way of working, kept from the $glass_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_glass_mill_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_glass_mill_legacy_glass_guild_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
    pp_glass_mill_legacy_metal_glass_workshop_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
