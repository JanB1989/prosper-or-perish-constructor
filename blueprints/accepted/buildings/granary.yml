version: 2
tag: granary
footprint: rural_processing
building:
  key: granary
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_granary_maintenance
  possible_production_methods: []
  body: |2-
        audio_tier = 2
        is_foreign = no
        max_levels = pp_granary_cap
        price = pp_granary_price
        pop_type = laborers
        employment_size = 0.25
        category = infrastructure_category
        custom_tags = { pp_food_security_priority pp_food_storage_priority }
        rural_settlement = yes
        town = yes
        city = yes
        megalopolis = yes
        location_potential = {
            # 2026-10-06 (Jan): one Granary site per province (each owner of a split province has its own capital)
            is_province_capital = yes
            OR = {
                location_rank = location_rank:rural_settlement
                location_rank = location_rank:town
                location_rank = location_rank:city
                location_rank = location_rank:megalopolis
            }
        }
        important_for_AI = yes
        build_time = government_build_time
        unique_production_methods = {
            pp_granary_maintenance = {
                # masonry = 0.05
                stone = 0.02
                category = building_maintenance
            }
        }
        construction_demand = granary_construction
        raw_modifier = {
        }

        modifier = {
            local_food_preservation_efficiency_modifier = 0.03   # 2026-10-03: was 0.0002 (1:1 port slip; vanilla 0.05). Province decay = rate / (1 + summed preservation)
            # 2026-10-06 (Jan): base capacity is ~12 months of consumption now; Granaries take a store to 24 months.
            # The percentage scales the location's whole capacity, so later levels in big (city) locations add most.
            # Was 500 / 0.10.
            local_food_capacity = 600
            local_food_capacity_modifier = 0.15
        }
        ai_forbid_shutdown = yes
        forbidden_for_estates = no
        # AI (2026-10-06, Jan): the engine scores a Granary at about 0.3 against a queue median of 20-30, so the AI
        # built 56 levels in 20 years while 27 % of provinces sat full below 24 months (run 5c0e4d06). Flat, positive
        # only, where a level would fill: store full and under 24 months; bigger locations first (pp_food_building_values.txt)
        ai_construct_weight = {
            value = pp_granary_ai_weight
        }
prices:
  - key: pp_granary_price
    body: |2-
      {gold = 75}
localization:
  entries:
    pp_granary_price: Granary Price

evaluation:
  allow_rules:
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
