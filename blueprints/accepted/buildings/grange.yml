version: 2
tag: grange
footprint: trade
labour:
  class: keep
gate_method: pp_grange_surplus_sales
building:
  key: grange
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_grange_loose_stores
        - pp_grange_pottery_jars
        - pp_grange_coopered_barrels
        - pp_grange_tin_cans
    - name: slot_1
      methods:
        - pp_grange_porters
        - pp_grange_ox_carts
        - pp_grange_horse_wagons
    - name: slot_2
      methods:
        - pp_grange_surplus_sales
  possible_production_methods: []
  body: |2-
    is_foreign = no
    # Steep level cost: most provinces should keep one or two, only market centres grow large.
    increase_per_level_cost = 0.35
    max_levels = grange_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_grange_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = grange
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_trade_construction
    # The overland twin of the Victualling Yard: the landowners gather the province's surplus at its capital and send it
    # to the regional markets. Harbour sites have the Victualling Yard instead (pp_victuals_site_triggers.txt).
    location_potential = {
      is_province_capital = yes
      NOT = { pp_victualling_yard_site = yes }
    }
    # AI (2026-10-03): a new Grange only where it will pay and the food really piles up. Both terms are flat (vetoes):
    # the store must stand a month above the Grange's break-even at today's victuals price (63.53 - 13.85 x price, the
    # profit line at slot 2, never below 12 months; with the month: 23 at 3.0, 16 at 3.5, 13 from 3.75 up), and the
    # province must gain food each month (production + consumption, which is negative). The second keeps the AI from
    # building Granges everywhere in the first years, when every store starts far above its rest point and is falling.
    # tests/test_store_lever.py ties the numbers.
    ai_construct_weight = {
      value = 0
      if = {
        limit = { exists = market }
        subtract = { value = 64.53 subtract = { value = "market.market_price(goods:victuals)" multiply = 13.85 max = 51.53 } subtract = pp_location_stored_months min = 0 max = 1 multiply = 10000 }
      }
      if = { limit = { NOT = { exists = market } } subtract = 10000 }
      if = { limit = { pp_location_province_food_balance <= 0 } subtract = 10000 }
    }

    # slot 0: packing goods: pottery, barrels or tin cans waste less of the food.
    unique_production_methods = {
      pp_grange_loose_stores = {
        category = building_maintenance
      }
      pp_grange_pottery_jars = {
        pottery = 0.26
        manual_labor = 0.044
        produced = victuals
        output = 0.1
        debug_max_profit = 0
        category = building_maintenance
      }
      pp_grange_coopered_barrels = {
        furniture = 0.12
        manual_labor = 0.064
        produced = victuals
        output = 0.14
        debug_max_profit = 0
        category = building_maintenance
      }
      pp_grange_tin_cans = {
        steel = 0.104
        manual_labor = 0.088
        produced = victuals
        output = 0.2
        debug_max_profit = 0
        category = building_maintenance
      }
    }
    # Same food chain as the Victualling Yard: each staffed level takes 24 food (the modifier below) and packs 0.6
    # victuals, 1:40 against the Tavern's 1:30. 2026-09-30: every input, output and the food modifier scaled x0.4
    # (was 60 food -> 1.5 victuals), together with the Tavern and the Yard, so the victuals balance stays. slot 1: how the store reaches the market. The three methods pack the
    # same amount; the carts and wagons swap labour for animals and gear, so they pay only where labour is dear;
    # each carries 2.323 offset, the Haulage share of the Grange's fixed cost (see slot 2)
    # (at default goods prices: Porters below labour 1.3, Ox Carts 1.3 to 1.55, Horse Wagons above).
    unique_production_methods = {
      pp_grange_porters = {
        produced = victuals
        manual_labor = 0.08
        offset = 2.323
        output = 0.6
        category = building_maintenance
      }
      pp_grange_ox_carts = {
        livestock = 0.016
        lumber = 0.016
        manual_labor = 0.04
        offset = 2.323
        produced = victuals
        output = 0.6
        category = building_maintenance
      }
      pp_grange_horse_wagons = {
        horses = 0.012
        tools = 0.012
        lumber = 0.008
        manual_labor = 0.016
        offset = 2.323
        produced = victuals
        output = 0.6
        category = building_maintenance
      }
    }
    # slot 2: Surplus Sales, the store leg and the AI gate method. Store lever ([stored_food] in constructor.toml):
    # Surplus Sales output +13 % per stored year above 12 months (Full Stores, which stops growing at 24 months),
    # -300 % per year below (zero at 8 months), and -500 % per staffed Tavern level in the location. The gate margin
    # 4.0 x output modifier / 3.83 reaches the AI threshold 1.05 at 12.5 months stored, so the AI weight's price line
    # (above) decides where a new Grange goes.
    # Per level at floor prices, f = years above 12 months: profit = 0.6 p - 0.08 + 4.0 x (1 + 0.13 f) - 6.153
    # (2026-10-03 evening: the line was 37.88 - 5.29 p, which left stores of 14-19 months in dear-victuals markets
    # untouched; Mini World run 5: farms only answer a store under 14 months, so dear victuals never reached them):
    # -> it packs down to 63.53 - 13.85 p months: 22 at victuals 3.0 (a store at the 24-month cap still pays), 15 at
    # 3.5, about 12 from 3.75 up, and below victuals 2.86 never; under 8 months there are no sales at all, so the
    # lean part of the store stays in the province, and a starving province packs nothing (province_starving).
    # The AI weight above keeps new Granges to where they will pay: a month above that point at today's price.
    unique_production_methods = {
      pp_grange_surplus_sales = {
        produced = province_food_sales
        offset = 3.83
        output = 4.0
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      local_monthly_food = -24.0
      local_nobles_estate_power = 0.05
      local_peasant_enfranchisment = -0.01
    }
prices:
  - key: pp_grange_price
    body: |2-
      {gold = 35}
advancements:
  # the key keeps its old Victualling Yard name so saves keep the researched advance; only the Grange packs since the
  # harbour Yard ships grain already packed
  - key: victualling_yard_tin_cans_advance
    body: |2-
      age = age_6_revolutions
      unlock_production_method = pp_grange_tin_cans
      requires = steel_mill_advance
      icon = victualling_yard_tin_cans_advance
      ai_weight = { add = 150 }
localization:
  entries:
    grange: Grange
    grange_desc: The landowners gather the lasting part of a full province store at the province capital, pack it into [ShowGoodsName('victuals')|e] and send it overland to the regional markets. It pays off when the province store is full, and the dearer victuals are, the more of the store it is willing to pack; carts and wagons save labour where it is dear, and packing goods waste less of the food.
    grange_slot_0: Packing
    grange_slot_1: Haulage
    grange_slot_2: Surplus Sales
    pp_grange_porters: Porters and Pack Animals
    pp_grange_ox_carts: Ox Carts
    pp_grange_horse_wagons: Horse Wagons
    pp_grange_surplus_sales: Sell the Surplus
    pp_grange_loose_stores: Loose Stores
    pp_grange_pottery_jars: Pottery Jars
    pp_grange_coopered_barrels: Coopered Barrels
    pp_grange_tin_cans: Tin Cans
    pp_grange_price: Grange Price
    victualling_yard_tin_cans_advance: Tin Cans
    victualling_yard_tin_cans_advance_desc: Develop canning and tinning methods that pack victuals in metal containers for longer transport and storage.
icon:
  source_png: ../assets/icons/grange.png
  output_dds: grange.dds
  size: 512
  drawing: ../../../assets/icon_drawings/grange/draw.py

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: Surplus Sales output intentionally breaks normal payback bounds.
    base_output_per_1k: The packing leg turns stored province food into victuals on one noble per level, not a production line.
  production_methods:
    pp_grange_pottery_jars:
      production_efficiency: 1.00
    pp_grange_coopered_barrels:
      production_efficiency: 1.00
    pp_grange_tin_cans:
      production_efficiency: 1.00
