version: 2
tag: guns_workshop
footprint: urban_workshop
labour:
  class: craft_reformation
gate_method: pp_guns_workshop_market_sales
building:
  key: guns_workshop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_guns_workshop_guns_workshop_ammunition_lead_maintenance
    - pp_guns_workshop_guns_workshop_ammunition_iron_maintenance
  - name: slot_1
    methods:
    - pp_guns_workshop_guns_workshop_iron_maintenance
    - pp_guns_workshop_guns_workshop_bronze_maintenance
    - pp_guns_workshop_legacy_guns_guild_lumber_maintenance
    - pp_guns_workshop_legacy_hand_cannon_guild_maintenance
  - name: slot_2
    methods:
    - pp_guns_workshop_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = 1125
    category = weapons_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:guns_workshop }
            add = {
                value = "market.market_price(goods:firearms)"
                multiply = 0.17600
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_guns_workshop_guns_workshop_ammunition_lead_maintenance = {
            lead = 0.11
            saltpeter = 0.11
            manual_labor = 0.04
            produced = firearms
            output = 0.16
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_guns_workshop_guns_workshop_ammunition_iron_maintenance = {
            iron = 0.11
            saltpeter = 0.11
            manual_labor = 0.055
            produced = firearms
            output = 0.2
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_guns_workshop_guns_workshop_iron_maintenance = {
            iron = 0.48
            tools = 0.135 # tools cut to a running cost (~15 %, arms making)
            lumber = 0.16 # wooden stocks
            coal = 0.13 # forge fuel for welding the barrels
            manual_labor = 0.3
            produced = firearms
            output = 0.8
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_guns_workshop_guns_workshop_bronze_maintenance = {
            copper = 0.54
            tin = 0.11
            tools = 0.15 # tools cut to a running cost (~15 %, arms making)
            lumber = 0.35 # charcoal for the casting furnace, wooden stocks
            manual_labor = 0.32
            produced = firearms
            output = 0.88
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_guns_workshop_legacy_guns_guild_lumber_maintenance = {
            icon_type = goods
            icon = lumber
            lumber = 0.1
            iron = 0.029
            tools = 0.013
            manual_labor = 0.047
            produced = firearms
            output = 0.099
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_guns_workshop_legacy_hand_cannon_guild_maintenance = {
            icon_type = building_type
            icon = hand_cannon_guild
            tools = 0.083
            saltpeter = 0.22
            copper = 0.22
            tin = 0.092
            manual_labor = 0.28
            produced = firearms
            output = 0.5
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_guns_workshop_market_sales = {
            offset = 0.012
            produced = firearms
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = gun_smith
    construction_demand = workshop_construction
    modifier = {}
    custom_tags = {
        workshop
    }
    increase_per_level_cost = 0.25
