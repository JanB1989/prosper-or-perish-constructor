    obsolete = gun_smith
    construction_demand = workshop_construction
    modifier = {
        local_firearms_output_modifier = -0.0025  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    custom_tags = {
        workshop
    }
    increase_per_level_cost = 0.25
    raw_modifier = {
        local_pp_firearms_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
