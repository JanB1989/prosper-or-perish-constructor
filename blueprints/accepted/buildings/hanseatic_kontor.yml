version: 2
tag: hanseatic_kontor
footprint: trade
building:
  key: hanseatic_kontor
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_hanseatic_kontor_maintenance
  possible_production_methods: []
  body: |-
    # Vanilla building; ppc build fills in raw_modifier local_population_capacity from the footprint class.
    # Merchant house (2026-11-24, Jan): few, big, expensive steps, only in a market centre, a great natural harbour or a
    # megalopolis within our trade range (vanilla had no allow at all). One step = 10 vanilla levels; the first step
    # needs a host that is not hostile, further steps its good opinion and an advance, the last the Hanseatic merchant
    # federation. AGENTS.md "Merchant Houses".
    audio_tier = 3
    is_special = yes
    is_foreign = yes
    # the engine refuses a foreign building without this flag (error.log, 2026-11-24), so every step needs the host's
    # opinion of 100; the allow block keeps its own relation lines
    need_good_relation = yes
    pop_type = burghers

    category = trade_category

    max_levels = 4
    # the merchant house: 0.25, the most a burgher building may employ after the employment cut
    # (tests/test_building_scaling.py; vanilla 0.2 per level); its own staff comes with it
    employment_size = 0.25
    pop_size_created = 0.25

    rural_settlement = no
    town = yes
    city = yes
    megalopolis = yes

    price = pp_hanseatic_kontor_price
    increase_per_level_cost = 2.6667 # x [building_scaling] increase_per_level_cost_multiplier 0.75 = 2.0 in the build: each step adds 200 % of the first (2026-11-24, Jan)

    country_potential = {
    	modifier:allows_hanseatic_federation_buildings = yes
    }

    allow = {
    	custom_tooltip = {
    		text = pp_merchant_house_site_tt
    		pp_merchant_house_site = yes
    	}
    	market = { in_trade_range_of = scope:actor }
    	owner = {
    		NOT = { is_at_war_with = scope:actor }
    		NOT = { is_rival_of = scope:actor }
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:hanseatic_kontor owner = scope:actor value >= 1 } } }
    			opinion = { target = scope:actor value >= 100 }
    		}
    		trigger_else = {
    			opinion = { target = scope:actor value >= 0 }
    		}
    	}
    	scope:actor = {
    		NOT = { is_rival_of = root.owner }
    		# steps by the League's own network, not by the generic advances (2026-11-25, Jan): two steps are always
    		# open, the third needs pp_hanseatic_kontor_steps of 1, the fourth of 2 (every Kontor step gives 0.1, see
    		# foreign_country_modifier). In allow, so a network that shrinks never takes a standing step.
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:hanseatic_kontor owner = scope:actor value >= 3 } } }
    			custom_tooltip = {
    				text = pp_hanseatic_kontor_steps_tt
    				modifier:pp_hanseatic_kontor_steps >= 2
    			}
    		}
    		trigger_else_if = {
    			limit = { root = { location_building_level = { building_type = building_type:hanseatic_kontor owner = scope:actor value >= 2 } } }
    			custom_tooltip = {
    				text = pp_hanseatic_kontor_steps_tt
    				modifier:pp_hanseatic_kontor_steps >= 1
    			}
    		}
    		# no building-country rule here (2026-11-24): the Hanseatic merchant federation, the only builder of the
    		# Kontor (country_potential), is itself a building country in vanilla (HSA, setup and reform)
    		# a new house: one per owner and market, and no more houses than the trade reach allows
    		# (script_values/pp_trade_reach_values.txt); further steps of a standing house stay open
    		trigger_if = {
    			limit = { root = { NOT = { location_building_level = { building_type = building_type:hanseatic_kontor owner = scope:actor value >= 1 } } } }
    			custom_tooltip = {
    				text = pp_merchant_house_one_per_market_tt
    				NOT = {
    					any_owned_foreign_building_location = {
    						market = root.market
    						pp_merchant_house_of_actor = yes
    					}
    				}
    			}
    			custom_tooltip = {
    				text = pp_merchant_house_cap_tt
    				pp_merchant_houses_held < pp_merchant_house_cap
    			}
    		}
    	}
    }

    build_time = trade_post_build_time

    # owner: 10 vanilla levels of power, about 9 of capacity (2.3; 2.5 until 2026-11-25, Jan: the houses gave too much
    # merchant capacity; 2 until 2026-11-27, Jan: the League's trade a bit more profitable, the Kontor only), maritime
    # presence x5; host: merchant capacity of its own and settlers drawn to the Hanseatic town
    # scaled_gold_to_building_owner (2026-11-27, Jan: another little buff to the Hansa, it earns where its host towns
    # prosper): each staffed step pays the League 1 % of the host town's tax base a month (vanilla's banking office
    # takes 2.5 % per office). The engine pays it only from this block, creates the gold (the host loses nothing) and
    # pays nothing where control is zero; the AI counts it as plain gold (private notes gold_modifiers_149.md).
    modifier = {
    	merchant_power_from_building = 10
    	building_owner_maritime_presence = 0.5
    	merchant_capacity_from_building = 2.3
    	scaled_gold_to_building_owner = 0.01
    	local_merchant_capacity_modifier = 0.05
    	local_migration_attraction = 0.05
    	local_institution_growth_modifier = 0.02
    	local_max_literacy = 0.5
    }

    # the house in the market centre itself: +50 % capacity and power
    market_center_modifier = {
    	merchant_capacity_from_building = 1.15
    	merchant_power_from_building = 5
    }

    # the League's network (2026-11-25, Jan: the Hansa's own buildings carry its growth): every Kontor step adds to its
    # owner's pp_hanseatic_kontor_steps (the engine scales this block by level and goods access); the allow above reads
    # it for the third and fourth step
    foreign_country_modifier = {
    	pp_hanseatic_kontor_steps = 0.1
    }

    # each level supports itself, so foreign levels never count as unsupported building levels of the location
    raw_modifier = {
    	free_building_levels = 1
    }

    # the engine values these buildings only by merchant capacity (never power or market rank): a market centre, a rich
    # market, a market where we have no merchant yet (the next link of a chain) and merchant republics come first;
    # / (builder income + 10) as for the merchant line (scope:owner is the host here)
    ai_construct_weight = {
    	value = 50
    	if = { limit = { is_market_center = yes } add = 50 }
    	if = {
    		limit = { exists = market }
    		if = { limit = { market = { NOT = { has_merchant = scope:builder } } } add = 100 }
    		add = { value = market.total_goods_value_traded multiply = 0.1 max = 100 }
    	}
    	if = { limit = { scope:builder = { is_merchant_republic = yes } } add = 100 }
    	divide = { value = scope:builder.monthly_income_total add = 10 }
    }

    unique_production_methods = {
    	pp_hanseatic_kontor_maintenance = {
    		icon_type = building_type
    		icon = hanseatic_kontor
    		# upkeep of 2.5 vanilla levels per step (2026-11-25, Jan: dear to build, cheap to keep; at 10 levels the
    		# Hansa's start houses cost more than it earned and it went bankrupt in 1358, run 5023bdba; 3.5 like the
    		# Trade Office and Fondaco until 2026-11-27, Jan: the League's upkeep a bit lower, it died in every run)
    		lumber = 0.25 # vanilla 0.1 per level (kontor_maintenance)
    		tools = 0.25 # 0.1
    		paper = 0.625 # 0.25
    		category = building_maintenance
    	}
    }
    construction_demand = kontor_construction
prices:
  - key: pp_hanseatic_kontor_price
    body: |2-
      {gold = 820}
localization:
  entries:
    pp_hanseatic_kontor_price: "[ShowBuildingTypeName('hanseatic_kontor')|e] Price"
    hanseatic_kontor_desc: "A walled yard of the Hanseatic League in a foreign town, with its own warehouses, hall and law, where the League's merchants live and trade together. It stands only in a [market_center|e], in a town with a great [natural_harbor_suitability|e] or in a [ShowLocationRankName('megalopolis')], within our [trade_range|e], and our trade reaches on from its [market|e]. We keep at most one merchant house in a market, and how many we may keep abroad grows with our trade reach and with every [ShowBuildingTypeName('hanseatic_shipwright_guild')|e] and [ShowBuildingTypeName('hanseatic_town_hall')|e] of the League. It grows in a few large steps: the first needs only a host that is not hostile to us, the next ones the host's good [opinion|e] of us, and the highest steps open as the League's network grows, because every step of every Kontor we keep abroad lets all of them rise further. Each step gives us much [merchant_power|e] and some [merchant_capacity|e] there, more in the market centre itself, and pays us a small share of the town's [tax_base|e] every month, so the League earns where its host towns prosper; the town gains merchant capacity of its own, draws newcomers and picks up a little [literacy|e] and faster spread of [institution|e]s."
    pp_hanseatic_kontor_maintenance: "[ShowBuildingTypeName('hanseatic_kontor')|e] Maintenance"
    pp_hanseatic_kontor_maintenance_desc: "Timber, tools and paper keep the warehouses, the cranes and the League's books in order."

evaluation:
  allow_rules:
    profit_percent: Upkeep only, the building sells nothing.
    input_throughput: Vanilla upkeep on a small staff, not a recipe.
    output_throughput: Upkeep only, the building sells nothing.
