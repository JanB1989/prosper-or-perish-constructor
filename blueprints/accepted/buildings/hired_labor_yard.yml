evaluation:
  allow_rules:
    profit_percent: Manual labor sits at its 20% floor of 1 gold; every crew method loses money there and pays from a labour price of about 1.4-1.5.
    input_throughput: Crews are paid in goods (sacks and ale, horses and carts, or benches, tallies and drink) rather than following ordinary trade-building throughput.
    output_throughput: The hall adds labour to the market only when labour is scarce enough to pay for its crews.
    amortization_months: Labour prices above the floor determine whether the hall earns enough to repay its cost.
