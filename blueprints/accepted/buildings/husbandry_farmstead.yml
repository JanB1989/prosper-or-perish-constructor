  output_dds: husbandry_farmstead.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game building icon for a Husbandry Farmstead on a perfectly flat magenta chroma-key background (#ff00ff). Center a compact medieval peasant farmstead with manure yard, clay-lined seed bins, pottery jars, woven sacks and baskets, a small byre, and mixed fields. Use detailed historic bitmap cutout style, material-rich painterly brushwork, three-quarter view, readable farm storage props, muted earth browns, straw golds, field greens, no text, no frame, no modern machinery, no scenic landscape.
