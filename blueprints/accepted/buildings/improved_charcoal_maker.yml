localization:
  entries:
    improved_charcoal_maker: Charcoal Retort
    improved_charcoal_maker_desc: Sealed kilns and retorts control the charring of coppice wood more closely, using clay linings and sealed burn chambers to raise charcoal yields without competing with true coal seams.
    pp_improved_char_coal_maintenance: Sealed Retort Charring
    pp_improved_charcoal_maker_market_sales: Market Sales
    pp_improved_charcoal_maker_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    improved_charcoal_maker_slot_0: Peat Bog
    improved_charcoal_maker_slot_1: Charcoal Burning
    improved_charcoal_maker_slot_2: Market
    pp_improved_charcoal_maker_no_peat_cutting: No Peat Cutting
    pp_improved_charcoal_maker_peat_cutting: Peat Cutting
    pp_improved_charcoal_maker_peat_cutting_desc: "Colliers cut turf from the bog and dry it in sheds before it feeds the retorts, a fuel won without felling a tree. Only where the [location|e] has [ShowModifier('pp_wb_soil_peat')]."

evaluation:
  allow_rules:
    profit_percent: Retort charcoal remains profitable as a fallback, but intentionally below true coal seams after the coal-mine rebalance.
    input_throughput: Retort charcoal is intentionally below industrial mine throughput as a constrained wood-fuel fallback.
    output_throughput: Retort charcoal is intentionally below industrial mine throughput as a constrained wood-fuel fallback.
  production_methods:
    pp_improved_char_coal_maintenance:
      production_efficiency: 1.05
    pp_improved_charcoal_maker_no_peat_cutting:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Empty selector method intentionally leaves charcoal output unchanged off peat soil.
    pp_improved_charcoal_maker_peat_cutting:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Peat cutting is a small add-on on peat soil only, deliberately below the full-building throughput.
        output_throughput: Peat cutting is a small add-on on peat soil only, deliberately below the full-building throughput.
        base_output_per_1k: Peat cutting is a labour-only add-on on peat soil only (a quarter of the clamp charcoal, a little more in the retort), not a base yield.
    pp_improved_charcoal_maker_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
