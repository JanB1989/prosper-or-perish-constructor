localization:
  entries:
    improved_charcoal_maker: Charcoal Retort
    improved_charcoal_maker_desc: Sealed kilns and retorts control the charring of coppice wood more closely, using clay linings and sealed burn chambers to raise charcoal yields without competing with true coal seams.
    pp_improved_char_coal_maintenance: Sealed Retort Charring
    pp_improved_charcoal_maker_market_sales: Market Sales
    pp_improved_charcoal_maker_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    improved_charcoal_maker_slot_1: Market

evaluation:
  allow_rules:
    profit_percent: Retort charcoal remains profitable as a fallback, but intentionally below true coal seams after the coal-mine rebalance.
    input_throughput: Retort charcoal is intentionally below industrial mine throughput as a constrained wood-fuel fallback.
    output_throughput: Retort charcoal is intentionally below industrial mine throughput as a constrained wood-fuel fallback.
