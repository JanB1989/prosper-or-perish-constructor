    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:tools_workshop } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
advancements:
- key: TRY_INJECT:copperworking
