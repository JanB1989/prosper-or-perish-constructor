    iron_foundry_slot_0: Iron Foundry Work
    pp_iron_foundry_iron_foundry_maintenance: Iron Foundry Iron Foundry Maintenance
    pp_iron_foundry_market_sales: Market Sales
    pp_iron_foundry_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    iron_foundry_slot_1: Market
    pp_iron_foundry_legacy_bronze_tools_guild_maintenance: "$bronze_tools_guild_maintenance$ (Old Ways)"
    pp_iron_foundry_legacy_bronze_tools_guild_maintenance_desc: "An older way of working, kept from the $tools_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
