version: 2
tag: iron_foundry
footprint: mill_works
labour:
  class: craft_absolutism
gate_method: pp_iron_foundry_market_sales
building:
  key: iron_foundry
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_iron_foundry_iron_foundry_maintenance
    - pp_iron_foundry_legacy_stone_tools_guild_maintenance
    - pp_iron_foundry_legacy_copper_tools_guild_maintenance
    - pp_iron_foundry_legacy_bronze_tools_guild_maintenance
    - pp_iron_foundry_legacy_metalwork_workshop_maintenance
  - name: slot_1
    methods:
    - pp_iron_foundry_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = laborers
    max_levels = manufactory_max_level
    startup_ramp_target = 135
    employment_size = 1.0
    category = basic_industry_category
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:iron_foundry }
            add = {
                value = "market.market_price(goods:tools)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_iron_foundry_iron_foundry_maintenance = {
            iron = 1.33
            coal = 0.33
            manual_labor = 0.39
            category = manufactory_input
            produced = tools
            output = 1.6
            debug_max_profit = manufactory_profit_margin
        }
        pp_iron_foundry_legacy_stone_tools_guild_maintenance = {
            icon_type = goods
            icon = stone
            stone = 0.69
            manual_labor = 0.12
            produced = tools
            output = 0.23
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_iron_foundry_legacy_copper_tools_guild_maintenance = {
            icon_type = goods
            icon = copper
            copper = 0.51
            manual_labor = 0.26
            produced = tools
            output = 0.5
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_iron_foundry_legacy_bronze_tools_guild_maintenance = {
            icon_type = goods
            icon = tin
            copper = 0.52
            tin = 0.042
            manual_labor = 0.27
            produced = tools
            output = 0.54
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_iron_foundry_legacy_metalwork_workshop_maintenance = {
            icon_type = building_type
            icon = tools_workshop
            iron = 1.1
            manual_labor = 0.43
            produced = tools
            output = 1.2
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_iron_foundry_market_sales = {
            offset = 0.013
            produced = tools
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = tools_workshop
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.21
