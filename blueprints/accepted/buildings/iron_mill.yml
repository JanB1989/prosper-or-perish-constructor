    pp_iron_mill_legacy_bronze_tools_guild_maintenance: "$bronze_tools_guild_maintenance$ (Old Ways)"
    pp_iron_mill_legacy_bronze_tools_guild_maintenance_desc: "An older way of working, kept from the $tools_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
