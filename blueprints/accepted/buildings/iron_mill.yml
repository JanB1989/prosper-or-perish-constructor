version: 2
tag: iron_mill
footprint: mill_works
labour:
  class: craft_revolutions
gate_method: pp_iron_mill_market_sales
building:
  key: iron_mill
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_iron_mill_iron_mill_maintenance
    - pp_iron_mill_steel_tools
    - pp_iron_mill_legacy_stone_tools_guild_maintenance
    - pp_iron_mill_legacy_copper_tools_guild_maintenance
    - pp_iron_mill_legacy_bronze_tools_guild_maintenance
    - pp_iron_mill_legacy_metalwork_workshop_maintenance
  - name: slot_1
    methods:
    - pp_iron_mill_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 5
    is_foreign = no
    pop_type = laborers
    is_mill = yes
    max_levels = mills_max_level
    startup_ramp_target = 158
    employment_size = 1.0
    category = basic_industry_category
    town = yes
    city = yes
    megalopolis = yes
    build_time = mills_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:iron_mill }
            add = {
                value = "market.market_price(goods:tools)"
                multiply = 0.64000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_iron_mill_iron_mill_maintenance = {
            iron = 2.81
            coal = 0.7
            manual_labor = 0.48
            category = mills_input
            produced = tools
            output = 3.2
            debug_max_profit = mills_profit_margin
        }
        pp_iron_mill_steel_tools = {
            steel = 2.25
            manual_labor = 0.46
