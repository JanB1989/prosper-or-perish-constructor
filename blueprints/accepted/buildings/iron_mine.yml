localization:
  entries:
    iron_mine_slot_0: Iron Deposit
    iron_mine_slot_1: Ore Workings
    iron_mine: Iron Ore Pit
    iron_mine_desc: Shallow pits and short adits work exposed iron ores. Ore is broken and washed by hand.
    pp_iron_mine_base_iron: Exposed Iron Ore
    pp_iron_mine_base_iron_desc: "The exposed ore itself: what the ground gives before any miner improves on it."
    pp_iron_mine_no_primary: No Iron Mining
    pp_iron_mine_no_primary_desc: "No ore is dug here; the pit gives only what its exposed ore yields on its own."
    pp_iron_mine_iron: Open Ore Workings
    pp_iron_mine_iron_desc: "Pits and open cuts follow the iron ore near the surface, propped with timber where the sides slip. The ore is roasted at the pit over charcoal, which makes it crumble and leaves it lighter to carry to the bloomeries."
    pp_iron_mine_horse_whim_haulage: Horse-Whim Haulage
    pp_iron_mine_horse_whim_haulage_desc: "A horse turning a whim winds the ore up from the pit in leather buckets, so few hands are needed at the rope. It is slow work, and it asks for horses and harness instead of tools."
    pp_iron_mine_ore_dressing_floors: Ore Dressing Floors
    pp_iron_mine_ore_dressing_floors_desc: "With few iron tools to spare, the crew breaks and washes the ore by hand on open floors, sifting it through screens and sorting cloths. Clean ore wastes less charcoal in the bloomery."
    pp_iron_mine_market_sales: Market Sales
    pp_iron_mine_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    iron_mine_slot_2: Market
