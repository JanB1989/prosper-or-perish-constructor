  size: 512
  prompt: 'Use case: historical-scene. Create one finished EU5-style building icon for IRRIGATED FIELDS. Material-rich realistic painterly historic bitmap cutout, elevated three-quarter view, weathered timber and stone, convincing handmade medieval farm engineering. A compact isolated farm irrigation worksite. Main focal point is a large wooden sluice gate with upright posts and lifting beam on a short pale stone headwall at rear left, releasing a bright blue-green stream into an unmistakable broad angular feeder channel that forks between two substantial raised dry crop beds: golden wheat and lush green vegetables. Water only in clearly separated narrow channels below the dry planted soil, NO flooded fields, NO rice, NO paddies, NO mountain terraces. Few bold shapes, channel gleam and tall sluice silhouette immediately recognizable at 48 and 64 pixels. An intimate self-contained miniature worksite, ground a thin irregular patch not a thick floating block. Entire subject fully within frame with narrow margin and fills 88% of square canvas. Warm sunlight on crops and wood, cool teal-blue water, ochre earth, painterly period materials and crisp focal forms. Perfectly flat pure magenta #FF00FF chroma key background in all negative spaces, no background shadow, no magenta reflections. No sky, panorama, large house, people, text, frame, modern equipment, vector art or glyph style. Produce 1024x1024.'
