  prompt: EU5-inspired detailed historic bitmap cutout for Irrigated Fields on a perfectly flat magenta chroma-key background. Show carefully leveled rectangular rice fields enclosed by low earthen bunds, shallow water, young rice rows, a timber sluice, and a feeder channel. Material-rich painterly three-quarter-view UI art, not generic mountain terraces, no text, no frame.
