version: 2
tag: irrigation_systems
building:
  key: irrigation_systems
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_irrigation_maintenance
  possible_production_methods: []
  body: |2-
      audio_tier = 1
      is_foreign = no
      max_levels = irrigant_cap
      increase_per_level_cost = 0.40
      pop_type = peasants
      price = pp_irrigation_systems_price
      category = infrastructure_category
      custom_tags = { pp_food_security_priority pp_water_control_priority }
      employment_size = generic_peasant_building_employment
      rural_settlement = yes
      town = yes
      city = yes
      megalopolis = yes
      location_potential = {
        OR = {
          has_river = yes
          is_adjacent_to_lake = yes
        }
      }
      build_time = infrastructure_build_time
      unique_production_methods = {
        pp_irrigation_maintenance = {
          stone = 0.15
          lumber = 0.05
          tools = 0.025
          category = building_maintenance
        }
      }
      construction_demand = village_construction
      raw_modifier = {
        farm_capacity_from_irrigation_systems = 0.60
      }

      modifier = {
        local_population_capacity = 1.0
        local_monthly_food_modifier = 0.00 # vanilla 0.05

        # Extreme Sensitivity (Wet-Rice)
        local_rice_output_modifier = 0.03

        # High Sensitivity (Grains & High-Value Trees)
        local_wheat_output_modifier = 0.02
        local_millet_output_modifier = 0.02
        local_maize_output_modifier = 0.02
        local_fruit_output_modifier = 0.02
        local_olives_output_modifier = 0.02

        # Medium Sensitivity (Legumes, vineyards, dyes & medicinal crops)
        local_legumes_output_modifier = 0.01
        local_wine_output_modifier = 0.01
        local_dyes_output_modifier = 0.01
        local_medicaments_output_modifier = 0.01

        # Low Sensitivity (Tubers & Animal Products)
        local_potato_output_modifier = 0.01
        local_livestock_output_modifier = 0.00
        local_beeswax_output_modifier = 0.00
        local_wool_output_modifier = 0.00
        local_fiber_crops_output_modifier = 0.00
        local_cotton_output_modifier = 0.01
        local_sugar_output_modifier = 0.01
        local_tobacco_output_modifier = 0.01
        local_cocoa_output_modifier = 0.01
        local_tea_output_modifier = 0.02
        local_coffee_output_modifier = 0.02
        local_silk_output_modifier = 0.02
        local_incense_output_modifier = 0.01
        local_saffron_output_modifier = 0.01
        local_pepper_output_modifier = 0.01
        local_cloves_output_modifier = 0.01
        local_chili_output_modifier = 0.01
        local_horses_output_modifier = 0.00
      }
      forbidden_for_estates = no
      ai_forbid_shutdown = yes
localization:
  entries:
    irrigation_systems_slot_0: Maintenance
    pp_irrigation_maintenance: Irrigation Maintenance
    pp_irrigation_systems_price: Irrigation Systems Price

prices:
  - key: pp_irrigation_systems_price
    body: |2-
      {gold = 50}

evaluation:
  production_methods:
    pp_irrigation_maintenance:
      allow_rules:
        profit_percent: Pre-existing support method remains outside the profit band and was not part of the pp error-log economics warnings.
