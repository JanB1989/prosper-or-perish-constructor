    # manufacturing tiers 2026-10-06: tier 1, own methods x0.7 goods in and out
    audio_tier = 1
    is_foreign = no
    pop_type = burghers
    max_levels = jewelry_guild_max_level
    startup_ramp_target = guild_startup_ramp_target
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    graphical_tags = { factory_small }
    unique_production_methods = {
        pp_jewelry_guild_ivory_enhancement = {
            ivory = 0.07
            manual_labor = 0.045
            produced = jewelry
            output = 0.07
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_amber_enhancement = {
            amber = 0.07
            manual_labor = 0.045
            produced = jewelry
            output = 0.07
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_gems_enhancement = {
            gems = 0.07
            manual_labor = 0.045
            produced = jewelry
            output = 0.07
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_pearls_enhancement = {
            pearls = 0.07
            manual_labor = 0.045
            produced = jewelry
            output = 0.07
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_jewelry_guild_gold_base = {
            goods_gold = 0.371
            manual_labor = 0.574
            produced = jewelry
            output = 0.7
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_silver_base = {
            silver = 0.497
            manual_labor = 0.49
            produced = jewelry
            output = 0.7
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_copper_base = {
            copper = 0.994
            manual_labor = 0.497
            produced = jewelry
            output = 0.7
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        # Gem cutting (lapidary, 2026-10-14, Jan): gems as the main material, same margin as the metal bases at
        # default prices; takes up the gem glut and eases the short gold and silver.
        pp_jewelry_guild_gems_base = {
            gems = 0.75
            manual_labor = 0.49
            produced = jewelry
            output = 0.7
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_jewelry_guild_market_sales = {
            offset = 0.01
            produced = jewelry
            output = 0.002
            category = building_maintenance
        }
    }
    custom_tags = {
        guild
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.75
    price = pp_jewelry_guild_price
    modifier = {
        local_jewelry_output_modifier = -0.005  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    raw_modifier = {
        local_pp_jewelry_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
