version: 2
tag: jewelry_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_jewelry_guild_market_sales
building:
  key: jewelry_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_jewelry_guild_ivory_enhancement
    - pp_jewelry_guild_amber_enhancement
    - pp_jewelry_guild_gems_enhancement
    - pp_jewelry_guild_pearls_enhancement
  - name: slot_1
    methods:
    - pp_jewelry_guild_gold_base
    - pp_jewelry_guild_silver_base
    - pp_jewelry_guild_copper_base
  - name: slot_2
    methods:
    - pp_jewelry_guild_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 1
    is_foreign = no
    pop_type = burghers
    max_levels = jewelry_guild_max_level
    startup_ramp_target = 900
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:jewelry_guild }
            add = {
                value = "market.market_price(goods:jewelry)"
                multiply = 0.16000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_jewelry_guild_ivory_enhancement = {
            ivory = 0.1
            manual_labor = 0.064
            produced = jewelry
            output = 0.08
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_amber_enhancement = {
            amber = 0.1
            manual_labor = 0.064
            produced = jewelry
            output = 0.08
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_gems_enhancement = {
            gems = 0.1
            manual_labor = 0.064
            produced = jewelry
            output = 0.08
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_pearls_enhancement = {
            pearls = 0.1
            manual_labor = 0.064
            produced = jewelry
            output = 0.08
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_jewelry_guild_gold_base = {
            goods_gold = 0.53
            manual_labor = 0.82
            produced = jewelry
            output = 0.8
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_silver_base = {
            silver = 0.71
            manual_labor = 0.7
            produced = jewelry
            output = 0.8
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_jewelry_guild_copper_base = {
            copper = 1.42
            manual_labor = 0.71
            produced = jewelry
            output = 0.8
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_jewelry_guild_market_sales = {
            offset = 0.01
            produced = jewelry
            output = 0.002
            category = building_maintenance
        }
    }
    custom_tags = {
        guild
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.75
    price = pp_jewelry_guild_price
