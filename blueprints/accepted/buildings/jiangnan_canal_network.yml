localization:
  entries:
    jiangnan_canal_network: Jiangnan Canal Network
    jiangnan_canal_network_desc: Interconnected canals, sluices and embankments drain and irrigate the low fields of Jiangnan. Dredging crews and dike keepers maintain this water network. Its levels share the available land with Irrigated Fields.
    jiangnan_canal_network_slot_0: Maintenance
    pp_jiangnan_canal_network_maintenance: Canal and Dike Keepers
    pp_jiangnan_canal_network_price: Jiangnan Canal Network Price
