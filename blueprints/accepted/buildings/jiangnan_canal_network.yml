icon:
  source_png: ../assets/icons/jiangnan_canal_network.png
  output_dds: jiangnan_canal_network.dds
  size: 512
  prompt: 'Use case: historical-scene. One finished Europa Universalis V building icon, JIANGNAN CANAL NETWORK, Song/Yuan China circa 1337. Detailed material-rich painterly historical bitmap cutout, elevated three-quarter view. Compact isolated Taihu Lougang agricultural canal-and-dike worksite. Primary shapes: broad intersecting teal water canals in a clear T, raised ochre earthen embankments enclosing a small golden-green rice plot, a stout timber water-control gate on stone abutments, one short low pale stone footbridge with a single arch across a branch. Small grey tiled gatekeeper shelter with restrained authentic Jiangnan roof, no pagoda or palace. A moored simple wooden punt and a few digging tools suggest ongoing dredging. Emphasize network and embankments, readable large connected shapes at 48 pixels, not tiny busy scenery. Weathered timber, pale masonry, warm crops against cool water, strong sunlit volumes. Compact irregular ground patch, entire silhouette isolated, fills 88 percent square canvas with margins. Perfectly flat solid magenta #FF00FF background including gaps for local chroma key removal, no magenta reflections, no background shadow. No sky, horizon, landscape backdrop, lettering, text, frame, symbols, modern structures, flat vector or UI glyph look. 1024x1024.'
