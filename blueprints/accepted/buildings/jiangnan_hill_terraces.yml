icon:
  source_png: ../assets/icons/jiangnan_hill_terraces.png
  output_dds: jiangnan_hill_terraces.dds
  size: 512
  prompt: 'Use case: historical-scene. One finished Europa Universalis V building icon, JIANGNAN HILL TERRACES, Song/Yuan China circa 1337. Detailed material-rich painterly historic bitmap cutout, elevated three-quarter view, realistic period materials matching EU5 building art. Compact self-contained slice of cultivated hillside with FOUR broad bold sweeping curved terrace steps retained by weathered dry-stone walls and packed earthen banks. Large alternating strips of rich green young crops and warm golden ripe grain, narrow gleaming irrigation rill descending stone notches at one side. A small understated grey-tiled timber toolshed tucked at the top, a few wicker harvest baskets at foot. Main subject is unmistakably the stepped contour walls and crops, not the shed. Strong stepped silhouette and coherent bold shapes that remain readable at 48 pixels. Warm natural sunlight and earthy palette, finely painted tactile stone, straw and soil without busy clutter. Entire isolated silhouette fully contained in square canvas with 7 percent margin; no cropped ground or objects. Irregular small ground footprint, no scenic horizon or broad landscape. Perfectly flat solid pure magenta #FF00FF chroma key background in all gaps, no background shadow or magenta reflections. No text, letters, symbols, frame, pagoda, palace, modern equipment, vector art or UI glyph. 1024x1024.'
