version: 2
tag: khmer_baray
footprint: capacity_source
building:
  key: khmer_baray
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots: []
  possible_production_methods: []
  body: |-
    audio_tier = 4
    is_special = yes
    is_foreign = no
    pop_type = laborers
    max_levels = pp_wb_cap_khmer_baray
    increase_per_level_cost = 0.27
    price = pp_khmer_baray_price
    employment_size = 0
    category = infrastructure_category
    custom_tags = { pp_food_security_priority pp_water_control_priority }
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes

    # Khmer niche of the irrigation family: shares the irrigation cap, worth more per level (see [worldbuilder.buildings.niche]).
    location_potential = {
      dominant_culture ?= culture:khmer_culture
      OR = {
        OR = { pp_navigation_river_level_1 = yes pp_navigation_river_level_2 = yes pp_navigation_river_level_3 = yes pp_navigation_river_level_4 = yes pp_navigation_river_level_5 = yes }
        is_adjacent_to_lake = yes
        OR = { topography = ha1300_topo_deltas topography = ha1300_topo_floodplains topography = ha1300_topo_valleys }
        AND = {
          has_location_modifier = pp_wb_coastal
          OR = { topography = flatland topography = wetlands }
        }
      }
    }
    country_potential = {
      OR = {
        tag = KHM
        culture ?= culture:khmer_culture
      }
    }

    build_time = infrastructure_build_time
    construction_demand = khmer_baray_construction

    raw_modifier = {
      local_rice_output_modifier = 0.05
      local_fish_output_modifier = 0.02
      local_cotton_output_modifier = 0.02
      local_sugar_output_modifier = 0.02
      local_tea_output_modifier = 0.01
      local_population_capacity = 2.4
      pp_wb_levels_khmer_baray = 1
    }

    modifier = {
    }

    forbidden_for_estates = no
    ai_forbid_shutdown = yes
prices:
- key: pp_khmer_baray_price
  body: '{gold = 50}'
localization:
  entries:
    pp_khmer_baray_price: Khmer Baray Price
    khmer_baray_desc: A large reservoir of water. Each baray stores the monsoon for the dry season and feeds the fields below it, so Khmer lands can sustain far more people per channel than ordinary irrigation. Barays and irrigation systems share the same water, so their levels count against one cap.
