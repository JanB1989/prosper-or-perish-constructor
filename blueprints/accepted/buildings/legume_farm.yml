localization:
  entries:
    legume_farm: Legume Farm
    legume_farm_desc: Households grow peas, beans and lentils that feed both the table and the soil.
    legume_farm_slot_0: Fields
    legume_farm_slot_1: Cultivation
    legume_farm_slot_2: Beekeeping
    legume_farm_slot_3: Provisioning
    pp_legume_farm_base: Fields
    pp_legume_farm_no_cultivation: No Cultivation
    pp_legume_farm_pease_bean_field: Pease and Bean Field
    pp_legume_farm_pease_bean_field_desc: Peas and beans are sown in the open field.
    pp_legume_farm_stubble_sowing: Sown on Stubble
    pp_legume_farm_stubble_sowing_desc: A horse team sows pulses into the grain stubble.
    pp_legume_farm_no_beekeeping: No Beekeeping
    pp_legume_farm_cottage_hives: Cottage Hives
    pp_legume_farm_cottage_hives_desc: A few skeps stand by orchards and hedges, tended in spare moments between fieldwork. Beekeeping is a modest household sideline, valued but never the village's main concern.
    pp_legume_farm_provision: Provision with Legumes
    pp_legume_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_legume_farm_sell_surplus: Sell the Surplus
    pp_legume_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
