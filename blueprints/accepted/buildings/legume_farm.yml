  methods:
    pp_legume_farm_base: base
    pp_legume_farm_cottage_hives: base
    pp_legume_farm_provision: keep
gate_method: pp_legume_farm_provision
upgrade_chain:
  family: legume_farm
  tier: 0
  previous: null
  next: legume_farmstead
  unlock_advance: null
building:
  key: legume_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_legume_farm_base
  - name: slot_1
    methods:
    - pp_legume_farm_no_beekeeping
    - pp_legume_farm_cottage_hives
  - name: slot_2
    methods:
    - pp_legume_farm_no_cultivation
    - pp_legume_farm_pease_bean_field
    - pp_legume_farm_stubble_sowing
  - name: slot_3
    methods:
    - pp_legume_farm_provision
  possible_production_methods: []
  body: |-
    audio_tier = 1
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_legume_farm
    pop_type = peasants
    employment_size = 1.25
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = legume_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    build_time = village_build_time
    construction_demand = village_construction

    location_potential = {
        pp_legume_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:legumes)"
                divide = "default_price(goods:legumes)"
                multiply = { value = 1 add = modifier:local_legumes_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }

    unique_production_methods = {
        pp_legume_farm_base = {
            manual_labor = 0.012
            produced = legumes
            output = 0.06
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_farm_no_beekeeping = {
            category = building_maintenance
        }
        pp_legume_farm_cottage_hives = {
            furniture = 0
            cloth = 0
            manual_labor = 0.025
            produced = beeswax
            output = 0.063
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_legume_farm_pease_bean_field = {
            tools = 0.002
            livestock = 0.031
            lumber = 0.026
            manual_labor = 0.024
            produced = legumes
            output = 0.15
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_legume_farm_stubble_sowing = {
            horses = 0.016
            lumber = 0.029
            tools = 0.003
            manual_labor = 0.026
            produced = legumes
            output = 0.166
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_farm_provision = {
            legumes = 0.01
            produced = local_food
            output = 1.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_legume_farm = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 1.75
        local_food_capacity = 50
        local_peasants_estate_power = 0.04
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_soldiers_desired_pop = 0
        local_wheat_output_modifier = 0.02
        local_millet_output_modifier = 0.02
        local_maize_output_modifier = 0.02
        local_livestock_output_modifier = 0.01
    }
localization:
  entries:
    legume_farm: Legume Farm
    legume_farm_desc: Households grow peas, beans and lentils that feed both the table and the soil.
    legume_farm_slot_0: Fields
    legume_farm_slot_1: Beekeeping
    legume_farm_slot_2: Cultivation
    legume_farm_slot_3: Provisioning
    pp_legume_farm_base: Fields
    pp_legume_farm_no_cultivation: No Cultivation
    pp_legume_farm_pease_bean_field: Pease and Bean Field
    pp_legume_farm_pease_bean_field_desc: Peas and beans are sown in the open field.
    pp_legume_farm_stubble_sowing: Sown on Stubble
    pp_legume_farm_stubble_sowing_desc: A horse team sows pulses into the grain stubble.
    pp_legume_farm_no_beekeeping: No Beekeeping
    pp_legume_farm_cottage_hives: Cottage Hives
    pp_legume_farm_cottage_hives_desc: A few skeps stand by orchards and hedges, tended in spare moments between fieldwork. Beekeeping is a modest household sideline, valued but never the village's main concern.
    pp_legume_farm_provision: Provision with Legumes
    pp_legume_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/legume_farm.png
  output_dds: legume_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_legume_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_legume_farm_no_cultivation:
      production_efficiency: 1.0
    pp_legume_farm_pease_bean_field:
      production_efficiency: 1.05
    pp_legume_farm_stubble_sowing:
      production_efficiency: 1.05
    pp_legume_farm_no_beekeeping:
      production_efficiency: 1.0
    pp_legume_farm_cottage_hives:
      production_efficiency: 1.0
    pp_legume_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
