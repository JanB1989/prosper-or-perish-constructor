localization:
  entries:
    legume_farmstead: Legume Farmstead
    legume_farmstead_desc: Fodder leys and sealed seed jars tie pulse growing to the village livestock.
    legume_farmstead_slot_0: Fields
    legume_farmstead_slot_1: Cultivation
    legume_farmstead_slot_2: Beekeeping
    legume_farmstead_slot_3: Provisioning
    pp_legume_farmstead_base: Fields
    pp_legume_farmstead_no_cultivation: No Cultivation
    pp_legume_farmstead_fodder_leys: Fodder Leys and Seed Jars
    pp_legume_farmstead_fodder_leys_desc: Fodder leys feed the herds and seed jars keep next year's sowing.
    pp_legume_farmstead_no_beekeeping: No Beekeeping
    pp_legume_farmstead_yard_hives: Yard Hives
    pp_legume_farmstead_provision: Provision with Legumes
    pp_legume_farmstead_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_legume_farmstead_sell_surplus: Sell the Surplus
    pp_legume_farmstead_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
