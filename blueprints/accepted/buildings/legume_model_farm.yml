    legume_model_farm_slot_0: Fields
    legume_model_farm_slot_1: Cultivation
    legume_model_farm_slot_2: Provisioning
    pp_legume_model_farm_base: Fields
    pp_legume_model_farm_no_cultivation: No Cultivation
    pp_legume_model_farm_drilled_rows: Drilled Pulse Rows
    pp_legume_model_farm_drilled_rows_desc: Pulses are drilled in rows and their seed is kept in ledgers.
    pp_legume_model_farm_provision: Provision with Legumes
    pp_legume_model_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_legume_model_farm_sell_surplus: Sell the Surplus
    pp_legume_model_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
