localization:
  entries:
    legume_rotations: Pulse Rotation Farm
    legume_rotations_desc: Pulses move through the rotation and leave the soil richer for the grain that follows.
    legume_rotations_slot_0: Fields
    legume_rotations_slot_1: Cultivation
    legume_rotations_slot_2: Beekeeping
    legume_rotations_slot_3: Provisioning
    pp_legume_rotations_base: Fields
    pp_legume_rotations_no_cultivation: No Cultivation
    pp_legume_rotations_pulse_rotation: Pulse Rotation
    pp_legume_rotations_pulse_rotation_desc: Pulses take their turn in the field rotation.
    pp_legume_rotations_vetch_lentil: Vetch and Lentil Fodder
    pp_legume_rotations_vetch_lentil_desc: Vetch and lentils are grown for fodder as well as food.
    pp_legume_rotations_no_beekeeping: No Beekeeping
    pp_legume_rotations_hedgerow_hives: Hedgerow Hives
    pp_legume_rotations_hedgerow_hives_desc: Cottage hives line hedges and orchard edges, adding wax from the same improved field boundaries.
    pp_legume_rotations_provision: Provision with Legumes
    pp_legume_rotations_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_legume_rotations_sell_surplus: Sell the Surplus
    pp_legume_rotations_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
