version: 2
tag: legume_rotations
output_tag: legume_farm_tier2
footprint: farm_land
labour:
  class: primary_reformation
  methods:
    pp_legume_rotations_base: base
    pp_legume_rotations_provision: keep
gate_method: pp_legume_rotations_provision
upgrade_chain:
  family: legume_farm
  tier: 2
  previous: legume_farmstead
  next: legume_model_farm
  unlock_advance: pp_farming_village_rotations
building:
  key: legume_rotations
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_legume_rotations_base
  - name: slot_1
    methods:
    - pp_legume_rotations_no_beekeeping
    - pp_legume_rotations_hedgerow_hives
  - name: slot_2
    methods:
    - pp_legume_rotations_no_cultivation
    - pp_legume_rotations_pulse_rotation
    - pp_legume_rotations_vetch_lentil
  - name: slot_3
    methods:
    - pp_legume_rotations_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_legume_rotations
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = legume_rotations
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = legume_farmstead
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_legume_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:legumes)"
                divide = "default_price(goods:legumes)"
                multiply = { value = 1 add = modifier:local_legumes_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:legume_farmstead } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_legume_rotations_base = {
            manual_labor = 0.019
            produced = legumes
            output = 0.095
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_rotations_no_beekeeping = {
            category = building_maintenance
        }
        pp_legume_rotations_hedgerow_hives = {
            tools = 0.036
            lumber = 0.089
            fiber_crops = 0.071
            pottery = 0.045
            manual_labor = 0.055
            produced = beeswax
            output = 0.31
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_rotations_no_cultivation = {
            category = building_maintenance
        }
        pp_legume_rotations_pulse_rotation = {
            tools = 0.11
            horses = 0.09
            livestock = 0.061
            cloth = 0.024
            manual_labor = 0.11
            produced = legumes
            output = 1.05
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_legume_rotations_vetch_lentil = {
            tools = 0.1
            horses = 0.085
            livestock = 0.072
            fiber_crops = 0.054
            manual_labor = 0.11
            produced = legumes
            output = 1.09
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_legume_rotations_provision = {
            legumes = 0.016
            produced = local_food
            output = 3.781
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_legume_rotations = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 3.094
        local_food_capacity = 50
        local_peasants_estate_power = 0.021
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_wheat_output_modifier = 0.02
        local_millet_output_modifier = 0.02
        local_maize_output_modifier = 0.02
        local_livestock_output_modifier = 0.01
    }
localization:
  entries:
    legume_rotations: Pulse Rotation Farm
    legume_rotations_desc: Pulses move through the rotation and leave the soil richer for the grain that follows.
    legume_rotations_slot_0: Fields
    legume_rotations_slot_1: Beekeeping
    legume_rotations_slot_2: Cultivation
    legume_rotations_slot_3: Provisioning
    pp_legume_rotations_base: Fields
    pp_legume_rotations_no_cultivation: No Cultivation
    pp_legume_rotations_pulse_rotation: Pulse Rotation
    pp_legume_rotations_pulse_rotation_desc: Pulses take their turn in the field rotation.
    pp_legume_rotations_vetch_lentil: Vetch and Lentil Fodder
    pp_legume_rotations_vetch_lentil_desc: Vetch and lentils are grown for fodder as well as food.
    pp_legume_rotations_no_beekeeping: No Beekeeping
    pp_legume_rotations_hedgerow_hives: Hedgerow Hives
    pp_legume_rotations_hedgerow_hives_desc: Cottage hives line hedges and orchard edges, adding wax from the same improved field boundaries.
    pp_legume_rotations_provision: Provision with Legumes
    pp_legume_rotations_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/legume_rotations.png
  output_dds: legume_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_4_reformation (age_food.py, throughput x1.35) on top.
    output_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_4_reformation (age_food.py, throughput x1.35) on top.
  production_methods:
    pp_legume_rotations_base:
      production_efficiency: 1.0
    pp_legume_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_legume_rotations_pulse_rotation:
      production_efficiency: 1.0
    pp_legume_rotations_vetch_lentil:
      production_efficiency: 1.0
    pp_legume_rotations_no_beekeeping:
      production_efficiency: 1.0
    pp_legume_rotations_hedgerow_hives:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Hedgerow hive sideline is intentionally smaller than the full-building throughput target.
        output_throughput: Hedgerow hive sideline is intentionally smaller than the full-building throughput target.
    pp_legume_rotations_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
