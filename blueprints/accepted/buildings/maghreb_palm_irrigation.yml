version: 2
tag: maghreb_palm_irrigation
footprint: estate_land
labour:
  class: primary_medieval
  methods:
    pp_maghreb_palm_irrigation_provision: keep
gate_method: pp_maghreb_palm_irrigation_market_sales
building:
  key: maghreb_palm_irrigation
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_maghreb_palm_irrigation_maghreb_palm_irrigation_maintenance
  - name: slot_1
    methods:
    - pp_maghreb_palm_irrigation_provision
  - name: slot_2
    methods:
    - pp_maghreb_palm_irrigation_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_special = yes
    is_foreign = no
    pop_type = peasants
    max_levels = 1
    employment_size = 1.0
    # a staple food maker (2026-10-04): staffed with the farms and fisheries (pp_employment_priority.txt)
    custom_tags = { pp_food_security_priority pp_staple_food_priority }
    category = trade_category
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    country_potential = {
        OR = {
            culture = {
                has_culture_group = culture_group:maghrebi_group
            }
            culture = {
                has_culture_group = culture_group:amazigh_group
            }
        }
    }
    allow = {
        OR = { climate = arid climate = hot_semi_arid }
        OR = {
            vegetation = desert
            OR = { vegetation = sparse vegetation = ha1300_veg_scrubland vegetation = ha1300_veg_tundra }
        }
        OR = {
            region = region:maghreb_region
            region = region:sahel_region
        }
    }
    can_destroy = {
        always = yes
    }
    # the AI answers a low province store (pp_food_urgency_weight, flat)
    ai_construct_weight = {
        value = 0
        add = pp_food_urgency_weight
    }
    build_time = trade_post_build_time
    raw_modifier = {
      local_pp_staple_levels = 1  # counts toward the province's Cookshop cap like a farm level (a staple food maker)
    }

    modifier = {
        local_monthly_development_modifier = 0.2
        local_life_expectancy = 2
        supply_limit = 2.5
    }
    construction_demand = maghreb_palm_irrigation_building_construction
    unique_production_methods = {
        pp_maghreb_palm_irrigation_maghreb_palm_irrigation_maintenance = {
            icon_type = building_type
            icon = irrigation_systems
            produced = fruit
            output = 0.8
            lumber = 0.17
            clay = 0.19 # channel and foggara lining (more upkeep of the earthworks)
            tools = 0.023 # hoes and palm knives: a small running cost
            stone = 0.14 # sluice stones and channel facing
            manual_labor = 0.14
            debug_max_profit = rural_profit_margin
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_maghreb_palm_irrigation_provision = {
            fruit = 0.08
            produced = local_food
            output = 0.96
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_maghreb_palm_irrigation_market_sales = {
            offset = 0.01
            produced = fruit
            output = 0.01
            category = building_maintenance
        }
    }
    increase_per_level_cost = 0.25
localization:
  entries:
    maghreb_palm_irrigation_slot_0: Palm Gardens
    maghreb_palm_irrigation_slot_1: Provisioning
    maghreb_palm_irrigation_slot_2: Market
    pp_maghreb_palm_irrigation_provision: Provision with Fruit
    pp_maghreb_palm_irrigation_provision_desc: The household buys its own fruit back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_maghreb_palm_irrigation_maghreb_palm_irrigation_maintenance: $maghreb_palm_irrigation_maintenance$
    pp_maghreb_palm_irrigation_market_sales: Market Sales
    pp_maghreb_palm_irrigation_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer (EU5 1.4 unique Maghreb building, one level); vanilla production shape kept, margin bands are advisory here.
    base_output_per_1k: Converted vanilla producer (EU5 1.4 unique Maghreb building, one level); no no-input base method.
    input_throughput: Converted vanilla producer preserves the vanilla production shape of a one-level unique building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves the vanilla production shape of a one-level unique building, not throughput per worker.
    amortization_months: One-level unique building of the Maghrebi and Amazigh cultures; payback is not the point.
  production_methods:
    pp_maghreb_palm_irrigation_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_maghreb_palm_irrigation_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
