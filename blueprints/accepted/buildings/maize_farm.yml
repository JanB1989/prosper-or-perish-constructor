- key: pp_maize_farm_advance_general
  body: |-
    age = age_4_reformation
    requires = global_trade_advance
    ai_weight = { add = 50 }
    potential = {
        exists = capital
        NOT = {
            original_capital ?= {
                OR = {
                    sub_continent = sub_continent:north_america
                    sub_continent = sub_continent:south_america
                }
            }
        }
    }
localization:
  entries:
    maize_farm: Maize Field
    maize_farm_desc: Households plant maize in hills worked with the hoe.
    maize_farm_slot_0: Fields
    maize_farm_slot_1: Cultivation
    maize_farm_slot_2: Provisioning
    pp_maize_farm_base: Fields
    pp_maize_farm_no_cultivation: No Cultivation
    pp_maize_farm_hill_planting: Hill Planting
    pp_maize_farm_hill_planting_desc: Maize is planted by hand in hoed hills.
    pp_maize_farm_milpa: Milpa with Beans
    pp_maize_farm_milpa_desc: Beans climb the maize stalks and feed the soil.
    pp_maize_farm_provision: Provision with Maize
    pp_maize_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_maize_farm_sell_surplus: Sell the Surplus
    pp_maize_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
    pp_maize_farm_advance_general: Maize Cultivation
    pp_maize_farm_advance_general_desc: Adopt maize cultivation through colonial and trade networks.
icon:
  source_png: ../assets/icons/maize_farm.png
  output_dds: maize_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_maize_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_maize_farm_no_cultivation:
      production_efficiency: 1.0
    pp_maize_farm_hill_planting:
      production_efficiency: 1.05
    pp_maize_farm_milpa:
      production_efficiency: 1.05
    pp_maize_farm_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_maize_farm_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
