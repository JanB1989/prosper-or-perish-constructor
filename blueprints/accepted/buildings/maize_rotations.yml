localization:
  entries:
    maize_rotations: Maize Rotation Farm
    maize_rotations_desc: Ploughed rows and bean rotations raise more maize from the same fields.
    maize_rotations_slot_0: Fields
    maize_rotations_slot_1: Cultivation
    maize_rotations_slot_2: Provisioning
    pp_maize_rotations_base: Fields
    pp_maize_rotations_no_cultivation: No Cultivation
    pp_maize_rotations_ploughed_rows: Ploughed Maize Rows
    pp_maize_rotations_ploughed_rows_desc: Draught animals plough straight rows for the maize.
    pp_maize_rotations_maize_bean_rotation: Maize-Bean Rotation
    pp_maize_rotations_maize_bean_rotation_desc: Maize and beans take turns on the same fields.
    pp_maize_rotations_provision: Provision with Maize
    pp_maize_rotations_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_maize_rotations_sell_surplus: Sell the Surplus
    pp_maize_rotations_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
icon:
  source_png: ../assets/icons/maize_rotations.png
  output_dds: maize_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_maize_rotations_base:
      production_efficiency: 1.0
    pp_maize_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_maize_rotations_ploughed_rows:
      production_efficiency: 1.0
    pp_maize_rotations_maize_bean_rotation:
      production_efficiency: 1.0
    pp_maize_rotations_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_maize_rotations_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
