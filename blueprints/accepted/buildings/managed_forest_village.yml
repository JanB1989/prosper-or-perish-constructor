  prompt: EU5-inspired hand-painted strategy-game icon for Managed Forest Village, transparent background. Center a compact upgraded woodland settlement with marked tree stands, timber sledges or wagons, stacked hides, beehives, a small tannery shed, survey stakes, and workers' tools. Muted forest greens, bark browns, wax yellow accents, no text, no frame, painterly historical UI art.

