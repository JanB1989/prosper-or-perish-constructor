localization:
  entries:
    managed_forest_village: Managed Forest Village
    managed_forest_village_desc: Managed forest villages use ordinances, marked stands, and recorded rights to organize woodland work. Hides, game, fur, and wax move through the same forest yards.
    managed_forest_village_slot_0: Managed Forest
    managed_forest_village_slot_1: Forest Work
    managed_forest_village_slot_2: Provisioning
    pp_managed_forest_village: Managed Forest Villages
    pp_managed_forest_village_base_beeswax: Forest Apiaries
    pp_managed_forest_village_base_fur: Forest Fur
    pp_managed_forest_village_base_leather: Forest Hides
    pp_managed_forest_village_base_wild_game: Forest Game
    pp_managed_forest_village_desc: Timber drives, woodland ordinances, and organized crews let forest settlements work nearby woods at greater scale.
    pp_managed_forest_village_apiaries: Managed Forest Apiaries
    pp_managed_forest_village_fur_trappers: Registered Fur Trappers
    pp_managed_forest_village_gamekeepers: Gamekeepers
    pp_managed_forest_village_no_primary: No Managed Forest Work
    pp_managed_forest_village_provision: Provision with Game
    pp_managed_forest_village_provision_desc: The household buys its own game back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_managed_forest_village_tannery: Managed Forest Tannery
    pp_managed_forest_village_market_sales: Market Sales
    pp_managed_forest_village_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    managed_forest_village_slot_3: Market
icon:
