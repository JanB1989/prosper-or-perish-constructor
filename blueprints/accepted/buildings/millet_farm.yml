localization:
  entries:
    millet_farm: Millet Farm
    millet_farm_desc: Households sow millet on light and dry soils that suit little else.
    millet_farm_slot_0: Fields
    millet_farm_slot_1: Cultivation
    millet_farm_slot_2: Provisioning
    pp_millet_farm_base: Fields
    pp_millet_farm_no_cultivation: No Cultivation
    pp_millet_farm_broadcast_hoe: Broadcast and Hoe
    pp_millet_farm_broadcast_hoe_desc: Seed is broadcast by hand and the weeds are kept down with the hoe.
    pp_millet_farm_millet_pulses: Millet with Pulses
    pp_millet_farm_millet_pulses_desc: Pulses grow between the millet and feed the soil.
    pp_millet_farm_provision: Provision with Millet
    pp_millet_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_millet_farm_sell_surplus: Sell the Surplus
    pp_millet_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
