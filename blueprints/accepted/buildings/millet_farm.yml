version: 2
tag: millet_farm
output_tag: millet_farm_tier0
footprint: farm_land
labour:
  class: primary_medieval
  methods:
    pp_millet_farm_base: base
    pp_millet_farm_broadcast_hoe: hand_work
    pp_millet_farm_provision: keep
gate_method: pp_millet_farm_provision
upgrade_chain:
  family: millet_farm
  tier: 0
  previous: null
  next: millet_farmstead
  unlock_advance: null
building:
  key: millet_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_millet_farm_base
  - name: slot_1
    methods:
    - pp_millet_farm_no_cultivation
    - pp_millet_farm_broadcast_hoe
    - pp_millet_farm_millet_pulses
  - name: slot_2
    methods:
    - pp_millet_farm_provision
  possible_production_methods: []
  body: |-
    audio_tier = 1
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_millet_farm
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = millet_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    build_time = village_build_time
    construction_demand = village_construction

    location_potential = {
        pp_millet_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:millet)"
                divide = "default_price(goods:millet)"
                multiply = { value = 1 add = modifier:local_millet_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }

    unique_production_methods = {
        pp_millet_farm_base = {
            manual_labor = 0.012
            produced = millet
            output = 0.06
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_millet_farm_broadcast_hoe = {
            tools = 0.002
            lumber = 0.021
            manual_labor = 0.038
            produced = millet
            output = 0.15
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_millet_farm_millet_pulses = {
            legumes = 0.041
            tools = 0.003
            livestock = 0.011
            lumber = 0.025
            manual_labor = 0.026
            produced = millet
            output = 0.166
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_farm_provision = {
            millet = 0.01
            produced = local_food
            output = 1.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_millet_farm = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.04
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_soldiers_desired_pop = 0
    }
localization:
  entries:
    millet_farm: Millet Farm
    millet_farm_desc: Households sow millet on light and dry soils that suit little else.
    millet_farm_slot_0: Fields
    millet_farm_slot_1: Cultivation
    millet_farm_slot_2: Provisioning
    pp_millet_farm_base: Fields
    pp_millet_farm_no_cultivation: No Cultivation
    pp_millet_farm_broadcast_hoe: Broadcast and Hoe
    pp_millet_farm_broadcast_hoe_desc: Seed is broadcast by hand and the weeds are kept down with the hoe.
    pp_millet_farm_millet_pulses: Millet with Pulses
    pp_millet_farm_millet_pulses_desc: Pulses grow between the millet and feed the soil.
    pp_millet_farm_provision: Provision with Millet
    pp_millet_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/millet_farm.png
  output_dds: millet_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_millet_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_millet_farm_no_cultivation:
      production_efficiency: 1.0
    pp_millet_farm_broadcast_hoe:
      production_efficiency: 1.05
    pp_millet_farm_millet_pulses:
      production_efficiency: 1.05
    pp_millet_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
