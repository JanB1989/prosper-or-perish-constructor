    millet_farmstead: Millet Farmstead
    millet_farmstead_desc: Manured plots and sealed seed stores steady the millet harvest.
    millet_farmstead_slot_0: Fields
    millet_farmstead_slot_1: Cultivation
    millet_farmstead_slot_2: Provisioning
    pp_millet_farmstead_base: Fields
    pp_millet_farmstead_no_cultivation: No Cultivation
    pp_millet_farmstead_manured_hill_plots: Manured Hill Plots
    pp_millet_farmstead_manured_hill_plots_desc: Manured plots and sealed seed jars steady the harvest.
    pp_millet_farmstead_provision: Provision with Millet
    pp_millet_farmstead_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_millet_farmstead_sell_surplus: Sell the Surplus
    pp_millet_farmstead_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
