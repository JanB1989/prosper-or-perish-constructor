version: 2
tag: millet_farmstead
output_tag: millet_farm_tier1
footprint: farm_land
labour:
  class: primary_discovery
  methods:
    pp_millet_farmstead_base: base
    pp_millet_farmstead_provision: keep
gate_method: pp_millet_farmstead_provision
upgrade_chain:
  family: millet_farm
  tier: 1
  previous: millet_farm
  next: millet_rotations
  unlock_advance: pp_manuring_and_seed_stores
building:
  key: millet_farmstead
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_millet_farmstead_base
  - name: slot_1
    methods:
    - pp_millet_farmstead_no_cultivation
    - pp_millet_farmstead_manured_hill_plots
  - name: slot_2
    methods:
    - pp_millet_farmstead_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_millet_farmstead
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = millet_farmstead
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = millet_farm
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_millet_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:millet)"
                divide = "default_price(goods:millet)"
                multiply = { value = 1 add = modifier:local_millet_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_millet_farmstead_base = {
            manual_labor = 0.016
            produced = millet
            output = 0.08
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_farmstead_no_cultivation = {
            category = building_maintenance
        }
        pp_millet_farmstead_manured_hill_plots = {
            livestock = 0.086
            fiber_crops = 0.052
            pottery = 0.034
            tools = 0.016
            manual_labor = 0.053
            produced = millet
            output = 0.6
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_farmstead_provision = {
            millet = 0.013
            produced = local_food
            output = 2
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_millet_farmstead = -1
      local_population_capacity = -5
    }

    modifier = {
        local_pp_farm_levels = 1
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.03
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    millet_farmstead: Millet Farmstead
    millet_farmstead_desc: Manured plots and sealed seed stores steady the millet harvest.
    millet_farmstead_slot_0: Fields
    millet_farmstead_slot_1: Cultivation
    millet_farmstead_slot_2: Provisioning
    pp_millet_farmstead_base: Fields
    pp_millet_farmstead_no_cultivation: No Cultivation
    pp_millet_farmstead_manured_hill_plots: Manured Hill Plots
    pp_millet_farmstead_manured_hill_plots_desc: Manured plots and sealed seed jars steady the harvest.
    pp_millet_farmstead_provision: Provision with Millet
    pp_millet_farmstead_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/millet_farmstead.png
  output_dds: millet_farmstead.dds
  size: 512
evaluation:
  allow_rules:
    profit_percent: Passive selectors, no-output options, and household sidelines can sit outside the narrow margin band; worked farmstead methods carry the tier balance.
    base_output_per_1k: Early farmstead selectors keep passive food output small; worked crop methods carry the tier economy.
    input_throughput: Husbandry farmsteads are an age 3 bridge and intentionally stay below rotational farming throughput.
    output_throughput: Husbandry farmsteads are an age 3 bridge and intentionally stay below rotational farming throughput.
  production_methods:
    pp_millet_farmstead_base:
      production_efficiency: 1.0
    pp_millet_farmstead_no_cultivation:
      production_efficiency: 1.0
    pp_millet_farmstead_manured_hill_plots:
      production_efficiency: 1.05
    pp_millet_farmstead_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
