version: 2
tag: millet_rotations
output_tag: millet_farm_tier2
footprint: farm_land
labour:
  class: primary_reformation
  methods:
    pp_millet_rotations_base: base
    pp_millet_rotations_provision: keep
gate_method: pp_millet_rotations_provision
upgrade_chain:
  family: millet_farm
  tier: 2
  previous: millet_farmstead
  next: millet_model_farm
  unlock_advance: pp_farming_village_rotations
building:
  key: millet_rotations
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_millet_rotations_base
  - name: slot_1
    methods:
    - pp_millet_rotations_no_cultivation
    - pp_millet_rotations_millet_fallow
    - pp_millet_rotations_sorghum_cowpea
  - name: slot_2
    methods:
    - pp_millet_rotations_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_millet_rotations
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = millet_rotations
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = millet_farmstead
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_millet_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:millet)"
                divide = "default_price(goods:millet)"
                multiply = { value = 1 add = modifier:local_millet_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:millet_farmstead } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }

    unique_production_methods = {
        pp_millet_rotations_base = {
            manual_labor = 0.019
            produced = millet
            output = 0.095
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_rotations_no_cultivation = {
            category = building_maintenance
        }
        pp_millet_rotations_millet_fallow = {
            tools = 0.11
            horses = 0.085
            livestock = 0.072
            fiber_crops = 0.045
            manual_labor = 0.091
            produced = millet
            output = 1.04
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_millet_rotations_sorghum_cowpea = {
            tools = 0.1
            horses = 0.072
            legumes = 0.16
            pottery = 0.09
            manual_labor = 0.11
            produced = millet
            output = 1.08
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_millet_rotations_provision = {
            millet = 0.016
            produced = local_food
            output = 3.781
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_millet_rotations = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 3.094
        local_food_capacity = 50
        local_peasants_estate_power = 0.021
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    millet_rotations: Millet Rotation Farm
    millet_rotations_desc: Millet takes turns with fallow and pulses to keep thin soils working.
    millet_rotations_slot_0: Fields
    millet_rotations_slot_1: Cultivation
    millet_rotations_slot_2: Provisioning
    pp_millet_rotations_base: Fields
    pp_millet_rotations_no_cultivation: No Cultivation
    pp_millet_rotations_millet_fallow: Millet-Fallow Rotation
    pp_millet_rotations_millet_fallow_desc: Millet alternates with grazed and manured fallow.
    pp_millet_rotations_sorghum_cowpea: Sorghum and Cowpea Rotation
    pp_millet_rotations_sorghum_cowpea_desc: Sorghum and cowpeas take turns on the same fields.
    pp_millet_rotations_provision: Provision with Millet
    pp_millet_rotations_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/millet_rotations.png
  output_dds: millet_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_4_reformation (age_food.py, throughput x1.35) on top.
    output_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_4_reformation (age_food.py, throughput x1.35) on top.
  production_methods:
    pp_millet_rotations_base:
      production_efficiency: 1.0
    pp_millet_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_millet_rotations_millet_fallow:
      production_efficiency: 1.0
    pp_millet_rotations_sorghum_cowpea:
      production_efficiency: 1.0
    pp_millet_rotations_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
