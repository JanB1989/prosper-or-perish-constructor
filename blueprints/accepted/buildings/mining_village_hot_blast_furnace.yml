    mining_village_hot_blast_furnace_slot_0: Mineral Deposit
    mining_village_hot_blast_furnace_slot_1: Worked Mine
    mining_village_hot_blast_furnace_slot_2: Stone Haulage
    mining_village_hot_blast_furnace: Hot Blast Mining Village
    mining_village_hot_blast_furnace_desc: An upgraded mining settlement using hot blast furnace methods to raise metal and mineral throughput with heavier manufactured inputs and larger organized crews.
    pp_mining_village_hot_blast_furnace_base_coal: Coal Deposit
    pp_mining_village_hot_blast_furnace_base_coal_desc: "The coal seam itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_iron: Iron Deposit
    pp_mining_village_hot_blast_furnace_base_iron_desc: "The iron ore bed itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_copper: Copper Deposit
    pp_mining_village_hot_blast_furnace_base_copper_desc: "The copper lode itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_gold: Gold Deposit
    pp_mining_village_hot_blast_furnace_base_goods_gold_desc: "The gold-bearing ground itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_silver: Silver Deposit
    pp_mining_village_hot_blast_furnace_base_goods_silver_desc: "The silver vein itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_tin: Tin Deposit
    pp_mining_village_hot_blast_furnace_base_goods_tin_desc: "The tin ground itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_lead: Lead Deposit
    pp_mining_village_hot_blast_furnace_base_goods_lead_desc: "The galena vein itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_gems: Gem Deposit
    pp_mining_village_hot_blast_furnace_base_goods_gems_desc: "The gem-bearing gravel itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_alum: Alum Deposit
    pp_mining_village_hot_blast_furnace_base_goods_alum_desc: "The alum stone itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_mercury: Mercury Deposit
    pp_mining_village_hot_blast_furnace_base_goods_mercury_desc: "The cinnabar ore itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_base_goods_marble: Marble Deposit
    pp_mining_village_hot_blast_furnace_base_goods_marble_desc: "The marble bed itself: what the ground gives before the industrial workings add to it."
    pp_mining_village_hot_blast_furnace_coal: Hot Blast Furnace Coal Workings
    pp_mining_village_hot_blast_furnace_coal_desc: "Steam engines wind and pump the deep pits, safety lamps guard against firedamp, and iron rails carry the coal to canals and ports. The new hot-blast furnaces burn even raw coal, and the pits can hardly dig fast enough."
    pp_mining_village_hot_blast_furnace_iron: Hot Blast Furnace Iron Workings
    pp_mining_village_hot_blast_furnace_iron_desc: "The furnace air is heated in iron pipes before it is blown in, an invention from Scotland that sharply cut the fuel the furnace needs. Even raw coal and the local blackband ironstone now smelt well."
    pp_mining_village_hot_blast_furnace_copper: Hot Blast Furnace Copper Workings
    pp_mining_village_hot_blast_furnace_copper_desc: "Powerful steam engines pump the copper mines and wind the ore, and the furnaces burn coal by the shipload. Copper wire, sheathing and machine parts find ready buyers."
    pp_mining_village_hot_blast_furnace_goods_gold: Hot Blast Furnace Gold Workings
    pp_mining_village_hot_blast_furnace_goods_gold_desc: "Steam-driven stamps crush the vein rock and mercury-coated tables catch the gold. Engines pump the shafts and wind the ore, and every part of the work is larger than before."
    pp_mining_village_hot_blast_furnace_goods_silver: Hot Blast Furnace Silver Workings
    pp_mining_village_hot_blast_furnace_goods_silver_desc: "Engines drain and hoist the deep silver mines, and refiners try new ways to win silver from poor ores. The work is run like a factory, with large crews on fixed shifts."
    pp_mining_village_hot_blast_furnace_goods_tin: Hot Blast Furnace Tin Workings
    pp_mining_village_hot_blast_furnace_goods_tin_desc: "High-pressure Cornish engines pump the tin mines from great depths, and steam-driven stamps crush the ore. Much of the tin now goes into tinplate for cans and kitchenware."
    pp_mining_village_hot_blast_furnace_goods_lead: Hot Blast Furnace Lead Workings
    pp_mining_village_hot_blast_furnace_goods_lead_desc: "Steam engines and long drainage levels keep the lead mines working, and long flues from the furnaces catch lead fume that once blew away. Pipes, shot, paint and acid works across the industrial towns use the lead."
    pp_mining_village_hot_blast_furnace_goods_gems: Hot Blast Furnace Gem Workings
    pp_mining_village_hot_blast_furnace_goods_gems_desc: "Engines pump the gem pits and the gravel is washed in mechanical troughs, though the final picking stays careful handwork. New finds and steady trade keep the cutters of Amsterdam and Antwerp busy."
    pp_mining_village_hot_blast_furnace_goods_alum: Hot Blast Furnace Alum Workings
    pp_mining_village_hot_blast_furnace_goods_alum_desc: "Chemists learn to make alum from shale and clay with sulphuric acid, and the works grow large and coal-fired. The cloth mills of the age take all the mordant they can get."
    pp_mining_village_hot_blast_furnace_goods_mercury: Hot Blast Furnace Mercury Workings
    pp_mining_village_hot_blast_furnace_goods_mercury_desc: "Steam engines pump and hoist the cinnabar mines, and the furnaces run day and night to drive out the quicksilver. Silver refiners, hatters and instrument makers buy every flask."
    pp_mining_village_hot_blast_furnace_goods_marble: Hot Blast Furnace Marble Workings
    pp_mining_village_hot_blast_furnace_goods_marble_desc: "Water- and steam-driven saw frames cut marble into slabs, and wagons on better roads carry the blocks to the harbour. Cheaper slabs bring marble into banks, clubs and the houses of the well-to-do."
    mining_village_hot_blast_furnace_no_stone: No Stone Haulage
    mining_village_hot_blast_furnace_no_stone_desc: "No stone is carted from the workings here; the spoil heaps simply grow."
    mining_village_hot_blast_furnace_stone_horses: Horse-Drawn Stone
    mining_village_hot_blast_furnace_stone_horses_desc: "The bigger workings throw up more rock than ever, and horses on wagonways and roads carry the useful stone to the growing towns that want it for foundations and walls."
    mining_village_hot_blast_furnace_stone_livestock: Ox-Drawn Stone
    mining_village_hot_blast_furnace_stone_livestock_desc: "Ox wagons still serve the rough tracks of the hills, hauling stone from the mine tips to builders in places that horses on good roads or rails cannot reach."
    pp_mining_village_hot_blast_furnace_price: Hot Blast Mining Village Price
