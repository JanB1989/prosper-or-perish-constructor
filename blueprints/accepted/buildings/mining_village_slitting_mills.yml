    mining_village_slitting_mills_slot_1: Worked Mine
    mining_village_slitting_mills_slot_2: Stone Haulage
    mining_village_slitting_mills: Slitting Mill Mining Village
    mining_village_slitting_mills_desc: An upgraded mining settlement using slitting mills methods to raise metal and mineral throughput with heavier manufactured inputs and larger organized crews.
    pp_mining_village_slitting_mills_base_coal: Coal Deposit
    pp_mining_village_slitting_mills_base_coal_desc: "The coal seam itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_iron: Iron Deposit
    pp_mining_village_slitting_mills_base_iron_desc: "The iron ore bed itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_copper: Copper Deposit
    pp_mining_village_slitting_mills_base_copper_desc: "The copper lode itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_gold: Gold Deposit
    pp_mining_village_slitting_mills_base_goods_gold_desc: "The gold-bearing ground itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_silver: Silver Deposit
    pp_mining_village_slitting_mills_base_goods_silver_desc: "The silver vein itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_tin: Tin Deposit
    pp_mining_village_slitting_mills_base_goods_tin_desc: "The tin ground itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_lead: Lead Deposit
    pp_mining_village_slitting_mills_base_goods_lead_desc: "The galena vein itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_gems: Gem Deposit
    pp_mining_village_slitting_mills_base_goods_gems_desc: "The gem-bearing gravel itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_alum: Alum Deposit
    pp_mining_village_slitting_mills_base_goods_alum_desc: "The alum stone itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_mercury: Mercury Deposit
    pp_mining_village_slitting_mills_base_goods_mercury_desc: "The cinnabar ore itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_base_goods_marble: Marble Deposit
    pp_mining_village_slitting_mills_base_goods_marble_desc: "The marble bed itself: what the ground gives before the mill-driven workings add to it."
    pp_mining_village_slitting_mills_coal: Slitting Mills Coal Workings
    pp_mining_village_slitting_mills_coal_desc: "Horse gins wind coal from deeper shafts, and wooden wagonways carry it to the river or the coast. The coal now heats salt pans, breweries and the forges whose slitting mills cut iron into rods."
    pp_mining_village_slitting_mills_iron: Slitting Mills Iron Workings
    pp_mining_village_slitting_mills_iron_desc: "The charcoal furnace and its forges are joined by water-driven slitting mills that cut bar iron into rods for nails. The village digs, roasts and smelts more ore to keep this busier ironworks going, with horses hauling between the stages."
    pp_mining_village_slitting_mills_copper: Slitting Mills Copper Workings
    pp_mining_village_slitting_mills_copper_desc: "Horse whims hoist the ore and water wheels pump the shafts, so the copper lode is followed well below the old adits. Brass makers and gun founders take all the copper the village can smelt."
    pp_mining_village_slitting_mills_goods_gold: Slitting Mills Gold Workings
    pp_mining_village_slitting_mills_goods_gold_desc: "Crushed gold ore is ground with quicksilver in horse-driven mills, and the mercury takes up the fine gold that washing would lose. Heat then drives the mercury off and leaves the gold behind."
    pp_mining_village_slitting_mills_goods_silver: Slitting Mills Silver Workings
    pp_mining_village_slitting_mills_goods_silver_desc: "Silver ore is crushed, mixed with salt and quicksilver and left to work until the silver is taken up, and then the mercury is driven off. The method, first used on a large scale in New Spain, made poorer ores worth mining."
    pp_mining_village_slitting_mills_goods_tin: Slitting Mills Tin Workings
    pp_mining_village_slitting_mills_goods_tin_desc: "As the tin streams give out, miners follow the lodes underground, with horse whims to hoist and water wheels to drain. Stamps and long washing frames dress the ore before it is smelted."
    pp_mining_village_slitting_mills_goods_lead: Slitting Mills Lead Workings
    pp_mining_village_slitting_mills_goods_lead_desc: "Lead miners drive long drainage levels under the veins and set horse whims over the shafts. The more lead they raise, the more goes into roofing, glazing, pewter and musket shot."
    pp_mining_village_slitting_mills_goods_gems: Slitting Mills Gem Workings
    pp_mining_village_slitting_mills_goods_gems_desc: "Gem diggers work deeper pits with windlasses and horse gins and wash the gravel in larger pools. Diamonds from Golconda and rubies from Burma reach the courts of Asia and Europe in growing numbers."
    pp_mining_village_slitting_mills_goods_alum: Slitting Mills Alum Workings
    pp_mining_village_slitting_mills_goods_alum_desc: "The alum works grow into large boiling houses that burn great amounts of fuel to evaporate the liquor. In Yorkshire the alum makers even added urine to help the crystals form."
    pp_mining_village_slitting_mills_goods_mercury: Slitting Mills Mercury Workings
    pp_mining_village_slitting_mills_goods_mercury_desc: "Silver refining across the Spanish empire runs on quicksilver, and the cinnabar mines work deeper with horse whims and larger roasting furnaces. Almaden and Huancavelica fed the silver refiners of Mexico and Peru."
    pp_mining_village_slitting_mills_goods_marble: Slitting Mills Marble Workings
    pp_mining_village_slitting_mills_goods_marble_desc: "Quarrymen cut deeper into the marble beds and lower huge blocks down the slopes on ropes and greased sledges, where horse teams take them on. The marble ends up in Baroque altars, palaces and gardens."
    mining_village_slitting_mills_no_stone: No Stone Haulage
    mining_village_slitting_mills_no_stone_desc: "No stone is sold from the workings here; the spoil stays on the tips."
    mining_village_slitting_mills_stone_horses: Horse-Drawn Stone
    mining_village_slitting_mills_stone_horses_desc: "Horse wagons on improved roads carry stone from the workings to towns that are building in stone. The village sells what it would otherwise heap up on the spoil tips."
    mining_village_slitting_mills_stone_livestock: Ox-Drawn Stone
    mining_village_slitting_mills_stone_livestock_desc: "Teams of oxen haul stone from the spoil heaps along the valley roads. They move less in a day than horses, and they need far less fodder to keep them working."
    pp_mining_village_slitting_mills_price: Slitting Mill Mining Village Price
