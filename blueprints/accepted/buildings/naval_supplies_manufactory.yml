version: 2
tag: naval_supplies_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
gate_method: pp_naval_supplies_manufactory_market_sales
building:
  key: naval_supplies_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_naval_supplies_manufactory_naval_supplies_manufactory_maintenance
  - name: slot_1
    methods:
    - pp_naval_supplies_manufactory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 135
    category = weapons_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    obsolete = naval_supplies_workshop
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:naval_supplies_manufactory }
            add = {
                value = "market.market_price(goods:naval_supplies)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_naval_supplies_manufactory_naval_supplies_manufactory_maintenance = {
            lumber = 0.97
            fiber_crops = 0.72
            tar = 0.72
            cloth = 0.24
            manual_labor = 0.41
            produced = naval_supplies
            output = 1.6
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_naval_supplies_manufactory_market_sales = {
            offset = 0.012
            produced = naval_supplies
            output = 0.004
            category = building_maintenance
        }
    }
    custom_tags = {
        midgame_manufactory
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.26
localization:
  entries:
    naval_supplies_manufactory_slot_0: Naval Supplies Manufactory Work
    pp_naval_supplies_manufactory_naval_supplies_manufactory_maintenance: Naval Supplies Manufactory Naval Supplies Manufactory Maintenance
    pp_naval_supplies_manufactory_market_sales: Market Sales
    pp_naval_supplies_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    naval_supplies_manufactory_slot_1: Market
