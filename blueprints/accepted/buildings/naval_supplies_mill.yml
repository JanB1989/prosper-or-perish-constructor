  possible_production_methods: []
  body: |
    audio_tier = 5
    is_foreign = no
    pop_type = laborers
    is_mill = yes
    max_levels = mills_max_level
    startup_ramp_target = 1264
    category = weapons_industry_category
    employment_size = 1.0
    town = yes
    city = yes
    megalopolis = yes
    build_time = mills_build_time
    obsolete = naval_supplies_manufactory
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:naval_supplies_mill }
            add = {
                value = "market.market_price(goods:naval_supplies)"
                multiply = 0.64000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_naval_supplies_mill_naval_supplies_mill_maintenance = {
            lumber = 2.19
            fiber_crops = 1.64
            tar = 1.64
            cloth = 0.27
            manual_labor = 0.51
            produced = naval_supplies
            output = 3.2
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
    }
    unique_production_methods = {
        pp_naval_supplies_mill_market_sales = {
            offset = 0.012
            produced = naval_supplies
            output = 0.004
            category = building_maintenance
        }
    }
    custom_tags = {
        lategame_manufactory
    }
    construction_demand = mill_construction
    raw_modifier = {
        local_burghers_desired_pop = 0.05
    }
    increase_per_level_cost = 0.26
