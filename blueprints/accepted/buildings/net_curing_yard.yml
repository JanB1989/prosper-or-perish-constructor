localization:
  entries:
    net_curing_yard: Net and Curing Yard
    net_curing_yard_desc: Net and curing yards gather hemp nets, salting tables, drying racks, and small stores so village fishers can preserve more catch.
    net_curing_yard_slot_0: Fishing Grounds
    net_curing_yard_slot_1: Preserved Catch
    net_curing_yard_slot_2: Fishing Method
    net_curing_yard_slot_3: Freshwater Works
    net_curing_yard_slot_4: Provisioning
    pp_net_curing_yards: Net and Curing Yards
    pp_net_curing_yards_desc: Shared hemp nets, salting tables, drying racks, and packing stores help village fishers preserve more catch before it spoils.
    pp_net_curing_yard_base_fish: Fishing Grounds
    pp_net_curing_yard_no_primary: No Preserved Catch
    pp_net_curing_yard_preserved_catch: Preserved Catch
    pp_arctic_net_curing_yard_preserved_catch: Arctic Preserved Catch
    pp_net_curing_yard_strand_line: Handline Fishing
    pp_net_curing_yard_clinker_craft: Clinker Boats
    pp_net_curing_yard_no_freshwater_works: No Freshwater Works
    pp_net_curing_yard_wattle_weirs: Wattle Fish Weirs
    pp_net_curing_yard_stew_ponds: Stew Ponds
    pp_net_curing_yard_provision: Provision with Fish
    pp_net_curing_yard_provision_desc: The household buys its own catch back and cooks for the province. Worth it while the province store is low and the good is cheap.
    pp_net_curing_yard_sell_surplus: Sell the Surplus
    pp_net_curing_yard_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
icon:
  source_png: ../assets/icons/net_curing_yard.png
  output_dds: net_curing_yard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game building icon for a Net and Curing Yard on a perfectly flat magenta chroma-key background (#ff00ff). Center a compact riverside or shore fish yard with hemp nets drying on racks, salting tables, pottery crocks, small barrels, fish baskets, knives, and a simple covered curing shed. Use detailed historic bitmap cutout style, material-rich painterly brushwork, three-quarter view, readable fishing props, weathered wood, white salt, tan nets, silver fish, no text, no frame, no modern boats, no scenic landscape.

evaluation:
  production_methods:
    pp_net_curing_yard_base_fish:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Passive fishing-ground methods have little direct input cost; preserved catch carries the tier economy.
        base_output_per_1k: Early fish successor keeps passive output low; preserved catch carries the tier economy.
    pp_net_curing_yard_no_primary:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally produces no primary catch.
    pp_net_curing_yard_preserved_catch:
      production_efficiency: 1.05
      allow_rules:
        input_throughput: Net and curing yards are an age 2 local-fishing upgrade and intentionally stay below coastal fisheries.
        output_throughput: Net and curing yards are an age 2 local-fishing upgrade and intentionally stay below coastal fisheries.
    pp_arctic_net_curing_yard_preserved_catch:
      production_efficiency: 1.10
      allow_rules:
        profit_percent: Arctic preserved catch is an accepted regional fallback with high apparent margin from low direct input cost.
        input_throughput: Arctic preserved catch remains a lower-throughput regional fallback.
        output_throughput: Arctic preserved catch remains a lower-throughput regional fallback.
    pp_net_curing_yard_strand_line:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally leaves fishing method unchanged.
    pp_net_curing_yard_clinker_craft:
      production_efficiency: 1.05
      allow_rules:
        input_throughput: Auxiliary craft improvements intentionally stay below primary catch throughput.
        output_throughput: Auxiliary craft improvements intentionally stay below primary catch throughput.
    pp_net_curing_yard_no_freshwater_works:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally leaves freshwater works unchanged.
    pp_net_curing_yard_wattle_weirs:
      production_efficiency: 1.10
      allow_rules:
        input_throughput: Freshwater works are auxiliary methods and intentionally stay below primary catch throughput.
        output_throughput: Freshwater works are auxiliary methods and intentionally stay below primary catch throughput.
    pp_net_curing_yard_stew_ponds:
      production_efficiency: 1.10
      allow_rules:
        input_throughput: Freshwater works are auxiliary methods and intentionally stay below primary catch throughput.
        output_throughput: Freshwater works are auxiliary methods and intentionally stay below primary catch throughput.
    pp_net_curing_yard_provision:
      allow_rules:
        profit_percent: Provisioning loses money at the Province Food floor by design; the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_net_curing_yard_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
