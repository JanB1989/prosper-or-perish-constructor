version: 2
tag: nursery_orchard
age_food_throughput: 1.15
footprint: farm_land
labour:
  class: primary_discovery
  methods:
    pp_nursery_orchard_base_fruit: base
    pp_nursery_orchard_provision: keep
gate_method: pp_nursery_orchard_market_sales
upgrade_chain:
  family: fruit_orchard
  tier: 1
  previous: fruit_orchard
  next: pomological_orchard
  unlock_advance: pp_orchard_nurseries
building:
  key: nursery_orchard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_nursery_orchard_base_fruit
  - name: slot_1
    methods:
    - pp_nursery_orchard_no_beekeeping
    - pp_nursery_orchard_yard_hives
  - name: slot_2
    methods:
    - pp_nursery_orchard_no_primary
    - pp_nursery_orchard_nursery_rows
  - name: slot_3
    methods:
    - pp_nursery_orchard_provision
  - name: slot_4
    methods:
    - pp_nursery_orchard_market_sales
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.15
    pop_type = peasants
    max_levels = farm_capacity_max_nursery_orchard
    employment_size = 1.25
    category = rgo_building_category
    custom_tags = { pp_food_security_priority pp_staple_food_priority farming_capacity }
    icon = nursery_orchard
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = fruit_orchard
    # AI (age_food.py): build the upgrade where its predecessor stands; the engine scores a replacement
    # with a near-zero upgrade utility, so the weight carries it
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:fruit_orchard } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        OR = {
            pp_wb_setup_fruit_orchard_location = yes   # vanilla setup orchards the geography would reject
            var:pp_fruit_orchard_eligible > 0
            AND = {
                NOT = { has_variable = pp_fruit_orchard_eligible }
                pp_fruit_orchard_location_potential = yes
            }
        }
    }

    unique_production_methods = {
        pp_nursery_orchard_base_fruit = {
            manual_labor = 0.02
            produced = fruit
            output = 0.098
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_nursery_orchard_no_beekeeping = {
            category = building_maintenance
        }
        pp_nursery_orchard_yard_hives = {
            fiber_crops = 0.025
            pottery = 0.011
            manual_labor = 0.009
            produced = beeswax
            output = 0.138
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_nursery_orchard_no_primary = {
            category = building_maintenance
        }
        pp_nursery_orchard_nursery_rows = {
            produced = fruit
            output = 0.632
            fiber_crops = 0.102 # osier baskets, graft ties, harvest mats
            pottery = 0.106 # earthen nursery pots and storage crocks (more pots: seedlings raised in pots)
            tools = 0.016 # pruning and grafting knives (an accelerant, a small share)
            furniture = 0.024 # sorting racks and apple-loft boards
            manual_labor = 0.07
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_nursery_orchard_provision = {
            fruit = 0.131
            produced = local_food
            output = 1.568
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_nursery_orchard_market_sales = {
            offset = 0.01
            produced = fruit
            output = 0.01
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_nursery_orchard = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 3.5
        local_food_capacity = 50
    }
advancements:
- key: pp_orchard_nurseries
  body: |-
    icon = nursery_orchard
    age = age_3_discovery
    requires = rgo_logistics_discovery
    unlock_building = nursery_orchard
    ai_weight = { add = 125 }
localization:
  entries:
    nursery_orchard: Nursery Orchard
    nursery_orchard_desc: Nursery orchards use young tree rows, waxed grafts, baskets, and storage crocks to replace poor trees and steady fruit harvests.
    nursery_orchard_slot_0: Fruit Trees
    nursery_orchard_slot_1: Beekeeping
    nursery_orchard_slot_2: Nursery Rows
    nursery_orchard_slot_3: Provisioning
    nursery_orchard_slot_4: Market
    pp_orchard_nurseries: Orchard Nurseries
    pp_orchard_nurseries_desc: Nursery rows, waxed grafts, and careful basket handling let village orchards replace poor trees and bring steadier fruit to market.
    pp_nursery_orchard_base_fruit: Fruit Trees
    pp_nursery_orchard_nursery_rows: Nursery Rows
    pp_nursery_orchard_no_primary: No Nursery Rows
    pp_nursery_orchard_no_beekeeping: No Beekeeping
    pp_nursery_orchard_yard_hives: Yard Hives
    pp_nursery_orchard_yard_hives_desc: Rows of hives stand between the young trees, so the nursery blossom sets well and the wax comes in with the fruit.
    pp_nursery_orchard_provision: Provision with Fruit
    pp_nursery_orchard_provision_desc: The household buys its own fruit back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_nursery_orchard_market_sales: Market Sales
    pp_nursery_orchard_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
icon:
  source_png: ../assets/icons/nursery_orchard.png
  output_dds: nursery_orchard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game building icon for a Nursery Orchard on a perfectly flat magenta chroma-key background (#ff00ff). Center young fruit tree nursery rows with grafted saplings, waxed grafts, pruning knives, woven baskets, pottery crocks, fruit crates, and a small rustic sorting rack. Use detailed historic bitmap cutout style, material-rich painterly brushwork, three-quarter view, readable orchard props, apple reds, leaf greens, clay browns, no text, no frame, no modern machinery, no scenic landscape.
evaluation:
  allow_rules:
    input_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
    output_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
  production_methods:
    pp_nursery_orchard_base_fruit:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Passive orchard methods have little direct input cost; nursery rows carry the tier economy.
        base_output_per_1k: Early orchard successor keeps passive fruit below full-building throughput; worked methods carry the tier economy.
    pp_nursery_orchard_no_primary:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Empty selector method intentionally produces no nursery-row output.
    pp_nursery_orchard_nursery_rows:
      production_efficiency: 1.05
      allow_rules:
        profit_percent: Nursery rows intentionally sit just above the generic profit band as the worked orchard bridge method.
        input_throughput: Nursery orchards are a modest age 3 bridge and intentionally stay below later grafted orchards.
        output_throughput: Nursery orchards are a modest age 3 bridge and intentionally stay below later grafted orchards.
    pp_nursery_orchard_no_beekeeping:
      production_efficiency: 1.0
    pp_nursery_orchard_yard_hives:
      production_efficiency: 1.05
      allow_rules:
        profit_percent: Household sidelines can sit outside the narrow margin band; the worked orchard methods carry the tier balance.
        input_throughput: Yard hives are an auxiliary output and intentionally stay below full-building throughput.
        output_throughput: Yard hives are an auxiliary output and intentionally stay below full-building throughput.
    pp_nursery_orchard_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_nursery_orchard_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
