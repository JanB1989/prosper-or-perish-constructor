    ocean_fishery_desc: Coastal crews work small boats, nets, curing barrels, and shore landings. They supply nearby markets from familiar waters.
    pp_ocean_fishery_base_catch: Coastal Waters
    pp_ocean_fishery_no_coastal_gear: No Coastal Gear
    pp_ocean_fishery_coastal_boats: Coastal Boats
    pp_ocean_fishery_provision: Provision with Fish
    pp_ocean_fishery_provision_desc: The household buys its own catch back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_ocean_fishery_market_sales: Market Sales
    pp_ocean_fishery_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
