      max: 1.90
    amortization_months:
      max: 900
  production_methods:
    pp_offshore_fishery_base_catch:
      production_efficiency: 1.00
      allow_rules:
        amortization_months: Method payback intentionally sits outside the global building-payback target after error-log profit tuning.
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_offshore_fishery_herring_busses:
      production_efficiency: 1.15
      allow_rules:
        input_throughput: Herring busses keep a lower gear profile after repeated fish-output tuning, with most salt demand shifted into hull and net inputs.
        output_throughput: Herring busses are now the age 4 offshore entry tier and intentionally stay below later schooners and steam trawlers.
    pp_offshore_fishery_distant_water_schooners:
      production_efficiency: 1.05
      allow_rules:
        amortization_months: Age 5 schooners use heavier fleet stores and may repay slowly while staying below the steam trawler tier.
    pp_offshore_fishery_steam_trawlers:
      production_efficiency: 1.05
      allow_rules:
        input_throughput: Steam trawlers keep a pre-steel-tool input profile while becoming the clear late offshore fishing tier.
        output_throughput: Late-game offshore fish output is capped below generic laborer throughput while staying above schooners.
    pp_offshore_fishery_worker_victuals:
      production_efficiency: 1.00
      allow_rules:
        base_output_per_1k: Auxiliary worker victuals are sized from configured worker food need rather than the global no-input output band.
