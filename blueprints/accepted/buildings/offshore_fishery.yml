    pp_offshore_fishery_provision: Provision with Fish
    pp_offshore_fishery_provision_desc: The household buys its own catch back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_offshore_fishery_market_sales: Market Sales
    pp_offshore_fishery_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
