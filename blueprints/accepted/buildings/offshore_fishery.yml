  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for an offshore fishery, transparent background. Center a larger historical fishing fleet with a herring buss, distant-water schooner, trawl gear, salt barrels, provision crates, and choppy open sea. Use readable painterly shapes, softly outlined historical UI art, muted sea blues, weathered wood, tan nets, silver fish, white salt sacks, no text, no frame, not photorealistic, not cartoonish.

evaluation:
  allow_rules:
    input_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
    output_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
  bands:
    output_gold_per_1k:
      max: 2.56
    amortization_months:
      max: 900
  production_methods:
    pp_offshore_fishery_base_catch:
      production_efficiency: 1.00
      allow_rules:
        amortization_months: Method payback intentionally sits outside the global building-payback target after error-log profit tuning.
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_offshore_fishery_herring_busses:
      production_efficiency: 1.15
      allow_rules:
        input_throughput: Herring busses keep a lower gear profile after repeated fish-output tuning, with most salt demand shifted into hull and net inputs.
        output_throughput: Herring busses are now the age 4 offshore entry tier and intentionally stay below later schooners and steam trawlers.
    pp_offshore_fishery_distant_water_schooners:
      production_efficiency: 1.05
      allow_rules:
        amortization_months: Age 5 schooners use heavier fleet stores and may repay slowly while staying below the steam trawler tier.
    pp_offshore_fishery_steam_trawlers:
      production_efficiency: 1.05
      allow_rules:
        input_throughput: Steam trawlers keep a pre-steel-tool input profile while becoming the clear late offshore fishing tier.
        output_throughput: Late-game offshore fish output is capped below generic laborer throughput while staying above schooners.
    pp_offshore_fishery_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_offshore_fishery_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
