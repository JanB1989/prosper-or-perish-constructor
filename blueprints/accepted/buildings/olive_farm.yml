version: 2
tag: olive_farm
output_tag: olive_farm_tier0
footprint: farm_land
labour:
  class: primary_medieval
  methods:
    pp_olive_farm_base: base
    pp_olive_farm_pruned_grove: hand_work
    pp_olive_farm_provision: keep
gate_method: pp_olive_farm_provision
upgrade_chain:
  family: olive_farm
  tier: 0
  previous: null
  next: olive_farmstead
  unlock_advance: null
building:
  key: olive_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_olive_farm_base
  - name: slot_1
    methods:
    - pp_olive_farm_no_cultivation
    - pp_olive_farm_pruned_grove
    - pp_olive_farm_terraced_grove
  - name: slot_2
    methods:
    - pp_olive_farm_provision
  possible_production_methods: []
  body: |-
    audio_tier = 1
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.15
    max_levels = farm_capacity_max_olive_farm
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = olive_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    build_time = village_build_time
    construction_demand = village_construction

    location_potential = {
        pp_olive_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_olive_native_country = yes
            has_advance = pp_olives_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:olives)"
                divide = "default_price(goods:olives)"
                multiply = { value = 1 add = modifier:local_olives_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_olive_farm_base = {
            manual_labor = 0.012
            produced = olives
            output = 0.06
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_olive_farm_pruned_grove = {
            tools = 0.004
            manual_labor = 0.01
            produced = olives
            output = 0.1
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_olive_farm_terraced_grove = {
            livestock = 0.01
            stone = 0.016
            manual_labor = 0.006
            produced = olives
            output = 0.11
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_farm_provision = {
            olives = 0.01
            produced = local_food
            output = 1.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_olive_farm = -1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_pp_farm_levels = 1
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.04
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_soldiers_desired_pop = 0
    }
advancements:
- key: pp_olives_farm_advance_general
  body: |-
    age = age_4_reformation
    requires = global_trade_advance
    ai_weight = { add = 50 }
    potential = {
        exists = capital
        NOT = {
            original_capital ?= {
                OR = {
                    sub_continent = sub_continent:middle_east
                    sub_continent = sub_continent:north_africa
                    region = region:balkan_region
                    region = region:france_region
                    region = region:iberia_region
                    region = region:italy_region
                }
            }
        }
    }
localization:
  entries:
    olive_farm: Olive Grove
    olive_farm_desc: Households prune and harvest olive trees on dry hillsides.
    olive_farm_slot_0: Groves
    olive_farm_slot_1: Cultivation
    olive_farm_slot_2: Provisioning
    pp_olive_farm_base: Groves
    pp_olive_farm_no_cultivation: No Cultivation
    pp_olive_farm_pruned_grove: Pruned Grove
    pp_olive_farm_pruned_grove_desc: Old trees are pruned and harvested by hand.
    pp_olive_farm_terraced_grove: Terraced Grove
    pp_olive_farm_terraced_grove_desc: Stone terraces hold soil and water around the trees.
    pp_olive_farm_provision: Provision with Olives
    pp_olive_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_olives_farm_advance_general: Olive Cultivation
    pp_olives_farm_advance_general_desc: Adopt olive cultivation through trade and regional exchange.
icon:
  source_png: ../assets/icons/olive_farm.png
  output_dds: olive_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_olive_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_olive_farm_no_cultivation:
      production_efficiency: 1.0
    pp_olive_farm_pruned_grove:
      production_efficiency: 1.05
    pp_olive_farm_terraced_grove:
      production_efficiency: 1.05
    pp_olive_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
