localization:
  entries:
    olive_farm: Olive Grove
    olive_farm_desc: Households prune and harvest olive trees on dry hillsides.
    olive_farm_slot_0: Groves
    olive_farm_slot_1: Cultivation
    olive_farm_slot_2: Beekeeping
    olive_farm_slot_3: Provisioning
    pp_olive_farm_base: Groves
    pp_olive_farm_no_cultivation: No Cultivation
    pp_olive_farm_pruned_grove: Pruned Grove
    pp_olive_farm_pruned_grove_desc: Old trees are pruned and harvested by hand.
    pp_olive_farm_terraced_grove: Terraced Grove
    pp_olive_farm_terraced_grove_desc: Stone terraces hold soil and water around the trees.
    pp_olive_farm_no_beekeeping: No Beekeeping
    pp_olive_farm_cottage_hives: Cottage Hives
    pp_olive_farm_cottage_hives_desc: A few skeps stand by orchards and hedges, tended in spare moments between fieldwork. Beekeeping is a modest household sideline, valued but never the village's main concern.
    pp_olive_farm_provision: Provision with Olives
    pp_olive_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_olive_farm_sell_surplus: Sell the Surplus
    pp_olive_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
    pp_olives_farm_advance_general: Olive Cultivation
    pp_olives_farm_advance_general_desc: Adopt olive cultivation through trade and regional exchange.
