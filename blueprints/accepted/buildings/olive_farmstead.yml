version: 2
tag: olive_farmstead
output_tag: olive_farm_tier1
footprint: farm_land
labour:
  class: primary_discovery
  methods:
    pp_olive_farmstead_base: base
    pp_olive_farmstead_provision: keep
gate_method: pp_olive_farmstead_provision
upgrade_chain:
  family: olive_farm
  tier: 1
  previous: olive_farm
  next: olive_rotations
  unlock_advance: pp_manuring_and_seed_stores
building:
  key: olive_farmstead
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_olive_farmstead_base
  - name: slot_1
    methods:
    - pp_olive_farmstead_no_cultivation
    - pp_olive_farmstead_manured_grove
  - name: slot_2
    methods:
    - pp_olive_farmstead_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.15
    max_levels = farm_capacity_max_olive_farmstead
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = olive_farmstead
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = olive_farm
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_olive_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_olive_native_country = yes
            has_advance = pp_olives_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:olives)"
                divide = "default_price(goods:olives)"
                multiply = { value = 1 add = modifier:local_olives_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:olive_farm } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }

    unique_production_methods = {
        pp_olive_farmstead_base = {
            manual_labor = 0.018
            produced = olives
            output = 0.092
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_farmstead_no_cultivation = {
            category = building_maintenance
        }
        pp_olive_farmstead_manured_grove = {
            livestock = 0.074
            tools = 0.029
            lumber = 0.045
            pottery = 0.087
            manual_labor = 0.061
            produced = olives
            output = 0.678
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_farmstead_provision = {
            olives = 0.015
            produced = local_food
            output = 2.3
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_olive_farmstead = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 3.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.03
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    olive_farmstead: Olive Farmstead
    olive_farmstead_desc: Manured groves and a small press turn the harvest into stored oil.
    olive_farmstead_slot_0: Groves
    olive_farmstead_slot_1: Cultivation
    olive_farmstead_slot_2: Provisioning
    pp_olive_farmstead_base: Groves
    pp_olive_farmstead_no_cultivation: No Cultivation
    pp_olive_farmstead_manured_grove: Manured Grove and Press
    pp_olive_farmstead_manured_grove_desc: Manured trees and a small press turn the fruit into oil.
    pp_olive_farmstead_provision: Provision with Olives
    pp_olive_farmstead_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/olive_farmstead.png
  output_dds: olive_farmstead.dds
  size: 512
evaluation:
  allow_rules:
    profit_percent: Passive selectors, no-output options, and household sidelines can sit outside the narrow margin band; worked farmstead methods carry the tier balance.
    base_output_per_1k: Early farmstead selectors keep passive food output small; worked crop methods carry the tier economy.
    input_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
    output_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
  production_methods:
    pp_olive_farmstead_base:
      production_efficiency: 1.0
    pp_olive_farmstead_no_cultivation:
      production_efficiency: 1.0
    pp_olive_farmstead_manured_grove:
      production_efficiency: 1.05
    pp_olive_farmstead_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
