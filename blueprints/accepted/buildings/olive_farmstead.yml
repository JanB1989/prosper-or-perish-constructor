localization:
  entries:
    olive_farmstead: Olive Farmstead
    olive_farmstead_desc: Manured groves and a small press turn the harvest into stored oil.
    olive_farmstead_slot_0: Groves
    olive_farmstead_slot_1: Cultivation
    olive_farmstead_slot_2: Beekeeping
    olive_farmstead_slot_3: Provisioning
    pp_olive_farmstead_base: Groves
    pp_olive_farmstead_no_cultivation: No Cultivation
    pp_olive_farmstead_manured_grove: Manured Grove and Press
    pp_olive_farmstead_manured_grove_desc: Manured trees and a small press turn the fruit into oil.
    pp_olive_farmstead_no_beekeeping: No Beekeeping
    pp_olive_farmstead_yard_hives: Yard Hives
    pp_olive_farmstead_provision: Provision with Olives
    pp_olive_farmstead_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_olive_farmstead_sell_surplus: Sell the Surplus
    pp_olive_farmstead_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
