localization:
  entries:
    olive_model_farm: Olive Model Estate
    olive_model_farm_desc: Beam presses, oil stores and hired hands work the groves as one managed estate.
    olive_model_farm_slot_0: Groves
    olive_model_farm_slot_1: Cultivation
    olive_model_farm_slot_2: Provisioning
    pp_olive_model_farm_base: Groves
    pp_olive_model_farm_no_cultivation: No Cultivation
    pp_olive_model_farm_beam_press: Beam-Press Estate
    pp_olive_model_farm_beam_press_desc: Beam presses and oil stores serve the whole estate.
    pp_olive_model_farm_provision: Provision with Olives
    pp_olive_model_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_olive_model_farm_sell_surplus: Sell the Surplus
    pp_olive_model_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
