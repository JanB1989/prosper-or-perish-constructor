version: 2
tag: olive_model_farm
output_tag: olive_farm_tier3
footprint: farm_land
labour:
  class: primary_absolutism
  methods:
    pp_olive_model_farm_base: base
    pp_olive_model_farm_provision: keep
gate_method: pp_olive_model_farm_provision
upgrade_chain:
  family: olive_farm
  tier: 3
  previous: olive_rotations
  next: null
  unlock_advance: pp_model_farm
building:
  key: olive_model_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_olive_model_farm_base
  - name: slot_1
    methods:
    - pp_olive_model_farm_no_cultivation
    - pp_olive_model_farm_beam_press
  - name: slot_2
    methods:
    - pp_olive_model_farm_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.15
    max_levels = farm_capacity_max_olive_model_farm
    pop_type = laborers
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = olive_model_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = olive_rotations
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_olive_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_olive_native_country = yes
            has_advance = pp_olives_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:olives)"
                divide = "default_price(goods:olives)"
                multiply = { value = 1 add = modifier:local_olives_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_olive_model_farm_base = {
            manual_labor = 0.02
            produced = olives
            output = 0.1
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_model_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_olive_model_farm_beam_press = {
            tools = 0.19
            livestock = 0.24
            lumber = 0.17
            pottery = 0.47
            manual_labor = 0.15
            produced = olives
            output = 2.09
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_model_farm_provision = {
            olives = 0.017
            produced = local_food
            output = 2.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_olive_model_farm = -1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_pp_farm_levels = 1
        local_monthly_food = 3
        local_food_capacity = 50
        local_laborers_desired_pop = 0.002
    }
localization:
  entries:
    olive_model_farm: Olive Model Estate
    olive_model_farm_desc: Beam presses, oil stores and hired hands work the groves as one managed estate.
    olive_model_farm_slot_0: Groves
    olive_model_farm_slot_1: Cultivation
    olive_model_farm_slot_2: Provisioning
    pp_olive_model_farm_base: Groves
    pp_olive_model_farm_no_cultivation: No Cultivation
    pp_olive_model_farm_beam_press: Beam-Press Estate
    pp_olive_model_farm_beam_press_desc: Beam presses and oil stores serve the whole estate.
    pp_olive_model_farm_provision: Provision with Olives
    pp_olive_model_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/olive_model_farm.png
  output_dds: olive_model_farm.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The 10k laborer model farm keeps a slower estate-improvement payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_olive_model_farm_base:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_olive_model_farm_no_cultivation:
      production_efficiency: 1.0
    pp_olive_model_farm_beam_press:
      production_efficiency: 1.0
    pp_olive_model_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
