localization:
  entries:
    olive_rotations: Olive Estate
    olive_rotations_desc: Grafted trees and tended terraces make the groves bear more evenly.
    olive_rotations_slot_0: Groves
    olive_rotations_slot_1: Cultivation
    olive_rotations_slot_2: Beekeeping
    olive_rotations_slot_3: Provisioning
    pp_olive_rotations_base: Groves
    pp_olive_rotations_no_cultivation: No Cultivation
    pp_olive_rotations_grafted_grove: Grafted Grove
    pp_olive_rotations_grafted_grove_desc: Grafted trees bear more and oil jars keep the pressing.
    pp_olive_rotations_irrigated_grove: Irrigated Grove
    pp_olive_rotations_irrigated_grove_desc: Channels and cisterns water the trees through the dry season.
    pp_olive_rotations_no_beekeeping: No Beekeeping
    pp_olive_rotations_hedgerow_hives: Hedgerow Hives
    pp_olive_rotations_hedgerow_hives_desc: Cottage hives line hedges and orchard edges, adding wax from the same improved field boundaries.
    pp_olive_rotations_provision: Provision with Olives
    pp_olive_rotations_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_olive_rotations_sell_surplus: Sell the Surplus
    pp_olive_rotations_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
