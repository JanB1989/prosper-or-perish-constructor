version: 2
tag: olive_rotations
output_tag: olive_farm_tier2
footprint: farm_land
labour:
  class: primary_reformation
  methods:
    pp_olive_rotations_base: base
    pp_olive_rotations_provision: keep
gate_method: pp_olive_rotations_provision
upgrade_chain:
  family: olive_farm
  tier: 2
  previous: olive_farmstead
  next: olive_model_farm
  unlock_advance: pp_farming_village_rotations
building:
  key: olive_rotations
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_olive_rotations_base
  - name: slot_1
    methods:
    - pp_olive_rotations_no_cultivation
    - pp_olive_rotations_grafted_grove
    - pp_olive_rotations_irrigated_grove
  - name: slot_2
    methods:
    - pp_olive_rotations_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.15
    max_levels = farm_capacity_max_olive_rotations
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = olive_rotations
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = olive_farmstead
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_olive_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_olive_native_country = yes
            has_advance = pp_olives_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:olives)"
                divide = "default_price(goods:olives)"
                multiply = { value = 1 add = modifier:local_olives_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:olive_farmstead } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_olive_rotations_base = {
            manual_labor = 0.019
            produced = olives
            output = 0.095
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_rotations_no_cultivation = {
            category = building_maintenance
        }
        pp_olive_rotations_grafted_grove = {
            tools = 0.23
            livestock = 0.26
            lumber = 0.13
            pottery = 0.24
            manual_labor = 0.21
            produced = olives
            output = 2.08
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_olive_rotations_irrigated_grove = {
            tools = 0.2
            livestock = 0.22
            lumber = 0.22
            clay = 0.47
            manual_labor = 0.2
            produced = olives
            output = 2.16
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_olive_rotations_provision = {
            olives = 0.016
            produced = local_food
            output = 2.375
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_olive_rotations = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 4.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.021
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    olive_rotations: Olive Estate
    olive_rotations_desc: Grafted trees and tended terraces make the groves bear more evenly.
    olive_rotations_slot_0: Groves
    olive_rotations_slot_1: Cultivation
    olive_rotations_slot_2: Provisioning
    pp_olive_rotations_base: Groves
    pp_olive_rotations_no_cultivation: No Cultivation
    pp_olive_rotations_grafted_grove: Grafted Grove
    pp_olive_rotations_grafted_grove_desc: Grafted trees bear more and oil jars keep the pressing.
    pp_olive_rotations_irrigated_grove: Irrigated Grove
    pp_olive_rotations_irrigated_grove_desc: Channels and cisterns water the trees through the dry season.
    pp_olive_rotations_provision: Provision with Olives
    pp_olive_rotations_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/olive_rotations.png
  output_dds: olive_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
    output_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
  production_methods:
    pp_olive_rotations_base:
      production_efficiency: 1.0
    pp_olive_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_olive_rotations_grafted_grove:
      production_efficiency: 1.0
    pp_olive_rotations_irrigated_grove:
      production_efficiency: 1.0
    pp_olive_rotations_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
