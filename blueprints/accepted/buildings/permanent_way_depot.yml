  prompt: EU5-inspired hand-painted strategy-game building icon for a Permanent Way Depot, transparent background. Center a railway maintenance depot with stacked rails, timber sleepers, ballast piles, tool shed, hand trolley, coal and steel stock, and a short track section. Painterly historical UI art matching water_sawmill and lumber_mill_improved, three-quarter view, readable at low resolution, no text, no frame, not photorealistic, not cartoonish.
evaluation:
  allow_rules:
    profit_percent: Maintenance-only railway infrastructure consumes supplies while its payoff is carried by location modifiers.
    input_throughput: Permanent way depots intentionally use light staffing while upkeep is paid through goods maintenance.
    output_throughput: Permanent way depots provide road and rail effects rather than direct goods output.
