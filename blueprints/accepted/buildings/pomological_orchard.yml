localization:
  entries:
    pomological_orchard: Grafted Orchard
    pomological_orchard_desc: Grafted orchards use nursery stock, pruning, trellises, and cultivar records to raise more reliable fruit crops.
    pomological_orchard_slot_0: Fruit Trees
    pomological_orchard_slot_1: Grafted Rows
    pomological_orchard_slot_2: Household Food
    pp_pomological_orchard: Grafted Orchards
    pp_pomological_orchard_base_fruit: Fruit Trees
    pp_pomological_orchard_desc: Grafting, nursery records, and planned orchard rows increase fruit harvests through better management.
    pp_pomological_orchard_grafted_rows: Grafted Rows
    pp_pomological_orchard_no_primary: No Grafted Rows
    pp_pomological_orchard_no_worker_victuals: No Household Victuals
    pp_pomological_orchard_worker_victuals: Household Victuals
icon:
  source_png: ../assets/icons/pomological_orchard.png
  output_dds: pomological_orchard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a Pomological Orchard, transparent background. Center orderly rows of grafted fruit trees, pruning ladders, wooden trellises, crates of apples and pears, and a small nursery shed with paper ledgers. Warm daylight, early modern agricultural science, no text, no frame, no modern machinery, no steel factory imagery.

evaluation:
  allow_rules:
    amortization_months: Upgraded former-food producer keeps a slower payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_pomological_orchard_base_fruit:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Passive orchard methods have little direct input cost; grafted rows carry the tier economy.
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_pomological_orchard_no_primary:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally produces no grafted-row output.
    pp_pomological_orchard_grafted_rows:
      production_efficiency: 1.00
    pp_pomological_orchard_no_worker_victuals:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Empty selector method intentionally produces no household victuals.
    pp_pomological_orchard_worker_victuals:
      production_efficiency: 1.00
      allow_rules:
        profit_percent: Household victuals are auxiliary worker food, not a standalone profit method.
        base_output_per_1k: Auxiliary worker victuals are sized from configured worker food need rather than the global no-input output band.
