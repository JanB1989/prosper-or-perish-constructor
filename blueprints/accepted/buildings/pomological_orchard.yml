version: 2
tag: pomological_orchard
age_food_throughput: 1.45
footprint: farm_land
labour:
  class: primary_absolutism
  methods:
    pp_pomological_orchard_base_fruit: base
    pp_pomological_orchard_hedgerow_hives: primary_reformation
    pp_pomological_orchard_provision: keep
gate_method: pp_pomological_orchard_market_sales
upgrade_chain:
  family: fruit_orchard
  tier: 2
  previous: nursery_orchard
  next: null
  unlock_advance: pp_pomological_orchard
building:
  key: pomological_orchard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_pomological_orchard_base_fruit
  - name: slot_1
    methods:
    - pp_pomological_orchard_no_beekeeping
    - pp_pomological_orchard_hedgerow_hives
  - name: slot_2
    methods:
    - pp_pomological_orchard_no_primary
    - pp_pomological_orchard_grafted_rows
  - name: slot_3
    methods:
    - pp_pomological_orchard_provision
  - name: slot_4
    methods:
    - pp_pomological_orchard_market_sales
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.15
    pop_type = laborers
    max_levels = farm_capacity_max_pomological_orchard
    employment_size = 1
    category = rgo_building_category
    custom_tags = { pp_food_security_priority pp_staple_food_priority farming_capacity }
    icon = pomological_orchard
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = nursery_orchard
    # AI (age_food.py): build the upgrade where its predecessor stands; the engine scores a replacement
    # with a near-zero upgrade utility, so the weight carries it
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:nursery_orchard } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        OR = {
            pp_wb_setup_fruit_orchard_location = yes   # vanilla setup orchards the geography would reject
            var:pp_fruit_orchard_eligible > 0
            AND = {
                NOT = { has_variable = pp_fruit_orchard_eligible }
                pp_fruit_orchard_location_potential = yes
            }
        }
    }

    unique_production_methods = {
        pp_pomological_orchard_base_fruit = {
            manual_labor = 0.029
            produced = fruit
            output = 0.145
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_pomological_orchard_no_beekeeping = {
            category = building_maintenance
        }
        pp_pomological_orchard_hedgerow_hives = {
            tools = 0.052
            lumber = 0.129
            fiber_crops = 0.103
            pottery = 0.065
            manual_labor = 0.08
            produced = beeswax
            output = 0.45
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_pomological_orchard_no_primary = {
            category = building_maintenance
        }
        pp_pomological_orchard_grafted_rows = {
            produced = fruit
            output = 3.04
            tools = 0.507 # pruning tools, grafting knives
            lumber = 0.464 # trellises, crates, stakes
            paper = 0.217 # cultivar ledgers
            manual_labor = 0.246
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_pomological_orchard_provision = {
            fruit = 0.193
            produced = local_food
            output = 2.32
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_pomological_orchard_market_sales = {
            offset = 0.01
            produced = fruit
            output = 0.01
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_pomological_orchard = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 6
        local_food_capacity = 50
    }
advancements:
- key: pp_pomological_orchard
  body: |-
    icon = pomological_orchard
    age = age_5_absolutism
    requires = scientific_revolution_advance
    unlock_building = pomological_orchard
    ai_weight = { add = 125 }
localization:
  entries:
    pomological_orchard: Grafted Orchard
    pomological_orchard_desc: Grafted orchards use nursery stock, pruning, trellises, and cultivar records to raise more reliable fruit crops.
    pomological_orchard_slot_0: Fruit Trees
    pomological_orchard_slot_1: Beekeeping
    pomological_orchard_slot_2: Grafted Rows
    pomological_orchard_slot_3: Provisioning
    pomological_orchard_slot_4: Market
    pp_pomological_orchard: Grafted Orchards
    pp_pomological_orchard_base_fruit: Fruit Trees
    pp_pomological_orchard_desc: Grafting, nursery records, and planned orchard rows increase fruit harvests through better management.
    pp_pomological_orchard_grafted_rows: Grafted Rows
    pp_pomological_orchard_no_primary: No Grafted Rows
    pp_pomological_orchard_no_beekeeping: No Beekeeping
    pp_pomological_orchard_hedgerow_hives: Hedgerow Hives
    pp_pomological_orchard_hedgerow_hives_desc: Hives line the edges of the grafted rows. The bees carry pollen between the planted varieties, and the wax is a steady sideline of the orchard.
    pp_pomological_orchard_provision: Provision with Fruit
    pp_pomological_orchard_provision_desc: The household buys its own fruit back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_pomological_orchard_market_sales: Market Sales
    pp_pomological_orchard_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
icon:
  source_png: ../assets/icons/pomological_orchard.png
  output_dds: pomological_orchard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a Pomological Orchard, transparent background. Center orderly rows of grafted fruit trees, pruning ladders, wooden trellises, crates of apples and pears, and a small nursery shed with paper ledgers. Warm daylight, early modern agricultural science, no text, no frame, no modern machinery, no steel factory imagery.
evaluation:
  allow_rules:
    amortization_months: Upgraded former-food producer keeps a slower payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Food relief of age_5_absolutism (age_food.py, throughput x1.45) raises output per worker on purpose.
    output_throughput: Food relief of age_5_absolutism (age_food.py, throughput x1.45) raises output per worker on purpose.
  production_methods:
    pp_pomological_orchard_base_fruit:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Passive orchard methods have little direct input cost; grafted rows carry the tier economy.
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_pomological_orchard_no_primary:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Empty selector method intentionally produces no grafted-row output.
    pp_pomological_orchard_grafted_rows:
      production_efficiency: 1.0
    pp_pomological_orchard_no_beekeeping:
      production_efficiency: 1.0
    pp_pomological_orchard_hedgerow_hives:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Hedgerow hive sideline is intentionally smaller than the full-building throughput target.
        output_throughput: Hedgerow hive sideline is intentionally smaller than the full-building throughput target.
    pp_pomological_orchard_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_pomological_orchard_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
