version: 2
tag: potato_farm
output_tag: potato_farm_tier0
footprint: farm_land
labour:
  class: primary_medieval
  methods:
    pp_potato_farm_base: base
    pp_potato_farm_lazy_beds: hand_work
    pp_potato_farm_provision: keep
    pp_potato_farm_sell_surplus: keep
upgrade_chain:
  family: potato_farm
  tier: 0
  previous: null
  next: potato_farmstead
  unlock_advance: null
building:
  key: potato_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_potato_farm_base
  - name: slot_1
    methods:
    - pp_potato_farm_no_cultivation
    - pp_potato_farm_lazy_beds
    - pp_potato_farm_ridged_fields
  - name: slot_2
    methods:
    - pp_potato_farm_provision
    - pp_potato_farm_sell_surplus
  possible_production_methods: []
  body: |-
    audio_tier = 1
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.15
    max_levels = farm_capacity_max_potato_farm
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = potato_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    build_time = village_build_time
    construction_demand = village_construction

    location_potential = {
        pp_potato_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_potato_native_country = yes
            has_advance = pp_potato_farm_advance_general
        }
    }

    unique_production_methods = {
        pp_potato_farm_base = {
            manual_labor_cost = 0.012
            produced = potato
            output = 0.06
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_potato_farm_lazy_beds = {
            tools = 0.004
            manual_labor_cost = 0.01
            produced = potato
            output = 0.1
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_potato_farm_ridged_fields = {
            livestock = 0.014
            tools = 0.003
            manual_labor_cost = 0.006
            produced = potato
            output = 0.11
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_farm_provision = {
            potato = 0.08
            produced = local_food
            output = 0.96
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_potato_farm_sell_surplus = {
            produced = province_food_sales
            output = 0.005
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_potato_farm = -1
      local_population_capacity = -5
    }

    modifier = {
        local_monthly_food = 1.5
        local_peasants_estate_power = 0.04
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_soldiers_desired_pop = 0
    }
advancements:
- key: pp_potato_farm_advance_general
  body: |-
    age = age_5_absolutism
    requires = newspapers_advance
    ai_weight = { add = 50 }
    potential = {
        exists = capital
        NOT = {
            original_capital ?= {
                OR = {
                    region = region:andes_region
                    region = region:colombia_region
                }
            }
        }
    }
localization:
  entries:
    potato_farm: Potato Field
    potato_farm_desc: Households raise potatoes in spade-dug beds on poor and wet ground.
    potato_farm_slot_0: Fields
    potato_farm_slot_1: Cultivation
    potato_farm_slot_2: Provisioning
    pp_potato_farm_base: Fields
    pp_potato_farm_no_cultivation: No Cultivation
    pp_potato_farm_lazy_beds: Lazy Beds
    pp_potato_farm_lazy_beds_desc: Potatoes are planted in spade-dug beds on poor ground.
    pp_potato_farm_ridged_fields: Ridged Fields
    pp_potato_farm_ridged_fields_desc: Ridges drain the ground and manure feeds them.
    pp_potato_farm_provision: Provision with Potatoes
    pp_potato_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_potato_farm_sell_surplus: Sell the Surplus
    pp_potato_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
    pp_potato_farm_advance_general: Potato Cultivation
    pp_potato_farm_advance_general_desc: Adopt the potato as a reliable staple crop.
icon:
  source_png: ../assets/icons/potato_farm.png
  output_dds: potato_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_potato_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_potato_farm_no_cultivation:
      production_efficiency: 1.0
    pp_potato_farm_lazy_beds:
      production_efficiency: 1.05
    pp_potato_farm_ridged_fields:
      production_efficiency: 1.05
    pp_potato_farm_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_potato_farm_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
