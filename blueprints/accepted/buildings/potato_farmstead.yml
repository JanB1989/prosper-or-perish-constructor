version: 2
tag: potato_farmstead
output_tag: potato_farm_tier1
footprint: farm_land
labour:
  class: primary_discovery
  methods:
    pp_potato_farmstead_base: base
    pp_potato_farmstead_provision: keep
gate_method: pp_potato_farmstead_provision
upgrade_chain:
  family: potato_farm
  tier: 1
  previous: potato_farm
  next: potato_rotations
  unlock_advance: pp_manuring_and_seed_stores
building:
  key: potato_farmstead
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_potato_farmstead_base
  - name: slot_1
    methods:
    - pp_potato_farmstead_no_cultivation
    - pp_potato_farmstead_manured_ridges
  - name: slot_2
    methods:
    - pp_potato_farmstead_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_potato_farmstead
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = potato_farmstead
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = potato_farm
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_potato_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_potato_native_country = yes
            has_advance = pp_potato_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:potato)"
                divide = "default_price(goods:potato)"
                multiply = { value = 1 add = modifier:local_potato_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:potato_farm } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_potato_farmstead_base = {
            manual_labor = 0.018
            produced = potato
            output = 0.092
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_farmstead_no_cultivation = {
            category = building_maintenance
        }
        pp_potato_farmstead_manured_ridges = {
            livestock = 0.089
            clay = 0.19
            fiber_crops = 0.059
            tools = 0.02
            manual_labor = 0.065
            produced = potato
            output = 0.747
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_farmstead_provision = {
            potato = 0.015
            produced = local_food
            output = 2.3
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_potato_farmstead = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 3.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.03
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    potato_farmstead: Potato Farmstead
    potato_farmstead_desc: Manured ridges grow the crop and earth clamps keep the seed potatoes through winter.
    potato_farmstead_slot_0: Fields
    potato_farmstead_slot_1: Cultivation
    potato_farmstead_slot_2: Provisioning
    pp_potato_farmstead_base: Fields
    pp_potato_farmstead_no_cultivation: No Cultivation
    pp_potato_farmstead_manured_ridges: Manured Ridges and Clamps
    pp_potato_farmstead_manured_ridges_desc: Manured ridges grow the crop and earth clamps store it.
    pp_potato_farmstead_provision: Provision with Potatoes
    pp_potato_farmstead_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/potato_farmstead.png
  output_dds: potato_farmstead.dds
  size: 512
evaluation:
  allow_rules:
    profit_percent: Passive selectors, no-output options, and household sidelines can sit outside the narrow margin band; worked farmstead methods carry the tier balance.
    base_output_per_1k: Early farmstead selectors keep passive food output small; worked crop methods carry the tier economy.
    input_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
    output_throughput: Food relief of age_3_discovery (age_food.py, throughput x1.15) raises output per worker on purpose.
  production_methods:
    pp_potato_farmstead_base:
      production_efficiency: 1.0
    pp_potato_farmstead_no_cultivation:
      production_efficiency: 1.0
    pp_potato_farmstead_manured_ridges:
      production_efficiency: 1.05
    pp_potato_farmstead_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
