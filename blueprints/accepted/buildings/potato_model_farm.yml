version: 2
tag: potato_model_farm
output_tag: potato_farm_tier3
footprint: farm_land
labour:
  class: primary_absolutism
  methods:
    pp_potato_model_farm_base: base
    pp_potato_model_farm_provision: keep
gate_method: pp_potato_model_farm_provision
upgrade_chain:
  family: potato_farm
  tier: 3
  previous: potato_rotations
  next: null
  unlock_advance: pp_model_farm
building:
  key: potato_model_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_potato_model_farm_base
  - name: slot_1
    methods:
    - pp_potato_model_farm_no_cultivation
    - pp_potato_model_farm_drilled_ridges
  - name: slot_2
    methods:
    - pp_potato_model_farm_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_potato_model_farm
    pop_type = laborers
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = potato_model_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = potato_rotations
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_potato_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_potato_native_country = yes
            has_advance = pp_potato_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:potato)"
                divide = "default_price(goods:potato)"
                multiply = { value = 1 add = modifier:local_potato_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:potato_rotations } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI builds up food in its capital province (pp_capital_food_weight, flat)
        add = pp_capital_food_weight
    }

    unique_production_methods = {
        pp_potato_model_farm_base = {
            manual_labor = 0.029
            produced = potato
            output = 0.145
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_model_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_potato_model_farm_drilled_ridges = {
            tools = 0.15
            livestock = 0.19
            clay = 0.25
            paper = 0.19
            manual_labor = 0.097
            produced = potato
            output = 1.55
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_model_farm_provision = {
            potato = 0.024
            produced = local_food
            output = 5.294
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_potato_model_farm = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 4.331
        local_food_capacity = 50
        local_laborers_desired_pop = 0.002
    }
localization:
  entries:
    potato_model_farm: Potato Model Farm
    potato_model_farm_desc: Drilled ridges, planned clamps and field accounts raise potatoes on a larger managed farm.
    potato_model_farm_slot_0: Fields
    potato_model_farm_slot_1: Cultivation
    potato_model_farm_slot_2: Provisioning
    pp_potato_model_farm_base: Fields
    pp_potato_model_farm_no_cultivation: No Cultivation
    pp_potato_model_farm_drilled_ridges: Drilled Potato Ridges
    pp_potato_model_farm_drilled_ridges_desc: Ridges are drilled in straight lines and worked with horse-hoes.
    pp_potato_model_farm_provision: Provision with Potatoes
    pp_potato_model_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/potato_model_farm.png
  output_dds: potato_model_farm.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The 10k laborer model farm keeps a slower estate-improvement payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_5_absolutism (age_food.py, throughput x1.45) on top.
    output_throughput: Farm trade-off (crop_farms.toml tier_cultivation_throughput x0.5) runs a smaller cultivation on purpose, so the store curve's crop line cannot cost the crew more than its Province Food earns at a low store; food relief of age_5_absolutism (age_food.py, throughput x1.45) on top.
  production_methods:
    pp_potato_model_farm_base:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_potato_model_farm_no_cultivation:
      production_efficiency: 1.0
    pp_potato_model_farm_drilled_ridges:
      production_efficiency: 1.0
    pp_potato_model_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
