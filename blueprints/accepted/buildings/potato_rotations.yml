version: 2
tag: potato_rotations
output_tag: potato_farm_tier2
footprint: farm_land
labour:
  class: primary_reformation
  methods:
    pp_potato_rotations_base: base
    pp_potato_rotations_provision: keep
gate_method: pp_potato_rotations_provision
upgrade_chain:
  family: potato_farm
  tier: 2
  previous: potato_farmstead
  next: potato_model_farm
  unlock_advance: pp_farming_village_rotations
building:
  key: potato_rotations
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_potato_rotations_base
  - name: slot_1
    methods:
    - pp_potato_rotations_no_cultivation
    - pp_potato_rotations_potato_rotation
    - pp_potato_rotations_seed_selection
  - name: slot_2
    methods:
    - pp_potato_rotations_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_potato_rotations
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = potato_rotations
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = potato_farmstead
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_potato_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_potato_native_country = yes
            has_advance = pp_potato_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:potato)"
                divide = "default_price(goods:potato)"
                multiply = { value = 1 add = modifier:local_potato_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:potato_farmstead } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_potato_rotations_base = {
            manual_labor = 0.019
            produced = potato
            output = 0.095
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_rotations_no_cultivation = {
            category = building_maintenance
        }
        pp_potato_rotations_potato_rotation = {
            tools = 0.23
            livestock = 0.28
            clay = 0.31
            cloth = 0.096
            manual_labor = 0.19
            produced = potato
            output = 2.11
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_potato_rotations_seed_selection = {
            tools = 0.2
            livestock = 0.26
            clay = 0.36
            fiber_crops = 0.18
            manual_labor = 0.22
            produced = potato
            output = 2.19
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_potato_rotations_provision = {
            potato = 0.016
            produced = local_food
            output = 2.375
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_potato_rotations = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 4.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.021
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
localization:
  entries:
    potato_rotations: Potato Ridge Farm
    potato_rotations_desc: Potatoes take turns with grain and fodder on ridges that drain well.
    potato_rotations_slot_0: Fields
    potato_rotations_slot_1: Cultivation
    potato_rotations_slot_2: Provisioning
    pp_potato_rotations_base: Fields
    pp_potato_rotations_no_cultivation: No Cultivation
    pp_potato_rotations_potato_rotation: Potato Rotation
    pp_potato_rotations_potato_rotation_desc: Potatoes take turns with grain on the same ground.
    pp_potato_rotations_seed_selection: Selected Seed Potatoes
    pp_potato_rotations_seed_selection_desc: Sound seed tubers are picked out and stored apart.
    pp_potato_rotations_provision: Provision with Potatoes
    pp_potato_rotations_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/potato_rotations.png
  output_dds: potato_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
    output_throughput: Food relief of age_4_reformation (age_food.py, throughput x1.35) raises output per worker on purpose.
  production_methods:
    pp_potato_rotations_base:
      production_efficiency: 1.0
    pp_potato_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_potato_rotations_potato_rotation:
      production_efficiency: 1.0
    pp_potato_rotations_seed_selection:
      production_efficiency: 1.0
    pp_potato_rotations_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
