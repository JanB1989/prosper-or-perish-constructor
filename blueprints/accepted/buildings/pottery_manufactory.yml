version: 2
tag: pottery_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
gate_method: pp_pottery_manufactory_market_sales
building:
  key: pottery_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_pottery_manufactory_pottery_manufactory_maintenance
    - pp_pottery_manufactory_legacy_pottery_w_maintenance
  - name: slot_1
    methods:
    - pp_pottery_manufactory_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 3, own methods x1.7 goods in and out, margin +0.1
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = manufactory_startup_ramp_target
    category = basic_industry_category
    employment_size = 0.325   # manufacturing tiers 2026-10-06: 0.25 after the employment cut x1.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    obsolete = pottery_workshop
    unique_production_methods = {
        pp_pottery_manufactory_pottery_manufactory_maintenance = {
            clay = 1.802
            lumber = 0.34 # kiln fuel and drying racks
            tools = 0.065 # tools cut to a running cost (~10 %)
            coal = 0.136 # coal-fired kilns
            manual_labor = 0.117
            produced = pottery
            output = 2.76
            category = manufactory_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_pottery_manufactory_legacy_pottery_w_maintenance = {
            icon_type = building_type
            icon = pottery_workshop
            clay = 1.69
            lumber = 0.24
            tools = 0.047
            manual_labor = 0.15
            produced = pottery
            output = 2.07
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_pottery_manufactory_market_sales = {
            offset = 0.01
            produced = pottery
            output = 0.01
            category = building_maintenance
        }
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.15
    raw_modifier = {
        local_pp_pottery_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:pottery_workshop } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
localization:
  entries:
    pottery_manufactory_slot_0: Pottery Manufactory Work
    pp_pottery_manufactory_pottery_manufactory_maintenance: Pottery Manufactory Pottery Manufactory Maintenance
    pp_pottery_manufactory_market_sales: Market Sales
    pp_pottery_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    pottery_manufactory_slot_1: Market
    pp_pottery_manufactory_legacy_pottery_w_maintenance: "$pottery_w_maintenance$ (Old Ways)"
    pp_pottery_manufactory_legacy_pottery_w_maintenance_desc: "An older way of working, kept from the $pottery_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_pottery_manufactory_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_pottery_manufactory_legacy_pottery_w_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
