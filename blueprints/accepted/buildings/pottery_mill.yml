version: 2
tag: pottery_mill
footprint: mill_works
labour:
  class: craft_revolutions
gate_method: pp_pottery_mill_market_sales
building:
  key: pottery_mill
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_pottery_mill_pottery_mill_maintenance
    - pp_pottery_mill_legacy_pottery_w_maintenance
  - name: slot_1
    methods:
    - pp_pottery_mill_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 4, own methods x2.0 goods in and out, margin +0.12
    audio_tier = 5
    is_foreign = no
    pop_type = laborers
    is_mill = yes
    max_levels = mills_max_level
    startup_ramp_target = mills_startup_ramp_target
    category = consumer_goods_category
    employment_size = 1.16   # manufacturing tiers 2026-10-06: 0.8 after the employment cut x1.45
    town = yes
    city = yes
    megalopolis = yes
    obsolete = pottery_manufactory
    build_time = mills_build_time
    unique_production_methods = {
        pp_pottery_mill_pottery_mill_maintenance = {
            clay = 7.2
            lumber = 0.64
            tools = 0.184 # tools cut to a running cost (~10 %)
            coal = 0.22 # coal-fired bottle kilns
            manual_labor = 0.24
            produced = pottery
            output = 7.22
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
        pp_pottery_mill_legacy_pottery_w_maintenance = {
            icon_type = building_type
            icon = pottery_workshop
            clay = 3.63
            lumber = 0.51
            tools = 0.1
            manual_labor = 0.33
            produced = pottery
            output = 4.06
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
    }
    unique_production_methods = {
        pp_pottery_mill_market_sales = {
            offset = 0.01
            produced = pottery
            output = 0.01
            category = building_maintenance
        }
    }
    construction_demand = mill_construction
    raw_modifier = {
        local_pp_pottery_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
        local_burghers_desired_pop = 0.05
    }
    increase_per_level_cost = 0.15
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:pottery_manufactory } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
localization:
  entries:
    pottery_mill_slot_0: Pottery Mill Work
    pp_pottery_mill_pottery_mill_maintenance: Pottery Mill Pottery Mill Maintenance
    pp_pottery_mill_market_sales: Market Sales
    pp_pottery_mill_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    pottery_mill_slot_1: Market
    pp_pottery_mill_legacy_pottery_w_maintenance: "$pottery_w_maintenance$ (Old Ways)"
    pp_pottery_mill_legacy_pottery_w_maintenance_desc: "An older way of working, kept from the $pottery_workshop$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_pottery_mill_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_pottery_mill_legacy_pottery_w_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
