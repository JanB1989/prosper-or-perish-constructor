    pp_banjara_tanda: Banjara Tanda
    pp_banjara_tanda_desc: The camp of a Banjara carrying clan, whose great herds of pack bullocks move grain, salt and cloth between the villages and the markets of the subcontinent. Whole families travel with the tanda and settle it wherever the grazing is good.
