version: 2
tag: pp_food_switch_test
footprint: technical
labour:
  class: keep
building:
  key: pp_food_switch_test
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_food_switch_test_wheat
    - name: slot_1
      methods:
        - pp_food_switch_test_money
        - pp_food_switch_test_local_food
  possible_production_methods: []
  body: |2-
    is_foreign = no
    increase_per_level_cost = 0.13
    max_levels = 1
    pop_type = peasants
    employment_size = 0.001
    category = consumer_goods_category
    icon = pp_food_switch_test
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = no
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 3
    construction_demand = victuals_market_construction

    # Method-switch test (2026-09-24). Spawned by console; the owner picks one method per slot by profit.
    # slot 0: wheat, always on (identical whichever slot 1 method runs); labour 0.2 gold, wheat 1 gold.
    unique_production_methods = {
      pp_food_switch_test_wheat = {
        produced = wheat
        manual_labor_cost = 0.2
        output = 1.0
        category = building_maintenance
      }
    }
    # slot 1: money or cook.
    # money: 0.125 province_food_sales, output modifier 0x at an empty store, 8x at 12 months, 16x at the 24-month
    #   cap -> 0 .. 1 .. 2 gold at the 1 gold floor price.
    # cook: buys 1 wheat from the market, makes a fixed 2 local_food = 20 food and 2 gold. Margin 2 - wheat price
    #   (+1 at the default wheat price 1, break-even at 2). Nothing scales the food with storage.
    # Expected: cook below ~12 months stored at wheat price 1; cheaper wheat moves the switch up, dearer down.
    unique_production_methods = {
      pp_food_switch_test_money = {
        produced = province_food_sales
        output = 0.125
        category = building_maintenance
      }
      pp_food_switch_test_local_food = {
        produced = local_food
        wheat = 1.0
        output = 2.0
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
    }
localization:
  entries:
    pp_food_switch_test: Food Switch Test
    pp_food_switch_test_desc: Test building. Its owner chooses between earning money and feeding the province.
    pp_food_switch_test_slot_0: Farming
    pp_food_switch_test_slot_1: Use
    pp_food_switch_test_wheat: Grow Wheat
    pp_food_switch_test_money: Sell to Market
    pp_food_switch_test_local_food: Cook Wheat for the Province
icon:
  source_dds: ../../../mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/gfx/interface/icons/trade_goods/icon_goods_local_food.dds
  output_dds: pp_food_switch_test.dds
  size: 512

evaluation:
  allow_rules:
    profit_percent: Test building with no-input dummy methods.
    input_throughput: Test building with no-input dummy methods.
    output_throughput: Test building with no-input dummy methods.
    amortization_months: Test building, spawned by console, never meant to pay back.
    base_output_per_1k: Test building with no-input dummy methods on a near-zero workforce.
