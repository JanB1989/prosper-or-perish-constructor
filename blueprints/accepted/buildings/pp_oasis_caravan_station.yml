evaluation:
  allow_rules:
    profit_percent: Logistics buildings earn a thin wage in the floor-priced logistics good; their payoff is market access.
    input_throughput: Oasis caravan stations keep camels, drivers and provisions on the road for every level.
    output_throughput: The logistics good is a floor-priced wage; the real output is market access.
  production_methods:
    pp_oasis_caravan_station_logistics_network:
      allow_rules:
        base_output_per_1k: "The logistics network method has no inputs on purpose: its slot always counts as supplied, so the building keeps part of its market access when it can buy nothing; its output is a floor-priced wage."
