localization:
  entries:
    pp_oasis_caravan_station_slot_0: Desert Network
    pp_oasis_caravan_station_slot_1: Desert Crossings
    pp_oasis_caravan_station: Oasis Caravan Station
    pp_oasis_caravan_station_desc: Wells, palm groves and store rooms mark the stations of the desert roads. Their keepers water the camel trains and hold provisions for the long crossings between the Saharan oases and the markets of the Sahel.
    pp_oasis_caravan_station_construction: Oasis Caravan Station Construction
    pp_oasis_caravan_station_camel_train: Camel Train
    pp_oasis_caravan_station_caravan_crews: Caravan Crews
    pp_oasis_caravan_station_azalai: Azalai
    pp_oasis_caravan_station_logistics_network: Well Keepers
    pp_oasis_caravan_station_logistics_network_desc: Families who keep the wells clear and the palms watered make the station a sure halt, so some camel trains keep crossing even when its own stores run dry.
