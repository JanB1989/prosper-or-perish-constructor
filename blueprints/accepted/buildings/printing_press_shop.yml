version: 2
tag: printing_press_shop
footprint: urban_workshop
labour:
  class: craft_discovery
gate_method: pp_printing_press_shop_market_sales
building:
  key: printing_press_shop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_printing_press_shop_printing_press_maintenance
    - pp_printing_press_shop_printing_press_leather_maintenance
    - pp_printing_press_shop_legacy_scriptorium_leather_maintenance
    - pp_printing_press_shop_legacy_scriptorium_maintenance
  - name: slot_1
    methods:
    - pp_printing_press_shop_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = 1125
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    obsolete = scriptorium
    build_time = workshop_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:printing_press_shop }
            add = {
                value = "market.market_price(goods:books)"
                multiply = 0.16000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_printing_press_shop_printing_press_maintenance = {
            lead = 0.22
            paper = 0.76
            lumber = 0.27
            manual_labor = 0.33
            produced = books
            output = 0.8
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_printing_press_shop_printing_press_leather_maintenance = {
            lead = 0.22
            paper = 0.76
            leather = 0.135
            manual_labor = 0.33
            produced = books
            output = 0.8
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_printing_press_shop_legacy_scriptorium_leather_maintenance = {
            icon_type = goods
            icon = leather
            dyes = 0.12
            paper = 0.47
            leather = 0.12
            manual_labor = 0.31
            produced = books
            output = 0.6
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_printing_press_shop_legacy_scriptorium_maintenance = {
            icon_type = building_type
            icon = scriptorium
            dyes = 0.12
            paper = 0.45
            lumber = 0.23
            manual_labor = 0.3
            produced = books
            output = 0.6
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_printing_press_shop_market_sales = {
            offset = 0.012
            produced = books
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = workshop_construction
    increase_per_level_cost = 0.21
localization:
  entries:
    printing_press_shop_slot_0: Printing Press Shop Work
    pp_printing_press_shop_printing_press_maintenance: Printing Press Shop Printing Press Maintenance
    pp_printing_press_shop_printing_press_leather_maintenance: $printing_press_leather_maintenance$
    pp_printing_press_shop_market_sales: Market Sales
    pp_printing_press_shop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    printing_press_shop_slot_1: Market
    pp_printing_press_shop_legacy_scriptorium_leather_maintenance: "$scriptorium_leather_maintenance$ (Old Ways)"
    pp_printing_press_shop_legacy_scriptorium_leather_maintenance_desc: "An older way of working, kept from the $scriptorium$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_printing_press_shop_legacy_scriptorium_maintenance: "$scriptorium_maintenance$ (Old Ways)"
    pp_printing_press_shop_legacy_scriptorium_maintenance_desc: "An older way of working, kept from the $scriptorium$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_printing_press_shop_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_printing_press_shop_legacy_scriptorium_leather_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
    pp_printing_press_shop_legacy_scriptorium_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
