    	# towns and up, or the province capital (every owner of a split province has one). An allow, not a
    	# location_potential, so the tier keeps the Cookshop's visibility (vanilla: the armory's allow on top of
    	# the provincial garrison it makes obsolete)
    	allow = {
    		OR = {
    			NOT = { location_rank = location_rank:rural_settlement }
    			is_province_capital = yes
    		}
    	}
    	# AI (2026-10-03, farm reward): as the Cookshop. Build them up to the cap wherever the farms allow, store or
    	# not; the AI values their food only while the province loses food, so elsewhere this positive weight carries
    	# them past their cost. Divided by the owner's income like the farm weight.
    	ai_construct_weight = {
    		value = 20
    		add = { value = pp_location_province_farm_levels divide = 40 max = 1 multiply = 40 }
    		divide = { value = scope:owner.monthly_income_total add = 10 }
