localization:
  entries:
    public_kitchen: Public Kitchen
    public_kitchen_desc: "A large town kitchen at the [province_capital|e] that replaces the [ShowBuildingTypeName('cookshop')|e] and feeds workers and the poor; the more [Concept('pp_staple_foods', 'staple food')|e] farms and [ShowBuildingTypeName('victualling_yard')|e] levels the province has, the more levels its kitchens can have. It is almost always worth building: it adds food, makes the province's food consumption more efficient and keeps the town calmer."
    public_kitchen_slot_0: Main Dish
    public_kitchen_slot_1: Drink
    pp_public_kitchen: Public Kitchens
    pp_public_kitchen_desc: Towns organize large kitchens with kettles, stores and paid crews that feed workers and the poor every day.
    pp_public_kitchen_beer: Beer
    pp_public_kitchen_beer_desc: "The kitchen buys small beer by the barrel and pours it with every meal. Weak beer was the everyday drink of many towns and gave the workers part of their daily food."
    pp_public_kitchen_boreal_hunter_stew_serve: Serve Boreal Hunter's Stew
    pp_public_kitchen_boreal_hunter_stew_serve_desc: "Haunches of game go into the kitchen's kettles with grain and salt. The thick stew sees the workers of a northern town through the long winter."
    pp_public_kitchen_camel_stew_serve: Serve Camel Stew
    pp_public_kitchen_camel_stew_serve_desc: "Whole quarters of camel go into the kitchen's great cauldrons for long, slow stewing. There is enough meat and broth for a crowd of caravan hands and townsfolk."
    pp_public_kitchen_chocolate: Chocolate
    pp_public_kitchen_chocolate_desc: "Pots of hot chocolate are stirred in quantity and poured for the hungry. Thick drinking chocolate was counted almost as a food, filling and warming."
    pp_public_kitchen_coffee: Coffee
    pp_public_kitchen_coffee_desc: "Big urns of coffee stand ready from early morning for workers on their way to the docks and workshops. Cheap coffee kept long shifts going in the growing towns."
    pp_public_kitchen_fish_congee_serve: Serve Fish Congee
    pp_public_kitchen_fish_congee_serve_desc: "Vats of rice congee with fish keep warm all day. Chinese officials and charities ran congee kitchens like this for the poor in hard years."
    pp_public_kitchen_honey_gruel_serve: Serve Honeyed Gruel
    pp_public_kitchen_honey_gruel_serve_desc: "Kettles of wheat gruel sweetened with honey and fruit are ladled out every morning. It is a mild food for children, the sick and the old."
    pp_public_kitchen_ika_mata_serve: Serve Ika Mata
    pp_public_kitchen_ika_mata_serve_desc: "Tubs of raw fish cured in fruit juice and coconut cream are mixed fresh every day. The catch feeds many mouths without a fire or any fuel."
    pp_public_kitchen_kheer_serve: Serve Kheer
    pp_public_kitchen_kheer_serve_desc: "Cauldrons of rice, milk and sugar are stirred for hours into kheer. It is handed out at festivals and to the poor as a blessing."
    pp_public_kitchen_khong_bah_png_serve: Serve Khong Bah Png
    pp_public_kitchen_khong_bah_png_serve_desc: "The kitchen braises pork belly in soy and sugar by the panful and spoons it over rice. It is a rich bowl for dock hands and labourers after a long shift."
    pp_public_kitchen_khichdi_serve: Serve Khichdi
    pp_public_kitchen_khichdi_serve_desc: "Huge pots of rice and lentils simmer from dawn. Shrines and charity kitchens across India handed out khichdi like this to pilgrims and the hungry."
    pp_public_kitchen_labskaus_serve: Serve Labskaus
    pp_public_kitchen_labskaus_serve_desc: "The kitchen mashes salt beef, fish and potatoes into labskaus by the tub. The same hash fed sailors in Hamburg, Bremen and Liverpool, where it became scouse."
    pp_public_kitchen_liquor: Liquor
    pp_public_kitchen_liquor_desc: "A measured tot of spirits is poured with the meal, much as navies and work gangs issued a daily ration of rum or arrack. It warms the workers and keeps them coming back."
    pp_public_kitchen_livestock_pottage_serve: Serve Commoners Stew
    pp_public_kitchen_livestock_pottage_serve_desc: "Coppers of pottage made from grain, pease and meat feed the town's workers at long tables. It was the cheapest hot meal a day's wage could buy."
    pp_public_kitchen_meat_tajine_serve: Serve Tajine
    pp_public_kitchen_meat_tajine_serve_desc: "Rows of covered clay pots simmer meat, fruit and saffron over low coals. The kitchen serves slow-cooked tajine to many at once without tending each pot."
    pp_public_kitchen_mediterranean_fish_serve: Serve Bouillabaisse
    pp_public_kitchen_mediterranean_fish_serve_desc: "The kitchen boils the day's cheap fish in olive oil and wine in pots big enough for a whole quay. The broth is poured over bread and the fish served after."
    pp_public_kitchen_mutton_and_pease_serve: Serve Mutton and Pease
    pp_public_kitchen_mutton_and_pease_serve_desc: "Mutton and pease boiled in big coppers make a cheap, heavy meal for the town's workers. One old sheep, too worn for its wool, feeds a long table."
    pp_public_kitchen_pemmican_serve: Serve Pemmican
    pp_public_kitchen_pemmican_serve_desc: "The kitchen buys pemmican by the bale and stews it with water into a thick broth. Fur trade boatmen ate it this way, and it fills porters and the town's poor just as well."
    pp_public_kitchen_pozole_serve: Serve Pozole
    pp_public_kitchen_pozole_serve_desc: "Great pots of hominy, game and chili simmer through the day, and the kitchen ladles pozole out to labourers and the poor by the bowlful. Soaking the maize in lime makes it more nourishing."
    pp_public_kitchen_saltfish_porridge_serve: Serve Saltfish Porridge
    pp_public_kitchen_saltfish_porridge_serve_desc: "Kettles of grain porridge with flaked salt fish make a cheap, salty meal. It keeps a whole quay of workers fed through the lean months."
    pp_public_kitchen_surstromming_serve: Serve Surstroemming
    pp_public_kitchen_surstromming_serve_desc: "The kitchen opens barrels of soured herring and serves it with bread and porridge. Fermenting the catch let northern towns keep fish through the winter with little salt."
    pp_public_kitchen_tea: Tea
    pp_public_kitchen_tea_desc: "Kettles of tea are kept hot all day for the workers and the poor. Boiling the water for tea made the drink safer than plain water from the town wells."
    pp_public_kitchen_well_water: Well Water
    pp_public_kitchen_well_water_desc: "No drink is bought; the kitchen draws water from its own well for the tables."
    pp_public_kitchen_wine: Wine
    pp_public_kitchen_wine_desc: "Rough wine drawn from the barrel comes with each meal, watered for children and the sick. Hospitals and charity kitchens of southern Europe served it the same way."
