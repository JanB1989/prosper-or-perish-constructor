localization:
  entries:
    public_kitchen: Public Kitchen
    public_kitchen_desc: A large town kitchen that feeds workers, the poor and the garrison from the farms' produce and sells meals and drink at its door. The more farm land the province works, the more kitchens it can hold. What it serves adds to the province's food, less food spoils while people eat it fresh, and a fed town is a calmer one.
    public_kitchen_slot_0: Main Dish
    public_kitchen_slot_1: Drink
    pp_public_kitchen: Public Kitchens
    pp_public_kitchen_desc: Towns organize large kitchens with kettles, stores and paid crews that feed workers and the poor every day.
