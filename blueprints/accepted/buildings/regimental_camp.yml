version: 2
tag: regimental_camp
footprint: military_grounds
building:
  key: regimental_camp
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_regimental_camp_maintenance
  possible_production_methods: []
  body: |2-
    	audio_tier = 2
    	is_foreign = no
    	pop_type = soldiers
    	max_levels = manpower_max_level
    	
    	category = military_category
    	forbidden_for_estates = yes
    	
    	employment_size = manpower_employment
    	important_for_AI = yes
    	AI_ignore_available_worker_flag = yes # PP: soldiers are scarce (0.6 % of pops, 1545 save); vanilla sets it on fields and camps
    	ai_construct_weight = {
    		# PP: the emptier the manpower pool, the more the AI wants manpower buildings; without it the AI never queued
    		# them (1541 save: 0 of 573 queues). Library pattern: weight / (owner monthly income + 10).
    		value = 1
    		subtract = scope:owner.manpower_percentage
    		min = 0
    		multiply = 300
    		divide = { value = scope:owner.monthly_income_total add = 10 }
    	}
    	
    	obsolete = training_fields
    	
    	rural_settlement = yes
    	build_time = soldier_building
    	
    	raw_modifier = {
    	}

        modifier = {
    		local_manpower = 0.02
    		can_recruit_regiment_in_this_location = yes
    	}
    	
    	unique_production_methods = {
    		pp_regimental_camp_maintenance = {
    			firearms = 1.2
    			leather = 1.2
    			cloth = 0.24
    			paper = 0.48
    			weaponry = 1.2
    			victuals = 0.5
    			category = building_maintenance
    		}
    	}
    	construction_demand = soldier_building_construction
localization:
  entries:
    pp_regimental_camp_maintenance: "[ShowBuildingTypeName('regimental_camp')|e] Maintenance"

evaluation:
  allow_rules:
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
