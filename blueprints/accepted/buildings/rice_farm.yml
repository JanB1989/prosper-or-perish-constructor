localization:
  entries:
    rice_farm: Rice Paddy
    rice_farm_desc: Households sow and transplant rice on flooded or well-watered plots.
    rice_farm_slot_0: Paddies
    rice_farm_slot_1: Cultivation
    rice_farm_slot_2: Provisioning
    pp_rice_farm_base: Paddies
    pp_rice_farm_no_cultivation: No Cultivation
    pp_rice_farm_dryland_rice: Dryland Rice
    pp_rice_farm_dryland_rice_desc: Rice is sown on rain-fed ground without standing water.
    pp_rice_farm_wet_paddy: Wet Paddy Transplanting
    pp_rice_farm_wet_paddy_desc: Seedlings raised in a nursery are planted by hand into flooded plots.
    pp_rice_farm_provision: Provision with Rice
    pp_rice_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_rice_farm_sell_surplus: Sell the Surplus
    pp_rice_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
    pp_rice_farm_advance_general: Rice Cultivation
    pp_rice_farm_advance_general_desc: Adopt techniques for cultivating rice as a staple crop in suitable regions.
icon:
  source_png: ../assets/icons/rice_farm.png
  output_dds: rice_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_rice_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_rice_farm_no_cultivation:
      production_efficiency: 1.0
    pp_rice_farm_dryland_rice:
      production_efficiency: 1.05
    pp_rice_farm_wet_paddy:
      production_efficiency: 1.05
    pp_rice_farm_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_rice_farm_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
