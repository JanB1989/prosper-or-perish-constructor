version: 2
tag: rice_farm
output_tag: rice_farm_tier0
footprint: farm_land
labour:
  class: primary_medieval
  methods:
    pp_rice_farm_base: base
    pp_rice_farm_wet_paddy: hand_work
    pp_rice_farm_provision: keep
gate_method: pp_rice_farm_provision
upgrade_chain:
  family: rice_farm
  tier: 0
  previous: null
  next: rice_farmstead
  unlock_advance: null
building:
  key: rice_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_rice_farm_base
  - name: slot_1
    methods:
    - pp_rice_farm_no_cultivation
    - pp_rice_farm_dryland_rice
    - pp_rice_farm_wet_paddy
  - name: slot_2
    methods:
    - pp_rice_farm_provision
  possible_production_methods: []
  body: |-
    audio_tier = 1
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_rice_farm
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = rice_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    build_time = village_build_time
    construction_demand = village_construction

    location_potential = {
        pp_rice_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_rice_native_country = yes
            has_advance = pp_rice_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:rice)"
                divide = "default_price(goods:rice)"
                multiply = { value = 1 add = modifier:local_rice_output_modifier subtract = pp_stored_food_staple_line }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
        # the AI answers a low province store (pp_food_urgency_weight, flat)
        add = pp_food_urgency_weight
    }

    unique_production_methods = {
        pp_rice_farm_base = {
            manual_labor = 0.012
            produced = rice
            output = 0.06
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_rice_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_rice_farm_dryland_rice = {
            livestock = 0.013
            tools = 0.001
            manual_labor = 0.005
            produced = rice
            output = 0.11
            debug_max_profit = 0
            category = building_maintenance
        }
        pp_rice_farm_wet_paddy = {
            livestock = 0.006
            clay = 0.011
            manual_labor = 0.011
            produced = rice
            output = 0.11
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_rice_farm_provision = {
            rice = 0.01
            produced = local_food
            output = 1.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_rice_farm = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.04
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
        local_soldiers_desired_pop = 0
    }
advancements:
- key: pp_rice_farm_advance_general
  body: |-
    age = age_3_discovery
    requires = new_world_advance
    unlock_production_method = pp_victualling_yard_rice_shipment
    ai_weight = { add = 50 }
    potential = {
        exists = capital
        NOT = {
            original_capital ?= {
                OR = {
                    sub_continent = sub_continent:east_asia
                    sub_continent = sub_continent:middle_east
                    sub_continent = sub_continent:south_asia
                    sub_continent = sub_continent:south_east_asia
                    sub_continent = sub_continent:west_africa
                    region = region:central_africa_region
                    region = region:egypt_region
                    region = region:great_lakes_region
                    region = region:iberia_region
                    region = region:italy_region
                    region = region:madagascar_region
                    region = region:swahili_coast_region
                    region = region:zimbabwe_region
                }
            }
        }
    }
localization:
  entries:
    rice_farm: Rice Paddy
    rice_farm_desc: Households sow and transplant rice on flooded or well-watered plots.
    rice_farm_slot_0: Paddies
    rice_farm_slot_1: Cultivation
    rice_farm_slot_2: Provisioning
    pp_rice_farm_base: Paddies
    pp_rice_farm_no_cultivation: No Cultivation
    pp_rice_farm_dryland_rice: Dryland Rice
    pp_rice_farm_dryland_rice_desc: Rice is sown on rain-fed ground without standing water.
    pp_rice_farm_wet_paddy: Wet Paddy Transplanting
    pp_rice_farm_wet_paddy_desc: Seedlings raised in a nursery are planted by hand into flooded plots.
    pp_rice_farm_provision: Provision with Rice
    pp_rice_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_rice_farm_advance_general: Rice Cultivation
    pp_rice_farm_advance_general_desc: Adopt techniques for cultivating rice as a staple crop in suitable regions.
icon:
  source_png: ../assets/icons/rice_farm.png
  output_dds: rice_farm.dds
  size: 512
evaluation:
  allow_rules:
    input_throughput: Existing accepted input scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline; revisit during the building-specific rebalance.
    profit_percent: Existing accepted balance predates the global profit-margin band; revisit during the building-specific rebalance.
  production_methods:
    pp_rice_farm_base:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Requested passive baseline for former-food village producers; intentionally below the global no-input output band.
    pp_rice_farm_no_cultivation:
      production_efficiency: 1.0
    pp_rice_farm_dryland_rice:
      production_efficiency: 1.05
    pp_rice_farm_wet_paddy:
      production_efficiency: 1.05
    pp_rice_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
