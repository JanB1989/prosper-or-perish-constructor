localization:
  entries:
    rice_model_farm: Rice Model Farm
    rice_model_farm_desc: Levelled paddies, planned channels and hired hands raise rice on a large managed estate.
    rice_model_farm_slot_0: Paddies
    rice_model_farm_slot_1: Cultivation
    rice_model_farm_slot_2: Provisioning
    pp_rice_model_farm_base: Paddies
    pp_rice_model_farm_no_cultivation: No Cultivation
    pp_rice_model_farm_surveyed_paddies: Surveyed Paddy Estate
    pp_rice_model_farm_surveyed_paddies_desc: Levelled paddies and planned channels are run as one estate.
    pp_rice_model_farm_provision: Provision with Rice
    pp_rice_model_farm_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_rice_model_farm_sell_surplus: Sell the Surplus
    pp_rice_model_farm_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
icon:
  source_png: ../assets/icons/rice_model_farm.png
  output_dds: rice_model_farm.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The 10k laborer model farm keeps a slower estate-improvement payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_rice_model_farm_base:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_rice_model_farm_no_cultivation:
      production_efficiency: 1.0
    pp_rice_model_farm_surveyed_paddies:
      production_efficiency: 1.0
    pp_rice_model_farm_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_rice_model_farm_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
