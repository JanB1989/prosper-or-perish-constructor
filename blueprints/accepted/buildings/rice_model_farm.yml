version: 2
tag: rice_model_farm
output_tag: rice_farm_tier3
footprint: farm_land
labour:
  class: primary_absolutism
  methods:
    pp_rice_model_farm_base: base
    pp_rice_model_farm_provision: keep
gate_method: pp_rice_model_farm_provision
upgrade_chain:
  family: rice_farm
  tier: 3
  previous: rice_rotations
  next: null
  unlock_advance: pp_model_farm
building:
  key: rice_model_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_rice_model_farm_base
  - name: slot_1
    methods:
    - pp_rice_model_farm_no_cultivation
    - pp_rice_model_farm_surveyed_paddies
  - name: slot_2
    methods:
    - pp_rice_model_farm_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_rice_model_farm
    pop_type = laborers
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = rice_model_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = rice_rotations
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_rice_farm_location_potential = yes
    }
    country_potential = {
        OR = {
            pp_rice_native_country = yes
            has_advance = pp_rice_farm_advance_general
        }
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            value = "market.market_price(goods:rice)"
            divide = "default_price(goods:rice)"
            multiply = { value = 1 add = modifier:local_rice_output_modifier }
            subtract = 1
            multiply = 400
            divide = { value = scope:owner.monthly_income_total add = 10 }
        }
    }

    unique_production_methods = {
        pp_rice_model_farm_base = {
            manual_labor = 0.02
            produced = rice
            output = 0.1
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_rice_model_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_rice_model_farm_surveyed_paddies = {
            tools = 0.2
            livestock = 0.26
            clay = 0.55
            lumber = 0.24
            manual_labor = 0.16
            produced = rice
            output = 2.13
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_rice_model_farm_provision = {
            rice = 0.017
            produced = local_food
            output = 2.5
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_rice_model_farm = -1
      local_population_capacity = -5
    }

    modifier = {
        local_monthly_food = 3
        local_food_capacity = 50
        local_laborers_desired_pop = 0.002
    }
localization:
  entries:
    rice_model_farm: Rice Model Farm
    rice_model_farm_desc: Levelled paddies, planned channels and hired hands raise rice on a large managed estate.
    rice_model_farm_slot_0: Paddies
    rice_model_farm_slot_1: Cultivation
    rice_model_farm_slot_2: Provisioning
    pp_rice_model_farm_base: Paddies
    pp_rice_model_farm_no_cultivation: No Cultivation
    pp_rice_model_farm_surveyed_paddies: Surveyed Paddy Estate
    pp_rice_model_farm_surveyed_paddies_desc: Levelled paddies and planned channels are run as one estate.
    pp_rice_model_farm_provision: Provision with Rice
    pp_rice_model_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
icon:
  source_png: ../assets/icons/rice_model_farm.png
  output_dds: rice_model_farm.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The 10k laborer model farm keeps a slower estate-improvement payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_rice_model_farm_base:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_rice_model_farm_no_cultivation:
      production_efficiency: 1.0
    pp_rice_model_farm_surveyed_paddies:
      production_efficiency: 1.0
    pp_rice_model_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
