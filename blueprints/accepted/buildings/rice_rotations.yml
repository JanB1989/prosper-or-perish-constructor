localization:
  entries:
    rice_rotations: Rice Paddy Estate
    rice_rotations_desc: Bunded paddies carry more than one crop of rice in a year.
    rice_rotations_slot_0: Paddies
    rice_rotations_slot_1: Cultivation
    rice_rotations_slot_2: Provisioning
    pp_rice_rotations_base: Paddies
    pp_rice_rotations_no_cultivation: No Cultivation
    pp_rice_rotations_double_cropping: Double Cropping
    pp_rice_rotations_double_cropping_desc: An early and a late rice crop follow each other on the same paddy.
    pp_rice_rotations_chain_pump: Chain-Pump Paddies
    pp_rice_rotations_chain_pump_desc: Treadle chain pumps lift water onto the higher paddies.
    pp_rice_rotations_provision: Provision with Rice
    pp_rice_rotations_provision_desc: The household buys its own crop back and cooks for the province. Worth it while the province store is low and the crop is cheap.
    pp_rice_rotations_sell_surplus: Sell the Surplus
    pp_rice_rotations_sell_surplus_desc: The household sells what the province does not need. It pays more the fuller the province store is, and nothing while it is empty.
icon:
  source_png: ../assets/icons/rice_rotations.png
  output_dds: rice_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_rice_rotations_base:
      production_efficiency: 1.0
    pp_rice_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_rice_rotations_double_cropping:
      production_efficiency: 1.0
    pp_rice_rotations_chain_pump:
      production_efficiency: 1.0
    pp_rice_rotations_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the storage signal decides the switch.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_rice_rotations_sell_surplus:
      allow_rules:
        base_output_per_1k: Sell the Surplus is a no-input dummy signal, not a production line.
