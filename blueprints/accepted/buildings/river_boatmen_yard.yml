localization:
  entries:
    river_boatmen_yard_slot_0: River Network
    river_boatmen_yard_slot_1: River Crews
    pp_river_boatmen_yard_construction: River Boatmen's Yard Construction
    pp_river_boatmen_yard_maintenance: Boatmen
    pp_river_boatmen_yard_towpath_crews: Towpath Crews
    pp_river_boatmen_yard_fitted_barges: Fitted Barges
    river_boatmen_yard: River Boatmen's Yard
    river_boatmen_yard_desc: Boatmen, barges, rope stores and timber landings turn a riverbank into a working freight yard. Goods go down with the current, come back up by towpath, and reach the market by habit.
    pp_river_boatmen_yard_logistics_network: River Pilots
    pp_river_boatmen_yard_logistics_network_desc: Pilots who know every shoal, weir and ferry guide passing barges, so some freight keeps moving on the river even when the yard's own boats lie idle.
icon:
  source_png: ../assets/icons/river_boatmen_yard.png
  output_dds: river_boatmen_yard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a river boatmen's yard, transparent background. Center a timber river landing with a small shed, cargo crates, rope coils, and two broad shallow cargo barges. Make the river unmistakable at low resolution with a wide bright blue river band curving through the foreground and side of the icon; use strong silhouettes, high contrast, fewer tiny props, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Logistics buildings earn a thin wage in the floor-priced logistics good; their payoff is market access.
    input_throughput: River freight yards keep boats, rope, timber, tar and crews working for every level.
    output_throughput: The logistics good is a floor-priced wage; the real output is market access.
  production_methods:
    pp_river_boatmen_yard_logistics_network:
      allow_rules:
        base_output_per_1k: "The logistics network method has no inputs on purpose: its slot always counts as supplied, so the building keeps part of its market access when it can buy nothing; its output is a floor-priced wage."
