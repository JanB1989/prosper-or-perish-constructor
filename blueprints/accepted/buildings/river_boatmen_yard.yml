  prompt: EU5-inspired hand-painted strategy-game icon for a river boatmen's yard, transparent background. Center a timber river landing with a small shed, cargo crates, rope coils, and two broad shallow cargo barges. Make the river unmistakable at low resolution with a wide bright blue river band curving through the foreground and side of the icon; use strong silhouettes, high contrast, fewer tiny props, no text, no frame.
evaluation:
  allow_rules:
