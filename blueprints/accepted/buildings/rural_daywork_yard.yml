evaluation:
  allow_rules:
    profit_percent: Manual labor sits at its 20% floor of 1 gold; every day-work method loses money there and pays from a labour price of about 1.4-1.5.
    input_throughput: Day workers are paid in ale and twine, oxen and harness, or clay and timber for earthworks rather than following normal village manufacturing throughput.
    output_throughput: The fair adds labour to the market only when labour is scarce enough to pay for its workers.
    amortization_months: Labour prices above the floor determine whether the fair earns enough to repay its cost.
