version: 2
tag: rural_glassmaker
footprint: mill_works
labour:
  class: cottage
gate_method: pp_rural_glassmaker_market_sales
building:
  key: rural_glassmaker
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_rural_glassmaker_no_forest_glass
    - pp_rural_glassmaker_forest_glass
  - name: slot_1
    methods:
    - pp_rural_glassmaker_rural_glassmaker_maintenance
  - name: slot_2
    methods:
    - pp_rural_glassmaker_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 1, own methods x0.7 goods in and out
    audio_tier = 1
    is_foreign = no
    pop_type = laborers
    max_levels = guild_max_level
    startup_ramp_target = rural_startup_ramp_target
    forbidden_for_estates = yes
    category = basic_industry_category
    employment_size = 1.0
    rural_settlement = yes
    town = no
    city = no
    location_potential = {
        is_produced_in_location_market = goods:sand
    }
    build_time = rural_build_time
    # location-gated methods 2026-11-22 (Jan): forest glass, the furnace moved into broadleaf and mixed woods for their
    # fuel and ash. A slot of its own with an empty method first (location_methods.py); the vegetation never changes.
    unique_production_methods = {
        pp_rural_glassmaker_no_forest_glass = {
            category = building_maintenance
        }
        pp_rural_glassmaker_forest_glass = {
            icon_type = goods
            icon = glass
            location_allow = {
                OR = {
                    vegetation = forest
                    vegetation = ha1300_veg_mixed_forest
                    vegetation = woods
                }
            }
            sand = 0.069
            lumber = 0.022 # furnace wood and potash from its ash
            manual_labor = 0.038
            produced = glass
            output = 0.05
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_rural_glassmaker_rural_glassmaker_maintenance = {
            sand = 0.49
            manual_labor = 0.12
            produced = glass
            output = 0.14
            debug_max_profit = rural_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_rural_glassmaker_market_sales = {
            offset = 0.017
            produced = glass
            output = 0.006
            category = building_maintenance
        }
    }
    construction_demand = village_construction
    modifier = {
        local_glass_output_modifier = -0.005  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.45
    price = pp_rural_glassmaker_price
    raw_modifier = {
        local_pp_glass_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
prices:
  - key: pp_rural_glassmaker_price
    body: |2-
      {gold = 100}
localization:
  entries:
    pp_rural_glassmaker_price: "[ShowBuildingTypeName('rural_glassmaker')|e] Price"
    rural_glassmaker_slot_0: Forest Furnace
    rural_glassmaker_slot_1: "[ShowBuildingTypeName('rural_glassmaker')|e] Work"
    rural_glassmaker_slot_2: Market
    pp_rural_glassmaker_rural_glassmaker_maintenance: Glassblowing
    pp_rural_glassmaker_rural_glassmaker_maintenance_desc: "A village glassmaker melts local sand with plant ash in a small furnace. He blows simple green bottles, beakers and beads for the country market and the nearby towns."
    pp_rural_glassmaker_market_sales: Market Sales
    pp_rural_glassmaker_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    pp_rural_glassmaker_no_forest_glass: No Forest Glass
    pp_rural_glassmaker_no_forest_glass_desc: "The glassmakers keep to their village furnace and do not move into the woods."
    pp_rural_glassmaker_forest_glass: Forest Glass
    pp_rural_glassmaker_forest_glass_desc: "The glassmakers move a furnace into the woods, burn the trees for heat and their ash for potash, and blow a green forest glass. Only in a [location|e] of [ShowVegetationName('forest')], [ShowVegetationName('ha1300_veg_mixed_forest')] or [ShowVegetationName('woods')] [vegetation|e]."
evaluation:
  allow_rules:
    amortization_months: Non-raw producer under the building price brake (double price, triple level cost, 2026-09-30); slow payback is the point.
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_rural_glassmaker_no_forest_glass:
      production_efficiency: 1.0
      allow_rules:
        profit_percent: Empty selector method intentionally leaves glass output unchanged outside the broadleaf and mixed woods.
    pp_rural_glassmaker_forest_glass:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Forest glass is a small add-on in broadleaf and mixed woods only, deliberately below the full-building throughput.
        output_throughput: Forest glass is a small add-on in broadleaf and mixed woods only, deliberately below the full-building throughput.
    pp_rural_glassmaker_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
