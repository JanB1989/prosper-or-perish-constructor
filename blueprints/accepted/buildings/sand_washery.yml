localization:
  entries:
    sand_washery_slot_0: Sand Beds
    sand_washery_slot_1: Screening
    sand_washery_slot_2: Washing
    sand_washery: Sand Washery
    sand_washery_desc: Screens, washing troughs, and settling tanks grade sand for mortar, molds, and glassmaking. Coarse gravel is removed before the cleaner sand is dried.
    pp_sand_washery_base_sand: Surveyed Sand Beds
    pp_sand_washery_no_screening: No Sand Screening
    pp_sand_washery_riddle_screens: Barrel Screens
    pp_sand_washery_no_washing: No Sand Washing
    pp_sand_washery_glass_sand_washing: Glass-Sand Washing
    pp_sand_washery: Sand Washeries
    pp_sand_washery_desc: Screens, washing troughs, and settling channels grade cleaner sand for construction, molds, and glassmaking.
    pp_sand_washery_market_sales: Market Sales
    pp_sand_washery_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    sand_washery_slot_3: Market
icon:
  source_png: ../assets/icons/sand_washery.png
  output_dds: sand_washery.dds
  size: 512
  prompt: >-
    EU5-inspired hand-painted strategy-game icon for Sand Washery, transparent background.
    Center a compact historical sand and gravel washing plant with an inclined perforated
    barrel screen with iron bands, overhead water pipe, wooden flume, rectangular settling
    tank, water pouring through, pale sand stockpiles, small barrow, and shovel. Large readable
    2D icon cluster filling most of the canvas, pale sand cream, dark wet wood, iron bands,
    muted blue water, no text, no letters, no frame, no modern engines, no conveyor belts,
    not photorealistic, not cartoonish.

