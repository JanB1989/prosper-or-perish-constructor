version: 2
tag: slave_labor_yard
footprint: estate_land
building:
  key: slave_labor_yard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_slave_labor_yard_grain_rations
        - pp_slave_labor_yard_salt_fish_rations
        - pp_slave_labor_yard_provision_grounds
  possible_production_methods: []
  body: |-
    is_foreign = no
    max_levels = 4
    increase_per_level_cost = 0.18
    pop_type = slaves
    employment_size = 1
    price = pp_slave_labor_yard_price
    category = colonial_category
    icon = slave_labor_yard
    rural_settlement = no
    town = no
    city = yes
    megalopolis = yes
    location_potential = {
      market ?= {
        is_produced_in_market = goods:slaves_goods
      }
    }
    allow = {
      scope:actor = {
        has_slavery = yes
      }
    }
    remove_if = {
      scope:actor = {
        has_slavery = no
      }
    }
    can_close = yes
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    build_time = plantation_build_time
    construction_demand = plantation_construction

    unique_production_methods = {
      pp_slave_labor_yard_grain_rations = {
        produced = manual_labor
        output = 2.85
        slaves_goods = 0.8
        millet = 0.8
        cloth = 0.2
        category = building_maintenance
      }
      pp_slave_labor_yard_salt_fish_rations = {
        produced = manual_labor
        output = 2.75
        slaves_goods = 0.8
        fish = 1.0
        salt = 0.08
        category = building_maintenance
      }
      pp_slave_labor_yard_provision_grounds = {
        produced = manual_labor
        output = 2.5
        slaves_goods = 1.0
        fiber_crops = 0.3
        category = building_maintenance
      }
    }
    raw_modifier = {
    }
    modifier = {
      local_slave_pop_satisfaction = -0.01
    }
prices:
  - key: pp_slave_labor_yard_price
    body: '{gold = 60}'
localization:
  entries:
    slave_labor_yard: Slave Gang Barracks
    slave_labor_yard_desc: Enslaved people are housed and fed in city barracks before being hired out in work gangs. The barracks supply manual labor to the market where the slave trade is established.
    slave_labor_yard_slot_0: Work Gangs
    pp_slave_labor_yard_grain_rations: Grain-Ration Gangs
    pp_slave_labor_yard_salt_fish_rations: Salt-Fish Gangs
    pp_slave_labor_yard_provision_grounds: Provision-Ground Gangs
    pp_slave_labor_yard_price: Slave Gang Barracks Price
icon:
  source_png: ../assets/icons/slave_labor_yard.png
  output_dds: slave_labor_yard.dds
  size: 512
  prompt: 'Material-rich painterly historical EU5 building icon for Slave Gang Barracks: a fenced forced-labor worksite, timber barrack, hand tools and rough stone blocks, elevated three-quarter view, isolated transparent cutout.'
evaluation:
  allow_rules:
    profit_percent: Manual labor sits at its 20% floor of 1 gold; the gangs lose money there and pay from a labour price of about 1.3, the cheapest labour in the market.
    input_throughput: Gangs consume enslaved people and their rations rather than following ordinary colonial-building throughput.
    output_throughput: The barracks add labour to the market only when labour is scarce enough to pay for the gangs.
    amortization_months: Labour prices above the floor determine whether the barracks earn enough to repay their cost.
