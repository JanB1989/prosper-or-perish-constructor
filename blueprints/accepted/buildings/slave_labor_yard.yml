version: 2
tag: slave_labor_yard
footprint: estate_land
building:
  key: slave_labor_yard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_slave_labor_yard_gangs
  possible_production_methods: []
  body: |-
    is_foreign = no
    max_levels = 4
    increase_per_level_cost = 0.18
    pop_type = slaves
    employment_size = 1
    price = pp_slave_labor_yard_price
    category = colonial_category
    icon = slave_labor_yard
    rural_settlement = no
    town = no
    city = yes
    megalopolis = yes
    location_potential = {
      market ?= {
        is_produced_in_market = goods:slaves_goods
      }
    }
    allow = {
      scope:actor = {
        has_slavery = yes
      }
    }
    remove_if = {
      scope:actor = {
        has_slavery = no
      }
    }
    can_close = yes
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    build_time = plantation_build_time
    construction_demand = plantation_construction

    unique_production_methods = {
      pp_slave_labor_yard_gangs = {
        produced = manual_labor_cost
        output = 6
        slaves_goods = 1.0
        victuals = 0.8
        tools = 0.18
        category = building_maintenance
      }
    }
    raw_modifier = {
    }
    modifier = {
      local_slave_pop_satisfaction = -0.005
    }
prices:
  - key: pp_slave_labor_yard_price
    body: '{gold = 60}'
localization:
  entries:
    slave_labor_yard: Slave Gang Barracks
    slave_labor_yard_desc: Enslaved people are housed and supplied in city barracks before being hired out in work gangs. The barracks supply manual labor to the market where the slave trade is established.
    slave_labor_yard_slot_0: Work Gangs
    pp_slave_labor_yard_gangs: Hired-Out Slave Gangs
    pp_slave_labor_yard_price: Slave Gang Barracks Price
icon:
  source_png: ../assets/icons/slave_labor_yard.png
  output_dds: slave_labor_yard.dds
  size: 512
  prompt: 'Material-rich painterly historical EU5 building icon for Slave Gang Barracks: a fenced forced-labor worksite, timber barrack, hand tools and rough stone blocks, elevated three-quarter view, isolated transparent cutout.'
evaluation:
  allow_rules:
    profit_percent: Inputs approximately equal revenue at the usual 20% manual-labor price; rising prices make hired-out gangs profitable.
    amortization_months: Upkeep is deliberately near revenue at the labor-price floor; payback improves when labor becomes scarce.
