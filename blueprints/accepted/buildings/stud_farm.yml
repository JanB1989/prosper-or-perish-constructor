localization:
  entries:
    stud_farm: State Stud
    stud_farm_desc: State studs gather approved stallions, fenced paddocks, stable yards, and breeding records into a supervised horse-breeding estate.
    stud_farm_slot_0: Horse Pastures
    stud_farm_slot_1: Stud Work
    pp_stud_books: Stud Books
    pp_stud_books_desc: Written pedigrees and service records help stud farms match stallions and mares more deliberately.
    pp_stud_farm: State Studs
    pp_stud_farm_approved_stallions: Approved Stallions
    pp_stud_farm_base_horses: Horse Pastures
    pp_stud_farm_desc: Recognized stallions, supervised stable yards, fenced paddocks, fodder stores, and breeding records organize local horse herds into a state-backed stud.
    pp_stud_farm_no_primary: No Stud Work
    pp_stud_farm_stud_books: Stud Books
    pp_stud_farm_market_sales: Market Sales
    pp_stud_farm_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    stud_farm_slot_2: Market
icon:
  source_png: ../assets/icons/stud_farm.png
  output_dds: stud_farm.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a State Stud, transparent background. Center a timber-and-stone stable complex with fenced paddocks, two horses, tack, hay stores, feed sacks, and a water trough. Detailed historic bitmap cutout, three-quarter view, warm daylight, no text, no frame, no modern machinery, no fantasy elements.
evaluation:
  allow_rules:
    amortization_months: The stud-farm upgrade is a land-limited rural specialization and keeps horse margins close to break-even rather than driving fast payback.
  production_methods:
    pp_stud_farm_base_horses:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Passive pasture baseline intentionally stays below the global full-building target.
        output_throughput: Passive pasture baseline intentionally stays below the global full-building target.
    pp_stud_farm_no_primary:
      production_efficiency: 1.0
    pp_stud_farm_approved_stallions:
      production_efficiency: 1.0
    pp_stud_farm_stud_books:
      production_efficiency: 1.0
    pp_stud_farm_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
