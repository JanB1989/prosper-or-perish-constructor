version: 2
tag: sugar_plantation
footprint: farm_land
labour:
  class: plantation
  methods:
    pp_sugar_plantation_base_sugar: base
gate_method: pp_sugar_plantation_market_sales
building:
  key: sugar_plantation
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_sugar_plantation_base_sugar
  - name: slot_1
    methods:
    - pp_sugar_plantation_cane_fields
    - pp_sugar_plantation_boiling_house
  - name: slot_2
    methods:
    - pp_sugar_plantation_market_sales
  possible_production_methods: []
  body: |-
    audio_tier = 2
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.15
    pop_type = slaves
    max_levels = farm_capacity_max_sugar_plantation
    employment_size = 1
    category = colonial_category

    custom_tags = { farming_capacity }
    location_potential = {
        pp_sugar_plantation_site = yes
    }
    allow = {
        pp_plantation_owner_allowed = yes
    }

    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    always_add_demands = yes
    build_time = plantation_build_time

    unique_production_methods = {
        pp_sugar_plantation_base_sugar = {
            manual_labor = 0.18
            produced = sugar
            output = 0.300
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_sugar_plantation_cane_fields = {
            category = building_maintenance
        }
        pp_sugar_plantation_boiling_house = {
            # 2026-11-27 (Jan): slaves_goods 0.3 -> 0.1 (demand the West African trade can meet); the other goods carry
            # the cost (x1.76), so the input cost and the margin stay
            slaves_goods = 0.1 # plantation gangs
            lumber = 0.422 # cane press frames (0.24 until 2026-11-27)
            coal = 0.246 # boiling-house fuel (0.14)
            tools = 0.049 # rollers and knives (0.028)
            manual_labor = 0.1
            produced = sugar
            output = 0.667
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_sugar_plantation_market_sales = {
            offset = 0.017
            produced = sugar
            output = 0.006
            category = building_maintenance
        }
    }

    raw_modifier = {
      pp_levels_sugar_plantation = 1
      local_population_capacity = -10
    }

    modifier = {
        local_sugar_output_modifier = 0.1
        local_slave_pop_satisfaction = -0.005
    }
    construction_demand = plantation_construction
localization:
  entries:
    sugar_plantation_slot_0: Cane Fields
    sugar_plantation_slot_1: Pressing & Boiling
    pp_sugar_plantation_base_sugar: Cane Fields
    pp_sugar_plantation_base_sugar_desc: "The fields themselves: what the cane yields with plain cutting before any pressing."
    pp_sugar_plantation_cane_fields: Unpressed Cane Fields
    pp_sugar_plantation_cane_fields_desc: "No boiling house stands here; the cane is chewed or sold fresh by the stalk."
    pp_sugar_plantation_boiling_house: Boiling House
    pp_sugar_plantation_boiling_house_desc: "Enslaved gangs cut the cane and work the mill and the boiling house day and night through the harvest, keeping the fires burning under the copper pans. The sugar islands of the Atlantic and the Caribbean were built on this forced labour."
    pp_sugar_plantation_market_sales: Market Sales
    pp_sugar_plantation_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    sugar_plantation_slot_2: Market
evaluation:
  building:
    employment_size: 1.0
  allow_rules:
    input_throughput: Plantation worked input scale preserves the generated raw sugar RGO baseline.
    output_throughput: Plantation worked output scale preserves the generated raw sugar RGO baseline.
    amortization_months: Plantation price is shared with vanilla plantation economics and intentionally outside generic raw payback cadence.
  production_methods:
    pp_sugar_plantation_base_sugar:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Plantation employment is smaller than the generic laborer raw-site baseline, so the 30% base share is high per 1k.
    pp_sugar_plantation_boiling_house:
      production_efficiency: 1.05
    pp_sugar_plantation_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
