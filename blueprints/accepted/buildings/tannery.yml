        local_pp_leather_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
prices:
  - key: pp_tannery_price
    body: |2-
      {gold = 100}
localization:
  entries:
    pp_tannery_price: Tannery Price
    tannery_slot_0: Tannery Work
    pp_tannery_leather_guild_maintenance: Tannery Leather Guild Maintenance
    pp_tannery_tannery_maintenance: Tannery Tannery Maintenance
    pp_tannery_market_sales: Market Sales
