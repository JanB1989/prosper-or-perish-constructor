version: 2
tag: tannery_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
  keep_goods: [tar]
gate_method: pp_tannery_manufactory_market_sales
building:
  key: tannery_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_tannery_manufactory_leather_manufactory_maintenance
    - pp_tannery_manufactory_tannery_manufactory_maintenance
  - name: slot_1
    methods:
    - pp_tannery_manufactory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 720
    category = basic_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings: 0.2845 matches the median; v3 uses 3x that).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:tannery_manufactory }
            add = {
                value = "market.market_price(goods:leather)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.85
            }
        }
    }
    unique_production_methods = {
        pp_tannery_manufactory_leather_manufactory_maintenance = {
            livestock = 2.38
            sand = 1.11
            tar = 0.35 # birch tar and oils for currying the hides
            tools = 0.175 # tools cut to a running cost (~10 %)
            manual_labor = 0.39
            produced = leather
            output = 1.6
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_tannery_manufactory_tannery_manufactory_maintenance = {
            wild_game = 3.51
            sand = 1.15
            tar = 0.37 # birch tar and oils for currying the hides
            tools = 0.175 # tools cut to a running cost (~10 %)
            manual_labor = 0.4
            produced = leather
            output = 1.6
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_tannery_manufactory_market_sales = {
            offset = 0.012
            produced = leather
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = tanning_workshop
    custom_tags = {
        midgame_manufactory
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.19
localization:
  entries:
    tannery_manufactory_slot_0: Tannery Manufactory Work
    pp_tannery_manufactory_leather_manufactory_maintenance: Tannery Manufactory Leather Manufactory Maintenance
    pp_tannery_manufactory_tannery_manufactory_maintenance: Tannery Manufactory Tannery Manufactory Maintenance
    pp_tannery_manufactory_market_sales: Market Sales
    pp_tannery_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    tannery_manufactory_slot_1: Market
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_tannery_manufactory_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
