version: 2
tag: tanning_workshop
footprint: urban_workshop
labour:
  class: craft_reformation
  keep_goods: [tar]
gate_method: pp_tanning_workshop_market_sales
building:
  key: tanning_workshop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_tanning_workshop_leather_wildgame_workshop_maintenance
    - pp_tanning_workshop_leather_livestock_workshop_maintenance
  - name: slot_1
    methods:
    - pp_tanning_workshop_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 2, own methods x1.3 goods in and out, margin +0.05
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = workshop_startup_ramp_target
    category = basic_industry_category
    employment_size = 0.287   # manufacturing tiers 2026-10-06: 0.25 after the employment cut x1.15
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    unique_production_methods = {
        pp_tanning_workshop_leather_wildgame_workshop_maintenance = {
            wild_game = 2.34
            sand = 0.585
            tar = 0.286 # birch tar and oils for currying the hides
            tools = 0.123 # tools cut to a running cost (~10 %)
            manual_labor = 0.416
            produced = leather
            output = 1.497
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_tanning_workshop_leather_livestock_workshop_maintenance = {
            livestock = 1.547
            sand = 0.598
            tar = 0.312 # birch tar and oils for currying the hides
            tools = 0.123 # tools cut to a running cost (~10 %)
            manual_labor = 0.39
            produced = leather
            output = 1.497
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_tanning_workshop_market_sales = {
            offset = 0.012
            produced = leather
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = tannery
    custom_tags = {
        workshop
    }
    construction_demand = workshop_construction
    increase_per_level_cost = 0.19
    modifier = {
        local_leather_output_modifier = -0.0025  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    raw_modifier = {
        local_pp_leather_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:tannery } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
localization:
  entries:
    tanning_workshop_slot_0: Tanning Workshop Work
    tanning_workshop_slot_1: Market
    pp_tanning_workshop_leather_livestock_workshop_maintenance: Tanning Workshop Leather Livestock Workshop Maintenance
    pp_tanning_workshop_leather_wildgame_workshop_maintenance: Tanning Workshop Leather Wildgame Workshop Maintenance
    pp_tanning_workshop_market_sales: Market Sales
    pp_tanning_workshop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_tanning_workshop_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
