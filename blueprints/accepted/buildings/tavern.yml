version: 2
tag: tavern
footprint: trade
labour:
  class: keep
gate_method: pp_tavern_common_table
building:
  key: tavern
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_tavern_serve_victuals
    - name: slot_1
      methods:
        - pp_tavern_common_table
  possible_production_methods: []
  body: |2-
    is_foreign = no
    # every level costs the base price (2026-10-04, Jan: was 1.33, every further level another full base price)
    increase_per_level_cost = 0
    max_levels = tavern_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_tavern_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = tavern
    # Every province capital, whatever its rank (2026-10-04, Jan; 2026-10-01 to 10-04 towns and larger only): one site
    # per province. In save 1757, 78 % of the hungry country capitals (under 4 stored months, 1707-1757) were rural
    # province capitals that could not take a Tavern, and three in four of those countries built nothing at all.
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    location_potential = {
      is_province_capital = yes
    }
    # AI (2026-10-03): the Tavern is the fallback for a town whose province cannot feed itself; farms and Cookshops come
    # first. Only a store near empty makes a Tavern level worth wanting. The first part is divided by the owner's
    # income like the farm weight; the last two are flat, because the AI scored Taverns in hungry towns from about 25
    # to millions and income-scaled terms vanish next to that (Mini World run 3, 2026-10-03: 68 -> 691 levels by 1502,
    # most added in short famines, two to twelve levels at once, and kept idle once the store refilled):
    # no new level once the store holds 12 months (fading in from 10; 2026-10-04, Jan: was 6 from 4), and every
    # standing level costs 100 once the store holds 8 months (fading in from 6), so a full province does not stack
    # levels. Below 6 months standing levels cost nothing, the same band where the Common Table gate opens (2026-10-04,
    # Jan; 4 to 6 before: at 5 months two standing levels cost exactly the +100 capital food term, so Constantinople
    # with 2 Taverns at 5 months scored about 0 and never queued a third, save 1448.3.21). The flat cost had locked hungry capitals
    # at their first Tavern (save 1592: 31 of 37 hungry country capitals, Constantinople at 0 months with no Tavern
    # candidate), although a Tavern pays most there (0.58 gold per level under 3 months vs 0.04 at 8-14).
    ai_construct_weight = {
      value = -60
      add = { value = 6 subtract = pp_location_stored_months divide = 6 min = 0 max = 1 multiply = 120 }
      divide = { value = scope:owner.monthly_income_total add = 10 }
      subtract = { value = pp_location_stored_months subtract = 10 divide = 2 min = 0 max = 1 multiply = 10000 }
      subtract = {
        value = "location_building_level(building_type:tavern)"
        multiply = 100
        multiply = { value = pp_location_stored_months subtract = 6 divide = 2 min = 0 max = 1 }
      }
      # the AI builds up food in its capital province (pp_capital_food_weight, flat)
      add = pp_capital_food_weight
    }
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_trade_construction

    # The Tavern serves bought-in victuals to the province: 0.8 victuals -> 25.5 Province Food per staffed level
    # (1 victual = 32 food). The food is the Serve method's Province Food, so it follows the victuals actually bought:
    # a Tavern only feeds its province as far as Granges and Victualling Yards supply the market.
    # Store curve (2026-10-03, [stored_food.curve] in constructor.toml): Province Food output runs from +53.8 % at an
    # empty store over +23.1 % at 6 months and 0 at 12 to -38.5 % at 24, so the Tavern earns 25.5 x 0.10 x (1 + that)
    # and stops where the recipe stops paying. Per level at floor prices (dummy goods and labour 1 gold, Province Food
    # 0.10): profit = 2.55 x (1 + curve) - 0.8 p - 0.08 - 0.91
    # -> at victuals p = 2.7 it fills the store to 5.9 months, at 2.0 to 11.6, at 3.5 to 1.0, above 3.7 never.
    # 25.5 (was 24 on the +-75 % line) keeps it near its old stop points and below the 12-month pivot at p = 2.0.
    # Gate (2026-10-04, Jan): the AI's profit check reads the one-method last slot, the Common Table, not Serve Victuals.
    # Serve Victuals passed the 1.05 margin only near an empty store at real victuals prices (save 1757, hungry capitals
    # 1707-1757: 65 % passed at 0 stored months, 34 % at 1, 20 % at 2, 4 % at 3; median victuals 3.4), so the Tavern
    # never entered the AI's queue where it was needed. The Common Table turns 0.1 offset into 0.852 Province Food:
    # margin = 0.852 x (1 + store curve), so it passes 1.05 up to 6 stored months (+23.1 %) and fails above, whatever
    # victuals cost. Its food is small (0.852 per level vs 25.5); Serve Victuals and the store curve are unchanged,
    # so where a standing Tavern fills the store still follows the victuals price as above.
    unique_production_methods = {
      pp_tavern_serve_victuals = {
        produced = local_food
        victuals = 0.8
        manual_labor = 0.08
        offset = 0.91
        output = 25.5
        category = building_maintenance
      }
    }
    unique_production_methods = {
      pp_tavern_common_table = {
        produced = local_food
        offset = 0.1
        output = 0.852
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      # a working Tavern means the province has no surplus to sell: each staffed level takes the Surplus Sales of a
      # Grange in the same location away, so a Grange and a Tavern never pass the same food round in a circle
      # (they could in a country with high production efficiency, where both would pay at the same store)
      local_province_food_sales_output_modifier = -5.0
      # victuals keep: the food it brings in is packed, so a little less food spoils in store (as the Cookshop,
      # 2026-10-04, Jan: towns hold smaller stores because their surplus is thin, the Tavern lets them keep more)
      local_food_preservation_efficiency_modifier = 0.04
      # inns quartered and fed marching troops
      local_supply_limit_modifier = 0.01
    }
prices:
  - key: pp_tavern_price
    body: |2-
      {gold = 70}
localization:
  entries:
    tavern: Tavern
    tavern_desc: Buys [ShowGoodsName('victuals')|e] from the goods market and serves them to the province as [ShowGoodsName('local_food')|e]. Every province capital may keep one. Its food is worth more the lower the province store is, so it stops serving once the store is filled, and its rooms and stables help armies on the march.
    tavern_slot_0: Serving
    tavern_slot_1: Common Table
    pp_tavern_serve_victuals: Serve Victuals
    pp_tavern_common_table: Common Table
    pp_tavern_price: Tavern Price
icon:
  source_png: ../assets/icons/tavern.png
  output_dds: tavern.dds
  size: 512
  drawing: ../../../assets/icon_drawings/tavern/draw.py

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: The Tavern earns by the province store (Province Food output), not at base values.
    base_output_per_1k: One noble per level serves bought-in victuals, not a production line.
