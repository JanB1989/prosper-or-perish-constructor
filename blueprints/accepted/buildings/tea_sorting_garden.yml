  size: 512
  prompt: >-
    EU5-inspired hand-painted strategy-game building icon for a Tea Sorting
    Garden, isolated on a perfectly flat magenta chroma-key background. Center
    terraced tea bushes beside an early-modern tea-processing yard with shallow
    bamboo withering mats, light furniture rolling tables, wicker baskets of fresh
    green tea leaves, dark curled finished tea, clay or pottery firing hearths,
    sorting trays, and neat paper-wrapped tea packages. Painterly historical UI
    art matching the approved detailed building-icon reference style,
    three-quarter view, readable at low resolution, material-rich props, no
    text, no letters, no frame, no modern machinery, not photorealistic, not
    cartoonish.

