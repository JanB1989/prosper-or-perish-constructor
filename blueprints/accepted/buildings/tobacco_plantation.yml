version: 2
tag: tobacco_plantation
footprint: farm_land
labour:
  class: plantation
  methods:
    pp_tobacco_plantation_base_tobacco: base
gate_method: pp_tobacco_plantation_market_sales
building:
  key: tobacco_plantation
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_tobacco_plantation_base_tobacco
  - name: slot_1
    methods:
    - pp_tobacco_plantation_field_cutting
    - pp_tobacco_plantation_curing_barns
  - name: slot_2
    methods:
    - pp_tobacco_plantation_market_sales
  possible_production_methods: []
  body: |-
    audio_tier = 2
    startup_ramp_target = rural_startup_ramp_target
    is_foreign = no
    increase_per_level_cost = 0.12
    pop_type = slaves
    max_levels = farm_capacity_max_tobacco_plantation
    employment_size = 1
    category = colonial_category

    custom_tags = { farming_capacity }
    location_potential = {
        pp_tobacco_plantation_site = yes
    }
    allow = {
        pp_plantation_owner_allowed = yes
    }

    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    always_add_demands = yes
    build_time = plantation_build_time

    unique_production_methods = {
        pp_tobacco_plantation_base_tobacco = {
            manual_labor = 0.18
            produced = tobacco
            output = 0.300
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_tobacco_plantation_field_cutting = {
            category = building_maintenance
        }
        pp_tobacco_plantation_curing_barns = {
            # 2026-11-27 (Jan): slaves_goods 0.3 -> 0.1 (demand the West African trade can meet); the other goods carry
            # the cost (x1.73), so the input cost and the margin stay
            slaves_goods = 0.1 # plantation gangs
            lumber = 0.571 # curing barns (0.33 until 2026-11-27)
            pottery = 0.164 # sweating and storage jars (0.095)
            tools = 0.074 # knives and presses (0.043)
            manual_labor = 0.11
            produced = tobacco
            output = 0.667
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_tobacco_plantation_market_sales = {
            offset = 0.017
            produced = tobacco
            output = 0.006
            category = building_maintenance
        }
    }

    raw_modifier = {
      pp_levels_tobacco_plantation = 1
      local_population_capacity = -10
    }

    modifier = {
        local_tobacco_output_modifier = 0.1
        local_slave_pop_satisfaction = -0.005
    }
    construction_demand = plantation_construction
localization:
  entries:
    tobacco_plantation_slot_0: Tobacco Fields
    tobacco_plantation_slot_1: Curing
    pp_tobacco_plantation_base_tobacco: Tobacco Fields
    pp_tobacco_plantation_base_tobacco_desc: "The fields themselves: what the tobacco plants yield with plain cutting before any curing."
    pp_tobacco_plantation_field_cutting: Field Cutting
    pp_tobacco_plantation_field_cutting_desc: "No curing barn stands here; the leaves are dried in the open field."
    pp_tobacco_plantation_curing_barns: Curing Barns
    pp_tobacco_plantation_curing_barns_desc: "Enslaved gangs cut the plants, hang them in curing barns and pack the sweated leaf into casks. The great tobacco plantations of the Americas grew on this forced labour."
    pp_tobacco_plantation_market_sales: Market Sales
    pp_tobacco_plantation_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    tobacco_plantation_slot_2: Market
evaluation:
  building:
    employment_size: 1.0
  allow_rules:
    input_throughput: Plantation worked input scale preserves the generated raw tobacco RGO baseline.
    output_throughput: Plantation worked output scale preserves the generated raw tobacco RGO baseline.
    amortization_months: Plantation price is shared with vanilla plantation economics and intentionally outside generic raw payback cadence.
  production_methods:
    pp_tobacco_plantation_base_tobacco:
      production_efficiency: 1.0
      allow_rules:
        base_output_per_1k: Plantation employment is smaller than the generic laborer raw-site baseline, so the 30% base share is high per 1k.
    pp_tobacco_plantation_curing_barns:
      production_efficiency: 1.05
    pp_tobacco_plantation_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
