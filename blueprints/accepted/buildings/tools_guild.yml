version: 2
tag: tools_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_tools_guild_market_sales
building:
  key: tools_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_tools_guild_stone_tools_guild_maintenance
    - pp_tools_guild_copper_tools_guild_maintenance
    - pp_tools_guild_bronze_tools_guild_maintenance
    - pp_tools_guild_metalwork_guild_maintenance
  - name: slot_1
    methods:
    - pp_tools_guild_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 1
    is_foreign = no
    pop_type = burghers
    max_levels = guild_max_level
    startup_ramp_target = 90
    category = basic_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:tools_guild }
            add = {
                value = "market.market_price(goods:tools)"
                multiply = 0.16000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_tools_guild_stone_tools_guild_maintenance = {
            stone = 0.58
            manual_labor = 0.098
            produced = tools
            output = 0.2
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_tools_guild_copper_tools_guild_maintenance = {
            copper = 0.45
            manual_labor = 0.23
            produced = tools
            output = 0.448
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_tools_guild_bronze_tools_guild_maintenance = {
            copper = 0.47
            tin = 0.038
            manual_labor = 0.24
            produced = tools
            output = 0.48
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
        pp_tools_guild_metalwork_guild_maintenance = {
            iron = 0.72
            manual_labor = 0.41
            produced = tools
            output = 0.8
            debug_max_profit = guild_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_tools_guild_market_sales = {
            offset = 0.013
            produced = tools
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.63
    price = pp_tools_guild_price
prices:
  - key: pp_tools_guild_price
    body: |2-
      {gold = 100}
advancements:
- key: TRY_INJECT:copperworking
  body: |-
    unlock_production_method = pp_tools_guild_copper_tools_guild_maintenance
localization:
  entries:
    pp_tools_guild_price: Tools Guild Price
    tools_guild_slot_0: Tools Guild Work
    pp_tools_guild_metalwork_guild_maintenance: Tools Guild Metalwork Guild Maintenance
    pp_tools_guild_stone_tools_guild_maintenance: Tools Guild Stone Tools Guild Maintenance
    pp_tools_guild_bronze_tools_guild_maintenance: Tools Guild Bronze Tools Guild Maintenance
    pp_tools_guild_copper_tools_guild_maintenance: Tools Guild Copper Tools Guild Maintenance
    pp_tools_guild_market_sales: Market Sales
    pp_tools_guild_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    tools_guild_slot_1: Market
evaluation:
  allow_rules:
    amortization_months: Non-raw producer under the building price brake (double price, triple level cost, 2026-09-30); slow payback is the point.
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_tools_guild_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
