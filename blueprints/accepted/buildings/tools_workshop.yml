  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_tools_workshop_metalwork_workshop_maintenance
    - pp_tools_workshop_legacy_stone_tools_guild_maintenance
    - pp_tools_workshop_legacy_copper_tools_guild_maintenance
    - pp_tools_workshop_legacy_bronze_tools_guild_maintenance
  - name: slot_1
    methods:
    - pp_tools_workshop_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 2, own methods x1.3 goods in and out, margin +0.05
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = workshop_startup_ramp_target
    category = basic_industry_category
    employment_size = 0.287   # manufacturing tiers 2026-10-06: 0.25 after the employment cut x1.15
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    unique_production_methods = {
        pp_tools_workshop_metalwork_workshop_maintenance = {
            iron = 1.027
            manual_labor = 0.403
            produced = tools
            output = 1.492
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_tools_workshop_legacy_stone_tools_guild_maintenance = {
            icon_type = goods
            icon = stone
            stone = 0.64
            manual_labor = 0.11
            produced = tools
            output = 0.28
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_tools_workshop_legacy_copper_tools_guild_maintenance = {
            icon_type = goods
            icon = copper
            copper = 0.48
            manual_labor = 0.24
            produced = tools
            output = 0.63
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_tools_workshop_legacy_bronze_tools_guild_maintenance = {
            icon_type = goods
            icon = tin
            copper = 0.49
            tin = 0.04
            manual_labor = 0.25
            produced = tools
            output = 0.67
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_tools_workshop_market_sales = {
            offset = 0.013
            produced = tools
            output = 0.004
            category = building_maintenance
        }
    }
    construction_demand = workshop_construction
    obsolete = tools_guild
    increase_per_level_cost = 0.21
    modifier = {
        local_tools_output_modifier = -0.0025  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    raw_modifier = {
        local_pp_tools_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:tools_guild } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
advancements:
- key: TRY_INJECT:copperworking
  body: |-
    unlock_production_method = pp_tools_workshop_legacy_copper_tools_guild_maintenance
localization:
  entries:
    tools_workshop_slot_0: Tools Workshop Work
    pp_tools_workshop_metalwork_workshop_maintenance: Tools Workshop Metalwork Workshop Maintenance
    pp_tools_workshop_market_sales: Market Sales
    pp_tools_workshop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    tools_workshop_slot_1: Market
    pp_tools_workshop_legacy_bronze_tools_guild_maintenance: "$bronze_tools_guild_maintenance$ (Old Ways)"
    pp_tools_workshop_legacy_bronze_tools_guild_maintenance_desc: "An older way of working, kept from the $tools_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_tools_workshop_legacy_copper_tools_guild_maintenance: "$copper_tools_guild_maintenance$ (Old Ways)"
    pp_tools_workshop_legacy_copper_tools_guild_maintenance_desc: "An older way of working, kept from the $tools_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_tools_workshop_legacy_stone_tools_guild_maintenance: "$stone_tools_guild_maintenance$ (Old Ways)"
