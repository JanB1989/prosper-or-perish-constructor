version: 2
tag: trade_office
footprint: trade
building:
  key: trade_office
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_trade_office_requirements
  possible_production_methods: []
  body: |-
    # Vanilla building; ppc build fills in raw_modifier local_population_capacity from the footprint class.
    # Merchant house (2026-11-24, Jan: 500 levels in 75 foreign towns were spam): few, big, expensive steps, only in a
    # market centre, a great natural harbour or a megalopolis within our trade range. One step = 10 vanilla levels
    # (capacity, power, upkeep); the first step needs a host that is not hostile, further steps its good opinion and an
    # advance, the last a merchant republic. AGENTS.md "Merchant Houses".
    audio_tier = 2
    is_foreign = yes
    stronger_power_projection = no
    max_levels = 4
    # the engine refuses a foreign building without this flag (error.log, 2026-11-24), so every step needs the host's
    # opinion of 100; the allow block keeps its own relation lines
    need_good_relation = yes
    pop_type = burghers

    category = trade_category

    # the merchant house: 0.25, the most a burgher building may employ after the employment cut
    # (tests/test_building_scaling.py; vanilla 0.1 per level); its own staff comes with it
    employment_size = 0.25
    pop_size_created = 0.25

    rural_settlement = no
    town = yes
    city = yes
    megalopolis = yes

    price = pp_trade_office_price
    increase_per_level_cost = 2.6667 # x [building_scaling] increase_per_level_cost_multiplier 0.75 = 2.0 in the build: each step adds 200 % of the first (2026-11-24, Jan)

    country_potential = {
    	NOR = {
    		AND = {
    			has_reform = government_reform:japanese_imperial_family
    			country_type = building
    		}
    		has_reform = government_reform:japanese_clan
    	}
    }

    allow = {
    	custom_tooltip = {
    		text = pp_merchant_house_site_tt
    		pp_merchant_house_site = yes
    	}
    	market = { in_trade_range_of = scope:actor }
    	owner = {
    		NOT = { is_at_war_with = scope:actor }
    		NOT = { is_rival_of = scope:actor }
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:trade_office owner = scope:actor value >= 1 } } }
    			opinion = { target = scope:actor value >= 100 }
    		}
    		trigger_else = {
    			opinion = { target = scope:actor value >= 0 }
    		}
    	}
    	scope:actor = {
    		NOT = { is_rival_of = root.owner }
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:trade_office owner = scope:actor value >= 1 } } }
    			has_advance = trade_range_advance_age_3
    		}
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:trade_office owner = scope:actor value >= 2 } } }
    			has_advance = chartered_companies
    		}
    		trigger_if = {
    			limit = { root = { location_building_level = { building_type = building_type:trade_office owner = scope:actor value >= 3 } } }
    			is_merchant_republic = yes
    		}
    		# 2026-11-24 (Jan): no landless banks (vanilla's building countries); merchant federations and trading
    		# companies are trade nations and may build (pp_landless_trade_body)
    		custom_tooltip = {
    			text = pp_merchant_house_builder_tt
    			OR = { NOT = { country_type = building } pp_landless_trade_body = yes }
    		}
    		# a new house: one per owner and market, and no more houses than the trade reach allows
    		# (script_values/pp_trade_reach_values.txt); further steps of a standing house stay open
    		trigger_if = {
    			limit = { root = { NOT = { location_building_level = { building_type = building_type:trade_office owner = scope:actor value >= 1 } } } }
    			custom_tooltip = {
    				text = pp_merchant_house_one_per_market_tt
    				NOT = {
    					any_owned_foreign_building_location = {
    						market = root.market
    						pp_merchant_house_of_actor = yes
    					}
    				}
    			}
    			custom_tooltip = {
    				text = pp_merchant_house_cap_tt
    				pp_merchant_houses_held < pp_merchant_house_cap
    			}
    		}
    	}
    }

    build_time = trade_post_build_time

    unique_production_methods = {
    	pp_trade_office_requirements = {
    		icon_type = building_type
    		icon = trade_office
    		# upkeep of 3.5 vanilla levels per step (2026-11-25, Jan: dear to build, cheap to keep)
    		paper = 0.105 # vanilla 0.03 per level
    		cloth = 0.1225 # 0.035
    		salt = 0.0875 # 0.025
    		category = building_maintenance
    	}
    }

    # owner: 10 vanilla levels of capacity and power, maritime presence x5; host: a small plain mix
    modifier = {
    	merchant_capacity_from_building = 6
    	building_owner_maritime_presence = 0.25
    	merchant_power_from_building = 2
    	local_institution_growth_modifier = 0.02
    	local_max_literacy = 0.5
    	local_merchant_capacity_modifier = 0.03
    	local_migration_attraction = 0.02
    }

    # the house in the market centre itself: +50 % capacity and power
    market_center_modifier = {
    	merchant_capacity_from_building = 3
    	merchant_power_from_building = 1
    }

    # each level supports itself, so foreign levels never count as unsupported building levels of the location
    raw_modifier = {
    	free_building_levels = 1
    }

    # the engine values these buildings only by merchant capacity (never power or market rank): a market centre, a rich
    # market, a market where we have no merchant yet (the next link of a chain) and merchant republics come first;
    # / (builder income + 10) as for the merchant line (scope:owner is the host here)
    ai_construct_weight = {
    	value = 50
    	if = { limit = { is_market_center = yes } add = 50 }
    	if = {
    		limit = { exists = market }
    		if = { limit = { market = { NOT = { has_merchant = scope:builder } } } add = 100 }
    		add = { value = market.total_goods_value_traded multiply = 0.1 max = 100 }
    	}
    	if = { limit = { scope:builder = { is_merchant_republic = yes } } add = 100 }
    	divide = { value = scope:builder.monthly_income_total add = 10 }
    }
prices:
  - key: pp_trade_office_price
    body: |2-
      {gold = 820}
localization:
  entries:
    pp_trade_office_price: "[ShowBuildingTypeName('trade_office')|e] Price"
    trade_office_desc: "A merchant house our traders keep in a foreign town. It stands only in a [market_center|e], in a town with a great [natural_harbor_suitability|e] or in a [ShowLocationRankName('megalopolis')], within our [trade_range|e], and our trade reaches on from its [market|e]. We keep at most one merchant house in a market, and how many we may keep abroad grows with our trade reach: our [ShowPopTypeName('burghers')], our seafaring, our [societal_values|e] and our towns; banks and trading houses without land of their own found none. It grows in a few large steps: the first needs only a host that is not hostile to us, the next ones the host's good [opinion|e] of us and the [advance|e] [ShowAdvanceName('trade_range_advance_age_3')] and then [ShowAdvanceName('chartered_companies')], and the last is open only to a [ShowGovernmentReformName('merchant_republic')]. Each step gives us [merchant_capacity|e] and [merchant_power|e] there, more in the market centre itself; the town gains a little [literacy|e], faster spread of [institution|e]s, some merchant capacity of its own and newcomers."
    pp_trade_office_requirements: "[ShowBuildingTypeName('trade_office')|e] Requirements"
    pp_trade_office_requirements_desc: "Paper for the ledgers, cloth samples and salt keep the factors of the house in business."

evaluation:
  allow_rules:
    profit_percent: Upkeep only, the building sells nothing.
    input_throughput: Vanilla upkeep on a small staff, not a recipe.
    output_throughput: Upkeep only, the building sells nothing.
