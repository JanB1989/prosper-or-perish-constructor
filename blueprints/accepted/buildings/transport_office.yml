version: 2
tag: transport_office
footprint: infrastructure
labour:
  class: logistics
  methods:
    pp_transport_office_hand_carts: logistics_hand
logistics:
  class: urban
gate_method: pp_transport_office_ledgered_dispatch
building:
  key: transport_office
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_transport_office_maintenance
        - pp_transport_office_hand_carts
        - pp_transport_office_ledgered_dispatch
  possible_production_methods: []
  body: |2-
    is_foreign = no
    max_levels = 100
    increase_per_level_cost = 0.30
    pop_type = laborers
    employment_size = 1
    category = infrastructure_category
    custom_tags = { pp_logistics pp_city_logistics_priority }
    icon = transport_office
    town = yes
    city = yes
    megalopolis = yes
    can_close = no
    always_add_demands = yes
    ai_forbid_shutdown = yes
    build_time = infrastructure_build_time

    # cities and megalopolises always; towns once developed (in allow: location_potential would delete the office when
    # a town loses development and changes owner)
    allow = {
      OR = {
        NOT = { location_rank = location_rank:town }
        development >= 10
      }
      market_access < 0.85
      total_building_levels >= 15
    }
    construction_demand = pp_transport_office_construction

    unique_production_methods = {
      pp_transport_office_maintenance = {
        victuals = 0.48
        paper = 0.18
        tools = 0.12
        cloth = 0.072
        manual_labor = 0.59
        produced = logistics
        output = 3.45
        category = building_maintenance
      }
      pp_transport_office_hand_carts = {
        victuals = 0.42
        paper = 0.083
        tools = 0.042
        cloth = 0.031
        manual_labor = 1.34
        produced = logistics
        output = 3.45
        category = building_maintenance
      }
      pp_transport_office_ledgered_dispatch = {
        victuals = 0.32
        paper = 0.32
        tools = 0.22
        cloth = 0.032
        manual_labor = 0.59
        produced = logistics
        output = 3.6
        category = building_maintenance
      }
    }

    raw_modifier = {
      local_market_access = 0.1
    }

    modifier = {
      local_stone_output_modifier = -0.01
      local_marble_output_modifier = -0.01
      local_clay_output_modifier = -0.01
      local_sand_output_modifier = -0.01
      local_coal_output_modifier = -0.01
      local_iron_output_modifier = -0.01
      local_copper_output_modifier = -0.01
      local_tin_output_modifier = -0.01
      local_lead_output_modifier = -0.01
      local_salt_output_modifier = -0.01
      local_saltpeter_output_modifier = -0.01
      local_alum_output_modifier = -0.01
      local_lumber_output_modifier = -0.005
      local_institution_growth_modifier = 0.05
      local_supply_limit_modifier = 0.05
      local_disease_resistance = -0.05
    }
localization:
  entries:
    transport_office_slot_0: Freight Crews
    pp_transport_office_construction: Transport Office Construction
    pp_transport_office_maintenance: Clerks and Carts
    pp_transport_office_hand_carts: Hand Carts
    pp_transport_office_ledgered_dispatch: Ledgered Dispatch
    transport_office: Transport Office
    transport_office_desc: Freight clerks, porters, haulers and weighmen crowd the transport office. Ledgers, yard gates and hired hands turn a town's bulk into ordered dispatches for the market.
icon:
  source_png: ../assets/icons/transport_office.png
  output_dds: transport_office.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for an urban transport office, transparent background. Center a large blocky stone-and-timber freight office with warehouse doors, a ledger counter window, handcarts, oversized crates, sacks, weighing scale, and two or three simplified porters. Make the urban labor sink readable at low resolution; no water, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Logistics buildings earn a thin wage in the floor-priced logistics good; their payoff is market access.
    input_throughput: Transport offices keep clerks, carts and porters working for every level.
    output_throughput: The logistics good is a floor-priced wage; the real output is market access.
