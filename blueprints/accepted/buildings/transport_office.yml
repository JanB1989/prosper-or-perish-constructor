version: 2
tag: transport_office
building:
  key: transport_office
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots: []
  possible_production_methods:
    - pp_transport_office_maintenance
  body: |2-
    is_foreign = no
    max_levels = 100
    pop_type = laborers
    employment_size = 1
    category = infrastructure_category
    custom_tags = { pp_logistics_infrastructure_priority pp_logistics }
    icon = transport_office
    town = yes
    city = yes
    megalopolis = yes
    can_close = yes
    forbidden_for_estates = yes
    important_for_AI = no
    ai_forbid_shutdown = no
    build_time = infrastructure_build_time

    location_potential = {
      development >= 10
    }

    construction_demand = pp_transport_office_construction

    possible_production_methods = {
      pp_transport_office_maintenance
    }

    raw_modifier = {
    }

    modifier = {
      free_building_levels = 10
    }
production_methods:
  - key: pp_transport_office_maintenance
    body: |2-
      victuals = 0.60
      paper = 0.30
      tools = 0.20
      cloth = 0.10
      category = building_maintenance
localization:
  entries:
    pp_transport_office_construction: Transport Office Construction
    pp_transport_office_maintenance: Transport Office Maintenance
    transport_office: Transport Office
    transport_office_desc: Freight clerks, porters, haulers, and weighmen crowd the transport office. Ledgers, yard gates, and hired hands turn urban bulk into ordered dispatches for the market.
icon:
  source_png: ../assets/icons/transport_office.png
  output_dds: transport_office.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for an urban transport office, transparent background. Center a large blocky stone-and-timber freight office with warehouse doors, a ledger counter window, handcarts, oversized crates, sacks, weighing scale, and two or three simplified porters. Make the urban labor sink readable at low resolution; no water, no text, no frame.
evaluation:
  allow_rules:
    profit_percent: Maintenance-only logistics infrastructure consumes supplies while its payoff is carried by location modifiers.
    input_throughput: Transport offices are tuned as labor-absorbing urban infrastructure, not as a profitable production method.
    output_throughput: Transport offices provide supported building levels rather than direct goods output.
