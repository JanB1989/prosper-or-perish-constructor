icon:
  source_png: ../assets/icons/victualling_yard.png
  output_dds: victualling_yard.dds
  size: 512
  prompt: EU5-inspired hand-painted strategy-game icon for a victualling yard, transparent background. Center a large dockside provisioning complex with timber and stone storehouses, stacked barrels, crates, grain and salt sacks, hanging smoked meat, hardtack boxes, loading tackle, a pier edge, and a ship mast. Make it clearly larger, more maritime, and more logistical than a small cookery. Use readable painterly shapes, softly outlined historical UI art, weathered wood, muted stone, tan canvas, barrel browns, small sea-blue accents, no text, no frame, not photorealistic, not cartoonish.

