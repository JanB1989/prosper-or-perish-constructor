version: 2
tag: victualling_yard
footprint: trade
labour:
  class: keep
building:
  key: victualling_yard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_victualling_yard_pack_provisions
    - name: slot_1
      methods:
        - pp_victualling_yard_surplus_sales
    - name: slot_2
      methods:
        - pp_victualling_yard_loose_stores
        - pp_victualling_yard_pottery_jars
        - pp_victualling_yard_coopered_barrels
        - pp_victualling_yard_tin_cans
  possible_production_methods: []
  body: |2-
    is_foreign = no
    increase_per_level_cost = 0.13
    max_levels = victualling_yard_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_victualling_yard_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = victualling_yard
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_trade_construction

    # The Victualling Yard packs the lasting part of a full province store into victuals for the goods market:
    # each staffed level takes 60 food (the modifier below) and packs 1.5 victuals loose, 1:40 against the Tavern's
    # 1:30, so food that goes out and comes back always loses a quarter. Packing goods lift it to at most 1:30.
    # slot 0: packing the store. A real, positive victuals output (production efficiency scales it).
    unique_production_methods = {
      pp_victualling_yard_pack_provisions = {
        produced = victuals
        manual_labor_cost = 0.2
        output = 1.5
        category = building_maintenance
      }
    }
    # slot 1: surplus sales, the storage leg (the farms' Surplus Sales good): output modifier = country constant -1
    # + 8 per stored year = 8y; the 30.52 offset input is the fixed cost. Per level at floor prices (dummy goods and
    # labour 1 gold, y = stored years, capped at 2, loose stores): profit = 1.5p - 30.72 + 2.0 x 8y
    # -> at p = 2.7: -10.7 at 12 months, 0 at 20, +5.3 at 24. The Tavern stops at 12 months, so the two keep a
    # 12-20 month dead band that only closes at about +125 % production efficiency.
    unique_production_methods = {
      pp_victualling_yard_surplus_sales = {
        produced = province_food_sales
        offset = 30.52
        output = 2.0
        category = building_maintenance
      }
    }
    # slot 2: packing goods. Each breaks even at default prices; they only pay where the packing good is cheap.
    unique_production_methods = {
      pp_victualling_yard_loose_stores = {
        category = building_maintenance
      }
      pp_victualling_yard_pottery_jars = {
        pottery = 0.65
        manual_labor_cost = 0.11
        produced = victuals
        output = 0.25
        debug_max_profit = 0
        category = building_maintenance
      }
      pp_victualling_yard_coopered_barrels = {
        furniture = 0.30
        manual_labor_cost = 0.16
        produced = victuals
        output = 0.35
        debug_max_profit = 0
        category = building_maintenance
      }
      pp_victualling_yard_tin_cans = {
        steel = 0.26
        manual_labor_cost = 0.22
        produced = victuals
        output = 0.5
        debug_max_profit = 0
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      local_monthly_food = -60.0
      # droop: each staffed level lowers the storage leg a little, so staffing settles instead of flipping
      # (location-wide, so it also trims the farms' Sell the Surplus there; -0.2 per 60 food as before per food)
      local_province_food_sales_output_modifier = -0.2
      local_nobles_estate_power = 0.05
      local_peasant_enfranchisment = -0.01
      local_food_capacity = 1200
      # yards provisioned and refitted the fleets
      local_repair_speed = 0.01
      local_sailors = 0.01
    }
prices:
  - key: pp_victualling_yard_price
    body: |2-
      {gold = 35}
advancements:
  - key: victualling_yard_tin_cans_advance
    body: |2-
      age = age_6_revolutions
      unlock_production_method = pp_victualling_yard_tin_cans
      requires = steel_mill_advance
      icon = victualling_yard_tin_cans_advance
      ai_weight = { add = 150 }
localization:
  entries:
    victualling_yard: Victualling Yard
    victualling_yard_desc: Packs the lasting part of a full province store into [ShowGoodsName('victuals')|e] for the goods market, as the great yards that provisioned fleets and armies did. It pays off when the province store is full, and packing goods waste less of the food.
    victualling_yard_slot_0: Provisions
    victualling_yard_slot_1: Surplus Sales
    victualling_yard_slot_2: Packing
    victuals_trade_construction: Victuals Trade Construction
    pp_victualling_yard_pack_provisions: Pack Provisions
    pp_victualling_yard_surplus_sales: Sell the Surplus
    pp_victualling_yard_loose_stores: Loose Stores
    pp_victualling_yard_pottery_jars: Pottery Jars
    pp_victualling_yard_coopered_barrels: Coopered Barrels
    pp_victualling_yard_tin_cans: Tin Cans
    pp_victualling_yard_price: Victualling Yard Price
    victualling_yard_tin_cans_advance: Tin Cans
    victualling_yard_tin_cans_advance_desc: Develop canning and tinning methods that pack victuals in metal containers for longer transport and storage.
icon:
  source_png: ../assets/icons/victualling_yard.png
  output_dds: victualling_yard.dds
  size: 512
  drawing: ../../../assets/icon_drawings/victualling_yard/draw.py

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: Surplus Sales output intentionally breaks normal payback bounds.
    base_output_per_1k: The packing leg turns stored province food into victuals on one noble per level, not a production line.
  production_methods:
    pp_victualling_yard_pottery_jars:
      production_efficiency: 1.00
    pp_victualling_yard_coopered_barrels:
      production_efficiency: 1.00
    pp_victualling_yard_tin_cans:
      production_efficiency: 1.00
