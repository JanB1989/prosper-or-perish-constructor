version: 2
tag: victualling_yard
footprint: trade
labour:
  class: keep
gate_method: pp_victualling_yard_market_sales
building:
  key: victualling_yard
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_victualling_yard_river_barges
        - pp_victualling_yard_merchantmen
        - pp_victualling_yard_armed_convoy
    - name: slot_1
      methods:
        - pp_victualling_yard_grain_shipment
        - pp_victualling_yard_rice_shipment
        - pp_victualling_yard_millet_shipment
        - pp_victualling_yard_maize_shipment
        - pp_victualling_yard_legumes_shipment
        - pp_victualling_yard_fish_shipment
    - name: slot_2
      methods:
        - pp_victualling_yard_market_sales
  possible_production_methods: []
  body: |2-
    is_foreign = no
    # steep: every further level costs another full base price, so a harbour grows its Yard slowly
    increase_per_level_cost = 1.0
    max_levels = victualling_yard_max_level
    pop_type = burghers
    # about 200 burghers per level (test value 2026-09-26; most buildings use 1.0, small ones 0.3)
    employment_size = 0.2
    price = pp_victualling_yard_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = victualling_yard
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_trade_construction
    # Harbour sites only (pp_victuals_site_triggers.txt, generated from config/victuals_logistics.json); everywhere
    # else the Grange packs the province store for the overland markets.
    location_potential = {
      pp_victualling_yard_site = yes
    }

    # The harbour Yard is the merchants' victualling house: it packs a little of the province store and ships in
    # grain from the wider market, so it needs far less of the local food than the Grange and makes twice the victuals.
    # Per level: 8 food + 2.33 grain (12 food each in the farms' Provisioning) = 36 food for 1.2 victuals, which a
    # Tavern turns back into 36 food: food-neutral, where the Grange loses a quarter (24 food for 0.6 victuals).
    # 2026-09-30: every input, output and the food modifier scaled x0.4 (was 20 food + 5.83 grain -> 3.0 victuals),
    # together with the Tavern and the Grange; the per-level -5 % victuals stays, so a Yard still tops out at the same
    # level. Food capacity (was 100) removed: the Granary is the capacity building. Sailors 0.01 -> 0.003.
    # slot 0: shipping the province's own food out; the inputs are the cost of the shipment, and the better ships lose
    # less of the cargo: River Barges 0.2, Merchantmen 0.268, Armed Convoy 0.32 victuals from the 8 food. The labour share
    # falls from method to method (54 %, 12 %, 4 %), so dear labour moves a harbour up the list. The raw_modifier's -5 %
    # victuals per level keeps the Yard from making food: a convoy Yard makes (0.32 + 0.932) x 0.95 = 1.19 victuals from
    # 36 food at one level, and every further level loses another 5 %.
    unique_production_methods = {
      pp_victualling_yard_river_barges = {
        cloth = 0.02
        lumber = 0.032
        manual_labor = 0.112
        produced = victuals
        output = 0.2
        category = building_maintenance
      }
      pp_victualling_yard_merchantmen = {
        naval_supplies = 0.052
        tar = 0.068
        manual_labor = 0.032
        produced = victuals
        output = 0.268
        category = building_maintenance
      }
      # armed and escorted merchantmen, like the Venetian mude: a surgeon's chest and guns on board (Cannon Maker)
      pp_victualling_yard_armed_convoy = {
        naval_supplies = 0.04
        medicaments = 0.1
        cannons = 0.024
        manual_labor = 0.016
        produced = victuals
        output = 0.32
        category = building_maintenance
      }
    }
    # slot 1: food shipments, the long-distance staples the harbour receives (already packed, so no packing slot): grain,
    # dried pulses (ship's pease) and salt fish (market fish is already cured, the fisheries buy the salt). Every staple
    # costs 1 gold and feeds 12 food in Provisioning, so all shipments share the grain numbers and stay food-neutral.
    # Rice and maize need an advance, the same split as their farms: the countries of the rice and maize lands (the farms'
    # native triggers) have it from the start, everyone else gets it with Rice / Maize Cultivation.
    unique_production_methods = {
      pp_victualling_yard_grain_shipment = {
        wheat = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
      pp_victualling_yard_rice_shipment = {
        rice = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
      pp_victualling_yard_millet_shipment = {
        millet = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
      pp_victualling_yard_maize_shipment = {
        maize = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
      pp_victualling_yard_legumes_shipment = {
        legumes = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
      pp_victualling_yard_fish_shipment = {
        fish = 2.332
        produced = victuals
        output = 0.932
        category = building_maintenance
      }
    }
    unique_production_methods = {
      pp_victualling_yard_market_sales = {
        offset = 0.012
        produced = victuals
        output = 0.004
        category = building_maintenance
      }
    }
    # No storage leg (2026-09-26): the great harbours live on imported grain and are short of food by nature, so the
    # Yard's profit follows only the victuals price against grain and shipping. Per level at base prices (victuals 3,
    # grain 1): about +0.7..+0.9 gold at level 1, falling by the -5 % per level to 0 around level 5.

    # per Yard level, staffed or not: every level ships a little less (-5 % victuals), so a big Yard never makes food and
    # grows with diminishing returns (its free-building-level cost was removed 2026-09-30: supported levels come only from
    # location attributes and rank)
    raw_modifier = {
      local_victuals_output_modifier = -0.05
    }

    modifier = {
      local_monthly_food = -8.0
      local_burghers_estate_power = 0.05
      # yards provisioned and refitted the fleets
      local_repair_speed = 0.01
      local_sailors = 0.003
    }
prices:
  - key: pp_victualling_yard_price
    body: |2-
      {gold = 50}
advancements:
  - key: victualling_yard_armed_convoy_advance
    body: |2-
      age = age_2_renaissance
      unlock_production_method = pp_victualling_yard_armed_convoy
      requires = cannon_maker_advance
      icon = hol_maritime_warfare
      ai_weight = { add = 100 }
  # The rice and maize lands ship their staple from the start (starting_technology_level 1, like vanilla's regional crop
  # advances; level-0 countries research it in the first age without prerequisites); everyone else unlocks the method
  # with Rice / Maize Cultivation (config/crop_farms.toml unlock_production_methods).
  - key: victualling_yard_rice_shipment_advance
    body: |2-
      age = age_1_traditions
      starting_technology_level = 1
      potential = {
        exists = capital
        pp_rice_native_country = yes
      }
      unlock_production_method = pp_victualling_yard_rice_shipment
      ai_weight = { add = 50 }
  - key: victualling_yard_maize_shipment_advance
    body: |2-
      age = age_1_traditions
      starting_technology_level = 1
      potential = {
        exists = capital
        pp_maize_native_country = yes
      }
      unlock_production_method = pp_victualling_yard_maize_shipment
      ai_weight = { add = 50 }
localization:
  entries:
    victualling_yard: Victualling Yard
    victualling_yard_desc: The merchants' victualling house of a great harbour. It ships in grain, dried pulses and salt fish from the wider market and packs it, with a little of the province store, into [ShowGoodsName('victuals')|e] for the fleets and the markets beyond. Only good harbours and the great river ports can hold one, and each further level costs much more; elsewhere the Grange sends the surplus overland.
    victualling_yard_slot_0: Provisions
    victualling_yard_slot_1: Food Shipments
    victuals_trade_construction: Victuals Trade Construction
    pp_victualling_yard_river_barges: River Barges
    pp_victualling_yard_merchantmen: Merchantmen
    pp_victualling_yard_armed_convoy: Armed Convoy
    victualling_yard_armed_convoy_advance: Armed Convoys
    victualling_yard_armed_convoy_advance_desc: Merchantmen sail together under escort, with guns and a surgeon's chest on board, so the harbour's shipments reach the markets beyond even in dangerous waters.
    pp_victualling_yard_grain_shipment: Grain Shipment
    pp_victualling_yard_rice_shipment: Rice Shipment
    pp_victualling_yard_millet_shipment: Millet Shipment
    pp_victualling_yard_maize_shipment: Maize Shipment
    pp_victualling_yard_legumes_shipment: Pease Shipment
    pp_victualling_yard_legumes_shipment_desc: Dried peas and beans keep for years in the hold and were a fixed part of every ship's rations.
    pp_victualling_yard_fish_shipment: Salt Fish Shipment
    pp_victualling_yard_fish_shipment_desc: Barrels of salted herring, stockfish and salt cod come in from the fishing grounds.
    victualling_yard_rice_shipment_advance: Rice Shipments
    victualling_yard_rice_shipment_advance_desc: The harbours of the rice lands ship husked rice along the coasts and rivers to the markets beyond.
    victualling_yard_maize_shipment_advance: Maize Shipments
    victualling_yard_maize_shipment_advance_desc: The harbours of the maize lands ship dried maize along the coasts and rivers to the markets beyond.
    pp_victualling_yard_price: Victualling Yard Price
    pp_victualling_yard_market_sales: Market Sales
    pp_victualling_yard_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    victualling_yard_slot_2: Market
icon:
  source_png: ../assets/icons/victualling_yard.png
  output_dds: victualling_yard.dds
  size: 512
  drawing: ../../../assets/icon_drawings/victualling_yard/draw.py

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    base_output_per_1k: The Yard packs and ships victuals on one burgher per level, not a production line.
    amortization_months: A cheap harbour house (price 50) that pays back fast once the storage leg is gone (2026-09-26); the margin is deliberate.
  production_methods:
    pp_victualling_yard_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
