version: 2
tag: victuals_market_export
footprint: trade
labour:
  class: keep
output_tag: victuals_market
building:
  key: victuals_market
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_province_food_to_market
  possible_production_methods: []
  body: |2-
    is_foreign = no
    increase_per_level_cost = 0.13
    max_levels = victuals_market_export_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_victuals_market_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = victuals_market
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_market_construction

    # sells 3 victuals as a negative input (efficiency-immune revenue, lowers the market's victuals demand);
    # 1.425 export_sales is the storage leg: its output modifier (country constant -9, +8 per stored year) is
    # zero below 12 months and rises to 8x at the 24-month cap; the 13.5 offset input is the fixed cost.
    # Per level at floor prices (dummy goods and labour 1 gold, y = stored years, capped at 2):
    # profit = 3p - 13.8 + 1.425 x max(0, 8y - 8) -> at p = 2.7: -5.7 below 12 months, 0 at 18, +5.7 at 24;
    # at an empty store exports cannot switch on until p > 4.6.
    # A negative input never puts goods into the market, so the 1 export_tally per
    # level counts the export volume and pp_deliver_victuals_exports adds the matching victuals each month.
    unique_production_methods = {
      pp_province_food_to_market = {
        produced = export_sales
        victuals = -3.0
        export_tally = 1.0
        offset = 13.5
        manual_labor_cost = 0.3
        output = 1.425
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      # droop: each staffed level lowers the storage leg a little, so staffing settles instead of flipping
      local_export_sales_output_modifier = -0.3
      local_monthly_food = -90.0
      local_nobles_estate_power = 0.05
      local_peasant_enfranchisment = -0.01
      local_food_capacity = 1200
    }
prices:
  - key: pp_victuals_market_price
    body: |2-
      {gold = 50}
localization:
  entries:
    victuals_market: Victualler (Export)
    victuals_market_desc: Turns stored province food into [ShowGoodsName('victuals')|e] for the goods market. It pays off when the province store is full.
    victuals_market_slot_0: Export
    victuals_market_construction: Victualler Construction
    pp_province_food_to_market: Export Victuals
    pp_victuals_market_price: Victualler (Export) Price
icon:
  source_dds: ../../../mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/gfx/interface/icons/buildings/victuals_market.dds
  output_dds: victuals_market.dds
  size: 512

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: Export Sales output intentionally breaks normal payback bounds.
