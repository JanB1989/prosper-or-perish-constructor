version: 2
tag: victuals_market_export
footprint: trade
labour:
  class: keep
output_tag: victuals_market
building:
  key: victuals_market
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_province_food_to_market
    - name: slot_1
      methods:
        - pp_province_food_victuals
  possible_production_methods: []
  body: |2-
    is_foreign = no
    increase_per_level_cost = 0.13
    max_levels = victuals_market_export_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_victuals_market_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = victuals_market
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_market_construction

    # slot 0: storage leg. 0.375 province_food_sales rises from zero at an empty stockpile to 16x at the
    # 24-month cap; the offset input is the fixed cost that puts the break-even near 18 months at the mean
    # victuals price. The victuals used to be a -3 input here, but a negative input only lowers the market's
    # demand figure and never adds goods, so exported food vanished; they are real output in slot 1 now.
    unique_production_methods = {
      pp_province_food_to_market = {
        produced = province_food_sales
        offset = 10.2
        manual_labor_cost = 0.3
        output = 0.375
        category = building_maintenance
      }
    }
    # slot 1: the exported food reaches the goods market as victuals. Real output scales with production
    # efficiency and victuals output modifiers (accepted: the only engine route that adds supply), so it is
    # 2.7 per 90 food, the import market's 3 minus its 0.3 labour: an export -> import round trip only
    # creates food above +11 % efficiency. Slot 0's offset input is 0.9 lower to keep the break-even.
    unique_production_methods = {
      pp_province_food_victuals = {
        produced = victuals
        output = 2.7
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      # droop: each staffed level lowers the storage leg a little, so staffing settles instead of flipping
      local_province_food_sales_output_modifier = -0.10
      local_monthly_food = -90.0
      local_nobles_estate_power = 0.05
      local_peasant_enfranchisment = -0.01
      local_food_capacity = 1200
    }
prices:
  - key: pp_victuals_market_price
    body: |2-
      {gold = 50}
localization:
  entries:
    victuals_market: Victuals Market (Export)
    victuals_market_desc: Collects food from the province and sells it into the goods market as [ShowGoodsName('victuals')|e].
    victuals_market_slot_0: Victuals Export
    victuals_market_slot_1: Victuals Sold
    victuals_market_construction: Victuals Market Construction
    pp_province_food_to_market: Export Province Food
    pp_province_food_victuals: Victuals for the Market
    pp_victuals_market_price: Victuals Market Price
icon:
  source_dds: ../../../mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/gfx/interface/icons/buildings/victuals_market.dds
  output_dds: victuals_market.dds
  size: 512

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: Province Food Sales output intentionally breaks normal payback bounds.
    base_output_per_1k: The victuals are 90 province food per level turned into goods on one noble per level, not a production line.
