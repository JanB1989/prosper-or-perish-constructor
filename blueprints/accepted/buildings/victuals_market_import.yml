version: 2
tag: victuals_market_import
footprint: trade
building:
  key: victuals_market_import
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
    - name: slot_0
      methods:
        - pp_province_food_from_market
    - name: slot_1
      methods:
        - pp_province_storage_price
  possible_production_methods: []
  body: |2-
    is_foreign = no
    increase_per_level_cost = 0.00
    max_levels = victuals_market_import_max_level
    pop_type = nobles
    employment_size = 0.001
    price = pp_victuals_market_import_price
    category = consumer_goods_category
    custom_tags = { pp_food_security_priority pp_food_distribution_priority }
    icon = victuals_market_import
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    ai_forbid_shutdown = yes
    important_for_AI = yes
    can_close = yes
    forbidden_for_estates = no
    AI_ignore_available_worker_flag = yes
    build_time = 365
    construction_demand = victuals_market_construction

    # slot 0: provisioning. Balanced at floor prices (dummy goods = 1 gold, 20 % of default): costs 3 victuals x 3
    # + 0.3 labour x 1 = 9.3 gold and earns 0.45 offset x 20 (country constant +19) = 9.0 gold -> -0.3 profit.
    # The x20 constant keeps production efficiency small on this income (+50 % efficiency = +2.5 %).
    unique_production_methods = {
      pp_province_food_from_market = {
        produced = offset
        victuals = 3.0
        manual_labor_cost = 0.3
        output = 0.45
        category = building_maintenance
      }
    }
    # slot 1: storage price. 0.375 province_food_purchase whose output modifier runs from 16x at an empty stockpile
    # (6 gold) to zero at the 24-month cap (+8 more while starving), minus a fixed 3 offset input (3 gold, inputs
    # ignore production efficiency): +3 gold per level when empty, -3 when full, 0 at 12 months.
    unique_production_methods = {
      pp_province_storage_price = {
        produced = province_food_purchase
        offset = 3.0
        output = 0.375
        category = building_maintenance
      }
    }

    raw_modifier = {
    }

    modifier = {
      local_monthly_food = 90.0
      # droop: each staffed level lowers the storage leg a little, so staffing settles instead of flipping
      local_province_food_purchase_output_modifier = -0.10
    }
prices:
  - key: pp_victuals_market_import_price
    body: |2-
      {gold = 50}
localization:
  entries:
    victuals_market_import: Victuals Market (Import)
    victuals_market_import_desc: Purchases [ShowGoodsName('victuals')|e] from the goods market and distributes them into the province's food supply.
    victuals_market_import_slot_0: Provisioning
    victuals_market_import_slot_1: Storage Price
    pp_province_food_from_market: Import Market Victuals
    pp_province_storage_price: Local Storage Price
    pp_victuals_market_import_price: Victuals Market Price
icon:
  source_dds: ../../../mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/gfx/interface/icons/buildings/victuals_market.dds
  output_dds: victuals_market_import.dds
  size: 512

evaluation:
  allow_rules:
    profit_percent: Province food market transfers intentionally use internal balancing goods.
    input_throughput: Existing accepted input scale predates the global employment throughput baseline.
    output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    amortization_months: Province Food Purchase output intentionally breaks normal payback bounds.
    base_output_per_1k: The storage-price leg is a no-input dummy signal on one noble per level, not a production line.
