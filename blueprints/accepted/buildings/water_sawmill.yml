  prompt: EU5-inspired hand-painted strategy-game icon for a water-powered sawmill, transparent background. Center a timber millrace and waterwheel driving a single vertical sash saw, stacked logs, fresh boards, log pond edge, and simple timber yard. Use readable painterly historical UI art, weathered wood, water accents, forest greens, no text, no frame, not photorealistic, not cartoonish.

