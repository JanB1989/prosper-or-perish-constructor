version: 2
tag: weapon_factory
footprint: mill_works
labour:
  class: craft_revolutions
gate_method: pp_weapon_factory_market_sales
building:
  key: weapon_factory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_weapon_factory_weapon_factory_maintenance
    - pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance
    - pp_weapon_factory_legacy_weapon_smith_maintenance
    - pp_weapon_factory_legacy_weapon_manufactory_maintenance
  - name: slot_1
    methods:
    - pp_weapon_factory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 6
    is_foreign = no
    pop_type = laborers
    is_mill = yes
    max_levels = mills_max_level
    startup_ramp_target = 210
    category = weapons_industry_category
    employment_size = 1.0
    town = yes
    city = yes
    megalopolis = yes
    obsolete = weapon_manufactory
    build_time = mills_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:weapon_factory }
            add = {
                value = "market.market_price(goods:weaponry)"
                multiply = 0.64000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_weapon_factory_weapon_factory_maintenance = {
            steel = 1.83
            coal = 0.55
            lumber = 0.55
            manual_labor = 0.49
            category = mills_input
            produced = weaponry
            output = 3.2
            debug_max_profit = mills_profit_margin
        }
        pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance = {
            icon_type = goods
            icon = stone
            lumber = 0.11
            stone = 1.51
            manual_labor = 0.28
            produced = weaponry
            output = 0.54
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
        pp_weapon_factory_legacy_weapon_smith_maintenance = {
            icon_type = goods
            icon = weaponry
            lumber = 0.71
            coal = 0.87
            tools = 0.22
            leather = 0.19
            manual_labor = 0.66
            produced = weaponry
            output = 1.35
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
        pp_weapon_factory_legacy_weapon_manufactory_maintenance = {
            icon_type = building_type
            icon = weapon_manufactory
            lumber = 1.1
            coal = 1.19
            iron = 0.71
            tools = 0.41
            manual_labor = 0.68
            produced = weaponry
            output = 2.4
            debug_max_profit = mills_profit_margin
            category = mills_input
        }
    }
    unique_production_methods = {
        pp_weapon_factory_market_sales = {
            offset = 0.012
            produced = weaponry
            output = 0.004
            category = building_maintenance
        }
    }
    custom_tags = {
        lategame_manufactory
    }
    construction_demand = mill_construction
    raw_modifier = {
        local_burghers_desired_pop = 0.05
    }
    increase_per_level_cost = 0.25
localization:
  entries:
    weapon_factory_slot_0: Weapon Factory Work
    pp_weapon_factory_weapon_factory_maintenance: Weapon Factory Weapon Factory Maintenance
    pp_weapon_factory_market_sales: Market Sales
    pp_weapon_factory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    weapon_factory_slot_1: Market
    pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance: "$pre_columbian_weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_factory_legacy_weapon_manufactory_maintenance: "$weapon_manufactory_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_weapon_manufactory_maintenance_desc: "An older way of working, kept from the $weapon_manufactory$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_factory_legacy_weapon_smith_maintenance: "$weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_weapon_factory_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
