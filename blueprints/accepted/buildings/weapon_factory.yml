localization:
  entries:
    weapon_factory_slot_0: Weapon Factory Work
    pp_weapon_factory_weapon_factory_maintenance: Weapon Factory Weapon Factory Maintenance
    pp_weapon_factory_market_sales: Market Sales
    pp_weapon_factory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    weapon_factory_slot_1: Market
    pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance: "$pre_columbian_weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_pre_columbian_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_factory_legacy_weapon_manufactory_maintenance: "$weapon_manufactory_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_weapon_manufactory_maintenance_desc: "An older way of working, kept from the $weapon_manufactory$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_factory_legacy_weapon_smith_maintenance: "$weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_factory_legacy_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
