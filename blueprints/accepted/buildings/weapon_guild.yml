version: 2
tag: weapon_guild
footprint: urban_workshop
labour:
  class: craft_medieval
gate_method: pp_weapon_guild_market_sales
building:
  key: weapon_guild
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_weapon_guild_pre_columbian_weapon_smith_maintenance
    - pp_weapon_guild_weapon_guild_obsidian_maintenance
    - pp_weapon_guild_weapon_smith_maintenance
  - name: slot_1
    methods:
    - pp_weapon_guild_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 1, own methods x0.7 goods in and out
    is_foreign = no
    pop_type = burghers
    max_levels = guild_max_level
    startup_ramp_target = guild_startup_ramp_target
    category = weapons_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = guild_build_time
    unique_production_methods = {
        pp_weapon_guild_pre_columbian_weapon_smith_maintenance = {
            lumber = 0.042
            stone = 0.602
            manual_labor = 0.112
            produced = weaponry
            output = 0.28
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_weapon_guild_weapon_guild_obsidian_maintenance = {
            lumber = 0.07
            stone = 0.308
            gems = 0.062
            manual_labor = 0.112
            produced = weaponry
            output = 0.28
            category = guild_input
            debug_max_profit = guild_profit_margin
        }
        pp_weapon_guild_weapon_smith_maintenance = {
            lumber = 0.308 # hafts, shafts and bow staves
            coal = 0.378 # forge fuel
            tools = 0.098 # tools cut to a running cost (~15 %, arms making)
            leather = 0.084 # grips, scabbards and straps
            manual_labor = 0.287
            category = guild_input
            produced = weaponry
            output = 0.7
            debug_max_profit = guild_profit_margin
        }
    }
    unique_production_methods = {
        pp_weapon_guild_market_sales = {
            offset = 0.012
            produced = weaponry
            output = 0.004
            category = building_maintenance
        }
    }
    custom_tags = {
        guild
    }
    construction_demand = guild_construction
    # Non-raw producer: double price and triple level cost (2026-09-30, urbanisation brake).
    increase_per_level_cost = 0.75
    price = pp_weapon_guild_price
    modifier = {
        local_weaponry_output_modifier = -0.005  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    raw_modifier = {
        local_pp_weaponry_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
prices:
  - key: pp_weapon_guild_price
    body: |2-
      {gold = 100}
advancements:
- key: TRY_INJECT:refined_obsidian_weaponry
  body: |-
    unlock_production_method = pp_weapon_guild_weapon_guild_obsidian_maintenance
localization:
  entries:
    pp_weapon_guild_price: Weapon Guild Price
    weapon_guild_slot_0: Weapon Guild Work
    pp_weapon_guild_pre_columbian_weapon_smith_maintenance: Weapon Guild Pre Columbian Weapon Smith Maintenance
    pp_weapon_guild_weapon_smith_maintenance: Weapon Guild Weapon Smith Maintenance
    pp_weapon_guild_weapon_guild_obsidian_maintenance: Weapon Guild Weapon Guild Obsidian Maintenance
    pp_weapon_guild_market_sales: Market Sales
    pp_weapon_guild_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    weapon_guild_slot_1: Market
evaluation:
  allow_rules:
    amortization_months: Non-raw producer under the building price brake (double price, triple level cost, 2026-09-30); slow payback is the point.
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_weapon_guild_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
