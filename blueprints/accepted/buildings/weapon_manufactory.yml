version: 2
tag: weapon_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
gate_method: pp_weapon_manufactory_market_sales
building:
  key: weapon_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_weapon_manufactory_weapon_manufactory_maintenance
    - pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance
    - pp_weapon_manufactory_legacy_weapon_smith_maintenance
  - name: slot_1
    methods:
    - pp_weapon_manufactory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 180
    category = weapons_industry_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    obsolete = weapon_workshop
    build_time = manufactory_build_time
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:weapon_manufactory }
            add = {
                value = "market.market_price(goods:weaponry)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_weapon_manufactory_weapon_manufactory_maintenance = {
            lumber = 0.73 # hafts and shafts
            coal = 0.79 # forge and tempering fuel
            iron = 0.47
            tools = 0.27 # tools cut to a running cost (~15 %, arms making)
            manual_labor = 0.45
            category = manufactory_input
            produced = weaponry
            output = 1.6
            debug_max_profit = manufactory_profit_margin
        }
        pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance = {
            icon_type = goods
            icon = stone
            lumber = 0.07
            stone = 1
            manual_labor = 0.19
            produced = weaponry
            output = 0.36
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
        pp_weapon_manufactory_legacy_weapon_smith_maintenance = {
            icon_type = goods
            icon = weaponry
            lumber = 0.47
            coal = 0.58
            tools = 0.15
            leather = 0.13
            manual_labor = 0.44
            produced = weaponry
            output = 0.9
            debug_max_profit = manufactory_profit_margin
            category = manufactory_input
        }
    }
    unique_production_methods = {
        pp_weapon_manufactory_market_sales = {
            offset = 0.012
            produced = weaponry
            output = 0.004
            category = building_maintenance
        }
    }
    custom_tags = {
        midgame_manufactory
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.25
localization:
  entries:
    weapon_manufactory_slot_0: Weapon Manufactory Work
    pp_weapon_manufactory_weapon_manufactory_maintenance: Weapon Manufactory Weapon Manufactory Maintenance
    pp_weapon_manufactory_market_sales: Market Sales
    pp_weapon_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    weapon_manufactory_slot_1: Market
    pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance: "$pre_columbian_weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_manufactory_legacy_weapon_smith_maintenance: "$weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_manufactory_legacy_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_weapon_manufactory_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
    pp_weapon_manufactory_legacy_weapon_smith_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
