version: 2
tag: weapon_workshop
footprint: urban_workshop
labour:
  class: craft_discovery
gate_method: pp_weapon_workshop_market_sales
building:
  key: weapon_workshop
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_weapon_workshop_weapon_workshop_maintenance
    - pp_weapon_workshop_legacy_pre_columbian_weapon_smith_maintenance
    - pp_weapon_workshop_legacy_weapon_smith_maintenance
  - name: slot_1
    methods:
    - pp_weapon_workshop_market_sales
  possible_production_methods: []
  body: |
    # manufacturing tiers 2026-10-06: tier 2, own methods x1.3 goods in and out, margin +0.05
    audio_tier = 2
    is_foreign = no
    pop_type = burghers
    max_levels = workshop_max_level
    startup_ramp_target = workshop_startup_ramp_target
    category = weapons_industry_category
    employment_size = 0.287   # manufacturing tiers 2026-10-06: 0.25 after the employment cut x1.15
    town = yes
    city = yes
    megalopolis = yes
    build_time = workshop_build_time
    unique_production_methods = {
        pp_weapon_workshop_weapon_workshop_maintenance = {
            lumber = 0.481 # hafts and shafts
            coal = 0.481 # forge fuel
            iron = 0.338
            tools = 0.182 # tools cut to a running cost (~15 %, arms making)
            manual_labor = 0.468
            category = workshop_input
            produced = weaponry
            output = 1.497
            debug_max_profit = workshop_profit_margin
        }
        pp_weapon_workshop_legacy_pre_columbian_weapon_smith_maintenance = {
            icon_type = goods
            icon = stone
            lumber = 0.065
            stone = 0.93
            manual_labor = 0.17
            produced = weaponry
            output = 0.45
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
        pp_weapon_workshop_legacy_weapon_smith_maintenance = {
            icon_type = goods
            icon = weaponry
            lumber = 0.43
            coal = 0.53
            tools = 0.14
            leather = 0.12
            manual_labor = 0.4
            produced = weaponry
            output = 1.12
            debug_max_profit = workshop_profit_margin
            category = workshop_input
        }
    }
    unique_production_methods = {
        pp_weapon_workshop_market_sales = {
            offset = 0.012
            produced = weaponry
            output = 0.004
            category = building_maintenance
        }
    }
    obsolete = weapon_guild
    custom_tags = {
        workshop
    }
    construction_demand = workshop_construction
    increase_per_level_cost = 0.25
    modifier = {
        local_weaponry_output_modifier = -0.0025  # manufacturing tiers 2026-10-06: stack malus per staffed level
    }
    raw_modifier = {
        local_pp_weaponry_line_levels = 1  # manufacturing tiers 2026-10-06: line levels for the town rights
    }
    # manufacturing tiers 2026-10-06: the engine scores a replacement with AI_UPGRADE_BUILDING_UTILITY 0.001, so the
    # AI barely upgraded; 200 / (income + 10) where the predecessor stands, like the farm upgrades
    ai_construct_weight = {
        value = 0
        if = { limit = { has_building = building_type:weapon_guild } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }
localization:
  entries:
    weapon_workshop_slot_0: Weapon Workshop Work
    pp_weapon_workshop_weapon_workshop_maintenance: Weapon Workshop Weapon Workshop Maintenance
    pp_weapon_workshop_market_sales: Market Sales
    pp_weapon_workshop_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    weapon_workshop_slot_1: Market
    pp_weapon_workshop_legacy_pre_columbian_weapon_smith_maintenance: "$pre_columbian_weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_workshop_legacy_pre_columbian_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_weapon_workshop_legacy_weapon_smith_maintenance: "$weapon_smith_maintenance$ (Old Ways)"
    pp_weapon_workshop_legacy_weapon_smith_maintenance_desc: "An older way of working, kept from the $weapon_guild$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_weapon_workshop_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_weapon_workshop_legacy_pre_columbian_weapon_smith_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
