version: 2
tag: wheat_farmstead
output_tag: wheat_farm_tier1
footprint: farm_land
labour:
  class: primary_discovery
  methods:
    pp_wheat_farmstead_base: base
    pp_wheat_farmstead_provision: keep
gate_method: pp_wheat_farmstead_provision
upgrade_chain:
  family: wheat_farm
  tier: 1
  previous: wheat_farm
  next: wheat_rotations
  unlock_advance: pp_manuring_and_seed_stores
building:
  key: wheat_farmstead
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_wheat_farmstead_base
  - name: slot_1
    methods:
    - pp_wheat_farmstead_no_cultivation
    - pp_wheat_farmstead_manured_three_field
  - name: slot_2
    methods:
    - pp_wheat_farmstead_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_wheat_farmstead
    pop_type = peasants
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = wheat_farmstead
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = wheat_farm
    forbidden_for_estates = yes
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_wheat_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:wheat)"
                divide = "default_price(goods:wheat)"
                multiply = { value = 1 add = modifier:local_wheat_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_wheat_farmstead_base = {
            manual_labor = 0.016
            produced = wheat
            output = 0.08
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_wheat_farmstead_no_cultivation = {
            category = building_maintenance
        }
        pp_wheat_farmstead_manured_three_field = {
            horses = 0.043
            livestock = 0.086
            tools = 0.017
            lumber = 0.022
            manual_labor = 0.059
            produced = wheat
            output = 0.64
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_wheat_farmstead_provision = {
            wheat = 0.013
            produced = local_food
            output = 2
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_wheat_farmstead = -1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_pp_farm_levels = 1
        local_monthly_food = 1.5
        local_food_capacity = 50
        local_peasants_estate_power = 0.03
        local_peasant_enfranchisment = 0.002
        local_laborers_desired_pop = 0
    }
advancements:
- key: pp_manuring_and_seed_stores
  body: |-
    icon = husbandry_farmstead
    age = age_3_discovery
    requires = rgo_size_advance_discovery
    unlock_building = wheat_farmstead
    unlock_building = rice_farmstead
    unlock_building = millet_farmstead
    unlock_building = maize_farmstead
    unlock_building = legume_farmstead
    unlock_building = potato_farmstead
    unlock_building = olive_farmstead
    unlock_building = cattle_farmstead
    ai_weight = { add = 125 }
localization:
  entries:
    wheat_farmstead: Wheat Farmstead
    wheat_farmstead_desc: Manure yards, seed stores and granaries keep the wheat fields in good heart.
    wheat_farmstead_slot_0: Fields
    wheat_farmstead_slot_1: Cultivation
    wheat_farmstead_slot_2: Provisioning
    pp_wheat_farmstead_base: Fields
    pp_wheat_farmstead_no_cultivation: No Cultivation
    pp_wheat_farmstead_manured_three_field: Manured Three-Field
    pp_wheat_farmstead_manured_three_field_desc: Winter corn, spring corn and a manured fallow follow each other on the fields.
    pp_wheat_farmstead_provision: Provision with Wheat
    pp_wheat_farmstead_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_manuring_and_seed_stores: Manuring and Seed Stores
    pp_manuring_and_seed_stores_desc: Peasant households select seed, keep it dry, and recycle livestock manure into established fields before formal rotational farming.
icon:
  source_png: ../assets/icons/wheat_farmstead.png
  output_dds: wheat_farmstead.dds
  size: 512
evaluation:
  allow_rules:
    profit_percent: Passive selectors, no-output options, and household sidelines can sit outside the narrow margin band; worked farmstead methods carry the tier balance.
    base_output_per_1k: Early farmstead selectors keep passive food output small; worked crop methods carry the tier economy.
    input_throughput: Husbandry farmsteads are an age 3 bridge and intentionally stay below rotational farming throughput.
    output_throughput: Husbandry farmsteads are an age 3 bridge and intentionally stay below rotational farming throughput.
  production_methods:
    pp_wheat_farmstead_base:
      production_efficiency: 1.0
    pp_wheat_farmstead_no_cultivation:
      production_efficiency: 1.0
    pp_wheat_farmstead_manured_three_field:
      production_efficiency: 1.05
    pp_wheat_farmstead_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
