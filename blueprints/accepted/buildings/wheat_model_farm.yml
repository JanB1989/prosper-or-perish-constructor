version: 2
tag: wheat_model_farm
output_tag: wheat_farm_tier3
footprint: farm_land
labour:
  class: primary_absolutism
  methods:
    pp_wheat_model_farm_base: base
    pp_wheat_model_farm_provision: keep
gate_method: pp_wheat_model_farm_provision
upgrade_chain:
  family: wheat_farm
  tier: 3
  previous: wheat_rotations
  next: null
  unlock_advance: pp_model_farm
building:
  key: wheat_model_farm
  mode: CREATE
  source: pp_new_buildings.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_wheat_model_farm_base
  - name: slot_1
    methods:
    - pp_wheat_model_farm_no_cultivation
    - pp_wheat_model_farm_seed_drill
  - name: slot_2
    methods:
    - pp_wheat_model_farm_provision
  possible_production_methods: []
  body: |-
    is_foreign = no
    increase_per_level_cost = 0.09
    max_levels = farm_capacity_max_wheat_model_farm
    pop_type = laborers
    employment_size = 1
    category = village_category
    custom_tags = { farming_capacity pp_food_security_priority pp_staple_food_priority }
    icon = wheat_model_farm
    rural_settlement = yes
    town = yes
    city = yes
    megalopolis = yes
    obsolete = wheat_rotations
    forbidden_for_estates = no
    ai_forbid_shutdown = no
    can_close = yes
    build_time = workshop_build_time
    construction_demand = workshop_construction

    location_potential = {
        pp_wheat_farm_location_potential = yes
    }
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market }
            add = {
                value = "market.market_price(goods:wheat)"
                divide = "default_price(goods:wheat)"
                multiply = { value = 1 add = modifier:local_wheat_output_modifier }
                subtract = 1
                multiply = 400
            }
        }
        # a province short of food wants farms first
        add = { value = 14 subtract = pp_location_stored_months divide = 14 min = 0 max = 1 multiply = 120 }
        # spread out: every farm level already here makes the next one less wanted
        subtract = { value = modifier:local_pp_farm_levels max = 30 multiply = 4 }
        # upgrade where the previous tier stands ([age_food] upgrade_weight): the engine scores a replacement with a
        # near-zero upgrade utility, so the weight carries it
        if = { limit = { has_building = building_type:wheat_rotations } add = 200 }
        divide = { value = scope:owner.monthly_income_total add = 10 }
    }

    unique_production_methods = {
        pp_wheat_model_farm_base = {
            manual_labor = 0.029
            produced = wheat
            output = 0.145
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_wheat_model_farm_no_cultivation = {
            category = building_maintenance
        }
        pp_wheat_model_farm_seed_drill = {
            tools = 0.32
            horses = 0.27
            legumes = 0.33
            paper = 0.17
            manual_labor = 0.22
            produced = wheat
            output = 3.07
            debug_max_profit = 0
            category = building_maintenance
        }
    }
    unique_production_methods = {
        pp_wheat_model_farm_provision = {
            wheat = 0.024
            produced = local_food
            output = 3.625
            debug_max_profit = 0
            category = building_maintenance
        }
    }

    raw_modifier = {
      farm_capacity_from_wheat_model_farm = -1
      local_pp_farm_levels = 1
      local_population_capacity = -5
      local_pp_farmland_used = 5
    }

    modifier = {
        local_monthly_food = 6
        local_food_capacity = 50
        local_laborers_desired_pop = 0.002
    }
advancements:
- key: pp_model_farm
  body: |-
    icon = model_farm
    age = age_5_absolutism
    requires = scientific_revolution_advance
    unlock_building = wheat_model_farm
    unlock_building = rice_model_farm
    unlock_building = millet_model_farm
    unlock_building = maize_model_farm
    unlock_building = legume_model_farm
    unlock_building = potato_model_farm
    unlock_building = olive_model_farm
    unlock_building = cattle_model_farm
    ai_weight = { add = 125 }
localization:
  entries:
    wheat_model_farm: Wheat Model Farm
    wheat_model_farm_desc: Surveyed fields, seed drills and hired hands raise wheat on a larger managed farm.
    wheat_model_farm_slot_0: Fields
    wheat_model_farm_slot_1: Cultivation
    wheat_model_farm_slot_2: Provisioning
    pp_wheat_model_farm_base: Fields
    pp_wheat_model_farm_no_cultivation: No Cultivation
    pp_wheat_model_farm_seed_drill: Seed Drill and Horse-Hoe
    pp_wheat_model_farm_seed_drill_desc: Seed drills sow in rows and horse-hoes keep the rows clean.
    pp_wheat_model_farm_provision: Provision with Wheat
    pp_wheat_model_farm_provision_desc: The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_model_farm: Model Farms
    pp_model_farm_desc: Field surveys, seed drills, horse-hoes, crop rotations, and printed agronomy organize village cultivation into a larger managed farm.
icon:
  source_png: ../assets/icons/wheat_model_farm.png
  output_dds: wheat_model_farm.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: The 10k laborer model farm keeps a slower estate-improvement payback than global construction targets; revisit with the rural producer rebalance.
    input_throughput: Food relief of age_5_absolutism (age_food.py, throughput x1.45) raises output per worker on purpose.
    output_throughput: Food relief of age_5_absolutism (age_food.py, throughput x1.45) raises output per worker on purpose.
  production_methods:
    pp_wheat_model_farm_base:
      production_efficiency: 1.0
      allow_rules:
        input_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
        output_throughput: Method throughput intentionally stays below the global full-building target after error-log input tuning.
    pp_wheat_model_farm_no_cultivation:
      production_efficiency: 1.0
    pp_wheat_model_farm_seed_drill:
      production_efficiency: 1.0
    pp_wheat_model_farm_provision:
      allow_rules:
        profit_percent: Provisioning takes a token of the crop and feeds the province; it is the farm's AI gate, so its margin is far above the threshold by design.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
