- key: pp_water_lifting
  body: |-
    age = age_4_reformation
    requires = pp_farming_village_rotations
    unlock_production_method = pp_rice_rotations_chain_pump
    unlock_production_method = pp_olive_rotations_irrigated_grove
    ai_weight = { add = 50 }
localization:
  entries:
    wheat_rotations: Wheat Rotation Farm
    wheat_rotations_desc: Clover and pulse leys take turns with the wheat so the fields rest without lying bare.
    wheat_rotations_slot_0: Fields
    wheat_rotations_slot_1: Cultivation
    wheat_rotations_slot_2: Provisioning
    wheat_rotations_slot_3: Market
    pp_wheat_rotations_base: Fields
    pp_wheat_rotations_no_cultivation: No Cultivation
    pp_wheat_rotations_clover_ley: Clover Ley Rotation
    pp_wheat_rotations_clover_ley_desc: Clover and pulse leys replace the bare fallow.
    pp_wheat_rotations_marled_fields: Marled Fields
    pp_wheat_rotations_marled_fields_desc: Marl and clay dressings sweeten sour fields between the leys.
    pp_wheat_rotations_provision: Provision with Wheat
    pp_wheat_rotations_provision_desc: The household buys its own crop back and cooks for the province. The lower the province store is, the more food it makes of it.
    pp_farming_village_rotations: Rotational Farmsteads
    pp_farming_village_rotations_desc: Legume rotations, managed fallow, hedges, manure carts, and mixed husbandry make peasant village fields more reliable without turning them into planned model farms.
    pp_improved_rotations: Improved Rotations
    pp_improved_rotations_desc: Marl, fodder crops and seed selection lift the yields of village rotations.
    pp_water_lifting: Water Lifting
    pp_water_lifting_desc: Chain pumps and channels bring water to paddies and groves.
    pp_wheat_rotations_market_sales: Market Sales
    pp_wheat_rotations_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
icon:
  source_png: ../assets/icons/wheat_rotations.png
  output_dds: wheat_rotations.dds
  size: 512
evaluation:
  allow_rules:
    amortization_months: Intermediate farm upgrade intentionally has slower payback than global construction targets; revisit with the rural producer rebalance.
  production_methods:
    pp_wheat_rotations_base:
      production_efficiency: 1.0
    pp_wheat_rotations_no_cultivation:
      production_efficiency: 1.0
    pp_wheat_rotations_clover_ley:
      production_efficiency: 1.0
    pp_wheat_rotations_marled_fields:
      production_efficiency: 1.0
    pp_wheat_rotations_provision:
      allow_rules:
        profit_percent: Provisioning is balanced at the Province Food floor (12 food per gold of crop); the province store moves its output.
        input_throughput: Existing accepted input scale predates the global employment throughput baseline.
        output_throughput: Existing accepted output scale predates the global employment throughput baseline.
    pp_wheat_rotations_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
