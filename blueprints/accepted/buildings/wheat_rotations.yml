  body: |-
    age = age_4_reformation
    requires = pp_farming_village_rotations
    unlock_production_method = pp_wheat_rotations_marled_fields
    unlock_production_method = pp_millet_rotations_sorghum_cowpea
    unlock_production_method = pp_maize_rotations_maize_bean_rotation
    unlock_production_method = pp_legume_rotations_vetch_lentil
    unlock_production_method = pp_potato_rotations_seed_selection
