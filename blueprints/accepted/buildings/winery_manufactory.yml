version: 2
tag: winery_manufactory
footprint: manufactory
labour:
  class: craft_absolutism
gate_method: pp_winery_manufactory_market_sales
building:
  key: winery_manufactory
  mode: REPLACE
  source: pp_building_adjustments.txt
  production_method_slots:
  - name: slot_0
    methods:
    - pp_winery_manufactory_fruit_winery_manufactory_maintenance
    - pp_winery_manufactory_rice_winery_manufactory_maintenance
    - pp_winery_manufactory_honey_winery_manufactory_maintenance
    - pp_winery_manufactory_legacy_fruit_winery_maintenance
    - pp_winery_manufactory_legacy_rice_winery_maintenance
  - name: slot_1
    methods:
    - pp_winery_manufactory_market_sales
  possible_production_methods: []
  body: |
    audio_tier = 3
    is_foreign = no
    pop_type = burghers
    max_levels = manufactory_max_level
    startup_ramp_target = 90
    category = consumer_goods_category
    employment_size = 0.3
    town = yes
    city = yes
    megalopolis = yes
    build_time = manufactory_build_time
    obsolete = winery
    # mastery (establishment branch, 2026-10-06): the AI scores a workshop at its recipe output and never sees
    # the +20 % a mastered workshop makes, so expanding one gets that extra profit as weight: 0.2 x best output x
    # price x market access x sqrt(owner gold + 100) x K (K fitted in game on twin buildings; matches the median).
    ai_construct_weight = {
        value = 0
        if = {
            limit = { exists = market has_building = building_type:winery_manufactory }
            add = {
                value = "market.market_price(goods:wine)"
                multiply = 0.32000
                multiply = { value = market_access max = 1 min = 0 }
                multiply = { value = scope:owner.gold min = 0 add = 100 pow = 0.5 }
                multiply = 0.2845
            }
        }
    }
    unique_production_methods = {
        pp_winery_manufactory_fruit_winery_manufactory_maintenance = {
            fruit = 2.05
            lumber = 0.49 # casks, vats and press timber
            tools = 0.115 # tools cut to a running cost (~10 %)
            glass = 0.07 # glass bottles
            manual_labor = 0.28
            produced = wine
            output = 1.6
            category = guild_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_winery_manufactory_rice_winery_manufactory_maintenance = {
            rice = 2.05
            lumber = 0.49 # vats and steaming fuel
            tools = 0.115 # tools cut to a running cost (~10 %)
            pottery = 0.21 # stoneware storage jars
            manual_labor = 0.28
            produced = wine
            output = 1.6
            category = manufactory_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_winery_manufactory_honey_winery_manufactory_maintenance = {
            beeswax = 1.04
            lumber = 0.6 # casks, vats and fuel for the must
            tools = 0.115 # tools cut to a running cost (~10 %)
            manual_labor = 0.27
            produced = wine
            output = 1.6
            category = manufactory_input
            debug_max_profit = manufactory_profit_margin
        }
        pp_winery_manufactory_legacy_fruit_winery_maintenance = {
            icon_type = goods
            icon = fruit
            fruit = 1.63
            lumber = 0.29
            tools = 0.087
            manual_labor = 0.41
            produced = wine
            output = 1.2
            debug_max_profit = manufactory_profit_margin
            category = guild_input
        }
        pp_winery_manufactory_legacy_rice_winery_maintenance = {
            icon_type = goods
            icon = rice
            rice = 1.63
            lumber = 0.3
            tools = 0.086
            manual_labor = 0.39
            produced = wine
            output = 1.2
            debug_max_profit = manufactory_profit_margin
            category = guild_input
        }
    }
    unique_production_methods = {
        pp_winery_manufactory_market_sales = {
            offset = 0.01
            produced = wine
            output = 0.005
            category = building_maintenance
        }
    }
    construction_demand = manufactory_construction
    increase_per_level_cost = 0.25
localization:
  entries:
    winery_manufactory_slot_0: Winery Manufactory Work
    pp_winery_manufactory_fruit_winery_manufactory_maintenance: Winery Manufactory Fruit Winery Manufactory Maintenance
    pp_winery_manufactory_rice_winery_manufactory_maintenance: Winery Manufactory Rice Winery Manufactory Maintenance
    pp_winery_manufactory_honey_winery_manufactory_maintenance: Winery Manufactory Honey Winery Manufactory Maintenance
    pp_winery_manufactory_market_sales: Market Sales
    pp_winery_manufactory_market_sales_desc: A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price.
    winery_manufactory_slot_1: Market
    pp_winery_manufactory_legacy_fruit_winery_maintenance: "$fruit_winery_maintenance$ (Old Ways)"
    pp_winery_manufactory_legacy_fruit_winery_maintenance_desc: "An older way of working, kept from the $winery$. It still runs on its old materials, but turns out less per level than the methods of this age."
    pp_winery_manufactory_legacy_rice_winery_maintenance: "$rice_winery_maintenance$ (Old Ways)"
    pp_winery_manufactory_legacy_rice_winery_maintenance_desc: "An older way of working, kept from the $winery$. It still runs on its old materials, but turns out less per level than the methods of this age."
evaluation:
  allow_rules:
    profit_percent: Converted vanilla producer balanced by profit per building against the farming benchmark; throughput and margin bands are advisory here.
    input_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
    output_throughput: Converted vanilla producer preserves vanilla production shape while targeting profit per building, not throughput per worker.
  production_methods:
    pp_winery_manufactory_market_sales:
      allow_rules:
        profit_percent: The Market Sales gate leg is balanced at its gate margin, not at a profit band.
        input_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
        output_throughput: The Market Sales gate leg is a small technical method that only sets the AI margin check.
    pp_winery_manufactory_legacy_fruit_winery_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
    pp_winery_manufactory_legacy_rice_winery_maintenance:
      allow_rules:
        profit_percent: "Legacy method: an older recipe carried up the upgrade line on purpose, at the contemporary method's margin and a smaller output."
        input_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
        output_throughput: "Legacy method: lower throughput than the contemporary method on purpose, so it runs only where the contemporary inputs are missing."
