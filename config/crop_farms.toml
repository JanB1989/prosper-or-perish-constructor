# Tier advances (unlock the tier's building of every crop chain)
[tier_advance.pp_manuring_and_seed_stores]
tier = 1
icon = "husbandry_farmstead"
age = "age_3_discovery"
requires = "rgo_size_advance_discovery"
ai_weight = 125
name = "Manuring and Seed Stores"
desc = "Peasant households select seed, keep it dry, and recycle livestock manure into established fields before formal rotational farming."

[tier_advance.pp_farming_village_rotations]
tier = 2
icon = "farming_village_rotations"
age = "age_4_reformation"
requires = "global_trade_advance"
ai_weight = 125
name = "Rotational Farmsteads"
desc = "Legume rotations, managed fallow, hedges, manure carts, and mixed husbandry make peasant village fields more reliable without turning them into planned model farms."

[tier_advance.pp_model_farm]
tier = 3
icon = "model_farm"
age = "age_5_absolutism"
requires = "scientific_revolution_advance"
ai_weight = 125
name = "Model Farms"
desc = "Field surveys, seed drills, horse-hoes, crop rotations, and printed agronomy organize village cultivation into a larger managed farm."

