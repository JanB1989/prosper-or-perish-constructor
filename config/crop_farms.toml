# Crop farm chains: data for the generator that splits the single farming_village chain
# (farming_village -> husbandry_farmstead -> farming_village_rotations -> model_farm, eight crops as production methods)
# into eight crop chains x four tiers = 32 blueprints.
#
# Building key = <stem>_<tier_suffix>, e.g. wheat_farm, wheat_farmstead, wheat_rotations, wheat_model_farm.
# Method key   = pp_<building>_<method key>, e.g. pp_wheat_farm_ox_ard.
# Tier-level numbers are copied from the four current blueprints in blueprints/accepted/buildings/
# (farming_village.yml, husbandry_farmstead.yml, farming_village_rotations.yml, model_farm.yml).
# Cultivation method inputs are the derived values that keep today's cost per tier and crop; the labour pass
# (`ppc labour apply`, [production_labour] in constructor.toml) adds manual_labor_cost from the method's labour class.

[general]
tier_advances = { 1 = "pp_manuring_and_seed_stores", 2 = "pp_farming_village_rotations", 3 = "pp_model_farm" }
tier_suffix = { 0 = "farm", 1 = "farmstead", 2 = "rotations", 3 = "model_farm" }
tier_labour_class = { 0 = "primary_medieval", 1 = "primary_discovery", 2 = "primary_reformation", 3 = "primary_absolutism" }
tier_base_output = { 0 = 0.06, 1 = 0.08, 2 = 0.07, 3 = 0.10 }
# manual_labor_cost of the passive base method (slot 0) for the arable crops; cattle overrides with crops.base_labour
tier_base_labour = { 0 = 0.012, 1 = 0.016, 2 = 0.014, 3 = 0.02 }
base_labour_class = "base"                  # base methods are tagged `base` in the blueprint labour block
tier_pop_type = { 0 = "peasants", 1 = "peasants", 2 = "peasants", 3 = "laborers" }
tier_build_time = { 0 = "village_build_time", 1 = "workshop_build_time", 2 = "workshop_build_time", 3 = "workshop_build_time" }
tier_construction_demand = { 0 = "village_construction", 1 = "workshop_construction", 2 = "workshop_construction", 3 = "workshop_construction" }
tier_increase_per_level_cost = { 0 = 0.15, 1 = 0.15, 2 = 0.15, 3 = 0.15 }
tier_local_monthly_food = { 0 = 1.5, 1 = 1.5, 2 = 1.5, 3 = 3.0 }
# icon line in the building body; tier 0 has no icon line today (farming_village uses the vanilla icon by key)
tier_icon = { 0 = "", 1 = "husbandry_farmstead", 2 = "farming_village_rotations", 3 = "model_farm" }
tier_can_close = { 0 = false, 1 = true, 2 = true, 3 = true }
tier_obsoletes_previous = { 0 = false, 1 = true, 2 = true, 3 = true }   # obsolete = <previous tier building of the same crop>
# land each level takes (raw_modifier local_population_capacity), as the blueprints carry it today; the World Builder
# farm stage rewrites it from [worldbuilder.farm_land] by land_class (arable land 5, herd land 2)
tier_land_today = { 0 = -5, 1 = -2, 2 = -5, 3 = -5 }
footprint = "farm_land"
location_potential_base = "pp_general_farmable_food_location_potential"   # AND-ed with crops.location_rule unless location_rule_standalone
max_levels_pattern = "farm_capacity_max_{building}"
farm_capacity_line_pattern = "farm_capacity_from_{building} = -1"

# Body lines shared by every tier (values as in the blueprints)
[general.body]
is_foreign = "no"
employment_size = 1
category = "village_category"
custom_tags = ["farming_capacity", "pp_food_security_priority", "pp_staple_food_priority"]
rural_settlement = "yes"
town = "yes"
city = "yes"
megalopolis = "yes"
forbidden_for_estates = "yes"
ai_forbid_shutdown = "no"

# Extra body lines only tier 0 (farming_village) carries today
[general.body_tier0]
