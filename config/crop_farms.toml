# Gated goods: a general unlock advance for everyone, and a game-start advance for countries whose original capital
# lies in a sub-continent/region where the good is established (share of locations >= subcontinent_region_threshold).
[unlocks]
goods = ["rice", "maize", "potato", "olives"]
subcontinent_region_threshold = 0.60
advance_key_pattern = "pp_{good}_farm_advance_{kind}"   # kind = general | game_start
ai_weight = 50

[unlocks.game_start]
age = "age_1_traditions"
requires = "agriculture_advance"

[unlocks.general.rice]
age = "age_3_discovery"
requires = "new_world_advance"
name = "Rice Cultivation"
desc = "Adopt techniques for cultivating rice as a staple crop in suitable regions."
game_start_name = "Established Rice Cultivation"
game_start_desc = "Traditional rice cultivation in regions where the crop is already established."

[unlocks.general.maize]
age = "age_4_reformation"
requires = "global_trade_advance"
name = "Maize Cultivation"
desc = "Adopt maize cultivation through colonial and trade networks."
game_start_name = "Established Maize Cultivation"
game_start_desc = "Traditional maize cultivation in regions where the crop is already established."

[unlocks.general.potato]
age = "age_5_absolutism"
requires = "newspapers_advance"
name = "Potato Cultivation"
desc = "Adopt the potato as a reliable staple crop."
game_start_name = "Established Potato Cultivation"
game_start_desc = "Traditional potato cultivation in regions where the crop is already established."

[unlocks.general.olives]
age = "age_4_reformation"
requires = "global_trade_advance"
name = "Olive Cultivation"
desc = "Adopt olive cultivation through trade and regional exchange."
game_start_name = "Established Olive Cultivation"
game_start_desc = "Traditional olive cultivation in regions where the crop is already established."

