# Country-wide literacy sources (Jan, 2026-11-25; rule of 2026-11-26). Source of truth for the constructor pass
# `literacy_sources.py` (`uv run ppc literacy apply|check`).
#
# Why: a pop creeps up to its literacy cap, and nearly all of that cap came from country-wide bonuses for every class
# (observer runs: a French peasant at 55 % with no school, the world at about 48 % by 1837; history about 12 %).
# Literacy is to be earned by local buildings. Research follows the country's average literacy, which tracks the
# learned estates only if commoners read as little as they did in history (Jan, 2026-11-26): so the generic
# all-class bonuses stop reaching the commoners, and clergy, nobles and burghers keep what vanilla gave them. Every
# local_*_max_literacy, buildings, PP's own objects and the specific sources listed under [folders.*].exclude /
# [exclude_objects] keep their numbers.
#
# The pass reads every object of the folders below as the game merges them (vanilla, the DLC folders, the mod),
# changes the lines where they stand (inside the object's modifier blocks; an advance's body is its modifier) and
# writes each changed object whole as a REPLACE (TRY_REPLACE for an object only a DLC folder defines) into
# `<folder>/zz_pp_literacy_sources.txt`. Objects another pass already replaces carry the rule there:
# first-age advances in the starting technology ladder (start_technology.py), legal_code_law in the RGO cost
# redirects (rgo_cost_redirects.py), printing_press_advance by hand in pp_institution_advances_adjustments.txt.

# All-class maximum literacy: a positive `key = X` leaves its block and each key of `into` gets X in the same block
# (added to that key's line when the block already has one, else a new line where the cap stood). Zero and negative
# values stay for everyone.
[split]
key = "global_max_literacy"
into = ["global_nobles_max_literacy", "global_clergy_max_literacy", "global_burghers_max_literacy"]

# The commoners' base: "<folder>.<object>" = { keep = what stays for everyone, estates = what each estate key gets }.
# Written Alphabet: vanilla 5 = 2 for everyone + 3 more for each estate.
[split_exceptions]
"advances.written_alphabet" = { keep = 2, estates = 3 }

# Lower-class maximum literacy (country-wide): positive values x factor, rounded to a whole number, at least
# `minimum` (+10 -> +4, +5 -> +2, +3 -> +1, +2 -> +1). Zero and negative values stay.
[max_literacy]
keys = ["global_peasants_max_literacy", "global_laborers_max_literacy", "global_soldiers_max_literacy"]
factor = 0.4
minimum = 1

# Speed of literacy: values above `keep_at_or_below` x factor, rounded to `decimals`, at least `minimum`
# (0.1 -> 0.008, 0.05 -> 0.004, 0.25 -> 0.02, 0.33 -> 0.026, 0.03 and 0.02 -> 0.004); positive values at or below it
# x small_factor (0.01 -> 0.004, 0.005 -> 0.002). Zero and negative values stay.
# 2026-11-27 (Jan, after the measurement on run b18a10d6: a raised cap was nine tenths reached in 15-20 years, a
# schooled place gained 0.55-0.65 points a year, three to four times a historical country): every speed x0.4 on top
# of the first cut (factor 0.2 -> 0.08, the small ones kept -> x0.4), the local buildings and the clergy with it, so
# every source keeps its share. A ten-point rise now takes about 35-40 years.
[speed]
keys = ["global_monthly_literacy", "local_monthly_literacy"]
factor = 0.08
decimals = 3
minimum = 0.004
keep_at_or_below = 0.01
small_factor = 0.4
# Two tiers (Jan, 2026-11-27, later the same night): what a country gets passively, country-wide, by researching or by
# being what it is (advances, religions) takes the hard cut above. What a country chooses (its societal values, laws
# and policies, reforms, estate privileges, religious aspects and schools) stays decently strong: values above
# `keep_at_or_below` x active_factor, rounded to `active_decimals`, at least `active_minimum`
# (0.1 -> 0.04, 0.05 -> 0.02, 0.25 -> 0.1, 0.03 and 0.02 -> 0.01); 0.01 and less stay. One such choice at 0.04 is worth
# ten Village School levels in every location of the country. Flavour (unique and event buildings, timed event
# modifiers, traits, gods) is never touched: [left_out_folders]. The few chosen sources in left-out folders
# (parliament issues, the peasant cabinet action, religious order callings, two town rights) keep vanilla's numbers.
active_folders = ["societal_values", "laws", "government_reforms", "estate_privileges", "religious_aspects",
                  "religious_schools"]
active_factor = 0.4
active_decimals = 2
active_minimum = 0.01

# Explicit values, "<folder>.<object>.<key>" = value; they win over the rules above.
# The base rate (Jan, 2026-11-25: halved; 2026-11-27 x0.4 with every other speed). Both are first-age advances of the ladder, which writes them.
[base_rate]
"advances.written_alphabet.global_monthly_literacy" = 0.002
"advances.educated_bureaucrats.global_monthly_literacy" = 0.002

# The estates' start, closer to history (Jan, 2026-11-26): Guilds (burghers) and Improved Religious Organization
# (clergy), vanilla 5 each. First-age advances of the ladder, which writes them.
[estate_start]
"advances.guilds.global_burghers_max_literacy" = 20
"advances.organized_religion.global_clergy_max_literacy" = 20

# Folders in scope. An object is judged by the file that first defines it (vanilla or DLC); an object PP defines
# itself keeps its numbers. `include` / `exclude` are file name globs: an object with literacy lines in a file that
# matches neither fails the pass (a game update added a file: decide where it belongs). `skip_tag_gated`: an object
# whose own `potential` names a country tag is country-specific and stays.
[folders.advances]
path = "in_game/common/advances"
top_level = true                 # an advance's body is its modifier
ladder_age = "age_1_traditions"  # these are written by the starting technology ladder
include = ["0_age_of_*.txt", "1_*.txt", "2_*.txt", "3_*.txt", "4_choices_*.txt", "colonial_nations.txt", "ctype_*.txt",
           "government_*.txt", "diplomacy_unlocks.txt", "canal_advances.txt", "new_world.txt"]
exclude = ["country_*.txt", "culture_*.txt", "religion_*.txt", "region_*.txt", "frankokratia.txt", "beyliks.txt",
           "japanese_unique.txt", "estate_*.txt", "D008_*.txt", "d009_*.txt"]

[folders.societal_values]
path = "in_game/common/societal_values"
include = ["*.txt"]

[folders.laws]
path = "in_game/common/laws"
include = ["*.txt"]
exclude = ["02_country_specific.txt", "d009_02_country_specific.txt"]

[folders.government_reforms]
path = "in_game/common/government_reforms"
skip_tag_gated = true
include = ["common.txt", "monarchy.txt", "republic.txt", "steppe_horde.txt", "theocracy.txt"]
exclude = ["country_specific.txt", "d009_*.txt"]

[folders.estate_privileges]
path = "in_game/common/estate_privileges"
skip_tag_gated = true
include = ["*.txt"]

[folders.religions]
path = "in_game/common/religions"
include = ["*.txt"]

[folders.religious_aspects]
path = "in_game/common/religious_aspects"
include = ["*.txt"]

[folders.religious_schools]
path = "in_game/common/religious_schools"
include = ["*.txt"]

# Folders left out on purpose (Jan decides later); the pass lists their literacy lines in
# artifacts/data/literacy_sources/left_out.csv: "<path>" = reason.
[left_out_folders]
"in_game/common/building_types" = "buildings (another pass; unique and event-only buildings)"
"in_game/common/gods" = "gods"
"in_game/common/avatars" = "avatars"
"in_game/common/cabinet_actions" = "cabinet actions"
"in_game/common/bureaucracies" = "bureaucracies"
"in_game/common/parliament_issues" = "parliament issues (only while in debate)"
"in_game/common/religious_order_callings" = "religious order callings"
"in_game/common/traits" = "character traits"
"in_game/common/artist_types" = "artist types"
"in_game/common/holy_site_types" = "holy site types (local)"
"in_game/common/town_rights" = "town rights (local)"
"main_menu/common/static_modifiers" = "static modifiers (timed event modifiers, local modifiers)"

# Objects in an included file that stay anyway: "<folder>.<object>" = reason.
[exclude_objects]
"government_reforms.citizenship_through_service" = "only with the Latinization vs Hellenization value (Fate of the Phoenix, Byzantine successors)"
"government_reforms.latin_tutors" = "only with the Latinization vs Hellenization value (Fate of the Phoenix, Byzantine successors)"
