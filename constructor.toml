[project]
name = "Prosper or Perish Constructor"
mod_root = "mod/Prosper or Perish (Population Growth & Food Rework)"

[artifacts]
root = "artifacts"
data = "artifacts/data"
buildings = "artifacts/data/buildings"
savegame = "artifacts/data/savegame"
graphs = "graphs"
reports = "reports"
accepted_blueprints = "blueprints/accepted"
generated_blueprints = "blueprints/generated"

[building_blueprints]
manifest = "blueprints/buildings.manifest.yml"
clean_paths = [
    "in_game/common/building_types/pp_building_adjustments.txt",
    "in_game/common/building_types/pp_food_buildings.txt",
    "in_game/common/building_types/pp_new_buildings.txt",
    "in_game/common/production_methods/pp_production_methods.txt",
    "in_game/common/advances/pp_agricultural_innovations.txt",
    "in_game/common/advances/pp_production_method_unlocks.txt",
    "in_game/common/prices/pp_building_price_adjustments.txt",
    "main_menu/localization/english/pp_new_buildings_l_english.yml",
]

[parser]
profile = "constructor"
load_order = "constructor.load_order.toml"

[farming_village_rgo_unlocks]
goods = ["rice", "maize", "potato", "olives"]
subcontinent_region_threshold = 0.60

[farming_village_rgo_unlocks.methods]
rice = ["pp_rice_farm_base_rice", "pp_rice_farm_maintenance"]
maize = ["pp_maize_farm_base_maize", "pp_maize_farm_maintenance"]
potato = ["pp_potato_farm_base_potato", "pp_potato_farm_maintenance"]
olives = ["pp_olives_farm_base_olives", "pp_olives_farm_maintenance"]

[farming_village_rgo_unlocks.general_unlocks.rice]
age = "age_3_discovery"
requires = "new_world_advance"

[farming_village_rgo_unlocks.general_unlocks.maize]
age = "age_4_reformation"
requires = "global_trade_advance"

[farming_village_rgo_unlocks.general_unlocks.potato]
age = "age_5_absolutism"
requires = "newspapers_advance"

[farming_village_rgo_unlocks.general_unlocks.olives]
age = "age_4_reformation"
requires = "global_trade_advance"

[building_outputs]
prefix = "pp_"
building_types = "in_game/common/building_types/zz_{prefix}{tag}.txt"
production_methods = "in_game/common/production_methods/{prefix}{tag}.txt"
prices = "in_game/common/prices/{prefix}{tag}.txt"
advances = "in_game/common/advances/{prefix}{tag}.txt"
localization = "main_menu/localization/english/{prefix}{tag}_l_english.yml"
icons = "in_game/gfx/interface/icons/buildings"

[blueprint_evaluation]
raw_input_efficiency_per_good = 0.05
profit_percent_min = -0.30
profit_percent_max = 0.30
base_output_per_1k_min = 0.07
base_output_per_1k_max = 0.15
age_throughput_growth = 0.10
throughput_tolerance = 0.30
amortization_months_max = 360
amortization_months_min = 120
base_method_input_goods = ["manual_labor_cost"]  # base methods pay a token labour cost and stay base methods

[building_scaling]
increase_per_level_cost_multiplier = 0.75
burgher_building_employment_size = 0.3
# Provisioning slot of calorie buildings (provisioning.py): per level of a building whose base output equals the
# reference, the gold of its own good bought back, Province Food per gold of that good, and Surplus Sales output.
provision_input_per_level = 0.08
provision_food_per_gold = 12
sell_surplus_per_level = 0.005
provisioning_reference_base_output = 0.06


[blueprint_evaluation.price_overrides]
manual_labor_cost = 1.0   # labour is balanced at its price floor (20 % of 5), see [production_labour]
local_food = 0.1          # Province Food is pinned at its price floor (20 % of 0.5) by its base supply

[blueprint_evaluation.throughput_gold_per_1k]
peasants = 1.0
laborers = 1.5
labourers = 1.5
burghers = 2.5

[blueprint_evaluation.modifier_categories.infrastructure_category]
modifiers = ["market_access", "local_market_access", "free_building_levels", "local_distance_from_capital_speed_propagation"]



[dependencies]
parser = "../eu5-game-parser"
building_pipeline = "../eu5-building-pipeline"
orchestrator = "../eu5-mod-orchestrator"

[worldbuilder]
navigation_config = "config/river_navigation.json"
# World Builder handover (EU5WorldBuilder `worldbuilder handover`); the constructor consumes this contract only.
handover = "../EU5WorldBuilder/artifacts/handover/latest"
# World Builder geography export (`worldbuilder geography-test` build), synced into the mod.
geography_export = "../EU5WorldBuilder/artifacts/geography_test/EU5 World Builder"
vanilla_baseline = "data/vanilla/locations_with_raw_material.parquet"
sync_geography = true
apply_on_build = true
level_limit = 20
goods_floor = -0.2

# Hand-set flavour effects on the shore modifiers (pp_wb_coastal, pp_wb_lake), next to the fitted rows.
# Capacity and goods output stay with the World Builder fit; only other modifier types belong here.
[worldbuilder.flavour.pp_wb_lake]
local_migration_attraction = 0.3   # lakeshore settlement: fresh water, fish and easy transport
local_defensive = 0.1              # the lake works as a moat

[worldbuilder.buildings.map]
# World Builder ledger type -> blueprint key
clearing = "land_clearance"
management = "field_management"
water_supply = "irrigation_systems"
paddy_control = "irrigated_fields"
flood_bunds = "bund"
field_drainage = "field_drainage"
polders = "polders"
oasis_irrigation = "qanats"

[worldbuilder.buildings.niche]
# Culture- or country-locked capacity buildings. Each is a full REPLACE or new CREATE blueprint that
# shares the cap of a general family (levels of every member count against the same equation), is worth `strength` x
# the family's people per level, and keeps its lock (`lock` lines are ANDed into location_potential; country locks and
# advance unlocks stay in the blueprint).
khmer_baray = { family = "irrigation_systems", strength = 1.5, lock = ["dominant_culture ?= culture:khmer_culture"] }
incamisana = { family = "irrigation_systems", strength = 1.5 }
# Later tiers of field management, unlocked by advances. `upgrades` names the tier they replace (blueprint
# `obsolete`): each level built converts one level of it, so their cap leaves the lower tiers' levels out.
field_management_convertible = { family = "field_management", strength = 1.5, upgrades = "field_management" }
field_management_improved = { family = "field_management", strength = 2.0, upgrades = "field_management_convertible" }

# Song/Yuan-era Lower Yangzi improvements. Geography and local culture are checked both in game and at setup.
[worldbuilder.buildings.niche.jiangnan_canal_network]
family = "irrigated_fields"
strength = 2.5
place_at_start = true
gate = [
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], river_level = ["1","2","3","4","5"] },
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], is_adjacent_to_lake = ["True"] },
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], is_coastal = ["True"] },
]

[worldbuilder.buildings.niche.jiangnan_hill_terraces]
family = "field_management"
strength = 3.0
place_at_start = true
gate = [{ culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["ningguo_province","huizhou_province","hangzhou_province","huzhou_province","jinhua_province","chuzhou_province","shaoxing_province","ningbo_province","taizhou_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["hills","mountains","plateau","rolling"] }]

[worldbuilder.compat]
# Vanilla scripts that test specific climate/vegetation/topography classes. They are copied into the mod with every
# test of a vanilla parent class widened to its World Builder children (families from the export's
# geography_compatibility.json), regenerated from the current vanilla files on every apply. Whole-file overrides:
# keep this list to files where the tests matter for gameplay. Vanilla building files are listed only where a widened
# building is not already a REPLACE blueprint of the mod (sawmill, spiritual retreat, peasants hunting grounds, oma falaj).
vanilla_files = [
  "in_game/common/scripted_triggers/location_triggers.txt",
  "in_game/common/scripted_triggers/goods_triggers.txt",
  "in_game/common/building_types/rural_buildings.txt",
  "in_game/common/building_types/unique_buildings.txt",
  "in_game/common/building_types/estate_buildings.txt",
  "in_game/common/building_types/event_only_buildings.txt",
  "in_game/common/diseases/malaria.txt",
  "in_game/common/diseases/bubonic_plague.txt",
  "in_game/common/diseases/great_pestilence.txt",
  "in_game/common/diseases/smallpox.txt",
  "in_game/common/diseases/influenza.txt",
  "in_game/common/generic_actions/columbian_exchange.txt",
  "in_game/common/generic_actions/italian_wars.txt",
  "in_game/common/insults/00_insults.txt",
  "in_game/events/estates/cossacks_estate_events.txt",
  "in_game/events/exploration/exploration_monthly_events.txt",
  "in_game/events/religion/pilgrimage_events.txt",
  "in_game/events/situations/little_ice_age.txt",
  "in_game/events/character/artist_events.txt",
  "in_game/events/DHE/flavor_plc.txt",
  "in_game/events/DHE/flavor_chi_treasure_expedition.txt",
  "in_game/events/DHE/flavor_TUR.txt",
  "in_game/events/DHE/flavor_ICE.txt",
  "in_game/events/DHE/flavor_ETH.txt",
  "in_game/events/DHE/flavor_ENG.txt",
]

[worldbuilder.start]
# Game-start building placement (rural food buildings and the urban food chain) from the capacity model; replaces the
# savegame-driven food startup compiler. A farm never pushes a location over its cap: spare land = capacity - pops.
keep_pops_within_capacity = true
fill_improvements_to_pops = true      # starting improvement levels rise to their caps where the 1337 pops need the room
peasant_work_share = 0.6              # share of a location's peasants that may staff rural buildings at start
max_farm_levels_per_location = 6
food_target_ratio = 1.1               # province food supply aimed for, relative to what the pops eat
# Subsistence is read from NLocation.SUBSISTENCE_AGRICULTURE.
subsistence_pop_types = ["peasants", "laborers", "slaves"]
max_cookery_levels_per_location = 6
# Victuals limits come from the live import/export scripted values.
laborer_conversion_share = 0.5        # share of a location's peasants that may become the cookeries' laborers
[worldbuilder.start.processors]
# raw material -> building placed at game start (its laborers are converted from local peasants); levels as before
alum = { building = "alum_quarry", levels = 1 }
clay = { building = "clay_pit", levels = 2 }
coal = { building = "coal_mine", levels = 1 }
copper = { building = "copper_mine", levels = 1 }
fish = { building = "fishing_village", levels = 3 }
fur = { building = "forest_village", levels = 2 }
gems = { building = "gem_gravel_pit", levels = 1 }
goods_gold = { building = "gold_diggings", levels = 1 }
iron = { building = "iron_mine", levels = 2 }
lead = { building = "lead_mine", levels = 1 }
lumber = { building = "lumber_mill", levels = 2 }
marble = { building = "marble_quarry", levels = 1 }
mercury = { building = "cinnabar_pit", levels = 1 }
salt = { building = "inland_saltworks", coastal_building = "salt_collector", levels = 2 }
saltpeter = { building = "saltpeter_beds", levels = 1 }
sand = { building = "sand_pit", levels = 1 }
silver = { building = "silver_mine", levels = 1 }
stone = { building = "stone_quarry", levels = 1 }
tin = { building = "tin_streamworks", levels = 1 }
wild_game = { building = "forest_village", levels = 2 }
[worldbuilder.start.rank_capacity_people]
# flat housing of the location ranks, must match pp_location_rank_adjustments.txt (net of vanilla)
town = 10000
city = 25000
megalopolis = 40000
# Pops the engine promotes out of the peasants when a campaign starts (per 1,000 pops of the location, by rank),
# beyond what the pops setup file defines. Nobles eat 25x a peasant, so this is most of a town's food demand.
# Fitted to a one-month reference save on 2026-09-22; `uv run ppc worldbuilder food-check --save <file>` refits it.
[worldbuilder.start.engine_promotion.rural_settlement]
nobles = 2.7
clergy = 4.6
burghers = 0.0
laborers = 107.0
soldiers = 3.5
[worldbuilder.start.engine_promotion.town]
nobles = 9.4
clergy = 17.0
burghers = 42.7
laborers = 106.6
soldiers = 6.7
[worldbuilder.start.engine_promotion.city]
nobles = 8.6
clergy = 18.0
burghers = 17.9
laborers = 103.5
soldiers = 13.4
[worldbuilder.start.engine_promotion.megalopolis]
nobles = 10.9
clergy = 14.9
burghers = 13.6
laborers = 44.8
soldiers = 13.6
[worldbuilder.start.rgo_workers_k]
# peasants (thousands) the location's RGO employs at start by rank; they leave subsistence agriculture (same fit)
rural_settlement = 1.5
town = 2.0
city = 2.4
megalopolis = 2.3
[worldbuilder.start.victuals]
# Victuals are the mod's food in the goods market: cookeries make them, import
# victuals markets are the only buildings that turn them back into province food. Per catchment the planner covers
# the food deficit with cookeries and import markets so the imports buy absorb_share of the victuals made there;
# more would idle the cookeries (they lay off workers when the victuals do not sell), less starves the towns.
absorb_share = 0.8
pop_demand_scale = 0.4    # observed pop demand vs the goods file's demand_add x demand_multiply (price, wealth)
# victuals per building level as the market shows them (measured from saves 2026-09-22; food-check refits)
producers = { cookery = 0.65, victuals_market = 3.45 }
consumers = { victuals_market_import = 1.8, lumber_mill = 0.3 }
[worldbuilder.start.crops]
# The farming village is split into one farm per crop; at game start a location's farm levels are spread over the
# crop farms. Livestock first takes round(g x levels), g = its grazing share (World Builder grazing / (grazing +
# starting crop) area); the crops share the rest by crop weight = max(0, 1 + the good's World Builder output rows over
# the location's classes). See src/prosper_or_perish_constructor/worldbuilder/crop_allocation.py.
floor_share = 0.6                  # crops under this share of the heaviest crop weight are dropped (never the RGO crop)
rgo_bonus = 0.5                    # added to the RGO crop's weight, or to g on a livestock RGO (then capped at the max)
grain_min_levels_from = 3          # from this many levels on at least one staple crop is placed
livestock_share_default = 0.2      # grazing share where the World Builder table has no value
livestock_share_min = 0.1
livestock_share_max = 0.7          # +0.2 on livestock/wool/horses RGOs and grasslands/sparse vegetation, then clipped
livestock_source = "../EU5WorldBuilder/artifacts/locations/locations.csv"
gated_goods = ["rice", "maize", "potato", "olives"]   # only in their native sub-continents/regions (farming_village_rgo_unlocks gates)
grains = ["wheat", "millet", "rice", "maize", "legumes", "potato"]
buildings = { wheat = "wheat_farm", rice = "rice_farm", millet = "millet_farm", maize = "maize_farm", legumes = "legume_farm", potato = "potato_farm", olives = "olive_grove", livestock = "cattle_farm" }

[worldbuilder.level_scale]
# multiply levels, divide people per level; 1.0 keeps the World Builder units. Chosen so every general building is
# worth roughly 700-2,600 people per level (niche strengths are configured above); only integer scales are safe because caps
# and starting levels are floored, so bund and field drainage keep their small World Builder units. A common price per
# level then means a similar price per person; the level limit scales with it.
irrigated_fields = 8
field_management = 3
land_clearance = 2
irrigation_systems = 2
polders = 1
qanats = 1
bund = 1
field_drainage = 1

[worldbuilder.farm_land]
# capacity units (1 unit = 1,000 people) a farm level takes from subsistence land, and the land that must stay
arable = { land = 5, reserve = 5 }
plantation = { land = 10, reserve = 5 }
herd = { land = 2, reserve = 1 }

[worldbuilder.farm_land.classes]
plantation = ["cotton_plantation", "sugar_plantation", "tobacco_plantation", "dye_plantation", "chili_plantation"]
herd = ["sheep_farms", "hurdled_sheepcotes", "enclosed_sheep_walks", "horse_breeders", "stud_farm", "elephant_kraal", "husbandry_farmstead"]

[building_footprint]
# Every accepted blueprint carries `footprint: <class>`. ppc build/sync writes
# raw_modifier local_population_capacity = share x employment_size per level (rounded to whole people) into the block
# that owns the building in the compiled mod. A building with a large footprint houses few of its workers (low share);
# a negative share takes land like a farm. "ignore" leaves the building untouched.
[building_footprint.classes]
farm_land = "ignore"          # farms that take land (worldbuilder.farm_land)
capacity_source = "ignore"    # improvement buildings and other buildings with their own capacity line
technical = "ignore"          # dummy buildings
urban_workshop = 0.75         # guilds, workshops, craft shops
urban_district = 0.75         # quarters and districts that are housing
administration = 0.70         # chanceries, councils, courts, offices
institutional = 0.60          # schools, academies, libraries, theatres, hospitals, missions
trade = 0.60                  # markets, trade offices, banks, trade company buildings, toll posts
religious = 0.55              # temples, monasteries, madrasas, churches
manufactory = 0.55            # urban manufactories and food works
barracks = 0.50               # barracks, armories, garrisons
rural_village = 0.50          # fishing, forest and market villages, settlements
mill_works = 0.40             # mills, foundries, factories, smelters
fishery = 0.40                # offshore fisheries
infrastructure = 0.40         # roads, transport, bridges, construction
maritime = 0.40               # docks, shipyards, admiralties, harbours
rural_processing = 0.35       # windmills, washmills, stamp mills, granaries
palace_grounds = 0.30         # palaces, residences and villas with grounds
monument = 0.20               # monument complexes, festival grounds
forestry = 0.20               # lumber, charcoal, tar, forest camps
fortification = 0.20          # walls, castles, forts
mining = 0.15                 # mines and mining villages
military_grounds = 0.10       # training fields, camps
estate_land = 0.10            # manors and estates that hold land
extractive_open = 0.05        # quarries, pits, diggings, salt pans
land_reserve = -0.25          # hunting grounds, royal forests and gardens, cattle enclosures

[production_labour]
# Every producing production method pays part of its input cost in manual_labor_cost. Enabled blueprints tag their
# producing methods with `labour: { class: <class>, methods: { <method>: <class> } }`. `ppc labour apply` rewrites the
# method bodies so labour takes the class share of the total input cost at base prices (the cost itself stays);
# `ppc labour check` reports untagged methods and methods off their class (ppc build prints it).
good = "manual_labor_cost"
price_floor_share = 0.2       # balance labour at its price floor: 20 % of the default price 5 = 1 gold (labour yards sell into scarcity)
tolerance = 0.02              # a method within this share of its class is left alone (a rounding step moves about 0.01)
min_good_share = 0.05         # goods worth less than this share of a method's input cost are folded into the rest
max_goods = 4                 # at most this many goods per method besides labour (the cheapest go first)

[production_labour.classes]
# Share of the total input cost paid as labour. Later ages mechanise: the later the building, the smaller the share.
# "primary" = farms, villages, groves, pits, quarries, mines, fisheries, forestry and rural processing;
# "craft" = guilds, workshops, manufactories, mills and factories.
keep = "keep"                 # already carried labour or trade dummy goods (victuals markets): left as they are
base = { output_share = 0.20 } # methods without goods inputs (base yields): labour worth 20 % of the output
hand_work = 0.45              # labour-heavy fallback methods for input shortages (lower output, fewer tools)
cottage = 0.25                # village home crafts: market village crafts, rural cloth- and glassmakers, tatara, brickmaking
primary_medieval = 0.18       # ages 1-2
primary_discovery = 0.14      # age 3
primary_reformation = 0.11    # age 4
primary_absolutism = 0.08     # age 5
primary_revolutions = 0.05    # age 6
plantation = 0.05             # slave plantations: slaves_goods already stands for the work
craft_medieval = 0.14         # guilds and cookeries, ages 1-2
craft_discovery = 0.12        # age 3 workshops
craft_reformation = 0.10      # age 4 workshops
craft_absolutism = 0.07       # age 5 manufactories, victualling yards
craft_revolutions = 0.04      # age 6 mills and factories
