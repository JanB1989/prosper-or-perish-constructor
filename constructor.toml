[stored_food]
# Stored-food effect carrier (EU5 1.4, stored_food.py; docs/historical_growth_calibration.md 6.2). EU5 1.4 deleted the
# engine-scaled positive_province_food_growth modifier; its effects ride one province modifier per whole stored month,
# pp_food_store_0 .. _24 (the monthly country pulse picks the step, in_game/common/on_action/pp_stored_food.txt). Step
# s = Stored Food ([stored_food.per_year]) x s / 12 + Low Stores ([stored_food.low]) x the years short of the pivot or
# Full Stores ([stored_food.full]) x the years above + the store curve ([stored_food.curve]) at s months. Values are
# rounded to five decimals (EU5 1.4 rejects six). The engine's own storage growth term is off
# (NPop.FOOD_STORAGE_POP_GROWTH = 0, pp_defines_adjustments.txt).
#
# Store lever (2026-10-02, tools/province_store_sim.py): the store moves the Province Food output of everything that
# makes it (the farms' Provisioning, Taverns, fisheries, orchards, forest villages): worth more while the store is
# low, less while it is full, so every maker stops where its own recipe stops paying (the Tavern by the victuals
# price). Surplus Sales is the Grange's leg: it grows with a full store and dries up quickly below the pivot, so a
# Grange never packs a lean store. No country base values belong to this: at the pivot every line is zero.
deadband_months = 0.05
pivot_months = 12

[stored_food.per_year]
# Stored Food: per stored year
# the PP growth law: +0.60 %/yr per stored year, 1.2 % at 24 months (2026-10-03, was 0.0075: the Mini World run
# 1352-1392 grew +0.55 %/yr at a median store of 17 months, fit -0.34 + 0.63 x stored years; Jan's target ~0.3 %/yr)
local_population_growth = 0.006
local_devastation_recovery = 0.003
local_migration_attraction = 0.045
local_monthly_prosperity = 0.0025

[stored_food.low]
# Low Stores: per year short of the pivot (size 1 at an empty store)
local_province_food_sales_output_modifier = -3.0    # the Grange's Surplus Sales
# (no victuals line since 2026-10-03: the harbour Yard takes no store food any more, and the Grange stops by its own
# Surplus Sales; a starving province still packs nothing, province_starving). Province Food output and the staples
# follow the store curve below since 2026-10-03 (was Province Food +0.75 per year, staples 0).

[stored_food.full]
# Full Stores: per year above the pivot (size 1 at 24 months)
local_province_food_sales_output_modifier = 0.13    # the Grange's Surplus Sales (2026-10-03 evening, was 0.34: a
# flatter store term makes the victuals price move the Grange's stop point 13.9 months per gold instead of 5.3)
# (Province Food output and the staples: the store curve below; was Province Food -0.75 per year, staples 0)

[stored_food.curve]
# Farm trade-off (Jan's design 2026-10-02, built 2026-10-03): the store moves the farms between feeding the province
# and selling their crop, one curve for every staple good and every farm tier (output modifiers are per good).
# province_food_share: Province Food output of every maker at that store as a share of its output at an empty store
#   (Jan's values; linear between the knots); the step modifier carries share / share at the pivot - 1:
#   +53.8 % at 0 months, +23.1 % at 6, 0 at 12, -23.1 % at 18, -38.5 % at 24 (was +-75 %, linear)
# The curve takes every staple food (2026-10-04, Jan: one list; staple crops, staple animals and staple fruits, the
#   staple_group column of config/goods_categories.csv, read by staple_foods.py). Every staple food building runs a
#   Provisioning method (provisioning.py), so a low store moves its goods from the market into Province Food.
# staple_per_province_food: a staple food's output line = this x the Province Food line (-21.5 % at an empty store,
#   +15.4 % at 24 months). 0.40 balances the farm tiers: what a farm gains in food it gives up in crop, at 12 food per
#   unit of crop value (the food value of a staple), within about 8 % of its value for every tier (the late tiers'
#   throughput and Province Food share in config/crop_farms.toml finish the balance). Every crop farm good keeps it
#   (one pp_stored_food_staple_line for the crop farms' AI weight).
# staple_per_province_food_by_good: goods whose buildings make less Province Food per gold of their good than a crop
#   farm (the buy-back Provision). The same balance: 0.40 x the median over the good's provisioning buildings of
#   Province Food / (12 x the good's output value at their best methods), over the crop farms' median of the same
#   ratio (0.266); tests/test_stored_food.py recomputes it from the blueprints.
# The line also moves every RGO and every other producer of these goods. The crop farms' ai_construct_weight
# takes the line out of the crop output modifier it reads as land quality (pp_stored_food_staple_line).
province_food_share = { 0 = 1.0, 6 = 0.8, 12 = 0.65, 18 = 0.5, 24 = 0.4 }
staple_per_province_food = -0.40
staple_per_province_food_by_good = { fish = -0.20, fruit = -0.21, wild_game = -0.14, wool = -0.23 }

