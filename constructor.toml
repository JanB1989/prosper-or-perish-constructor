[project]
name = "Prosper or Perish Constructor"
mod_root = "mod/Prosper or Perish (Population Growth & Food Rework)"

[artifacts]
root = "artifacts"
data = "artifacts/data"
buildings = "artifacts/data/buildings"
savegame = "artifacts/data/savegame"
graphs = "graphs"
reports = "reports"
accepted_blueprints = "blueprints/accepted"
generated_blueprints = "blueprints/generated"

[building_blueprints]
manifest = "blueprints/buildings.manifest.yml"
clean_paths = [
    "in_game/common/building_types/pp_building_adjustments.txt",
    "in_game/common/building_types/pp_food_buildings.txt",
    "in_game/common/building_types/pp_new_buildings.txt",
    "in_game/common/production_methods/pp_production_methods.txt",
    "in_game/common/advances/pp_agricultural_innovations.txt",
    "in_game/common/advances/pp_production_method_unlocks.txt",
    "in_game/common/prices/pp_building_price_adjustments.txt",
    "main_menu/localization/english/pp_new_buildings_l_english.yml",
]

[parser]
profile = "constructor"
load_order = "constructor.load_order.toml"

[farming_village_rgo_unlocks]
goods = ["rice", "maize", "potato", "olives"]
subcontinent_region_threshold = 0.60

[farming_village_rgo_unlocks.methods]
rice = ["pp_rice_farm_base_rice", "pp_rice_farm_maintenance"]
maize = ["pp_maize_farm_base_maize", "pp_maize_farm_maintenance"]
potato = ["pp_potato_farm_base_potato", "pp_potato_farm_maintenance"]
olives = ["pp_olives_farm_base_olives", "pp_olives_farm_maintenance"]

[farming_village_rgo_unlocks.general_unlocks.rice]
age = "age_3_discovery"
requires = "new_world_advance"

[farming_village_rgo_unlocks.general_unlocks.maize]
age = "age_4_reformation"
requires = "global_trade_advance"

[farming_village_rgo_unlocks.general_unlocks.potato]
age = "age_5_absolutism"
requires = "newspapers_advance"

[farming_village_rgo_unlocks.general_unlocks.olives]
age = "age_4_reformation"
requires = "global_trade_advance"

[building_outputs]
prefix = "pp_"
building_types = "in_game/common/building_types/zz_{prefix}{tag}.txt"
production_methods = "in_game/common/production_methods/{prefix}{tag}.txt"
prices = "in_game/common/prices/{prefix}{tag}.txt"
advances = "in_game/common/advances/{prefix}{tag}.txt"
localization = "main_menu/localization/english/{prefix}{tag}_l_english.yml"
icons = "in_game/gfx/interface/icons/buildings"

[blueprint_evaluation]
raw_input_efficiency_per_good = 0.05
profit_percent_min = -0.30
profit_percent_max = 0.30
base_output_per_1k_min = 0.07
base_output_per_1k_max = 0.15
age_throughput_growth = 0.10
throughput_tolerance = 0.30
amortization_months_max = 360
amortization_months_min = 120

[building_scaling]
worker_victuals_food_need_ratio = 1.0
increase_per_level_cost_multiplier = 0.75
burgher_building_employment_size = 0.3


[blueprint_evaluation.throughput_gold_per_1k]
peasants = 1.0
laborers = 1.5
labourers = 1.5
burghers = 2.5

[blueprint_evaluation.modifier_categories.infrastructure_category]
modifiers = ["market_access", "local_market_access", "free_building_levels", "local_distance_from_capital_speed_propagation"]



[dependencies]
parser = "../eu5-game-parser"
building_pipeline = "../eu5-building-pipeline"
orchestrator = "../eu5-mod-orchestrator"

[worldbuilder]
# World Builder handover (EU5WorldBuilder `worldbuilder handover`); the constructor consumes this contract only.
handover = "../EU5WorldBuilder/artifacts/handover/latest"
# World Builder geography export (`worldbuilder geography-test` build), synced into the mod.
geography_export = "../EU5WorldBuilder/artifacts/geography_test/EU5 World Builder"
vanilla_baseline = "data/vanilla/locations_with_raw_material.parquet"
sync_geography = true
apply_on_build = true
level_limit = 20
goods_floor = -0.2
overpopulation_peasant_unrest = 0.1

[worldbuilder.buildings.map]
# World Builder ledger type -> blueprint key
clearing = "land_clearance"
management = "field_management"
water_supply = "irrigation_systems"
paddy_control = "irrigated_fields"
flood_bunds = "bund"
field_drainage = "field_drainage"
polders = "polders"
oasis_irrigation = "qanats"

[worldbuilder.buildings.niche]
# Culture- or country-locked vanilla capacity buildings that keep their niche. Each is a full REPLACE blueprint that
# shares the cap of a general family (levels of every member count against the same equation), is worth `strength` x
# the family's people per level, and keeps its lock (`lock` lines are ANDed into location_potential; country locks and
# advance unlocks stay in the blueprint).
khmer_baray = { family = "irrigation_systems", strength = 1.5, lock = ["dominant_culture ?= culture:khmer_culture"] }
incamisana = { family = "irrigation_systems", strength = 1.5 }

[worldbuilder.compat]
# Vanilla scripts that test specific climate/vegetation/topography classes. They are copied into the mod with every
# test of a vanilla parent class widened to its World Builder children (families from the export's
# geography_compatibility.json), regenerated from the current vanilla files on every apply. Whole-file overrides:
# keep this list to files where the tests matter for gameplay. Vanilla building files are listed only where a widened
# building is not already a REPLACE blueprint of the mod (sawmill, spiritual retreat, peasants hunting grounds, oma falaj).
vanilla_files = [
  "in_game/common/scripted_triggers/location_triggers.txt",
  "in_game/common/scripted_triggers/goods_triggers.txt",
  "in_game/common/building_types/rural_buildings.txt",
  "in_game/common/building_types/unique_buildings.txt",
  "in_game/common/building_types/estate_buildings.txt",
  "in_game/common/building_types/event_only_buildings.txt",
  "in_game/common/diseases/malaria.txt",
  "in_game/common/diseases/bubonic_plague.txt",
  "in_game/common/diseases/great_pestilence.txt",
  "in_game/common/diseases/smallpox.txt",
  "in_game/common/diseases/influenza.txt",
  "in_game/common/generic_actions/columbian_exchange.txt",
  "in_game/common/generic_actions/italian_wars.txt",
  "in_game/common/insults/00_insults.txt",
  "in_game/events/estates/cossacks_estate_events.txt",
  "in_game/events/exploration/exploration_monthly_events.txt",
  "in_game/events/religion/pilgrimage_events.txt",
  "in_game/events/situations/little_ice_age.txt",
  "in_game/events/character/artist_events.txt",
  "in_game/events/DHE/flavor_plc.txt",
  "in_game/events/DHE/flavor_chi_treasure_expedition.txt",
  "in_game/events/DHE/flavor_TUR.txt",
  "in_game/events/DHE/flavor_ICE.txt",
  "in_game/events/DHE/flavor_ETH.txt",
  "in_game/events/DHE/flavor_ENG.txt",
]

[worldbuilder.level_scale]
# multiply levels, divide people per level; 1.0 keeps the World Builder units. Chosen so every general building is
# worth roughly 700-2,600 people per level (niche members: 1.5x their family); only integer scales are safe because caps
# and starting levels are floored, so bund and field drainage keep their small World Builder units. A common price per
# level then means a similar price per person; the level limit scales with it.
irrigated_fields = 8
field_management = 3
land_clearance = 2
irrigation_systems = 2
polders = 1
qanats = 1
bund = 1
field_drainage = 1

[worldbuilder.farm_land]
# capacity units (1 unit = 1,000 people) a farm level takes from subsistence land, and the land that must stay
arable = { land = 5, reserve = 5 }
plantation = { land = 10, reserve = 5 }
herd = { land = 2, reserve = 1 }

[worldbuilder.farm_land.classes]
plantation = ["cotton_plantation", "sugar_plantation", "tobacco_plantation", "dye_plantation", "chili_plantation"]
herd = ["sheep_farms", "hurdled_sheepcotes", "enclosed_sheep_walks", "horse_breeders", "stud_farm", "elephant_kraal", "husbandry_farmstead"]
