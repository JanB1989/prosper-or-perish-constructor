[worldbuilder.start]
# Game-start building placement (rural food buildings and the urban food chain) from the capacity model; replaces the
# savegame-driven food startup compiler. A farm never pushes a location over its cap: spare land = capacity - pops.
keep_pops_within_capacity = true
fill_improvements_to_pops = true      # starting improvement levels rise to their caps where the 1337 pops need the room
peasant_work_share = 0.6              # share of a location's peasants that may staff rural buildings at start
max_farm_levels_per_location = 6
food_target_ratio = 1.1               # province food supply aimed for, relative to what the pops eat
# Subsistence is read from NLocation.SUBSISTENCE_AGRICULTURE.
subsistence_pop_types = ["peasants", "laborers", "slaves"]
max_cookshop_levels_per_location = 6
# Victuals limits come from the live import/export scripted values.
laborer_conversion_share = 0.5        # share of a location's peasants that may become the Cookshops' laborers
# Vanilla setup buildings kept where the World Builder geography fails their location_potential (as the World Builder
# test mod does): pp_wb_setup_<building>_location lists them (pp_wb_setup_buildings.txt) and each building's potential
# tests it. irrigation_systems is not listed: an improvement building, its start levels come from the capacity model.
keep_setup_buildings = ["terraces", "fruit_orchard", "tar_kiln", "lumber_mill"]
[worldbuilder.start.processors]
# raw material -> building placed at game start (its laborers are converted from local peasants); levels as before
alum = { building = "alum_quarry", levels = 1 }
clay = { building = "clay_pit", levels = 2 }
coal = { building = "coal_mine", levels = 1 }
copper = { building = "copper_mine", levels = 1 }
fish = { building = "fishing_village", levels = 3 }
fur = { building = "forest_village", levels = 2 }
gems = { building = "gem_gravel_pit", levels = 1 }
goods_gold = { building = "gold_diggings", levels = 1 }
iron = { building = "iron_mine", levels = 2 }
lead = { building = "lead_mine", levels = 1 }
lumber = { building = "lumber_mill", levels = 2 }
marble = { building = "marble_quarry", levels = 1 }
mercury = { building = "cinnabar_pit", levels = 1 }
salt = { building = "inland_saltworks", coastal_building = "salt_collector", levels = 2 }
saltpeter = { building = "saltpeter_beds", levels = 1 }
sand = { building = "sand_pit", levels = 1 }
silver = { building = "silver_mine", levels = 1 }
stone = { building = "stone_quarry", levels = 1 }
tin = { building = "tin_streamworks", levels = 1 }
wild_game = { building = "forest_village", levels = 2 }
[worldbuilder.start.rank_capacity_people]
# flat housing of the location ranks, must match pp_location_rank_adjustments.txt (net of vanilla)
town = 10000
city = 25000
megalopolis = 40000
# Pops the engine promotes out of the peasants when a campaign starts (per 1,000 pops of the location, by rank),
# beyond what the pops setup file defines. Nobles eat 25x a peasant, so this is most of a town's food demand.
# Fitted to a one-month reference save on 2026-09-22; `uv run ppc worldbuilder food-check --save <file>` refits it.
[worldbuilder.start.engine_promotion.rural_settlement]
nobles = 2.7
clergy = 4.6
burghers = 0.0
laborers = 107.0
soldiers = 3.5
[worldbuilder.start.engine_promotion.town]
nobles = 9.4
clergy = 17.0
burghers = 42.7
laborers = 106.6
soldiers = 6.7
[worldbuilder.start.engine_promotion.city]
nobles = 8.6
clergy = 18.0
burghers = 17.9
laborers = 103.5
soldiers = 13.4
[worldbuilder.start.engine_promotion.megalopolis]
nobles = 10.9
clergy = 14.9
burghers = 13.6
laborers = 44.8
soldiers = 13.6
# The same promotion per location as constant k + per 1,000 pops + per development point (fitted on nb.eu5, 1337.4.1,
# 2026-09-25; `ppc worldbuilder food-check` refits it as engine_promotion_linear). It replaces the per-1,000 shares
# above where given: the laborers follow the RGO's desired workers, not the population (a 300k location gets ~10k,
# not 32k), which put ~200k too many non-farming laborers into dense provinces. Megalopolis keeps the shares (3 samples).
[worldbuilder.start.engine_promotion_linear.rural_settlement]
nobles = [0.0081, 0.0024, -0.0001]
clergy = [-0.0066, 0.0045, 0.0006]
laborers = [0.9124, 0.0283, 0.0684]
soldiers = [0.0153, 0.0001, 0.0054]
[worldbuilder.start.engine_promotion_linear.town]
nobles = [0.0498, 0.0094, -0.0021]
clergy = [0.1576, 0.0113, 0.0056]
burghers = [-1.5255, 0.007, 0.1418]
laborers = [1.8261, 0.0136, 0.1472]
soldiers = [0.5122, -0.0006, -0.0061]
[worldbuilder.start.engine_promotion_linear.city]
nobles = [0.0859, 0.0088, -0.0036]
clergy = [0.3084, 0.0109, 0.0071]
burghers = [0.5813, -0.0036, 0.0355]
laborers = [1.6061, 0.0176, 0.1833]
soldiers = [0.4942, 0.0007, 0.0148]
[worldbuilder.start.rgo_workers_k]
# peasants (thousands) the location's RGO employs at start by rank; they leave subsistence agriculture (same fit)
rural_settlement = 1.5
town = 2.0
city = 2.4
megalopolis = 2.3
[worldbuilder.start.victuals]
# Victuals are the mod's food in the goods market: Victualling Yards pack them from full province stores, Taverns are
# the only buildings that turn them back into province food. The planner (placement v2, [worldbuilder.start.food_model])
# keeps each market's victuals supply >= demand x victuals_target; these numbers feed its pop demand and `ppc worldbuilder
# food-check`'s refit.
pop_demand_scale = 0.305  # observed pop demand vs the goods file's demand_add x demand_multiply (food-check refit on nb.eu5, 2026-09-25; was 0.4)
# victuals per building level as the market shows them (food-check refits). Cookshops make none since 2026-09-25 (Serve
# only); the Grange packs 1.5 per level loose, the harbour Victualling Yard makes 3 (20 food + shipped grain) and the
# Tavern buys 2 (the former 90-food Victualler's measured 1.8 x 2/3).
producers = { victualling_yard = 0.932, grange = 0.6 }   # 2026-10-03: the Yard ships grain only; the Grange packs 24 food
consumers = { tavern = 1.2, lumber_mill = 0.3 }
[worldbuilder.start.province_food]
# Province Food (the local_food good, 1 food per unit) one staffed level makes on top of its local_monthly_food, as the
# start budget counts it (worldbuilder/start_simulation.py province_food_per_level). Read from the building
# definitions: the output of the building's Provisioning method (method_pattern; crop farms 0.96 x M with M = tier base
# output / 0.06, fishing villages 0.8, forest villages and orchards 0.96) and, for the buildings under serve, the named
# Serve method (on top of the Cookshop's flat local_monthly_food). The budget assumes that method runs and does
# not scale it by the local food modifier. per_level = { building = value } overrides a derived value.
method_pattern = "pp_{building}_provision"
serve = { cookshop = "pp_cookshop_livestock_pottage_serve" }   # its staples count against the market; it sells for
# offset since 2026-10-03, so it adds no Province Food (the Cookshop feeds by its flat local_monthly_food)
# the Tavern unpacks victuals into Province Food (Serve Victuals, 24 per level since 2026-10-01; was a flat +24)
unpack = { tavern = "pp_tavern_serve_victuals" }
per_level = {}
[worldbuilder.start.food_model]
# Food model v2 (worldbuilder/start_food_model_v2.py), fitted 2026-09-25 on the day-0 save nb.eu5 (1337.4.1, 4,018
# province/owner pools, production = base_food_consumption + cached_structural_food_change): R2 0.989 per pool,
# aggregate +0.9 %. Subsistence = define (NLocation.SUBSISTENCE_AGRICULTURE) x (1 + static local_monthly_food_modifier
# stack) x yield_rank x yield_climate per 1,000 jobless peasants and slaves (jobless laborers produce nothing: fitted
# -0.03). `uv run ppc worldbuilder food-check --save <file>` refits yield_rank / yield_climate (model_v2.refit).
subsistence_pop_types = ["peasants", "slaves"]
yield_rank = { rural_settlement = 1.04, town = 1.019, city = 0.972, megalopolis = 0.924 }
# climates with >= 500k jobless workers; the cold ones carry the April winter consumption of the reference save
yield_climate = { arctic = 0.428, arid = 1.013, cold_arid = 0.95, cold_semi_arid = 0.839, continental = 1.035, continental_monsoon = 0.889, dry_summer_continental = 1.069, highland_monsoon = 0.641, hot_semi_arid = 1.048, mediterranean = 0.98, oceanic = 1.001, savanna = 1.023, subtropical = 0.964, subtropical_monsoon = 1.082, tropical = 1.056, tropical_monsoon = 1.044 }
# the overpopulation modifier: local_peasants_food_consumption +0.25 per unit of pop / capacity - 1 (pp_capacity_pressure_effects.txt;
# 0.5 until 2026-10-01, fitted in game -0.47..-0.51 at that value)
overpopulation_consumption = 0.25
start_food_share = 1.0             # the engine fills every province store to capacity at setup; the mod leaves it
# province food capacity per pool (max_food_value), fitted on nb.eu5 (R2 0.968); buildings' local_food_capacity adds
capacity = { per_development = 31.97, per_population_k = 3.65, per_location = 99.9, rank = { town = 521.3, city = 815.2, megalopolis = 1240.8 } }
# placement v2 (start_simulation.place_food_chain)
# 2026-09-30: the three victuals buildings scaled x0.4 (inputs, outputs and food modifier together)
tavern_victuals_per_level = 0.8    # victuals a staffed Tavern buys per month (24 food, 30 per victual)
yard_victuals_per_level = 0.6      # victuals a staffed Grange packs per month (24 food, loose stores)
harbor_yard_victuals_per_level = 0.932   # victuals a staffed harbour Victualling Yard makes (2.33 shipped grain, no store
                                         # food since 2026-10-03)
grange_at_start = false           # no Granges at game start (2026-10-03): every store starts far above its rest point;
                                  # the AI builds Granges where food really piles up (the Grange's ai_construct_weight)
# Food deficits (2026-10-03, Jan: farms almost always where they make sense, Taverns only in rare cases): before any
# Cookshop or Tavern, short pools get tier-0 crop farm levels (best crop by suitability, livestock last), one level at a
# time over the pool's locations, wherever a level adds at least this much food after its peasants' lost subsistence
deficit_farm_min_net_food = 0.25
# Cookshops: every level runs a dish (no Preserve recipes since 2026-09-25); since 2026-10-03 dishes and drinks sell
# for offset and the food is the flat local_monthly_food only
cookshop_serve_share = 1.0
cookshop_drink_food = 0.0          # drink slot Province Food per level (none since 2026-10-03: drinks sell for offset)
victuals_target = 1.1              # per market: victuals supply >= demand (Taverns + pops) x this
yard_surplus_share = 0.25          # Yards only in pools that feed themselves by more than +25 %
yard_min_capacity_months = 20.0    # ... and whose store can reach the Grange's band (20 months)
harbor_yard_min_capacity_months = 12.0   # the harbour Yard's band starts lower (break-even about 12 months stored)
yard_min_level_share = 0.3         # a Yard level once the spare food fills 30 % of one (levels staff partly)
raw_goods_per_rgo_k = 1.5          # raw food goods per 1,000 RGO workers (nb.eu5 median 1.50; Jan 2026-10-03: stays)
serve_raw_goods_share = 0.2        # share of the market's raw food output new Serve Cookshops may use (nb.eu5: 21 % spare)
serve_fallback_raw_goods_share = 0.5   # when the market cannot supply the Taverns' victuals

[worldbuilder.start.construction_materials]
# Every market gets a minimum monthly supply of lumber, masonry and tools from its starting buildings: AI-queued
# Taverns (victuals_trade_construction: lumber 0.25, masonry 0.1, tools 0.1 for 365 days) and every other early
# build stall in markets without them (233 of 1,567 AI Victuallers, now Taverns, unfinished by 1345). Expected demand =
# margin x the construction demand per million pops of the same campaign in 1341 (pre41.eu5: lumber 216, masonry 271,
# tools 64 on 354 M pops; nb.eu5 on day 0 has none yet) + per queued Tavern the placement still wanted. Producer outputs per
# level are nb.eu5's market supply per building level (day 0).
margin = 2.0
[worldbuilder.start.construction_materials.goods.lumber]
producers = { lumber_mill = 0.70, water_sawmill = 1.0, lumber_mill_improved = 1.0 }
rgo_output_per_location = 0.58     # lumber is also a raw material: nb.eu5 RGO output 2,905 on 2,514 locations,
                                   # halved by global_raw_material_output -0.5 (2026-10-03)
place = ["lumber_mill"]
construction_per_million_pops = 0.61
per_tavern = 0.25
max_levels_per_location = 2
[worldbuilder.start.construction_materials.goods.masonry]
producers = { mason = 0.49 }
place = ["mason"]
inputs = ["stone", "clay"]
input_buildings = ["stone_quarry", "clay_pit"]
construction_per_million_pops = 0.77
per_tavern = 0.1
max_levels_per_location = 2
[worldbuilder.start.construction_materials.goods.tools]
producers = { tools_guild = 0.18, market_village = 0.144, tatara = 0.5 }
place = ["tools_guild", "market_village"]
inputs = ["iron", "stone", "copper"]
input_buildings = ["iron_mine", "stone_quarry", "copper_mine"]
construction_per_million_pops = 0.18
per_tavern = 0.1
max_levels_per_location = 2

[worldbuilder.start.food_sim]
# Start-food validator (worldbuilder/food_sim.py; `ppc worldbuilder food-sim`, reported by `ppc build`). Population
# loop calibrated on the pre-plague saves 1337.4 / 1341.3 / 1345.3 (tools/province_food_sim.py --depop).
months = 96
victuals_price = 2.7
# true = the engine's market migration between pools (worldbuilder/migration.py, docs/migration_rulebook.md) replaces
# the flat starving out-migration; `ppc worldbuilder food-sim --migration` turns it on for one run.
migration = false

[worldbuilder.start.crops]
# The farming village is split into one farm per crop; at game start a location's farm levels are spread over the
# crop farms. Livestock first takes round(g x levels), g = its grazing share (World Builder grazing / (grazing +
# starting crop) area); the crops share the rest by crop weight = max(0, 1 + the good's World Builder output rows over
# the location's classes). See src/prosper_or_perish_constructor/worldbuilder/crop_allocation.py.
floor_share = 0.6                  # crops under this share of the heaviest crop weight are dropped (never the RGO crop)
rgo_bonus = 0.5                    # added to the RGO crop's weight, or to g on a livestock RGO (then capped at the max)
grain_min_levels_from = 3          # from this many levels on at least one staple crop is placed
livestock_share_default = 0.2      # grazing share where the World Builder table has no value
livestock_share_min = 0.1
livestock_share_max = 0.35         # 0.7 -> 49 % cattle, 0.5 -> 43 %, 0.35 -> 28 % of the game-start crop levels (2026-09-25)
livestock_bonus = 0.1              # added on livestock_rgos and grasslands/sparse vegetation, then clipped
                                   # (0.2 with max 0.5 still gave cattle 43 %; lowered 2026-09-25)
livestock_rgos = ["livestock", "wool", "horses", "camels"]   # pastoral RGOs (camels: EU5 1.4)
livestock_source = "../EU5WorldBuilder/artifacts/locations/locations.csv"
gated_goods = ["rice", "maize", "potato", "olives"]   # only in their native sub-continents/regions (config/crop_farms.toml [unlocks] gates)
# the staple crops of grain_min_levels_from: the staple_group "crops" of config/goods_categories.csv (staple_foods.py)
buildings = { wheat = "wheat_farm", rice = "rice_farm", millet = "millet_farm", maize = "maize_farm", legumes = "legume_farm", potato = "potato_farm", olives = "olive_farm", livestock = "cattle_farm" }

[worldbuilder.level_scale]
# multiply levels, divide people per level; 1.0 keeps the World Builder units. Chosen so every general building is
# worth roughly 700-2,600 people per level (niche strengths are configured above); only integer scales are safe because caps
# and starting levels are floored, so bund and field drainage keep their small World Builder units. A common price per
# level then means a similar price per person; the level limit scales with it.
irrigated_fields = 8
field_management = 3
land_clearance = 2
irrigation_systems = 2
polders = 1
qanats = 1
bund = 1
field_drainage = 1

[worldbuilder.farm_land]
# capacity units (1 unit = 1,000 people) a farm level takes from subsistence land, and the land that must stay
arable = { land = 5, reserve = 5 }
plantation = { land = 10, reserve = 5 }
herd = { land = 2, reserve = 1 }

[worldbuilder.farm_land.classes]
# cash crops take twice the land of grain; their methods carry the throughput to pay for it (2026-09-26: outputs x4)
plantation = [
    "cotton_plantation", "sugar_plantation", "tobacco_plantation", "dye_plantation", "chili_plantation",
    "tobacco_farm", "market_tobacco_farm", "coffee_grove", "terraced_coffee_grove", "cocoa_grove", "managed_cocoa_grove",
    "tea_garden", "tea_sorting_garden", "sugarcane_farm", "trapiche_sugarcane_farm", "cotton_farm", "market_cotton_farm",
    "clove_grove", "pepper_garden", "managed_pepper_garden", "saffron_croft", "saffron_kiln_croft",
]
herd = ["sheep_farms", "hurdled_sheepcotes", "enclosed_sheep_walks", "horse_breeders", "stud_farm", "elephant_kraal", "camel_herders", "camel_stud", "cattle_farm", "cattle_farmstead", "cattle_rotations", "cattle_model_farm"]

[building_footprint]
# Every accepted blueprint carries `footprint: <class>`. ppc build/sync writes
# raw_modifier local_population_capacity = share x employment_size per level (rounded to whole people) into the block
# that owns the building in the compiled mod. A building with a large footprint houses few of its workers (low share);
# a negative share takes land like a farm. "ignore" leaves the building untouched.
[building_footprint.classes]
farm_land = "ignore"          # farms that take land (worldbuilder.farm_land)
capacity_source = "ignore"    # improvement buildings and other buildings with their own capacity line
technical = "ignore"          # dummy buildings
urban_workshop = 0.75         # guilds, workshops, craft shops
urban_district = 0.75         # quarters and districts that are housing
administration = 0.70         # chanceries, councils, courts, offices
institutional = 0.60          # schools, academies, libraries, theatres, hospitals, missions
trade = 0.60                  # markets, trade offices, banks, trade company buildings, toll posts
religious = 0.55              # temples, monasteries, madrasas, churches
manufactory = 0.55            # urban manufactories and food works
barracks = 0.50               # barracks, armories, garrisons
rural_village = 0.50          # fishing, forest and market villages, settlements
mill_works = 0.40             # mills, foundries, factories, smelters
fishery = 0.40                # offshore fisheries
infrastructure = 0.40         # roads, transport, bridges, construction
maritime = 0.40               # docks, shipyards, admiralties, harbours
rural_processing = 0.35       # windmills, washmills, stamp mills, granaries
palace_grounds = 0.30         # palaces, residences and villas with grounds
monument = 0.20               # monument complexes, festival grounds
forestry = 0.20               # lumber, charcoal, tar, forest camps
fortification = 0.20          # walls, castles, forts
mining = 0.15                 # mines and mining villages
military_grounds = 0.10       # training fields, camps
estate_land = 0.10            # manors and estates that hold land
extractive_open = 0.05        # quarries, pits, diggings, salt pans
land_reserve = -0.25          # hunting grounds, royal forests and gardens, cattle enclosures

[age_food]
# Food relief by age (2026-10-03, Jan: age 2 stays tough, age 3 brings decent relief, later ages keep the progression;
# age_food.py, `ppc age-food apply|check`, the crop farm generator reads it for the farm tiers).
#   flat_food   local_monthly_food per staffed level of every farming building of the age
#   throughput  factor on the building's production methods (goods in and out; Provision follows the base output)
#               against the recipe as balanced before this table (1.0 = unchanged)
#   advance / global_food_decay   the age's food advance changes the country's food decay (base 0.004 a month since
#                                 2026-10-04, Jan; was 0.015: the cuts below scaled by 0.4 / 1.5 with it)
# Math (run b033350e): age 3 lifts the province store's resting point from ~8 to ~14 months (+0.3 %/yr) at about a
# third of the farm levels upgraded; a farmstead level makes 5.8 food instead of 3.0, decay falls 1.5 % -> 1.2 %.
age_1_traditions = { flat_food = 1.5, throughput = 1.0 }
age_2_renaissance = { flat_food = 1.5, throughput = 1.0, advance = "food_advance_renaissance", global_food_decay = 0.0 }
age_3_discovery = { flat_food = 3.5, throughput = 1.15, advance = "new_world_crops", global_food_decay = -0.0008 }
age_4_reformation = { flat_food = 4.5, throughput = 1.35, advance = "food_advance_reformation", global_food_decay = -0.0005 }
age_5_absolutism = { flat_food = 6.0, throughput = 1.45, advance = "food_advance_absolutism", global_food_decay = -0.0005 }
# AI weight of a farming upgrade where its predecessor stands (divided by owner income + 10, like the farm weight):
# the engine gives a replacement no profit gate but only AI_UPGRADE_BUILDING_UTILITY (0.001), so farmsteads stalled at
# 19 % (run b033350e, 1550)
upgrade_weight = 200

[age_food.buildings]
# the farming buildings outside the crop farm generator and their age (crop farm tiers take their tier advance's age)
net_curing_yard = "age_2_renaissance"
drift_net_fishery = "age_3_discovery"
nursery_orchard = "age_3_discovery"
offshore_fishery = "age_4_reformation"
managed_forest_village = "age_4_reformation"
pomological_orchard = "age_5_absolutism"

[production_labour]
# Every producing production method pays part of its input cost in manual_labor. Enabled blueprints tag their
# producing methods with `labour: { class: <class>, methods: { <method>: <class> } }`. `ppc labour apply` rewrites the
# method bodies so labour takes the class share of the total input cost at base prices (the cost itself stays);
# `ppc labour check` reports untagged methods and methods off their class (ppc build prints it).
good = "manual_labor"
price_floor_share = 0.2       # balance labour at its price floor: 20 % of the default price 5 = 1 gold (labour yards sell into scarcity)
tolerance = 0.02              # a method within this share of its class is left alone (a rounding step moves about 0.01)
min_good_share = 0.05         # goods worth less than this share of a method's input cost are folded into the rest
max_goods = 4                 # at most this many goods per method besides labour (the cheapest go first)

[farm_level_cost]
# Farms (footprint farm_land) repeat their levels cheaper: this factor x the goods-derived increase_per_level_cost
# (2026-09-30, reduce farm scaling). The increase-cost rule and the crop farm generator apply it.
footprints = ["farm_land"]
increase_per_level_cost_factor = 0.6

[building_price_brake]
# Non-raw producers (blueprint labour class) pay double their age price (an explicit price key in each blueprint:
# 100 gold, gun smith and cannon maker 200) and three times the goods-derived increase_per_level_cost, 2026-09-30:
# urbanisation and building-input demand grew far faster than population (run c5c4). The ppc increase-cost rule applies
# the factor, the blueprint evaluation allows the longer payback. Later-age crafts keep their age prices for now.
labour_classes = ["craft_medieval", "cottage"]
increase_per_level_cost_factor = 3
exclude = ["mason", "slave_market", "slave_center", "market_village"]  # construction goods, slave trade, rural village

[production_labour.classes]
# Share of the total input cost paid as labour. Later ages mechanise: the later the building, the smaller the share.
# "primary" = farms, villages, groves, pits, quarries, mines, fisheries, forestry and rural processing;
# "craft" = guilds, workshops, manufactories, mills and factories.
keep = "keep"                 # already carried labour or trade dummy goods (Taverns, Victualling Yards): left as they are
base = { output_share = 0.20 } # methods without goods inputs (base yields): labour worth 20 % of the output
hand_work = 0.45              # labour-heavy fallback methods for input shortages (lower output, fewer tools)
cottage = 0.25                # village home crafts: market village crafts, rural cloth- and glassmakers, tatara, brickmaking
primary_medieval = 0.18       # ages 1-2
primary_discovery = 0.14      # age 3
primary_reformation = 0.11    # age 4
primary_absolutism = 0.08     # age 5
primary_revolutions = 0.05    # age 6
plantation = 0.05             # slave plantations: slaves_goods already stands for the work
craft_medieval = 0.14         # guilds and Cookshops, ages 1-2
craft_discovery = 0.12        # age 3 workshops
craft_reformation = 0.10      # age 4 workshops
craft_absolutism = 0.07       # age 5 manufactories, Public Kitchens
craft_revolutions = 0.04      # age 6 mills and factories
# logistics buildings (River Boatmen's Yard, Carrier Inn and its regional variants, ...): every good of the recipe stays
logistics = { share = 0.20, max_goods = 6, min_good_share = 0.0 }       # animals, carts and boats do the carrying
logistics_hand = { share = 0.45, max_goods = 6, min_good_share = 0.0 }  # porters, towpath and hand crews

[production_gate]
# The AI builds a NEW production building only if one margin (revenue / input cost) reaches its threshold, and that margin
# is the last production method it looks at that has an output (docs/ai_building_rulebook.md 2.4i). Every enabled
# production blueprint names that method with a top-level gate_method key; ppc gate apply moves its slot to the bottom
# and lists it last, ordering the rest by importance (base slots top, dynamic slots bottom, else by output value);
# ppc gate check reports missing flags and bodies out of order (ppc build prints it). Ordering only: amounts never change.
threshold = 1.2               # fallback only: the gate reads NAI.AI_BUILDING_PROFIT_MARGIN_THRESHOLD (EU5 1.4 name) from the mod defines (else vanilla)
# goods whose output follows the province store (Province Food: the Provisioning, Serve and Cookshop slots; the
# Grange's Surplus Sales): their slots go last, and a gate flagged on one keeps it (no Market leg)
dynamic_goods = ["province_food_sales", "local_food"]
# floor-pinned dummy goods: their price never moves, so they are never a building's main (market) good
pinned_goods = ["local_food", "offset", "logistics"]
# goods with ai_rgo_expansion_priority > 0 (vanilla goods files): a building that outputs one skips the margin check
strategic_goods = ["clay", "iron", "goods_gold", "silver", "stone", "ivory", "masonry"]

[production_gate.leg]
# Gate leg (2026-09-30): every building with a market main good gets a last slot with one method that makes a little of
# that good for a floor-pinned dummy. The AI always reads a one-method slot (no research, potential, allow or input
# check) and the last method it reads decides the margin check for new buildings and extra levels alike (1.4). The leg's margin
# is (1 + output modifiers) x the good's market price / base price x margin, so the AI builds when the good is dear and
# stops when it is cheap: at margin 1.0 and the 1.05 threshold it opens at 1.05x the base price without output bonus,
# earlier on good land. Storage-leg gates (grange, tavern), services and logistics keep their own gate.
margin = 1.0
value = 0.01          # gold of the main good per level at base prices; the cost x market access must stay above 0.001
input = "offset"
slot_label = "Market"
method_name = "Market Sales"
method_desc = "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."

[legacy_methods]
# An upgrade never takes a recipe away (2026-10-04, Jan). Vanilla's manufacturing lines drop the older tiers' recipes on
# upgrade (stone/copper/bronze tools stop at the guild, every beer grain but wheat at the workshop) and the old tier can
# no longer be built once the next is researched, so an economy built on the old inputs could not grow. Every tier of a
# line below keeps the recipes of the tiers under it as legacy methods pp_<building>_legacy_<origin method>: same goods,
# output = share x the slot's most valuable own method, at that method's margin (same profit per gold, less per level).
# Share = the origin method's value / its slot's best own method (vanilla's own ratios), x decay per tier moved up.
# A recipe the tier's own methods already run (a subset of its goods, no other advance) is not carried. The AI's method
# switcher takes the best profit per level among methods whose inputs are in the market, so the contemporary method wins
# wherever its goods exist. `ppc legacy apply|check` (legacy_methods.py; ppc build prints the check, a test enforces it).
# Order after editing recipes: ppc labour apply, ppc legacy apply, ppc logistics apply, ppc gate apply.
decay = 0.75
label_suffix = "(Old Ways)"
desc = "An older way of working, kept from the {origin}. It still runs on its old materials, but turns out less per level than the methods of this age."

[legacy_methods.lines]
# tiers bottom up; each tier's blueprint must name the one before it as obsolete
beer = ["brewery", "beer_workshop", "brewery_manufactory", "brewery_mill"]
books = ["scriptorium", "printing_press_shop", "printing_manufactory", "printing_mill"]
cannons = ["cannon_maker", "cannon_workshop", "cannon_foundry", "cannons_factory"]
cloth = ["cloth_guild", "cloth_workshop", "cloth_manufactory", "textile_mill"]
dyes = ["dyes_guild", "dyes_workshop", "dyesworks", "dyes_mill"]
fine_cloth = ["fine_cloth_guild", "fine_cloth_workshop", "fine_cloth_manufactory", "fine_cloth_mill"]
firearms = ["hand_cannon_guild", "gun_smith", "guns_workshop", "firearms_manufactory", "firearms_factory"]
furniture = ["furniture_guild", "furniture_workshop", "furniture_manufactory", "furniture_mill"]
glass = ["glass_guild", "glass_workshop", "glassworks", "glass_mill"]
lacquerware = ["lacquerware_guild", "lacquerware_manufactory"]
leather = ["tannery", "tanning_workshop", "tannery_manufactory", "tannery_mill"]
liquor = ["distillers_guild", "distillers_workshop", "distiller_manufactory", "distiller_mill"]
naval_supplies = ["naval_supplies_guild", "naval_supplies_workshop", "naval_supplies_manufactory", "naval_supplies_mill"]
paper = ["paper_guild", "paper_workshop", "paper_manufactory", "paper_mill"]
porcelain = ["porcelain_guild", "porcelain_manufactory"]
pottery = ["pottery_guild", "pottery_workshop", "pottery_manufactory", "pottery_mill"]
saltpeter = ["saltpeter_guild", "saltpeter_workshop", "putrefaction_works", "putrefaction_mill"]
tools = ["tools_guild", "tools_workshop", "iron_foundry", "iron_mill"]
weapons = ["weapon_guild", "weapon_workshop", "weapon_manufactory", "weapon_factory"]
wine = ["winery", "winery_manufactory"]

[logistics]
# Logistics buildings carry goods to the market: they produce the pinned dummy good `logistics` (1 gold at its floor,
# like offset) and raise market access. Every logistics blueprint carries `logistics: { class: <class>, bulky_scale: x }`.
# `ppc logistics apply` rewrites them: each method costs input_cost at base prices and produces
# input_cost x class output (the last, improved method + improved_method_bonus); raw_modifier = local_market_access per
# level; modifier = the bulky-goods output cut (class cut x bulky_scale, half on bulky_half_goods) and the flavour lines;
# allow gains the market-access and building-level gates; increase_per_level_cost comes from the class, pop_type and
# employment_size from here. Every logistics building also gets a network slot (slot 0): one method
# pp_<building>_logistics_network with no goods inputs at all (no manual_labor) that makes network_output logistics.
# The engine scales raw_modifier by level x input fulfilment, the average over the building's slots, and a slot without
# inputs counts as fully supplied: at 0 market access a building buys no inputs, so without it the market access bonus
# fell to 0 and the location could never recover; with it half the bonus always stands (2026-10-01). Names per building
# in [logistics.network]. `ppc logistics check` reports blueprints off their class (network slot included) and prints
# the zone sizes (ppc build prints it). Order: ppc labour apply, ppc logistics apply, ppc gate apply.
good = "logistics"
input_cost = 3.0              # gold per level per method at default prices, manual_labor and floor goods at 1
market_access = 0.10          # raw_modifier local_market_access per level
gate_max_market_access = 0.85 # allow: market_access < this
gate_min_building_levels = 15 # allow: total_building_levels >= this
improved_method_bonus = 0.05  # extra output share on the improved (third) method
network_output = 0.30         # logistics per level of the input-less network method (pure profit, no input cost)
bulky_goods = ["stone", "marble", "clay", "sand", "coal", "iron", "copper", "tin", "lead", "salt", "saltpeter", "alum"]
bulky_half_goods = ["lumber"] # get half the class cut
# the staple foods (2026-10-03, every staple food since 2026-10-04: one share per good of the staple_group column of
# config/goods_categories.csv, ppc logistics check reports a missing or extra one): a small share of the class cut by
# bulk, so a crowded transport hub grows a little less food (the farms' AI weight reads the crop output modifier) and
# new farms go to the quieter land around it. Grain and pulses are heavy sacks, potatoes heavier and quick to spoil,
# fish travels in salt barrels, fruit bruises and spoils, game spoils unless smoked, olives travel as oil, wool in
# light bales, livestock walks to market.
bulky_staples = { wheat = 0.5, rice = 0.5, millet = 0.5, maize = 0.5, legumes = 0.5, potato = 0.75, olives = 0.35, livestock = 0.25, fish = 0.5, fruit = 0.6, wild_game = 0.4, wool = 0.25 }
pop_type = "laborers"
employment_size = 1
flavour = { local_institution_growth_modifier = 0.05, local_supply_limit_modifier = 0.05, local_disease_resistance = -0.05 }  # per level, in modifier

[logistics.classes]
# output = main-slot output as a multiple of the input cost (2026-10-01: more profitable, was 1.25/1.21/1.18/1.15)
river    = { output = 1.40, bulky_cut = 0.005, increase_per_level_cost = 0.20 }
coastal  = { output = 1.35, bulky_cut = 0.005, increase_per_level_cost = 0.20 }
overland = { output = 1.30, bulky_cut = 0.010, increase_per_level_cost = 0.25 }
urban    = { output = 1.25, bulky_cut = 0.010, increase_per_level_cost = 0.30 }

[logistics.network]
# Player-facing names of each building's network slot: slot label, method name, method description (no numbers).
carrier_inn = { slot = "Road Network", method = "Carrier Network", desc = "Regular carriers call at the inn on fixed days and take on loads, so some traffic keeps moving even when the inn's own stables stand empty." }
transport_office = { slot = "Dispatch", method = "Dispatch Network", desc = "Agents in the neighbouring towns pass consignments along a standing schedule, so some freight keeps moving even when the office's own carts stand idle." }
river_boatmen_yard = { slot = "River Network", method = "River Pilots", desc = "Pilots who know every shoal, weir and ferry guide passing barges, so some freight keeps moving on the river even when the yard's own boats lie idle." }
coastal_shipping_office = { slot = "Coastal Network", method = "Coastal Pilots", desc = "Local pilots and harbour masters bring passing coasters in and out, so some trade keeps moving along the coast even when the office's own ships lie idle." }
pp_caravanserai = { slot = "Caravan Network", method = "Caravan Network", desc = "Merchants' agents arrange loads from one caravanserai to the next, so some caravans keep moving even when the courtyard's own stables stand empty." }
pp_oasis_caravan_station = { slot = "Desert Network", method = "Well Keepers", desc = "Families who keep the wells clear and the palms watered make the station a sure halt, so some camel trains keep crossing even when its own stores run dry." }
pp_yam_station = { slot = "Relay Network", method = "Relay Post", desc = "The station keeps its place in the courier relay, passing news and small loads from stage to stage even when its own horses and sledges are wanting." }
pp_banjara_tanda = { slot = "Clan Network", method = "Tanda Network", desc = "Kinship ties between the camps let loads pass from one tanda to the next along the grazing routes, even when the camp's own herds are thin." }
