[[worldbuilder.navigation_scripts.patches]]
# Chinese treasure voyage (EU5 1.4: an expedition, moved from in_game/events/DHE/flavor_chi_treasure_expedition.txt):
# the fleet departs from the country's most developed port and create_route builds its waypoints over water
# (is_land = no) to a coastal location of the target sea area; travel_mode = sea. A river port has no sea route, and
# the route must not run up the channels: departure on the sea coast, target on the sea coast, route off the channels.
file = "in_game/common/expedition_types/treasure_fleet.txt"
replace = [
  { find = "ordered_owned_non_rural_location = {\n\t\t\tlimit = { is_port = yes }", with = "ordered_owned_non_rural_location = {\n\t\t\tlimit = { is_port = yes pp_is_sea_coast = yes }", count = 1 },
  { find = "random_location_in_area = {\n\t\t\t\tlimit = { is_coastal = yes }", with = "random_location_in_area = {\n\t\t\t\tlimit = { is_coastal = yes pp_is_sea_coast = yes }", count = 1 },
  { find = "limit = { is_land = no }", with = "limit = { is_land = no NOT = { region = region:pp_navigation_region } }", count = 1 },
]

[[worldbuilder.navigation_scripts.patches]]
# EU5 1.4 circumnavigation (travel_mode sea): it may start only with a sea-coast core port and departs from one
file = "in_game/common/expedition_types/circumnavigation_expedition.txt"
replace = [
  { find = "is_port = yes", with = "is_port = yes pp_is_sea_coast = yes", count = 2 },
]

[[worldbuilder.navigation_scripts.patches]]
# EU5 1.4 Pacific crossing (travel_mode sea): it may start only with a sea-coast Pacific port and departs from one
