[project]
name = "Prosper or Perish Constructor"
mod_root = "mod/Prosper or Perish (Population Growth & Food Rework)"

[artifacts]
root = "artifacts"
data = "artifacts/data"
buildings = "artifacts/data/buildings"
savegame = "artifacts/data/savegame"
graphs = "graphs"
reports = "reports"
accepted_blueprints = "blueprints/accepted"
generated_blueprints = "blueprints/generated"

[building_blueprints]
manifest = "blueprints/buildings.manifest.yml"
clean_paths = [
    "in_game/common/building_types/pp_building_adjustments.txt",
    "in_game/common/building_types/pp_food_buildings.txt",
    "in_game/common/building_types/pp_new_buildings.txt",
    "in_game/common/production_methods/pp_production_methods.txt",
    "in_game/common/advances/pp_agricultural_innovations.txt",
    "in_game/common/advances/pp_production_method_unlocks.txt",
    "in_game/common/prices/pp_building_price_adjustments.txt",
    "main_menu/localization/english/pp_new_buildings_l_english.yml",
]

[parser]
profile = "constructor"
load_order = "constructor.load_order.toml"

[building_outputs]
prefix = "pp_"
building_types = "in_game/common/building_types/zz_{prefix}{tag}.txt"
production_methods = "in_game/common/production_methods/{prefix}{tag}.txt"
prices = "in_game/common/prices/{prefix}{tag}.txt"
advances = "in_game/common/advances/{prefix}{tag}.txt"
localization = "main_menu/localization/english/{prefix}{tag}_l_english.yml"
icons = "in_game/gfx/interface/icons/buildings"

[blueprint_evaluation]
raw_input_efficiency_per_good = 0.05
profit_percent_min = -0.30
profit_percent_max = 0.30
base_output_per_1k_min = 0.07
base_output_per_1k_max = 0.15
age_throughput_growth = 0.10
throughput_tolerance = 0.30
amortization_months_max = 360
amortization_months_min = 120
base_method_input_goods = ["manual_labor"]  # base methods pay a token labour cost and stay base methods

[building_scaling]
increase_per_level_cost_multiplier = 0.75
burgher_building_employment_size = 0.3
# Provisioning slot of calorie buildings (provisioning.py): per level of a building whose base output equals the
# reference, the gold of its own good bought back and the Province Food per gold of that good.
provision_input_per_level = 0.08
provision_food_per_gold = 12
provisioning_reference_base_output = 0.06
# Crop farms (farm v3, 2026-10-02): Provision takes a token of the crop and makes a fixed Province Food amount per
# level, so the farm sells nearly all its crop and Provision is its AI gate (open at any crop price); the AI's price
# response is the farm's ai_construct_weight (config/crop_farms.toml [general.ai_construct_weight]).
crop_provision_input_gold = 0.01
crop_provision_food_per_level = 1.5

# Fewer workers per level (2026-10-03, Jan): every building of the pop type whose employment_size is the reference gets
# the new size at finalize (after the footprint, which keeps the reference, so population capacity stays). Output and
# profit per level are unchanged; blueprints and the blueprint evaluation keep the reference. building_scaling.py.
[building_scaling.employment_cut]
laborers = { reference = 1.0, employment = 0.8 }
burghers = { reference = 0.3, employment = 0.25 }


[blueprint_evaluation.price_overrides]
manual_labor = 1.0   # labour is balanced at its price floor (20 % of 5), see [production_labour]
logistics = 1.0      # the logistics dummy good sits at its price floor (20 % of 5) by its base supply, see [logistics]
local_food = 0.1          # Province Food is pinned at its price floor (20 % of 0.5) by its base supply
offset = 1.0              # the offset dummy good sits at its price floor (20 % of 5) by its base supply

[blueprint_evaluation.throughput_gold_per_1k]
peasants = 1.0
laborers = 1.5
labourers = 1.5
burghers = 2.5

[blueprint_evaluation.modifier_categories.infrastructure_category]
modifiers = ["market_access", "local_market_access", "free_building_levels", "local_distance_from_capital_speed_propagation"]



[dependencies]
parser = "../eu5-game-parser"
building_pipeline = "../eu5-building-pipeline"
orchestrator = "../eu5-mod-orchestrator"

[worldbuilder]
navigation_config = "config/river_navigation.json"
# Terrain look of the World Builder classes (biomes.txt + materials.txt, worldbuilder/biomes.py).
terrain_biomes = "config/terrain_biomes.toml"
# World Builder handover (EU5WorldBuilder `worldbuilder handover`); the constructor consumes this contract only.
handover = "../EU5WorldBuilder/artifacts/handover/latest"
# World Builder geography export (`worldbuilder geography-test` build), synced into the mod.
geography_export = "../EU5WorldBuilder/artifacts/geography_test/EU5 World Builder"
vanilla_baseline = "data/vanilla/locations_with_raw_material.parquet"
# Game-start development (main_menu/setup/1337/14_development.txt) = vanilla's rules evaluated by the constructor on
# "vanilla": the vanilla map (development as in a vanilla game; the 1.3.11 behaviour; Jan 2026-10-01: development is
# vanilla's), or "mod": the mod's map (World Builder classes scored like their vanilla parent, its rivers and harbours).
# Never save values (ppc worldbuilder development-check).
development_geography = "vanilla"
sync_geography = true
apply_on_build = true
level_limit = 20

# Hand-set flavour effects on the shore modifiers (pp_wb_coastal, pp_wb_lake), next to the fitted rows.
# Capacity and goods output stay with the World Builder fit; only other modifier types belong here.
[worldbuilder.flavour.pp_wb_lake]
local_migration_attraction = 0.3   # lakeshore settlement: fresh water, fish and easy transport
local_defensive = 0.1              # the lake works as a moat

[worldbuilder.buildings.map]
# World Builder ledger type -> blueprint key
clearing = "land_clearance"
management = "field_management"
water_supply = "irrigation_systems"
paddy_control = "irrigated_fields"
flood_bunds = "bund"
field_drainage = "field_drainage"
polders = "polders"
oasis_irrigation = "qanats"

[worldbuilder.buildings.niche]
# Culture- or country-locked capacity buildings. Each is a full REPLACE or new CREATE blueprint that
# shares the cap of a general family (levels of every member count against the same equation), is worth `strength` x
# the family's people per level, and keeps its lock (`lock` lines are ANDed into location_potential; country locks and
# advance unlocks stay in the blueprint).
khmer_baray = { family = "irrigation_systems", strength = 1.5, lock = ["dominant_culture ?= culture:khmer_culture"] }
incamisana = { family = "irrigation_systems", strength = 1.5 }
# Later tiers of field management, unlocked by advances. `upgrades` names the tier they replace (blueprint
# `obsolete`): each level built converts one level of it, so their cap leaves the lower tiers' levels out.
field_management_convertible = { family = "field_management", strength = 1.5, upgrades = "field_management" }
field_management_improved = { family = "field_management", strength = 2.0, upgrades = "field_management_convertible" }

# Song/Yuan-era Lower Yangzi improvements. Geography and local culture are checked both in game and at setup.
[worldbuilder.buildings.niche.jiangnan_canal_network]
family = "irrigated_fields"
strength = 2.5
place_at_start = true
gate = [
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], river_level = ["1","2","3","4","5"] },
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], is_adjacent_to_lake = ["True"] },
  { culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["suzhou_province","songjiang_province","jiaxing_province","huzhou_province","hangzhou_province","changzhou_province","zhenjiang_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["deltas","wetlands","floodplains"], is_coastal = ["True"] },
]

[worldbuilder.buildings.niche.jiangnan_hill_terraces]
family = "field_management"
strength = 3.0
place_at_start = true
gate = [{ culture = ["wu_culture","yue_wu_culture","wuzhou_culture","xuanzhou_culture","jixi_culture"], province = ["ningguo_province","huizhou_province","hangzhou_province","huzhou_province","jinhua_province","chuzhou_province","shaoxing_province","ningbo_province","taizhou_province"], climate = ["subtropical","subtropical_monsoon"], topography = ["hills","mountains","plateau","rolling"] }]

[worldbuilder.compat]
# Vanilla scripts that test specific climate/vegetation/topography classes. They are copied into the mod with every
# test of a vanilla parent class widened to its World Builder children (families from the export's
# geography_compatibility.json), regenerated from the current vanilla files on every apply. Whole-file overrides:
# keep this list to files where the tests matter for gameplay. Vanilla building files are listed only where a widened
# building is not already a REPLACE blueprint of the mod (sawmill, spiritual retreat, peasants hunting grounds, oma falaj).
# The goods files are not listed: EU5 1.4's goods location_potential (their only class tests) is removed by
# worldbuilder/raw_material_placement.py, which writes the same-name goods copies, and the Columbian exchange actions
# test the mod's own placement rules. Objects the mod REPLACEs need no widening in a copy, and a file whose widened
# objects are all replaced is not copied (unique_buildings.txt and columbian_exchange.txt in 1.4).
vanilla_files = [
  "in_game/common/scripted_triggers/location_triggers.txt",
  "in_game/common/scripted_triggers/goods_triggers.txt",
  "in_game/common/building_types/rural_buildings.txt",
  "in_game/common/building_types/unique_buildings.txt",
  "in_game/common/building_types/estate_buildings.txt",
  "in_game/common/building_types/event_only_buildings.txt",
  "in_game/common/diseases/malaria.txt",
  "in_game/common/diseases/bubonic_plague.txt",
  "in_game/common/diseases/great_pestilence.txt",
  "in_game/common/diseases/smallpox.txt",
  "in_game/common/diseases/influenza.txt",
  "in_game/common/generic_actions/columbian_exchange.txt",
  "in_game/common/generic_actions/italian_wars.txt",
  "in_game/common/insults/00_insults.txt",
  "in_game/events/estates/cossacks_estate_events.txt",
  "in_game/events/exploration/exploration_monthly_events.txt",
  "in_game/events/religion/pilgrimage_events.txt",
  "in_game/events/situations/little_ice_age.txt",
  "in_game/events/character/artist_events.txt",
  "in_game/events/DHE/flavor_plc.txt",
  "in_game/events/DHE/flavor_TUR.txt",
  "in_game/events/DHE/flavor_ICE.txt",
  "in_game/events/DHE/flavor_ETH.txt",
  "in_game/events/DHE/flavor_ENG.txt",
]

[worldbuilder.navigation_scripts]
# Vanilla scripts that route fleets over water (find_route, create_route from 1.4), put ships on the map or send an
# expedition along waypoints (add_new_waypoint, EU5 1.4: travel_mode = sea legs cross open water only). The navigable river channels
# are sea zones, so a river-bank location is is_coastal and can hold a port although most channel groups never
# reach the open sea; a route to such a location does not exist and the script fails at run time. Every vanilla file
# using these effects is listed here, patched (exact replacements on the current vanilla file, on top of its
# [worldbuilder.compat] widening) or reviewed with a reason; navigation_scripts.py fails the apply and
# tests/test_navigation_scripts.py fails on any vanilla file that is in neither list.
# The same lists carry the water access review: every vanilla file testing is_coastal / is_port is patched to the sea
# coast (pp_is_sea_coast, vanilla's meaning from before the channels) or reviewed as "any navigable water".
# Vanilla buildings that belong on the open sea get their location_potential narrowed to the sea coast (TRY_INJECT).
sea_only_buildings = [
  "pirate_stronghold", "pirate_haven", "black_market", "smuggler_cove", "brothel", "pirate_tavern",  # pirates
  "lazaretto",                                                 # quarantine for ships arriving from the sea
  "trade_company_harbor", "por_feitoria",                      # overseas trade posts
  "cinque_port", "north_sea_shipyards", "kilwan_shipwrights", "brethren_marsh",   # regional sea institutions
  "korean_gunnery_coastal_defense", "coastal_settlements",
]
