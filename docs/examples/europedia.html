hem back into food.\n\nWhere They Come From\nEvery farm, fishery, orchard, and other calorie building has a Provisioning slot. It provisions the province with the building's own crop, turning it into Local Food: more of it while the province store is low and less while it is full, when the land sends more of its crop to the goods market instead. Cookshop and Public Kitchen serve their dishes and drinks to the province as Local Food. Victuals come from the Grange, which packs the lasting part of a full province store at the province capital (packing goods waste less of the food), and from the Victualling Yard, which packs the grain shipped into a harbour. Exact conversion and method details are shown on the building tooltips. See Pp New Buildings for the building overview.\n\nTaverns, Granges and Victualling Yards\nTavern buys Victuals from the goods market and feeds the province with them. It earns more while the province store is low. Grange does the reverse: it packs the surplus of a well-stocked province into Victuals for the goods market, and the dearer victuals are, the more of the store it is willing to pack. In a harbour the Victualling Yard packs shipped-in grain instead and leaves the province store alone. Packing loses some of the food, so victuals that go out and come back always return less than they took.\n\nInternal Food Goods\nProvince Food Sales pays the Grange for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.","icon_texture":"gfx/interface/icons/trade_goods/icon_goods_victuals.dds","definition":{"key":"pp_victuals","file":"main_menu/common/game_concepts/pp_new_trade_goods.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_new_trade_goods.txt"},"links":["pp_new_buildings"],"body_html":"<h3>Two Food Goods<\/h3>\n<p>Prosper or Perish splits food into two goods.<\/p>\n<ul><li><strong><span class=\"token token-good\">Local Food<\/span><\/strong> is food eaten where it is made. It fills the province food store, feeds the province that produces it, and is never traded.<\/li><li><strong><span class=\"token token-good\">Victuals<\/span><\/strong> are preserved meals, provisions, and rations for civilians, armies, and navies. They keep and travel, so they are traded through the goods market. They only feed people once a province turns them back into food.<\/li><\/ul>\n<h3>Where They Come From<\/h3>\n<p>Every farm, fishery, orchard, and other calorie building has a Provisioning slot. It provisions the province with the building&#x27;s own crop, turning it into <span class=\"token token-good\">Local Food<\/span>: more of it while the province store is low and less while it is full, when the land sends more of its crop to the goods market instead. <span class=\"token token-building\">Cookshop<\/span> and <span class=\"token token-building\">Public Kitchen<\/span> serve their dishes and drinks to the province as <span class=\"token token-good\">Local Food<\/span>. <span class=\"token token-good\">Victuals<\/span> come from the <span class=\"token token-building\">Grange<\/span>, which packs the lasting part of a full province store at the province capital (packing goods waste less of the food), and from the <span class=\"token token-building\">Victualling Yard<\/span>, which packs the grain shipped into a harbour. Exact conversion and method details are shown on the building tooltips. See <a class=\"concept-link\" href=\"#pp-new-buildings\">P&amp;P: New Buildings<\/a> for the building overview.<\/p>\n<h3>Taverns, Granges and Victualling Yards<\/h3>\n<p><span class=\"token token-building\">Tavern<\/span> buys <span class=\"token token-good\">Victuals<\/span> from the goods market and feeds the province with them. It earns more while the province store is low. <span class=\"token token-building\">Grange<\/span> does the reverse: it packs the surplus of a well-stocked province into <span class=\"token token-good\">Victuals<\/span> for the goods market, and the dearer victuals are, the more of the store it is willing to pack. In a harbour the <span class=\"token token-building\">Victualling Yard<\/span> packs shipped-in grain instead and leaves the province store alone. Packing loses some of the food, so victuals that go out and come back always return less than they took.<\/p>\n<h3>Internal Food Goods<\/h3>\n<p><span class=\"token token-good\">Province Food Sales<\/span> pays the <span class=\"token token-building\">Grange<\/span> for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.<\/p>"},{"id":"pp-new-buildings","order":9,"filter":"new_buildings","filter_label":"New Buildings","concept_key":"pp_new_buildings","title_key":"game_concept_pp_new_buildings","body_key":"game_concept_pp_new_buildings_desc","title":"P&P: New Buildings","body_raw":"#T P&P Buildings#!\nProsper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.\n\n#T Food Buildings:#!\nFarms, fisheries, orchards, and other calorie buildings have a Provisioning slot: they feed their own province with their crop as [ShowGoodsName('local_food')|e], more while the province store is low and less while it is full. [ShowBuildingTypeName('cookshop')|e] cooks regional food goods into dishes and drinks it serves to the province as [ShowGoodsName('local_food')|e]; its upgrade [ShowBuildingTypeName('public_kitchen')|e] does the same at town scale. [ShowBuildingTypeName('tavern')|e] buys [ShowGoodsName('victuals')|e] from the goods market and feeds the province with them, and [ShowBuildingTypeName('victualling_yard')|e] packs a full province store into [ShowGoodsName('victuals')|e] for the goods market.\n\n#T Non-Farming Raw Goods:#!\nNon-farming raw-good buildings, such as [ShowBuildingTypeName('iron_mine')|e], usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.\n\nMany deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.\n\nSome buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt [population_growth|e] because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.\n\n#T Agriculture:#!\nAgricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.\n\nFor whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see [pp_farm_capacity|e]. For how productive they are, see [pp_farm_output|e].","body_plain":"P&P Buildings\nProsper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.\n\nFood Buildings:\nFarms, fisheries, orchards, and other calorie buildings have a Provisioning slot: they feed their own province with their crop as Local Food, more while the province store is low and less while it is full. Cookshop cooks regional food goods into dishes and drinks it serves to the province as Local Food; its upgrade Public Kitchen does the same at town scale. Tavern buys Victuals from the goods market and feeds the province with them, and Victualling Yard packs a full province store into Victuals for the goods market.\n\nNon-Farming Raw Goods:\nNon-farming raw-good buildings, such as Iron Mine, usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.\n\nMany deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.\n\nSome buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt Population Growth because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.\n\nAgriculture:\nAgricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.\n\nFor whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see Pp Farm Capacity. For how productive they are, see Pp Farm Output.","icon_texture":"gfx/interface/icons/flat_icons/balance/buildings_abroad.dds","definition":{"key":"pp_new_buildings","file":"main_menu/common/game_concepts/pp_new_buildings.txt","line":2,"family":"food","texture":"flat_icons/balance/buildings_abroad","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_new_buildings.txt"},"links":["population_growth","pp_farm_capacity","pp_farm_output"],"body_html":"<h3>P&amp;P Buildings<\/h3>\n<p>Prosper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.<\/p>\n<h3>Food Buildings:<\/h3>\n<p>Farms, fisheries, orchards, and other calorie buildings have a Provisioning slot: they feed their own province with their crop as <span class=\"token token-good\">Local Food<\/span>, more while the province store is low and less while it is full. <span class=\"token token-building\">Cookshop<\/span> cooks regional food goods into dishes and drinks it serves to the province as <span class=\"token token-good\">Local Food<\/span>; its upgrade <span class=\"token token-building\">Public Kitchen<\/span> does the same at town scale. <span class=\"token token-building\">Tavern<\/span> buys <span class=\"token token-good\">Victuals<\/span> from the goods market and feeds the province with them, and <span class=\"token token-building\">Victualling Yard<\/span> packs a full province store into <span class=\"token token-good\">Victuals<\/span> for the goods market.<\/p>\n<h3>Non-Farming Raw Goods:<\/h3>\n<p>Non-farming raw-good buildings, such as <span class=\"token token-building\">Iron Mine<\/span>, usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.<\/p>\n<p>Many deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.<\/p>\n<p>Some buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt <span class=\"concept-ref\">Population Growth<\/span> because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.<\/p>\n<h3>Agriculture:<\/h3>\n<p>Agricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.<\/p>\n<p>For whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see <a class=\"concept-link\" href=\"#pp-farm-capacity\">P&amp;P: Farming/Fishing/Forest Capacities<\/a>. For how productive they are, see <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>.<\/p>"},{"id":"pp-building-limits","order":10,"filter":"building_limits","filter_label":"Building Limits","concept_key":"pp_building_limits","title_key":"game_concept_pp_building_limits","body_key":"game_concept_pp_building_limits_desc","title":"Building Limits","body_raw":"#T Building Limits#!\nEvery location has a number of building levels it can supply easily, depending on vegetation, topography, rivers, coasts, roads, rank, development and more.\n\nYou can still overbuild. Every level above that number gives the location [ShowModifier('unsupported_building_levels')]: its goods reach the market worse, so its [market_access|e] drops. Use the Unsupported Building Levels map mode to find the places that need help.\n\n#T Logistics Buildings#!\nLogistics buildings carry a place's goods to its market. Each level raises [market_access|e] and pays its workers a steady wage in [ShowGoodsName('logistics')]; in exchange a little output of heavy goods such as stone, ores, salt and timber is lost to the haulage. They can only be built where market access is still poor and enough buildings already stand to need them. Build the one that fits the place:\n\n$BULLET$ [ShowBuildingTypeName('river_boatmen_yard')|e] on rivers. Big rivers take more of them.\n$BULLET$ [ShowBuildingTypeName('coastal_shipping_office')|e] in ports. Natural harbors take more of them.\n$BULLET$ [ShowBuildingTypeName('transport_office')|e] in cities and developed towns.\n$BULLET$ [ShowBuildingTypeName('carrier_inn')|e] in rural settlements and towns with roads.\n$BULLET$ Where the land has its own carriers, they take the carrier inn's place: the [ShowBuildingTypeName('pp_caravanserai')|e] in the dry lands from the Maghreb to Central Asia, the [ShowBuildingTypeName('pp_oasis_caravan_station')|e] in the Sahara and the Sahel, the [ShowBuildingTypeName('pp_yam_station')|e] from Russia to Mongolia, the [ShowBuildingTypeName('pp_banjara_tanda')|e] in South Asia and the [ShowBuildingTypeName('pp_llama_caravan_post')|e] in the Andes. They need no road.\n\nBig rivers, ports and cities are easy to supply. Landlocked jungle is not. If a place is red on the map mode, build logistics there before you keep stacking industry.","body_plain":"Building Limits\nEvery location has a number of building levels it can supply easily, depending on vegetation, topography, rivers, coasts, roads, rank, development and more.\n\nYou can still overbuild. Every level above that number gives the location Unsupported Building Levels: its goods reach the market worse, so its Market Access drops. Use the Unsupported Building Levels map mode to find the places that need help.\n\nLogistics Buildings\nLogistics buildings carry a place's goods to its market. Each level raises Market Access and pays its workers a steady wage in Logistics; in exchange a little output of heavy goods such as stone, ores, salt and timber is lost to the haulage. They can only be built where market access is still poor and enough buildings already stand to need them. Build the one that fits the place:\n\n-  River Boatmen Yard on rivers. Big rivers take more of them.\n-  Coastal Shipping Office in ports. Natural harbors take more of them.\n-  Transport Office in cities and developed towns.\n-  Carrier Inn in rural settlements and towns with roads.\n-  Where the land has its own carriers, they take the carrier inn's place: the Pp Caravanserai in the dry lands from the Maghreb to Central Asia, the Pp Oasis Caravan Station in the Sahara and the Sahel, the Pp Yam Station from Russia to Mongolia, the Pp Banjara Tanda in South Asia and the Pp Llama Caravan Post in the Andes. They need no road.\n\nBig rivers, ports and cities are easy to supply. Landlocked jungle is not. If a place is red on the map mode, build logistics there before you keep stacking industry.","icon_texture":"gfx/interface/icons/flat_icons/balance/buildings_abroad.dds","definition":{"key":"pp_building_limits","file":"main_menu/common/game_concepts/pp_building_limits.txt","line":2,"family":"food","texture":"flat_icons/balance/buildings_abroad","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_building_limits.txt"},"links":["market_access"],"body_html":"<h3>Building Limits<\/h3>\n<p>Every location has a number of building levels it can supply easily, depending on vegetation, topography, rivers, coasts, roads, rank, development and more.<\/p>\n<p>You can still overbuild. Every level above that number gives the location <span class=\"token token-modifier\">Unsupported Building Levels<\/span>: its goods reach the market worse, so its <span class=\"concept-ref\">Market Access<\/span> drops. Use the Unsupported Building Levels map mode to find the places that need help.<\/p>\n<h3>Logistics Buildings<\/h3>\n<p>Logistics buildings carry a place&#x27;s goods to its market. Each level raises <span class=\"concept-ref\">Market Access<\/span> and pays its workers a steady wage in <span class=\"token token-good\">Logistics<\/span>; in exchange a little output of heavy goods such as stone, ores, salt and timber is lost to the haulage. They can only be built where market access is still poor and enough buildings already stand to need them. Build the one that fits the place:<\/p>\n<ul><li><span class=\"token token-building\">River Boatmen Yard<\/span> on rivers. Big rivers take more of them.<\/li><li><span class=\"token token-building\">Coastal Shipping Office<\/span> in ports. Natural harbors take more of them.<\/li><li><span class=\"token token-building\">Transport Office<\/span> in cities and developed towns.<\/li><li><span class=\"token token-building\">Carrier Inn<\/span> in rural settlements and towns with roads.<\/li><li>Where the land has its own carriers, they take the carrier inn&#x27;s place: the <span class=\"token token-building\">Pp Caravanserai<\/span> in the dry lands from the Maghreb to Central Asia, the <span class=\"token token-building\">Pp Oasis Caravan Station<\/span> in the Sahara and the Sahel, the <span class=\"token token-building\">Pp Yam Station<\/span> from Russia to Mongolia, the <span class=\"token token-building\">Pp Banjara Tanda<\/span> in South Asia and the <span class=\"token token-building\">Pp Llama Caravan Post<\/span> in the Andes. They need no road.<\/li><\/ul>\n<p>Big rivers, ports and cities are easy to supply. Landlocked jungle is not. If a place is red on the map mode, build logistics there before you keep stacking industry.<\/p>"},{"id":"pp-farm-capacity","order":11,"filter":"farm_capacity","filter_label":"Rural Capacities","concept_key":"pp_farm_capacity","title_key":"game_concept_pp_farm_capacity","body_key":"game_concept_pp_farm_capacity_desc","title":"P&P: Farming/Fishing/Forest Capacities","body_raw":"Farming, Fishing, and Forest Capacities are about how many rural raw-material building levels a location can sustain, not how much each building produces. For productivity, see [pp_farm_output|e]. Exact current values are shown in the relevant building and map-mode tooltips.\n\nThe Farming Capacity, Fishing Capacity, and Forest Capacity map modes are in the Geography map-mode group.\n\n#T Farming Capacity:#!\nThis pool governs the crop farms such as [ShowBuildingTypeName('wheat_farm')|e] and [ShowBuildingTypeName('wheat_model_farm')|e], orchards, animal farms, plantations, groves, gardens, sericulture farms, simplers groves, and vineyard estates.\n\nFarming Capacity is one current sum. Local farming suitability, matching agricultural RGOs, Maximum RGO Size, [pp_population_capacity|e], location rank, river size, Manorial Customals, irrigation and water-control buildings, existing farming-capacity buildings, and building levels in the location can all add or subtract from it.\n\n#T Fishing Capacity:#!\nThis pool governs [ShowBuildingTypeName('fishing_village')|e], [ShowBuildingTypeName('net_curing_yard')|e], [ShowBuildingTypeName('ocean_fishery')|e], [ShowBuildingTypeName('drift_net_fishery')|e], and [ShowBuildingTypeName('offshore_fishery')|e]. It does not govern [ShowBuildingTypeName('pearl_fishery')|e].\n\nFishing Capacity is one current sum. Coasts, lakes, wetlands, fish RGOs, Maximum RGO Size, river size, Manorial Customals, and existing fish-producing buildings can all add or subtract from it.\n\n#T Forest Capacity:#!\nThis pool governs [ShowBuildingTypeName('forest_village')|e], [ShowBuildingTypeName('managed_forest_village')|e], [ShowBuildingTypeName('lumber_mill')|e], [ShowBuildingTypeName('water_sawmill')|e], and [ShowBuildingTypeName('lumber_mill_improved')|e].\n\nForest Capacity is one current sum. Forest geography, relevant RGOs, Maximum RGO Size, location rank, Manorial Customals, existing forest and lumber buildings, and building levels in the location can all add or subtract from it.\n\nThe building maximum-level tooltip and the matching capacity map mode show the same current value. The maximum-level tooltip lists the active sources that add or subtract capacity.\n\n#T Other Raw Material Buildings:#!\nOther raw material producing buildings, such as mines, quarries, saltworks, pearl fisheries, charcoal makers, ivory hunting camps, and similar buildings, do not use the three shared pools above. Their maximum level is governed by Rural Building Capacity.\n\nRural Building Capacity is a simpler cap influenced by the location's basic rural allowance, development, Maximum RGO Size, and river access.\n\n#T Building order:#!\nIf a building type ends up well above its available capacity, the system can trim excess rural building levels over time. There is no lasting benefit to building around the limit.","body_plain":"Farming, Fishing, and Forest Capacities are about how many rural raw-material building levels a location can sustain, not how much each building produces. For productivity, see Pp Farm Output. Exact current values are shown in the relevant building and map-mode tooltips.\n\nThe Farming Capacity, Fishing Capacity, and Forest Capacity map modes are in the Geography map-mode group.\n\nFarming Capacity:\nThis pool governs the crop farms such as Wheat Farm and Wheat Model Farm, orchards, animal farms, plantations, groves, gardens, sericulture farms, simplers groves, and vineyard estates.\n\nFarming Capacity is one current sum. Local farming suitability, matching agricultural RGOs, Maximum RGO Size, Pp Population Capacity, location rank, river size, Manorial Customals, irrigation and water-control buildings, existing farming-capacity buildings, and building levels in the location can all add or subtract from it.\n\nFishing Capacity:\nThis pool governs Fishing Village, Net Curing Yard, Ocean Fishery, Drift Net Fishery, and Offshore Fishery. It does not govern Pearl Fishery.\n\nFishing Capacity is one current sum. Coasts, lakes, wetlands, fish RGOs, Maximum RGO Size, river size, Manorial Customals, and existing fish-producing buildings can all add or subtract from it.\n\nForest Capacity:\nThis pool governs Forest Village, Managed Forest Village, Lumber Mill, Water Sawmill, and Lumber Mill Improved.\n\nForest Capacity is one current sum. Forest geography, relevant RGOs, Maximum RGO Size, location rank, Manorial Customals, existing forest and lumber buildings, and building levels in the location can all add or subtract from it.\n\nThe building maximum-level tooltip and the matching capacity map mode show the same current value. The maximum-level tooltip lists the active sources that add or subtract capacity.\n\nOther Raw Material Buildings:\nOther raw material producing buildings, such as mines, quarries, saltworks, pearl fisheries, charcoal makers, ivory hunting camps, and similar buildings, do not use the three shared pools above. Their maximum level is governed by Rural Building Capacity.\n\nRural Building Capacity is a simpler cap influenced by the location's basic rural allowance, development, Maximum RGO Size, and river access.\n\nBuilding order:\nIf a building type ends up well above its available capacity, the system can trim excess rural building levels over time. There is no lasting benefit to building around the limit.","icon_texture":"gfx/interface/icons/buildings/wheat_farm.dds","definition":{"key":"pp_farm_capacity","file":"main_menu/common/game_concepts/pp_farm_capacity.txt","line":2,"family":"food","texture":"map_modes/pp_farming_village_capacity","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_farm_capacity.txt"},"links":["pp_farm_output","pp_population_capacity"],"body_html":"<p>Farming, Fishing, and Forest Capacities are about how many rural raw-material building levels a location can sustain, not how much each building produces. For productivity, see <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>. Exact current values are shown in the relevant building and map-mode tooltips.<\/p>\n<p>The Farming Capacity, Fishing Capacity, and Forest Capacity map modes are in the Geography map-mode group.<\/p>\n<h3>Farming Capacity:<\/h3>\n<p>This pool governs the crop farms such as <span class=\"token token-building\">Wheat Farm<\/span> and <span class=\"token token-building\">Wheat Model Farm<\/span>, orchards, animal farms, plantations, groves, gardens, sericulture farms, simplers groves, and vineyard estates.<\/p>\n<p>Farming Capacity is one current sum. Local farming suitability, matching agricultural RGOs, Maximum RGO Size, <span class=\"concept-ref\">Pp Population Capacity<\/span>, location rank, river size, Manorial Customals, irrigation and water-control buildings, existing farming-capacity buildings, and building levels in the location can all add or subtract from it.<\/p>\n<h3>Fishing Capacity:<\/h3>\n<p>This pool governs <span class=\"token token-building\">Fishing Village<\/span>, <span class=\"token token-building\">Net Curing Yard<\/span>, <span class=\"token token-building\">Ocean Fishery<\/span>, <span class=\"token token-building\">Drift Net Fishery<\/span>, and <span class=\"token token-building\">Offshore Fishery<\/span>. It does not govern <span class=\"token token-building\">Pearl Fishery<\/span>.<\/p>\n<p>Fishing Capacity is one current sum. Coasts, lakes, wetlands, fish RGOs, Maximum RGO Size, river size, Manorial Customals, and existing fish-producing buildings can all add or subtract from it.<\/p>\n<h3>Forest Capacity:<\/h3>\n<p>This pool governs <span class=\"token token-building\">Forest Village<\/span>, <span class=\"token token-building\">Managed Forest Village<\/span>, <span class=\"token token-building\">Lumber Mill<\/span>, <span class=\"token token-building\">Water Sawmill<\/span>, and <span class=\"token token-building\">Lumber Mill Improved<\/span>.<\/p>\n<p>Forest Capacity is one current sum. Forest geography, relevant RGOs, Maximum RGO Size, location rank, Manorial Customals, existing forest and lumber buildings, and building levels in the location can all add or subtract from it.<\/p>\n<p>The building maximum-level tooltip and the matching capacity map mode show the same current value. The maximum-level tooltip lists the active sources that add or subtract capacity.<\/p>\n<h3>Other Raw Material Buildings:<\/h3>\n<p>Other raw material producing buildings, such as mines, quarries, saltworks, pearl fisheries, charcoal makers, ivory hunting camps, and similar buildings, do not use the three shared pools above. Their maximum level is governed by Rural Building Capacity.<\/p>\n<p>Rural Building Capacity is a simpler cap influenced by the location&#x27;s basic rural allowance, development, Maximum RGO Size, and river access.<\/p>\n<h3>Building order:<\/h3>\n<p>If a building type ends up well above its available capacity, the system can trim excess rural building levels over time. There is no lasting benefit to building around the limit.<\/p>"},{"id":"pp-farm-output","order":12,"filter":"farm_output","filter_label":"Building Output","concept_key":"pp_farm_output","title_key":"game_concept_pp_farm_output","body_key":"game_concept_pp_farm_output_desc","title":"P&P: Building Output","body_raw":"This entry is about how much rural raw-material buildings produce—their productivity—not how many you can build. For quantity, see [pp_farm_capacity|e].\n\nOver Europa Universalis 5's timeframe, rural productivity rose sharply. The mod reflects this by replacing vanilla's flat food modifier with per-good output modifiers. Each raw material can now gain or lose output independently.\n\nBuilding Output is affected by both inert and dynamic factors. Any of these can be beneficial or detrimental.\n\n#T Component one:#!\nDynamic factors that change over the game. Some regions or countries may gain access to productivity improvements earlier or later than others:\n\n$BULLET$ Advances\n$BULLET$ Societal choices\n$BULLET$ Development\n$BULLET$ Government reforms\n$BULLET$ [ShowBuildingTypeName('irrigation_systems')|e]\n\n#T Component two:#!\nInert factors tied to geography and location. Every location has a unique set of local output modifiers estimated from historical and geographic evidence:\n\n$BULLET$ Rainfall and water availability\n$BULLET$ Soil quality\n$BULLET$ Climate\n$BULLET$ Topography\n$BULLET$ Vegetation\n$BULLET$ The location's RGO\n\n#T Harvest:#!\nYearly harvest outcomes vary by region and can further boost or reduce agricultural output beyond the factors above. For full details on harvest levels and how they affect food production, see [pp_variable_harvests|e].","body_plain":"This entry is about how much rural raw-material buildings produce—their productivity—not how many you can build. For quantity, see Pp Farm Capacity.\n\nOver Europa Universalis 5's timeframe, rural productivity rose sharply. The mod reflects this by replacing vanilla's flat food modifier with per-good output modifiers. Each raw material can now gain or lose output independently.\n\nBuilding Output is affected by both inert and dynamic factors. Any of these can be beneficial or detrimental.\n\nComponent one:\nDynamic factors that change over the game. Some regions or countries may gain access to productivity improvements earlier or later than others:\n\n-  Advances\n-  Societal choices\n-  Development\n-  Government reforms\n-  Irrigation Systems\n\nComponent two:\nInert factors tied to geography and location. Every location has a unique set of local output modifiers estimated from historical and geographic evidence:\n\n-  Rainfall and water availability\n-  Soil quality\n-  Climate\n-  Topography\n-  Vegetation\n-  The location's RGO\n\nHarvest:\nYearly harvest outcomes vary by region and can further boost or reduce agricultural output beyond the factors above. For full details on harvest levels and how they affect food production, see Pp Variable Harvests.","icon_texture":"gfx/interface/icons/modifier_types/wheat_positive.dds","definition":{"key":"pp_farm_output","file":"main_menu/common/game_concepts/pp_farm_output.txt","line":2,"family":"food","texture":"modifier_types/wheat_positive","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_farm_output.txt"},"links":["pp_farm_capacity","pp_variable_harvests"],"body_html":"<p>This entry is about how much rural raw-material buildings produce—their productivity—not how many you can build. For quantity, see <a class=\"concept-link\" href=\"#pp-farm-capacity\">P&amp;P: Farming/Fishing/Forest Capacities<\/a>.<\/p>\n<p>Over Europa Universalis 5&#x27;s timeframe, rural productivity rose sharply. The mod reflects this by replacing vanilla&#x27;s flat food modifier with per-good output modifiers. Each raw material can now gain or lose output independently.<\/p>\n<p>Building Output is affected by both inert and dynamic factors. Any of these can be beneficial or detrimental.<\/p>\n<h3>Component one:<\/h3>\n<p>Dynamic factors that change over the game. Some regions or countries may gain access to productivity improvements earlier or later than others:<\/p>\n<ul><li>Advances<\/li><li>Societal choices<\/li><li>Development<\/li><li>Government reforms<\/li><li><span class=\"token token-building\">Irrigation Systems<\/span><\/li><\/ul>\n<h3>Component two:<\/h3>\n<p>Inert factors tied to geography and location. Every location has a unique set of local output modifiers estimated from historical and geographic evidence:<\/p>\n<ul><li>Rainfall and water availability<\/li><li>Soil quality<\/li><li>Climate<\/li><li>Topography<\/li><li>Vegetation<\/li><li>The location&#x27;s RGO<\/li><\/ul>\n<h3>Harvest:<\/h3>\n<p>Yearly harvest outcomes vary by region and can further boost or reduce agricultural output beyond the factors above. For full details on harvest levels and how they affect food production, see <a class=\"concept-link\" href=\"#pp-variable-harvests\">P&amp;P: Variable Harvests<\/a>.<\/p>"},{"id":"pp-variable-harvests","order":13,"filter":"harvest","filter_label":"Variable Harvests","concept_key":"pp_variable_harvests","title_key":"game_concept_pp_variable_harvests","body_key":"game_concept_pp_variable_harvests_desc","title":"P&P: Variable Harvests","body_raw":"Every September each [region|e] learns what its fields will give for the year ahead. Most years are ordinary. A bad one shrinks the crops and the surplus of the villages; a good one does the opposite. Neighbouring regions tend to share their luck, and lean or fat years can come in runs.\n\n#T A Harvest Year#!\n\n#T Every September#!\n\nThe harvest is settled once a year, for every [region|e] at the same time, and holds until the next September.\n\n#T Broad Harvest Area#!\n\nThe map is split into broad areas such as Western Europe or South Asia. Each first draws its season: kind, ordinary or harsh.\n\n#T Each Region#!\n\nEvery [region|e] of the area then draws its own harvest. The season tilts the odds, and so does the region's last harvest.\n\n#T Harvest Modifier#!\n\nThe harvest lands on every [location|e] of the region as a [location_modifier|e] named after its area. An average year adds none.\n\n#T Lean Years and Fat Years#!\n\n[abysmal_harvest|e] · [very_poor_harvest|e] · [poor_harvest|e] · [average_harvest|e] · [good_harvest|e] · [very_good_harvest|e] · [bountiful_harvest|e]\n\nHover a harvest to see its modifier in every broad harvest area, then hover an area for the exact effects. Average is the most common harvest and the ends of the scale are the rarest. Each region leans toward its own last harvest: a harsh season after a bad year makes another bad year likelier still, while a harsh season after a good year only brings the odds back to ordinary. Kind seasons work the same way in the other direction.\n\n#T What a Harvest Changes#!\n\nA harvest moves two things in its locations: how much the fields yield and how much surplus the villages have to spare. Each crop swings by how sensitive it is and by how widely its broad area grows it: where it is a main crop it swings at full strength, where it is grown only here and there it swings less. Hover a good for its name.\n\n#T Grain and rice#!\nswing the most\n\n#T Field, orchard and plantation crops#!\nswing less\n\n#T Hardy goods#!\nbarely move\n\n#T Herds, flocks, fish and game#!\nare spared\n\nThe [ShowPopTypeName('peasants')] live off their own plots first. A bad year leaves those plots less surplus for the province, a good year more; the harvest modifier shows this as peasant food consumption. A bad harvest therefore strikes twice: smaller crops and less to spare from the villages.\n\n#T Where to See It#!\n\n$BULLET$ #T The map:#! the Variable Harvests [situation|e] colours every location by this year's harvest, dark for bad years and bright for good ones, and stripes starving provinces.\n$BULLET$ #T The location view:#! the harvest chip at the top right shows the location's harvest as the medallions above; hover it for every effect.\n$BULLET$ #T The modifier:#! the harvest modifier in the location's modifier list names its broad area and lists its effects.\n$BULLET$ #T The game rule:#! Variable Harvests can be switched off when a campaign starts.","body_plain":"Every September each Region learns what its fields will give for the year ahead. Most years are ordinary. A bad one shrinks the crops and the surplus of the villages; a good one does the opposite. Neighbouring regions tend to share their luck, and lean or fat years can come in runs.\n\nA Harvest Year\n\nEvery September\n\nThe harvest is settled once a year, for every Region at the same time, and holds until the next September.\n\nBroad Harvest Area\n\nThe map is split into broad areas such as Western Europe or South Asia. Each first draws its season: kind, ordinary or harsh.\n\nEach Region\n\nEvery Region of the area then draws its own harvest. The season tilts the odds, and so does the region's last harvest.\n\nHarvest Modifier\n\nThe harvest lands on every Location of the region as a Location Modifier named after its area. An average year adds none.\n\nLean Years and Fat Years\n\nAbysmal Harvest · Very Poor Harvest · Poor Harvest · Average Harvest · Good Harvest · Very Good Harvest · Bountiful Harvest\n\nHover a harvest to see its modifier in every broad harvest area, then hover an area for the exact effects. Average is the most common harvest and the ends of the scale are the rarest. Each region leans toward its own last harvest: a harsh season after a bad year makes another bad year likelier still, while a harsh season after a good year only brings the odds back to ordinary. Kind seasons work the same way in the other direction.\n\nWhat a Harvest Changes\n\nA harvest moves two things in its locations: how much the fields yield and how much surplus the villages have to spare. Each crop swings by how sensitive it is and by how widely its broad area grows it: where it is a main crop it swings at full strength, where it is grown only here and there it swings less. Hover a good for its name.\n\nGrain and rice\nswing the most\n\nField, orchard and plantation crops\nswing less\n\nHardy goods\nbarely move\n\nHerds, flocks, fish and game\nare spared\n\nThe Peasants live off their own plots first. A bad year leaves those plots less surplus for the province, a good year more; the harvest modifier shows this as peasant food consumption. A bad harvest therefore strikes twice: smaller crops and less to spare from the villages.\n\nWhere to See It\n\n-  The map: the Variable Harvests Situation colours every location by this year's harvest, dark for bad years and bright for good ones, and stripes starving provinces.\n-  The location view: the harvest chip at the top right shows the location's harvest as the medallions above; hover it for every effect.\n-  The modifier: the harvest modifier in the location's modifier list names its broad area and lists its effects.\n-  The game rule: Variable Harvests can be switched off when a campaign starts.","icon_texture":"gfx/interface/icons/alerts_icons/weather_system.dds","definition":{"key":"pp_variable_harvests","file":"main_menu/common/game_concepts/pp_variable_harvests.txt","line":2,"family":null,"texture":"alerts_icons/weather_system","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_variable_harvests.txt"},"links":["abysmal_harvest","average_harvest","bountiful_harvest","good_harvest","location","location_modifier","poor_harvest","region","situation","very_good_harvest","very_poor_harvest"],"body_html":"<p>Every September each <span class=\"concept-ref\">Region<\/span> learns what its fields will give for the year ahead. Most years are ordinary. A bad one shrinks the crops and the surplus of the villages; a good one does the opposite. Neighbouring regions tend to share their luck, and lean or fat years can come in runs.<\/p>\n<h3>A Harvest Year<\/h3>\n<h3>Every September<\/h3>\n<p>The harvest is settled once a year, for every <span class=\"concept-ref\">Region<\/span> at the same time, and holds until the next September.<\/p>\n<h3>Broad Harvest Area<\/h3>\n<p>The map is split into broad areas such as Western Europe or South Asia. Each first draws its season: kind, ordinary or harsh.<\/p>\n<h3>Each Region<\/h3>\n<p>Every <span class=\"concept-ref\">Region<\/span> of the area then draws its own harvest. The season tilts the odds, and so does the region&#x27;s last harvest.<\/p>\n<h3>Harvest Modifier<\/h3>\n<p>The harvest lands on every <span class=\"concept-ref\">Location<\/span> of the region as a <span class=\"concept-ref\">Location Modifier<\/span> named after its area. An average year adds none.<\/p>\n<h3>Lean Years and Fat Years<\/h3>\n<p><span class=\"concept-ref\">Abysmal Harvest<\/span> · <span class=\"concept-ref\">Very Poor Harvest<\/span> · <span class=\"concept-ref\">Poor Harvest<\/span> · <span class=\"concept-ref\">Average Harvest<\/span> · <span class=\"concept-ref\">Good Harvest<\/span> · <span class=\"concept-ref\">Very Good Harvest<\/span> · <span class=\"concept-ref\">Bountiful Harvest<\/span><\/p>\n<p>Hover a harvest to see its modifier in every broad harvest area, then hover an area for the exact effects. Average is the most common harvest and the ends of the scale are the rarest. Each region leans toward its own last harvest: a harsh season after a bad year makes another bad year likelier still, while a harsh season after a good year only brings the odds back to ordinary. Kind seasons work the same way in the other direction.<\/p>\n<h3>What a Harvest Changes<\/h3>\n<p>A harvest moves two things in its locations: how much the fields yield and how much surplus the villages have to spare. Each crop swings by how sensitive it is and by how widely its broad area grows it: where it is a main crop it swings at full strength, where it is grown only here and there it swings less. Hover a good for its name.<\/p>\n<h3>Grain and rice<\/h3>\n<p>swing the most<\/p>\n<h3>Field, orchard and plantation crops<\/h3>\n<p>swing less<\/p>\n<h3>Hardy goods<\/h3>\n<p>barely move<\/p>\n<h3>Herds, flocks, fish and game<\/h3>\n<p>are spared<\/p>\n<p>The <span class=\"token token-pop\">Peasants<\/span> live off their own plots first. A bad year leaves those plots less surplus for the province, a good year more; the harvest modifier shows this as peasant food consumption. A bad harvest therefore strikes twice: smaller crops and less to spare from the villages.<\/p>\n<h3>Where to See It<\/h3>\n<ul><li><strong>The map:<\/strong> the Variable Harvests <span class=\"concept-ref\">Situation<\/span> colours every location by this year&#x27;s harvest, dark for bad years and bright for good ones, and stripes starving provinces.<\/li><li><strong>The location view:<\/strong> the harvest chip at the top right shows the location&#x27;s harvest as the medallions above; hover it for every effect.<\/li><li><strong>The modifier:<\/strong> the harvest modifier in the location&#x27;s modifier list names its broad area and lists its effects.<\/li><li><strong>The game rule:<\/strong> Variable Harvests can be switched off when a campaign starts.<\/li><\/ul>"},{"id":"pp-arable-land","order":14,"filter":"pop_capacity","filter_label":"Arable Land","concept_key":"pp_arable_land","title_key":"game_concept_pp_arable_land","body_key":"game_concept_pp_arable_land_desc","title":"P&P: Arable Land","body_raw":"Arable Land is what a location's fields, pastures and waters can feed, counted in people rather than acres. Its people live on it, farms take their share of it, and land improvements win more of it. What matters is how full it is: free land lets a location thrive, crowded land holds it back.\n\n#T Where Arable Land Comes From#!\n\n#T The Land Itself#!\n\n[climate|e], [vegetation|e], [topography|e], soil, fertility, rivers and coasts decide what the land can feed. Fertile river valleys feed many, deserts and mountains few.\n\n#T Land Improvements#!\n\nClearing, draining, irrigating and terracing win new land. How far a location can be improved depends on its geography and grows with its [development|e].\n\n#T Work in Town#!\n\nWhoever works in a [building|e] no longer works a plot of their own, so each building gives back part of its workers' land: workshops and town quarters much, mines and forts little.\n\n#T Land improvements#!\neach where the land suits it\n\n#T What Uses It#!\n\n#T People#!\n\nEvery [pop|e] lives on the land, townsfolk as much as peasants. A growing town fills its land quickly unless its buildings give land back.\n\n#T Farms#!\n\nEach farm level takes a fixed share of land, larger farms a larger share. A location holds only as many farms as its land has room for, and a little always stays untouched. Farms do not wait for people to leave: built on crowded land, they crowd it further.\n\n#T Reserved Grounds#!\n\nHunting grounds, royal forests and gardens, great enclosures and cattle pens keep land for their owners and away from the people.\n\n#T Free Land and Crowding#!\n\n[Concept('pp_abundant_free_land', 'Abundant Free Land')|e] · [Concept('pp_available_free_land', 'Available Free Land')|e] · [Concept('pp_settled_land', 'Settled Land')|e] · [Concept('pp_overpopulation', 'Overpopulation')|e]\n\nA location's state follows how full its land is; hover one for its effects. Free land lets settlers pick the best ground: rural goods yield more, the villages have more to spare, newcomers are drawn in, and on nearly empty land people also live off what they gather. Tribes grow only while land is free. The bonuses fade as the land fills. Past full the location is overpopulated, and that weighs heavier the further people outnumber the land.\n\n#T Where to See It#!\n\n$BULLET$ #T The location view:#! the land chip at the top right shows the location's state; hover it for every effect at its current strength. Hover the location's arable land for every source that adds to it or takes from it.\n$BULLET$ #T The map:#! the arable land map mode in the Population group colours every location by its land.\n$BULLET$ #T Farms:#! a farm's level tooltip shows the land free for it and the land the other farms already use.","body_plain":"Arable Land is what a location's fields, pastures and waters can feed, counted in people rather than acres. Its people live on it, farms take their share of it, and land improvements win more of it. What matters is how full it is: free land lets a location thrive, crowded land holds it back.\n\nWhere Arable Land Comes From\n\nThe Land Itself\n\nClimate, Vegetation, Topography, soil, fertility, rivers and coasts decide what the land can feed. Fertile river valleys feed many, deserts and mountains few.\n\nLand Improvements\n\nClearing, draining, irrigating and terracing win new land. How far a location can be improved depends on its geography and grows with its Development.\n\nWork in Town\n\nWhoever works in a Building no longer works a plot of their own, so each building gives back part of its workers' land: workshops and town quarters much, mines and forts little.\n\nLand improvements\neach where the land suits it\n\nWhat Uses It\n\nPeople\n\nEvery Pop lives on the land, townsfolk as much as peasants. A growing town fills its land quickly unless its buildings give land back.\n\nFarms\n\nEach farm level takes a fixed share of land, larger farms a larger share. A location holds only as many farms as its land has room for, and a little always stays untouched. Farms do not wait for people to leave: built on crowded land, they crowd it further.\n\nReserved Grounds\n\nHunting grounds, royal forests and gardens, great enclosures and cattle pens keep land for their owners and away from the people.\n\nFree Land and Crowding\n\n[Concept('pp_abundant_free_land', 'Abundant Free Land')|e] · [Concept('pp_available_free_land', 'Available Free Land')|e] · [Concept('pp_settled_land', 'Settled Land')|e] · [Concept('pp_overpopulation', 'Overpopulation')|e]\n\nA location's state follows how full its land is; hover one for its effects. Free land lets settlers pick the best ground: rural goods yield more, the villages have more to spare, newcomers are drawn in, and on nearly empty land people also live off what they gather. Tribes grow only while land is free. The bonuses fade as the land fills. Past full the location is overpopulated, and that weighs heavier the further people outnumber the land.\n\nWhere to See It\n\n-  The location view: the land chip at the top right shows the location's state; hover it for every effect at its current strength. Hover the location's arable land for every source that adds to it or takes from it.\n-  The map: the arable land map mode in the Population group colours every location by its land.\n-  Farms: a farm's level tooltip shows the land free for it and the land the other farms already use.","icon_texture":"gfx/interface/icons/map_modes/pp_population_capacity.dds","definition":{"key":"pp_arable_land","file":"main_menu/common/game_concepts/pp_arable_land.txt","line":2,"family":"food","texture":"map_modes/pp_population_capacity","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_arable_land.txt"},"links":["building","climate","development","pop","topography","vegetation"],"body_html":"<p>Arable Land is what a location&#x27;s fields, pastures and waters can feed, counted in people rather than acres. Its people live on it, farms take their share of it, and land improvements win more of it. What matters is how full it is: free land lets a location thrive, crowded land holds it back.<\/p>\n<h3>Where Arable Land Comes From<\/h3>\n<h3>The Land Itself<\/h3>\n<p><span class=\"concept-ref\">Climate<\/span>, <span class=\"concept-ref\">Vegetation<\/span>, <span class=\"concept-ref\">Topography<\/span>, soil, fertility, rivers and coasts decide what the land can feed. Fertile river valleys feed many, deserts and mountains few.<\/p>\n<h3>Land Improvements<\/h3>\n<p>Clearing, draining, irrigating and terracing win new land. How far a location can be improved depends on its geography and grows with its <span class=\"concept-ref\">Development<\/span>.<\/p>\n<h3>Work in Town<\/h3>\n<p>Whoever works in a <span class=\"concept-ref\">Building<\/span> no longer works a plot of their own, so each building gives back part of its workers&#x27; land: workshops and town quarters much, mines and forts little.<\/p>\n<h3>Land improvements<\/h3>\n<p>each where the land suits it<\/p>\n<h3>What Uses It<\/h3>\n<h3>People<\/h3>\n<p>Every <span class=\"concept-ref\">Pop<\/span> lives on the land, townsfolk as much as peasants. A growing town fills its land quickly unless its buildings give land back.<\/p>\n<h3>Farms<\/h3>\n<p>Each farm level takes a fixed share of land, larger farms a larger share. A location holds only as many farms as its land has room for, and a little always stays untouched. Farms do not wait for people to leave: built on crowded land, they crowd it further.<\/p>\n<h3>Reserved Grounds<\/h3>\n<p>Hunting grounds, royal forests and gardens, great enclosures and cattle pens keep land for their owners and away from the people.<\/p>\n<h3>Free Land and Crowding<\/h3>\n<p>[Concept(&#x27;pp_abundant_free_land&#x27;, &#x27;Abundant Free Land&#x27;)|e] · [Concept(&#x27;pp_available_free_land&#x27;, &#x27;Available Free Land&#x27;)|e] · [Concept(&#x27;pp_settled_land&#x27;, &#x27;Settled Land&#x27;)|e] · [Concept(&#x27;pp_overpopulation&#x27;, &#x27;Overpopulation&#x27;)|e]<\/p>\n<p>A location&#x27;s state follows how full its land is; hover one for its effects. Free land lets settlers pick the best ground: rural goods yield more, the villages have more to spare, newcomers are drawn in, and on nearly empty land people also live off what they gather. Tribes grow only while land is free. The bonuses fade as the land fills. Past full the location is overpopulated, and that weighs heavier the further people outnumber the land.<\/p>\n<h3>Where to See It<\/h3>\n<ul><li><strong>The location view:<\/strong> the land chip at the top right shows the location&#x27;s state; hover it for every effect at its current strength. Hover the location&#x27;s arable land for every source that adds to it or takes from it.<\/li><li><strong>The map:<\/strong> the arable land map mode in the Population group colours every location by its land.<\/li><li><strong>Farms:<\/strong> a farm&#x27;s level tooltip shows the land free for it and the land the other farms already use.<\/li><\/ul>"},{"id":"pp-population-growth","order":15,"filter":"pop_growth","filter_label":"Population Growth","concept_key":"pp_population_growth","title_key":"game_concept_pp_population_growth","body_key":"game_concept_pp_population_growth_desc","title":"Population Growth","body_raw":"In general, abundance of food causes [population_growth|e]. Positive [population_growth|e] comes from two main sources: [pp_cheap_food|e] and [pp_province_current_food_storage|e].\n\nNegative [population_growth|e] comes from [pp_starvation|e], [pp_expensive_food|e], or low food storages in provinces.\n\n#T Balancing Modifiers:#!\nSome modifiers—such as negative [population_growth|e] in cities, towns, and rural locations—exist purely to balance out the positive modifiers and create an equilibrium. They have no other meaning.\n\n#T Subsistence Land:#!\nWhen a location grows far above [pp_population_capacity|e], [population_growth|e] slowly goes down. Capacity can change through buildings, development, irrigation, advances, and other modifiers, but it is no longer meant to represent housing alone.","body_plain":"In general, abundance of food causes Population Growth. Positive Population Growth comes from two main sources: Pp Cheap Food and Pp Province Current Food Storage.\n\nNegative Population Growth comes from Pp Starvation, Pp Expensive Food, or low food storages in provinces.\n\nBalancing Modifiers:\nSome modifiers—such as negative Population Growth in cities, towns, and rural locations—exist purely to balance out the positive modifiers and create an equilibrium. They have no other meaning.\n\nSubsistence Land:\nWhen a location grows far above Pp Population Capacity, Population Growth slowly goes down. Capacity can change through buildings, development, irrigation, advances, and other modifiers, but it is no longer meant to represent housing alone.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_population_growth","file":"main_menu/common/game_concepts/pp_population_growth.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_population_growth.txt"},"links":["population_growth","pp_cheap_food","pp_expensive_food","pp_population_capacity","pp_province_current_food_storage","pp_starvation"],"body_html":"<p>In general, abundance of food causes <span class=\"concept-ref\">Population Growth<\/span>. Positive <span class=\"concept-ref\">Population Growth<\/span> comes from two main sources: <a class=\"concept-link\" href=\"#pp-cheap-food\">P&amp;P: Cheap Food in Location<\/a> and <a class=\"concept-link\" href=\"#pp-province-current-food-storage\">P&amp;P: Province Current Food Storage<\/a>.<\/p>\n<p>Negative <span class=\"concept-ref\">Population Growth<\/span> comes from <a class=\"concept-link\" href=\"#pp-starvation\">P&amp;P: Starvation<\/a>, <a class=\"concept-link\" href=\"#pp-expensive-food\">P&amp;P: Expensive Food in Location<\/a>, or low food storages in provinces.<\/p>\n<h3>Balancing Modifiers:<\/h3>\n<p>Some modifiers—such as negative <span class=\"concept-ref\">Population Growth<\/span> in cities, towns, and rural locations—exist purely to balance out the positive modifiers and create an equilibrium. They have no other meaning.<\/p>\n<h3>Subsistence Land:<\/h3>\n<p>When a location grows far above <span class=\"concept-ref\">Pp Population Capacity<\/span>, <span class=\"concept-ref\">Population Growth<\/span> slowly goes down. Capacity can change through buildings, development, irrigation, advances, and other modifiers, but it is no longer meant to represent housing alone.<\/p>"},{"id":"pp-population-distribution","order":16,"filter":"pop_dist","filter_label":"Population Distribution","concept_key":"pp_population_distribution","title_key":"game_concept_pp_population_distribution","body_key":"game_concept_pp_population_distribution_desc","title":"Population Distribution","body_raw":"Your local population mix matters. Population-share effects depend on how much of a location's population belongs to a pop type. Literacy effects depend on literate pops of that type in the location.\n\n#T Population Share Effects:#!\n$BULLET$ Burghers: Local Pop Promotion Speed\n$BULLET$ Laborers: Local Monthly Development\n$BULLET$ Soldiers: Max Control\n$BULLET$ Peasants: Prosperity Recovery, Construction Speed\n$BULLET$ Tribesmen: Local Proximity Efficiency, Monthly Control, Monthly Food, Development Growth, Institution Growth\n\n#T Literacy Effects:#!\n$BULLET$ Nobles: Cultural Tradition, Monthly Control\n$BULLET$ Clergy: Local Pop Conversion Speed, Pop Assimilation Speed\n$BULLET$ Burghers: Local Monthly Development Growth, Burgher Trade Capacity, Building Establishment Speed\n$BULLET$ Laborers: Production Efficiency, Maximum RGO Size\n$BULLET$ Soldiers: Fort Defense, Monthly Manpower\n$BULLET$ Peasants: Local Pop Promotion Speed, Levy Recruitment Speed, local output for wheat, rice, millet, maize, legumes, fruit, olives, potato, livestock, beeswax, wool, cotton, sugar, tobacco, horses, silk, incense, tea, cocoa, coffee, fiber crops, saffron, pepper, cloves, chili, fish, wild game, fur, and victuals\n$BULLET$ Tribesmen: Tribesmen to Peasants\n$BULLET$ Slaves: Satisfaction of Slaves\n\n#T Unemployed Peasants:#!\nLocations with unemployed peasants receive Local Monthly Development, Institution Growth, Construction Speed, Buildings Construction Efficiency, and Migration Attraction modifiers.","body_plain":"Your local population mix matters. Population-share effects depend on how much of a location's population belongs to a pop type. Literacy effects depend on literate pops of that type in the location.\n\nPopulation Share Effects:\n-  Burghers: Local Pop Promotion Speed\n-  Laborers: Local Monthly Development\n-  Soldiers: Max Control\n-  Peasants: Prosperity Recovery, Construction Speed\n-  Tribesmen: Local Proximity Efficiency, Monthly Control, Monthly Food, Development Growth, Institution Growth\n\nLiteracy Effects:\n-  Nobles: Cultural Tradition, Monthly Control\n-  Clergy: Local Pop Conversion Speed, Pop Assimilation Speed\n-  Burghers: Local Monthly Development Growth, Burgher Trade Capacity, Building Establishment Speed\n-  Laborers: Production Efficiency, Maximum RGO Size\n-  Soldiers: Fort Defense, Monthly Manpower\n-  Peasants: Local Pop Promotion Speed, Levy Recruitment Speed, local output for wheat, rice, millet, maize, legumes, fruit, olives, potato, livestock, beeswax, wool, cotton, sugar, tobacco, horses, silk, incense, tea, cocoa, coffee, fiber crops, saffron, pepper, cloves, chili, fish, wild game, fur, and victuals\n-  Tribesmen: Tribesmen to Peasants\n-  Slaves: Satisfaction of Slaves\n\nUnemployed Peasants:\nLocations with unemployed peasants receive Local Monthly Development, Institution Growth, Construction Speed, Buildings Construction Efficiency, and Migration Attraction modifiers.","icon_texture":"gfx/interface/icons/flat_icons/building_panel/employees.dds","definition":{"key":"pp_population_distribution","file":"main_menu/common/game_concepts/pp_population_distribution.txt","line":2,"family":"food","texture":"flat_icons/building_panel/employees","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_population_distribution.txt"},"links":[],"body_html":"<p>Your local population mix matters. Population-share effects depend on how much of a location&#x27;s population belongs to a pop type. Literacy effects depend on literate pops of that type in the location.<\/p>\n<h3>Population Share Effects:<\/h3>\n<ul><li>Burghers: Local Pop Promotion Speed<\/li><li>Laborers: Local Monthly Development<\/li><li>Soldiers: Max Control<\/li><li>Peasants: Prosperity Recovery, Construction Speed<\/li><li>Tribesmen: Local Proximity Efficiency, Monthly Control, Monthly Food, Development Growth, Institution Growth<\/li><\/ul>\n<h3>Literacy Effects:<\/h3>\n<ul><li>Nobles: Cultural Tradition, Monthly Control<\/li><li>Clergy: Local Pop Conversion Speed, Pop Assimilation Speed<\/li><li>Burghers: Local Monthly Development Growth, Burgher Trade Capacity, Building Establishment Speed<\/li><li>Laborers: Production Efficiency, Maximum RGO Size<\/li><li>Soldiers: Fort Defense, Monthly Manpower<\/li><li>Peasants: Local Pop Promotion Speed, Levy Recruitment Speed, local output for wheat, rice, millet, maize, legumes, fruit, olives, potato, livestock, beeswax, wool, cotton, sugar, tobacco, horses, silk, incense, tea, cocoa, coffee, fiber crops, saffron, pepper, cloves, chili, fish, wild game, fur, and victuals<\/li><li>Tribesmen: Tribesmen to Peasants<\/li><li>Slaves: Satisfaction of Slaves<\/li><\/ul>\n<h3>Unemployed Peasants:<\/h3>\n<p>Locations with unemployed peasants receive Local Monthly Development, Institution Growth, Construction Speed, Buildings Construction Efficiency, and Migration Attraction modifiers.<\/p>"},{"id":"pp-buildings-in-location","order":17,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_buildings_in_location","title_key":"game_concept_pp_buildings_in_location","body_key":"game_concept_pp_buildings_in_location_desc","title":"P&P: Buildings in Location","body_raw":"Locations receive [ShowModifier('building_levels')] based on their total [building|e] levels. Buildings can increase [pp_population_capacity|e], but ordinary construction also pressures shared rural space.\n\nIn [pp_farm_capacity|e] and [pp_forest_capacity|e] maximum-level tooltips, total building levels are shown directly as reduced rural capacity. The exact current reduction is shown in that tooltip row.\n\n[ShowModifierEffect('building_levels')]","body_plain":"Locations receive Building Levels based on their total Building levels. Buildings can increase Pp Population Capacity, but ordinary construction also pressures shared rural space.\n\nIn Pp Farm Capacity and Pp Forest Capacity maximum-level tooltips, total building levels are shown directly as reduced rural capacity. The exact current reduction is shown in that tooltip row.\n\nBuilding Levels","icon_texture":"gfx/interface/icons/flat_icons/balance/trade.dds","definition":{"key":"pp_buildings_in_location","file":"main_menu/common/game_concepts/other_changes_pp_buildings_in_location.txt","line":2,"family":"food","texture":"flat_icons/balance/trade","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_buildings_in_location.txt"},"links":["building","pp_farm_capacity","pp_forest_capacity","pp_population_capacity"],"body_html":"<p>Locations receive <span class=\"token token-modifier\">Building Levels<\/span> based on their total <span class=\"concept-ref\">Building<\/span> levels. Buildings can increase <span class=\"concept-ref\">Pp Population Capacity<\/span>, but ordinary construction also pressures shared rural space.<\/p>\n<p>In <a class=\"concept-link\" href=\"#pp-farm-capacity\">P&amp;P: Farming/Fishing/Forest Capacities<\/a> and <span class=\"concept-ref\">Pp Forest Capacity<\/span> maximum-level tooltips, total building levels are shown directly as reduced rural capacity. The exact current reduction is shown in that tooltip row.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Building Levels<\/span><\/p>"},{"id":"pp-available-free-land","order":18,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_available_free_land","title_key":"game_concept_pp_available_free_land","body_key":"game_concept_pp_available_free_land_desc","title":"P&P: Available Free Land","body_raw":"Locations below [pp_population_capacity|e] can receive [ShowModifier('available_free_land')]. When fewer people compete for the same land, they can choose better fields, pastures, fishing spots, and forest work sites instead of being forced onto marginal ground.\n\nThis improves farming and other rural raw-good output while the location has spare food-support potential. The bonus fades as population approaches capacity and is gone at full capacity. It is one of the main systems that makes locations become better or worse at farming as they fill up.\n\n[ShowModifierEffect('available_free_land')]","body_plain":"Locations below Pp Population Capacity can receive Available Free Land. When fewer people compete for the same land, they can choose better fields, pastures, fishing spots, and forest work sites instead of being forced onto marginal ground.\n\nThis improves farming and other rural raw-good output while the location has spare food-support potential. The bonus fades as population approaches capacity and is gone at full capacity. It is one of the main systems that makes locations become better or worse at farming as they fill up.\n\nAvailable Free Land","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_available_free_land","file":"main_menu/common/game_concepts/other_changes_pp_available_free_land.txt","line":2,"family":"food","texture":"modifier_types/wheat_positive","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_available_free_land.txt"},"links":["pp_population_capacity"],"body_html":"<p>Locations below <span class=\"concept-ref\">Pp Population Capacity<\/span> can receive <span class=\"token token-modifier\">Available Free Land<\/span>. When fewer people compete for the same land, they can choose better fields, pastures, fishing spots, and forest work sites instead of being forced onto marginal ground.<\/p>\n<p>This improves farming and other rural raw-good output while the location has spare food-support potential. The bonus fades as population approaches capacity and is gone at full capacity. It is one of the main systems that makes locations become better or worse at farming as they fill up.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Available Free Land<\/span><\/p>"},{"id":"pp-abundant-free-land","order":19,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_abundant_free_land","title_key":"game_concept_pp_abundant_free_land","body_key":"game_concept_pp_abundant_free_land_desc","title":"P&P: Abundant Free Land","body_raw":"Locations far below [pp_population_capacity|e] can receive [ShowModifier('abundant_free_land')], the stronger free-land state. The logic is the same: with a lot of unused capacity, people have more choice and can work the best local farming spots first.\n\nAs population grows, this advantage declines and eventually disappears at full capacity. Exact effects are shown below and in the modifier tooltip.\n\n[ShowModifierEffect('abundant_free_land')]","body_plain":"Locations far below Pp Population Capacity can receive Abundant Free Land, the stronger free-land state. The logic is the same: with a lot of unused capacity, people have more choice and can work the best local farming spots first.\n\nAs population grows, this advantage declines and eventually disappears at full capacity. Exact effects are shown below and in the modifier tooltip.\n\nAbundant Free Land","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_abundant_free_land","file":"main_menu/common/game_concepts/other_changes_pp_abundant_free_land.txt","line":2,"family":"food","texture":"modifier_types/wheat_positive","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_abundant_free_land.txt"},"links":["pp_population_capacity"],"body_html":"<p>Locations far below <span class=\"concept-ref\">Pp Population Capacity<\/span> can receive <span class=\"token token-modifier\">Abundant Free Land<\/span>, the stronger free-land state. The logic is the same: with a lot of unused capacity, people have more choice and can work the best local farming spots first.<\/p>\n<p>As population grows, this advantage declines and eventually disappears at full capacity. Exact effects are shown below and in the modifier tooltip.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Abundant Free Land<\/span><\/p>"},{"id":"pp-prosperity","order":20,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_prosperity","title_key":"game_concept_pp_prosperity","body_key":"game_concept_pp_prosperity_desc","title":"P&P: Prosperity","body_raw":"Prosperity is great for locations in the long term. In this mod, it is closely tied to food availability: cheap food and well-stocked storages boost prosperity, which in turn supports higher food consumption and [population_growth|e]. See [pp_food_consumption|e] for how food prices affect prosperity.\n\n#T Note:#!\nProsperity scales from 0% to 100%.\n\n[ShowModifierEffect('prosperity')]","body_plain":"Prosperity is great for locations in the long term. In this mod, it is closely tied to food availability: cheap food and well-stocked storages boost prosperity, which in turn supports higher food consumption and Population Growth. See Pp Food Consumption for how food prices affect prosperity.\n\nNote:\nProsperity scales from 0% to 100%.\n\nProsperity","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_prosperity","file":"main_menu/common/game_concepts/other_changes_pp_prosperity.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_prosperity.txt"},"links":["population_growth","pp_food_consumption"],"body_html":"<p>Prosperity is great for locations in the long term. In this mod, it is closely tied to food availability: cheap food and well-stocked storages boost prosperity, which in turn supports higher food consumption and <span class=\"concept-ref\">Population Growth<\/span>. See <a class=\"concept-link\" href=\"#pp-food-consumption\">P&amp;P: Food Consumption<\/a> for how food prices affect prosperity.<\/p>\n<h3>Note:<\/h3>\n<p>Prosperity scales from 0% to 100%.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Prosperity<\/span><\/p>"},{"id":"pp-devastation","order":21,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_devastation","title_key":"game_concept_pp_devastation","body_key":"game_concept_pp_devastation_desc","title":"P&P: Devastation","body_raw":"Devastation has horrible consequences for locations. See [pp_food_consumption|e] for full context.\n\n#T Note:#!\nDevastation scales from 0 to -100%, so the values shown below are actually inverted at -100% devastation.\n\n[ShowModifierEffect('devastation')]","body_plain":"Devastation has horrible consequences for locations. See Pp Food Consumption for full context.\n\nNote:\nDevastation scales from 0 to -100%, so the values shown below are actually inverted at -100% devastation.\n\nDevastation","icon_texture":"gfx/interface/icons/flat_icons/military/bankruptcy.dds","definition":{"key":"pp_devastation","file":"main_menu/common/game_concepts/other_changes_pp_devastation.txt","line":2,"family":"food","texture":"flat_icons/military/bankruptcy","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_devastation.txt"},"links":["pp_food_consumption"],"body_html":"<p>Devastation has horrible consequences for locations. See <a class=\"concept-link\" href=\"#pp-food-consumption\">P&amp;P: Food Consumption<\/a> for full context.<\/p>\n<h3>Note:<\/h3>\n<p>Devastation scales from 0 to -100%, so the values shown
