    const europediaPayload = {"metadata":{"title":"Prosper or Perish Europedia","entry_count":25,"sources":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concepts":"main_menu/common/game_concepts"}},"filters":[{"id":"all","label":"All","count":25},{"id":"getting_started","label":"Getting Started","count":1},{"id":"faq","label":"F.A.Q.","count":1},{"id":"update_0_9","label":"Update 0.9","count":1},{"id":"overview","label":"Overview","count":1},{"id":"food_in_eu5","label":"Food in EU5","count":1},{"id":"food","label":"Food Production","count":1},{"id":"food_consumption","label":"Food Consumption","count":1},{"id":"victuals","label":"New Trade Goods","count":1},{"id":"new_buildings","label":"New Buildings","count":1},{"id":"building_limits","label":"Building Limits","count":1},{"id":"farm_capacity","label":"Rural Capacities","count":1},{"id":"farm_output","label":"Building Output","count":1},{"id":"harvest","label":"Variable Harvests","count":1},{"id":"pop_capacity","label":"Arable Land","count":1},{"id":"pop_growth","label":"Population Growth","count":1},{"id":"pop_dist","label":"Population Distribution","count":1},{"id":"other_changes","label":"Other Changes","count":9}],"entries":[{"id":"pp-getting-started","order":1,"filter":"getting_started","filter_label":"Getting Started","concept_key":"pp_getting_started","title_key":"game_concept_pp_getting_started","body_key":"game_concept_pp_getting_started_desc","title":"Getting Started","body_raw":"#T Getting Started#!\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\n#T First, Check Your Settings#!\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\n#T Recommended Community Mods#!\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\n#T What to Pay Attention To#!\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n$BULLET$ 1. Turn the food slider low; do not bankrupt yourself.\n$BULLET$ 2. If food is short, rural buildings switch to feeding the province by themselves: farms provision it with their crop. [ShowBuildingTypeName('cookshop')|e] and [ShowBuildingTypeName('public_kitchen')|e] always serve their dishes to the province.\n$BULLET$ 3. If [ShowGoodsName('victuals')|e] are cheap, build a [ShowBuildingTypeName('tavern')|e]. It buys victuals from the goods market and feeds the province with them, and it earns more while the province store is low.\n$BULLET$ 4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n$BULLET$ 5. If food is expensive, your population grows slower and you get less prosperity.\n\nIt is best to understand how [ShowBuildingTypeName('tavern')|e] works. It hires and fires people based on whether buying victuals for the province pays off, which is the case while the province store is low. You can subsidize it, but you rarely need to. Just leave it be and build it in cities where you do not want to produce food with [ShowBuildingTypeName('cookshop')|e]. Its counterpart [ShowBuildingTypeName('victualling_yard')|e] packs a full province store into victuals for the goods market; it belongs where rivers, coasts and market centres let the victuals travel.\n\nEssentially everything is balanced around this idea.\n\n#T RGOs#!\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\n#T Variable Harvests#!\nThey happen yearly and make your crop production vary a lot.\n\n#T Map Modes#!\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\n#T Farming, Forest, and Fishing Capacity#!\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\n#T Location Potential#!\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\n#T Building Levels#!\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\n#T Internal Food Goods#!\n[ShowGoodsName('province_food_sales')|e] pays the [ShowBuildingTypeName('grange')|e] for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.","body_plain":"Getting Started\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\nFirst, Check Your Settings\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\nRecommended Community Mods\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\nWhat to Pay Attention To\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n-  1. Turn the food slider low; do not bankrupt yourself.\n-  2. If food is short, rural buildings switch to feeding the province by themselves: farms provision it with their crop. Cookshop and Public Kitchen always serve their dishes to the province.\n-  3. If Victuals are cheap, build a Tavern. It buys victuals from the goods market and feeds the province with them, and it earns more while the province store is low.\n-  4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n-  5. If food is expensive, your population grows slower and you get less prosperity.\n\nIt is best to understand how Tavern works. It hires and fires people based on whether buying victuals for the province pays off, which is the case while the province store is low. You can subsidize it, but you rarely need to. Just leave it be and build it in cities where you do not want to produce food with Cookshop. Its counterpart Victualling Yard packs a full province store into victuals for the goods market; it belongs where rivers, coasts and market centres let the victuals travel.\n\nEssentially everything is balanced around this idea.\n\nRGOs\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\nVariable Harvests\nThey happen yearly and make your crop production vary a lot.\n\nMap Modes\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\nFarming, Forest, and Fishing Capacity\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\nLocation Potential\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\nBuilding Levels\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\nInternal Food Goods\nProvince Food Sales pays the Grange for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.","icon_texture":"gfx/interface/icons/flat_icons/effect.dds","definition":{"key":"pp_getting_started","file":"main_menu/common/game_concepts/pp_getting_started.txt","line":2,"family":"food","texture":"flat_icons/effect","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_getting_started.txt"},"links":[],"body_html":"<h3>Getting Started<\/h3>\n<p>If you are new or returning, the changes can be overwhelming because there are so many.<\/p>\n<h3>First, Check Your Settings<\/h3>\n<p>First check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.<\/p>\n<h3>Recommended Community Mods<\/h3>\n<p>I personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&amp;P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.<\/p>\n<h3>What to Pay Attention To<\/h3>\n<p>In general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.<\/p>\n<p>The most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.<\/p>\n<p>In simple terms, it always works like this:<\/p>\n<ul><li>1. Turn the food slider low; do not bankrupt yourself.<\/li><li>2. If food is short, rural buildings switch to feeding the province by themselves: farms provision it with their crop. <span class=\"token token-building\">Cookshop<\/span> and <span class=\"token token-building\">Public Kitchen<\/span> always serve their dishes to the province.<\/li><li>3. If <span class=\"token token-good\">Victuals<\/span> are cheap, build a <span class=\"token token-building\">Tavern<\/span>. It buys victuals from the goods market and feeds the province with them, and it earns more while the province store is low.<\/li><li>4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.<\/li><li>5. If food is expensive, your population grows slower and you get less prosperity.<\/li><\/ul>\n<p>It is best to understand how <span class=\"token token-building\">Tavern<\/span> works. It hires and fires people based on whether buying victuals for the province pays off, which is the case while the province store is low. You can subsidize it, but you rarely need to. Just leave it be and build it in cities where you do not want to produce food with <span class=\"token token-building\">Cookshop<\/span>. Its counterpart <span class=\"token token-building\">Victualling Yard<\/span> packs a full province store into victuals for the goods market; it belongs where rivers, coasts and market centres let the victuals travel.<\/p>\n<p>Essentially everything is balanced around this idea.<\/p>\n<h3>RGOs<\/h3>\n<p>RGOs are removed and replaced by buildings. Buildings are just more interesting.<\/p>\n<h3>Variable Harvests<\/h3>\n<p>They happen yearly and make your crop production vary a lot.<\/p>\n<h3>Map Modes<\/h3>\n<p>Please familiarize yourself with the map modes. I added a lot. They are very helpful for many things.<\/p>\n<h3>Farming, Forest, and Fishing Capacity<\/h3>\n<p>There are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.<\/p>\n<h3>Location Potential<\/h3>\n<p>This is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.<\/p>\n<h3>Building Levels<\/h3>\n<p>You will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.<\/p>\n<p>Please use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.<\/p>\n<h3>Internal Food Goods<\/h3>\n<p><span class=\"token token-good\">Province Food Sales<\/span> pays the <span class=\"token token-building\">Grange<\/span> for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.<\/p>"},{"id":"pp-faq","order":2,"filter":"faq","filter_label":"F.A.Q.","concept_key":"pp_faq","title_key":"game_concept_pp_faq","body_key":"game_concept_pp_faq_desc","title":"F.A.Q.","body_raw":"#T Q: Are my other mods compatible with Prosper or Perish?:#!\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\n#T Q: An update ruined my save. What do I do?:#!\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\n#T Q: How do I install the GitHub version?:#!\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\n#T Q: Why is everyone starving at game start?:#!\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.","body_plain":"Q: Are my other mods compatible with Prosper or Perish?:\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\nQ: An update ruined my save. What do I do?:\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\nQ: How do I install the GitHub version?:\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\nQ: Why is everyone starving at game start?:\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.","icon_texture":"gfx/interface/icons/flat_icons/effect.dds","definition":{"key":"pp_faq","file":"main_menu/common/game_concepts/pp_faq.txt","line":2,"family":"food","texture":"flat_icons/effect","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_faq.txt"},"links":[],"body_html":"<h3>Q: Are my other mods compatible with Prosper or Perish?:<\/h3>\n<p>I recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.<\/p>\n<h3>Q: An update ruined my save. What do I do?:<\/h3>\n<p>Steam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth &amp; Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.<\/p>\n<h3>Q: How do I install the GitHub version?:<\/h3>\n<p>Go to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository&#x27;s mod folder, and copy the Prosper or Perish (Population Growth &amp; Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.<\/p>\n<h3>Q: Why is everyone starving at game start?:<\/h3>\n<p>I put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.<\/p>"},{"id":"pp-update-0-9","order":3,"filter":"update_0_9","filter_label":"Update 0.9","concept_key":"pp_update_0_9","title_key":"game_concept_pp_update_0_9","body_key":"game_concept_pp_update_0_9_desc","title":"Update 0.9","body_raw":"#T Update 0.9#!\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\n#T Biggest Changes from 0.8#!\n$BULLET$ #Y 1. The location building cost malus is gone.#! It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n$BULLET$ #Y 2. Victuals Markets and Province Food Market Goods.#! It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now uses two internal goods: Province Food Sales for food sold into the goods market and Province Food Purchase for food bought back into a province. They serve no purpose other than to create the local conditions where converting victuals to food can be profitable when victuals are cheap and market food is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n$BULLET$ #Y 3. Please use the Community Mod Framework.#! I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n$BULLET$ #Y 4. Bigger and more urbanized cities.#! In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\n$BULLET$ #Y 5. Promotions.#! I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy.","body_plain":"Update 0.9\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\nBiggest Changes from 0.8\n-  1. The location building cost malus is gone. It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n-  2. Victuals Markets and Province Food Market Goods. It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now uses two internal goods: Province Food Sales for food sold into the goods market and Province Food Purchase for food bought back into a province. They serve no purpose other than to create the local conditions where converting victuals to food can be profitable when victuals are cheap and market food is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n-  3. Please use the Community Mod Framework. I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n-  4. Bigger and more urbanized cities. In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\n-  5. Promotions. I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_update_0_9","file":"main_menu/common/game_concepts/pp_update_0_9.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_update_0_9.txt"},"links":[],"body_html":"<h3>Update 0.9<\/h3>\n<p>Hey guys,<\/p>\n<p>Read the Overview page to see roughly what changed. Most should be familiar.<\/p>\n<p>I spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.<\/p>\n<p>Of course, I added new buildings, new production methods, new advances, and more.<\/p>\n<h3>Biggest Changes from 0.8<\/h3>\n<ul><li><strong>1. The location building cost malus is gone.<\/strong> It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.<\/li><\/ul>\n<ul><li><strong>2. Victuals Markets and Province Food Market Goods.<\/strong> It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread &quot;Food feedback&quot;. This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now uses two internal goods: Province Food Sales for food sold into the goods market and Province Food Purchase for food bought back into a province. They serve no purpose other than to create the local conditions where converting victuals to food can be profitable when victuals are cheap and market food is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.<\/li><\/ul>\n<ul><li><strong>3. Please use the Community Mod Framework.<\/strong> I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.<\/li><\/ul>\n<ul><li><strong>4. Bigger and more urbanized cities.<\/strong> In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.<\/li><\/ul>\n<ul><li><strong>5. Promotions.<\/strong> I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.<\/li><\/ul>\n<p>Otherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.<\/p>\n<p>If you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.<\/p>\n<p>I hope you enjoy.<\/p>"},{"id":"prosper-perish-mod","order":4,"filter":"overview","filter_label":"Overview","concept_key":"prosper_perish_mod","title_key":"game_concept_prosper_perish_mod","body_key":"game_concept_prosper_perish_mod_desc","title":"Prosper or Perish (Mod)","body_raw":"#T The Mod:#!\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to [pp_prosperity|e], Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and two new food goods (see [pp_victuals|e]). When you create a new game, check the game rules for Prosper or Perish: you can disable [pp_variable_harvests|e] if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least [pp_food|e] and [pp_food_consumption|e]; they should be enough to get you playing.\n\n#T Promotions:#!\nI massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\n#T Feedback:#!\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookshop recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\n#T How I Add Features:#!\nI follow this checklist:\n\n$BULLET$ Is the mechanic fun to manage for the player?\n$BULLET$ Is the mechanic a concept that can be understood historically?\n$BULLET$ Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\n#T Thanks:#!\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5.","body_plain":"The Mod:\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to Pp Prosperity, Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and two new food goods (see Pp Victuals). When you create a new game, check the game rules for Prosper or Perish: you can disable Pp Variable Harvests if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least Pp Food and Pp Food Consumption; they should be enough to get you playing.\n\nPromotions:\nI massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\nFeedback:\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookshop recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\nHow I Add Features:\nI follow this checklist:\n\n-  Is the mechanic fun to manage for the player?\n-  Is the mechanic a concept that can be understood historically?\n-  Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\nThanks:\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"prosper_perish_mod","file":"main_menu/common/game_concepts/pp_overview.txt","line":3,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":["prosper_or_perish"]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_overview.txt"},"links":["pp_food","pp_food_consumption","pp_prosperity","pp_variable_harvests","pp_victuals"],"body_html":"<h3>The Mod:<\/h3>\n<p>This mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a>, Development and similar factors, which instead now shape food capacity and growth.<\/p>\n<p>You will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric &quot;clumping,&quot; and higher infrastructure costs so Roads become a strategic choice rather than something to spam.<\/p>\n<p>The core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.<\/p>\n<p>The mod adds new Buildings, new production methods and two new food goods (see <a class=\"concept-link\" href=\"#pp-victuals\">P&amp;P: Food Goods<\/a>). When you create a new game, check the game rules for Prosper or Perish: you can disable <a class=\"concept-link\" href=\"#pp-variable-harvests\">P&amp;P: Variable Harvests<\/a> if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.<\/p>\n<p>Please read at least <a class=\"concept-link\" href=\"#pp-food\">P&amp;P: Food Production<\/a> and <a class=\"concept-link\" href=\"#pp-food-consumption\">P&amp;P: Food Consumption<\/a>; they should be enough to get you playing.<\/p>\n<h3>Promotions:<\/h3>\n<p>I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.<\/p>\n<h3>Feedback:<\/h3>\n<p>I really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookshop recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.<\/p>\n<p>There are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.<\/p>\n<h3>How I Add Features:<\/h3>\n<p>I follow this checklist:<\/p>\n<ul><li>Is the mechanic fun to manage for the player?<\/li><li>Is the mechanic a concept that can be understood historically?<\/li><li>Is the AI able to handle the mechanic?<\/li><\/ul>\n<p>I am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs &quot;more&quot; food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.<\/p>\n<h3>Thanks:<\/h3>\n<p>A sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.<\/p>\n<p>A special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.<\/p>\n<p>Thanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.<\/p>\n<p>And a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&amp;P, and for always being ready to chat and excited to talk about EU5.<\/p>"},{"id":"pp-food-in-eu5","order":5,"filter":"food_in_eu5","filter_label":"Food in EU5","concept_key":"pp_food_in_eu5","title_key":"game_concept_pp_food_in_eu5","body_key":"game_concept_pp_food_in_eu5_desc","title":"Food in EU5","body_raw":"#T Food in Vanilla EU5:#!\nFood in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.\n\nVanilla food has three main sources:\n\n$BULLET$ #Y Food goods#! such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good's food value.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants. This creates food directly and is not tied to a trade good.\n$BULLET$ #Y Flat food sources#! from buildings. These create food directly and are not tied to a food trade good.\n\nThose sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.\n\nLocations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.\n\nThe biggest problems are:\n\n$BULLET$ A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.\n$BULLET$ Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.\n$BULLET$ Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.\n$BULLET$ Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.\n\n#T Prosper or Perish:#!\nProsper or Perish keeps the same broad food-storage system, but changes what feeds it.\n\nFood sources in Prosper or Perish are:\n\n$BULLET$ #Y [ShowGoodsName('victuals')|e]#!, the preserved food good. It represents rations and provisions that keep and travel through the goods market.\n$BULLET$ #Y [ShowGoodsName('local_food')|e]#!, food eaten where it is made. Rural buildings provision their province with it and [ShowBuildingTypeName('cookshop')|e] serves it; it never leaves the province.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants, as in vanilla.\n$BULLET$ #Y [ShowBuildingTypeName('tavern')|e]#!, which buys [ShowGoodsName('victuals')|e] from the goods market and feeds the province with them. [ShowBuildingTypeName('victualling_yard')|e] does the reverse when a province store is full.\n\nHow the P&P system works:\n\n$BULLET$ Food productivity is removed. The goal is to keep [ShowGoodsName('victuals')|e] in the goods market connected to actual food availability.\n$BULLET$ Excess [ShowGoodsName('victuals')|e] can be turned back into province food through [ShowBuildingTypeName('tavern')|e], or used by buildings such as docks and armories as rations and supplies.\n$BULLET$ [ShowBuildingTypeName('cookshop')|e] turns many regional food goods into dishes it serves to the province as [ShowGoodsName('local_food')|e], and [ShowBuildingTypeName('victualling_yard')|e] packs a full province store into [ShowGoodsName('victuals')|e], so surplus food can feed the province or travel through the goods market.\n$BULLET$ Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.\n\nFor the practical P&P production chain, see [pp_food|e]. For local raw-material productivity, see [pp_farm_output|e].","body_plain":"Food in Vanilla EU5:\nFood in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.\n\nVanilla food has three main sources:\n\n-  Food goods such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good's food value.\n-  Subsistence agriculture from unemployed peasants. This creates food directly and is not tied to a trade good.\n-  Flat food sources from buildings. These create food directly and are not tied to a food trade good.\n\nThose sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.\n\nLocations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.\n\nThe biggest problems are:\n\n-  A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.\n-  Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.\n-  Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.\n-  Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.\n\nProsper or Perish:\nProsper or Perish keeps the same broad food-storage system, but changes what feeds it.\n\nFood sources in Prosper or Perish are:\n\n-  Victuals, the preserved food good. It represents rations and provisions that keep and travel through the goods market.\n-  Local Food, food eaten where it is made. Rural buildings provision their province with it and Cookshop serves it; it never leaves the province.\n-  Subsistence agriculture from unemployed peasants, as in vanilla.\n-  Tavern, which buys Victuals from the goods market and feeds the province with them. Victualling Yard does the reverse when a province store is full.\n\nHow the P&P system works:\n\n-  Food productivity is removed. The goal is to keep Victuals in the goods market connected to actual food availability.\n-  Excess Victuals can be turned back into province food through Tavern, or used by buildings such as docks and armories as rations and supplies.\n-  Cookshop turns many regional food goods into dishes it serves to the province as Local Food, and Victualling Yard packs a full province store into Victuals, so surplus food can feed the province or travel through the goods market.\n-  Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.\n\nFor the practical P&P production chain, see Pp Food. For local raw-material productivity, see Pp Farm Output.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food_in_eu5","file":"main_menu/common/game_concepts/pp_food_in_eu5.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_in_eu5.txt"},"links":["pp_farm_output","pp_food"],"body_html":"<h3>Food in Vanilla EU5:<\/h3>\n<p>Food in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.<\/p>\n<p>Vanilla food has three main sources:<\/p>\n<ul><li><strong>Food goods<\/strong> such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good&#x27;s food value.<\/li><li><strong>Subsistence agriculture<\/strong> from unemployed peasants. This creates food directly and is not tied to a trade good.<\/li><li><strong>Flat food sources<\/strong> from buildings. These create food directly and are not tied to a food trade good.<\/li><\/ul>\n<p>Those sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.<\/p>\n<p>Locations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.<\/p>\n<p>The biggest problems are:<\/p>\n<ul><li>A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.<\/li><li>Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.<\/li><li>Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.<\/li><li>Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.<\/li><\/ul>\n<h3>Prosper or Perish:<\/h3>\n<p>Prosper or Perish keeps the same broad food-storage system, but changes what feeds it.<\/p>\n<p>Food sources in Prosper or Perish are:<\/p>\n<ul><li><strong><span class=\"token token-good\">Victuals<\/span><\/strong>, the preserved food good. It represents rations and provisions that keep and travel through the goods market.<\/li><li><strong><span class=\"token token-good\">Local Food<\/span><\/strong>, food eaten where it is made. Rural buildings provision their province with it and <span class=\"token token-building\">Cookshop<\/span> serves it; it never leaves the province.<\/li><li><strong>Subsistence agriculture<\/strong> from unemployed peasants, as in vanilla.<\/li><li><strong><span class=\"token token-building\">Tavern<\/span><\/strong>, which buys <span class=\"token token-good\">Victuals<\/span> from the goods market and feeds the province with them. <span class=\"token token-building\">Victualling Yard<\/span> does the reverse when a province store is full.<\/li><\/ul>\n<p>How the P&amp;P system works:<\/p>\n<ul><li>Food productivity is removed. The goal is to keep <span class=\"token token-good\">Victuals<\/span> in the goods market connected to actual food availability.<\/li><li>Excess <span class=\"token token-good\">Victuals<\/span> can be turned back into province food through <span class=\"token token-building\">Tavern<\/span>, or used by buildings such as docks and armories as rations and supplies.<\/li><li><span class=\"token token-building\">Cookshop<\/span> turns many regional food goods into dishes it serves to the province as <span class=\"token token-good\">Local Food<\/span>, and <span class=\"token token-building\">Victualling Yard<\/span> packs a full province store into <span class=\"token token-good\">Victuals<\/span>, so surplus food can feed the province or travel through the goods market.<\/li><li>Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.<\/li><\/ul>\n<p>For the practical P&amp;P production chain, see <a class=\"concept-link\" href=\"#pp-food\">P&amp;P: Food Production<\/a>. For local raw-material productivity, see <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>.<\/p>"},{"id":"pp-food","order":6,"filter":"food","filter_label":"Food Production","concept_key":"pp_food","title_key":"game_concept_pp_food","body_key":"game_concept_pp_food_desc","title":"P&P: Food Production","body_raw":"#T What This Page Covers:#!\nThis page is about producing food in Prosper or Perish. For the vanilla food system and why P&P changes it, see [pp_food_in_eu5|e]. For the two food goods, see [pp_victuals|e].\n\n#T Food Sources:#!\nP&P food comes from four places:\n\n$BULLET$ Rural buildings such as crop farms, fisheries, orchards, and forest villages provision their province. Their Provisioning slot turns their own crop into [ShowGoodsName('local_food')|e]: more of it while the province store is low and less while it is full, when more of the crop goes to the goods market instead.\n$BULLET$ [ShowBuildingTypeName('cookshop')|e] and [ShowBuildingTypeName('public_kitchen')|e] serve their dishes and drinks to the province as [ShowGoodsName('local_food')|e].\n$BULLET$ [ShowBuildingTypeName('tavern')|e] buys [ShowGoodsName('victuals')|e] from the goods market and feeds the province with them.\n$BULLET$ Unemployed peasants still produce a small amount of subsistence food directly.\n\n#T The Production Chain:#!\nThe intended chain is simple:\n\n$BULLET$ Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.\n$BULLET$ Feed the province where the food is made: farms provision it with their crop and [ShowBuildingTypeName('cookshop')|e] serves its dishes.\n$BULLET$ Pack the rest as [ShowGoodsName('victuals')|e] in a [ShowBuildingTypeName('victualling_yard')|e] once a province store is full. They keep and travel, and a [ShowBuildingTypeName('tavern')|e] can turn them back into food in a province that runs short.\n\n[ShowGoodsName('victuals')|e] are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.\n\n#T Local Production:#!\nFood productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.\n\nUse building tooltips, local output map modes, [pp_farm_output|e], and [pp_variable_harvests|e] to understand what a location is good at producing.\n\n#T Practical Rule:#!\nIf a province struggles with food, check whether its store is low enough for its farms to provision it, whether its [ShowBuildingTypeName('cookshop')|e] gets the market's crops to cook, and whether a [ShowBuildingTypeName('tavern')|e] can buy cheap [ShowGoodsName('victuals')|e] from the goods market.","body_plain":"What This Page Covers:\nThis page is about producing food in Prosper or Perish. For the vanilla food system and why P&P changes it, see Pp Food In Eu5. For the two food goods, see Pp Victuals.\n\nFood Sources:\nP&P food comes from four places:\n\n-  Rural buildings such as crop farms, fisheries, orchards, and forest villages provision their province. Their Provisioning slot turns their own crop into Local Food: more of it while the province store is low and less while it is full, when more of the crop goes to the goods market instead.\n-  Cookshop and Public Kitchen serve their dishes and drinks to the province as Local Food.\n-  Tavern buys Victuals from the goods market and feeds the province with them.\n-  Unemployed peasants still produce a small amount of subsistence food directly.\n\nThe Production Chain:\nThe intended chain is simple:\n\n-  Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.\n-  Feed the province where the food is made: farms provision it with their crop and Cookshop serves its dishes.\n-  Pack the rest as Victuals in a Victualling Yard once a province store is full. They keep and travel, and a Tavern can turn them back into food in a province that runs short.\n\nVictuals are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.\n\nLocal Production:\nFood productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.\n\nUse building tooltips, local output map modes, Pp Farm Output, and Pp Variable Harvests to understand what a location is good at producing.\n\nPractical Rule:\nIf a province struggles with food, check whether its store is low enough for its farms to provision it, whether its Cookshop gets the market's crops to cook, and whether a Tavern can buy cheap Victuals from the goods market.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food","file":"main_menu/common/game_concepts/pp_food_production.txt","line":3,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_production.txt"},"links":["pp_farm_output","pp_food_in_eu5","pp_variable_harvests","pp_victuals"],"body_html":"<h3>What This Page Covers:<\/h3>\n<p>This page is about producing food in Prosper or Perish. For the vanilla food system and why P&amp;P changes it, see <a class=\"concept-link\" href=\"#pp-food-in-eu5\">Food in EU5<\/a>. For the two food goods, see <a class=\"concept-link\" href=\"#pp-victuals\">P&amp;P: Food Goods<\/a>.<\/p>\n<h3>Food Sources:<\/h3>\n<p>P&amp;P food comes from four places:<\/p>\n<ul><li>Rural buildings such as crop farms, fisheries, orchards, and forest villages provision their province. Their Provisioning slot turns their own crop into <span class=\"token token-good\">Local Food<\/span>: more of it while the province store is low and less while it is full, when more of the crop goes to the goods market instead.<\/li><li><span class=\"token token-building\">Cookshop<\/span> and <span class=\"token token-building\">Public Kitchen<\/span> serve their dishes and drinks to the province as <span class=\"token token-good\">Local Food<\/span>.<\/li><li><span class=\"token token-building\">Tavern<\/span> buys <span class=\"token token-good\">Victuals<\/span> from the goods market and feeds the province with them.<\/li><li>Unemployed peasants still produce a small amount of subsistence food directly.<\/li><\/ul>\n<h3>The Production Chain:<\/h3>\n<p>The intended chain is simple:<\/p>\n<ul><li>Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.<\/li><li>Feed the province where the food is made: farms provision it with their crop and <span class=\"token token-building\">Cookshop<\/span> serves its dishes.<\/li><li>Pack the rest as <span class=\"token token-good\">Victuals<\/span> in a <span class=\"token token-building\">Victualling Yard<\/span> once a province store is full. They keep and travel, and a <span class=\"token token-building\">Tavern<\/span> can turn them back into food in a province that runs short.<\/li><\/ul>\n<p><span class=\"token token-good\">Victuals<\/span> are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.<\/p>\n<h3>Local Production:<\/h3>\n<p>Food productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.<\/p>\n<p>Use building tooltips, local output map modes, <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>, and <a class=\"concept-link\" href=\"#pp-variable-harvests\">P&amp;P: Variable Harvests<\/a> to understand what a location is good at producing.<\/p>\n<h3>Practical Rule:<\/h3>\n<p>If a province struggles with food, check whether its store is low enough for its farms to provision it, whether its <span class=\"token token-building\">Cookshop<\/span> gets the market&#x27;s crops to cook, and whether a <span class=\"token token-building\">Tavern<\/span> can buy cheap <span class=\"token token-good\">Victuals<\/span> from the goods market.<\/p>"},{"id":"pp-food-consumption","order":7,"filter":"food_consumption","filter_label":"Food Consumption","concept_key":"pp_food_consumption","title_key":"game_concept_pp_food_consumption","body_key":"game_concept_pp_food_consumption_desc","title":"P&P: Food Consumption","body_raw":"There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.\n\nFood consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.\n\n#T What Impacts Food Consumption:#!\nSeveral factors change how much pops consume:\n\n$BULLET$ Local food price on the market (cheap vs expensive)\n$BULLET$ [pp_province_current_food_storage|e] (growing vs shrinking)\n$BULLET$ [pp_prosperity|e] of the location\n$BULLET$ Winter severity\n$BULLET$ [pp_devastation|e] and recovery conditions\n$BULLET$ Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)\n\nSee [pp_food_storage|e] for how storage works.\n\n#T Cheap food in the market and High food Storages in Provinces:#!\nWhen food is cheap on the market and province storages are well stocked, locations receive [pp_cheap_food|e] and provinces with growing storage receive [pp_province_current_food_storage|e]. Effects scale by how far below the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('cheap_food_in_location')]\n\n#T Expensive food in the market and Low food Storages in Provinces:#!\nWhen food is expensive on the market and province storages are low or empty, locations receive [pp_expensive_food|e]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]\n\nFood consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. [pp_prosperity|e] reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and [population_growth|e].\n\n#T When You Run Out of food:#!\nWhen storages are empty, a province receives [ShowModifier('province_starving')]. People try to feed themselves by any means necessary. [pp_devastation|e] tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. [pp_prosperity|e] crashes. Soldiers are less willing to defend [starving|e] cities. See [pp_food_storage|e] and [pp_starvation|e].\n\n[ShowModifierEffect('province_starving')]\n\n#T Devastation:#!\n[pp_devastation|e] is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).\n\n[ShowModifierEffect('devastation')]","body_plain":"There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.\n\nFood consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.\n\nWhat Impacts Food Consumption:\nSeveral factors change how much pops consume:\n\n-  Local food price on the market (cheap vs expensive)\n-  Pp Province Current Food Storage (growing vs shrinking)\n-  Pp Prosperity of the location\n-  Winter severity\n-  Pp Devastation and recovery conditions\n-  Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)\n\nSee Pp Food Storage for how storage works.\n\nCheap food in the market and High food Storages in Provinces:\nWhen food is cheap on the market and province storages are well stocked, locations receive Pp Cheap Food and provinces with growing storage receive Pp Province Current Food Storage. Effects scale by how far below the base price the food price is.\n\nDisplay Note:\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\nCheap Food In Location\n\nExpensive food in the market and Low food Storages in Provinces:\nWhen food is expensive on the market and province storages are low or empty, locations receive Pp Expensive Food. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.\n\nDisplay Note:\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\nExpensive Food In Location\n\nFood consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. Pp Prosperity reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and Population Growth.\n\nWhen You Run Out of food:\nWhen storages are empty, a province receives Province Starving. People try to feed themselves by any means necessary. Pp Devastation tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. Pp Prosperity crashes. Soldiers are less willing to defend Starving cities. See Pp Food Storage and Pp Starvation.\n\nProvince Starving\n\nDevastation:\nPp Devastation is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).\n\nDevastation","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food_consumption","file":"main_menu/common/game_concepts/pp_food_consumption.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_consumption.txt"},"links":["population_growth","pp_cheap_food","pp_devastation","pp_expensive_food","pp_food_storage","pp_prosperity","pp_province_current_food_storage","pp_starvation","starving"],"body_html":"<p>There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.<\/p>\n<p>Food consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.<\/p>\n<h3>What Impacts Food Consumption:<\/h3>\n<p>Several factors change how much pops consume:<\/p>\n<ul><li>Local food price on the market (cheap vs expensive)<\/li><li><a class=\"concept-link\" href=\"#pp-province-current-food-storage\">P&amp;P: Province Current Food Storage<\/a> (growing vs shrinking)<\/li><li><a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> of the location<\/li><li>Winter severity<\/li><li><a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> and recovery conditions<\/li><li>Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)<\/li><\/ul>\n<p>See <span class=\"concept-ref\">Pp Food Storage<\/span> for how storage works.<\/p>\n<h3>Cheap food in the market and High food Storages in Provinces:<\/h3>\n<p>When food is cheap on the market and province storages are well stocked, locations receive <a class=\"concept-link\" href=\"#pp-cheap-food\">P&amp;P: Cheap Food in Location<\/a> and provinces with growing storage receive <a class=\"concept-link\" href=\"#pp-province-current-food-storage\">P&amp;P: Province Current Food Storage<\/a>. Effects scale by how far below the base price the food price is.<\/p>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Cheap Food In Location<\/span><\/p>\n<h3>Expensive food in the market and Low food Storages in Provinces:<\/h3>\n<p>When food is expensive on the market and province storages are low or empty, locations receive <a class=\"concept-link\" href=\"#pp-expensive-food\">P&amp;P: Expensive Food in Location<\/a>. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.<\/p>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Expensive Food In Location<\/span><\/p>\n<p>Food consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and <span class=\"concept-ref\">Population Growth<\/span>.<\/p>\n<h3>When You Run Out of food:<\/h3>\n<p>When storages are empty, a province receives <span class=\"token token-modifier\">Province Starving<\/span>. People try to feed themselves by any means necessary. <a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> crashes. Soldiers are less willing to defend <span class=\"concept-ref\">Starving<\/span> cities. See <span class=\"concept-ref\">Pp Food Storage<\/span> and <a class=\"concept-link\" href=\"#pp-starvation\">P&amp;P: Starvation<\/a>.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Province Starving<\/span><\/p>\n<h3>Devastation:<\/h3>\n<p><a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).<\/p>\n<p><span class=\"token token-effect\">modifier effects: Devastation<\/span><\/p>"},{"id":"pp-victuals","order":8,"filter":"victuals","filter_label":"New Trade Goods","concept_key":"pp_victuals","title_key":"game_concept_pp_victuals","body_key":"game_concept_pp_victuals_desc","title":"P&P: Food Goods","body_raw":"#T Two Food Goods#!\nProsper or Perish splits food into two goods.\n\n$BULLET$ #Y [ShowGoodsName('local_food')|e]#! is food eaten where it is made. It fills the province food store, feeds the province that produces it, and is never traded.\n$BULLET$ #Y [ShowGoodsName('victuals')|e]#! are preserved meals, provisions, and rations for civilians, armies, and navies. They keep and travel, so they are traded through the goods market. They only feed people once a province turns them back into food.\n\n#T Where They Come From#!\nEvery farm, fishery, orchard, and other calorie building has a Provisioning slot. It provisions the province with the building's own crop, turning it into [ShowGoodsName('local_food')|e]: more of it while the province store is low and less while it is full, when the land sends more of its crop to the goods market instead. [ShowBuildingTypeName('cookshop')|e] and [ShowBuildingTypeName('public_kitchen')|e] serve their dishes and drinks to the province as [ShowGoodsName('local_food')|e]. [ShowGoodsName('victuals')|e] come from the [ShowBuildingTypeName('grange')|e], which packs the lasting part of a full province store at the province capital (packing goods waste less of the food), and from the [ShowBuildingTypeName('victualling_yard')|e], which packs the grain shipped into a harbour. Exact conversion and method details are shown on the building tooltips. See [pp_new_buildings|e] for the building overview.\n\n#T Taverns, Granges and Victualling Yards#!\n[ShowBuildingTypeName('tavern')|e] buys [ShowGoodsName('victuals')|e] from the goods market and feeds the province with them. It earns more while the province store is low. [ShowBuildingTypeName('grange')|e] does the reverse: it packs the surplus of a well-stocked province into [ShowGoodsName('victuals')|e] for the goods market, and the dearer victuals are, the more of the store it is willing to pack. In a harbour the [ShowBuildingTypeName('victualling_yard')|e] packs shipped-in grain instead and leaves the province store alone. Packing loses some of the food, so victuals that go out and come back always return less than they took.\n\n#T Internal Food Goods#!\n[ShowGoodsName('province_food_sales')|e] pays the [ShowBuildingTypeName('grange')|e] for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it.","body_plain":"Two Food Goods\nProsper or Perish splits food into two goods.\n\n-  Local Food is food eaten where it is made. It fills the province food store, feeds the province that produces it, and is never traded.\n-  Victuals are preserved meals, provisions, and rations for civilians, armies, and navies. They keep and travel, so they are traded through the goods market. They only feed people once a province turns t
