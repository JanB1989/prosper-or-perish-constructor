>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Cheap Food In Location<\/span><\/p>"},{"id":"pp-expensive-food","order":24,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_expensive_food","title_key":"game_concept_pp_expensive_food","body_key":"game_concept_pp_expensive_food_desc","title":"P&P: Expensive Food in Location","body_raw":"When food is expensive on the market and province storages are low or empty, locations receive [ShowModifier('expensive_food_in_location')]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. These effects scale depending on how far above the base price the food price is: the more expensive it gets, the stronger the modifier. See [pp_food_consumption|e] for full context.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]","body_plain":"When food is expensive on the market and province storages are low or empty, locations receive Expensive Food In Location. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. These effects scale depending on how far above the base price the food price is: the more expensive it gets, the stronger the modifier. See Pp Food Consumption for full context.\n\nDisplay Note:\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\nExpensive Food In Location","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_expensive_food","file":"main_menu/common/game_concepts/other_changes_pp_expensive_food.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_expensive_food.txt"},"links":["pp_food_consumption"],"body_html":"<p>When food is expensive on the market and province storages are low or empty, locations receive <span class=\"token token-modifier\">Expensive Food In Location<\/span>. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. These effects scale depending on how far above the base price the food price is: the more expensive it gets, the stronger the modifier. See <a class=\"concept-link\" href=\"#pp-food-consumption\">P&amp;P: Food Consumption<\/a> for full context.<\/p>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Expensive Food In Location<\/span><\/p>"},{"id":"pp-starvation","order":25,"filter":"other_changes","filter_label":"Other Changes","concept_key":"pp_starvation","title_key":"game_concept_pp_starvation","body_key":"game_concept_pp_starvation_desc","title":"P&P: Starvation","body_raw":"When a province's food storage reaches 0, the pops will starve and die.\n\nThis gives the following effect:\n[ShowModifierEffect('province_starving')]","body_plain":"When a province's food storage reaches 0, the pops will starve and die.\n\nThis gives the following effect:\nProvince Starving","icon_texture":"gfx/interface/icons/flat_icons/military/bankruptcy.dds","definition":{"key":"pp_starvation","file":"main_menu/common/game_concepts/other_changes_pp_starvation.txt","line":2,"family":"food","texture":"flat_icons/military/bankruptcy","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/other_changes_pp_starvation.txt"},"links":[],"body_html":"<p>When a province&#x27;s food storage reaches 0, the pops will starve and die.<\/p>\n<p>This gives the following effect:<\/p>\n<p><span class=\"token token-effect\">modifier effects: Province Starving<\/span><\/p>"}]};
    const entriesEl = document.getElementById("entries");
    const filterButtonsEl = document.getElementById("filterButtons");
    const searchInput = document.getElementById("searchInput");
    const summaryMeta = document.getElementById("summaryMeta");
    let activeFilter = "all";

    function renderFilters() {
      filterButtonsEl.innerHTML = "";
      for (const filter of europediaPayload.filters) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.filter = filter.id;
        button.className = filter.id === activeFilter ? "active" : "";
        button.textContent = `${filter.label} (${filter.id === "all" ? europediaPayload.entries.length : filter.count})`;
        button.addEventListener("click", () => {
          activeFilter = filter.id;
          render();
        });
        filterButtonsEl.appendChild(button);
      }
    }

    function render() {
      renderFilters();
      const query = searchInput.value.trim().toLowerCase();
      const visibleEntries = europediaPayload.entries.filter(entry => {
        const matchesFilter = activeFilter === "all" || entry.filter === activeFilter;
        const haystack = `${entry.title} ${entry.body_plain} ${entry.title_key} ${entry.body_key}`.toLowerCase();
        return matchesFilter && (!query || haystack.includes(query));
      });
      summaryMeta.textContent = `${visibleEntries.length} of ${europediaPayload.entries.length} entries`;
      entriesEl.innerHTML = visibleEntries.length
        ? visibleEntries.map(entryHtml).join("")
        : '<div class="empty">No Europedia entries match the current filter.</div>';
    }

    function entryHtml(entry) {
      const iconLabel = entry.icon_texture ? entry.icon_texture.split("/").pop().replace(".dds", "") : "PP";
      const source = entry.definition?.file || entry.source.localization;
      return `
        <article class="entry" id="${escapeHtml(entry.id)}">
          <div class="entry-head">
            <div class="icon" title="${escapeHtml(entry.icon_texture || "")}">${escapeHtml(iconLabel.slice(0, 3).toUpperCase())}</div>
            <div>
              <h2>${escapeHtml(entry.title)}</h2>
              <div class="meta">${escapeHtml(entry.filter_label)} · ${escapeHtml(entry.concept_key)}</div>
            </div>
          </div>
          <div class="entry-body">
            ${entry.body_html}
            <div class="source-row">Source: ${escapeHtml(source)} · ${escapeHtml(entry.title_key)} / ${escapeHtml(entry.body_key)}</div>
          </div>
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(europediaPayload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "europedia_entries.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    searchInput.addEventListener("input", render);
    document.getElementById("exportJsonButton").addEventListener("click", exportJson);
    render();
  </script>
