    const europediaPayload = {"metadata":{"title":"Prosper or Perish Europedia","entry_count":25,"sources":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concepts":"main_menu/common/game_concepts"}},"filters":[{"id":"all","label":"All","count":25},{"id":"getting_started","label":"Getting Started","count":1},{"id":"faq","label":"F.A.Q.","count":1},{"id":"update_0_9","label":"Update 0.9","count":1},{"id":"overview","label":"Overview","count":1},{"id":"food_in_eu5","label":"Food in EU5","count":1},{"id":"food","label":"Food Production","count":1},{"id":"food_consumption","label":"Food Consumption","count":1},{"id":"victuals","label":"New Trade Goods","count":1},{"id":"cookery","label":"New Buildings","count":1},{"id":"building_limits","label":"Building Limits","count":1},{"id":"farm_capacity","label":"Rural Capacities","count":1},{"id":"farm_output","label":"Building Output","count":1},{"id":"harvest","label":"Variable Harvests","count":1},{"id":"pop_capacity","label":"Population Capacity","count":1},{"id":"pop_growth","label":"Population Growth","count":1},{"id":"pop_dist","label":"Population Distribution","count":1},{"id":"other_changes","label":"Other Changes","count":9}],"entries":[{"id":"pp-getting-started","order":1,"filter":"getting_started","filter_label":"Getting Started","concept_key":"pp_getting_started","title_key":"game_concept_pp_getting_started","body_key":"game_concept_pp_getting_started_desc","title":"Getting Started","body_raw":"#T Getting Started#!\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\n#T First, Check Your Settings#!\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\n#T Recommended Community Mods#!\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\n#T What to Pay Attention To#!\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n$BULLET$ 1. Turn the food slider low; do not bankrupt yourself.\n$BULLET$ 2. If food is expensive, you need more victuals. Cookeries produce these.\n$BULLET$ 3. If victuals are cheap but food is expensive, you need Victuals Markets. These convert victuals to local food. They become profitable if food is expensive and victuals are cheap.\n$BULLET$ 4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n$BULLET$ 5. If food is expensive, your population grows slower and you get less prosperity.\n\nEssentially everything is balanced around this idea.\n\n#T RGOs#!\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\n#T Variable Harvests#!\nThey happen yearly and make your crop production vary a lot.\n\n#T Map Modes#!\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\n#T Farming, Forest, and Fishing Capacity#!\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\n#T Location Potential#!\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\n#T Building Levels#!\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\n#T Food Revenue Good#!\nThis is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.","body_plain":"Getting Started\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\nFirst, Check Your Settings\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\nRecommended Community Mods\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\nWhat to Pay Attention To\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n-  1. Turn the food slider low; do not bankrupt yourself.\n-  2. If food is expensive, you need more victuals. Cookeries produce these.\n-  3. If victuals are cheap but food is expensive, you need Victuals Markets. These convert victuals to local food. They become profitable if food is expensive and victuals are cheap.\n-  4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n-  5. If food is expensive, your population grows slower and you get less prosperity.\n\nEssentially everything is balanced around this idea.\n\nRGOs\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\nVariable Harvests\nThey happen yearly and make your crop production vary a lot.\n\nMap Modes\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\nFarming, Forest, and Fishing Capacity\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\nLocation Potential\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\nBuilding Levels\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\nFood Revenue Good\nThis is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.","icon_texture":"gfx/interface/icons/flat_icons/effect.dds","definition":{"key":"pp_getting_started","file":"main_menu/common/game_concepts/pp_getting_started.txt","line":2,"family":"food","texture":"flat_icons/effect","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_getting_started.txt"},"links":[],"body_html":"<h3>Getting Started<\/h3>\n<p>If you are new or returning, the changes can be overwhelming because there are so many.<\/p>\n<h3>First, Check Your Settings<\/h3>\n<p>First check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.<\/p>\n<h3>Recommended Community Mods<\/h3>\n<p>I personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&amp;P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.<\/p>\n<h3>What to Pay Attention To<\/h3>\n<p>In general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.<\/p>\n<p>The most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.<\/p>\n<p>In simple terms, it always works like this:<\/p>\n<ul><li>1. Turn the food slider low; do not bankrupt yourself.<\/li><li>2. If food is expensive, you need more victuals. Cookeries produce these.<\/li><li>3. If victuals are cheap but food is expensive, you need Victuals Markets. These convert victuals to local food. They become profitable if food is expensive and victuals are cheap.<\/li><li>4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.<\/li><li>5. If food is expensive, your population grows slower and you get less prosperity.<\/li><\/ul>\n<p>Essentially everything is balanced around this idea.<\/p>\n<h3>RGOs<\/h3>\n<p>RGOs are removed and replaced by buildings. Buildings are just more interesting.<\/p>\n<h3>Variable Harvests<\/h3>\n<p>They happen yearly and make your crop production vary a lot.<\/p>\n<h3>Map Modes<\/h3>\n<p>Please familiarize yourself with the map modes. I added a lot. They are very helpful for many things.<\/p>\n<h3>Farming, Forest, and Fishing Capacity<\/h3>\n<p>There are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.<\/p>\n<h3>Location Potential<\/h3>\n<p>This is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.<\/p>\n<h3>Building Levels<\/h3>\n<p>You will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.<\/p>\n<p>Please use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.<\/p>\n<h3>Food Revenue Good<\/h3>\n<p>This is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.<\/p>"},{"id":"pp-faq","order":2,"filter":"faq","filter_label":"F.A.Q.","concept_key":"pp_faq","title_key":"game_concept_pp_faq","body_key":"game_concept_pp_faq_desc","title":"F.A.Q.","body_raw":"#T Q: Are my other mods compatible with Prosper or Perish?:#!\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\n#T Q: An update ruined my save. What do I do?:#!\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\n#T Q: How do I install the GitHub version?:#!\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\n#T Q: Why is everyone starving at game start?:#!\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.","body_plain":"Q: Are my other mods compatible with Prosper or Perish?:\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\nQ: An update ruined my save. What do I do?:\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\nQ: How do I install the GitHub version?:\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\nQ: Why is everyone starving at game start?:\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.","icon_texture":"gfx/interface/icons/flat_icons/effect.dds","definition":{"key":"pp_faq","file":"main_menu/common/game_concepts/pp_faq.txt","line":2,"family":"food","texture":"flat_icons/effect","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_faq.txt"},"links":[],"body_html":"<h3>Q: Are my other mods compatible with Prosper or Perish?:<\/h3>\n<p>I recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.<\/p>\n<h3>Q: An update ruined my save. What do I do?:<\/h3>\n<p>Steam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth &amp; Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.<\/p>\n<h3>Q: How do I install the GitHub version?:<\/h3>\n<p>Go to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository&#x27;s mod folder, and copy the Prosper or Perish (Population Growth &amp; Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.<\/p>\n<h3>Q: Why is everyone starving at game start?:<\/h3>\n<p>I put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go.<\/p>"},{"id":"pp-update-0-9","order":3,"filter":"update_0_9","filter_label":"Update 0.9","concept_key":"pp_update_0_9","title_key":"game_concept_pp_update_0_9","body_key":"game_concept_pp_update_0_9_desc","title":"Update 0.9","body_raw":"#T Update 0.9#!\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\n#T Biggest Changes from 0.8#!\n$BULLET$ #Y 1. The location building cost malus is gone.#! It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n$BULLET$ #Y 2. Victuals Markets and Food Revenue.#! It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now produces a good called Food Revenue. This is not your usual good. It serves no purpose other than to locally create conditions where converting victuals to food can be profitable if victuals are cheap and the market food price is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n$BULLET$ #Y 3. Please use the Community Mod Framework.#! I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n$BULLET$ #Y 4. Bigger and more urbanized cities.#! In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy.","body_plain":"Update 0.9\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\nBiggest Changes from 0.8\n-  1. The location building cost malus is gone. It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n-  2. Victuals Markets and Food Revenue. It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now produces a good called Food Revenue. This is not your usual good. It serves no purpose other than to locally create conditions where converting victuals to food can be profitable if victuals are cheap and the market food price is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n-  3. Please use the Community Mod Framework. I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n-  4. Bigger and more urbanized cities. In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_update_0_9","file":"main_menu/common/game_concepts/pp_update_0_9.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_update_0_9.txt"},"links":[],"body_html":"<h3>Update 0.9<\/h3>\n<p>Hey guys,<\/p>\n<p>Read the Overview page to see roughly what changed. Most should be familiar.<\/p>\n<p>I spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.<\/p>\n<p>Of course, I added new buildings, new production methods, new advances, and more.<\/p>\n<h3>Biggest Changes from 0.8<\/h3>\n<ul><li><strong>1. The location building cost malus is gone.<\/strong> It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.<\/li><\/ul>\n<ul><li><strong>2. Victuals Markets and Food Revenue.<\/strong> It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread &quot;Food feedback&quot;. This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now produces a good called Food Revenue. This is not your usual good. It serves no purpose other than to locally create conditions where converting victuals to food can be profitable if victuals are cheap and the market food price is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.<\/li><\/ul>\n<ul><li><strong>3. Please use the Community Mod Framework.<\/strong> I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.<\/li><\/ul>\n<ul><li><strong>4. Bigger and more urbanized cities.<\/strong> In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.<\/li><\/ul>\n<p>Otherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.<\/p>\n<p>If you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.<\/p>\n<p>I hope you enjoy.<\/p>"},{"id":"prosper-perish-mod","order":4,"filter":"overview","filter_label":"Overview","concept_key":"prosper_perish_mod","title_key":"game_concept_prosper_perish_mod","body_key":"game_concept_prosper_perish_mod_desc","title":"Prosper or Perish (Mod)","body_raw":"#T The Mod:#!\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to [pp_prosperity|e], Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and a new Trade good. When you create a new game, check the game rules for Prosper or Perish: you can disable [pp_variable_harvests|e] if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least [pp_food|e] and [pp_food_consumption|e]; they should be enough to get you playing.\n\n#T Feedback:#!\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookery recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\n#T How I Add Features:#!\nI follow this checklist:\n\n$BULLET$ Is the mechanic fun to manage for the player?\n$BULLET$ Is the mechanic a concept that can be understood historically?\n$BULLET$ Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\n#T Thanks:#!\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5.","body_plain":"The Mod:\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to Pp Prosperity, Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and a new Trade good. When you create a new game, check the game rules for Prosper or Perish: you can disable Pp Variable Harvests if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least Pp Food and Pp Food Consumption; they should be enough to get you playing.\n\nFeedback:\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookery recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\nHow I Add Features:\nI follow this checklist:\n\n-  Is the mechanic fun to manage for the player?\n-  Is the mechanic a concept that can be understood historically?\n-  Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\nThanks:\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"prosper_perish_mod","file":"main_menu/common/game_concepts/pp_overview.txt","line":3,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":["prosper_or_perish"]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_overview.txt"},"links":["pp_food","pp_food_consumption","pp_prosperity","pp_variable_harvests"],"body_html":"<h3>The Mod:<\/h3>\n<p>This mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a>, Development and similar factors, which instead now shape food capacity and growth.<\/p>\n<p>You will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric &quot;clumping,&quot; and higher infrastructure costs so Roads become a strategic choice rather than something to spam.<\/p>\n<p>The core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.<\/p>\n<p>The mod adds new Buildings, new production methods and a new Trade good. When you create a new game, check the game rules for Prosper or Perish: you can disable <span class=\"concept-ref\">Pp Variable Harvests<\/span> if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.<\/p>\n<p>Please read at least <a class=\"concept-link\" href=\"#pp-food\">P&amp;P: Food Production<\/a> and <a class=\"concept-link\" href=\"#pp-food-consumption\">P&amp;P: Food Consumption<\/a>; they should be enough to get you playing.<\/p>\n<h3>Feedback:<\/h3>\n<p>I really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookery recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.<\/p>\n<p>There are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.<\/p>\n<h3>How I Add Features:<\/h3>\n<p>I follow this checklist:<\/p>\n<ul><li>Is the mechanic fun to manage for the player?<\/li><li>Is the mechanic a concept that can be understood historically?<\/li><li>Is the AI able to handle the mechanic?<\/li><\/ul>\n<p>I am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs &quot;more&quot; food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.<\/p>\n<h3>Thanks:<\/h3>\n<p>A sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.<\/p>\n<p>A special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.<\/p>\n<p>Thanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.<\/p>\n<p>And a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&amp;P, and for always being ready to chat and excited to talk about EU5.<\/p>"},{"id":"pp-food-in-eu5","order":5,"filter":"food_in_eu5","filter_label":"Food in EU5","concept_key":"pp_food_in_eu5","title_key":"game_concept_pp_food_in_eu5","body_key":"game_concept_pp_food_in_eu5_desc","title":"Food in EU5","body_raw":"#T Food in Vanilla EU5:#!\nFood in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.\n\nVanilla food has three main sources:\n\n$BULLET$ #Y Food goods#! such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good's food value.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants. This creates food directly and is not tied to a trade good.\n$BULLET$ #Y Flat food sources#! from buildings. These create food directly and are not tied to a food trade good.\n\nThose sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.\n\nLocations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.\n\nThe biggest problems are:\n\n$BULLET$ A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.\n$BULLET$ Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.\n$BULLET$ Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.\n$BULLET$ Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.\n\n#T Prosper or Perish:#!\nProsper or Perish keeps the same broad food-storage system, but changes what feeds it.\n\nFood sources in Prosper or Perish are:\n\n$BULLET$ #Y [ShowGoodsName('victuals')|e]#!, the main food good. It represents meals, rations, and preserved provisions.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants, as in vanilla.\n$BULLET$ #Y Absolute food sources#! from buildings such as [ShowBuildingTypeName('victuals_market')|e].\n\nHow the P&P system works:\n\n$BULLET$ Food productivity is removed. The goal is to keep [ShowGoodsName('victuals')|e] in the goods market connected to actual food availability.\n$BULLET$ Excess [ShowGoodsName('victuals')|e] can be converted into local food through [ShowBuildingTypeName('victuals_market')|e], or used by buildings such as docks and armories as rations and supplies.\n$BULLET$ [ShowBuildingTypeName('cookery')|e] turns many regional food goods into [ShowGoodsName('victuals')|e], so surplus grain, meat, fish, salt, and similar goods can feed the food chain through the goods market.\n$BULLET$ Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.\n\nFor the practical P&P production chain, see [pp_food|e]. For local raw-material productivity, see [pp_farm_output|e].","body_plain":"Food in Vanilla EU5:\nFood in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.\n\nVanilla food has three main sources:\n\n-  Food goods such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good's food value.\n-  Subsistence agriculture from unemployed peasants. This creates food directly and is not tied to a trade good.\n-  Flat food sources from buildings. These create food directly and are not tied to a food trade good.\n\nThose sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.\n\nLocations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.\n\nThe biggest problems are:\n\n-  A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.\n-  Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.\n-  Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.\n-  Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.\n\nProsper or Perish:\nProsper or Perish keeps the same broad food-storage system, but changes what feeds it.\n\nFood sources in Prosper or Perish are:\n\n-  Victuals, the main food good. It represents meals, rations, and preserved provisions.\n-  Subsistence agriculture from unemployed peasants, as in vanilla.\n-  Absolute food sources from buildings such as Victuals Market.\n\nHow the P&P system works:\n\n-  Food productivity is removed. The goal is to keep Victuals in the goods market connected to actual food availability.\n-  Excess Victuals can be converted into local food through Victuals Market, or used by buildings such as docks and armories as rations and supplies.\n-  Cookery turns many regional food goods into Victuals, so surplus grain, meat, fish, salt, and similar goods can feed the food chain through the goods market.\n-  Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.\n\nFor the practical P&P production chain, see Pp Food. For local raw-material productivity, see Pp Farm Output.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food_in_eu5","file":"main_menu/common/game_concepts/pp_food_in_eu5.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_in_eu5.txt"},"links":["pp_farm_output","pp_food"],"body_html":"<h3>Food in Vanilla EU5:<\/h3>\n<p>Food in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.<\/p>\n<p>Vanilla food has three main sources:<\/p>\n<ul><li><strong>Food goods<\/strong> such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good&#x27;s food value.<\/li><li><strong>Subsistence agriculture<\/strong> from unemployed peasants. This creates food directly and is not tied to a trade good.<\/li><li><strong>Flat food sources<\/strong> from buildings. These create food directly and are not tied to a food trade good.<\/li><\/ul>\n<p>Those sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.<\/p>\n<p>Locations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.<\/p>\n<p>The biggest problems are:<\/p>\n<ul><li>A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.<\/li><li>Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.<\/li><li>Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.<\/li><li>Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.<\/li><\/ul>\n<h3>Prosper or Perish:<\/h3>\n<p>Prosper or Perish keeps the same broad food-storage system, but changes what feeds it.<\/p>\n<p>Food sources in Prosper or Perish are:<\/p>\n<ul><li><strong><span class=\"token token-good\">Victuals<\/span><\/strong>, the main food good. It represents meals, rations, and preserved provisions.<\/li><li><strong>Subsistence agriculture<\/strong> from unemployed peasants, as in vanilla.<\/li><li><strong>Absolute food sources<\/strong> from buildings such as <span class=\"token token-building\">Victuals Market<\/span>.<\/li><\/ul>\n<p>How the P&amp;P system works:<\/p>\n<ul><li>Food productivity is removed. The goal is to keep <span class=\"token token-good\">Victuals<\/span> in the goods market connected to actual food availability.<\/li><li>Excess <span class=\"token token-good\">Victuals<\/span> can be converted into local food through <span class=\"token token-building\">Victuals Market<\/span>, or used by buildings such as docks and armories as rations and supplies.<\/li><li><span class=\"token token-building\">Cookery<\/span> turns many regional food goods into <span class=\"token token-good\">Victuals<\/span>, so surplus grain, meat, fish, salt, and similar goods can feed the food chain through the goods market.<\/li><li>Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.<\/li><\/ul>\n<p>For the practical P&amp;P production chain, see <a class=\"concept-link\" href=\"#pp-food\">P&amp;P: Food Production<\/a>. For local raw-material productivity, see <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>.<\/p>"},{"id":"pp-food","order":6,"filter":"food","filter_label":"Food Production","concept_key":"pp_food","title_key":"game_concept_pp_food","body_key":"game_concept_pp_food_desc","title":"P&P: Food Production","body_raw":"#T What This Page Covers:#!\nThis page is about producing food in Prosper or Perish. For the vanilla food system and why P&P changes it, see [pp_food_in_eu5|e].\n\n#T Food Sources:#!\nP&P food comes from three places:\n\n$BULLET$ [ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e] refine regional goods into [ShowGoodsName('victuals')|e]. Since [ShowGoodsName('victuals')|e] have food value, producing them also creates food.\n$BULLET$ [ShowBuildingTypeName('victuals_market')|e] converts [ShowGoodsName('victuals')|e] into local food for the province.\n$BULLET$ Unemployed peasants still produce a small amount of subsistence food directly.\n\n#T The Production Chain:#!\nThe intended chain is simple:\n\n$BULLET$ Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.\n$BULLET$ Turn those goods into [ShowGoodsName('victuals')|e] through [ShowBuildingTypeName('cookery')|e].\n$BULLET$ Use [ShowBuildingTypeName('victuals_market')|e] where a province needs direct local food.\n\n[ShowGoodsName('victuals')|e] are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.\n\n#T Local Production:#!\nFood productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.\n\nUse building tooltips, local output map modes, [pp_farm_output|e], and [pp_variable_harvests|e] to understand what a location is good at producing.\n\n#T Practical Rule:#!\nIf a province struggles with food, check whether it has enough raw food inputs, enough [ShowBuildingTypeName('cookery')|e] capacity, enough [ShowGoodsName('victuals')|e], and enough [ShowBuildingTypeName('victuals_market')|e] levels.","body_plain":"What This Page Covers:\nThis page is about producing food in Prosper or Perish. For the vanilla food system and why P&P changes it, see Pp Food In Eu5.\n\nFood Sources:\nP&P food comes from three places:\n\n-  Cookery and Victualling Yard refine regional goods into Victuals. Since Victuals have food value, producing them also creates food.\n-  Victuals Market converts Victuals into local food for the province.\n-  Unemployed peasants still produce a small amount of subsistence food directly.\n\nThe Production Chain:\nThe intended chain is simple:\n\n-  Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.\n-  Turn those goods into Victuals through Cookery.\n-  Use Victuals Market where a province needs direct local food.\n\nVictuals are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.\n\nLocal Production:\nFood productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.\n\nUse building tooltips, local output map modes, Pp Farm Output, and Pp Variable Harvests to understand what a location is good at producing.\n\nPractical Rule:\nIf a province struggles with food, check whether it has enough raw food inputs, enough Cookery capacity, enough Victuals, and enough Victuals Market levels.","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food","file":"main_menu/common/game_concepts/pp_food_production.txt","line":3,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_production.txt"},"links":["pp_farm_output","pp_food_in_eu5","pp_variable_harvests"],"body_html":"<h3>What This Page Covers:<\/h3>\n<p>This page is about producing food in Prosper or Perish. For the vanilla food system and why P&amp;P changes it, see <a class=\"concept-link\" href=\"#pp-food-in-eu5\">Food in EU5<\/a>.<\/p>\n<h3>Food Sources:<\/h3>\n<p>P&amp;P food comes from three places:<\/p>\n<ul><li><span class=\"token token-building\">Cookery<\/span> and <span class=\"token token-building\">Victualling Yard<\/span> refine regional goods into <span class=\"token token-good\">Victuals<\/span>. Since <span class=\"token token-good\">Victuals<\/span> have food value, producing them also creates food.<\/li><li><span class=\"token token-building\">Victuals Market<\/span> converts <span class=\"token token-good\">Victuals<\/span> into local food for the province.<\/li><li>Unemployed peasants still produce a small amount of subsistence food directly.<\/li><\/ul>\n<h3>The Production Chain:<\/h3>\n<p>The intended chain is simple:<\/p>\n<ul><li>Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.<\/li><li>Turn those goods into <span class=\"token token-good\">Victuals<\/span> through <span class=\"token token-building\">Cookery<\/span>.<\/li><li>Use <span class=\"token token-building\">Victuals Market<\/span> where a province needs direct local food.<\/li><\/ul>\n<p><span class=\"token token-good\">Victuals<\/span> are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.<\/p>\n<h3>Local Production:<\/h3>\n<p>Food productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.<\/p>\n<p>Use building tooltips, local output map modes, <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>, and <span class=\"concept-ref\">Pp Variable Harvests<\/span> to understand what a location is good at producing.<\/p>\n<h3>Practical Rule:<\/h3>\n<p>If a province struggles with food, check whether it has enough raw food inputs, enough <span class=\"token token-building\">Cookery<\/span> capacity, enough <span class=\"token token-good\">Victuals<\/span>, and enough <span class=\"token token-building\">Victuals Market<\/span> levels.<\/p>"},{"id":"pp-food-consumption","order":7,"filter":"food_consumption","filter_label":"Food Consumption","concept_key":"pp_food_consumption","title_key":"game_concept_pp_food_consumption","body_key":"game_concept_pp_food_consumption_desc","title":"P&P: Food Consumption","body_raw":"There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.\n\nFood consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.\n\n#T What Impacts Food Consumption:#!\nSeveral factors change how much pops consume:\n\n$BULLET$ Local food price on the market (cheap vs expensive)\n$BULLET$ [pp_province_current_food_storage|e] (growing vs shrinking)\n$BULLET$ [pp_prosperity|e] of the location\n$BULLET$ Winter severity\n$BULLET$ [pp_devastation|e] and recovery conditions\n$BULLET$ Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)\n\nSee [pp_food_storage|e] for how storage works.\n\n#T Cheap food in the market and High food Storages in Provinces:#!\nWhen food is cheap on the market and province storages are well stocked, locations receive [pp_cheap_food|e] and provinces with growing storage receive [pp_province_current_food_storage|e]. Effects scale by how far below the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('cheap_food_in_location')]\n\n#T Expensive food in the market and Low food Storages in Provinces:#!\nWhen food is expensive on the market and province storages are low or empty, locations receive [pp_expensive_food|e]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]\n\nFood consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. [pp_prosperity|e] reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and [population_growth|e].\n\n#T When You Run Out of food:#!\nWhen storages are empty, a province receives [ShowModifier('province_starving')]. People try to feed themselves by any means necessary. [pp_devastation|e] tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. [pp_prosperity|e] crashes. Soldiers are less willing to defend [starving|e] cities. See [pp_food_storage|e] and [pp_starvation|e].\n\n[ShowModifierEffect('province_starving')]\n\n#T Devastation:#!\n[pp_devastation|e] is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).\n\n[ShowModifierEffect('devastation')]","body_plain":"There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.\n\nFood consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.\n\nWhat Impacts Food Consumption:\nSeveral factors change how much pops consume:\n\n-  Local food price on the market (cheap vs expensive)\n-  Pp Province Current Food Storage (growing vs shrinking)\n-  Pp Prosperity of the location\n-  Winter severity\n-  Pp Devastation and recovery conditions\n-  Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)\n\nSee Pp Food Storage for how storage works.\n\nCheap food in the market and High food Storages in Provinces:\nWhen food is cheap on the market and province storages are well stocked, locations receive Pp Cheap Food and provinces with growing storage receive Pp Province Current Food Storage. Effects scale by how far below the base price the food price is.\n\nDisplay Note:\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\nCheap Food In Location\n\nExpensive food in the market and Low food Storages in Provinces:\nWhen food is expensive on the market and province storages are low or empty, locations receive Pp Expensive Food. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.\n\nDisplay Note:\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\nExpensive Food In Location\n\nFood consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. Pp Prosperity reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and Population Growth.\n\nWhen You Run Out of food:\nWhen storages are empty, a province receives Province Starving. People try to feed themselves by any means necessary. Pp Devastation tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. Pp Prosperity crashes. Soldiers are less willing to defend Starving cities. See Pp Food Storage and Pp Starvation.\n\nProvince Starving\n\nDevastation:\nPp Devastation is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).\n\nDevastation","icon_texture":"gfx/interface/icons/flat_icons/trade_market/food_stockpile.dds","definition":{"key":"pp_food_consumption","file":"main_menu/common/game_concepts/pp_food_consumption.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_food_consumption.txt"},"links":["population_growth","pp_cheap_food","pp_devastation","pp_expensive_food","pp_food_storage","pp_prosperity","pp_province_current_food_storage","pp_starvation","starving"],"body_html":"<p>There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.<\/p>\n<p>Food consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.<\/p>\n<h3>What Impacts Food Consumption:<\/h3>\n<p>Several factors change how much pops consume:<\/p>\n<ul><li>Local food price on the market (cheap vs expensive)<\/li><li><a class=\"concept-link\" href=\"#pp-province-current-food-storage\">P&amp;P: Province Current Food Storage<\/a> (growing vs shrinking)<\/li><li><a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> of the location<\/li><li>Winter severity<\/li><li><a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> and recovery conditions<\/li><li>Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)<\/li><\/ul>\n<p>See <span class=\"concept-ref\">Pp Food Storage<\/span> for how storage works.<\/p>\n<h3>Cheap food in the market and High food Storages in Provinces:<\/h3>\n<p>When food is cheap on the market and province storages are well stocked, locations receive <a class=\"concept-link\" href=\"#pp-cheap-food\">P&amp;P: Cheap Food in Location<\/a> and provinces with growing storage receive <a class=\"concept-link\" href=\"#pp-province-current-food-storage\">P&amp;P: Province Current Food Storage<\/a>. Effects scale by how far below the base price the food price is.<\/p>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Cheap Food In Location<\/span><\/p>\n<h3>Expensive food in the market and Low food Storages in Provinces:<\/h3>\n<p>When food is expensive on the market and province storages are low or empty, locations receive <a class=\"concept-link\" href=\"#pp-expensive-food\">P&amp;P: Expensive Food in Location<\/a>. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.<\/p>\n<h3>Display Note:<\/h3>\n<p>Because of Paradox scaling, the maximum value you can actually get is only half of the value shown below.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Expensive Food In Location<\/span><\/p>\n<p>Food consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and <span class=\"concept-ref\">Population Growth<\/span>.<\/p>\n<h3>When You Run Out of food:<\/h3>\n<p>When storages are empty, a province receives <span class=\"token token-modifier\">Province Starving<\/span>. People try to feed themselves by any means necessary. <a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. <a class=\"concept-link\" href=\"#pp-prosperity\">P&amp;P: Prosperity<\/a> crashes. Soldiers are less willing to defend <span class=\"concept-ref\">Starving<\/span> cities. See <span class=\"concept-ref\">Pp Food Storage<\/span> and <a class=\"concept-link\" href=\"#pp-starvation\">P&amp;P: Starvation<\/a>.<\/p>\n<p><span class=\"token token-effect\">modifier effects: Province Starving<\/span><\/p>\n<h3>Devastation:<\/h3>\n<p><a class=\"concept-link\" href=\"#pp-devastation\">P&amp;P: Devastation<\/a> is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).<\/p>\n<p><span class=\"token token-effect\">modifier effects: Devastation<\/span><\/p>"},{"id":"pp-victuals","order":8,"filter":"victuals","filter_label":"New Trade Goods","concept_key":"pp_victuals","title_key":"game_concept_pp_victuals","body_key":"game_concept_pp_victuals_desc","title":"P&P: New Trade Goods","body_raw":"#T Victuals#!\n[ShowGoodsName('victuals')|e] are prepared meals, provisions, and rations for civilians, armies, and navies.\n\nThey are produced by [ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e], then distributed locally as food through [ShowBuildingTypeName('victuals_market')|e]. Exact conversion and method details are shown on the building tooltips. See [pp_cookery|e] for the building overview.\n\n#T Food Revenue#!\n[ShowGoodsName('food_revenue')|e] is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.","body_plain":"Victuals\nVictuals are prepared meals, provisions, and rations for civilians, armies, and navies.\n\nThey are produced by Cookery and Victualling Yard, then distributed locally as food through Victuals Market. Exact conversion and method details are shown on the building tooltips. See Pp Cookery for the building overview.\n\nFood Revenue\nFood Revenue is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.","icon_texture":"gfx/interface/icons/trade_goods/icon_goods_victuals.dds","definition":{"key":"pp_victuals","file":"main_menu/common/game_concepts/pp_new_trade_goods.txt","line":2,"family":"food","texture":"flat_icons/trade_market/food_stockpile","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_new_trade_goods.txt"},"links":["pp_cookery"],"body_html":"<h3>Victuals<\/h3>\n<p><span class=\"token token-good\">Victuals<\/span> are prepared meals, provisions, and rations for civilians, armies, and navies.<\/p>\n<p>They are produced by <span class=\"token token-building\">Cookery<\/span> and <span class=\"token token-building\">Victualling Yard<\/span>, then distributed locally as food through <span class=\"token token-building\">Victuals Market<\/span>. Exact conversion and method details are shown on the building tooltips. See <a class=\"concept-link\" href=\"#pp-cookery\">P&amp;P: New Buildings<\/a> for the building overview.<\/p>\n<h3>Food Revenue<\/h3>\n<p><span class=\"token token-good\">Food Revenue<\/span> is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that.<\/p>"},{"id":"pp-cookery","order":9,"filter":"cookery","filter_label":"New Buildings","concept_key":"pp_cookery","title_key":"game_concept_pp_cookery","body_key":"game_concept_pp_cookery_desc","title":"P&P: New Buildings","body_raw":"#T P&P Buildings#!\nProsper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.\n\n#T Victuals Buildings:#!\n[ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e] refine regional food goods into [ShowGoodsName('victuals')|e]: meals, provisions, and rations. [ShowBuildingTypeName('victuals_market')|e] distributes those victuals locally as food for the population.\n\n#T Non-Farming Raw Goods:#!\nNon-farming raw-good buildings, such as [ShowBuildingTypeName('iron_mine')|e], usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.\n\nMany deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.\n\nSome buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt [population_growth|e] because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.\n\n#T Agriculture:#!\nAgricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.\n\nFor whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see [pp_farm_capacity|e]. For how productive they are, see [pp_farm_output|e].","body_plain":"P&P Buildings\nProsper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.\n\nVictuals Buildings:\nCookery and Victualling Yard refine regional food goods into Victuals: meals, provisions, and rations. Victuals Market distributes those victuals locally as food for the population.\n\nNon-Farming Raw Goods:\nNon-farming raw-good buildings, such as Iron Mine, usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.\n\nMany deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.\n\nSome buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt Population Growth because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.\n\nAgriculture:\nAgricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.\n\nFor whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see Pp Farm Capacity. For how productive they are, see Pp Farm Output.","icon_texture":"gfx/interface/icons/flat_icons/balance/buildings_abroad.dds","definition":{"key":"pp_cookery","file":"main_menu/common/game_concepts/pp_new_buildings.txt","line":2,"family":"food","texture":"flat_icons/balance/buildings_abroad","aliases":[]},"source":{"gui":"in_game/gui/encyclopedia_lateralview.gui","localization":"main_menu/localization/english/pp_europedia_l_english.yml","concept":"main_menu/common/game_concepts/pp_new_buildings.txt"},"links":["population_growth","pp_farm_capacity","pp_farm_output"],"body_html":"<h3>P&amp;P Buildings<\/h3>\n<p>Prosper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.<\/p>\n<h3>Victuals Buildings:<\/h3>\n<p><span class=\"token token-building\">Cookery<\/span> and <span class=\"token token-building\">Victualling Yard<\/span> refine regional food goods into <span class=\"token token-good\">Victuals<\/span>: meals, provisions, and rations. <span class=\"token token-building\">Victuals Market<\/span> distributes those victuals locally as food for the population.<\/p>\n<h3>Non-Farming Raw Goods:<\/h3>\n<p>Non-farming raw-good buildings, such as <span class=\"token token-building\">Iron Mine<\/span>, usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.<\/p>\n<p>Many deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.<\/p>\n<p>Some buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt <span class=\"concept-ref\">Population Growth<\/span> because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.<\/p>\n<h3>Agriculture:<\/h3>\n<p>Agricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.<\/p>\n<p>For whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see <a class=\"concept-link\" href=\"#pp-farm-capacity\">P&amp;P: Farming/Fishing/Forest Capacities<\/a>. For how productive they are, see <a class=\"concept-link\" href=\"#pp-farm-output\">P&amp;P: Building Output<\/a>.<\/p>"},{"id":"pp-building-limits","order":10,"filter":"building_limits","filter_label":"Building Limits","concept_key":"pp_building_limits","title_key":"game_concept_pp_building_limits","body_key":"game_concept_pp_building_limits_desc","title":"Building Limits","body_raw":"#T Building Limits#!\nThe old location building cost malus is gone. It is replaced by the logistics system. Every location has a limit for how many building levels are easy to supply, depending on things like vegetation, topography, rivers, coasts, roads, development, and more.\n\nYou can still overbuild. If a location goes over its supported building levels, it gets [ShowModifier('unsupported_building_levels')]. Use the Unsupported Building Levels map mode to find the places that need help.\n\n#T Logistics Buildings#!\nThese buildings increase the supported building levels. Build the one that fits the place:\n\n$BULLET$ [ShowBuildingTypeName('river_boatmen_yard')|e] on rivers. Big rivers are much better.\n$BULLET$ [ShowBuildingTypeName('coastal_shipping_office')|e] in ports. Natural harbors are better.\n$BULLET$ [ShowBuildingTypeName('transport_office')|e] in developed towns and cities.\n$BULLET$ [ShowBuildingTypeName('carrier_inn')|e] in rural settlements and towns with roads.\n\nThat is the idea. Big rivers, ports, and cities are easy to supply. Landlocked jungle is not. If a place is red on the map mode, build logistics there before you keep stacking industry.","body_plain":"Building Limits\nThe old location building cost malus is gone. It is replaced by the logistics syst
