<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savegame Map Playback</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f2;
      color: #1f1f1d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f2;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(160px, 260px) auto auto 1fr minmax(64px, 92px);
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(247, 247, 242, 0.96);
      border-bottom: 1px solid #d2d2c8;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
    }
    select, button, input {
      font: inherit;
    }
    select, button {
      min-height: 36px;
      border: 1px solid #9e9e94;
      background: #fff;
      color: #1f1f1d;
      border-radius: 4px;
      padding: 0 10px;
    }
    button {
      cursor: pointer;
      font-weight: 650;
    }
    .assetLinks {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .assetLinks[hidden] {
      display: none;
    }
    .assetLinks a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #9e9e94;
      border-radius: 4px;
      padding: 0 10px;
      background: #fff;
      color: #1f1f1d;
      text-decoration: none;
      font-weight: 650;
      white-space: nowrap;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #2a5a96;
    }
    #yearLabel {
      font-size: 18px;
      font-weight: 750;
      text-align: right;
      white-space: nowrap;
    }
    .stage {
      padding: 16px;
      overflow: auto;
    }
    #mapImage {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      background: #ecece5;
    }
    @media (max-width: 760px) {
      .toolbar {
        grid-template-columns: 1fr auto;
      }
      #assetLinks {
        grid-column: 1 / -1;
      }
      #frameSlider {
        grid-column: 1 / -1;
      }
      #yearLabel {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <select id="mapSelect" aria-label="Map"></select>
    <button id="playButton" type="button">Play</button>
    <div id="assetLinks" class="assetLinks" aria-label="Exports"></div>
    <input id="frameSlider" type="range" min="0" max="0" value="0" step="1" aria-label="Frame">
    <div id="yearLabel"></div>
  </div>
  <main class="stage">
    <img id="mapImage" alt="Savegame map frame">
  </main>

    const mapSelect = document.getElementById("mapSelect");
    const playButton = document.getElementById("playButton");
    const assetLinks = document.getElementById("assetLinks");
    const slider = document.getElementById("frameSlider");
    const yearLabel = document.getElementById("yearLabel");
    const image = document.getElementById("mapImage");
    let activeMap = 0;
    let activeFrame = 0;
    let timer = null;

    function currentFrames() {
      return DATA.maps[activeMap]?.frames || [];
    }

    function render() {
      const frames = currentFrames();
      slider.max = Math.max(frames.length - 1, 0);
      slider.value = Math.min(activeFrame, frames.length - 1);
      const frame = frames[Math.min(activeFrame, frames.length - 1)];
      if (!frame) {
        image.removeAttribute("src");
        yearLabel.textContent = "";
        return;
      }
      image.src = frame.url;
      yearLabel.textContent = frame.year;
    }

    function setPlaying(playing) {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      playButton.textContent = playing ? "Pause" : "Play";
      if (playing) {
        timer = setInterval(() => {
          const frames = currentFrames();
          if (!frames.length) return;
          activeFrame = (activeFrame + 1) % frames.length;
          render();
        }, 500);
      }
    }

    DATA.maps.forEach((map, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = map.label;
      mapSelect.appendChild(option);
    });
    (DATA.assets || []).forEach((asset) => {
      const link = document.createElement("a");
      link.href = asset.url;
      link.textContent = asset.label;
      link.target = "_blank";
      link.rel = "noopener";
      assetLinks.appendChild(link);
    });
    assetLinks.hidden = assetLinks.children.length === 0;

    mapSelect.addEventListener("change", () => {
      activeMap = Number(mapSelect.value) || 0;
      activeFrame = 0;
      render();
    });
    slider.addEventListener("input", () => {
      activeFrame = Number(slider.value) || 0;
      render();
    });
    playButton.addEventListener("click", () => setPlaying(timer === null));
    document.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const frames = currentFrames();
      if (!frames.length) return;
      activeFrame += event.key === "ArrowRight" ? 1 : -1;
      activeFrame = (activeFrame + frames.length) % frames.length;
      render();
    });
    render();
  </script>
