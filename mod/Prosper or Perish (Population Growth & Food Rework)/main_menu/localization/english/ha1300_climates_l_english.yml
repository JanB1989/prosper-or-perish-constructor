l_english:
 ha1300_climate_tropical_monsoon: "Tropical Monsoon"
 ha1300_climate_tropical_monsoon_desc: "Hot throughout the year, with a very wet monsoon and a shorter dry season."
 ha1300_climate_savanna: "Savanna"
 ha1300_climate_savanna_desc: "Hot throughout the year, with alternating wet and dry seasons."
 ha1300_climate_subtropical_monsoon: "Subtropical Monsoon"
 ha1300_climate_subtropical_monsoon_desc: "Hot, wet summers and a distinctly drier, cooler winter."
 ha1300_climate_highland_monsoon: "Highland Monsoon"
 ha1300_climate_highland_monsoon_desc: "Moderate to cool summers, with summer rains and a dry winter. Common in elevated tropical and subtropical regions."
 ha1300_climate_subpolar_oceanic: "Subpolar Oceanic"
 ha1300_climate_subpolar_oceanic_desc: "Short, cool summers and a maritime cold season, with rainfall throughout the year."
 ha1300_climate_dry_summer_continental: "Dry-summer Continental"
 ha1300_climate_dry_summer_continental_desc: "Warm summers with a dry season, followed by cold winters. Rain and snow fall mainly outside summer."
 ha1300_climate_continental_monsoon: "Continental Monsoon"
 ha1300_climate_continental_monsoon_desc: "Warm to hot, wet summers and cold, comparatively dry winters."
