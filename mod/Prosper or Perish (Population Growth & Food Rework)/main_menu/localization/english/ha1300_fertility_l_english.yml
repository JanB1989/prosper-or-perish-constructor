l_english:
 game_concept_ha1300_fertility: "Fertility"
 game_concept_ha1300_fertility_desc: "Fertility describes how much food the best-suited staple crop yields per hectare under traditional low-input farming, combining climate, soil and terrain. It is separate from soil type and from existing cultivation or improvements. The five grades are Very low, Low, Moderate, High and Very high."
 HA1300_FERTILITY_UNKNOWN: "Unassigned"
 HA1300_FERTILITY_UNKNOWN_DESC: "Fertility is assigned when a new campaign begins."
 HA1300_FERTILITY_WATER: "Water"
 mapmode_ha1300_fertility_name: "Fertility"
 mapmode_ha1300_fertility_description: "The underlying soil fertility of each location."
 MAPMODE_HA1300_FERTILITY: "Fertility"
 HA1300_FERTILITY_VERY_LOW: "Very low"
 HA1300_FERTILITY_VERY_LOW_DESC: "The best staple that can be grown here yields very little: desert, tundra or bare rock unless water is brought to it."
 HA1300_FERTILITY_VERY_LOW_MAP: "[ROOT.GetLocation.GetName]\nFertility: Very low"
 HA1300_FERTILITY_LOW: "Low"
 HA1300_FERTILITY_LOW_DESC: "Thin harvests from the best-suited staple; the land feeds few people per field."
 HA1300_FERTILITY_LOW_MAP: "[ROOT.GetLocation.GetName]\nFertility: Low"
 HA1300_FERTILITY_MODERATE: "Moderate"
 HA1300_FERTILITY_MODERATE_DESC: "An ordinary harvest from the best-suited staple under traditional farming."
 HA1300_FERTILITY_MODERATE_MAP: "[ROOT.GetLocation.GetName]\nFertility: Moderate"
 HA1300_FERTILITY_HIGH: "High"
 HA1300_FERTILITY_HIGH_DESC: "The best-suited staple yields well here; fields feed many people."
 HA1300_FERTILITY_HIGH_MAP: "[ROOT.GetLocation.GetName]\nFertility: High"
 HA1300_FERTILITY_VERY_HIGH: "Very high"
 HA1300_FERTILITY_VERY_HIGH_DESC: "Among the most productive land in the world for its staple: rich, watered or both."
 HA1300_FERTILITY_VERY_HIGH_MAP: "[ROOT.GetLocation.GetName]\nFertility: Very high"
