l_english:
 MAPMODE_HA1300_SOIL_TYPES: "#T Soil Type#!\nThe representative soil material in each location."
 mapmode_ha1300_soil_types_name: "Soil Type"
 mapmode_ha1300_soil_types_description: "The representative soil material in each location."
 HA1300_SOIL_UNKNOWN: "Soil type unavailable"
 HA1300_SOIL_UNKNOWN_HELP: "Soil assignments are initialized when a new campaign begins."
 HA1300_SOIL_SCOPE: "Soil type describes the ground material. Fertility is separate."
 game_concept_ha1300_soil_type: "Soil Type"
 game_concept_ha1300_soil_type_desc: "Soil type describes the predominant ground material: sand, loam, silt, clay, peat or stony soil. Fertility describes its natural agricultural quality separately. A location may contain a mixture of soils; its displayed type represents the mapped mixture. Where soil observations are unavailable, a nearby mapped location provides an estimate."
 HA1300_SOIL_INFERRED: "Estimated from the nearest location with mapped soil evidence."
 HA1300_SOIL_DIRECT: "Representative type from the mapped soil mixture."
 HA1300_SOIL_WATER: "Water"
 HA1300_SOIL_MAP_UNKNOWN: "Soil type is unavailable here."
 HA1300_SOIL_SAND: "Sand"
 HA1300_SOIL_SAND_TITLE: "Sand"
 HA1300_SOIL_SAND_DESC: "Sand-rich mineral soil. Its coarse texture influences water retention and cultivation."
 HA1300_SOIL_SAND_MAP: "[ROOT.GetLocation.GetName]\nSoil: Sand\nSand-rich mineral soil. Its coarse texture influences water retention and cultivation."
 HA1300_SOIL_LOAM: "Loam"
 HA1300_SOIL_LOAM_TITLE: "Loam"
 HA1300_SOIL_LOAM_DESC: "Mixed mineral soil containing sand, silt and clay."
 HA1300_SOIL_LOAM_MAP: "[ROOT.GetLocation.GetName]\nSoil: Loam\nMixed mineral soil containing sand, silt and clay."
 HA1300_SOIL_SILT: "Silt"
 HA1300_SOIL_SILT_TITLE: "Silt"
 HA1300_SOIL_SILT_DESC: "Silt-rich mineral soil. Fine particles influence water storage and soil stability."
 HA1300_SOIL_SILT_MAP: "[ROOT.GetLocation.GetName]\nSoil: Silt\nSilt-rich mineral soil. Fine particles influence water storage and soil stability."
 HA1300_SOIL_CLAY: "Clay"
 HA1300_SOIL_CLAY_TITLE: "Clay"
 HA1300_SOIL_CLAY_DESC: "Clay-rich mineral soil. Heavy texture influences cultivation and water management."
 HA1300_SOIL_CLAY_MAP: "[ROOT.GetLocation.GetName]\nSoil: Clay\nClay-rich mineral soil. Heavy texture influences cultivation and water management."
 HA1300_SOIL_PEAT: "Peat"
 HA1300_SOIL_PEAT_TITLE: "Peat"
 HA1300_SOIL_PEAT_DESC: "Organic soil formed through the accumulation of plant remains. Organic content alone does not establish fertility."
 HA1300_SOIL_PEAT_MAP: "[ROOT.GetLocation.GetName]\nSoil: Peat\nOrganic soil formed through the accumulation of plant remains. Organic content alone does not establish fertility."
 HA1300_SOIL_STONY: "Stony"
 HA1300_SOIL_STONY_TITLE: "Stony"
 HA1300_SOIL_STONY_DESC: "Substantial gravel, stones or concretions reduce the volume of fine soil available for cultivation."
 HA1300_SOIL_STONY_MAP: "[ROOT.GetLocation.GetName]\nSoil: Stony\nSubstantial gravel, stones or concretions reduce the volume of fine soil available for cultivation."
