l_english:
 ha1300_topo_rolling: "Rolling Terrain"
 ha1300_topo_rolling_desc: "Gently undulating ground with broad, low rises and shallow hollows."
 ha1300_topo_valleys: "Valleys"
 ha1300_topo_valleys_desc: "Broad valley floors enclosed by higher ground. The surrounding slopes constrain usable space and routes."
 ha1300_topo_floodplains: "Floodplains"
 ha1300_topo_floodplains_desc: "Low river plains shaped by flooding and deposited sediment. Water control and soil fertility are separate conditions."
 ha1300_topo_deltas: "Deltas"
 ha1300_topo_deltas_desc: "Low coastal plains built by river sediment, crossed by distributary channels and exposed to changing water levels."
