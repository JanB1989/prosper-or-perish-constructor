l_english:
  # Generated by ppc finalize (arable_land_bar.py); the population and capacity bars of the location view
  PP_LAND_BAR_POPULATION: "Population"
  PP_LAND_BAR_CAPACITY: "[population_capacity|E]"
  PP_LAND_BAR_TOWNSFOLK: "Townsfolk"
  PP_LAND_BAR_SUBSISTENCE: "Subsistence peasants"
  PP_LAND_BAR_LAND: "Arable land left"
  PP_LAND_BAR_FARMS: "Farms"
  PP_LAND_BAR_TT: "Population: [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_townsfolk')|0]K townsfolk (everyone who is not a subsistence peasant) and [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_subsistence')|0]K subsistence peasants.\n[population_capacity|E]: [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_townsfolk_room')|0]K for the townsfolk, who each bring their own, and [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_left')|0]K arable land left.\n\nArable land left: the location's land [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_natural')|0]K and its improvements [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_improvements')|0]K, minus [LocationView.GetLocation.MakeScope.ScriptValue('pp_land_bar_farms')|0]K the farms take.\n\nThe subsistence peasants live on the arable land left. Farms can take all of it: a new farm pushes them out, and they leave until the location fits its capacity again."
