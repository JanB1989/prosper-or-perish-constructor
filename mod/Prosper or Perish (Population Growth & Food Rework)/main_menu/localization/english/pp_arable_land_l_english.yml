l_english:
  # Arable Land = the engine's population capacity (renamed 2026-10-10); the Europedia card concept is
  # pp_population_capacity, links in text use the vanilla concept population_capacity (no P&P: prefix).
  # The engine's land states (static modifiers; descriptions plain text, the modifier tooltip shows no links)
  STATIC_MODIFIER_DESC_abundant_free_land: "Almost all the arable land here is still free: settlers pick the best ground and live partly off what they gather. The effects shrink as the land fills."
  STATIC_MODIFIER_DESC_available_free_land: "Part of the arable land here is still free. The effects shrink as the land fills and are gone when it is full."
  STATIC_MODIFIER_DESC_overpopulation: "More people live here than the arable land can feed. The effects grow the further people outnumber the land."
  STATIC_MODIFIER_DESC_overpopulation_growth: "More people live here than the arable land can feed."
  STATIC_MODIFIER_DESC_approaching_capacity: "Little of the arable land here is still free."
