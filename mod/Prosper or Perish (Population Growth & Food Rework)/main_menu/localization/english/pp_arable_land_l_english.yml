  game_concept_population_capacity: "Arable Land"
  game_concept_population_capacity_desc: "$game_concept_pp_population_capacity_desc$"
  MODIFIER_TYPE_NAME_local_population_capacity: "Local Arable Land"
  MODIFIER_TYPE_DESC_local_population_capacity: "Changes the [population_capacity|e] of this [location|e], counted in the people it can feed."
  MODIFIER_TYPE_NAME_local_population_capacity_modifier: "Local Arable Land %"
  MODIFIER_TYPE_DESC_local_population_capacity_modifier: "Changes the [population_capacity|e] of this [location|e] by a percentage."
  MODIFIER_TYPE_NAME_global_population_capacity_modifier: "Arable Land %"
  MODIFIER_TYPE_DESC_global_population_capacity_modifier: "Changes the [population_capacity|e] across this [country|e] by a percentage."
  MODIFIER_TYPE_NAME_total_population_capacity_modifier: "Arable Land"
  MODIFIER_TYPE_DESC_total_population_capacity_modifier: "Changes the [population_capacity|e] across this [country|e]."
