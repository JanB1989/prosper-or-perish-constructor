l_english:
  # Build panel payback column and order (tools/port_vanilla_gui.py): build cost / monthly tax income, in years
  PP_BUILD_PAYBACK_ORDER_TT: "#T Payback Order#!\nClick to list the locations by payback time, shortest first: the years the tax income of one more level takes to pay back its construction cost. Locations with similar payback times keep the order of the selected sort, so sort by tax income for the closest order.\n\nClick again to return to the selected sort."
  PP_BUILD_PAYBACK_TT_BUILT: "#T Payback Time#!\nYears one more level takes to pay back its construction cost.\n\nConstruction cost: [GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self)|0]@gold!\nTax income per month: [Building.GetIncomeToOwnerPerLevel|2]@income!\n#bold Paid back by tax income:#! [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetIncomeToOwnerPerLevel), '(CFixedPoint)12')|1] years\n\nProfit per month: [Building.GetProfitPerLevel|2]@wealth!\nPaid back by profit: [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetProfitPerLevel), '(CFixedPoint)12')|1] years"
  PP_BUILD_PAYBACK_TT_UNBUILT: "#T Payback Time#!\nYears the first level takes to pay back its construction cost.\n\nConstruction cost: [GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self)|0]@gold!\nTax income per month: [GetBuildingTypeIncomeToOwnerInLocation(BuildingType.Self, Location.Self)|2]@income!\n#bold Paid back by tax income:#! [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), GetBuildingTypeIncomeToOwnerInLocation(BuildingType.Self, Location.Self)), '(CFixedPoint)12')|1] years\n\nProfit per month: [GetBuildingTypeProfitInLocation(BuildingType.Self, Location.Self)|2]@wealth!\nPaid back by profit: [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), GetBuildingTypeProfitInLocation(BuildingType.Self, Location.Self)), '(CFixedPoint)12')|1] years"
