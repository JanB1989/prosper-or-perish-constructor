  MAPMODE_PP_VICTUALS_MARKET_PRICE_TT_LAND: "#T $mapmode_pp_victuals_market_price_name$#!\n@market! [Market.GetName]\n[ShowGoodsName('victuals')|e] Price: #V [Market.MakeScope.ScriptValue('pp_victuals_market_price_map_value')|2]#![gold_i]"
  MAPMODE_PP_VICTUALS_MARKET_PRICE_TT_WATER: "Sea/Lake Location (No Victuals Market Price)"
