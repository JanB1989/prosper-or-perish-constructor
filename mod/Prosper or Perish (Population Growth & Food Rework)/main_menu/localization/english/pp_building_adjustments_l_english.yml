  MAPMODE_PP_FISHING_VILLAGE_CAPACITY_TT_LAND: "#T $mapmode_pp_fishing_village_capacity_name$#!\nCurrent Capacity: #V [ROOT.GetLocation.MakeScope.ScriptValue('fish_capacity')|1]#!\n\nThis is the same value used by fish-producing building maximum levels. Their maximum-level tooltip lists the active [pp_fish_capacity|e] sources, including natural fishing grounds, Maximum RGO Size, [river|e] size, Manorial Customals, and fish-producing [building|e] levels.\n\n#I $PP_CAPACITY_MAPMODE_SEE_EUROPEDIA$#!"
