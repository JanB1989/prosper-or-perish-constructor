  MAPMODE_PP_MARKET_FOOD_PRICE_TT_LAND: "#T $mapmode_pp_market_food_price_name$#!\n@market! [Market.GetName]\nFood Price: #V [Market.GetFoodPrice|2]#![gold_i]"
