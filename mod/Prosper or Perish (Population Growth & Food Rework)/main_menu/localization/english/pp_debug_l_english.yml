l_english:
 # ─── Shared ───
 pp_debug.1.a: "OK"
 pp_debug.r_no_data: "Could not classify the value. Variable may not have been set."

 # ─── Event 1: Show province_monthly_food_production ───
 pp_debug.1.t: "DEBUG 1: province_monthly_food_production"
 pp_debug.1.desc: "Uppland (Stockholm)\n\nprovince_monthly_food_production = #Y [ROOT.GetVariable('pp_v').GetValue|2]#!"

 # ─── Event 2: construct_building test ───
 pp_debug.2.t: "DEBUG 2: construct_building TEST"
 pp_debug.2.desc: "Attempted to build a victualling_yard at Stockholm capital.\n\nIf the building appeared → construct_building works.\nIf nothing → construct_building or location is broken."

 # ─── Event 3: Build/Remove victualling_yard ───
 pp_debug.3.t: "DEBUG 3: Build/Remove victualling_yard"
 pp_debug.3.desc_built: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\n#G Built +1 victualling_yard#! at province capital."
 pp_debug.3.desc_removed: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (above 80)\n\n#R Removed -1 victualling_yard#! from province capital."
 pp_debug.3.desc_at_max: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\nAlready at #Y max level#! — nothing to build."
 pp_debug.3.desc_no_building: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\nNo victualling_yard exists — #G building first one#!."
 pp_debug.3.desc_skip_closed: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\nVictualling Yard is #R turned off#! — skipping build."
 pp_debug.3.desc_skip_capacity: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\nVictualling Yard is #R not fully employing#! — skipping build."
 pp_debug.3.desc_skip_goods: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#! (below -20)\n\nVictualling Yard is #R lacking input goods#! — skipping build."
 pp_debug.3.desc_in_range: "Uppland (Stockholm)\nFood: #Y [ROOT.GetVariable('pp_v').GetValue|2]#!\n\nBetween -20 and 80 — no action needed."
 pp_columbian_exchange_debug.1.title: "DEBUG: Columbian Exchange Raw Good"
 pp_columbian_exchange_debug.1.desc: "Starts the Columbian Exchange situation for this country and changes the capital raw material between maize and potato for RGO bonus testing."
 pp_columbian_exchange_debug.1.a: "Change capital raw good"
 pp_logistics_debug.1.title: "DEBUG: Run AI Logistics Infrastructure Builder"
 pp_logistics_debug.1.desc: "Runs the same AI logistics infrastructure builder used by the four-year country pulse for every country."
 pp_logistics_debug.1.a: "OK"
 pp_capacity_culling_debug.1.title: "DEBUG: Run Capacity Building Culling"
 pp_capacity_culling_debug.1.desc: "Runs the same capacity building culling on-action used by the four-year country pulse for every country."
 pp_capacity_culling_debug.1.a: "OK"
 pp_population_baseline_debug.1.title: "DEBUG: Snapshot Population Baselines"
 pp_population_baseline_debug.1.desc: "Saves current population for every ownable location and each parent geographic scope, replacing the reference baseline. The Population Delta map modes then measure change from this moment rather than from the reference campaign."
 pp_population_baseline_debug.1.a: "OK"
 pp_population_baseline_debug.2.title: "DEBUG: Reload Reference Population Baseline"
 pp_population_baseline_debug.2.desc: "Restores the population baseline of the reference campaign for every location and each parent geographic scope. The Population Delta map modes then measure change from the reference campaign again."
 pp_population_baseline_debug.2.a: "OK"
 pp_ai_building_review_debug.1.title: "DEBUG: AI Building Review"
 pp_ai_building_review_debug.1.desc: "Tests the yearly AI building review in three steps. Step 1 only counts the province capitals in my country that would get a victuals import. Step 2 queues those imports in my country. Step 3 runs the real yearly review for every AI country, including the removal of closed building levels."
 pp_ai_building_review_debug.1.a: "Step 1: count only"
 pp_ai_building_review_debug.1.b: "Step 2: queue imports in my country"
 pp_ai_building_review_debug.1.c: "Step 3: run for every AI country"
 pp_ai_building_review_debug.2.title: "DEBUG: AI Building Review Count"
 pp_ai_building_review_debug.2.desc: "Province capitals that want a victuals import: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_imports_wanted').GetValue|0]\nProvince capitals with an import under construction: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_imports_queued').GetValue|0]\n\nGold: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_gold').GetValue|0]\nDebt: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_debt').GetValue|0]\nMonthly income: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_income').GetValue|1]\nSpare construction gold: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_spare_gold').GetValue|0]\nCost of one import level: [ROOT.GetCountry.MakeScope.GetVariable('pp_debug_import_cost').GetValue|1]"
