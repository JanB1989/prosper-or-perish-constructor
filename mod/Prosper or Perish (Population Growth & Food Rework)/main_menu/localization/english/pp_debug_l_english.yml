l_english:
 pp_population_baseline_debug.1.title: "DEBUG: Snapshot Population Baselines"
 pp_population_baseline_debug.1.desc: "Saves current population for every ownable location and each parent geographic scope, replacing the reference baseline. The Population Delta map modes then measure change from this moment rather than from the reference campaign."
 pp_population_baseline_debug.1.a: "OK"
 pp_population_baseline_debug.2.title: "DEBUG: Reload Reference Population Baseline"
 pp_population_baseline_debug.2.desc: "Restores the population baseline of the reference campaign for every location and each parent geographic scope. The Population Delta map modes then measure change from the reference campaign again."
 pp_population_baseline_debug.2.a: "OK"
