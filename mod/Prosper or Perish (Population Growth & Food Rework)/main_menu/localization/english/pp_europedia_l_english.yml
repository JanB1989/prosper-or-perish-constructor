l_english:
  # Start generated location potential concept
  game_concept_pp_location_potential: "Natural Arable Land"
  game_concept_pp_location_potential_desc: "Natural Arable Land is the [population_capacity|e] a location's geography gives on its own: the people its land can feed before any land improvements.\n\n#T Physical and historical evidence:#!\n$BULLET$ Calibrated land area and latitude\n$BULLET$ Topography, vegetation, soil, and climate\n$BULLET$ Low-input rainfed crop yields for historically available staples\n$BULLET$ Pasture, livestock, fisheries, wild foods, and apiary products\n$BULLET$ HYDE historical rainfed land-use evidence\n\nFood imports and the game's starting population are not counted. Land improvements add to it."
  # End generated location potential concept
# Override vanilla River concept to document PP's river size scaling
game_concept_river_desc: "A [location|e] may have a River, a moving body of water.\n\nMost rivers cannot be sailed by [navies|e]; the great ones are [Concept('pp_navigable_rivers', 'Navigable Rivers')|e] that fleets can use. Rivers impose a [crossing|e] combat malus on [armies|e] who attempt to enter a [location] with a River. Additionally, they slightly increase the [population_capacity|e] of a location.\n\nThis modifier is multiplied by river size."
# Europedia mod overview - appears under Game Concepts, searchable for "prosper", "perish", "harvest"
ENCYCLOPEDIA_PAGE_PROSPER_OR_PERISH: "Prosper or Perish"
game_concept_prosper_perish_mod: "Prosper or Perish (Mod)"
game_concept_prosper_perish_mod_desc: "#T The Mod:#!\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to [pp_prosperity|e], Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and two new food goods (see [pp_victuals|e]). When you create a new game, check the game rules for Prosper or Perish: you can disable [pp_variable_harvests|e] if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least [pp_food|e] and [pp_food_consumption|e]; they should be enough to get you playing.\n\n#T Promotions:#!\nI massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\n#T Feedback:#!\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookshop recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\n#T How I Add Features:#!\nI follow this checklist:\n\n$BULLET$ Is the mechanic fun to manage for the player?\n$BULLET$ Is the mechanic a concept that can be understood historically?\n$BULLET$ Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\n#T Thanks:#!\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5."
game_concept_prosper_or_perish: "Prosper or Perish"
game_concept_harvest_situation: "P&P: Variable Harvests"
game_concept_harvest_situation_desc: "Each September, regions receive harvest conditions that can change farmed-goods output for the year. Broad harvest areas make nearby regions more likely to move together, but regions inside the same area can still differ. Average years leave no harvest modifier. Active harvest modifiers show their current effects on affected locations."
game_concept_pp_variable_harvests: "P&P: Variable Harvests"
game_concept_pp_variable_harvests_desc: "Every September each [region|e] learns what its fields will give for the year ahead. Most years are ordinary. A bad one shrinks the crops and the surplus of the villages; a good one does the opposite. Neighbouring regions tend to share their luck, and lean or fat years can come in runs."
harvest_situation: "P&P: Variable Harvests"
harvest_situation_desc: "Every September each region learns what its fields will give for the year ahead. Most years are ordinary; a bad one shrinks the crops and the surplus of the villages, a good one does the opposite. Neighbouring regions tend to share their luck.\n\nOpen the situation for this year's harvest at your capital and in your provinces."
harvest_situation_monthly: "• Every September each region draws its harvest for the year ahead\n• A bad harvest cuts farmed goods and the villages' surplus; a good one raises them\n• Average years leave no harvest modifier\n• Hover a location on the situation's map for its harvest"
game_concept_abysmal_harvest: "Failed Harvest"
game_concept_abysmal_harvest_desc: "The worst harvest on the scale: crops fail across the region and the villages have nothing to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_ABYSMAL$"
game_concept_very_poor_harvest: "Bad Harvest"
game_concept_very_poor_harvest_desc: "A bad year: the fields give much less than usual and the villages little to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_VERY_POOR$"
game_concept_poor_harvest: "Weak Harvest"
game_concept_poor_harvest_desc: "A weak year: the fields give less than usual and the villages a little less to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_POOR$"
game_concept_good_harvest: "Strong Harvest"
game_concept_good_harvest_desc: "A good year: the fields give more than usual and the villages a little more to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_GOOD$"
game_concept_very_good_harvest: "Excellent Harvest"
game_concept_very_good_harvest_desc: "A rich year: the fields give much more than usual and the villages plenty to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_VERY_GOOD$"
game_concept_bountiful_harvest: "Exceptional Harvest"
game_concept_bountiful_harvest_desc: "The best harvest on the scale: barns overflow across the region and the villages have surplus to spare.\n\n#T In each broad harvest area#! (hover for the effects)\n$PP_HARVEST_BY_AREA_BOUNTIFUL$"
game_concept_average_harvest: "Average Harvest"
game_concept_average_harvest_desc: "An ordinary year, and the most common one. The region gets no harvest modifier: its fields give what they always give."
# Variable Harvests card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_HARVEST_CAPITAL: "#T This year at your capital#!\n[GetPlayer.GetCapital.GetName]: [GetPlayer.GetCapital.Custom('pp_harvest_state')]"
PP_EU_HARVEST_YEAR: "A Harvest Year"
PP_EU_HARVEST_STEP_SEPTEMBER: "Every September"
PP_EU_HARVEST_STEP_SEPTEMBER_DESC: "The harvest is settled once a year, for every [region|e] at the same time, and holds until the next September."
PP_EU_HARVEST_STEP_AREA: "Broad Harvest Area"
PP_EU_HARVEST_STEP_AREA_DESC: "The map is split into broad areas such as Western Europe or South Asia. Each first draws its season: kind, ordinary or harsh."
PP_EU_HARVEST_STEP_REGION: "Each Region"
PP_EU_HARVEST_STEP_REGION_DESC: "Every [region|e] of the area then draws its own harvest. The season tilts the odds, and so does the region's last harvest."
PP_EU_HARVEST_STEP_MODIFIER: "Harvest Modifier"
PP_EU_HARVEST_STEP_MODIFIER_DESC: "The harvest lands on every [location|e] of the region as a [location_modifier|e] named after its area. An average year adds none."
PP_EU_HARVEST_SCALE: "Lean Years and Fat Years"
PP_EU_HARVEST_SCALE_ABYSMAL: "[abysmal_harvest|e]"
PP_EU_HARVEST_SCALE_VERY_POOR: "[very_poor_harvest|e]"
PP_EU_HARVEST_SCALE_POOR: "[poor_harvest|e]"
PP_EU_HARVEST_SCALE_AVERAGE: "[average_harvest|e]"
PP_EU_HARVEST_SCALE_GOOD: "[good_harvest|e]"
PP_EU_HARVEST_SCALE_VERY_GOOD: "[very_good_harvest|e]"
PP_EU_HARVEST_SCALE_BOUNTIFUL: "[bountiful_harvest|e]"
PP_EU_HARVEST_SCALE_DESC: "Hover a harvest to see its modifier in every broad harvest area, then hover an area for the exact effects. Average is the most common harvest and the ends of the scale are the rarest. Each region leans toward its own last harvest: a harsh season after a bad year makes another bad year likelier still, while a harsh season after a good year only brings the odds back to ordinary. Kind seasons work the same way in the other direction."
PP_EU_HARVEST_CHANGES: "What a Harvest Changes"
PP_EU_HARVEST_CHANGES_DESC: "A harvest moves two things in its locations: how much the fields yield and how much surplus the villages have to spare. Each crop swings by how sensitive it is and by how widely its broad area grows it: where it is a main crop it swings at full strength, where it is grown only here and there it swings less. Hover a good for its name."
PP_EU_HARVEST_GOODS_GRAIN: "#T Grain and rice#!\nswing the most"
PP_EU_HARVEST_GOODS_CROPS: "#T Field, orchard and plantation crops#!\nswing less"
PP_EU_HARVEST_GOODS_HARDY: "#T Hardy goods#!\nbarely move"
PP_EU_HARVEST_GOODS_SPARED: "#T Herds, flocks, fish and game#!\nare spared"
PP_EU_HARVEST_PEASANTS: "The [ShowPopTypeName('peasants')] live off their own plots first. A bad year leaves those plots less surplus for the province, a good year more; the harvest modifier shows this as peasant food consumption. A bad harvest therefore strikes twice: smaller crops and less to spare from the villages."
PP_EU_HARVEST_WHERE: "Where to See It"
PP_EU_HARVEST_WHERE_DESC: "$BULLET$ #T The map:#! the Variable Harvests [situation|e] colours every location by this year's harvest, dark for bad years and bright for good ones; starving provinces show the starving colour instead. Click the situation for this year's harvest at your capital and in your provinces.\n$BULLET$ #T The location view:#! the harvest chip at the top right shows the location's harvest as the medallions above; hover it for every effect.\n$BULLET$ #T The modifier:#! the harvest modifier in the location's modifier list names its broad area and lists its effects.\n$BULLET$ #T The game rule:#! Variable Harvests can be switched off when a campaign starts."
# Arable Land card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_LAND_CAPITAL_ABUNDANT: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: [Concept('pp_abundant_free_land', 'Abundant Arable Land')|e]"
PP_EU_LAND_CAPITAL_AVAILABLE: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: [Concept('pp_available_free_land', 'Available Arable Land')|e]"
PP_EU_LAND_CAPITAL_SETTLED: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: its arable land is exactly full"
PP_EU_LAND_CAPITAL_OVERUSED: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: [Concept('pp_overused_arable_land', 'Overused Arable Land')|e]"
PP_EU_LAND_SOURCES: "Where Arable Land Comes From"
PP_EU_LAND_SOURCE_NATURAL: "The Land Itself"
PP_EU_LAND_SOURCE_NATURAL_DESC: "[climate|e], [vegetation|e], [topography|e], soil, fertility, rivers and coasts decide what the land can feed. Fertile river valleys feed many, deserts and mountains few."
PP_EU_LAND_SOURCE_IMPROVEMENTS: "Land Improvements"
PP_EU_LAND_SOURCE_IMPROVEMENTS_DESC: "Clearing, draining, irrigating and terracing win new land. How far a location can be improved depends on its geography and grows with its [development|e]."
PP_EU_LAND_SOURCE_BUILDINGS: "Work in Town"
PP_EU_LAND_SOURCE_BUILDINGS_DESC: "Whoever works in a [building|e] no longer works a plot of their own, so each building gives back part of its workers' land: workshops and town quarters much, mines and forts little."
PP_EU_LAND_IMPROVEMENTS_ROW: "#T Land improvements#!\neach where the land suits it"
PP_EU_LAND_USES: "What Uses It"
PP_EU_LAND_USE_PEOPLE: "People"
PP_EU_LAND_USE_PEOPLE_DESC: "Every [pop|e] lives on the land, townsfolk as much as peasants. A growing town fills its land quickly unless its buildings give land back."
PP_EU_LAND_USE_FARMS: "Farms"
PP_EU_LAND_USE_FARMS_DESC: "Each farm level takes a fixed share of land, larger farms a larger share. A location holds only as many farms as its land has room for, and a little always stays untouched. Farms do not wait for people to leave: built on crowded land, they crowd it further."
PP_EU_LAND_USE_GROUNDS: "Reserved Grounds"
PP_EU_LAND_USE_GROUNDS_DESC: "Hunting grounds, royal forests and gardens, great enclosures and cattle pens keep land for their owners and away from the people."
PP_EU_LAND_STATES: "How Full the Land Is"
PP_EU_LAND_STATE_ABUNDANT: "[Concept('pp_abundant_free_land', 'Abundant Arable Land')|e]"
PP_EU_LAND_STATE_AVAILABLE: "[Concept('pp_available_free_land', 'Available Arable Land')|e]"
PP_EU_LAND_STATE_OVERUSED: "[Concept('pp_overused_arable_land', 'Overused Arable Land')|e]"
PP_EU_LAND_STATES_DESC: "Hover a state for its effects. Nearly empty land gives the strongest bonus: settlers pick the best ground and live partly off what they gather. As people arrive the bonus fades with the land that is left: rural goods yield less extra, the villages have less to spare and fewer newcomers are drawn in. Tribes grow only while land is free. At exactly full nothing applies; past full the land is overused, and that weighs heavier the further people outnumber the land."
PP_EU_LAND_WHERE: "Where to See It"
PP_EU_LAND_WHERE_DESC: "$BULLET$ #T The location view:#! the land chip at the top right shows the location's state; hover it for every effect at its current strength. Hover the location's arable land for every source that adds to it or takes from it.\n$BULLET$ #T The map:#! the arable land map mode in the Population group colours every location by its land.\n$BULLET$ #T Farms:#! a farm's level tooltip shows the land free for it and the land the other farms already use."
# Game concepts for P&P feature landing page
game_concept_pp_getting_started: "Getting Started"
game_concept_pp_getting_started_desc: "#T Getting Started#!\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\n#T First, Check Your Settings#!\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\n#T Recommended Community Mods#!\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\n#T What to Pay Attention To#!\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n$BULLET$ 1. Turn the food slider low; do not bankrupt yourself.\n$BULLET$ 2. If food is short, rural buildings switch to feeding the province by themselves: farms provision it with their crop. [ShowBuildingTypeName('cookshop')|e] and [ShowBuildingTypeName('public_kitchen')|e] always serve their dishes to the province.\n$BULLET$ 3. If [ShowGoodsName('victuals')|e] are cheap, build a [ShowBuildingTypeName('tavern')|e]. It buys victuals from the goods market and feeds the province with them, and it earns more while the province store is low.\n$BULLET$ 4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n$BULLET$ 5. If food is expensive, your population grows slower and you get less prosperity.\n\nIt is best to understand how [ShowBuildingTypeName('tavern')|e] works. It hires and fires people based on whether buying victuals for the province pays off, which is the case while the province store is low. You can subsidize it, but you rarely need to. Just leave it be and build it in cities where you do not want to produce food with [ShowBuildingTypeName('cookshop')|e]. Its counterpart [ShowBuildingTypeName('victualling_yard')|e] packs a full province store into victuals for the goods market; it belongs where rivers, coasts and market centres let the victuals travel.\n\nEssentially everything is balanced around this idea.\n\n#T RGOs#!\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\n#T Variable Harvests#!\nThey happen yearly and make your crop production vary a lot.\n\n#T Map Modes#!\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\n#T Farming, Forest, and Fishing Capacity#!\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\n#T Land Attributes#!\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\n#T Building Levels#!\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\n#T Internal Food Goods#!\n[ShowGoodsName('province_food_sales')|e] pays the [ShowBuildingTypeName('grange')|e] for the surplus of a well-stocked province, and nothing once the store runs low. It is an internal good that lets the Grange react to the province store by itself. You can otherwise ignore it."
game_concept_pp_faq: "F.A.Q."
game_concept_pp_faq_desc: "#T Q: Are my other mods compatible with Prosper or Perish?:#!\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\n#T Q: An update ruined my save. What do I do?:#!\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\n#T Q: How do I install the GitHub version?:#!\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\n#T Q: Why is everyone starving at game start?:#!\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go."
game_concept_pp_update_0_9: "Update 0.9"
game_concept_pp_update_0_9_desc: "#T Update 0.9#!\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\n#T Biggest Changes from 0.8#!\n$BULLET$ #Y 1. The location building cost malus is gone.#! It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n$BULLET$ #Y 2. Victuals Markets and Province Food Market Goods.#! It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now uses two internal goods: Province Food Sales for food sold into the goods market and Province Food Purchase for food bought back into a province. They serve no purpose other than to create the local conditions where converting victuals to food can be profitable when victuals are cheap and market food is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n$BULLET$ #Y 3. Please use the Community Mod Framework.#! I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n$BULLET$ #Y 4. Bigger and more urbanized cities.#! In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\n$BULLET$ #Y 5. Promotions.#! I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy."
game_concept_pp_food_consumption: "P&P: Food Consumption"
game_concept_pp_food_consumption_desc: "Every month each [pop|e] eats its share of its [province|e]'s food store, a noble far more than a peasant. Winter and good times make people eat more; free land, good harvests and kitchens let the peasants make do with less. Whatever is eaten leaves the store, and a province whose store runs empty starves."
# Food Consumption card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_CONS_CAPITAL: "#T Your capital's province#!\n[GetPlayer.GetCapital.GetProvince.GetName] eats #V [GetPlayer.GetCapital.MakeScope.ScriptValue('pp_province_monthly_food_consumption')|1]#!@food! a month; its [Concept('pp_food_storage', 'store')|e] holds #V [GetPlayer.GetCapital.MakeScope.ScriptValue('pp_province_food_storage_months')|1]#! months of that"
PP_EU_CONS_FLOW: "From the Store, Month by Month"
PP_EU_CONS_STEP_EAT: "Every Pop Eats"
PP_EU_CONS_STEP_EAT_DESC: "Each month every [pop|e] in the province eats its share. How much depends on its pop type and on the conditions below."
PP_EU_CONS_STEP_STORE: "Out of the Store"
PP_EU_CONS_STEP_STORE_DESC: "It all comes out of one store that every location of the province shares. [armies|e] in the province draw on it too when they would otherwise go hungry."
PP_EU_CONS_STEP_BALANCE: "Fills or Empties"
PP_EU_CONS_STEP_BALANCE_DESC: "A province that makes more [ShowGoodsName('local_food')|e] than it eats fills its store; one that eats more empties it. The store counts in months of what the province eats, so eating more also means fewer months."
PP_EU_CONS_STEP_EMPTY: "Empty Store"
PP_EU_CONS_STEP_EMPTY_DESC: "With nothing left the province starves: people die, flee and sink into lower classes that eat less, and its [prosperity|e] falls, until the mouths left match the food it makes."
PP_EU_CONS_WHO: "Who Eats How Much"
PP_EU_CONS_POP_NOBLES: "[ShowPopTypeName('nobles')]"
PP_EU_CONS_POP_CLERGY: "[ShowPopTypeName('clergy')]"
PP_EU_CONS_POP_BURGHERS: "[ShowPopTypeName('burghers')]"
PP_EU_CONS_POP_SOLDIERS: "[ShowPopTypeName('soldiers')]"
PP_EU_CONS_POP_LABORERS: "[ShowPopTypeName('laborers')]"
PP_EU_CONS_POP_PEASANTS: "[ShowPopTypeName('peasants')]"
PP_EU_CONS_POP_SLAVES: "[ShowPopTypeName('slaves')]"
PP_EU_CONS_WHO_DESC: "Hungriest on the left, most frugal on the right. A noble eats many times what a peasant does, clergy and burghers far more than working people, soldiers more than laborers. The [ShowPopTypeName('peasants')] eat first from their own plots, so what they eat decides how much their villages leave for the store (see [pp_food|e]). [ShowPopTypeName('tribesmen')] live off their herds and hunting and eat nothing from the store."
PP_EU_CONS_EVERYONE: "Everyone Eats More in Winter and in Good Times"
PP_EU_CONS_WINTER: "Winter"
PP_EU_CONS_WINTER_DESC: "While [winter|e] lasts every pop eats more, the more the harsher the winter, just when the crops yield less. The store has to carry the province through those months."
PP_EU_CONS_PROSPERITY: "Prosperity"
PP_EU_CONS_PROSPERITY_DESC: "A prosperous location eats better: the higher its [prosperity|e], the more its pops eat. Under negative prosperity it turns round for the peasants, who make do with less."
PP_EU_CONS_PEASANTS: "The Peasants' Share"
PP_EU_CONS_PEASANTS_DESC: "Many things change only what the [ShowPopTypeName('peasants')] eat, and with it what their villages leave for the store (see [pp_food|e]). Hover each for its effect."
PP_EU_CONS_PEASANTS_LESS: "#T Peasants eat less#!\nmore to spare"
PP_EU_CONS_PEASANTS_MORE: "#T Peasants eat more#!\nless to spare"
PP_EU_CONS_PEASANTS_WHY: "$BULLET$ #T Harvests:#! a good year leaves their plots more to spare, a bad one less (see [pp_variable_harvests|e]).\n$BULLET$ #T Land:#! on free [population_capacity|e] they live partly off what they gather, most where the land is nearly empty; on overused land they eat more, the more people outnumber the land.\n$BULLET$ #T Kitchens:#! every staffed level of a [ShowBuildingTypeName('cookshop')|e] or [ShowBuildingTypeName('public_kitchen')|e] lowers it a little in its location: fresh food is eaten where it is cooked.\n$BULLET$ #T The land's raw material:#! where a location's [raw_material|e] is a [Concept('pp_staple_foods', 'staple food')|e] its peasants eat a little less; where it is sugar, silk, wine or one of several other cash crops, a little more."
PP_EU_CONS_ESTATES: "One Estate at a Time"
PP_EU_CONS_CHOICES: "Laws, Privileges and Estate Buildings"
PP_EU_CONS_CHOICES_DESC: "Some choices change what one estate's pops eat. Favouring an estate in the Distribution of Power lets its pops eat better; privileges such as serfdom or a partial yield make peasants and laborers eat less. The estates' buildings work the same way: a [ShowBuildingTypeName('nobles_mansion')|e] or [ShowBuildingTypeName('burgher_mansion')|e] feeds its own class better, [ShowBuildingTypeName('peasants_hunting_grounds')|e] let the peasants eat less from the store and [ShowBuildingTypeName('festival_grounds')|e] more. Hover a law, privilege or building for its effects."
PP_EU_CONS_WHERE: "Where to See It"
PP_EU_CONS_WHERE_DESC: "$BULLET$ #T The location view:#! the location's food tooltip lists its monthly [pop_food_consumption|e] by pop type; hover a pop type's figure for everything that raises or lowers it. The food chip at the top right shows how many months of the province's consumption its store holds, or that the province starves.\n$BULLET$ #T The map:#! the $mapmode_pp_positive_province_food_growth_name$ map mode shows the months in store for every province, the $mapmode_winter_name$ map mode how hard winters can get."
game_concept_pp_other_changes: "Other Changes"
game_concept_pp_other_changes_desc: "This section covers Buildings in Location, Available Arable Land, Abundant Arable Land, Prosperity, Devastation, Cheap Food, Expensive Food, Province Current Food Storage, and Starvation. Use the cards below for details on each topic."
game_concept_pp_victuals: "P&P: New Trade Goods"
game_concept_pp_victuals_desc: "Prosper or Perish adds goods of its own. [ShowGoodsName('victuals')|e] are preserved food, the one food that travels between provinces. [ShowGoodsName('manual_labor')|e] is the work of idle hands, and nearly every building pays part of its costs in it. The rest are bookkeeping goods with a fixed low price that you can safely ignore."
# New Trade Goods card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_GOODS_CAPITAL: "#T Your capital's market#!\n[GetPlayer.GetCapital.GetMarket.GetName]: [ShowGoodsName('victuals')] cost #V [GetPlayer.GetCapital.GetMarket.MakeScope.ScriptValue('pp_victuals_price_map_value')|2]#! gold"
PP_EU_GOODS_OR: "or"
PP_EU_GOODS_VICTUALS: "Victuals: the Food That Travels"
PP_EU_GOODS_VICTUALS_DESC: "[ShowGoodsName('local_food')|e] never leaves its province, and [pp_staple_foods|e] on the goods market feed nobody. Victuals are the food in between: packed rations that keep and travel, bought and sold between markets like cloth or iron. They feed nobody either until a building turns them back into Province Food. Each food building is explained on [pp_food|e]."
PP_EU_GOODS_STEP_GRANGE: "From a Full Store"
PP_EU_GOODS_STEP_GRANGE_DESC: "At the province capital the landowners pack what a full province store can spare. The dearer victuals are, the more of the store they pack."
PP_EU_GOODS_STEP_YARD: "From the Market"
PP_EU_GOODS_STEP_YARD_DESC: "In harbours and market centres merchants buy [pp_staple_foods|e] on the goods market and pack them. The province store is never touched."
PP_EU_GOODS_STEP_TRADED: "Traded"
PP_EU_GOODS_STEP_TRADED_DESC: "Victuals keep and travel: they go to whichever market pays for them, like any other good."
PP_EU_GOODS_STEP_FOOD: "Food Again"
PP_EU_GOODS_STEP_FOOD_DESC: "A Tavern in a province capital buys them and serves them to its province as [ShowGoodsName('local_food')|e], above all while the store runs low."
PP_EU_GOODS_USERS: "Who Else Buys Victuals"
PP_EU_GOODS_MILITARY_ROW: "#T Armies and fleets#!\nfor their buildings' upkeep"
PP_EU_GOODS_CARRIERS_ROW: "#T Carriers#!\nto feed their crews"
PP_EU_GOODS_CREWS_ROW: "#T Work crews#!\nin some of their methods"
PP_EU_GOODS_POPS_ROW: "#T Pops#!\nbuy some, nobles most"
PP_EU_GOODS_USERS_DESC: "Barracks, training grounds, docks and shipyards buy victuals for their upkeep. The logistics buildings feed their boatmen, carters and caravan crews with them, and lumber mills, forest villages and distant fisheries do so in some of their methods; hover a building's methods to see which. Most [pops|e] also buy a little as part of their everyday needs, the nobles most of all. All of them compete with the Taverns for the same victuals."
PP_EU_GOODS_LABOR: "Manual Labor"
PP_EU_GOODS_LABOR_TITLE: "The Work of Idle Hands"
PP_EU_GOODS_LABOR_DESC: "Idle [ShowPopTypeName('peasants')] supply [ShowGoodsName('manual_labor')|e] to their own market, and most [Concept('production_method', 'production methods')|e] pay part of their cost in it. It never leaves its market, so its price is the local wage: cheap where hands are many, dear where towns crowd a market. How it works and how buildings answer a dear wage: [pp_labor|e]."
PP_EU_GOODS_DUMMY: "Bookkeeping Goods You Can Ignore"
PP_EU_GOODS_DUMMY_DESC: "A few goods are bookkeeping only: nobody eats, wears or ships them. Some buildings make or pay small amounts of them so that each building earns what it should, and so that the right buildings get built and staffed. Their price is fixed at its lowest and never moves. You can ignore them."
PP_EU_GOODS_DUMMY_OFFSET: "Offset"
PP_EU_GOODS_DUMMY_OFFSET_DESC: "Money in the form of a good. Many buildings pay a little of it in some of their methods, and the [ShowBuildingTypeName('cookshop')|e] and the [ShowBuildingTypeName('public_kitchen')|e] sell their meals for it. It has no other use."
PP_EU_GOODS_DUMMY_LOGISTICS: "Logistics"
PP_EU_GOODS_DUMMY_LOGISTICS_DESC: "What the logistics buildings make. Nobody buys it: it pays their workers a steady wage, while their real work is the [market_access|e] they bring. See [pp_building_limits|e]."
PP_EU_GOODS_DUMMY_SALES: "Surplus Sales"
PP_EU_GOODS_DUMMY_SALES_DESC: "What the [ShowBuildingTypeName('grange')|e] earns from a full province store: the fuller the store, the more it earns, and once the store runs low, nothing. A working [ShowBuildingTypeName('tavern')|e] in the same place takes it away. So a Grange packs only food its province can spare."
PP_EU_GOODS_ODD: "Why Some Methods Look Odd"
PP_EU_GOODS_ODD_DESC: "Some production methods look strange at first. They are built that way on purpose: with them the computer players build, staff and upgrade these buildings when it makes sense, under the same rules as you, without cheats and without extra scripts that would slow the game."
PP_EU_GOODS_ODD_MARKET: "A Market Slot"
PP_EU_GOODS_ODD_MARKET_DESC: "Most producing buildings end in a Market slot with one method, Market Sales, which sells a little of the building's main good for [ShowGoodsName('offset')|e]. It pays only while that good fetches a good price, so a building is extended where its good is dear and not where it is cheap."
PP_EU_GOODS_ODD_PROVISION: "Provisioning"
PP_EU_GOODS_ODD_PROVISION_DESC: "Every building that makes [pp_staple_foods|e] keeps back a little of its own crop and cooks for its province, in a method such as Provision with Wheat. The lower the province store, the more [ShowGoodsName('local_food')|e] it makes. It runs beside the method that makes the crop."
PP_EU_GOODS_ODD_MEALS: "Meals Sold for Offset"
PP_EU_GOODS_ODD_MEALS_DESC: "The recipes of the [ShowBuildingTypeName('cookshop')|e] and the [ShowBuildingTypeName('public_kitchen')|e] turn staple foods into [ShowGoodsName('offset')|e]. That keeps their profit small and steady; their real product is the food they add to the province store."
PP_EU_GOODS_ODD_OLD: "Old Ways"
PP_EU_GOODS_ODD_OLD_DESC: "Along the manufacturing lines an upgraded building keeps the recipes of the buildings it replaced, marked (Old Ways). They turn out less per level than the methods of its own age, but let a town keep working on older inputs where the newer ones are scarce."
PP_EU_GOODS_WHERE: "Where to See It"
PP_EU_GOODS_WHERE_DESC: "$BULLET$ #T The map:#! the $mapmode_pp_victuals_price_name$ map mode colors every market by what victuals cost there.\n$BULLET$ #T The market:#! [ShowGoodsName('victuals')|e] in the market view shows who makes them and who buys them.\n$BULLET$ #T Buildings:#! hover a production method to see what it uses and what it makes."
game_concept_pp_building_limits: "Logistics (Market Access)"
game_concept_pp_building_limits_desc: "Every [location|e] can keep only so many [building|e] levels supplied before its carters, boatmen and harbors are stretched thin. Build past that limit and its goods reach the market worse: its [market_access|e] falls. Logistics buildings win the access back, but they use goods you could put to other work. How much access you buy is your choice."
# Logistics (Market Access) card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_LOGI_CAPITAL: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: #V [GetPlayer.GetCapital.GetNumBuildingLevelsTowardLimit|0]#! building levels, #V [GetPlayer.GetCapital.GetSupportedBuildingLevels|0]#! supported, [market_access|e] #V [GetPlayer.GetCapital.GetMarketAccess|%0]#!"
PP_EU_LOGI_LIMIT: "What Sets the Limit"
PP_EU_LOGI_LIMIT_DESC: "Each location's limit, its [supported_building_levels|e], comes from its attributes. Open, mild country is easy to supply. [topography|e] such as mountains, wetlands and hills, [vegetation|e] such as desert, jungle and forest, and a harsh [climate|e] all lower the limit. A [river|e] raises it, the more the bigger the river, and so do a [port|e] and a [road|e]. Towns and cities hold more than the countryside ([location_rank|e]), every point of [development|e] adds a little, and a [province_capital|e], the [capital|e] or a [market_center|e] adds more. Land improvements and foreign buildings bring their own support."
PP_EU_LOGI_EASY_ROW: "#T Easier to supply#!\nhover for what they are"
PP_EU_LOGI_HARD_ROW: "#T Harder to supply#!\nhover for what they are"
PP_EU_LOGI_OVER: "Over the Limit"
PP_EU_LOGI_STEP_LEVELS: "Building Levels"
PP_EU_LOGI_STEP_LEVELS_DESC: "Every level counts toward the limit: farms and workshops alike, those under construction and those without workers."
PP_EU_LOGI_STEP_OVER: "Stretched Thin"
PP_EU_LOGI_STEP_OVER_DESC: "Each level above the limit gives the location [ShowModifier('unsupported_building_levels')]: more goods to move than its carriers can handle."
PP_EU_LOGI_STEP_ACCESS: "Market Access Falls"
PP_EU_LOGI_STEP_ACCESS_DESC: "Its goods reach the market worse, so its [market_access|e] drops a little with every level more."
PP_EU_LOGI_STEP_TRADE: "Less Trade"
PP_EU_LOGI_STEP_TRADE_DESC: "Its buildings buy and sell less of what they use and make, so they earn less, and the location is served late when its [market|e] runs short."
PP_EU_LOGI_BUILDINGS: "Logistics Buildings"
PP_EU_LOGI_BUILDINGS_DESC: "Once a location's [market_access|e] has fallen low and enough buildings stand there to need them, it can build logistics buildings; their requirements show the exact line. Each level carries goods to the market and gives market access back. Which one a location can build depends on where it lies:"
PP_EU_LOGI_RIVER: "On a River"
PP_EU_LOGI_RIVER_DESC: "The [ShowBuildingTypeName('river_boatmen_yard')|e]: barges, towpaths and landings. The bigger the river, the more levels it takes."
PP_EU_LOGI_PORT: "In a Port"
PP_EU_LOGI_PORT_DESC: "The [ShowBuildingTypeName('coastal_shipping_office')|e]: coasters and pilots. A port with good [natural_harbor_suitability|e] takes more levels."
PP_EU_LOGI_CITY: "In a City"
PP_EU_LOGI_CITY_DESC: "The [ShowBuildingTypeName('transport_office')|e]: carts, porters and clerks, in cities and developed towns."
PP_EU_LOGI_ROAD: "Along a Road"
PP_EU_LOGI_ROAD_DESC: "The [ShowBuildingTypeName('carrier_inn')|e]: carriers and pack animals wherever a [road|e] runs."
PP_EU_LOGI_LOCAL_ROW: "#T Local carriers#!\nin the Carrier Inn's place"
PP_EU_LOGI_LOCAL_DESC: "Where the land has its own carriers, they take the Carrier Inn's place and need no road: the [ShowBuildingTypeName('pp_caravanserai')|e] in the dry lands from the Maghreb to Central Asia, the [ShowBuildingTypeName('pp_oasis_caravan_station')|e] in the Sahara and the Sahel, the [ShowBuildingTypeName('pp_yam_station')|e] from Russia to Mongolia, the [ShowBuildingTypeName('pp_banjara_tanda')|e] in South Asia and the [ShowBuildingTypeName('pp_llama_caravan_post')|e] in the Andes."
PP_EU_LOGI_CHOICE: "Your Choice"
PP_EU_LOGI_STEP_USE: "What They Use"
PP_EU_LOGI_STEP_USE_DESC: "Timber, tools, victuals, pack animals and more: every level buys its inputs on the market like any workshop."
PP_EU_LOGI_STEP_MAKE: "What They Make"
PP_EU_LOGI_STEP_MAKE_DESC: "[ShowGoodsName('logistics')|e], a good that only pays their way: it makes them profitable and tells the AI they are worth building."
PP_EU_LOGI_STEP_BACK: "What They Give Back"
PP_EU_LOGI_STEP_BACK_DESC: "[market_access|e] for the location, level by level. Part of it stays even when the building cannot buy its inputs."
PP_EU_LOGI_INPUTS_ROW: "#T What they use#!\neach building its own mix"
PP_EU_LOGI_CHOICE_DESC: "With enough logistics buildings any location can keep its market access high. But the goods they use are goods your workshops, fleets and armies could have had, and the haulage costs the location's bulky trades a little of their output (see below). Build them where access pays: crowded towns, rich mines and busy workshops. A quiet farming location can live with a little less. It is your choice."
PP_EU_LOGI_HAUL: "The Haulage Has a Price"
PP_EU_LOGI_HAUL_DESC: "Logistics buildings carry a location's goods to the market at a cost: every level slightly lowers the output, and with it the profit, of the location's buildings that make bulky goods. The heavier and bulkier the good, the more it loses. Boats carry bulk more cheaply than carts and pack animals, so river and port buildings cost the bulky trades the least. Hover a logistics building for its exact cut."
PP_EU_LOGI_HEAVY_ROW: "#T Stone, ores and salt#!\nlose the most"
PP_EU_LOGI_HALF_ROW: "#T Timber#!\nloses half as much"
PP_EU_LOGI_STAPLES_ROW: "#T Bulky staples#!\nlose less, by their bulk"
PP_EU_LOGI_WHERE: "Where to See It"
PP_EU_LOGI_WHERE_DESC: "$BULLET$ #T The location view:#! hover the building levels for the limit and what sets it, and the market access for what moves it.\n$BULLET$ #T The map:#! the Supported Building Levels map mode shows each location's limit, the Unsupported Building Levels map mode how far it is over, and the Market Access map mode the result.\n$BULLET$ #T The build menu:#! a logistics building's requirements show when a location can take one."
# Override vanilla Supported Building Levels: in PP going over the limit costs market access, not construction cost
game_concept_supported_building_levels_desc: "Every [location|e] can keep a number of [building|e] levels supplied with ease: its Supported Building Levels. They come from its land, its rivers, ports and roads, its [location_rank|e] and its [development|e]; land improvements and foreign buildings bring their own support.\n\nAll building levels count toward the limit, including those under construction and those without workers.\n\nIn Prosper or Perish going over the limit does not make construction dearer: every level above it lowers the location's [market_access|e] instead, until logistics buildings win it back. See [Concept('pp_building_limits','Logistics (Market Access)')|e]."
game_concept_pp_navigable_rivers: "Navigable Rivers"
game_concept_pp_navigable_rivers_desc: "The great rivers are roads for ships. [navies|E] sail them far inland, goods travel them more cheaply than over land, and the towns on their banks build ports and shipyards like any coast. Not every reach is open: shallows slow boats until a canal is built, and falls stop them."
# Navigable Rivers card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_NAV_BOTH: "A River and a Coast"
PP_EU_NAV_RIVER: "Still a River"
PP_EU_NAV_RIVER_DESC: "The banks keep their [river|e]: its bonuses, the buildings that need a river and the boatmen who work it."
PP_EU_NAV_COAST: "Also a Coast"
PP_EU_NAV_COAST_DESC: "[navies|E] sail the waterway, and every bank counts as [coastal|e]: shipyards and the other coastal buildings can stand there. Banks with a landing can hold a [port|e]."
PP_EU_NAV_BOTH_DESC: "A waterway is not the sea. Buildings that need the open sea stay on the sea coast, and so do the sea's richer fishing grounds. A few waterways never reach the open sea: their fleets cannot sail out of them."
PP_EU_NAV_REACHES: "Not Every Reach Is Open"
PP_EU_NAV_REACHES_DESC: "Fleets move quickly along a waterway and goods travel it far more cheaply than over land, which raises the [market_access|e] of every bank. But each reach is only as good as its water."
PP_EU_NAV_OPEN: "Navigable River"
PP_EU_NAV_OPEN_DESC: "Open water for fleets and for trade. Most of the great rivers of Europe, Asia and the Americas have long navigable reaches."
PP_EU_NAV_DIFFICULT: "Difficult Waterway"
PP_EU_NAV_DIFFICULT_DESC: "A great tropical or strongly seasonal river. Floods, low water and sandbars make it slow and dear to use, though boats still get through."
PP_EU_NAV_SHALLOWS: "Shallows"
PP_EU_NAV_SHALLOWS_DESC: "Shoals, rapids and mill weirs. Boats get through slowly and at a cost until a River Navigation Canal opens them."
PP_EU_NAV_FALLS: "Falls"
PP_EU_NAV_FALLS_DESC: "Falls and great rapids that no boat passes and no canal opens. Here the waterway ends for boats."
PP_EU_NAV_CANAL: "Opening the Shallows"
PP_EU_NAV_STEP_SHALLOWS: "Shallows"
PP_EU_NAV_STEP_SHALLOWS_DESC: "Boats pass slowly and at a cost."
PP_EU_NAV_STEP_BUILD: "Build a Canal"
PP_EU_NAV_STEP_BUILD_DESC: "On any bank of the shallows: weirs with locks, dredged channels and towpaths."
PP_EU_NAV_STEP_OPEN: "Canal Passage"
PP_EU_NAV_STEP_OPEN_DESC: "The shallows become the easiest waterway of all, for fleets and for trade."
PP_EU_NAV_CANAL_DESC: "The canal comes with the Road Building [advance|e]. It takes long to build, needs a little lumber, tools and stone to keep up and never closes. The passage stays open while any bank of the shallows keeps its canal. China starts with its Grand Canal open."
PP_EU_NAV_WHERE: "Where to See It"
PP_EU_NAV_WHERE_DESC: "$BULLET$ #T The map:#! the Rivers and Navigation map mode shows every waterway, what kind it is and whether it reaches the open sea.\n$BULLET$ #T The location view:#! it says whether a location lies on a sea coast, on a waterway or inland."
game_concept_pp_food_in_eu5: "P&P: Food"
game_concept_pp_food_in_eu5_desc: "There is no food market. Everything hinges on the province store: food exists only as [ShowGoodsName('local_food')|e] in a [province|e]'s store or as a trade good on the goods market."
# Food card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_FOOD_CAPITAL: "#T Your capital's province#!\n[GetPlayer.GetCapital.GetProvince.GetName]: #V [GetPlayer.GetCapital.MakeScope.ScriptValue('pp_province_food_storage_months')|1]#! months of food in its [Concept('pp_food_storage', 'store')|e]"
PP_EU_FOOD_OR: "or"
PP_EU_FOOD_HINGE: "Everything Hinges on the Province Store"
PP_EU_FOOD_STORE_LOW: "Store Running Low"
PP_EU_FOOD_STORE_LOW_DESC: "Farms, herds and fisheries make more [ShowGoodsName('local_food')|e] for their own province and send fewer [pp_staple_foods|e] to the goods market."
PP_EU_FOOD_STORE_FULL: "Store Full"
PP_EU_FOOD_STORE_FULL_DESC: "They send more [pp_staple_foods|e] to the goods market and make less Province Food."
PP_EU_FOOD_HINGE_DESC: "Every producer of staple foods splits its output between its province and the market, and the province store decides the split. The store is counted in months of food: a full store makes the province grow, an empty one starves it (see [pp_food_storage|e])."
PP_EU_FOOD_PLACES: "Food Lives in Two Places"
PP_EU_FOOD_PLACE_STORE: "In the Province Store"
PP_EU_FOOD_PLACE_STORE_DESC: "As [ShowGoodsName('local_food')|e]. It feeds the [pops|e] of its own province and is never traded: it never leaves the province."
PP_EU_FOOD_PLACE_MARKET: "On the Goods Market"
PP_EU_FOOD_PLACE_MARKET_DESC: "As a trade good: [pp_staple_foods|e] and [ShowGoodsName('victuals')|e] are bought and sold like cloth or iron. On the market they feed nobody until a building turns them into Province Food."
PP_EU_FOOD_STAPLES_ROW: "#T Staple Foods#!\nhover each good"
PP_EU_FOOD_WAYS_IN: "How Food Gets Into the Store"
PP_EU_FOOD_WAY_SUBSISTENCE: "Subsistence"
PP_EU_FOOD_WAY_SUBSISTENCE_DESC: "Unemployed [ShowPopTypeName('peasants')] grow their own food. What they do not eat goes into the store."
PP_EU_FOOD_WAY_BUILDINGS: "Buildings"
PP_EU_FOOD_WAY_BUILDINGS_DESC: "Farms such as the [ShowBuildingTypeName('wheat_farm')|e], the [ShowBuildingTypeName('cookshop')|e] and the [ShowBuildingTypeName('tavern')|e] make Province Food for their province. See [pp_food|e] for each of them."
game_concept_pp_food: "P&P: Food Production"
game_concept_pp_food_desc: "Food gets into a province store in two ways: through subsistence, when unemployed peasants grow more than they eat, and through buildings that turn [pp_staple_foods|e] or [ShowGoodsName('victuals')|e] into [ShowGoodsName('local_food')|e]. Two buildings pack food into victuals for the market instead."
# Food Production card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_PROD_SUBSISTENCE: "Subsistence"
PP_EU_PROD_GROWS: "Grows"
PP_EU_PROD_GROWS_DESC: "Every unemployed peasant family works its own plot and grows food."
PP_EU_PROD_EATS: "Eats"
PP_EU_PROD_EATS_DESC: "The family eats part of it. How much is its [ShowModifierTypeName('global_peasants_food_consumption')]."
PP_EU_PROD_SURPLUS: "Surplus"
PP_EU_PROD_SURPLUS_DESC: "The rest goes into the province store as [ShowGoodsName('local_food')|e]."
PP_EU_PROD_MORE_SURPLUS: "Less Eaten, More Surplus"
PP_EU_PROD_MORE_SURPLUS_DESC: "Everything that lowers peasant food consumption raises the surplus: the [ShowBuildingTypeName('cookshop')|e], [Concept('good_harvest', 'strong harvests')|e], [Concept('pp_abundant_free_land', 'Abundant Arable Land')|e] and more."
PP_EU_PROD_LESS_SURPLUS: "More Eaten, Less Surplus"
PP_EU_PROD_LESS_SURPLUS_DESC: "Everything that raises it lowers the surplus: [Concept('poor_harvest', 'weak harvests')|e], [Concept('pp_overused_arable_land', 'Overused Arable Land')|e] and more."
PP_EU_PROD_BUILDINGS: "Buildings"
PP_EU_PROD_FARMS: "Staple Food Farms"
PP_EU_PROD_FARMS_DESC: "The [ShowBuildingTypeName('wheat_farm')|e], [ShowBuildingTypeName('rice_farm')|e], [ShowBuildingTypeName('cattle_farm')|e], [ShowBuildingTypeName('fishing_village')|e] and every other building that produces [pp_staple_foods|e] always does both: it feeds its own province with [ShowGoodsName('local_food')|e] and sells its crop on the goods market. While the province store runs low it makes more Province Food and sells less; while the store is full it sells more."
PP_EU_PROD_COOKSHOPS: "Cookshops"
PP_EU_PROD_COOKSHOPS_DESC: "A [ShowBuildingTypeName('cookshop')|e] stands in a town or the province capital and needs farms in its province: the more farms, the more levels it can have. Cookshops and their upgrade, the [ShowBuildingTypeName('public_kitchen')|e], are strong food makers, and they even lower peasant food consumption: fresh food that would spoil is eaten where it is cooked."
PP_EU_PROD_GRANGES: "Granges"
PP_EU_PROD_GRANGES_DESC: "The [ShowBuildingTypeName('grange')|e] is a building of the [ShowPopTypeName('nobles')] in the province capital. Once the province store is full, it takes the surplus [ShowGoodsName('local_food')|e] and sells it as [ShowGoodsName('victuals')|e] on the goods market: less food for the province, more victuals for the market."
PP_EU_PROD_YARDS: "Victualling Yards"
PP_EU_PROD_YARDS_DESC: "The main source of [ShowGoodsName('victuals')|e]. A [ShowBuildingTypeName('victualling_yard')|e] stands in market centres and good harbours, buys [pp_staple_foods|e] on the goods market and packs them into victuals for the market. It never touches the province store."
PP_EU_PROD_TAVERNS: "Taverns"
PP_EU_PROD_TAVERNS_DESC: "A [ShowBuildingTypeName('tavern')|e] in the province capital buys [ShowGoodsName('victuals')|e] on the goods market and serves them as [ShowGoodsName('local_food')|e]. It is the main way to feed provinces that grow little food, or whose people you would rather put to other work."
# Staple Foods (support concept, pp_staple_foods.txt): the goods are config/goods_categories.csv staple_group (tests/test_europedia_style.py)
game_concept_pp_staple_foods: "Staple Foods"
game_concept_pp_staple_foods_desc: "The foods people lived on. They are trade goods: on the goods market they feed nobody until a building turns them into [ShowGoodsName('local_food')|e]. Their producers follow the province store: while it is full they send more to the market, while it runs low they make more Province Food.\n\n#T Staple crops:#! [ShowGoodsName('wheat')|e], [ShowGoodsName('rice')|e], [ShowGoodsName('millet')|e], [ShowGoodsName('maize')|e], [ShowGoodsName('potato')|e], [ShowGoodsName('legumes')|e]\n#T Staple animals:#! [ShowGoodsName('livestock')|e], [ShowGoodsName('fish')|e], [ShowGoodsName('wild_game')|e], [ShowGoodsName('wool')|e], [ShowGoodsName('camels')|e]\n#T Staple fruits:#! [ShowGoodsName('fruit')|e], [ShowGoodsName('olives')|e]"
game_concept_pp_population_growth: "Population Growth"
game_concept_pp_population_growth_desc: "People grow from one thing only: the food stored in their [province|e]. The more months of food its [Concept('pp_food_storage', 'store')|e] holds, the faster every location of the province grows. With little in store the province slowly shrinks, and once the store runs dry it starves."
# Population Growth card (encyclopedia_lateralview.gui); the scale steps are tied to pp_stored_food.txt and the location ranks by tests/test_europedia_style.py
PP_EU_GROWTH_CAPITAL: "#T Your capital's province#!\n[GetPlayer.GetCapital.GetProvince.GetName]: #V [GetPlayer.GetCapital.MakeScope.ScriptValue('pp_province_food_storage_months')|1]#! months of food in its [Concept('pp_food_storage', 'store')|e], which is #V [GetPlayer.GetCapital.GetProvince.GetFoodCapacityPercent|0]%#! full\n[GetPlayer.GetCapital.GetName]: local [population_growth|e] #V [GetPlayer.GetCapital.MakeScope.ScriptValue('pp_population_growth_map_value')|2%+]#! a year"
PP_EU_GROWTH_STORE: "What Fills the Store and What Empties It"
PP_EU_GROWTH_IN: "Food Comes In"
PP_EU_GROWTH_IN_DESC: "[ShowPopTypeName('peasants')] without other work grow their own food, and the province's food buildings make more. See [Concept('pp_food', 'Food Production')|e]."
PP_EU_GROWTH_EATEN: "Its People Eat"
PP_EU_GROWTH_EATEN_DESC: "Every [pop|e] of the province eats from the same store each month, and a little of it spoils ([food_decay|e])."
PP_EU_GROWTH_MONTHS: "Months in Store"
PP_EU_GROWTH_MONTHS_DESC: "What stays is counted in months: how long the store would feed the province. Those months decide how fast it grows."
PP_EU_GROWTH_STORE_DESC: "One [province|e], one store: all its locations eat from it and all grow from it, the capital as much as the smallest village. A surplus with no room left in the store adds no growth, and food on the goods market feeds nobody until a building brings it into a store (see [Concept('pp_food_in_eu5', 'Food')|e]). Crowded land ([Concept('pp_overused_arable_land', 'Overused Arable Land')|e]) makes its peasants eat more."
PP_EU_GROWTH_SCALE: "From Starving to Full"
PP_EU_GROWTH_SCALE_STARVING: "[ShowModifier('province_starving')]\npeople die and leave"
PP_EU_GROWTH_SCALE_EMPTY: "[ShowModifier('pp_food_store_0')]\nshrinks slowly"
PP_EU_GROWTH_SCALE_VILLAGES: "[ShowModifier('pp_food_store_4')]\nrural settlements hold steady"
PP_EU_GROWTH_SCALE_TOWNS: "[ShowModifier('pp_food_store_8')]\ntowns and cities hold steady"
PP_EU_GROWTH_SCALE_GROWING: "[ShowModifier('pp_food_store_12')]\nevery settlement grows"
PP_EU_GROWTH_SCALE_FULL: "[ShowModifier('pp_food_store_24')]\nfastest growth"
PP_EU_GROWTH_SCALE_DESC: "Hover a step for its effects. A province carries one Stored Food modifier, the one for its months in store, and every month in store adds a little growth to all its locations, a touch less near the top. Each settlement also loses a few people a year on its own, towns and cities more than rural settlements ([location_rank|e]). So a province with little in store slowly shrinks; as the store fills, first its rural settlements and then its towns and cities begin to grow. A full store brings the fastest growth and draws settlers from leaner provinces. When the store has run dry and a month's food falls short, the province starves: people die, and peasants and laborers leave. Apart from food, a plague ([disease|e]) or a [ShowModifier('looted')] location also costs people."
PP_EU_GROWTH_ROOM: "Room in the Store"
PP_EU_GROWTH_ROOM_OWN: "Room of Its Own"
PP_EU_GROWTH_ROOM_OWN_DESC: "Every province has room for some food, more the more people live in it. Without a Granary most stores are full at around [ShowModifier('pp_food_store_12')]. An enemy occupation or looting takes much of the room away."
PP_EU_GROWTH_ROOM_GRANARY: "Granaries"
PP_EU_GROWTH_ROOM_GRANARY_DESC: "A [ShowBuildingTypeName('granary')|e] stands only at the [province_capital|e]. Each level adds room for food and keeps it from spoiling ([food_decay|e]). A store as full as [ShowModifier('pp_food_store_24')] takes Granaries."
PP_EU_GROWTH_WHERE: "Where to See It"
PP_EU_GROWTH_WHERE_DESC: "$BULLET$ #T The location view:#! the Stored Food chip at the top right shows the province's months in store; hover it for its Stored Food modifier and every effect. A starving province shows the Starving chip instead.\n$BULLET$ #T The map:#! the Province Food Growth map mode in the Economy group colours every province by its months in store and stripes the full stores; the Population Growth map mode in the Population group colours every location by its growth and stripes the fastest-growing ones. Both stripe starving provinces too.\n$BULLET$ #T The growth tooltip:#! hover a location's [population_growth|e] for everything that adds to it or takes from it."
game_concept_pp_buildings_in_location: "P&P: Buildings in Location"
game_concept_pp_buildings_in_location_desc: "Locations receive [ShowModifier('building_levels')] based on their total [building|e] levels. Buildings can increase [population_capacity|e], but ordinary construction also pressures shared rural space.\n\nIn [pp_farm_capacity|e] and [pp_forest_capacity|e] maximum-level tooltips, total building levels are shown directly as reduced rural capacity. The exact current reduction is shown in that tooltip row.\n\n[ShowModifierEffect('building_levels')]"
game_concept_pp_available_free_land: "P&P: Available Arable Land"
game_concept_pp_available_free_land_desc: "Part of a location's [population_capacity|e] is still free: [ShowModifier('available_free_land')]. With fewer people competing for the same land, they can choose better fields, pastures, fishing spots and forest work sites instead of being forced onto marginal ground. The effects shrink as the land fills and are gone when it is full; past full the land becomes [Concept('pp_overused_arable_land', 'Overused Arable Land')|e].\n\n[ShowModifierEffect('available_free_land')]"
game_concept_pp_abundant_free_land: "P&P: Abundant Arable Land"
game_concept_pp_abundant_free_land_desc: "Almost all of a location's [population_capacity|e] is still free and few people live there yet: [ShowModifier('abundant_free_land')]. Settlers pick the best fields, pastures and fishing grounds and live partly off what they gather. Once more of the land is used, or the settlement grows, it becomes [Concept('pp_available_free_land', 'Available Arable Land')|e].\n\n[ShowModifierEffect('abundant_free_land')]"
game_concept_pp_food_storage: "P&P: Food Storage"
game_concept_pp_food_storage_desc: "Storage mechanics for food determine how sieges and shortages play out. Empty storages lead to emigration, demotion, and death."
game_concept_pp_prosperity: "P&P: Prosperity"
game_concept_pp_prosperity_desc: "Prosperity is great for locations in the long term. In this mod, it is closely tied to food availability: cheap food and well-stocked storages boost prosperity, which in turn supports higher food consumption and [population_growth|e]. See [pp_food_consumption|e] for how food prices affect prosperity.\n\n#T Note:#!\nProsperity scales from 0% to 100%.\n\n[ShowModifierEffect('prosperity')]"
game_concept_pp_devastation: "P&P: Devastation"
game_concept_pp_devastation_desc: "Devastation has horrible consequences for locations. See [pp_food_consumption|e] for full context.\n\n#T Note:#!\nDevastation scales from 0 to -100%, so the values shown below are actually inverted at -100% devastation.\n\n[ShowModifierEffect('devastation')]"
game_concept_pp_province_current_food_storage: "P&P: Province Current Food Storage"
game_concept_pp_province_current_food_storage_desc: "Food a province keeps in storage drives its [population_growth|e]; see [pp_positive_province_food_growth|e]. See [pp_food_consumption|e] for context."
game_concept_pp_positive_province_food_growth: "P&P: Province Food Growth from Storage"
game_concept_pp_positive_province_food_growth_desc: "A [province|e] grows from the food it holds in storage. The months of its own consumption it has in store give the province a Stored Food modifier, renewed each month, that raises the [population_growth|e] of every location in it, up to a cap; storage beyond the cap adds nothing more. Food is the only source of growth here: a monthly surplus that is not stored adds no growth, and a province whose store runs empty loses the modifier.\n\nWith the same modifier the province recovers faster from devastation, draws settlers and prospers. All its effects grow with the store up to the same cap.\n\nThe store also sets what food is worth in the province. While it holds less than a year of the province's needs (Low Stores), farms, cookshops and taverns cook and serve more. While it holds more (Full Stores), they slow down and the [ShowBuildingTypeName('grange')|e] packs the surplus for the markets. Cookshops that would only add to a full store are not worth extending.\n\nThe Province Food Growth map mode and the stored-food status in the location view show the months in store and the effects they give. See [pp_food_consumption|e] for context."
game_concept_pp_cheap_food: "P&P: Cheap Food in Location"
game_concept_pp_cheap_food_desc: "When food is cheap on the market and province storages are well stocked, locations receive [ShowModifier('cheap_food_in_location')]. People consume more—less rationing, choosier diets. These effects scale depending on how far below the base price the food price is: the cheaper it gets, the stronger the modifier. See [pp_food_consumption|e] for full context.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('cheap_food_in_location')]"
game_concept_pp_expensive_food: "P&P: Expensive Food in Location"
game_concept_pp_expensive_food_desc: "When food is expensive on the market and province storages are low or empty, locations receive [ShowModifier('expensive_food_in_location')]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. These effects scale depending on how far above the base price the food price is: the more expensive it gets, the stronger the modifier. See [pp_food_consumption|e] for full context.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]"
game_concept_pp_starvation: "P&P: Starvation"
game_concept_pp_starvation_desc: "When a province's food storage reaches 0, the pops will starve and die.\n\nThis gives the following effect:\n[ShowModifierEffect('province_starving')]"
game_concept_pp_farm_capacity: "P&P: Rural Capacities"
game_concept_pp_farm_capacity_desc: "Every [location|e] has room for only so many farms, fisheries and forest villages. Farms take their land from its [population_capacity|e], fishing buildings share its [pp_fish_capacity|e] and forest buildings its [pp_forest_capacity|e]. The room limits how many levels can stand, not how much each level makes."
game_concept_pp_fish_capacity: "Fishing Capacity"
game_concept_pp_fish_capacity_desc: "The fishing grounds of a [location|e]: how many levels of fishing villages and fisheries it can hold. A sea coast gives the most; a [lake|e], wetlands, a [river|e] and a fish [rgo|e] add to it. Every level of a fishing building uses up part of it. See [pp_farm_capacity|e]."
game_concept_pp_forest_capacity: "Forest Capacity"
game_concept_pp_forest_capacity_desc: "The woodland of a [location|e]: how many levels of forest villages and lumber mills it can hold. Forests and swamps give the most, woods and jungle less, and a forest [rgo|e] adds to it. Towns and cities clear part of it, every building level in the location takes a little, and every level of a forest building uses up part of it. See [pp_farm_capacity|e]."
# Rural Capacities card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
PP_EU_RURAL_CAPITAL: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: free [population_capacity|e] for #V [GetPlayer.GetCapital.MakeScope.ScriptValue('farm_capacity')|0]#! more farm levels; [pp_fish_capacity|e] left #V [GetPlayer.GetCapital.MakeScope.ScriptValue('fish_capacity')|1]#!, [pp_forest_capacity|e] left #V [GetPlayer.GetCapital.MakeScope.ScriptValue('forest_capacity')|1]#!"
PP_EU_RURAL_FARMS: "Farms Take Arable Land"
PP_EU_RURAL_FARMS_DESC: "Farms have no capacity of their own. Every farm level takes a share of the location's [population_capacity|e], the land its people live on, so all farms compete for the same land. A farm's maximum level adds it up like this:"
PP_EU_RURAL_FARM_LAND: "Arable Land for This Farm"
PP_EU_RURAL_FARM_LAND_DESC: "All the arable land farms may use here, counted in levels of this farm. A little always stays free."
PP_EU_RURAL_FARM_OTHERS: "Used by Other Farms"
PP_EU_RURAL_FARM_OTHERS_DESC: "The land the other farms here already take. The farm's own levels and those of the lower tiers it replaces do not count."
PP_EU_RURAL_FARM_MAX: "Maximum Level"
PP_EU_RURAL_FARM_MAX_DESC: "What is left is the farm's limit. Every new farm level, of any kind, uses up land the other farms could have had."
PP_EU_RURAL_FIELDS_ROW: "#T Fields, orchards and vineyards#!\ntake a share each level"
PP_EU_RURAL_HERDS_ROW: "#T Herds#!\ntake the smallest share"
PP_EU_RURAL_PLANTATIONS_ROW: "#T Plantations and spice gardens#!\ntake the largest share"
PP_EU_RURAL_FARMS_NOTES: "Hover a farm for its exact share, its [ShowModifierTypeName('local_pp_farmland_used')]. Its upgrades take the same share, so an upgrade never needs new land. Farms count only the land, not the people on it: they do not wait for room, and built on crowded land they leave it [Concept('pp_overused_arable_land', 'Overused Arable Land')|e]. Land improvements and most other buildings add arable land and so make room for more farms; see [population_capacity|e]."
PP_EU_RURAL_FISH: "Fishing Capacity"
PP_EU_RURAL_FISH_DESC: "Fishing villages and fisheries share the location's [pp_fish_capacity|e]: every level uses up a part of it, so the water decides how many can stand. A sea coast gives the most, a [lake|e] or a fish [rgo|e] somewhat less, wetlands a little, and a [river|e] more the bigger it is. A large [rgo|e] makes the grounds go further, and Manorial Custumals, one of the [town_rights|e], adds a little."
PP_EU_RURAL_GROUNDS_ROW: "#T Fishing grounds#!\nadd capacity"
PP_EU_RURAL_FISHERS_ROW: "#T Fishing buildings#!\nuse it up, level by level"
PP_EU_RURAL_FISH_NOTES: "An upgrade takes over the capacity of the building it replaces. The [ShowBuildingTypeName('pearl_fishery')|e] does not use it."
PP_EU_RURAL_FOREST: "Forest Capacity"
PP_EU_RURAL_FOREST_DESC: "Forest villages and lumber mills share the location's [pp_forest_capacity|e] the same way. Forests and swamps give the most, woods, thicket and dry forest less, jungle the least. A forest [rgo|e] adds more, a large [rgo|e] of any kind makes the woodland go further, and Manorial Custumals adds a little. Towns clear part of the woods, cities much more, and every [building|e] level in the location takes a little. Here too an upgrade takes over the capacity of the building it replaces."
PP_EU_RURAL_WOODLAND_ROW: "#T Woodland#!\nthe denser, the more"
PP_EU_RURAL_FOREST_RGO_ROW: "#T Forest RGOs#!\nadd more"
PP_EU_RURAL_CLEARED_ROW: "#T Towns and buildings#!\nclear it"
PP_EU_RURAL_FORESTERS_ROW: "#T Forest buildings#!\nuse it up, level by level"
PP_EU_RURAL_WHERE: "Where to See It"
PP_EU_RURAL_WHERE_DESC: "$BULLET$ #T Buildings:#! hover a farm's, fishery's or forest building's maximum level for everything that adds to its room or takes from it.\n$BULLET$ #T The map:#! the $mapmode_pp_farming_village_capacity_name$, $mapmode_pp_fishing_village_capacity_name$ and $mapmode_pp_forest_village_capacity_name$ map modes in the Geography group colour every location by the room it has left; farming counts the free arable land in farm levels.\n$BULLET$ #T Over the limit:#! when the room shrinks below the levels that stand, the building gives up a level every few years until it fits.\n$BULLET$ #T Other rural works:#! mines, quarries, saltworks, charcoal makers and the like have a limit of their own, shown on their maximum level."
game_concept_pp_population_capacity: "P&P: Arable Land"
game_concept_pp_population_capacity_desc: "Arable Land is what a location's fields, pastures and waters can feed, counted in people rather than acres. Its people live on it, farms take their share of it, and land improvements win more of it. What matters is how full it is: free land lets a location thrive, crowded land holds it back."
game_concept_pp_overused_arable_land: "Overused Arable Land"
game_concept_pp_overused_arable_land_desc: "More people live here than the [population_capacity|e] can feed: [ShowModifier('overpopulation')]. The plots of the [ShowPopTypeName('peasants')] leave less to spare, pops sink into lower classes faster, people move away, sickness spreads more easily and idle hands join mercenary companies. The further people outnumber the land, the stronger it gets.\n\n[ShowModifierEffect('overpopulation')]"
# Labor card (encyclopedia_lateralview.gui, card style pp_europedia_style.gui)
game_concept_pp_labor: "P&P: Labor"
game_concept_pp_labor_desc: "Every building pays part of its costs in [ShowGoodsName('manual_labor')|e], a trade good that idle peasants supply to their own [market|e]. Where hands are plentiful labor is cheap; where towns crowd a market it gets dear, and buildings answer by switching to methods that need fewer hands."
PP_EU_LABOR_CAPITAL: "#T Your capital's market#!\n[GetPlayer.GetCapital.GetMarket.GetName]: [ShowGoodsName('manual_labor')] costs #V [GetPlayer.GetCapital.GetMarket.MakeScope.ScriptValue('pp_manual_labor_market_price_map_value')|2]#! gold"
PP_EU_LABOR_FLOW: "Where Labor Comes From"
PP_EU_LABOR_STEP_IDLE: "Idle Peasants"
PP_EU_LABOR_STEP_IDLE_DESC: "Every [Concept('unemploy', 'unemployed')|e] [ShowPopTypeName('peasants')] supplies a fixed amount of labor to its market, whether anyone needs it or not."
PP_EU_LABOR_STEP_GOOD: "Manual Labor"
PP_EU_LABOR_STEP_GOOD_DESC: "[ShowGoodsName('manual_labor')|e] is bought and sold like any good, but it never leaves its market: hands are hired where they live."
PP_EU_LABOR_STEP_BUILDINGS: "Every Building"
PP_EU_LABOR_STEP_BUILDINGS_DESC: "Every [production_method|e] pays part of its input cost in labor: older methods a large part, newer ones a small part."
PP_EU_LABOR_STEP_PRICE: "The Wage"
PP_EU_LABOR_STEP_PRICE_DESC: "Supply and demand set labor's [market_price|e]. With idle hands to spare, labor sits at its lowest price; once buildings want more than the peasants supply, it climbs."
PP_EU_LABOR_AGES: "Newer Methods Need Fewer Hands"
PP_EU_LABOR_AGE_GUILD: "Guilds"
PP_EU_LABOR_AGE_GUILD_DESC: "Hand work: labor is a large part of the cost."
PP_EU_LABOR_AGE_WORKSHOP: "Workshops"
PP_EU_LABOR_AGE_WORKSHOP_DESC: "Better tools and divided work: less labor for the same goods."
PP_EU_LABOR_AGE_MANUFACTORY: "Manufactories"
PP_EU_LABOR_AGE_MANUFACTORY_DESC: "Water power and large halls: labor is a modest part of the cost."
PP_EU_LABOR_AGE_MILL: "Mills and Factories"
PP_EU_LABOR_AGE_MILL_DESC: "Machines do most of the work: labor is only a small part of the cost."
PP_EU_LABOR_AGES_DESC: "The tools line above stands for all of them, farms, mines and fisheries included: each [age|e] brings methods that pay less of their cost in labor and more in goods such as [ShowGoodsName('tools')|e]. Hover a building's methods to see the labor among their inputs."
PP_EU_LABOR_DEAR: "When Labor Gets Dear"
PP_EU_LABOR_DEAR_DESC: "Over the game some markets fill with towns and buildings while their idle peasants grow few, above all in highly urbanized lands. Their labor gets dearer, and two things follow: buildings that hire out labor start to pay, and buildings switch to methods that need less of it (see the trade-off below). The labor buildings lose money while labor sits at its lowest price, so they only spread where hands are truly scarce."
PP_EU_LABOR_PORTERS: "Hired Hands in Towns"
PP_EU_LABOR_PORTERS_DESC: "A [ShowBuildingTypeName('hired_labor_yard')|e] gathers porters, carters and other hired hands in towns and cities. Its [ShowPopTypeName('laborers')] are kept in beer, sacks, horses and carts."
PP_EU_LABOR_HIRING_FAIR: "Day Work in the Countryside"
PP_EU_LABOR_HIRING_FAIR_DESC: "At a [ShowBuildingTypeName('rural_daywork_yard')|e] peasant households take paid day work with their oxen, in the fields and at ditches and dykes. It stands in villages as well as towns."
PP_EU_LABOR_SLAVE_GANGS: "Slave Gangs"
PP_EU_LABOR_SLAVE_GANGS_DESC: "A [ShowBuildingTypeName('slave_labor_yard')|e] hires out enslaved people in work gangs, in cities where the slave trade is established. It is the cheapest labor of the three."
PP_EU_LABOR_TRADEOFF: "Cheap Labor or Dear Labor: a Trade-off"
PP_EU_LABOR_CHEAP: "Many Hands, Cheap Labor"
PP_EU_LABOR_CHEAP_DESC: "Populous, rural, lower-tech countries have labor to spare. Labor-heavy buildings and methods stay profitable there, so they keep them. But money paid for labor just leaves the economy: it buys no goods, so the trades that would supply tools and other goods stay small."
PP_EU_LABOR_DEAR_PANEL: "Crowded Cities, Dear Labor"
PP_EU_LABOR_DEAR_PANEL_DESC: "Highly urbanized countries pay more for labor and lose some profit, but their buildings switch on their own to methods with a smaller labor share. They buy [ShowGoodsName('tools')|e] and other goods instead, and that money keeps circulating: every tool bought keeps a toolmaker in business."
PP_EU_LABOR_OR: "or"
PP_EU_LABOR_TRADEOFF_DESC: "Neither path is simply better. Cheap labor pays well today; dear labor drains less money from the economy and keeps more trades busy."
PP_EU_LABOR_WHERE: "Where to See It"
PP_EU_LABOR_WHERE_DESC: "$BULLET$ #T The map:#! the $mapmode_pp_manual_labor_market_price_name$ map mode colors every market by what labor costs there.\n$BULLET$ #T The market:#! [ShowGoodsName('manual_labor')|e] in the market view shows who supplies labor and who buys it.\n$BULLET$ #T Buildings:#! every production method lists its labor among its inputs."
