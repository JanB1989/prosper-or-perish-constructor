l_english:
  # Start generated location potential concept
  game_concept_pp_location_potential: "Location Potential"
  game_concept_pp_location_potential_desc: "Location Potential is the shared calculation behind Prosper or Perish per-location population capacity and local output modifiers.\n\nThe values combine in-game geography with external map-derived evidence. They are meant to represent how suitable each location is for supporting people and producing local raw materials.\n\n#T In-game factors:#!\n$BULLET$ Topography\n$BULLET$ Climate\n$BULLET$ Vegetation\n$BULLET$ River access\n$BULLET$ Lake access\n$BULLET$ Coastal access\n$BULLET$ Location RGO\n\n#T Out-of-game maps and evidence:#!\n$BULLET$ Soil data\n$BULLET$ GAEZ crop potential and suitability maps\n$BULLET$ HYDE historical population coverage\n$BULLET$ Freshwater food support maps\n$BULLET$ Marine food support maps\n$BULLET$ Livestock food support maps\n$BULLET$ Plant food support maps\n$BULLET$ Wild subsistence support maps\n$BULLET$ Land-use confidence maps\n$BULLET$ Water confidence maps\n\nThe modelling and pipeline for this are in the GitHub repo, but they are subject to change. The final numbers are generated by the constructor pipeline, then injected into the shared per-location static modifiers used by the mod."
  # End generated location potential concept
# Override vanilla River concept to document PP's river size scaling
game_concept_river_desc: "A [location|e] may have a River, a moving body of water.\n\nRivers are not navigable by [navies|e], but they impose a [crossing|e] combat malus on [armies|e] who attempt to enter a [location] with a River. Additionally, they slightly increase the [population_capacity|e] of a location.\n\nThis modifier is multiplied by river size."
# Europedia mod overview - appears under Game Concepts, searchable for "prosper", "perish", "harvest"
ENCYCLOPEDIA_PAGE_PROSPER_OR_PERISH: "Prosper or Perish"
game_concept_prosper_perish_mod: "Prosper or Perish (Mod)"
game_concept_prosper_perish_mod_desc: "#T The Mod:#!\nThis mod overhauls the food system until it is fundamentally different from vanilla. After hundreds of modifier and advance changes and many hours of balancing, food is now the primary driver of pop growth and migration—replacing the old ties to [pp_prosperity|e], Development and similar factors, which instead now shape food capacity and growth.\n\nYou will see a sharp split between rural farming locations urbanized rich cities, incentives for local manufacturing in provinces to ease capital-centric \"clumping,\" and higher infrastructure costs so Roads become a strategic choice rather than something to spam.\n\nThe core loop is simple: full province and low food prices mean strong growth and many other benefits; empty storages and high prices mean heavy emigration, pop demotion, death and other bad outcomes.\n\nThe mod adds new Buildings, new production methods and a new Trade good. When you create a new game, check the game rules for Prosper or Perish: you can disable [pp_variable_harvests|e] if you want a steadier food economy without yearly harvest swings. You can also make the campaign harder—higher player building upkeep, stronger AI food efficiency, or cheaper AI building upkeep—or leave everything on defaults for the standard mod experience.\n\nPlease read at least [pp_food|e] and [pp_food_consumption|e]; they should be enough to get you playing.\n\n#T Promotions:#!\nI massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\n#T Feedback:#!\nI really need feedback for specific regions—send it on Steam as a PM or in the mod comments. If some regions look weird or super ahistoric, show me where and I will try to fix it. Same with Cookery recipes: we may need to add more to represent some regions. Please confirm it is not caused by other mods before sending screenshots.\n\nThere are many other changes not covered here. If something is confusing or I forgot to document it, tell me and I will try to add it to this Europedia in the future.\n\n#T How I Add Features:#!\nI follow this checklist:\n\n$BULLET$ Is the mechanic fun to manage for the player?\n$BULLET$ Is the mechanic a concept that can be understood historically?\n$BULLET$ Is the AI able to handle the mechanic?\n\nI am fine with victuals not exactly representing how food was traded and produced historically. I am fine with numbers in-game for how much food a noble consumes or a peasant—these are abstractions to get the game working. I can imagine a noble eating very expensive food, which is the abstraction for why he needs \"more\" food. But if I cannot even imagine how it would make sense in our world, I will likely only add it to get the game working at all.\n\n#T Thanks:#!\nA sincere thank you to everyone who reported bugs, helped with balancing, and took the time to share feedback. Thank you as well to everyone who created compatibility patches and collections around Prosper or Perish, and to the EU5 Mod Coop Discord for the discussions, help, and support.\n\nA special thank you to Karkento for letting me spam him with ideas nonstop and for helping so much with balancing and ideas.\n\nThanks as well to Noslon for providing valuable feedback and good solutions to fix the employment system.\n\nAnd a special thank you to Regal Urangutan for creating the EU5 2.0 collection centered around P&P, and for always being ready to chat and excited to talk about EU5."
game_concept_prosper_or_perish: "Prosper or Perish"
game_concept_harvest_situation: "P&P: Variable Harvests"
game_concept_harvest_situation_desc: "Each September, regions receive harvest conditions that can change farmed-goods output for the year. Broad harvest areas make nearby regions more likely to move together, but regions inside the same area can still differ. Average years leave no harvest modifier. Active harvest modifiers show their current effects on affected locations."
game_concept_pp_variable_harvests: "P&P: Variable Harvests"
game_concept_pp_variable_harvests_desc: "Harvests represent the yearly uncertainty of agriculture: weather, pests, timing, storage, water control, and local resilience are abstracted into a regional outcome.\n\nEach September, every [region|e] receives harvest conditions. Nearby regions can move together, and a run of good or bad years can make similar conditions more likely for a while. Average years leave no harvest modifier and use the normal map color.\n\n#T Broad Harvest Areas:#!\nThe map is grouped into broad harvest areas, such as Western Europe or South Asia. A broad area can have a favorable or difficult year, then each [region|e] inside it still receives its own harvest result. This makes nearby regions tend to move together without forcing every region to share the same outcome.\n\nThe area name on a harvest modifier tells you which broad harvest area shaped that location's crop mix and risk. The modifier itself shows the current effects for the affected goods.\n\n#T What Harvests Affect:#!\nActive harvests add a location modifier to owned locations. That modifier changes the output of farmed goods such as [ShowGoodsName('wheat')|e], [ShowGoodsName('rice')|e], [ShowGoodsName('livestock')|e], [ShowGoodsName('fish')|e], and plantation or orchard goods. The modifier tooltip shows the current effects.\n\nHarvests do not create food directly. They change goods output, which can move prices for raw foods and [ShowGoodsName('victuals')|e], and that pressure then feeds into the wider food system. For food prices, storage, growth, and starvation, see [pp_food|e].\n\n#T Reading the Map:#!\nDark harvest colors mean poor harvests; bright harvest colors mean good harvests. The default map color means there is no active harvest modifier here. Starvation and negative food-balance warnings can override the harvest color because those crises matter more at a glance.\n\n#T Optional Setting:#!\nYou can disable Variable Harvests with the game rule when starting a campaign."
harvest_situation: "P&P: Variable Harvests"
harvest_situation_desc: "Harvests represent the yearly uncertainty of agriculture: weather, pests, timing, storage, water control, and local resilience are abstracted into a regional outcome.\n\nEach September, every region receives harvest conditions. Nearby regions can move together, and a run of good or bad years can make similar conditions more likely for a while. Average years leave no harvest modifier and use the normal map color.\n\n#T Broad Harvest Areas:#!\nThe map is grouped into broad harvest areas, such as Western Europe or South Asia. A broad area can have a favorable or difficult year, then each region inside it still receives its own harvest result. This makes nearby regions tend to move together without forcing every region to share the same outcome.\n\nThe area name on a harvest modifier tells you which broad harvest area shaped that location's crop mix and risk. The modifier itself shows the current effects for the affected goods.\n\n#T What Harvests Affect:#!\nActive harvests add a location modifier to owned locations. That modifier changes the output of farmed goods such as wheat, rice, livestock, fish, and plantation or orchard goods. The modifier tooltip shows the current effects.\n\nHarvests do not create food directly. They change goods output, which can move prices for raw foods and victuals, and that pressure then feeds into the wider food system.\n\n#T Reading the Map:#!\nDark harvest colors mean poor harvests; bright harvest colors mean good harvests. The default map color means there is no active harvest modifier here. Starvation and negative food-balance warnings can override the harvest color because those crises matter more at a glance.\n\n#T Optional Setting:#!\nYou can disable Variable Harvests with the game rule when starting a campaign."
harvest_situation_monthly: "• Harvests are checked each September for every region\n• Broad harvest areas make nearby regions more likely to move together\n• Active harvests appear as location modifiers; hover an affected location to see current effects\n• Average years have no harvest modifier and use the normal map color\n• Poor harvests reduce farmed-goods output; strong harvests improve it\n• The game rule can disable this system at campaign start"
game_concept_abysmal_harvest: "Failed Harvest"
game_concept_abysmal_harvest_desc: "A disastrous regional harvest that strongly reduces the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
game_concept_very_poor_harvest: "Bad Harvest"
game_concept_very_poor_harvest_desc: "A poor regional harvest that reduces the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
game_concept_poor_harvest: "Weak Harvest"
game_concept_poor_harvest_desc: "A weak regional harvest that lowers the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
game_concept_good_harvest: "Strong Harvest"
game_concept_good_harvest_desc: "A strong regional harvest that improves the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
game_concept_very_good_harvest: "Excellent Harvest"
game_concept_very_good_harvest_desc: "An excellent regional harvest that greatly improves the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
game_concept_bountiful_harvest: "Exceptional Harvest"
game_concept_bountiful_harvest_desc: "An exceptional regional harvest that greatly improves the output of affected farmed goods. Inspect an affected [location|e]'s harvest modifier for the current effects."
# Game concepts for P&P feature landing page
game_concept_pp_getting_started: "Getting Started"
game_concept_pp_getting_started_desc: "#T Getting Started#!\nIf you are new or returning, the changes can be overwhelming because there are so many.\n\n#T First, Check Your Settings#!\nFirst check if you actually started with the correct settings. You can change a bunch of things you do not like. The game is balanced around the default settings, but I personally often play without Variable Harvests.\n\n#T Recommended Community Mods#!\nI personally almost always use the Community Mod Framework mods Faster Universalis, with default settings, and Construction Manager. Construction Manager especially allows you to build or upgrade buildings based on the time they take to pay for their building cost. Since P&P changes building costs in a lot of places, this is a much more sensible metric than building based on profit.\n\n#T What to Pay Attention To#!\nIn general, this mod makes food much more important. When you urbanize, you increase your food consumption. This food needs to be produced somewhere and distributed.\n\nThe most important thing I try to make happen is that expensive food in the food market creates a cascading effect where building up your downstream food production becomes profitable and necessary.\n\nIn simple terms, it always works like this:\n$BULLET$ 1. Turn the food slider low; do not bankrupt yourself.\n$BULLET$ 2. If food is expensive, you need more victuals. Cookeries produce these.\n$BULLET$ 3. If victuals are cheap but food is expensive, you need Victuals Markets. These convert victuals to local food. They become profitable if food is expensive and victuals are cheap.\n$BULLET$ 4. If food is cheap and province storages are full, your population grows faster and you get more prosperity.\n$BULLET$ 5. If food is expensive, your population grows slower and you get less prosperity.\n\nIt is best to understand how [ShowBuildingTypeName('victuals_market')|e] works. They will hire and fire people based on whether they can profitably sell food locally. You can subsidize them, but you rarely need to. Just leave them be and build them in cities where you do not want to produce food with [ShowBuildingTypeName('cookery')|e].\n\nEssentially everything is balanced around this idea.\n\n#T RGOs#!\nRGOs are removed and replaced by buildings. Buildings are just more interesting.\n\n#T Variable Harvests#!\nThey happen yearly and make your crop production vary a lot.\n\n#T Map Modes#!\nPlease familiarize yourself with the map modes. I added a lot. They are very helpful for many things.\n\n#T Farming, Forest, and Fishing Capacity#!\nThere are map modes for these as well. They are just shared buckets for buildings. For example, building a farming building removes one capacity point from the farming capacity bucket. The idea is that buildings that use arable land compete for space.\n\n#T Location Potential#!\nThis is a static modifier produced by a complicated out-of-game pipeline. It calculates the fertility of a location based on many out-of-game factors that do not exist in game, like soil, water access, temperatures, and more.\n\n#T Building Levels#!\nYou will see some locations cannot build too many buildings until they reach their capacity. You can still overbuild, but it would be wise to build infrastructure buildings so you do not suffer the consequences of being over capacity.\n\nPlease use the filters in the building menu or the relevant map mode to find the places where you are over capacity and build the buildings there.\n\n#T Food Revenue Good#!\nThis is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that."
game_concept_pp_faq: "F.A.Q."
game_concept_pp_faq_desc: "#T Q: Are my other mods compatible with Prosper or Perish?:#!\nI recommend playing with the Community Framework mods Faster Universalis and Construction Manager. For everything else, you need to try it yourself or ask in the Discord. If you test other mods, load Prosper or Perish last and run an Observer test before committing to a campaign.\n\n#T Q: An update ruined my save. What do I do?:#!\nSteam Workshop updates can break old saves. Download the matching older release from https://github.com/JanB1989/prosper-or-perish-constructor/releases . Extract the repository archive, open its mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then use that local copy for the old save instead of the auto-updating Workshop copy.\n\n#T Q: How do I install the GitHub version?:#!\nGo to https://github.com/JanB1989/prosper-or-perish-constructor and download the repository, or download the branch or release you want. Extract it, open the repository's mod folder, and copy the Prosper or Perish (Population Growth & Food Rework) folder into C:\\Users\\YourUserName\\Documents\\Paradox Interactive\\Europa Universalis V\\mod . Then enable that local copy in the EU5 launcher.\n\n#T Q: Why is everyone starving at game start?:#!\nI put a lot of effort into cleaning up the start, but the economy can still take a couple of years to settle. I will keep working on this; you are good to go."
game_concept_pp_update_0_9: "Update 0.9"
game_concept_pp_update_0_9_desc: "#T Update 0.9#!\nHey guys,\n\nRead the Overview page to see roughly what changed. Most should be familiar.\n\nI spent a bunch of time resolving many, many bugs and improving UI clarity. I streamlined many things as well. All of this improved performance and AI performance by a good chunk.\n\nOf course, I added new buildings, new production methods, new advances, and more.\n\n#T Biggest Changes from 0.8#!\n$BULLET$ #Y 1. The location building cost malus is gone.#! It is replaced with scaling building cost per industry and the new logistics system, where each location has an inherent building limit depending on many factors like vegetation, topography, and more. This is meant as the rough natural limit of how easily a location can be supplied. If you go over the building limits, you get some negative modifiers. Different buildings allow you to increase the limit. If you are on a big river, for example, the buildings you build are much cheaper to maintain. If you are in a landlocked jungle, you have fewer options and it is more expensive.\n\n$BULLET$ #Y 2. Victuals Markets and Food Revenue.#! It is a constant struggle to make food prices cascade down into making farming buildings possible. I wrote a post about this on the Paradox forum with recommended changes in the thread \"Food feedback\". This is why I changed the Victuals Market again, as its responsibility is ultimately to convert food goods into local food and allow this cascading effect to happen. The Victuals Market now produces a good called Food Revenue. This is not your usual good. It serves no purpose other than to locally create conditions where converting victuals to food can be profitable if victuals are cheap and the market food price is expensive. The AI now perfectly understands this and builds these without any scripting help. I hope in the medium-term future Paradox changes the food system so we do not need all these mechanisms for the food system to function like it should. They are aware of it, and it sounds to me like a medium-term refactor might be in the cards. We have to see and hope.\n\n$BULLET$ #Y 3. Please use the Community Mod Framework.#! I recommend using Faster Universalis as well, and at least use the Construction Manager mod. It allows you to expand buildings based on the time it would take them to pay for themselves. Since we are using increased and decreased building costs in many places, this is the metric you need to expand your buildings most of the time. Monthly profit is much less helpful.\n\n$BULLET$ #Y 4. Bigger and more urbanized cities.#! In general, you will see much bigger and more urbanized cities from the player and the AI. These will have very specialized industries that are very efficient. So, more specialized cities, but expanding these specialized industries will become increasingly expensive. That is very manageable, and it is also multiplicative with the building cost decreases that exist from societal values, etc.\n\n$BULLET$ #Y 5. Promotions.#! I massively reduced the amount of promotions that happen more or less passively. This is the first step toward a kind of education system that will allow for more specialization. Especially burghers are now much harder to come by, so some promotion modifiers might now be worth it. I also buffed libraries and universities, and I allow libraries to be built in rural locations as well.\n\nOtherwise, I hope you enjoy the changes. As usual, everything has been tested a lot, and I know it works with the AI and produces good historical outcomes.\n\nIf you have questions, join the Discord; the link is on the Steam mod page. If you find bugs, you can report them there.\n\nI hope you enjoy."
game_concept_pp_food_consumption: "P&P: Food Consumption"
game_concept_pp_food_consumption_desc: "There are many ways to reduce peasant food consumption (they are more focused on subsistence), which directly increases how much food they contribute to the market. It might be worth it for population-rich rural countries to use these modifiers to your advantage. They are not very useful for already highly urbanized countries, who should rather build their own food industry or just buy it from the market.\n\nFood consumption varies with many factors. When food is cheap, people consume more—less rationing, choosier diets. When food is expensive, they consume less: more frugal, more focused on survival. Because of this link to well-being, food consumption modifiers are strong and have wide effects.\n\n#T What Impacts Food Consumption:#!\nSeveral factors change how much pops consume:\n\n$BULLET$ Local food price on the market (cheap vs expensive)\n$BULLET$ [pp_province_current_food_storage|e] (growing vs shrinking)\n$BULLET$ [pp_prosperity|e] of the location\n$BULLET$ Winter severity\n$BULLET$ [pp_devastation|e] and recovery conditions\n$BULLET$ Pop type (nobles, clergy, burghers, laborers, peasants, soldiers each have different base consumption)\n\nSee [pp_food_storage|e] for how storage works.\n\n#T Cheap food in the market and High food Storages in Provinces:#!\nWhen food is cheap on the market and province storages are well stocked, locations receive [pp_cheap_food|e] and provinces with growing storage receive [pp_province_current_food_storage|e]. Effects scale by how far below the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('cheap_food_in_location')]\n\n#T Expensive food in the market and Low food Storages in Provinces:#!\nWhen food is expensive on the market and province storages are low or empty, locations receive [pp_expensive_food|e]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. Other priorities fall by the wayside. Effects scale by how far above the base price the food price is.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]\n\nFood consumption modifiers are deliberately strong because consumption is tightly linked to living standards, labor quality, and social stability. [pp_prosperity|e] reinforces the loop: high food availability boosts prosperity, and prosperity in turn supports higher consumption and [population_growth|e].\n\n#T When You Run Out of food:#!\nWhen storages are empty, a province receives [ShowModifier('province_starving')]. People try to feed themselves by any means necessary. [pp_devastation|e] tends to rise, pops demote to lower classes that consume less, and people starve. Supply limit drops, migration attraction plummets, life expectancy falls, and people flee. [pp_prosperity|e] crashes. Soldiers are less willing to defend [starving|e] cities. See [pp_food_storage|e] and [pp_starvation|e].\n\n[ShowModifierEffect('province_starving')]\n\n#T Devastation:#!\n[pp_devastation|e] is best avoided and is caused by starvation or other horrible conditions (blockades, sieges, etc.). For full modifier details and the inversion note (devastation scales 0 to -100%).\n\n[ShowModifierEffect('devastation')]"
game_concept_pp_other_changes: "Other Changes"
game_concept_pp_other_changes_desc: "This section covers Buildings in Location, Available Free Land, Abundant Free Land, Prosperity, Devastation, Cheap Food, Expensive Food, Province Current Food Storage, and Starvation. Use the cards below for details on each topic."
game_concept_pp_victuals: "P&P: New Trade Goods"
game_concept_pp_victuals_desc: "#T Victuals#!\n[ShowGoodsName('victuals')|e] are prepared meals, provisions, and rations for civilians, armies, and navies.\n\nThey are produced by [ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e], then distributed locally as food through [ShowBuildingTypeName('victuals_market')|e]. Exact conversion and method details are shown on the building tooltips. See [pp_cookery|e] for the building overview.\n\n#T Food Revenue#!\n[ShowGoodsName('food_revenue')|e] is just a good that I need for the AI to understand where to build Victuals Markets. It is a change from the last version, where a script did that for the AI, which was worse. Now Victuals Markets will naturally be profitable when the conditions are right because of this new good. You can ignore it other than that."
game_concept_pp_cookery: "P&P: New Buildings"
game_concept_pp_cookery_desc: "#T P&P Buildings#!\nProsper or Perish adds and rewrites many buildings. The exact inputs, outputs, unlocks, and modifiers are shown in the building and production-method tooltips; this page is only orientation.\n\n#T Victuals Buildings:#!\n[ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e] refine regional food goods into [ShowGoodsName('victuals')|e]: meals, provisions, and rations. [ShowBuildingTypeName('victuals_market')|e] distributes those victuals locally as food for the population.\n\n#T Non-Farming Raw Goods:#!\nNon-farming raw-good buildings, such as [ShowBuildingTypeName('iron_mine')|e], usually have a simple base method that mainly uses population and produces the raw good inefficiently. More advanced production methods use more inputs, refined goods, animals, tools, and later unlocks to produce more and employ workers more efficiently.\n\nMany deposits historically produced multiple useful materials. A lead vein could be galena with silver, and iron ore workings could recover ochre for dyes. I used historical byproducts where I could, so raw-good buildings can have multiple outputs when that fits.\n\nSome buildings also have specific beneficial or detrimental location modifiers. A deeper or riskier mine can hurt [population_growth|e] because the work is dangerous, while still increasing migration attraction because it draws fortune seekers and workers chasing wages.\n\n#T Agriculture:#!\nAgricultural buildings work in the same general style. Base methods give a simple local production option, while better methods use more inputs and unlock over time. Many buildings can choose between related crops or animal outputs, and many have upgrade chains.\n\nFor whether a building fits a location, check its own building tooltip. For how many rural buildings fit, see [pp_farm_capacity|e]. For how productive they are, see [pp_farm_output|e]."
game_concept_pp_building_limits: "Building Limits"
game_concept_pp_building_limits_desc: "#T Building Limits#!\nThe old location building cost malus is gone. It is replaced by the logistics system. Every location has a limit for how many building levels are easy to supply, depending on things like vegetation, topography, rivers, coasts, roads, development, and more.\n\nYou can still overbuild. If a location goes over its supported building levels, it gets [ShowModifier('unsupported_building_levels')]. Use the Unsupported Building Levels map mode to find the places that need help.\n\n#T Logistics Buildings#!\nThese buildings increase the supported building levels. Build the one that fits the place:\n\n$BULLET$ [ShowBuildingTypeName('river_boatmen_yard')|e] on rivers. Big rivers are much better.\n$BULLET$ [ShowBuildingTypeName('coastal_shipping_office')|e] in ports. Natural harbors are better.\n$BULLET$ [ShowBuildingTypeName('transport_office')|e] in developed towns and cities.\n$BULLET$ [ShowBuildingTypeName('carrier_inn')|e] in rural settlements and towns with roads.\n\nThat is the idea. Big rivers, ports, and cities are easy to supply. Landlocked jungle is not. If a place is red on the map mode, build logistics there before you keep stacking industry."
game_concept_pp_population_distribution: "Population Distribution"
game_concept_pp_population_distribution_desc: "Your local population mix matters. Population-share effects depend on how much of a location's population belongs to a pop type. Literacy effects depend on literate pops of that type in the location.\n\n#T Population Share Effects:#!\n$BULLET$ Burghers: Local Pop Promotion Speed\n$BULLET$ Laborers: Local Monthly Development\n$BULLET$ Soldiers: Max Control\n$BULLET$ Peasants: Prosperity Recovery, Construction Speed\n$BULLET$ Tribesmen: Local Proximity Efficiency, Monthly Control\n\n#T Literacy Effects:#!\n$BULLET$ Nobles: Cultural Tradition, Monthly Control\n$BULLET$ Clergy: Local Pop Conversion Speed, Pop Assimilation Speed\n$BULLET$ Burghers: Local Monthly Development Growth, Burgher Trade Capacity, Building Establishment Speed\n$BULLET$ Laborers: Production Efficiency, Maximum RGO Size\n$BULLET$ Soldiers: Fort Defense, Monthly Manpower\n$BULLET$ Peasants: Local Pop Promotion Speed, Levy Recruitment Speed, local output for wheat, rice, millet, maize, legumes, fruit, olives, potato, livestock, beeswax, wool, cotton, sugar, tobacco, horses, silk, incense, tea, cocoa, coffee, fiber crops, saffron, pepper, cloves, chili, fish, wild game, fur, and victuals\n$BULLET$ Tribesmen: Tribesmen to Peasants\n$BULLET$ Slaves: Satisfaction of Slaves\n\n#T Unemployed Peasants:#!\nLocations with unemployed peasants receive Local Monthly Development, Institution Growth, Construction Speed, Buildings Construction Efficiency, and Migration Attraction modifiers."
game_concept_pp_food_in_eu5: "Food in EU5"
game_concept_pp_food_in_eu5_desc: "#T Food in Vanilla EU5:#!\nFood in Europa Universalis 5 is tricky to understand because food goods and actual food split into separate systems.\n\nVanilla food has three main sources:\n\n$BULLET$ #Y Food goods#! such as rice, livestock, wheat, and fish. The amount produced is multiplied by that good's food value.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants. This creates food directly and is not tied to a trade good.\n$BULLET$ #Y Flat food sources#! from buildings. These create food directly and are not tied to a food trade good.\n\nThose sources are summed in the location and then multiplied by local food productivity. After that, the trade good and the food are separate. The good enters the goods market through market access. The food enters the province food storage, which is shared by all locations in that province.\n\nLocations can have a food surplus or deficit. They resolve that against province storage first. If storage is high enough, the province can sell food into the food market that the province capital belongs to. If the country buys food, provinces can draw food back from that market.\n\nThe biggest problems are:\n\n$BULLET$ A market can have huge food-good surpluses while the food market is empty and people starve, or the reverse. The split gets stranger as the game progresses.\n$BULLET$ Food productivity multiplies every local food source. A location with excellent farmland can end up multiplying fish, subsistence food, or flat building food in the same way.\n$BULLET$ Food RGOs scale too strongly with food productivity, so stacking food RGOs and productivity becomes dominant.\n$BULLET$ Some goods that could reasonably count as food or drink, such as beer and wine, have no food value.\n\n#T Prosper or Perish:#!\nProsper or Perish keeps the same broad food-storage system, but changes what feeds it.\n\nFood sources in Prosper or Perish are:\n\n$BULLET$ #Y [ShowGoodsName('victuals')|e]#!, the main food good. It represents meals, rations, and preserved provisions.\n$BULLET$ #Y Subsistence agriculture#! from unemployed peasants, as in vanilla.\n$BULLET$ #Y Absolute food sources#! from buildings such as [ShowBuildingTypeName('victuals_market')|e].\n\nHow the P&P system works:\n\n$BULLET$ Food productivity is removed. The goal is to keep [ShowGoodsName('victuals')|e] in the goods market connected to actual food availability.\n$BULLET$ Excess [ShowGoodsName('victuals')|e] can be converted into local food through [ShowBuildingTypeName('victuals_market')|e], or used by buildings such as docks and armories as rations and supplies.\n$BULLET$ [ShowBuildingTypeName('cookery')|e] turns many regional food goods into [ShowGoodsName('victuals')|e], so surplus grain, meat, fish, salt, and similar goods can feed the food chain through the goods market.\n$BULLET$ Instead of one food productivity modifier, locations now have raw-material output modifiers based on historical and geographic data. A location can be good at producing fish without making every other food source there explode.\n\nFor the practical P&P production chain, see [pp_food|e]. For local raw-material productivity, see [pp_farm_output|e]."
game_concept_pp_food: "P&P: Food Production"
game_concept_pp_food_desc: "#T What This Page Covers:#!\nThis page is about producing food in Prosper or Perish. For the vanilla food system and why P&P changes it, see [pp_food_in_eu5|e].\n\n#T Food Sources:#!\nP&P food comes from three places:\n\n$BULLET$ [ShowBuildingTypeName('cookery')|e] and [ShowBuildingTypeName('victualling_yard')|e] refine regional goods into [ShowGoodsName('victuals')|e]. Since [ShowGoodsName('victuals')|e] have food value, producing them also creates food.\n$BULLET$ [ShowBuildingTypeName('victuals_market')|e] converts [ShowGoodsName('victuals')|e] into local food for the province.\n$BULLET$ Unemployed peasants still produce a small amount of subsistence food directly.\n\n#T The Production Chain:#!\nThe intended chain is simple:\n\n$BULLET$ Produce regional food goods such as grain, meat, fish, fruit, salt, and similar goods.\n$BULLET$ Turn those goods into [ShowGoodsName('victuals')|e] through [ShowBuildingTypeName('cookery')|e].\n$BULLET$ Use [ShowBuildingTypeName('victuals_market')|e] where a province needs direct local food.\n\n[ShowGoodsName('victuals')|e] are also useful as an input good for buildings such as docks and armories. The exact inputs, outputs, and conversion rates are shown in building and production-method tooltips.\n\n#T Local Production:#!\nFood productivity is removed. Raw materials instead use specific local output modifiers. A location can be strong at fish, grain, livestock, fruit, or another resource without making every food source in that location stronger.\n\nUse building tooltips, local output map modes, [pp_farm_output|e], and [pp_variable_harvests|e] to understand what a location is good at producing.\n\n#T Practical Rule:#!\nIf a province struggles with food, check whether it has enough raw food inputs, enough [ShowBuildingTypeName('cookery')|e] capacity, enough [ShowGoodsName('victuals')|e], and enough [ShowBuildingTypeName('victuals_market')|e] levels."
game_concept_pp_population_growth: "Population Growth"
game_concept_pp_population_growth_desc: "In general, abundance of food causes [population_growth|e]. Positive [population_growth|e] comes from two main sources: [pp_cheap_food|e] and [pp_province_current_food_storage|e].\n\nNegative [population_growth|e] comes from [pp_starvation|e], [pp_expensive_food|e], or low food storages in provinces.\n\n#T Balancing Modifiers:#!\nSome modifiers—such as negative [population_growth|e] in cities, towns, and rural locations—exist purely to balance out the positive modifiers and create an equilibrium. They have no other meaning.\n\n#T Population Capacity:#!\nWhen a location grows far above [pp_population_capacity|e], [population_growth|e] slowly goes down. Capacity can change through buildings, development, irrigation, advances, and other modifiers, but it is no longer meant to represent housing alone."
game_concept_pp_buildings_in_location: "P&P: Buildings in Location"
game_concept_pp_buildings_in_location_desc: "Locations receive [ShowModifier('building_levels')] based on their total [building|e] levels. Buildings can increase [pp_population_capacity|e], but ordinary construction also pressures shared rural space.\n\nIn [pp_farm_capacity|e] and [pp_forest_capacity|e] maximum-level tooltips, total building levels are shown directly as reduced rural capacity. The exact current reduction is shown in that tooltip row.\n\n[ShowModifierEffect('building_levels')]"
game_concept_pp_available_free_land: "P&P: Available Free Land"
game_concept_pp_available_free_land_desc: "Locations below [pp_population_capacity|e] can receive [ShowModifier('available_free_land')]. When fewer people compete for the same land, they can choose better fields, pastures, fishing spots, and forest work sites instead of being forced onto marginal ground.\n\nThis improves farming and other rural raw-good output while the location has spare food-support potential. The bonus fades as population approaches capacity and is gone at full capacity. It is one of the main systems that makes locations become better or worse at farming as they fill up.\n\n[ShowModifierEffect('available_free_land')]"
game_concept_pp_abundant_free_land: "P&P: Abundant Free Land"
game_concept_pp_abundant_free_land_desc: "Locations far below [pp_population_capacity|e] can receive [ShowModifier('abundant_free_land')], the stronger free-land state. The logic is the same: with a lot of unused capacity, people have more choice and can work the best local farming spots first.\n\nAs population grows, this advantage declines and eventually disappears at full capacity. Exact effects are shown below and in the modifier tooltip.\n\n[ShowModifierEffect('abundant_free_land')]"
game_concept_pp_food_storage: "P&P: Food Storage"
game_concept_pp_food_storage_desc: "Storage mechanics for food determine how sieges and shortages play out. Empty storages lead to emigration, demotion, and death."
game_concept_pp_prosperity: "P&P: Prosperity"
game_concept_pp_prosperity_desc: "Prosperity is great for locations in the long term. In this mod, it is closely tied to food availability: cheap food and well-stocked storages boost prosperity, which in turn supports higher food consumption and [population_growth|e]. See [pp_food_consumption|e] for how food prices affect prosperity.\n\n#T Note:#!\nProsperity scales from 0% to 100%.\n\n[ShowModifierEffect('prosperity')]"
game_concept_pp_devastation: "P&P: Devastation"
game_concept_pp_devastation_desc: "Devastation has horrible consequences for locations. See [pp_food_consumption|e] for full context.\n\n#T Note:#!\nDevastation scales from 0 to -100%, so the values shown below are actually inverted at -100% devastation.\n\n[ShowModifierEffect('devastation')]"
game_concept_pp_province_current_food_storage: "P&P: Province Current Food Storage"
game_concept_pp_province_current_food_storage_desc: "A province with growing food storage receives [ShowModifier('positive_province_food_growth')]. This modifier scales with stored province food. See [pp_food_consumption|e] for context.\n\n[ShowModifierEffect('positive_province_food_growth')]"
game_concept_pp_positive_province_food_growth: "P&P: Province Food Growth from Storage"
game_concept_pp_positive_province_food_growth_desc: "Provinces with growing food storage receive [ShowModifier('positive_province_food_growth')]. This modifier scales with stored province food. See [pp_food_consumption|e] for context.\n\n[ShowModifierEffect('positive_province_food_growth')]"
game_concept_pp_cheap_food: "P&P: Cheap Food in Location"
game_concept_pp_cheap_food_desc: "When food is cheap on the market and province storages are well stocked, locations receive [ShowModifier('cheap_food_in_location')]. People consume more—less rationing, choosier diets. These effects scale depending on how far below the base price the food price is: the cheaper it gets, the stronger the modifier. See [pp_food_consumption|e] for full context.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('cheap_food_in_location')]"
game_concept_pp_expensive_food: "P&P: Expensive Food in Location"
game_concept_pp_expensive_food_desc: "When food is expensive on the market and province storages are low or empty, locations receive [ShowModifier('expensive_food_in_location')]. People consume less—they get more out of their food, are less picky, and minds focus on feeding families. These effects scale depending on how far above the base price the food price is: the more expensive it gets, the stronger the modifier. See [pp_food_consumption|e] for full context.\n\n#T Display Note:#!\nBecause of Paradox scaling, the maximum value you can actually get is only half of the value shown below.\n\n[ShowModifierEffect('expensive_food_in_location')]"
game_concept_pp_starvation: "P&P: Starvation"
game_concept_pp_starvation_desc: "When a province's food storage reaches 0, the pops will starve and die.\n\nThis gives the following effect:\n[ShowModifierEffect('province_starving')]"
game_concept_pp_farm_capacity: "P&P: Farming/Fishing/Forest Capacities"
	game_concept_pp_farm_capacity_desc: "Farming, Fishing, and Forest Capacities are about how many rural raw-material building levels a location can sustain, not how much each building produces. For productivity, see [pp_farm_output|e]. Exact current values are shown in the relevant building and map-mode tooltips.\n\nThe Farming Capacity, Fishing Capacity, and Forest Capacity map modes are in the Geography map-mode group.\n\n#T Farming Capacity:#!\nThis pool governs [ShowBuildingTypeName('farming_village')|e], [ShowBuildingTypeName('model_farm')|e], orchards, animal farms, plantations, groves, gardens, sericulture farms, simplers groves, and vineyard estates.\n\nFarming Capacity is one current sum. Local farming suitability, matching agricultural RGOs, Maximum RGO Size, [pp_population_capacity|e], location rank, river size, Manorial Customals, irrigation and water-control buildings, existing farming-capacity buildings, and building levels in the location can all add or subtract from it.\n\n#T Fishing Capacity:#!\nThis pool governs [ShowBuildingTypeName('fishing_village')|e], [ShowBuildingTypeName('net_curing_yard')|e], [ShowBuildingTypeName('ocean_fishery')|e], [ShowBuildingTypeName('drift_net_fishery')|e], and [ShowBuildingTypeName('offshore_fishery')|e]. It does not govern [ShowBuildingTypeName('pearl_fishery')|e].\n\nFishing Capacity is one current sum. Coasts, lakes, wetlands, fish RGOs, Maximum RGO Size, river size, Manorial Customals, and existing fish-producing buildings can all add or subtract from it.\n\n#T Forest Capacity:#!\nThis pool governs [ShowBuildingTypeName('forest_village')|e], [ShowBuildingTypeName('managed_forest_village')|e], [ShowBuildingTypeName('lumber_mill')|e], [ShowBuildingTypeName('water_sawmill')|e], and [ShowBuildingTypeName('lumber_mill_improved')|e].\n\nForest Capacity is one current sum. Forest geography, relevant RGOs, Maximum RGO Size, location rank, Manorial Customals, existing forest and lumber buildings, and building levels in the location can all add or subtract from it.\n\nThe building maximum-level tooltip and the matching capacity map mode show the same current value. The maximum-level tooltip lists the active sources that add or subtract capacity.\n\n#T Other Raw Material Buildings:#!\nOther raw material producing buildings, such as mines, quarries, saltworks, pearl fisheries, charcoal makers, ivory hunting camps, and similar buildings, do not use the three shared pools above. Their maximum level is governed by Rural Building Capacity.\n\nRural Building Capacity is a simpler cap influenced by the location's basic rural allowance, development, Maximum RGO Size, and river access.\n\n#T Building order:#!\nIf a building type ends up well above its available capacity, the system can trim excess rural building levels over time. There is no lasting benefit to building around the limit."
game_concept_pp_fish_capacity: "P&P: Fishing Capacity"
game_concept_pp_fish_capacity_desc: "Fishing Capacity is the shared limit for fish-producing buildings: [ShowBuildingTypeName('fishing_village')|e], [ShowBuildingTypeName('net_curing_yard')|e], [ShowBuildingTypeName('ocean_fishery')|e], [ShowBuildingTypeName('drift_net_fishery')|e], and [ShowBuildingTypeName('offshore_fishery')|e]. It does not govern [ShowBuildingTypeName('pearl_fishery')|e].\n\nFishing Capacity is one current sum. Natural fishing grounds, Maximum RGO Size, river size, Manorial Customals, and existing fish-producing buildings can all add or subtract from it. Exact values are shown in the relevant building and map-mode tooltips. For the full capacity overview, see [pp_farm_capacity|e]."
game_concept_pp_forest_capacity: "P&P: Forest Capacity"
game_concept_pp_forest_capacity_desc: "Forest Capacity is the shared limit for forest and lumber buildings: [ShowBuildingTypeName('forest_village')|e], [ShowBuildingTypeName('managed_forest_village')|e], [ShowBuildingTypeName('lumber_mill')|e], [ShowBuildingTypeName('water_sawmill')|e], and [ShowBuildingTypeName('lumber_mill_improved')|e]. It does not govern charcoal makers, ivory hunting camps, mines, quarries, or processing buildings.\n\nForest Capacity is one current sum. Forest geography, relevant RGOs, Maximum RGO Size, location rank, Manorial Customals, existing forest and lumber buildings, and building levels in the location can all add or subtract from it. Exact values are shown in the relevant building and map-mode tooltips. For the full capacity overview, see [pp_farm_capacity|e]."
game_concept_pp_farm_output: "P&P: Building Output"
game_concept_pp_farm_output_desc: "This entry is about how much rural raw-material buildings produce—their productivity—not how many you can build. For quantity, see [pp_farm_capacity|e].\n\nOver Europa Universalis 5's timeframe, rural productivity rose sharply. The mod reflects this by replacing vanilla's flat food modifier with per-good output modifiers. Each raw material can now gain or lose output independently.\n\nBuilding Output is affected by both inert and dynamic factors. Any of these can be beneficial or detrimental.\n\n#T Component one:#!\nDynamic factors that change over the game. Some regions or countries may gain access to productivity improvements earlier or later than others:\n\n$BULLET$ Advances\n$BULLET$ Societal choices\n$BULLET$ Development\n$BULLET$ Government reforms\n$BULLET$ [ShowBuildingTypeName('irrigation_systems')|e]\n\n#T Component two:#!\nInert factors tied to geography and location. Every location has a unique set of local output modifiers estimated from historical and geographic evidence:\n\n$BULLET$ Rainfall and water availability\n$BULLET$ Soil quality\n$BULLET$ Climate\n$BULLET$ Topography\n$BULLET$ Vegetation\n$BULLET$ The location's RGO\n\n#T Harvest:#!\nYearly harvest outcomes vary by region and can further boost or reduce agricultural output beyond the factors above. For full details on harvest levels and how they affect food production, see [pp_variable_harvests|e]."
game_concept_pp_population_capacity: "P&P: Population Capacity"
game_concept_pp_population_capacity_desc: "#T Population Capacity#!\nPopulation Capacity now roughly represents how many people a location can support through local food production, especially farming. It is no longer just housing.\n\nLocations below their capacity have spare food-support potential. This gives them farming output benefits because people can work better land first. The benefit fades as population approaches capacity.\n\n#T Static baseline:#!\nEvery location starts with its own baseline. This uses the same kind of evidence as [pp_farm_output|e]: historical population data, crop suitability, rainfall, water access, soil, climate, topography, vegetation, local RGOs, and other map data.\n\n#T What changes it:#!\nPopulation Capacity can change through development, buildings, advances, societal values, laws, location rank, and other modifiers.\n\n#T Where to inspect it:#!\nUse the Population Capacity map mode and location tooltips to inspect current values. See [pp_farm_capacity|e] for how Population Capacity feeds farming capacity, and [pp_location_potential|e] for the shared static model behind capacity and local output."
