l_english:
  MODIFIER_TYPE_NAME_local_pp_farm_levels: "Farm Levels"
  MODIFIER_TYPE_DESC_local_pp_farm_levels: "The farm and orchard levels standing in this location. Cookshops in the province grow with the farms around them, and new farms prefer places that hold fewer of them."
  MODIFIER_TYPE_NAME_local_pp_staple_levels: "Staple Food Levels"
  MODIFIER_TYPE_DESC_local_pp_staple_levels: "The fishery, flock, hunting and grove levels standing in this location. Like farm levels, they let the province's Cookshops grow."
  PP_BUILDING_LEVEL_PROVINCE_FARMS: "Staple food makers in the province"
