l_english:
  pp_granary_maintenance: "Granaries"
  victuals: "Victuals"
  victuals_desc: "Preserved rations and travel food packed from full province stores in the [ShowBuildingTypeName('victualling_yard')|e]. Victuals keep and travel, so they are traded through the goods market, supply armies, fleets and workshops, and are turned back into food by the [ShowBuildingTypeName('tavern')|e]."
  province_food_sales: "Surplus Sales"
  province_food_sales_desc: "Internal value: what the Grange earns from the surplus of a well-stocked province. It pays nothing once the province store runs low and can otherwise be ignored."
  province_food_purchase: "Scarcity Premium"
  province_food_purchase_desc: "Internal value of earlier versions. Nothing uses it any more."
  local_food: "Province Food"
  local_food_desc: "Meals eaten where they are made. Province Food feeds the province that produces it and never leaves it. Farms, fisheries and orchards choose whether to provision their province or sell their surplus; Cookshops and Public Kitchens always serve it."
  manual_labor: "Manual Labor"
  manual_labor_desc: "Workers hired for local production. Its price is the wage and effort of employing them; high transport cost keeps it tied to the location where the labor is used."
  offset: "Offset"
  offset_desc: "An internal balancing value used to adjust production-method economics. It has no material or market meaning."
  logistics: "Logistics"
  logistics_desc: "The carrying trade: boatmen, carters, caravan drivers and porters who move a place's goods to its market. Logistics buildings earn a steady wage from it, but their real work is the market access they bring. It is not traded and can otherwise be ignored."
  game_concept_pp_province_food_sales: "Surplus Sales"
  game_concept_pp_province_food_sales_desc: "Surplus Sales is an internal value that pays the Grange more the fuller its province store is, and nothing once the store runs low. It lets the Grange react to province food without any script."
  game_concept_pp_province_food_purchase: "Scarcity Premium"
  game_concept_pp_province_food_purchase_desc: "Scarcity Premium was an internal value of earlier versions. Nothing uses it any more: the Tavern now earns by what food is worth in its province, more while the store is low."
  game_concept_pp_offset: "Offset"
  game_concept_pp_offset_desc: "Offset is an internal balancing value used to adjust production-method economics. It has no material or market meaning and can otherwise be ignored."
  game_concept_pp_logistics: "Logistics"
  game_concept_pp_logistics_desc: "Logistics is what the logistics buildings produce: River Boatmen's Yards, Coastal Shipping Offices, Transport Offices, Carrier Inns and their regional kin such as caravanserais, oasis stations, yam stations, banjara camps and llama posts. It pays their workers a steady wage; what they really give a place is better [market_access|e], at the cost of a little output from heavy goods such as stone, ores and salt that they now haul away. They can only be built where market access is still poor and enough buildings already stand to need them."
