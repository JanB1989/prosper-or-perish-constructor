l_english:
  pp_granary_maintenance: "Granaries"
  victuals: "Victuals"
  victuals_desc: "Preserved rations and travel food packed from full province stores in the [ShowBuildingTypeName('victualling_yard')|e]. Victuals keep and travel, so they are traded through the goods market, supply armies, fleets and workshops, and are turned back into food by the [ShowBuildingTypeName('tavern')|e]."
  province_food_sales: "Surplus Sales"
  province_food_sales_desc: "Internal value: what food producers and the Victualling Yard earn from a well-stocked province. It pays nothing while the province store is empty and can otherwise be ignored."
  province_food_purchase: "Scarcity Premium"
  province_food_purchase_desc: "Internal value: what a province pays for food while its store is empty. It can otherwise be ignored."
  local_food: "Province Food"
  local_food_desc: "Meals eaten where they are made. Province Food feeds the province that produces it and never leaves it. Farms, fisheries and orchards choose whether to provision their province or sell their surplus; Cookshops and Public Kitchens always serve it."
  manual_labor: "Manual Labor"
  manual_labor_desc: "Workers hired for local production. Its price is the wage and effort of employing them; high transport cost keeps it tied to the location where the labor is used."
  offset: "Offset"
  offset_desc: "An internal balancing value used to adjust production-method economics. It has no material or market meaning."
  game_concept_pp_province_food_sales: "Surplus Sales"
  game_concept_pp_province_food_sales_desc: "Surplus Sales is an internal value that pays food producers and the Victualling Yard more the fuller their province store is, and nothing while it is empty. It lets buildings react to province food without any script."
  game_concept_pp_province_food_purchase: "Scarcity Premium"
  game_concept_pp_province_food_purchase_desc: "Scarcity Premium is an internal value that pays for food while a province store is empty and fades as it fills. It lets the Tavern react to province food without any script."
  game_concept_pp_offset: "Offset"
  game_concept_pp_offset_desc: "Offset is an internal balancing value used to adjust production-method economics. It has no material or market meaning and can otherwise be ignored."
