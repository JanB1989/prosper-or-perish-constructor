l_english:
  pp_granary_maintenance: "[ShowBuildingTypeName('granary')|e] Maintenance"
  victuals: "Victuals"
  victuals_desc: "Preserved rations and travel food: the [ShowBuildingTypeName('grange')|e] packs them from a full province store, the [ShowBuildingTypeName('victualling_yard')|e] from staple foods bought on the market. Victuals keep and travel, so they are traded through the goods market. The buildings of armies and fleets, carriers and work crews use them, and the [ShowBuildingTypeName('tavern')|e] turns them back into food."
  province_food_sales: "Surplus Sales"
  province_food_sales_desc: "Internal value: what the [ShowBuildingTypeName('grange')|e] earns from the surplus of a well-stocked province. It pays nothing once the province store runs low and can otherwise be ignored."
  local_food: "Province Food"
  local_food_desc: "Meals eaten where they are made. Province Food feeds the province that produces it and never leaves it. Farms, fisheries and orchards choose whether to provision their province or sell their surplus; the [ShowBuildingTypeName('cookshop')|e] and the [ShowBuildingTypeName('public_kitchen')|e] always serve it."
  manual_labor: "Manual Labor"
  manual_labor_desc: "Workers hired for local production. Its price is the wage and effort of employing them; high transport cost keeps it tied to the location where the labor is used."
  offset: "Offset"
  offset_desc: "An internal balancing value used to adjust production-method economics. It has no material or market meaning."
  logistics: "Logistics"
  logistics_desc: "The carrying trade: boatmen, carters, caravan drivers and porters who move a place's goods to its market. Logistics buildings earn a steady wage from it, but their real work is the market access they bring. It is not traded and can otherwise be ignored."
  game_concept_pp_province_food_sales: "Surplus Sales"
  game_concept_pp_province_food_sales_desc: "Surplus Sales is an internal value that pays the [ShowBuildingTypeName('grange')|e] more the fuller its province store is, and nothing once the store runs low. It lets the building react to province food without any script."
  game_concept_pp_offset: "Offset"
  game_concept_pp_offset_desc: "Offset is an internal balancing value used to adjust production-method economics. It has no material or market meaning and can otherwise be ignored."
  game_concept_pp_logistics: "Logistics"
  game_concept_pp_logistics_desc: "Logistics is what the logistics buildings produce: the [ShowBuildingTypeName('river_boatmen_yard')|e], the [ShowBuildingTypeName('coastal_shipping_office')|e], the [ShowBuildingTypeName('transport_office')|e], the [ShowBuildingTypeName('carrier_inn')|e] and its regional kin such as the [ShowBuildingTypeName('pp_caravanserai')|e], the [ShowBuildingTypeName('pp_oasis_caravan_station')|e], the [ShowBuildingTypeName('pp_yam_station')|e], the [ShowBuildingTypeName('pp_banjara_tanda')|e] and the [ShowBuildingTypeName('pp_llama_caravan_post')|e]. It pays their workers a steady wage; what they really give a place is better [market_access|e], at the cost of a little output from heavy goods such as stone, ores and salt that they now haul away. They can only be built where market access is still poor and enough buildings already stand to need them."
