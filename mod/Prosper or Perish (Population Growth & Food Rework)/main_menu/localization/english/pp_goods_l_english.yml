l_english:
  pp_granary_maintenance: "Granaries"
  victuals: "Victuals"
  victuals_desc: "The lifeblood of any campaign or settlement. Crafted from basic food resources in the [ShowBuildingTypeName('cookery')|e], victuals encompass everything from fresh regional dishes to carefully preserved, travel-ready rations. They are essential for sustaining professional armies and navies on long voyages, and are actively traded and distributed to the populace through the [ShowBuildingTypeName('victuals_market')|e]."
  province_food_sales: "Province Food Sales"
  province_food_sales_desc: "Internal value representing province food sold into the goods market."
  province_food_purchase: "Province Food Purchase"
  province_food_purchase_desc: "Internal value representing food purchased from the goods market into a province."
  local_food: "Local Food"
  local_food_desc: "Food prepared and distributed for consumption close to where it was produced. Its high transport cost keeps it tied to local supply."
  manual_labor_cost: "Manual Labor Cost"
  manual_labor_cost_desc: "The wage and effort cost of employing workers in local production. High transport cost keeps it tied to the location where labor is used."
  offset: "Offset"
  offset_desc: "An internal balancing value used to adjust production-method economics. It has no material or market meaning."
  game_concept_pp_province_food_sales: "Province Food Sales"
  game_concept_pp_province_food_sales_desc: "Province Food Sales represents province food sold into the goods market. It is an internal trade good used by Prosper or Perish's food economy."
  game_concept_pp_province_food_purchase: "Province Food Purchase"
  game_concept_pp_province_food_purchase_desc: "Province Food Purchase represents food bought from the goods market into a province. It is an internal trade good used by Prosper or Perish's food economy."
  game_concept_pp_offset: "Offset"
  game_concept_pp_offset_desc: "Offset is an internal balancing value used to adjust production-method economics. It has no material or market meaning and can otherwise be ignored."
