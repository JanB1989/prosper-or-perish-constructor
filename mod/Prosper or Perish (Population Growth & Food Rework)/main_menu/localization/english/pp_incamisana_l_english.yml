# >>> eu5-building-pipeline:incamisana:localization
  incamisana_desc: "The $incamisana$ is a temple in honor of water and its divine patrons. Its channels and fountains irrigate the terraces below, so Andean lands sustain more people per channel than ordinary irrigation. Incamisanas and irrigation systems share the same water, so their levels count against one cap."
# <<< eu5-building-pipeline:incamisana:localization
