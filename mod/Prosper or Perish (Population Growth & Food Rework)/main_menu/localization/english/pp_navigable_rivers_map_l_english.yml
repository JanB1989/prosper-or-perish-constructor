l_english:
 mapmode_pp_navigable_rivers_name: "Navigable Rivers"
 MAPMODE_PP_NAVIGABLE_RIVERS: "#T $mapmode_pp_navigable_rivers_name$#!\nShows the rivers [navies|e] can sail, where shallows and falls stop them, which waterways reach the open sea and which banks have a [port|e]."
 PP_NAVMAP_CANAL_OPEN_TT: "Canal Passage\nShallows kept open by a River Navigation Canal on a bank: the easiest waterway of all. It reaches the open sea."
 PP_NAVMAP_CANAL_INLAND_TT: "Canal Passage\nShallows kept open by a River Navigation Canal on a bank: the easiest waterway of all. It does not reach the open sea: fleets on it cannot sail out."
 PP_NAVMAP_PARTIAL_OPEN_TT: "Partly Opened Shallows\nA River Navigation Canal keeps some of these shallows open; the rest still slow boats down. It reaches the open sea."
 PP_NAVMAP_PARTIAL_INLAND_TT: "Partly Opened Shallows\nA River Navigation Canal keeps some of these shallows open; the rest still slow boats down. It does not reach the open sea: fleets on it cannot sail out."
 PP_NAVMAP_NAVIGABLE_OPEN_TT: "Navigable River\nFleets sail it, and goods travel along it far more cheaply than over land. It reaches the open sea."
 PP_NAVMAP_NAVIGABLE_INLAND_TT: "Navigable River\nFleets sail it, and goods travel along it far more cheaply than over land. It does not reach the open sea: fleets on it cannot sail out."
 PP_NAVMAP_DIFFICULT_OPEN_TT: "Difficult Waterway\nA great tropical or strongly seasonal river: boats get through, but slowly and at a cost. It reaches the open sea."
 PP_NAVMAP_DIFFICULT_INLAND_TT: "Difficult Waterway\nA great tropical or strongly seasonal river: boats get through, but slowly and at a cost. It does not reach the open sea: fleets on it cannot sail out."
 PP_NAVMAP_SHALLOWS_OPEN_TT: "Shallows\nBoats pass slowly and at a cost until a River Navigation Canal is built on a bank. It reaches the open sea."
 PP_NAVMAP_SHALLOWS_INLAND_TT: "Shallows\nBoats pass slowly and at a cost until a River Navigation Canal is built on a bank. It does not reach the open sea: fleets on it cannot sail out."
 PP_NAVMAP_FALLS_TT: "Falls\nFalls or great rapids that no boat passes and no canal opens."
 PP_NAVMAP_PORT_TT: "River Port\nA bank of a navigable river with a port: fleets can land here. It counts as coastal and keeps its river bonuses."
 PP_NAVMAP_BANK_TT: "Riverbank\nA bank of a navigable river without a port. It counts as coastal and keeps its river bonuses."
 PP_NAVMAP_RIVER_TT: "River\nBoats cannot sail this river. It brings its river bonuses only."
 PP_NAVMAP_WATER_TT: "Sea or Lake"
 PP_NAVMAP_NONE_TT: "No river here."
 PP_NAVMAP_LEGEND_NAVIGABLE: "Navigable River"
 PP_NAVMAP_LEGEND_DIFFICULT: "Difficult Waterway"
 PP_NAVMAP_LEGEND_SHALLOWS: "Shallows"
 PP_NAVMAP_LEGEND_CANAL: "Canal Passage"
 PP_NAVMAP_LEGEND_PARTIAL: "Partly opened shallows (striped)"
 PP_NAVMAP_LEGEND_FALLS: "Falls"
 PP_NAVMAP_LEGEND_CUT_OFF: "Does not reach the open sea (striped)"
 PP_NAVMAP_LEGEND_PORT: "River Port"
 PP_NAVMAP_LEGEND_BANK: "Riverbank"
 PP_NAVMAP_LEGEND_RIVER: "River no boat can sail"
