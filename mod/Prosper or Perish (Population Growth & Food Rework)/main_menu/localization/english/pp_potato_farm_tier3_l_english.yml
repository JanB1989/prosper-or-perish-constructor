  pp_potato_model_farm_no_cultivation: "No Cultivation"
  pp_potato_model_farm_drilled_ridges: "Drilled Potato Ridges"
  pp_potato_model_farm_drilled_ridges_desc: "Ridges are drilled in straight lines and worked with horse-hoes."
  pp_potato_model_farm_provision: "Provision with Potatoes"
  pp_potato_model_farm_provision_desc: "The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it."
