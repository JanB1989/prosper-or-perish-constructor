  potato_model_farm: "Potato Model Farm"
  potato_model_farm_desc: "Drilled ridges, planned clamps and field accounts raise potatoes on a larger managed farm. When the province's [Concept('provincial_food', 'food store')|e] is high, it produces more goods for the market; when the store is low, it produces more [ShowGoodsName('local_food')|e] and fewer goods for the market."
