l_english:
 pp_mod_welcome_situation: "Welcome to Prosper or Perish"
 pp_mod_welcome_situation_desc: "Prosper or Perish changes how your people are fed, how they grow and how your economy works. Open this to find where it is all explained."
 PP_WELCOME_SIT_LEAD: "Whether a land prospers or perishes is decided in its fields, its stores and its markets."
 PP_WELCOME_SIT_BODY: "Prosper or Perish reworks food, population growth, buildings, labor and trade. Your people grow only where there is food to spare, and much of what you build exists to feed them or to bring goods to market.\n\nThe Europedia has a Prosper or Perish section that explains every part of the mod, with the values of your own game behind its links."
 PP_WELCOME_SIT_CTA: "Open the Prosper or Perish Europedia"
 PP_WELCOME_SIT_CTA_TT: "#T Prosper or Perish Europedia#!\nOpens the Europedia on the Prosper or Perish section. You can open it again at any time with the Europedia button in the top right of your screen."
 pp_harvest_map_state_tt: "[ROOT.GetLocation.Custom('pp_harvest_state')]"
 pp_harvest_province_is_starving_tt: "Province is starving."
 pp_harvest_affected_by_extended_winters_tt: "Affected by extended winters."
 PP_HARVEST_LEGEND_KEY_ABYSMAL: "Failed Harvest"
 PP_HARVEST_LEGEND_KEY_VERY_POOR: "Bad Harvest"
 PP_HARVEST_LEGEND_KEY_POOR: "Weak Harvest"
 PP_HARVEST_LEGEND_KEY_GOOD: "Strong Harvest"
 PP_HARVEST_LEGEND_KEY_VERY_GOOD: "Excellent Harvest"
 PP_HARVEST_LEGEND_KEY_BOUNTIFUL: "Exceptional Harvest"
 PP_HARVEST_LEGEND_KEY_AVERAGE: "Average Harvest"
 PP_HARVEST_LEGEND_KEY_STARVING: "Starving"
 # The Variable Harvests situation panel (in_game/gui/panels/situation/harvest_situation.gui). A GUI panel of its own
 # with text_multi widgets like the Europedia cards, so its texts carry hover links; no numbers.
 PP_HARVEST_SIT_THIS_YEAR: "This Year in Your Realm"
 PP_HARVEST_SIT_CAPITAL: "#T Your capital#!\n[GetPlayer.GetCapital.GetName]: [GetPlayer.GetCapital.Custom('pp_harvest_link')]\nHover the harvest for everything it changes until next September."
 PP_HARVEST_SIT_STARVING: "[Concept('pp_starvation', 'Starving provinces')|e]:"
 PP_HARVEST_SIT_LEAN: "#T Lean harvests in your provinces#!"
 PP_HARVEST_SIT_FAT: "#T Good harvests in your provinces#!"
 PP_HARVEST_SIT_PROVINCE_NOTE: "Provinces with an average year are not listed. Hover a harvest for its effects."
 PP_HARVEST_SIT_SEPTEMBER: "Each September"
 PP_HARVEST_SIT_SEPTEMBER_DESC: "$BULLET$ #T The season:#! each broad harvest area, such as Western Europe or South Asia, draws a kind, an ordinary or a harsh season.\n$BULLET$ #T The harvest:#! every [region|e] of the area then draws its own harvest. The season tilts the odds, and so does the region's last harvest: neighbours tend to share their luck, and lean or fat years can come in runs.\n$BULLET$ #T The modifier:#! the harvest lands on every [location|e] of the region as a [location_modifier|e] named after its area and holds until the next September. An average year adds none."
 PP_HARVEST_SIT_SCALE: "Lean Years and Fat Years"
 PP_HARVEST_SIT_SCALE_ABYSMAL: "[Concept('abysmal_harvest', 'Failed')|e]"
 PP_HARVEST_SIT_SCALE_VERY_POOR: "[Concept('very_poor_harvest', 'Bad')|e]"
 PP_HARVEST_SIT_SCALE_POOR: "[Concept('poor_harvest', 'Weak')|e]"
 PP_HARVEST_SIT_SCALE_AVERAGE: "[Concept('average_harvest', 'Average')|e]"
 PP_HARVEST_SIT_SCALE_GOOD: "[Concept('good_harvest', 'Strong')|e]"
 PP_HARVEST_SIT_SCALE_VERY_GOOD: "[Concept('very_good_harvest', 'Excellent')|e]"
 PP_HARVEST_SIT_SCALE_BOUNTIFUL: "[Concept('bountiful_harvest', 'Exceptional')|e]"
 PP_HARVEST_SIT_SCALE_DESC: "Hover a harvest for its modifier in every broad harvest area. Average is the most common year and the ends of the scale are the rarest. On the map every harvest has its own colour, named in the map legend."
 PP_HARVEST_SIT_CHANGES: "What a Harvest Changes"
 PP_HARVEST_SIT_CHANGES_DESC: "$BULLET$ #T The fields:#! farmed goods yield more in a good year and less in a bad one. Grain and rice swing the most: [ShowGoodsName('wheat')|e], [ShowGoodsName('millet')|e], [ShowGoodsName('maize')|e] and [ShowGoodsName('rice')|e]. Herds, flocks, fish and game are spared.\n$BULLET$ #T The villages:#! the [ShowPopTypeName('peasants')] live off their own plots first, so a bad year leaves the province less of their surplus and a good year more.\nA bad harvest therefore strikes twice: smaller crops and less to spare from the villages."
 PP_HARVEST_SIT_WHERE: "Where to See It"
 PP_HARVEST_SIT_WHERE_DESC: "$BULLET$ #T The map:#! the situation colours every location by this year's harvest; hover a location to read it. Starving provinces show the starving colour instead.\n$BULLET$ #T The location view:#! the harvest chip at the top right shows the location's harvest; hover it for every effect.\n$BULLET$ #T The Europedia:#! [pp_variable_harvests|e] explains the harvests in full.\n$BULLET$ #T The game rule:#! Variable Harvests can be switched off when a campaign starts."
