l_english:
 pp_mod_welcome_situation: "Welcome to Prosper or Perish"
 pp_mod_welcome_situation_desc: "#T Update 0.9 Prosper or Perish#!\nThis update changes a lot, so please read at least the Overview and Update 0.9 pages in the Europedia.\n\nThe short version: logistics and building limits replaced the old location building cost malus, Victuals Markets and the Province Food Sales/Purchase split were reworked, passive promotions were reduced, cities can become bigger and more specialized, and there are many bug fixes, UI clarity improvements, performance improvements, new buildings, new production methods, and new advances.\n\n#T Game Start Settings#!\nHigher Player Building Maintenance in the game rules supports historical AI growth, but it makes the campaign harder. I recommend this if you are experienced or want to play larger nations.\n\nIf you want ahistorical AI growth and a harder challenge, you can use the P&P harder AI settings in the game rules.\n\nYou can also turn off Variable Harvests if you prefer.\n\n#T Compatibility#!\nWant to play an old savegame? Read the FAQ in the Europedia for how to install an older mod version.\n\nOtherwise, start a new game if you notice an update.\n\nIf you want to use other mods, use them at your own risk. I recommend loading P&P last ALWAYS and running your mod list in Observer mode for about half an hour to see if everything looks normal.\n\nP&P is compatible with Faster Universalis.\n\n#T Documentation#!\nI've documented Prosper or Perish extensively in the Europedia; the button to open it is in the top right of your screen."
 pp_harvest_map_state_tt: "[ROOT.GetLocation.Custom('pp_harvest_state')]"
 pp_harvest_province_is_starving_tt: "Province is starving."
 pp_harvest_affected_by_extended_winters_tt: "Affected by extended winters."
