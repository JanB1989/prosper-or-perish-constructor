l_english:
  pp_one_specialization_tt: "The town holds no other production specialization"
  pp_cloth_charter: "Cloth Charter"
  pp_cloth_charter_desc: "This [location|e] has been granted a charter over the making of [ShowGoodsName('cloth')]. Its workshops turn out more, at some cost to its other trades. Full rights may follow once the realm has embraced the printing press."
  pp_cloth_rights: "Cloth Rights"
  pp_cloth_rights_desc: "This [location|e] holds full privileges over the making of [ShowGoodsName('cloth')]. It builds its trade around them and leaves its other industries behind."
