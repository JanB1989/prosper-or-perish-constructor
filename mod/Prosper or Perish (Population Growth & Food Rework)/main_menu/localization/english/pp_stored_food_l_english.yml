  STATIC_MODIFIER_NAME_pp_food_store_0: "Stored Food: almost empty"
  STATIC_MODIFIER_DESC_pp_food_store_0: "The food this province holds in storage, counted in months of its own consumption. Full stores let its people grow faster, and they help the province recover from devastation, draw settlers and prosper. While the store is low, food is worth more here: the farms keep more of their harvest to feed the province, the taverns serve more and the granges find little to pack. While it is full, food is worth less: the farms send more of their crops and herds to market and the surplus is left to the granges. The effects follow the store month by month, up to a cap."
