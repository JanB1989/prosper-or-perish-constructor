  STATIC_MODIFIER_NAME_pp_stored_food: "Stored Food"
  STATIC_MODIFIER_DESC_pp_stored_food: "The food this province holds in storage, counted in its own consumption. Full stores let its people grow faster, and they help the province recover from devastation, draw settlers and prosper. The effects grow with the store up to a cap and follow it from month to month."
  STATIC_MODIFIER_NAME_pp_low_stores: "Low Stores"
  STATIC_MODIFIER_DESC_pp_low_stores: "The province holds less food than a year of its own needs. Food is worth more here, so farms, cookshops and taverns cook and serve more of it, and the grange finds little surplus to sell. The effects grow as the store empties."
  STATIC_MODIFIER_NAME_pp_full_stores: "Full Stores"
  STATIC_MODIFIER_DESC_pp_full_stores: "The province holds more food than a year of its own needs. Food is worth less here, so cooking and serving slow down; the land sends more of its staples to market and the grange sells the surplus. The effects grow as the store fills, up to a cap."
