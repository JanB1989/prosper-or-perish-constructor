l_english:

# >>> eu5-building-pipeline:tavern:localization
  tavern: "Tavern"
  tavern_desc: "Brings the trade good [ShowGoodsName('victuals')|e] into the province and turns them into [ShowGoodsName('local_food')|e]; every [province_capital|e] can build one. It works best where the province cannot grow enough food itself and victuals are cheap. It serves for as long as that pays, so the cheaper victuals are in its market, the fuller it keeps the province's store and the faster the province grows. With a [subsidy|e] it keeps serving where victuals no longer pay, up to the fastest growth the store has room for."
  tavern_slot_0: "Serving"
  tavern_slot_1: "Common Table"
  pp_tavern_serve_victuals: "Serve Victuals"
  pp_tavern_common_table: "Common Table"
  pp_tavern_price: "[ShowBuildingTypeName('tavern')|e] Price"
# <<< eu5-building-pipeline:tavern:localization
