 advanced_mining_desc: "Better mine surveys and quarry practice open saltpeter beds and alum shales to organized working."
 bog_iron_smelter_desc: "A small wetland ironworks that gathers, roasts, and smelts bog iron where conventional ore deposits are absent."
 bole_smelting_desc: "Wind-fed upland hearths and better galena preparation improve lead smelting at organized lead mines."
