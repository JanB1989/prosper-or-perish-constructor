 improved_charcoal_maker: "Charcoal Retort"
 improved_charcoal_maker_desc: "Sealed kilns and retorts control the charring of coppice wood more closely, using clay linings and sealed burn chambers to raise charcoal yields without competing with true coal seams."
 incamisana_desc: "The [ShowBuildingTypeName('incamisana')|e] is a temple in honor of water and its divine patrons. Its channels and fountains irrigate the terraces below, so Andean lands sustain more people per channel than ordinary [ShowBuildingTypeName('irrigation_systems')|e]. It shares its water with [ShowBuildingTypeName('irrigation_systems')|e], so their levels count against one cap."
 jewelry_guild_slot_0: "[ShowBuildingTypeName('jewelry_guild')|e] Work"
 jewelry_guild_slot_1: "[ShowBuildingTypeName('jewelry_guild')|e] Work"
 khmer_baray_desc: "A large reservoir of water. Each baray stores the monsoon for the dry season and feeds the fields below it, so Khmer lands can sustain far more people per channel than ordinary irrigation. Barays and irrigation systems share the same water, so their levels count against one cap."
 lumber_improvements_absolutism: "Forest Ordinances"
 lumber_improvements_absolutism_desc: "Surveyed stands, harvest registers, and forest ordinances organize woodland cutting for larger saw works."
 lumber_improvements_discovery_desc: "Dedicated woodland management prepares larger forest districts for later sawmill improvements."
 lumber_improvements_reformation: "Water Sawmills"
 lumber_improvements_reformation_desc: "Water-powered saw frames, millraces, and log landings let lumber crews saw boards more regularly while drawing logs from a wider forest hinterland."
