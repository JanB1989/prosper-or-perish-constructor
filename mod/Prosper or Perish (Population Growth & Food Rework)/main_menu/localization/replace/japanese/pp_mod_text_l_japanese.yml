 coal_improvements_absolutism: "Timbered Coal Seams"
 coal_improvements_absolutism_desc: "Better surveying, timbering, haulage, and coal sorting let collieries work deeper seams and handle solid fuels more reliably."
 coal_improvements_revolutions: "Deep Coal Shafts"
 coal_improvements_revolutions_desc: "Late colliery drainage, haulage, and sorting improvements increase output from organized coal mines."
 cupola_smelting_desc: "Coal-fired cupola furnaces improve smelting at the best organized lead mines."
 efficient_mining: "Ore Dressing"
 efficient_mining_desc: "Better mine surveys, timbering, haulage, and dressing floors separate useful iron ore from silica-rich gangue and other waste before smelting."
