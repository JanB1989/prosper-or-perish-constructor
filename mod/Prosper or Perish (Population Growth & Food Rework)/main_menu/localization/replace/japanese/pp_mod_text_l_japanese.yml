 renaissance_sculptures_desc: "Sculptural patronage raises demand for selected stone and marble. Better block selection and quarry saws improve both ordinary stone and ornamental marble supply."
 saiger_process_discovery_desc: "Improved dressing, liquation, and cupellation separate silver from lead-rich ores more reliably."
 salt_collector: "Coastal Saltern"
 salt_collector_desc: "Coastal salterns draw seawater into salt marshes, settling ponds, and shallow pans where sun, wind, and careful boiling turn brine into usable salt."
 slitting_mills_desc: "Water-powered slitting mills turn smelted blooms and bars into more regular wrought iron, increasing demand for cleaner dressed ore."
