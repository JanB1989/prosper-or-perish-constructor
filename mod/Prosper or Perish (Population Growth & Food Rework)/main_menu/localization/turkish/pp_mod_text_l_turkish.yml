  MAPMODE_PP_POSITIVE_PROVINCE_FOOD_GROWTH: "#T $mapmode_pp_positive_province_food_growth_name$#!\nColors each [province|e] by the months of its own food consumption it holds in storage. Stored food drives [population_growth|e]: the more months in store, the faster the province grows, up to the striped level. A monthly surplus that is not stored adds no growth."
