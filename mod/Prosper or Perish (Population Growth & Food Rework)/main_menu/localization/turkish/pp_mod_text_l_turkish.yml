  MAPMODE_PP_FOREST_VILLAGE_CAPACITY_TT_LAND: "#T $mapmode_pp_forest_village_capacity_name$#!\nCurrent Capacity: #V [ROOT.GetLocation.MakeScope.ScriptValue('forest_capacity')|1]#!\n\nThis is the same value used by forest and lumber building maximum levels. Their maximum-level tooltip lists the active [pp_forest_capacity|e] sources, including forest geography, [rgo|e], Maximum RGO Size, location rank, Manorial Customals, forest and lumber [building|e] levels, and building levels in the location.\n\n#I $PP_CAPACITY_MAPMODE_SEE_EUROPEDIA$#!"
  MAPMODE_PP_VICTUALS_PRICE_TT_LAND: "#T $mapmode_pp_victuals_price_name$#!\n@market! [Market.GetName]\n[ShowGoodsName('victuals')|e] Price: #V [Market.MakeScope.ScriptValue('pp_victuals_price_map_value')|2]#![gold_i]"
