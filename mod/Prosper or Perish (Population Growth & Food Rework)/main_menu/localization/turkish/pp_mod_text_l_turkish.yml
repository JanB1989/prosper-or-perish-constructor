  # Build panel cost and payback columns and the payback order (tools/port_vanilla_gui.py): build cost / monthly profit, in years
  PP_BUILD_PAYBACK_ORDER_TT: "#T Payback Order#!\nClick to list the locations by payback time, shortest first: the years the profit of one more level takes to pay back its construction cost. Locations with similar payback times keep the order of the last sort, so sort by profit first for the closest order. The slowest locations and those without profit come last.\n\nClick again, or click any sort, to leave the payback order."
  PP_BUILD_COST_HEADER_TT: "Construction cost of one more level"
  PP_BUILD_PAYBACK_TT_BUILT: "#T Payback Time#!\nYears one more level takes to pay back its construction cost.\n\nConstruction cost: [GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self)|0]@gold!\nProfit per month: [Building.GetProfitPerLevel|2]@wealth!\n#bold Paid back by profit:#! [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetProfitPerLevel), '(CFixedPoint)12')|1] years\n\nTax income per month: [Building.GetIncomeToOwnerPerLevel|2]@income!\nPaid back by tax income: [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetIncomeToOwnerPerLevel), '(CFixedPoint)12')|1] years"
  PP_BUILD_PAYBACK_TT_UNBUILT: "#T Payback Time#!\nYears the first level takes to pay back its construction cost.\n\nConstruction cost: [GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self)|0]@gold!\nProfit per month: [GetBuildingTypeProfitInLocation(BuildingType.Self, Location.Self)|2]@wealth!\n#bold Paid back by profit:#! [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), GetBuildingTypeProfitInLocation(BuildingType.Self, Location.Self)), '(CFixedPoint)12')|1] years\n\nTax income per month: [GetBuildingTypeIncomeToOwnerInLocation(BuildingType.Self, Location.Self)|2]@income!\nPaid back by tax income: [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), GetBuildingTypeIncomeToOwnerInLocation(BuildingType.Self, Location.Self)), '(CFixedPoint)12')|1] years"
