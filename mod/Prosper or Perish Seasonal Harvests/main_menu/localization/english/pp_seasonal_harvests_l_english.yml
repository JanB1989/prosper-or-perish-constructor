l_english:
  rule_pp_variable_harvest_rule: "Seasonal Harvests"
  setting_pp_variable_harvest_enabled: "Enabled"
  setting_pp_variable_harvest_enabled_desc: "Regional harvest outcomes affect farmed-goods output each year."
  setting_pp_variable_harvest_disabled: "Disabled"
  setting_pp_variable_harvest_disabled_desc: "Regional harvest outcomes will not affect goods output."
  harvest_situation: "Seasonal Harvests"
  harvest_situation_desc: "Each September, every region receives a harvest outcome. Nearby regions can move together, and repeated good or bad years can make similar outcomes more likely. Average years leave no harvest modifier. Inspect an affected location's harvest modifier to see the current effects on its goods output."
  harvest_situation_monthly: "Harvest outcomes are checked each September. Broad harvest areas make nearby regions more likely to move together. Active harvests appear as location modifiers. Average years leave no modifier. Poor harvests reduce affected goods output; strong harvests improve it."
  game_concept_harvest_situation: "Seasonal Harvests"
  game_concept_harvest_situation_desc: "Yearly harvest outcomes represent uncertainty from weather, pests, timing, and local resilience. Each September, regions receive harvest conditions shaped by their broad harvest area. Active harvest modifiers show the goods affected and their current effects."
  game_concept_pp_variable_harvests: "Seasonal Harvests"
  game_concept_pp_variable_harvests_desc: "Each September, every region receives harvest conditions. Broad harvest areas make nearby regions more likely to move together, while individual regions can still receive different outcomes. Poor harvests reduce output of affected farmed goods; strong harvests improve it. Average years leave no harvest modifier. Inspect a location's harvest modifier for its current effects."
