# >>> eu5-building-pipeline:alum_quarry:localization
  alum_quarry_slot_0: "Alum Deposit"
  alum_quarry_slot_1: "Waste Sorting"
  alum_quarry_slot_2: "Alum Quarrying"
  alum_quarry: "Alum Quarry"
  alum_quarry_desc: "Open quarries strip alum shale and alum stone from exposed beds. Workers remove sandstone cover and sort useful shale for burning and leaching at alum works."
  pp_alum_quarry_base_alum: "Exposed Alum Shale"
  pp_alum_quarry_base_alum_desc: "The alum shale itself: what the exposed bed gives before any quarryman improves on it."
  pp_alum_quarry_no_primary: "No Alum Extraction"
  pp_alum_quarry_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_alum_quarry_alum: "Alum Shale Quarrying"
  pp_alum_quarry_alum_desc: "The shale is piled with brushwood and burnt slowly, then steeped in pits of water. The liquor is boiled down until alum crystals form, the mordant every dyer needs to fix his colours."
  pp_alum_quarry_no_secondary: "No Waste Sorting"
  pp_alum_quarry_no_secondary_desc: "No byproduct is taken from this work, the waste goes to the spoil heap."
  pp_alum_quarry_stone: "Sandstone Overburden"
  pp_alum_quarry_stone_desc: "Before the shale can be reached, its sandstone cover has to come off. The quarrymen break it into rubble and rough building stone and cart it away for sale."
  pp_alum_quarry_clay: "Shale Clay Sorting"
  pp_alum_quarry_clay_desc: "The soft clay that lies between the shale beds is dug out and set aside for brickmakers and potters. It pays for a little of the stripping that the alum needs."
  pp_alum_quarry_market_sales: "Market Sales"
  pp_alum_quarry_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  alum_quarry_slot_3: "Market"
