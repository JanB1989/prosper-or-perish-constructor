# >>> eu5-building-pipeline:alum_works:localization
  alum_works_slot_0: "Alum Deposit"
  alum_works_slot_1: "Waste Sorting"
  alum_works_slot_2: "[ShowBuildingTypeName('alum_works')|e]"
  alum_works: "Alum Works"
  alum_works_desc: "Alum works burn shale in clamps, steep the ash, and boil the liquor into alum crystals. The same yards sort stone and clay waste from the quarry."
  pp_alum_works_base_alum: "Surveyed Alum Shale"
  pp_alum_works_base_alum_desc: "The surveyed alum shale: what the mapped bed gives before the works improve on it."
  pp_alum_works_no_primary: "No Alum Extraction"
  pp_alum_works_no_primary_desc: "No shale is calcined or leached; a few hands only gather alum from the old heaps."
  pp_alum_works_alum: "Calcining and Leaching"
  pp_alum_works_alum_desc: "Great heaps of shale burn for months, and the leached liquor runs into cisterns before it is boiled in lead pans. Potash or urine makes the alum crystallize, as in the Yorkshire alum works of the seventeenth century."
  pp_alum_works_no_secondary: "No Waste Sorting"
  pp_alum_works_no_secondary_desc: "No clay or sandstone is sold from the spoil here; the works tip their waste and keep to the alum."
  pp_alum_works_stone: "Sandstone Overburden"
  pp_alum_works_stone_desc: "The sandstone cover is stripped in long benches ahead of the shale face. What comes off is sold as building stone and rubble instead of being tipped away."
  pp_alum_works_clay: "Shale Clay Sorting"
  pp_alum_works_clay_desc: "Clay picked out of the shale waste is cleaned and sold to brickmakers and potters. The great spoil heaps of the works earn something this way."
  pp_alum_works_market_sales: "Market Sales"
  pp_alum_works_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  alum_works_slot_3: "Market"
# <<< eu5-building-pipeline:alum_works:localization
