l_english:
  # Generated by ppc finalize (arable_land_bar.py); the population and capacity bars of the location view
  PP_LAND_BAR_POPULATION: "[Concept('population', 'Land Usage')|E]"
  PP_LAND_BAR_CAPACITY: "[Concept('population_capacity', 'Land Capacity')|E]"
  PP_LAND_BAR_TOWNSFOLK: "[pp_townsfolk|e]"
  PP_LAND_BAR_SUBSISTENCE: "[ShowModifier('pp_subsistence_land')]"
  PP_LAND_BAR_LAND: "[Concept('population_capacity', 'Free Arable Land')|e]"
  PP_LAND_BAR_FARMS: "[pp_farm_land|e]"
  PP_LAND_BAR_ROOM: "[Concept('pp_land_improvements', 'Unimproved Land')|e]"
  PP_LAND_BAR_TT_TITLE: "Land Usage and Land Capacity"
  PP_LAND_BAR_TT_TOTAL: "Total"
  PP_LAND_BAR_TT_NATURAL: "[pp_location_potential|e]"
  PP_LAND_BAR_TT_IMPROVEMENTS: "[pp_land_improvements|e]"
  PP_LAND_BAR_TT_OVER: "Over the [Concept('population_capacity', 'Land Capacity')|e]"
  PP_LAND_BAR_TT_DEF_ABUNDANT: "[ShowModifier('abundant_free_land')]: $PP_LAND_CHIP_ABUNDANT$"
  PP_LAND_BAR_TT_DEF_AVAILABLE: "[ShowModifier('available_free_land')]: $PP_LAND_CHIP_AVAILABLE$"
  PP_LAND_BAR_TT_DEF_OVERUSED: "[ShowModifier('overpopulation')]: $PP_LAND_CHIP_OVERPOPULATION$"
  # the bars' parts as game concepts (main_menu/common/game_concepts/pp_arable_land_bar.txt)
  game_concept_pp_townsfolk: "Urban Land"
  game_concept_pp_townsfolk_desc: "The land of everyone in a [location|e] but the peasants on [ShowModifier('pp_subsistence_land')]. They bring their own [Concept('population_capacity', 'Land Capacity')|e], so Urban Land adds as much as it uses."
  game_concept_pp_land_improvements: "Land Improvements"
  game_concept_pp_land_improvements_desc: "[buildings|E] that add [population_capacity|e] to their [location|e]. Unimproved Land is what the improvements its owner can build there now could still add."
  game_concept_pp_farm_land: "Farm Land Usage"
  game_concept_pp_farm_land_desc: "The [population_capacity|e] the farms of a [location|e] take: each level of a farm [building|e] takes its share."
