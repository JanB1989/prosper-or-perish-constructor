l_english:

# >>> eu5-building-pipeline:beer_workshop:localization
  beer_workshop_slot_0: "[ShowBuildingTypeName('beer_workshop')|e] Work"
  pp_beer_workshop_wheat_beer_workshop_maintenance: "Wheat Beer"
  pp_beer_workshop_wheat_beer_workshop_maintenance_desc: "The brewers malt the grain, mash it in a wooden tun, boil the wort with herbs or hops and leave it to ferment in casks. A town brewhouse keeps its quarter in daily ale."
  pp_beer_workshop_millet_beer_workshop_maintenance: "Millet Beer"
  pp_beer_workshop_millet_beer_workshop_maintenance_desc: "Millet and sorghum are sprouted, dried and mashed, and the thick, sour beer ferments in a day or two. Across Africa and the Himalaya such beers are food as much as drink."
  pp_beer_workshop_fruit_beer_workshop_maintenance: "Fruit Beer"
  pp_beer_workshop_fruit_beer_workshop_maintenance_desc: "Apples and pears go through the mill and the press, and the juice ferments in casks into cider and perry, the everyday drink of orchard country from Normandy to the West of England."
  pp_beer_workshop_maize_beer_workshop_maintenance: "Maize Beer"
  pp_beer_workshop_maize_beer_workshop_maintenance_desc: "Maize is sprouted, ground and boiled, and the mash ferments in large clay jars. Brewed like the chicha of the Andes, the beer is drunk young at feasts and work parties."
  pp_beer_workshop_bavarian_beer_workshop_maintenance: "Bavarian Beer"
  pp_beer_workshop_bavarian_beer_workshop_maintenance_desc: "Bavarian brewers brew in the cold months and age their beer in cool cellars through the summer, so it keeps well and travels. Wheat beer was a privilege of the dukes, whose breweries sold it across the land."
  pp_beer_workshop_honey_beer_workshop_maintenance: "Honey Beer"
  pp_beer_workshop_honey_beer_workshop_maintenance_desc: "Honey from the hives is fermented together with grain into a sweet, strong honey beer, a cousin of mead that was brewed wherever bees were kept and grain was short."
  pp_beer_workshop_rice_beer_workshop_maintenance: "Rice Beer"
  pp_beer_workshop_rice_beer_workshop_maintenance_desc: "Steamed rice is seeded with a mould starter that turns its starch to sugar, then fermented in vats. The rice wines of China, Korea and Japan are brewed this way."
  pp_beer_workshop_market_sales: "Market Sales"
  pp_beer_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  beer_workshop_slot_1: "Market"
# <<< eu5-building-pipeline:beer_workshop:localization
