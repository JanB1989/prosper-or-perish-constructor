  bog_iron_smelter_blast_furnace_slot_0: "Bog Iron Processing"
  bog_iron_smelter_blast_furnace: "Bog Iron Blast Furnace"
  bog_iron_smelter_blast_furnace_desc: "Blast furnaces and finery hearths let wetland ironworks smelt more bog ore with steadier heat and larger crews."
  pp_bog_iron_smelter_blast_furnace_maintenance: "Bog Iron Furnace Work"
  pp_bog_iron_smelter_blast_furnace_maintenance_desc: "A tall furnace with water-driven bellows melts the bog ore into liquid pig iron, which is tapped off at intervals. It gives far more iron than the old bloomeries did."
  pp_bog_iron_smelter_blast_furnace_finery: "Bog Iron Finery Hearths"
  pp_bog_iron_smelter_blast_furnace_finery_desc: "The brittle pig iron from the furnace is remelted in a finery hearth under the blast, which burns off much of its carbon. The hammer then works it into tough bar iron for the smiths."
  pp_bog_iron_smelter_blast_furnace_market_sales: "Market Sales"
  pp_bog_iron_smelter_blast_furnace_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  bog_iron_smelter_blast_furnace_slot_1: "Market"
