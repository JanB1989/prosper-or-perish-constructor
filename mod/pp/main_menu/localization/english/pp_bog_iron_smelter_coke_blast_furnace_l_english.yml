# >>> eu5-building-pipeline:bog_iron_smelter_coke_blast_furnace:localization
  bog_iron_smelter_coke_blast_furnace_slot_0: "Bog Iron Processing"
  bog_iron_smelter_coke_blast_furnace: "Coke-Fired Bog Iron Furnace"
  bog_iron_smelter_coke_blast_furnace_desc: "Coke fuel and hot-blast practice bring late bog ironworks to their highest output, though they still depend on small wetland ore beds."
  pp_bog_iron_smelter_coke_blast_furnace_maintenance: "Coke-Fired Bog Iron Work"
  pp_bog_iron_smelter_coke_blast_furnace_maintenance_desc: "Coal baked into coke replaces charcoal, so the furnace no longer waits on the woods. With limestone as flux it smelts the bog ore in larger and steadier charges."
  pp_bog_iron_smelter_hot_blast_refining_maintenance: "Hot Blast Bog Iron Refining"
  pp_bog_iron_smelter_hot_blast_refining_maintenance_desc: "The air for the blast is heated in iron pipes before it enters the furnace, so the hotter fire smelts more bog ore on far less fuel. Neilson's hot blast of 1828 spread quickly through the ironworks."
  pp_bog_iron_smelter_coke_blast_furnace_market_sales: "Market Sales"
  pp_bog_iron_smelter_coke_blast_furnace_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  bog_iron_smelter_coke_blast_furnace_slot_1: "Market"
