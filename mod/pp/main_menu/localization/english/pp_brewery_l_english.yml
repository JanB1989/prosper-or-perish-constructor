l_english:

# >>> eu5-building-pipeline:brewery:localization
  pp_brewery_price: "[ShowBuildingTypeName('brewery')|e] Price"
  brewery_slot_0: "[ShowBuildingTypeName('brewery')|e] Work"
  pp_brewery_wheat_brewery_maintenance: "Wheat Beer"
  pp_brewery_wheat_brewery_maintenance_desc: "Brewers malt the grain, mash it in a wooden tun and boil the wort with hops before it ferments in casks. Hopped beer kept longer than the old ale and spread through the towns of northern Europe."
  pp_brewery_millet_brewery_maintenance: "Millet Beer"
  pp_brewery_millet_brewery_maintenance_desc: "Millet is sprouted, dried and boiled into a thick, sour beer that ferments within a day or two. Across Africa and in the Himalaya such beer was food as much as drink."
  pp_brewery_fruit_brewery_maintenance: "Fruit Cider"
  pp_brewery_fruit_brewery_maintenance_desc: "Apples and pears are crushed in a press and the juice is left to ferment in wooden casks. Normandy, the West of England and the Basque country made cider their everyday drink."
  pp_brewery_maize_brewery_maintenance: "Maize Beer"
  pp_brewery_maize_brewery_maintenance_desc: "Maize is sprouted or chewed to start the ferment, then boiled and left to work in big clay jars. Andean chicha was brewed this way for feasts and for the work crews of the Inca."
  pp_brewery_bavarian_brewery_maintenance: "Bavarian Beer"
  pp_brewery_bavarian_brewery_maintenance_desc: "The brewers keep to the Bavarian purity rule of 1516: malt, hops and water alone. The beer ferments slowly in cold cellars over the winter and comes out clear and strong."
  pp_brewery_honey_brewery_maintenance: "Honey Bragget"
  pp_brewery_honey_brewery_maintenance_desc: "The brewers ferment honey together with malted grain, a cross between mead and ale. Bragget was an old drink of Wales and England, sweet, rich and strong."
  pp_brewery_rice_brewery_maintenance: "Rice Beer"
  pp_brewery_rice_brewery_maintenance_desc: "Steamed rice is mixed with a starter cake of moulds and yeast and left in jars to ferment into a mild, cloudy beer, as villages brewed it from Assam to Southeast Asia."
  pp_brewery_market_sales: "Market Sales"
  pp_brewery_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  brewery_slot_1: "Market"
# <<< eu5-building-pipeline:brewery:localization
