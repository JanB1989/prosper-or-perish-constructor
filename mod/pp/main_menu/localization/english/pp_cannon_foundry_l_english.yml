  cannon_foundry_slot_0: "Ammunition"
  pp_cannon_foundry_ammunition_maintenance: "Ammunition"
  pp_cannon_foundry_ammunition_maintenance_desc: "The works cast lead balls for grape and canister and mix saltpetre into gunpowder for the charges. A battery in the field burns through far more powder and shot than it has guns."
  cannon_foundry_slot_1: "[ShowBuildingTypeName('cannon_foundry')|e] Work"
  pp_cannon_foundry_cannon_foundry_maintenance: "Bronze Cannons"
  pp_cannon_foundry_cannon_foundry_maintenance_desc: "Founders melt copper and tin together in a reverberatory furnace and pour the bronze into a clay mould buried upright in a pit. The cooled gun is then bored, chased and proved."
  pp_cannon_foundry_market_sales: "Market Sales"
  pp_cannon_foundry_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cannon_foundry_slot_2: "Market"
