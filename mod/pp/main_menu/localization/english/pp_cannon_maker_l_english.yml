l_english:

# >>> eu5-building-pipeline:cannon_maker:localization
  pp_cannon_maker_price: "[ShowBuildingTypeName('cannon_maker')|e] Price"
  pp_cannon_maker_cannon_maker_lumber_maintenance: "Wooden Barrels"
  pp_cannon_maker_cannon_maker_lumber_maintenance_desc: "Where metal is dear, gunmakers bore out hardwood logs and bind them with iron hoops. Such wooden guns burst after a few shots, but they were cheap and quick to make for a siege."
  pp_cannon_maker_cannon_maker_bronze_maintenance: "Cast Bronze Barrels"
  pp_cannon_maker_cannon_maker_bronze_maintenance_desc: "Founders who learned their trade casting church bells pour bronze into clay moulds around a core. The cast barrel is heavy but tough and rarely bursts."
  pp_cannon_maker_cannon_maker_iron_maintenance: "Wrought Iron Barrels"
  pp_cannon_maker_cannon_maker_iron_maintenance_desc: "Smiths forge long iron staves, lay them around a core and shrink red-hot hoops over them, like a barrel of wood. The great bombards of the fifteenth century were built this way."
  pp_cannon_maker_cannon_maker_ammunition_stone_maintenance: "Stone Shot"
  pp_cannon_maker_cannon_maker_ammunition_stone_maintenance_desc: "Masons cut round shot from stone for the great bombards, slow work that made every ball precious. With the shot the makers mix powder from saltpeter, sulphur and charcoal."
  pp_cannon_maker_cannon_maker_ammunition_lead_maintenance: "Lead Shot"
  pp_cannon_maker_cannon_maker_ammunition_lead_maintenance_desc: "Lead melts easily and is poured into moulds for the shot of small pieces, or packed into cases that burst into a spray of balls at close range."
  pp_cannon_maker_cannon_maker_ammunition_iron_maintenance: "Iron Shot"
  pp_cannon_maker_cannon_maker_ammunition_iron_maintenance_desc: "Cast iron balls replace stone. They are smaller for the same weight, hit harder and fit lighter guns, a change that made the artillery of the later fifteenth century far more mobile."
  pp_cannon_maker_market_sales: "Market Sales"
  pp_cannon_maker_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cannon_maker_slot_2: "Market"
# <<< eu5-building-pipeline:cannon_maker:localization
