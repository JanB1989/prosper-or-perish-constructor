# >>> eu5-building-pipeline:cannon_workshop:localization
  pp_cannon_workshop_cannon_workshop_bronze_maintenance: "Cast Bronze Barrels"
  pp_cannon_workshop_cannon_workshop_bronze_maintenance_desc: "The gun founders cast bronze barrels in clay moulds and finish them by hand. Bronze guns were the pride of the arsenals of Venice, Burgundy and the Ottoman sultans."
  pp_cannon_workshop_cannon_workshop_iron_maintenance: "Wrought Iron Barrels"
  pp_cannon_workshop_cannon_workshop_iron_maintenance_desc: "The smiths still build guns from welded iron staves and hoops. They are cheaper than bronze, though heavier and more prone to rust and to bursting."
  pp_cannon_workshop_cannon_workshop_ammunition_stone_maintenance: "Stone Shot"
  pp_cannon_workshop_cannon_workshop_ammunition_stone_maintenance_desc: "The workshop keeps stonecutters for the old stone shot that heavy siege pieces and mortars still fire. Its powder makers mix saltpeter, sulphur and charcoal in larger batches."
  pp_cannon_workshop_cannon_workshop_ammunition_lead_maintenance: "Lead Shot"
  pp_cannon_workshop_cannon_workshop_ammunition_lead_maintenance_desc: "Lead balls are cast by the hundred in iron moulds for the light field pieces. Packed into tin canisters, they scatter like a shower of musket balls at close range."
  pp_cannon_workshop_cannon_workshop_ammunition_iron_maintenance: "Iron Shot"
  pp_cannon_workshop_cannon_workshop_ammunition_iron_maintenance_desc: "Iron shot is cast in sand moulds to set calibres, so every ball fits the guns it is made for. Standard calibres made it far easier to supply an army in the field."
  pp_cannon_workshop_market_sales: "Market Sales"
  pp_cannon_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cannon_workshop_slot_2: "Market"
# <<< eu5-building-pipeline:cannon_workshop:localization
