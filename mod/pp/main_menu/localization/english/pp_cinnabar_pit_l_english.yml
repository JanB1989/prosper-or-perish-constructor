# >>> eu5-building-pipeline:cinnabar_pit:localization
  cinnabar_pit_slot_0: "Cinnabar Deposit"
  cinnabar_pit_slot_1: "Gangue Sorting"
  cinnabar_pit_slot_2: "Cinnabar Workings"
  cinnabar_pit: "Cinnabar Pit"
  cinnabar_pit_desc: "Shallow pits and galleries follow red cinnabar seams for quicksilver ore. Workers sort waste stone by hand and send the richest ore for roasting."
  pp_cinnabar_pit_base_mercury: "Exposed Cinnabar Seam"
  pp_cinnabar_pit_base_mercury_desc: "The cinnabar seam itself: what the exposed vein gives before any miner improves on it."
  pp_cinnabar_pit_no_primary: "No Mercury Extraction"
  pp_cinnabar_pit_no_primary_desc: "No galleries follow the cinnabar veins; a few hands only break ore from the exposed seam."
  pp_cinnabar_pit_mercury: "Cinnabar Vein Workings"
  pp_cinnabar_pit_mercury_desc: "Miners follow the red cinnabar veins by candlelight through propped galleries, then roast the ore so the quicksilver rises as vapour and condenses. The fumes made it some of the deadliest work of the age, at places like Almaden."
  pp_cinnabar_pit_no_secondary: "No Gangue Sorting"
  pp_cinnabar_pit_no_secondary_desc: "No gangue rock is sorted for sale; the miners tip the barren stone and keep to the red ore."
  pp_cinnabar_pit_stone: "Gangue Stone Sorting"
  pp_cinnabar_pit_stone_desc: "The barren gangue rock broken out with the red ore is sorted by hand. It is sold as rough stone for walls and roads, so the waste pays its way."
  pp_cinnabar_pit_market_sales: "Market Sales"
  pp_cinnabar_pit_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cinnabar_pit_slot_3: "Market"
