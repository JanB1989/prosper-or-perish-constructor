  clay_washmill_slot_2: "Clay Preparation"
  clay_washmill: "Clay Washmill"
  clay_washmill_desc: "Horse- or ox-driven pugmills turn clay inside brick-lined wash pits, mixing dug clay with water before it settles into a more regular body for brick, tile, and pottery work. Levigation ponds skim finer clay from the slurry while coarse grit settles out."
  pp_clay_washmill_base_clay: "Surveyed Clay Beds"
  pp_clay_washmill_base_clay_desc: "The surveyed clay beds: what the ground gives before the works improve on it."
  pp_clay_washmill_no_preparation: "No Clay Preparation"
  pp_clay_washmill_no_preparation_desc: "The works go without this step and sell what they dig as it comes."
  pp_clay_washmill_horse_pugging: "Horse Pugmill"
  pp_clay_washmill_horse_pugging_desc: "A horse walks a circle around a tub where an upright shaft drives blades through the wet clay. The pugmill kneads it to an even body far faster than treading it underfoot."
  pp_clay_washmill_ox_pugging: "Ox Pugmill"
  pp_clay_washmill_ox_pugging_desc: "An ox turns the pugmill shaft in slow circles, cutting and kneading the wet clay into an even body for bricks and tiles. Oxen are slower than horses but cheaper to keep."
  pp_clay_washmill_no_refining: "No Clay Refining"
  pp_clay_washmill_no_refining_desc: "The works go without this step and sell what they dig as it comes."
  pp_clay_washmill_levigation_ponds: "Levigation Ponds"
  pp_clay_washmill_levigation_ponds_desc: "Clay is stirred into water and run through a chain of settling ponds. Grit and sand sink first, and the finest clay settles last, ready for good pottery and tile."
  pp_clay_washmill: "Clay Washmills"
  pp_clay_washmill_desc: "Brick-lined wash pits, settling ponds, and horse- or ox-driven pugmills prepare more consistent clay for ceramic trades."
  pp_clay_washmill_market_sales: "Market Sales"
  pp_clay_washmill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  clay_washmill_slot_3: "Market"
