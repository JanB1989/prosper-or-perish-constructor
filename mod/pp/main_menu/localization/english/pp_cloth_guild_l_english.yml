  pp_cloth_guild_price: "[ShowBuildingTypeName('cloth_guild')|e] Price"
  cloth_guild_slot_0: "[ShowBuildingTypeName('cloth_guild')|e] Work"
  pp_cloth_guild_cotton_cloth_guild_maintenance: "Cotton Spinning"
  pp_cloth_guild_cotton_cloth_guild_maintenance_desc: "Cotton is cleaned, carded and spun on the wheel, which came to the West from India and the Islamic world. The guild weaves it into light cloth and the stronger fustian."
  pp_cloth_guild_wool_cloth_guild_maintenance: "Wool Spinning"
  pp_cloth_guild_wool_cloth_guild_maintenance_desc: "Shorn wool is washed, carded and spun, and the guild weavers make woollen cloth on the treadle loom. It was the staple trade of medieval towns from Flanders to Florence."
  pp_cloth_guild_fiber_crops_cloth_guild_maintenance: "Linen Spinning"
  pp_cloth_guild_fiber_crops_cloth_guild_maintenance_desc: "Flax is retted, broken and combed, and the spinners draw the fibre into thread on the distaff and spindle. The guild weavers turn it into linen for shirts, sheets and sails."
  pp_cloth_guild_market_sales: "Market Sales"
  pp_cloth_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cloth_guild_slot_1: "Market"
