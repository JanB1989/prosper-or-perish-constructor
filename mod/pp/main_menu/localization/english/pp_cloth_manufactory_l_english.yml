# >>> eu5-building-pipeline:cloth_manufactory:localization
  pp_cloth_manufactory_wool_cloth_manufactory_maintenance: "Wool Cloth"
  pp_cloth_manufactory_wool_cloth_manufactory_maintenance_desc: "Spinners, weavers and fullers work for one master who buys the wool and dyes and sells the finished cloth. Such manufactories in England, Flanders and France turned out woollens by the bale."
  pp_cloth_manufactory_cotton_cloth_manufactory_maintenance: "Cotton Cloth"
  pp_cloth_manufactory_cotton_cloth_manufactory_maintenance_desc: "Cotton is carded, spun and woven into calico in long workshops, then dyed or printed. The trade began by copying the painted cottons of India and grew fast in Europe from the late seventeenth century."
  pp_cloth_manufactory_fiber_crops_cloth_manufactory_maintenance: "Linen Cloth"
  pp_cloth_manufactory_fiber_crops_cloth_manufactory_maintenance_desc: "Flax is retted, broken, spun and woven into linen, then laid out on the bleaching greens to whiten. Silesia, Flanders and Ulster sold their linen across the world."
  pp_cloth_manufactory_market_sales: "Market Sales"
  pp_cloth_manufactory_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  pp_cloth_manufactory_legacy_cotton_cloth_workshop_maintenance: "$cotton_cloth_workshop_maintenance$ (Old Ways)"
  pp_cloth_manufactory_legacy_cotton_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_cloth_manufactory_legacy_fiber_crops_cloth_workshop_maintenance: "$fiber_crops_cloth_workshop_maintenance$ (Old Ways)"
  pp_cloth_manufactory_legacy_fiber_crops_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_cloth_manufactory_legacy_wool_cloth_workshop_maintenance: "$wool_cloth_workshop_maintenance$ (Old Ways)"
  pp_cloth_manufactory_legacy_wool_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
