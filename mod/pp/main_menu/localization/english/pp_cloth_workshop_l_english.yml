  cloth_workshop_slot_0: "[ShowBuildingTypeName('cloth_workshop')|e] Work"
  pp_cloth_workshop_cotton_cloth_workshop_maintenance: "Cotton Cloth"
  pp_cloth_workshop_cotton_cloth_workshop_maintenance_desc: "Spinners and weavers turn bought cotton into calico and muslin. Indian cotton cloth set the standard of quality that every other maker tried to match."
  pp_cloth_workshop_wool_cloth_workshop_maintenance: "Wool Cloth"
  pp_cloth_workshop_wool_cloth_workshop_maintenance_desc: "A clothier sends wool out to spinners and brings the yarn back to his weavers, then sells the bolts. This trade built the wealth of towns from Ypres to Norwich."
  pp_cloth_workshop_fiber_crops_cloth_workshop_maintenance: "Linen Cloth"
  pp_cloth_workshop_fiber_crops_cloth_workshop_maintenance_desc: "The workshop buys flax from the countryside and keeps spinners and weavers at work all year. Linen from Flanders, Westphalia and Silesia was sold across Europe."
  pp_cloth_workshop_market_sales: "Market Sales"
  pp_cloth_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  cloth_workshop_slot_1: "Market"
