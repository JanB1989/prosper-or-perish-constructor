# >>> eu5-building-pipeline:coal_mine_improved:localization
  coal_mine_improved_slot_0: "Coal Seam"
  coal_mine_improved_slot_1: "Clay Recovery"
  coal_mine_improved_slot_2: "[ShowBuildingTypeName('coal_mine_improved')|e] Workings"
  coal_mine_improved: "Colliery"
  coal_mine_improved_desc: "Timbered colliery galleries use better haulage, drainage, and sorting floors to work deeper seams. Fireclay is recovered from useful seat-clay beds."
  pp_coal_mine_improved_base_coal: "Surveyed Coal Seam"
  pp_coal_mine_improved_base_coal_desc: "The surveyed seam itself: what the ground gives before the timbered workings add to it."
  pp_coal_mine_improved_no_primary: "No Timbered Workings"
  pp_coal_mine_improved_no_primary_desc: "No timbered galleries are worked here; the pit gives only what its seam yields on its own."
  pp_coal_mine_improved_coal: "Timbered Workings"
  pp_coal_mine_improved_coal_desc: "Shafts reach the seam from above and the colliers work it room by room, leaving pillars of coal to hold the roof while timber props shore the rest. Tarred ropes wind the coal up and pumps keep the water down."
  pp_coal_mine_improved_no_secondary: "No Clay Recovery"
  pp_coal_mine_improved_no_secondary_desc: "No fireclay is sorted from the spoil here; the colliers keep to the coal."
  pp_coal_mine_improved_fireclay: "Fireclay Sorting"
  pp_coal_mine_improved_fireclay_desc: "Fireclay from beneath the seam is picked out on the sorting floors and left in heaps to weather. Glassmakers and furnace builders want it for crucibles and firebricks that hold their shape in great heat."
  pp_coal_mine_improved_market_sales: "Market Sales"
  pp_coal_mine_improved_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  coal_mine_improved_slot_3: "Market"
