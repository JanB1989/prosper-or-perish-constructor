# >>> eu5-building-pipeline:coal_mine:localization
  coal_mine_slot_0: "Coal Seam"
  coal_mine_slot_1: "Clay Recovery"
  coal_mine_slot_2: "Coal Workings"
  coal_mine: "Coal Drift"
  coal_mine_desc: "Shallow drifts follow exposed coal seams from the surface. Timbering, hand haulage, and simple sorting floors also recover seat-clay from the coal measures."
  pp_coal_mine_base_coal: "Outcropping Coal Seam"
  pp_coal_mine_base_coal_desc: "The seam where it breaks the surface: what the ground gives before any collier improves on it."
  pp_coal_mine_no_primary: "No Coal Workings"
  pp_coal_mine_no_primary_desc: "No drifts are driven here, the pit gives only what its outcrop yields on its own."
  pp_coal_mine_coal: "Drift Workings"
  pp_coal_mine_coal_desc: "The colliers drive a sloping tunnel into the hillside along the seam, prop it with timber and drag the coal out in wicker baskets. The drift drains itself downhill, so the work goes on without pumps."
  pp_coal_mine_bell_pits: "Bell Pits"
  pp_coal_mine_bell_pits_desc: "Where the seam lies close under the grass, the colliers sink a narrow shaft and widen it at the bottom like a bell, taking coal until the roof grows unsafe. Then they abandon it and dig the next one alongside."
  pp_coal_mine_no_secondary: "No Clay Recovery"
  pp_coal_mine_no_secondary_desc: "No seat-clay is sorted out here, the colliers keep to the coal."
  pp_coal_mine_fireclay: "Seat-Clay Sorting"
  pp_coal_mine_fireclay_desc: "Beneath every coal seam lies a bed of pale seat-clay, the old soil the coal forest grew in. The colliers set the best of it aside to weather, and potters and brickmakers buy it for work that must stand fire."
  pp_coal_mine_market_sales: "Market Sales"
  pp_coal_mine_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  coal_mine_slot_3: "Market"
# <<< eu5-building-pipeline:coal_mine:localization
