  pp_coastal_saltern_no_sun_pans_desc: "No sun pans are worked here; the salters keep to their marsh."
  pp_coastal_saltern_sun_pans: "Sun Pans"
  pp_coastal_saltern_sun_pans_desc: "Through the long dry summer the sun alone draws the water out of shallow pans of brine, and the salt crust is raked up by hand. Only in a [location|e] of [ShowClimateName('arid')], [ShowClimateName('hot_semi_arid')] or [ShowClimateName('mediterranean')] [climate|e]."
