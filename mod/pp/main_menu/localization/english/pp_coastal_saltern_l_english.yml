  pp_coastal_saltern_lined_evaporation_pans_desc: "Seawater flows through a ladder of shallow clay-lined pans, growing saltier in each, until the salt crystals are raked from the last. Salt from the Atlantic marshes of France and Portugal was shipped across northern Europe this way."
