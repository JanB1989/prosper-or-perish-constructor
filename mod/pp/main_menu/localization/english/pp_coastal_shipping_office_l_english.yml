# >>> eu5-building-pipeline:coastal_shipping_office:localization
  coastal_shipping_office_slot_0: "Coastal Network"
  coastal_shipping_office_slot_1: "Coastal Crews"
  coastal_shipping_office: "Coastal Shipping Office"
  coastal_shipping_office_desc: "Coasting masters, freight clerks and small craft keep short-sea traffic moving between nearby ports. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands in a [port|e], and a better harbour takes more levels."
  pp_coastal_shipping_office_construction: "[ShowBuildingTypeName('coastal_shipping_office')|e] Construction"
  pp_coastal_shipping_office_maintenance: "Coasting Crews"
  pp_coastal_shipping_office_maintenance_desc: "Small coasters hop from port to port with mixed cargo, never far from land. Their crews need sails, tar and timber for the constant repairs."
  pp_coastal_shipping_office_hand_crews: "Hand Crews"
  pp_coastal_shipping_office_hand_crews_desc: "Rowing and poling crews move loads in open boats along the shore and between nearby harbours. It costs many hands and much food, but little gear."
  pp_coastal_shipping_office_rigged_coasters: "Rigged Coasters"
  pp_coastal_shipping_office_rigged_coasters_desc: "Well-rigged coasting vessels under trained masters sail to a schedule, and clerks track every cargo on paper. They carry more each trip and lose less on the way."
  pp_coastal_shipping_office_logistics_network: "Coastal Pilots"
  pp_coastal_shipping_office_logistics_network_desc: "Local pilots and harbour masters bring passing coasters in and out, so some trade keeps moving along the coast even when the office's own ships lie idle."
# <<< eu5-building-pipeline:coastal_shipping_office:localization
