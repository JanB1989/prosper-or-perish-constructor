l_english:
  # Generated by ppc finalize (construction_plan_country.py); do not edit by hand.
  # The Construction Plan window's Towns and Buildings tab (gui/pp_construction_plan_country.gui)
  PP_CPLANC_PLUS: "+"
  PP_CPLANC_MINUS: "-"
  PP_CPLANC_PUB: "Public buildings"
  PP_CPLANC_PUB_TT: "#T Public buildings#!\nTick a building and the plan builds it in every [location|e] of yours that can have it and has none, where your [max_control|e] reaches the line, the highest first. Where a building has better versions, the plan builds the best one you can build. [conquered|e] locations are left out, and so are locations whose profile switched this rule group off. A tile shows while your country can build the building."
  PP_CPLANC_UPGRADE: "Upgrade"
  PP_CPLANC_UPGRADE_TT: "#T Upgrade buildings#!\nWhile ticked, the plan upgrades your standing buildings to their better version once you have researched it: any building, not only the ones ticked below. It is the game's own upgrade, one level and one [location|e] at a time, at the price the game shows, where the market holds the construction goods; the locations with the highest [max_control|e] come first. Closed buildings and [conquered|e] locations are left out."
  PP_CPLANC_CONTROL_VALUE: "where control can reach [GetPlayer.MakeScope.ScriptValue('pp_cplan_country_control_pct')|0]%"
  PP_CPLANC_CONTROL_TT: "#T Control line#!\nPublic buildings are built only where a [location|e]'s [max_control|e] reaches this."
  PP_CPLANC_RANK: "Towns and cities"
  PP_CPLANC_RANK_TT: "#T Towns and cities#!\nThe plan starts the upgrade wherever a [location|e] may become a [ShowLocationRankName('town')] or a [ShowLocationRankName('city')], the most populous first. It is paid from the same part of the month's gold as the public buildings. [conquered|e] locations are left out, and so are locations that are building something.\nFounding a town takes about a year, a city about two, and needs construction goods from the market: the plan waits until the market holds them. Nothing else is built in that location meanwhile, unless it has a second construction slot."
  PP_CPLANC_TOWN: "To towns"
  PP_CPLANC_TOWN_TT: "#T Rural settlements to towns#!\nA [ShowLocationRankName('town')] houses more people and supports more buildings, but the mines and other rural works of a location can have fewer levels once it is a town.\nFounding a town takes about a year, a city about two, and needs construction goods from the market: the plan waits until the market holds them. Nothing else is built in that location meanwhile, unless it has a second construction slot."
  PP_CPLANC_TOWN_VALUE: "from [GetPlayer.MakeScope.ScriptValue('pp_cplan_country_town_pop')|0] thousand people"
  PP_CPLANC_TOWN_LINE_TT: "#T Population line#!\nA rural settlement becomes a town only once this many people live there."
  PP_CPLANC_CITY: "To cities"
  PP_CPLANC_CITY_TT: "#T Towns to cities#!\nThe plan upgrades a [ShowLocationRankName('town')] to a [ShowLocationRankName('city')] as soon as the game allows it. A city houses more people and supports more buildings than a town.\nFounding a town takes about a year, a city about two, and needs construction goods from the market: the plan waits until the market holds them. Nothing else is built in that location meanwhile, unless it has a second construction slot."
  PP_CPLANC_RIGHTS: "Urban rights"
  PP_CPLANC_RIGHTS_TT: "#T Urban rights#!\nWhile ticked, the plan grants the ticked [town_rights|e] once a month wherever a [location|e] qualifies and has room for one more, the most populous first, one grant a location a month. Every grant costs [political_influence|e] as usual. The plan does not upgrade a charter a location already holds into its stronger rights: do that yourself. A tile shows while your country may grant the right."
  PP_CPLANC_RIGHTS_ON: "Grant"
  PP_CPLANC_RIGHTS_LAST: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_country_rights_n')|0] granted last month"
  PP_CPLANC_KEEP_VALUE: "keep [GetPlayer.MakeScope.ScriptValue('pp_cplan_country_keep_influence')|0] political influence"
  PP_CPLANC_KEEP_TT: "#T Political influence to keep#!\nThe plan grants a right only while your [political_influence|e] stays at or above this after paying for it."
  PP_CPLANC_PUB_EARLY_COUNCIL_HALL: "[ShowBuildingTypeName('early_council_hall')|e]\nTicked: the plan builds one wherever it can stand and none stands yet. The plan builds its best version you can build.\n#weak Click to tick or untick#!"
