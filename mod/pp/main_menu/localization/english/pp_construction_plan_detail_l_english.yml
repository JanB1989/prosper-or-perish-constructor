  PP_CPLAN_D_OUTLOOK_3_PROFILES: "It lacks [GetPlayer.MakeScope.ScriptValue('pp_cplan_f_profiles_missing')|0]@gold! for all it wanted at its last look and gets [GetPlayer.MakeScope.ScriptValue('pp_cplan_f_profiles_rate')|1]@gold! a month at the current bars, so it pays for it all within a year. Its bar is about right: a fuller one builds sooner, a lower one leaves more for the other groups."
