l_english:
  # Construction Plan window (gui/pp_construction_plan.gui): player-only construction rules
  PP_CPLAN_OPEN: "Construction Plan"
  PP_CPLAN_OPEN_TT: "#T Construction Plan#!\nRules that queue buildings for you once a month: food, logistics, improvements and businesses for your whole country, and location profiles for single [locations|e]. Click to open or close."
  PP_CPLAN_TITLE: "Construction Plan"
  PP_CPLAN_TAB_PLAN: "Global Settings"
  PP_CPLAN_TAB_PLAN_TT: "Switch the plan on or off, the gold reserve, the rule groups and what the plan built last month"
  PP_CPLAN_TAB_PROFILES: "Location Profiles"
  PP_CPLAN_TAB_PROFILES_TT: "Profiles you give to [locations|e]: what the plan builds there"
  PP_CPLAN_ON: "On"
  PP_CPLAN_OFF: "Off"
  PP_CPLAN_PLUS: "+"
  PP_CPLAN_MINUS: "-"
  PP_CPLAN_SWITCH_TT: "Click to switch it on or off"
  PP_CPLAN_MASTER: "Run the plan every month"
  PP_CPLAN_MASTER_TT: "#T Construction Plan#!\nWhile on, the plan starts the constructions its rules call for once a month. They are ordinary constructions, paid from your treasury and shown in your construction queue. It never starts a second construction in a [location|e] that is already building, and never adds a level to a building that you or the game's automation closed. The AI never uses the plan."
  PP_CPLAN_RESERVE: "Gold reserve"
  PP_CPLAN_RESERVE_TT: "#T Gold reserve#!\nThe plan never spends your treasury below this. Each month it may spend the gold above it: every rule group that is on gets an equal part, and what one group leaves goes to the next."
  PP_CPLAN_RESERVE_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_gold')|0]@gold!"
  PP_CPLAN_RESERVE_STEP_TT: "Click to change the reserve a little, right-click to change it ten times as much"
  PP_CPLAN_RULES: "Rule groups"
  PP_CPLAN_FOOD_RULE: "Food, per province"
  PP_CPLAN_FOOD_RULE_TT: "#T Food#!\nOne construction a month in each [province|e], the first of these that can be built. A year from now means the store a normal year would leave: this year's harvest and the spoiling food are taken out.\n• a year from now close to empty: a [ShowBuildingTypeName('tavern')|e] level, where its market holds victuals\n• a year from now short: a level of the farm, orchard, fishery, herd or forest village that pays back fastest here\n• a [ShowBuildingTypeName('granary')|e] level while the store has little room, is nearly full and still grows\n• a [ShowBuildingTypeName('cookshop')|e] or [ShowBuildingTypeName('public_kitchen')|e] level whenever it can be built\n• short and no farm possible: a [ShowBuildingTypeName('tavern')|e] level\n• a [ShowBuildingTypeName('grange')|e] level where the store holds two years of food and still grows\n• a [ShowBuildingTypeName('victualling_yard')|e] level while it pays back"
  PP_CPLAN_LOGISTICS_RULE: "Logistics, per location"
  PP_CPLAN_LOGISTICS_RULE_TT: "#T Logistics#!\nWhere a [location|e]'s [market_access|e] is below this line while you control it, the plan adds a level of the logistics building that location can have. Short-lived event effects on market access are taken out first."
  PP_CPLAN_ACCESS_VALUE: "below [GetPlayer.MakeScope.ScriptValue('pp_cplan_access_pct')|0]% access"
  PP_CPLAN_IMPROVE_RULE: "Improvements, per location"
  PP_CPLAN_IMPROVE_RULE_TT: "#T Improvements#!\nWhere a [location|e]'s population reaches this share of its [population_capacity|e], the plan adds a level of the improvement that adds the most capacity for its price there. A hundred percent means as many people as capacity; above that only crowded locations get one. The fullest locations come first."
  PP_CPLAN_IMPROVE_LINE_VALUE: "from [GetPlayer.MakeScope.ScriptValue('pp_cplan_improve_pct')|0]% of capacity"
  PP_CPLAN_BUSINESS_RULE: "Businesses"
  PP_CPLAN_BUSINESS_RULE_TT: "#T Businesses#!\nAny building that makes goods: the plan adds a level wherever that level pays back its build cost within this many years, the quickest payback first across all your [locations|e]. Payback: the gold the level costs there over what one level earns there each month, from the best recipe of each of its production slots at the market's prices and that location's output, with this year's harvest taken out. A [location|e] profile that names a good or a building category keeps it for itself, and a profile can keep businesses out of its locations."
  PP_CPLAN_BUSINESS_LINE_VALUE: "pays back within [GetPlayer.MakeScope.ScriptValue('pp_cplan_business_years')|0] years"
  PP_CPLAN_LAST: "Last month"
  PP_CPLAN_LAST_SUMMARY: "Started [GetPlayer.MakeScope.ScriptValue('pp_cplan_started_n')|0] constructions for [GetPlayer.MakeScope.ScriptValue('pp_cplan_spent_n')|0]@gold!"
  PP_CPLAN_IN_LOCATION: "in [Scope.GetLocation.GetName]"
  PP_CPLAN_WHY_FOOD: "#weak (food)#!"
  PP_CPLAN_WHY_LOGISTICS: "#weak (logistics)#!"
  PP_CPLAN_WHY_BUSINESS: "#weak (business)#!"
  PP_CPLAN_WHY_PROFILE: "#weak (location profile)#!"
  PP_CPLAN_WHY_IMPROVE: "#weak (improvement)#!"
  # test runs only (pp_cplan_ai_test): marker lines the plan writes to debug.log (static: debug_log has no data
  # context), read by ppc plan-report; not shown to players
  PP_CPLAN_TLOG_101: "PPCPLAN;B;food"
  PP_CPLAN_TLOG_102: "PPCPLAN;B;logistics"
  PP_CPLAN_TLOG_103: "PPCPLAN;B;business"
  PP_CPLAN_TLOG_105: "PPCPLAN;B;profile"
  PP_CPLAN_TLOG_106: "PPCPLAN;B;improve"
  PP_CPLAN_TLOG_PASS: "PPCPLAN;P"
