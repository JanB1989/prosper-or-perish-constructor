l_english:
  # Construction Plan panel (gui/pp_construction_plan.gui): player-only construction rules
  PP_CPLAN_OPEN: "Construction Plan"
  PP_CPLAN_OPEN_TT: "#T Construction Plan#!\nRules that queue buildings for you once a month: food for your provinces, logistics where market access falls, goods you want stocked. Click to open or close."
  PP_CPLAN_TITLE: "Construction Plan"
  PP_CPLAN_TAB_PLAN: "Plan"
  PP_CPLAN_TAB_FOOD: "Food"
  PP_CPLAN_TAB_GOODS: "Goods"
  PP_CPLAN_TAB_LOGISTICS: "Logistics"
  PP_CPLAN_ON: "On"
  PP_CPLAN_OFF: "Off"
  PP_CPLAN_PLUS: "+"
  PP_CPLAN_MINUS: "-"
  PP_CPLAN_MASTER: "Run the plan every month"
  PP_CPLAN_MASTER_TT: "#T Construction Plan#!\nWhile on, the plan starts the constructions its rules call for once a month. They are ordinary constructions, paid from your treasury and shown in your construction queue. The AI never uses the plan."
  PP_CPLAN_RESERVE: "Gold reserve"
  PP_CPLAN_RESERVE_TT: "#T Gold reserve#!\nThe plan starts nothing while your gold is at or below this many months of your total monthly income."
  PP_CPLAN_RESERVE_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_months')|0] months of income ([GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_gold_n')|0]@gold!)"
  PP_CPLAN_MAX: "Most new constructions a month"
  PP_CPLAN_MAX_TT: "#T Monthly limit#!\nThe plan starts at most this many constructions in one month, whatever its rules ask for."
  PP_CPLAN_RULES: "Rule groups"
  PP_CPLAN_FOOD_RULE: "Food, per province"
  PP_CPLAN_FOOD_RULE_TT: "#T Food#!\nEach rule group that runs gets an equal share of the monthly limit; a share it leaves unused passes on to the next group.\n\nKeeps each province's stored food inside the band of its focus (Food tab). Below the band the plan adds a farm level where arable land is left, else a kitchen or a tavern level in the province capital. A full store that holds less than two years gets a granary level."
  PP_CPLAN_LOGISTICS_RULE: "Logistics, per location"
  PP_CPLAN_LOGISTICS_RULE_TT: "#T Logistics#!\nWhere a location's [market_access|e] is below your line (Logistics tab), the plan adds a level of the logistics building that location can have."
  PP_CPLAN_GOODS_RULE: "Goods, per good"
  PP_CPLAN_GOODS_RULE_TT: "#T Goods#!\nFor each good you set in the Goods tab: keep it stocked in your markets, or grow the producers of it that earn."
  PP_CPLAN_LAST: "Last month"
  PP_CPLAN_LAST_SUMMARY: "Started [GetPlayer.MakeScope.ScriptValue('pp_cplan_started_n')|0] constructions for [GetPlayer.MakeScope.ScriptValue('pp_cplan_spent_n')|0]@gold!"
  PP_CPLAN_IN_LOCATION: "in [Scope.GetLocation.GetName]"
  PP_CPLAN_WHY_FOOD: "#weak (food rule)#!"
  PP_CPLAN_WHY_LOGISTICS: "#weak (logistics rule)#!"
  PP_CPLAN_WHY_GOODS: "#weak (goods rule)#!"
  PP_CPLAN_FOOD_NOTE: "Each province keeps its stored food inside its band: the plan builds below it and stops above it. Click the focus to change it; the arrows set your own band."
  PP_CPLAN_FOCUS_TT: "#T Focus#!\nStandard, Breadbasket, Market Town and Workshop each have their own band of stored food. Hands Off: the plan builds nothing for food here. Custom: your own band. Click for the next one."
  PP_CPLAN_FOCUS_STANDARD: "Standard"
  PP_CPLAN_FOCUS_BREADBASKET: "Breadbasket"
  PP_CPLAN_FOCUS_MARKET_TOWN: "Market Town"
  PP_CPLAN_FOCUS_WORKSHOP: "Workshop"
  PP_CPLAN_FOCUS_HANDS_OFF: "Hands Off"
  PP_CPLAN_FOCUS_CUSTOM: "Custom"
  PP_CPLAN_STORED_TT: "Stored food of the province, out of two years"
  PP_CPLAN_STORED_VALUE: "[Province.MakeScope.ScriptValue('pp_cplan_stored_n')|1] months"
  PP_CPLAN_BAND_BELOW: "Build below"
  PP_CPLAN_BAND_ABOVE: "stop above"
  PP_CPLAN_ST_0: "#weak Waiting for the first monthly pass#!"
  PP_CPLAN_ST_1: "#G Building:#!"
  PP_CPLAN_ST_2: "#R Below the band, but nothing can be built here now#!"
  PP_CPLAN_ST_3: "In the band"
  PP_CPLAN_ST_4: "Above the band"
  PP_CPLAN_ST_5: "#weak Hands off#!"
  PP_CPLAN_ST_7: "#Y Held back: gold reserve or monthly limit reached#!"
  PP_CPLAN_ST_8: "#weak Stored food not counted yet#!"
  PP_CPLAN_ST_9: "#Y Store full, but no granary can be built#!"
  PP_CPLAN_KEEP: "Keep stocked line"
  PP_CPLAN_KEEP_TT: "#T Keep stocked#!\nA good set to Keep gets a new producer level while the market holds fewer months of its demand than this."
  PP_CPLAN_KEEP_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_keep_months')|0] months"
  PP_CPLAN_GOODS_NOTE: "Months: the stock in your capital's market, in months of its demand. Keep: build while a market of yours is short. Expand: add levels where a producer of it earns. Never: the plan never builds it, farms included."
  PP_CPLAN_GOOD_MONTHS_TT: "Stock in your capital's market, in months of its demand"
  PP_CPLAN_MODE_OFF: "Off"
  PP_CPLAN_MODE_KEEP: "Keep"
  PP_CPLAN_MODE_EXPAND: "Expand"
  PP_CPLAN_MODE_NEVER: "Never"
  PP_CPLAN_MODE_OFF_TT: "The goods rule leaves this good alone."
  PP_CPLAN_MODE_KEEP_TT: "Keep stocked: a new level of a producer where one of your markets holds less than your line."
  PP_CPLAN_MODE_EXPAND_TT: "Expand while profitable: one more level where a producer of it already earns."
  PP_CPLAN_MODE_NEVER_TT: "Never: no rule of the plan builds a producer of this good."
  PP_CPLAN_ACCESS: "Logistics line"
  PP_CPLAN_ACCESS_TT: "#T Logistics line#!\nThe plan adds logistics where a location's [market_access|e] is below this. The buildings' own conditions still apply."
  PP_CPLAN_ACCESS_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_access_pct')|0]%"
  PP_CPLAN_LOGISTICS_NOTE: "Your locations below full market access. Logistics: follow the plan's line, always build here, or never. Plan: Hands Off keeps every rule of the plan out of this location."
  PP_CPLAN_ACCESS_HERE: "[Location.MakeScope.ScriptValue('pp_cplan_access_here')|0]%"
  PP_CPLAN_ACCESS_HERE_TT: "[market_access|E] of this location"
  PP_CPLAN_LOGI_TT: "#T Logistics here#!\nFollow Plan: build while market access is below your line. Always: build whenever the building allows it. Never: no logistics from the plan here. Click for the next one."
  PP_CPLAN_FOLLOW: "Follow Plan"
  PP_CPLAN_ALWAYS: "Always"
  PP_CPLAN_NEVER: "Never"
  PP_CPLAN_HERE_TT: "#T The plan here#!\nHands Off: no rule of the plan builds in this location. Click to switch."
  PP_CPLAN_HERE_ON: "Plan builds"
  PP_CPLAN_HERE_OFF: "Hands Off"
  PP_CPLAN_STEP_TT: "Change by one step"
  PP_CPLAN_SWITCH_TT: "Click to switch it on or off"
  PP_CPLAN_TAB_PLAN_TT: "Switch the plan on or off, its budget, and what it built last month"
  PP_CPLAN_TAB_FOOD_TT: "The food rule of each of your provinces"
  PP_CPLAN_TAB_GOODS_TT: "What the plan does for each good"
  PP_CPLAN_TAB_LOGISTICS_TT: "The logistics line and your locations below full market access"
  PP_CPLAN_MODE_OFF_ON: "• Off"
  PP_CPLAN_MODE_KEEP_ON: "• Keep"
  PP_CPLAN_MODE_EXPAND_ON: "• Expand"
  PP_CPLAN_MODE_NEVER_ON: "• Never"
