l_english:
  # Construction Plan window (gui/pp_construction_plan.gui): player-only construction rules
  PP_CPLAN_OPEN: "Construction Plan"
  PP_CPLAN_OPEN_TT: "#T Construction Plan#!\nRules that queue buildings for you once a month: food, logistics, improvements, businesses, towns and buildings for your whole country, and profiles and marks for single [locations|e]. Click to open or close."
  PP_CPLAN_TITLE: "Construction Plan"
  PP_CPLAN_TAB_PLAN: "Global Settings"
  PP_CPLAN_TAB_PLAN_TT: "Switch the plan on or off, the gold reserve, the rule groups and what the plan built last month"
  PP_CPLAN_TAB_PROFILES: "Location Profiles"
  PP_CPLAN_TAB_PROFILES_TT: "Profiles you give to [locations|e]: what the plan builds there"
  PP_CPLAN_TAB_COUNTRY: "Towns and Buildings"
  PP_CPLAN_TAB_COUNTRY_TT: "What the Towns and Buildings rule group builds"
  PP_CPLAN_ON: "On"
  PP_CPLAN_OFF: "Off"
  PP_CPLAN_PLUS: "+"
  PP_CPLAN_MINUS: "-"
  PP_CPLAN_SWITCH_TT: "Click to switch it on or off"
  PP_CPLAN_MASTER: "Run the plan every month"
  PP_CPLAN_MASTER_TT: "#T Construction Plan#!\nWhile on, the plan starts the constructions its rules call for once a month. They are ordinary constructions, paid from your treasury and shown in your construction queue. It never starts a second construction in a [location|e] that is already building, and never adds a level to a building that you or the game's automation closed. The AI never uses the plan."
  PP_CPLAN_RESERVE: "Gold reserve"
  PP_CPLAN_RESERVE_TT: "#T Gold reserve#!\nThe plan never spends your treasury below this. The gold above it is shared among the rule groups by their bars, and each group saves its share until it can pay for what it wants next."
  PP_CPLAN_RESERVE_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_gold')|0]@gold!"
  PP_CPLAN_RESERVE_STEP_TT: "Click to change the reserve a little, right-click to change it ten times as much"
  PP_CPLAN_RULES: "Rule groups"
  PP_CPLAN_SHARE_HEAD: "Share of the gold coming in, and saved"
  PP_CPLAN_SHARE_TT: "#T Share#!\nEach rule group's part of the gold that comes in above your reserve: its bar over all the bars together. Full bars everywhere share it equally; an empty bar switches the group off, and what it had saved goes back to be shared."
  PP_CPLAN_PURSE_TT: "#T Saved#!\nThe gold this rule group has saved. $PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_BUDGET_NOTE: "Each month this group gets its share of the gold above your reserve and keeps it. It builds what matters most first and saves for what it cannot pay for yet; what it does not need it hands on to the groups that are saving."
  PP_CPLAN_WEIGHT_TT: "Click the bar to set this rule group's weight, or use - and +. Empty: the group is off."
  PP_CPLAN_PROFILES_RULE: "Locations"
  PP_CPLAN_PROFILES_RULE_TT: "#T Locations#!\nWhat you set for single [locations|e]: the rules of the profiles you gave them (the Location Profiles tab), then what you marked there (Also build here, in the location window). A profile's rules build first in their locations; the other rule groups still build there what a profile does not set, and marks only add to it. This group takes a part of the gold only while a location has a profile or a mark.\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_FOOD_RULE: "Food"
  PP_CPLAN_FOOD_RULE_TT: "#T Food, per province#!\nOne construction a month in each [province|e], the first of these that can be built, the hungriest provinces first. A year from now means the store a normal year would leave: this year's harvest and the spoiling food are taken out.\n• a year from now close to empty: a [ShowBuildingTypeName('tavern')|e] level, where its market holds victuals\n• a year from now short: a level of the farm, orchard, fishery, herd or forest village that pays back fastest here\n• a [ShowBuildingTypeName('granary')|e] level while the store has little room, is nearly full and still grows\n• a [ShowBuildingTypeName('cookshop')|e] or [ShowBuildingTypeName('public_kitchen')|e] level whenever it can be built\n• short and no farm possible: a [ShowBuildingTypeName('tavern')|e] level\n• a [ShowBuildingTypeName('grange')|e] level where the store holds two years of food and still grows\n• a [ShowBuildingTypeName('victualling_yard')|e] level while it pays back\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_LOGISTICS_RULE: "Logistics"
  PP_CPLAN_LOGISTICS_RULE_TT: "#T Logistics, per location#!\nWhere a [location|e]'s [market_access|e] is below this line while you control it, the plan adds a level of the logistics building that location can have. Short-lived event effects on market access are taken out first. The most urgent locations come first.\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_ACCESS_VALUE: "below [GetPlayer.MakeScope.ScriptValue('pp_cplan_access_pct')|0]% access"
  PP_CPLAN_IMPROVE_RULE: "Improvements"
  PP_CPLAN_IMPROVE_RULE_TT: "#T Improvements, per location#!\nWhere a [location|e]'s population reaches this share of its [population_capacity|e], the plan adds a level of the improvement that adds the most capacity for its price there. A hundred percent means as many people as capacity; above that only crowded locations get one. The fullest locations come first.\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_IMPROVE_LINE_VALUE: "from [GetPlayer.MakeScope.ScriptValue('pp_cplan_improve_pct')|0]% of capacity"
  PP_CPLAN_BUSINESS_RULE: "Businesses"
  PP_CPLAN_BUSINESS_RULE_TT: "#T Businesses#!\nAny building that makes goods: the plan adds a level wherever that level pays back its build cost within this many years. It builds what pays back soonest, counting the time it must save for it. It does not flood a [market|e]: a level starts only while what is already being built of its good there stays a small part of what that market asks for. Payback: the gold the level costs there over what one level earns there each month, from the best recipe of each of its production slots at the market's prices and that location's output, with this year's harvest taken out. Only where a level finds its workers: idle peasants the buildings there do not already need (they are promoted into any class), or idle pops of the building's own class. A [location|e] profile that names a good or a building category keeps it for itself, and a profile can keep businesses out of its locations.\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_BUSINESS_LINE_VALUE: "pays back within [GetPlayer.MakeScope.ScriptValue('pp_cplan_business_years')|0] years"
  PP_CPLAN_COUNTRY_RULE: "Towns and Buildings"
  PP_CPLAN_COUNTRY_RULE_TT: "#T Towns and Buildings#!\nWhat this rule group builds is set on the Towns and Buildings tab. It takes a part of the gold only while a building is ticked or an upgrade is switched on there.\n\n$PP_CPLAN_BUDGET_NOTE$"
  PP_CPLAN_LAST: "Last month"
  PP_CPLAN_LAST_SUMMARY: "Started [GetPlayer.MakeScope.ScriptValue('pp_cplan_started_n')|0] constructions for [GetPlayer.MakeScope.ScriptValue('pp_cplan_spent_n')|0]@gold!"
  PP_CPLAN_IN_LOCATION: "in [Scope.GetLocation.GetName]"
  PP_CPLAN_WHY_FOOD: "#weak (food)#!"
  PP_CPLAN_WHY_LOGISTICS: "#weak (logistics)#!"
  PP_CPLAN_WHY_BUSINESS: "#weak (business)#!"
  PP_CPLAN_WHY_PROFILE: "#weak (location)#!"
  PP_CPLAN_WHY_IMPROVE: "#weak (improvement)#!"
  PP_CPLAN_WHY_COUNTRY: "#weak (towns and buildings)#!"
  PP_CPLAN_RANK_UPGRADE: "Upgrade to a higher [location_rank|e]"
  # test runs only (pp_cplan_ai_test): marker lines the plan writes to debug.log (static: debug_log has no data
  # context), read by ppc plan-report; not shown to players
  PP_CPLAN_TLOG_101: "PPCPLAN;B;food"
  PP_CPLAN_TLOG_102: "PPCPLAN;B;logistics"
  PP_CPLAN_TLOG_103: "PPCPLAN;B;business"
  PP_CPLAN_TLOG_105: "PPCPLAN;B;profile"
  PP_CPLAN_TLOG_106: "PPCPLAN;B;improve"
  PP_CPLAN_TLOG_107: "PPCPLAN;B;country"
  PP_CPLAN_TLOG_PASS: "PPCPLAN;P"
