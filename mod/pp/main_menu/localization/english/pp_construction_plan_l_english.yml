l_english:
  # Construction Plan panel (gui/pp_construction_plan*.gui): player-only construction rules
  PP_CPLAN_OPEN: "Construction Plan"
  PP_CPLAN_OPEN_TT: "#T Construction Plan#!\nRules that queue buildings for you once a month: the plan's rules for food, logistics and goods, and your own rules for single [locations|e]. Click to open or close."
  PP_CPLAN_TITLE: "Construction Plan"
  PP_CPLAN_TAB_PLAN: "Plan"
  PP_CPLAN_TAB_FOOD: "Food"
  PP_CPLAN_TAB_GOODS: "Goods"
  PP_CPLAN_TAB_LOGISTICS: "Logistics"
  PP_CPLAN_TAB_LOCATIONS: "Locations"
  PP_CPLAN_TAB_HERE: "Here"
  PP_CPLAN_ON: "On"
  PP_CPLAN_OFF: "Off"
  PP_CPLAN_PLUS: "+"
  PP_CPLAN_MINUS: "-"
  PP_CPLAN_PLUS_BIG: "++"
  PP_CPLAN_MINUS_BIG: "--"
  PP_CPLAN_PREV: "<"
  PP_CPLAN_NEXT: ">"
  PP_CPLAN_MASTER: "Run the plan every month"
  PP_CPLAN_MASTER_TT: "#T Construction Plan#!\nWhile on, the plan starts the constructions its rules call for once a month. They are ordinary constructions, paid from your treasury and shown in your construction queue. The AI never uses the plan."
  PP_CPLAN_RESERVE: "Gold reserve"
  PP_CPLAN_RESERVE_TT: "#T Gold reserve#!\nThe plan starts nothing while your gold is at or below this many months of your total monthly income."
  PP_CPLAN_RESERVE_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_months')|0] months of income ([GetPlayer.MakeScope.ScriptValue('pp_cplan_reserve_gold_n')|0]@gold!)"
  PP_CPLAN_MAX: "Most new constructions a month"
  PP_CPLAN_MAX_TT: "#T Monthly limit#!\nThe plan starts at most this many constructions in one month, whatever its rules ask for. Each rule group that runs gets an equal share; a share it leaves unused passes on to the next group."
  PP_CPLAN_RULES: "Rule groups"
  PP_CPLAN_OWN_RULE: "Own rules of single locations"
  PP_CPLAN_OWN_RULE_TT: "#T Own rules#!\nA [location|e] set to Own Rules (Locations or Here tab, or the cog in the location window) leaves the plan's rules below: the plan builds there only what its own list asks for. These rules run first each month."
  PP_CPLAN_OWN_COUNT: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_own_count')|0] locations"
  PP_CPLAN_FOOD_RULE: "Food, per province"
  PP_CPLAN_FOOD_RULE_TT: "#T Food#!\nKeeps each [province|e]'s stored food inside the band of its focus (Food tab). Below the band the plan adds a farm level where arable land is left, else a [ShowBuildingTypeName('cookshop')|e] or a [ShowBuildingTypeName('tavern')|e] level in the province capital. A full store that holds less than two years gets a [ShowBuildingTypeName('granary')|e] level."
  PP_CPLAN_LOGISTICS_RULE: "Logistics, per location"
  PP_CPLAN_LOGISTICS_RULE_TT: "#T Logistics#!\nWhere a location's [market_access|e] is below your line (Logistics tab), the plan adds a level of the logistics building that location can have."
  PP_CPLAN_GOODS_RULE: "Goods, per good"
  PP_CPLAN_GOODS_RULE_TT: "#T Goods#!\nFor each good you set in the Goods tab: keep it stocked in your markets, or grow its producers while a new level pays back within your payback line."
  PP_CPLAN_PROFILES: "Profiles"
  PP_CPLAN_PROFILES_TT: "#T Profiles#!\nSave the plan's settings (reserve, limit, logistics line, stock line, payback line, which rule groups run and every good's mode) and load them again later. Province focuses and location rules are not part of a profile."
  PP_CPLAN_PROFILE: "Profile"
  PP_CPLAN_PROFILE_LOADED: "#weak Profile [GetPlayer.MakeScope.ScriptValue('pp_cplan_profile_n')|0] loaded#!"
  PP_CPLAN_SAVED: "#G saved#!"
  PP_CPLAN_EMPTY_SLOT: "#weak empty#!"
  PP_CPLAN_SAVE: "Save"
  PP_CPLAN_LOAD: "Load"
  PP_CPLAN_APPLY: "Apply"
  PP_CPLAN_PROVINCE: "Province"
  PP_CPLAN_PROFILE_SAVE_TT: "Save the current settings in this profile (it replaces what the profile held)"
  PP_CPLAN_PROFILE_LOAD_TT: "Load this profile: the settings, rule groups and goods modes it holds replace the current ones"
  PP_CPLAN_LAST: "Last month"
  PP_CPLAN_LAST_SUMMARY: "Started [GetPlayer.MakeScope.ScriptValue('pp_cplan_started_n')|0] constructions for [GetPlayer.MakeScope.ScriptValue('pp_cplan_spent_n')|0]@gold!"
  PP_CPLAN_IN_LOCATION: "in [Scope.GetLocation.GetName]"
  PP_CPLAN_WHY_FOOD: "#weak (food rule)#!"
  PP_CPLAN_WHY_LOGISTICS: "#weak (logistics rule)#!"
  PP_CPLAN_WHY_GOODS: "#weak (goods rule)#!"
  PP_CPLAN_WHY_RULE: "#weak (own rule of the location)#!"
  PP_CPLAN_WHY_PROFILE: "#weak (location profile)#!"
  PP_CPLAN_FOOD_NOTE: "Each province keeps its stored food inside its band: the plan builds below it and stops above it. Click the focus to change it; the arrows set your own band. Locations with own rules are left out."
  PP_CPLAN_FOCUS_TT: "#T Focus#!\nStandard, Breadbasket, Market Town and Workshop each have their own band of stored food. Hands Off: the plan builds nothing for food here. Custom: your own band. Click for the next one."
  PP_CPLAN_FOCUS_STANDARD: "Standard"
  PP_CPLAN_FOCUS_BREADBASKET: "Breadbasket"
  PP_CPLAN_FOCUS_MARKET_TOWN: "Market Town"
  PP_CPLAN_FOCUS_WORKSHOP: "Workshop"
  PP_CPLAN_FOCUS_HANDS_OFF: "Hands Off"
  PP_CPLAN_FOCUS_CUSTOM: "Custom"
  PP_CPLAN_STORED_TT: "Stored food of the province, out of two years"
  PP_CPLAN_STORED_VALUE: "[Province.MakeScope.ScriptValue('pp_cplan_stored_n')|1] months"
  PP_CPLAN_BAND_BELOW: "Build below"
  PP_CPLAN_BAND_ABOVE: "stop above"
  PP_CPLAN_ST_0: "#weak Waiting for the first monthly pass#!"
  PP_CPLAN_ST_1: "#G Building:#!"
  PP_CPLAN_ST_2: "#R Below the band, but nothing can be built here now#!"
  PP_CPLAN_ST_3: "In the band"
  PP_CPLAN_ST_4: "Above the band"
  PP_CPLAN_ST_5: "#weak Hands off#!"
  PP_CPLAN_ST_7: "#Y Held back: gold reserve or monthly limit reached#!"
  PP_CPLAN_ST_8: "#weak Stored food not counted yet#!"
  PP_CPLAN_ST_9: "#Y Store full, but no granary can be built#!"
  PP_CPLAN_ST_10: "Waiting: a food building is under construction here"
  PP_CPLAN_KEEP: "Keep stocked line"
  PP_CPLAN_KEEP_TT: "#T Keep stocked#!\nA good set to Keep gets a new producer level while the market holds fewer months of its demand than this."
  PP_CPLAN_KEEP_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_keep_months')|0] months"
  PP_CPLAN_PAYBACK_LINE: "Payback line"
  PP_CPLAN_PAYBACK_LINE_TT: "#T Payback line#!\nA good set to Expand gets one more level of a producer that stands, where that level pays back its build cost within this many years. Payback = the gold the next level costs there (its own level, the construction goods' prices and your build efficiency count) over the profit one level of that building makes there each month."
  PP_CPLAN_PAYBACK_LINE_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_payback_line')|0] years"
  PP_CPLAN_GOODS_NOTE: "Months: the stock in your capital's market, in months of its demand. Keep: build while a market of yours is short. Expand: add levels where a producer of it pays back within the payback line. Never: the plan never builds it, farms included."
  PP_CPLAN_GOOD_MONTHS_TT: "Stock in your capital's market, in months of its demand"
  PP_CPLAN_MODE_OFF: "Off"
  PP_CPLAN_MODE_KEEP: "Keep"
  PP_CPLAN_MODE_EXPAND: "Expand"
  PP_CPLAN_MODE_NEVER: "Never"
  PP_CPLAN_MODE_OFF_TT: "The goods rule leaves this good alone."
  PP_CPLAN_MODE_KEEP_TT: "Keep stocked: a new level of a producer where one of your markets holds less than your line."
  PP_CPLAN_MODE_EXPAND_TT: "Expand: one more level where a producer of it stands and that level pays back within your payback line."
  PP_CPLAN_MODE_NEVER_TT: "Never: no rule of the plan builds a producer of this good."
  PP_CPLAN_MODE_OFF_ON: "• Off"
  PP_CPLAN_MODE_KEEP_ON: "• Keep"
  PP_CPLAN_MODE_EXPAND_ON: "• Expand"
  PP_CPLAN_MODE_NEVER_ON: "• Never"
  PP_CPLAN_ACCESS: "Logistics line"
  PP_CPLAN_ACCESS_TT: "#T Logistics line#!\nThe plan adds logistics where a location's [market_access|e] is below this. The buildings' own conditions still apply."
  PP_CPLAN_ACCESS_VALUE: "[GetPlayer.MakeScope.ScriptValue('pp_cplan_access_pct')|0]%"
  PP_CPLAN_LOGISTICS_NOTE: "Your locations below full market access. Logistics: follow the plan's line, always build here, or never. The second button is the location's mode: the plan's rules, its own rules, or hands off."
  PP_CPLAN_ACCESS_HERE: "[Location.MakeScope.ScriptValue('pp_cplan_access_here')|0]%"
  PP_CPLAN_ACCESS_HERE_TT: "[market_access|E] of this location"
  PP_CPLAN_LOGI_TT: "#T Logistics here#!\nFollow Plan: build while market access is below your line. Always: build whenever the building allows it. Never: no logistics from the plan here. Click for the next one."
  PP_CPLAN_FOLLOW: "Follow Plan"
  PP_CPLAN_ALWAYS: "Always"
  PP_CPLAN_NEVER: "Never"
  PP_CPLAN_STEP_TT: "Change by one step"
  PP_CPLAN_STEP_BIG_TT: "Change by ten steps"
  PP_CPLAN_SWITCH_TT: "Click to switch it on or off"
  PP_CPLAN_TAB_PLAN_TT: "Switch the plan on or off, its budget, the rule groups, profiles and what it built last month"
  PP_CPLAN_TAB_FOOD_TT: "The food rule of each of your provinces"
  PP_CPLAN_TAB_GOODS_TT: "What the plan does for each good"
  PP_CPLAN_TAB_LOGISTICS_TT: "The logistics line and your locations below full market access"
  PP_CPLAN_TAB_LOCATIONS_TT: "Every location of yours: its mode, the template it follows, and buttons to apply templates"
  PP_CPLAN_TAB_HERE_TT: "The own rules of one location (pick it in Locations, or with the cog in the location window)"
  # location modes
  PP_CPLAN_MODE_PLAN: "Plan's Rules"
  PP_CPLAN_MODE_OWN: "#G Own Rules#!"
  PP_CPLAN_MODE_HANDS_OFF: "#Y Hands Off#!"
  PP_CPLAN_MODE_HANDS_OFF_SHORT: "#Y Hands off#!"
  PP_CPLAN_LOCATION_MODE_TT: "#T The plan in this location#!\nPlan's Rules: the food, logistics and goods rules may build here.\nOwn Rules: only this location's own list (Here tab) builds here; the plan's rules leave it alone.\nHands Off: the plan builds nothing here.\nClick for the next one."
  PP_CPLAN_LOCATIONS_NOTE: "Click Edit to give a location its own rules. Numbered buttons apply a saved template (Here tab) to the location, or to every location of the province on the province's row."
  PP_CPLAN_WHOLE_PROVINCE: "Template for the whole province:"
  PP_CPLAN_TP_TT: "Apply the saved template with this number to every location of this province"
  PP_CPLAN_TQ_TT: "Apply the saved template with this number to this location"
  PP_CPLAN_TPL_TAG: "#weak template [Location.MakeScope.ScriptValue('pp_cplan_tpl_n')|0]#!"
  PP_CPLAN_TPL_TAG_TT: "This location follows the template with this number as it was applied (an edit since removes the tag)"
  PP_CPLAN_EDIT: "Edit"
  PP_CPLAN_EDIT_TT: "Show this location's own rules in the Here tab"
  PP_CPLAN_LOCATION_COG: "Construction Plan: this location's own rules"
  # Here tab
  PP_CPLAN_HERE_NONE: "No location picked yet. Click Edit on a location in the Locations tab, or the cog in a location window of yours."
  PP_CPLAN_GOTO: "Go to"
  PP_CPLAN_GOTO_TT: "Move the map to this location"
  PP_CPLAN_HERE_MODE_PLAN: "This location follows the plan's rules. Add a building below, or switch to Own Rules, to give it its own list instead."
  PP_CPLAN_HERE_MODE_OWN: "Own rules: the plan's food, logistics and goods rules leave this location alone. Each month the plan goes down this list and starts one level of each rule whose condition holds, while the budget lasts."
  PP_CPLAN_HERE_MODE_HANDS_OFF: "Hands off: the plan builds nothing in this location. The list below is kept for when you switch back."
  PP_CPLAN_HERE_RULES: "Rules"
  PP_CPLAN_HERE_RULES_TT: "#T Rules of this location#!\nBuild a building up to a level, one level at a time, when a condition holds and the next level pays back within your limit. Conditions read the same numbers as the game's location filters, plus stored food and arable land."
  PP_CPLAN_HERE_ADD: "Add a building"
  PP_CPLAN_HERE_ADD_TT: "The buildings that stand here and the ones you can build here. Payback: years the next level takes to pay back its build cost from the profit one level makes here each month."
  PP_CPLAN_REFRESH: "Refresh"
  PP_CPLAN_REFRESH_TT: "List the buildings again (after an advance or a construction)"
  PP_CPLAN_ADD: "Add"
  PP_CPLAN_ADD_TT: "A rule for this building: up to one level more than stands here, no condition, any payback. Change it in the rule above."
  PP_CPLAN_PAYBACK_YEARS: "pays back in [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), '(CFixedPoint)12'), Max_CFixedPoint(GetBuildingTypeProfitInLocation(BuildingType.Self, Location.Self), '(CFixedPoint)0.01'))|1] years"
  PP_CPLAN_PAYBACK_YEARS_STANDING: "pays back in [Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(Building.GetType.Self, Location.Self), '(CFixedPoint)12'), Max_CFixedPoint(Building.GetProfitPerLevel, '(CFixedPoint)0.01'))|1] years"
  PP_CPLAN_PAYS_BACK_IN: "pays back in"
  PP_CPLAN_PAYBACK_NONE: "#R no profit here#!"
  PP_CPLAN_PAYBACK_TT: "#T Payback#!\nThis building does not stand here yet: the game's estimate of what a first level would earn here. The gold it costs here over that monthly profit, in years."
  PP_CPLAN_PAYBACK_STANDING_TT: "#T Payback#!\nThe gold the next level costs here (its level, the construction goods' prices and your build efficiency count) over the profit one standing level makes here each month, in years. The plan decides on this number."
  PP_CPLAN_TEMPLATES: "Templates"
  PP_CPLAN_TEMPLATES_TT: "#T Templates#!\nSave this location's mode and rules under a number, then apply them to other locations here or in the Locations tab, one location or a whole province at a time. Applying replaces the location's rules."
  PP_CPLAN_TEMPLATE: "Template"
  PP_CPLAN_TEMPLATE_EMPTY: "#weak empty#!"
  PP_CPLAN_TEMPLATE_SAVE_TT: "Save this location's mode and rules as this template (it replaces what the template held)"
  PP_CPLAN_TEMPLATE_APPLY_TT: "Give this location the template's mode and rules"
  PP_CPLAN_TEMPLATE_PROVINCE_TT: "Give every location of this province the template's mode and rules"
  # rule rows (pp_construction_plan_here.gui)
  PP_CPLAN_RULE_EMPTY: "#weak Free rule: add a building below#!"
  PP_CPLAN_RULE_BUILD: "Build"
  PP_CPLAN_RULE_UP_TO: "up to level"
  PP_CPLAN_RULE_HAS: "#weak stands:#!"
  PP_CPLAN_RULE_HAS_TT: "Levels that stand here, at the plan's last look"
  PP_CPLAN_RULE_CLEAR: "Remove"
  PP_CPLAN_RULE_CLEAR_TT: "Remove this rule"
  PP_CPLAN_RULE_WHEN: "When"
  PP_CPLAN_METRIC_TT: "#T Condition#!\nWhat must hold in this location before the plan builds: Always, or one of the numbers the game's location filters use, plus stored food and arable land. Click or use the arrows for the next one; a new condition starts at its value here now."
  PP_CPLAN_CMP_TT: "At least: the condition holds at the threshold or above. Below: under the threshold. Click to switch."
  PP_CPLAN_AT_LEAST: "at least"
  PP_CPLAN_BELOW: "below"
  PP_CPLAN_NOW: "#weak now:#!"
  PP_CPLAN_RULE_NOW_TT: "The value in this location now"
  PP_CPLAN_RULE_PAYBACK: "Pays back within"
  PP_CPLAN_RULE_PAYBACK_TT: "#T Payback limit#!\nOnce the building stands, the plan adds a level only while that level pays back within this many years (its build cost here over the profit one level makes here each month). Any: no limit. The first level of a building that does not stand yet has no profit to measure and needs only the condition."
  PP_CPLAN_ANY: "any"
  PP_CPLAN_YEARS: "years"
  PP_CPLAN_RULE_ST_0: "#weak Not checked yet#!"
  PP_CPLAN_RULE_ST_1: "#G Started a level#!"
  PP_CPLAN_RULE_ST_2: "Waiting for the condition"
  PP_CPLAN_RULE_ST_3: "#G Done#!"
  PP_CPLAN_RULE_ST_4: "A level is under construction"
  PP_CPLAN_RULE_ST_5: "#Y Payback above the limit#!"
  PP_CPLAN_RULE_ST_6: "#R Cannot be built here now#!"
  PP_CPLAN_RULE_ST_7: "#Y Held back: gold reserve or monthly limit#!"
  PP_CPLAN_RULE_ST_8: "#Y Market lacks its construction goods#!"
  # conditions ([construction_plan] metrics), units as the panel shows them
  PP_CPLAN_M_ALWAYS: "Always"
  PP_CPLAN_M_POPULATION: "Population (k)"
  PP_CPLAN_M_PEASANTS: "Peasants (k)"
  PP_CPLAN_M_IDLE_PEASANTS: "Idle peasants (k)"
  PP_CPLAN_M_IDLE_LABORERS: "Idle laborers (k)"
  PP_CPLAN_M_EMPLOYMENT: "Employment %"
  PP_CPLAN_M_MARKET_ACCESS: "Market access %"
  PP_CPLAN_M_CONTROL: "Control %"
  PP_CPLAN_M_PROXIMITY: "Proximity"
  PP_CPLAN_M_DEVELOPMENT: "Development"
  PP_CPLAN_M_PROSPERITY: "Prosperity %"
  PP_CPLAN_M_STORED_FOOD: "Stored food (months)"
  PP_CPLAN_M_ARABLE_LAND: "Arable land left (k)"
  PP_CPLAN_M_BUILDING_LEVELS: "Building levels"
  PP_CPLAN_M_TAX_BASE: "Tax base"
  PP_CPLAN_M_RGO_PROFIT: "Raw goods profit"
  PP_CPLAN_M_LITERACY: "Literacy %"
  PP_CPLAN_M_COASTAL: "Coast (1 = yes)"
  PP_CPLAN_M_RIVER: "River (1 = yes)"
