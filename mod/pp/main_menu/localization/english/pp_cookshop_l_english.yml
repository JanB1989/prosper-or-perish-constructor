l_english:

# >>> eu5-building-pipeline:cookshop:localization
  cookshop: "Cookshop"
  pp_cookshop_price: "[ShowBuildingTypeName('cookshop')|e] Price"
  cookshop_desc: "A street kitchen at the [province_capital|e] that cooks the farms' produce into hot meals; the more [Concept('pp_staple_foods', 'staple food')|e] farms and [ShowBuildingTypeName('victualling_yard')|e] levels the province has, the more levels its kitchens can have. It is almost always worth building: it adds food and makes the province's food consumption more efficient."
  cookshop_slot_0: "Main Dish"
  cookshop_slot_1: "Drink"
  pp_cookshop_beer: "Beer"
  pp_cookshop_beer_desc: "Ale and beer are sold by the mug with the meal. Where the water was doubtful, weak beer was the everyday drink of young and old."
  pp_cookshop_boreal_hunter_stew_serve: "Serve Boreal Hunter's Stew"
  pp_cookshop_boreal_hunter_stew_serve_desc: "Elk, deer or hare are stewed with grain and salt, the plain fare of the northern forests. There game was easier to find than good farmland."
  pp_cookshop_camel_stew_serve: "Serve Camel Stew"
  pp_cookshop_camel_stew_serve_desc: "Old camels that can no longer carry a load end up in the cook's pot, stewed slowly with salt until the tough meat gives. Desert towns from Arabia to the Sahel ate them this way."
  pp_cookshop_chocolate: "Chocolate"
  pp_cookshop_chocolate_desc: "Cocoa is ground with water and spices and whipped to a froth. It was the drink of the Mexica nobility, and Spain carried it home and made it the fashion."
  pp_cookshop_coffee: "Coffee"
  pp_cookshop_coffee_desc: "The cookshop brews coffee in a pot over the coals and sells it by the cup. Coffee houses spread from Yemen and Cairo through the Ottoman lands and on to Europe."
  pp_cookshop_fish_congee_serve: "Serve Fish Congee"
  pp_cookshop_fish_congee_serve_desc: "Rice is simmered for hours until it falls apart into a thin porridge, and slivers of fish are stirred in at the end. Congee stretches a little rice a long way."
  pp_cookshop_honey_gruel_serve: "Serve Honeyed Gruel"
  pp_cookshop_honey_gruel_serve_desc: "Wheat is boiled soft in water or milk, sweetened with honey and stirred with dried fruit. It is a cheap, warming breakfast for anyone up before dawn."
  pp_cookshop_ika_mata_serve: "Serve Ika Mata"
  pp_cookshop_ika_mata_serve_desc: "Raw fish is cut small, cured in sharp fruit juice and dressed with coconut cream, as the islanders of the Pacific prepare it. The dish needs no fire, only a fresh catch."
  pp_cookshop_kheer_serve: "Serve Kheer"
  pp_cookshop_kheer_serve_desc: "Rice is cooked slowly in milk with sugar until it turns thick and sweet. South Asian cooks have served kheer at feasts and festivals for centuries."
  pp_cookshop_khong_bah_png_serve: "Serve Khong Bah Png"
  pp_cookshop_khong_bah_png_serve_desc: "Pork belly is braised slowly in soy and sugar until dark and soft, then served over a bowl of rice. Hokkien cooks of southern China made it a staple of the street."
  pp_cookshop_khichdi_serve: "Serve Khichdi"
  pp_cookshop_khichdi_serve_desc: "Rice and lentils are cooked together with a little pepper and butter into a soft, filling dish. Ibn Battuta found khichdi eaten for breakfast all over India."
  pp_cookshop_labskaus_serve: "Serve Labskaus"
  pp_cookshop_labskaus_serve_desc: "Salt beef and fish are chopped with potatoes into a coarse hash, the sailors' dish of the North Sea ports. It makes good use of ship's meat too hard to eat alone."
  pp_cookshop_liquor: "Liquor"
  pp_cookshop_liquor_desc: "A small glass of spirits is poured beside the meal, cheap and strong. It is a favourite of carters, porters and labourers at the end of the day."
  pp_cookshop_livestock_pottage_serve: "Serve Commoners Stew"
  pp_cookshop_livestock_pottage_serve_desc: "A pot of grain, peas and scraps of meat that never quite empties is topped up through the day. Such pottage fed most of the common folk of Europe for centuries."
  pp_cookshop_meat_tajine_serve: "Serve Tajine"
  pp_cookshop_meat_tajine_serve_desc: "Meat is stewed slowly with dried fruit and a pinch of saffron in a covered clay pot. The cooks of the Maghreb sell it straight from the pot to passers-by."
  pp_cookshop_mediterranean_fish_serve: "Serve Bouillabaisse"
  pp_cookshop_mediterranean_fish_serve_desc: "The fishermen of Marseille boiled the bony rockfish nobody would buy with olive oil, herbs and a splash of wine. The cookshop sells the same stew to the harbour crowd."
  pp_cookshop_mutton_and_pease_serve: "Serve Mutton and Pease"
  pp_cookshop_mutton_and_pease_serve_desc: "Salted mutton is boiled with dried peas until the peas turn to a thick mash. Sheep country ate its old ewes this way, with bread and a little salt."
  pp_cookshop_pemmican_serve: "Serve Pemmican"
  pp_cookshop_pemmican_serve_desc: "Dried game is pounded to powder, mixed with melted fat and berries and pressed into cakes. Pemmican, the travel food of the northern plains, keeps for months and feeds a hunter on the move."
  pp_cookshop_pozole_serve: "Serve Pozole"
  pp_cookshop_pozole_serve_desc: "The cooks soak maize in lime water until the kernels burst, then simmer the hominy with game and chili into pozole. The stew is an old Mesoamerican dish, sold here by the bowl."
  pp_cookshop_saltfish_porridge_serve: "Serve Saltfish Porridge"
  pp_cookshop_saltfish_porridge_serve_desc: "Salt fish is soaked, flaked and cooked into a grain porridge. Coastal people stretched a dried catch this way through the lean months before the next season."
  pp_cookshop_surstromming_serve: "Serve Surstroemming"
  pp_cookshop_surstromming_serve_desc: "Baltic herring is salted lightly and left to ferment in barrels until it sours. The strong-smelling fish is eaten with flatbread, and a little salt preserves a lot of herring."
  pp_cookshop_tea: "Tea"
  pp_cookshop_tea_desc: "Tea is steeped in pots and sold by the bowl with the meal. It was the everyday drink of China and Japan, and later of the towns of Russia and Britain."
  pp_cookshop_well_water: "Well Water"
  pp_cookshop_well_water_desc: "No drink is bought, the cookshop serves water drawn from the well."
  pp_cookshop_wine: "Wine"
  pp_cookshop_wine_desc: "Cheap wine, often watered, is poured by the jug with the meal, as in the taverns and cookshops of the Mediterranean towns. A rough local vintage costs little where vines grow close by."
# <<< eu5-building-pipeline:cookshop:localization
