# >>> eu5-building-pipeline:copper_mine_adit:localization
  copper_mine_adit_slot_0: "Copper Lode"
  copper_mine_adit_slot_1: "Ore Dressing"
  copper_mine_adit_slot_2: "Adit Workings"
  copper_mine_adit: "Adit Copper Mine"
  copper_mine_adit_desc: "Drainage adits, timbered shafts, and dressing floors let miners work copper lodes more regularly. Silver-bearing, gold-bearing, and tin-bearing stones are sorted where the lode allows."
  pp_copper_mine_adit_base_copper: "Surveyed Copper Lode"
  pp_copper_mine_adit_base_copper_desc: "The surveyed lode itself: what the ground gives before the adits and shafts add to it."
  pp_copper_mine_adit_no_primary: "No Adit Workings"
  pp_copper_mine_adit_no_primary_desc: "No adits are driven here; the mine gives only what its lode yields on its own."
  pp_copper_mine_adit_copper: "Adit and Shaft Workings"
  pp_copper_mine_adit_copper_desc: "A long adit is driven in from the valley below the lode to drain it, and timbered shafts reach the ore above. With the water running out by itself, the miners follow the copper far deeper than open pits allow."
  pp_copper_mine_adit_no_secondary: "No Secondary Output"
  pp_copper_mine_adit_no_secondary_desc: "No other ores are dressed from the lode here; the miners keep to the copper."
  pp_copper_mine_adit_silver: "Saiger Ore Sorting"
  pp_copper_mine_adit_silver_desc: "Ore rich in silver is sorted for the saiger process: the copper is melted with lead and heated gently until the silver-laden lead runs out, and the silver is then refined on the cupel. It made the copper of Central Europe a source of silver."
  pp_copper_mine_adit_gold: "Auriferous Ore Dressing"
  pp_copper_mine_adit_gold_desc: "Gold-bearing pieces of the lode are crushed and washed on the dressing floors until the heavy grains collect. Lead gathers the gold in the furnace and gives it up again on the refining hearth."
  pp_copper_mine_adit_tin: "Tin Lode Dressing"
  pp_copper_mine_adit_tin_desc: "Tin-bearing stone from the copper lode is crushed and washed on dressing floors, where the heavy tin ore settles in the troughs. The cleaner concentrate smelts into tin with little fuel."
  pp_copper_mine_adit_market_sales: "Market Sales"
  pp_copper_mine_adit_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  copper_mine_adit_slot_3: "Market"
# <<< eu5-building-pipeline:copper_mine_adit:localization
