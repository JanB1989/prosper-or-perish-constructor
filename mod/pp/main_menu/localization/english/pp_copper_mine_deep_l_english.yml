l_english:

# >>> eu5-building-pipeline:copper_mine_deep:localization
  copper_mine_deep_slot_0: "Copper Lode"
  copper_mine_deep_slot_1: "Ore Parting"
  copper_mine_deep_slot_2: "Deep Copper Workings"
  copper_mine_deep_slot_3: "Market"
  copper_mine_deep: "Deep Copper Works"
  copper_mine_deep_desc: "Drained shafts, horse whims, and coal-fired reverberatory furnaces let copper districts work deeper lodes and smelt poorer ores at the mine. Silver-bearing, gold-bearing, and tin-bearing stones are parted where the lode allows."
  pp_copper_mine_deep_base_copper: "Surveyed Deep Copper Lode"
  pp_copper_mine_deep_base_copper_desc: "The deep lode itself: what the ground gives before the drained shafts and furnaces add to it."
  pp_copper_mine_deep_no_secondary: "No Secondary Output"
  pp_copper_mine_deep_no_secondary_desc: "No other metals are parted from the copper ore here; the miners keep to the copper."
  pp_copper_mine_deep_silver: "Liquation Parting"
  pp_copper_mine_deep_silver_desc: "Copper rich in silver is melted with lead, and the cakes are heated just enough for the lead to sweat out, carrying the silver with it. Refiners then drive the lead off on the cupel and keep the silver."
  pp_copper_mine_deep_gold: "Auriferous Parting"
  pp_copper_mine_deep_gold_desc: "Gold gathered from the copper ore comes off the cupel alloyed with silver. The refiners part the two with strong acid, which dissolves the silver and leaves the gold clean."
  pp_copper_mine_deep_tin: "Tin Lode Parting"
  pp_copper_mine_deep_tin_desc: "Tin and copper ores from the same lode are stamped and washed on long frames, where the heavier tin settles first. Each ore goes to its own furnace, and neither is thrown on the tips."
  pp_copper_mine_deep_no_primary: "No Deep Copper Workings"
  pp_copper_mine_deep_no_primary_desc: "No deep shafts are worked here; the mine gives only what its lode yields on its own."
  pp_copper_mine_deep_horse_whim_hoisting: "Horse-Whim Hoisting"
  pp_copper_mine_deep_horse_whim_hoisting_desc: "A horse walks a circle around a great wooden drum and winds the ore buckets up the shaft on a rope. The whim asks for horses and harness instead of iron tools, and keeps a deep mine working on little."
  pp_copper_mine_deep_drained_shafts: "Drained Shaft Workings"
  pp_copper_mine_deep_drained_shafts_desc: "Water wheels drive rod pumps that lift the water out of shafts sunk below the old adit, and tarred ropes wind up the ore. Kept dry, the deep lodes go on giving ore long after the ground above is worked out."
  pp_copper_mine_deep_reverberatory_smelting: "Reverberatory Smelting"
  pp_copper_mine_deep_reverberatory_smelting_desc: "The ore is smelted at the mine in coal-fired furnaces where the flame plays over the charge from a separate firebox, so the fuel never touches the metal. It pays to smelt even poor ores that were never worth carting away."
  pp_copper_mine_deep_market_sales: "Market Sales"
  pp_copper_mine_deep_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  pp_reverberatory_copper: "Reverberatory Copper Smelting"
  pp_reverberatory_copper_desc: "Coal-fired reverberatory furnaces and deep drainage shafts let copper districts smelt poorer ores at the mine and keep the founders supplied."
# <<< eu5-building-pipeline:copper_mine_deep:localization
