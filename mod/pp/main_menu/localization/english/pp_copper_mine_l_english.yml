# >>> eu5-building-pipeline:copper_mine:localization
  copper_mine_slot_0: "Copper Lode"
  copper_mine_slot_1: "Ore Sorting"
  copper_mine_slot_2: "Copper Workings"
  copper_mine: "Copper Mine"
  copper_mine_desc: "Shallow pits and short headings follow exposed copper lodes. Ore pickers separate copper stone from waste and recover small lots of silver, gold, or tin ore when present."
  pp_copper_mine_base_copper: "Copper Outcrop"
  pp_copper_mine_base_copper_desc: "The copper outcrop itself: what the ground gives before any miner improves on it."
  pp_copper_mine_no_primary: "No Copper Workings"
  pp_copper_mine_no_primary_desc: "No copper is cut here; the mine gives only what its outcrop yields on its own."
  pp_copper_mine_copper: "Hand Copper Workings"
  pp_copper_mine_copper_desc: "Miners break the ore with picks, hammers and wedges by candlelight and carry it out of short headings. On the surface it is roasted in heaps over wood and charcoal to drive off sulphur before the copper is smelted."
  pp_copper_mine_fire_setting: "Fire-Setting"
  pp_copper_mine_fire_setting_desc: "The miners stack wood against the rock face and burn it overnight. Heated and cooled, the hard rock cracks and can be broken out with little more than bars and hammers, an old and wood-hungry way to win copper ore."
  pp_copper_mine_no_secondary: "No Secondary Output"
  pp_copper_mine_no_secondary_desc: "No other ores are picked from the copper stone here; the miners keep to the copper."
  pp_copper_mine_silver: "Argentiferous Ore Picking"
  pp_copper_mine_silver_desc: "Grey copper ores often hold silver. The pickers sort out the richest stones, and the silver is drawn off by melting the ore with lead and then burning the lead away on a hearth."
  pp_copper_mine_gold: "Auriferous Ore Picking"
  pp_copper_mine_gold_desc: "A few copper lodes carry traces of gold. The pickers set the promising stones aside, and the gold is gathered in molten lead and freed again when the lead is burnt off on a hearth."
  pp_copper_mine_tin: "Cassiterite Lode Picking"
  pp_copper_mine_tin_desc: "Some copper lodes carry tin stone near the surface, the heavy black cassiterite. The pickers set it aside, wash it in troughs and smelt a little tin, a metal every bronze founder needs."
  pp_copper_mine_market_sales: "Market Sales"
  pp_copper_mine_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  copper_mine_slot_3: "Market"
# <<< eu5-building-pipeline:copper_mine:localization
