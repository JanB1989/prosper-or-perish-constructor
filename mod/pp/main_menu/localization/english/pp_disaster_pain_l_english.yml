 STATIC_MODIFIER_NAME_pp_disaster_pain_crisis_of_faith_1: "A Lingering Crisis"
 STATIC_MODIFIER_DESC_pp_disaster_pain_crisis_of_faith_1: "The crisis of faith has divided the clergy for a generation, and schismatic preachers win more followers every year. The estates lose patience with the crown, the tax collectors bring back less, the levies thin out and rebels find willing followers."
 STATIC_MODIFIER_NAME_pp_disaster_pain_crisis_of_faith_2: "A Deepening Crisis"
 STATIC_MODIFIER_DESC_pp_disaster_pain_crisis_of_faith_2: "The crisis of faith has divided the clergy for a generation, and schismatic preachers win more followers every year. The crisis deepens. Each season the court's hold weakens, and the provinces listen to it less."
 STATIC_MODIFIER_NAME_pp_disaster_pain_crisis_of_faith_3: "A Festering Crisis"
 STATIC_MODIFIER_DESC_pp_disaster_pain_crisis_of_faith_3: "The crisis of faith has divided the clergy for a generation, and schismatic preachers win more followers every year. Rebels grow bolder, our subjects drift away and our neighbours take note of our weakness."
 STATIC_MODIFIER_NAME_pp_disaster_pain_crisis_of_faith_4: "Authority Crumbles"
 STATIC_MODIFIER_DESC_pp_disaster_pain_crisis_of_faith_4: "The crisis of faith has divided the clergy for a generation, and schismatic preachers win more followers every year. The crown's authority crumbles. Our armies have lost heart, our treasury runs thin and rival powers smell blood."
 STATIC_MODIFIER_NAME_pp_disaster_pain_crisis_of_faith_5: "A Weary Realm"
 STATIC_MODIFIER_DESC_pp_disaster_pain_crisis_of_faith_5: "The crisis of faith has divided the clergy for a generation, and schismatic preachers win more followers every year. The realm is worn out by the endless crisis and stays this weak for as long as it lasts. Before long even its fiercest partisans will be tired of the struggle, and it can be ended with less stability than usual."
 STATIC_MODIFIER_NAME_pp_disaster_pain_decline_of_empire_1: "A Lingering Crisis"
 STATIC_MODIFIER_DESC_pp_disaster_pain_decline_of_empire_1: "The empire has been in decline for a generation, and its subject peoples dream of rulers of their own. The estates lose patience with the crown, the tax collectors bring back less, the levies thin out and rebels find willing followers."
