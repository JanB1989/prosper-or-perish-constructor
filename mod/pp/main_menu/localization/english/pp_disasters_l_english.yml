l_english:
 pp_disaster.1.title: "A Crisis Without End"
 pp_disaster.1.desc: "A generation has passed since this [disaster|e] began, and still there is no end in sight. The longer it lasts, the more it costs us: the estates lose patience with the crown, the tax collectors bring back less, our levies thin out and our soldiers lose heart, while rebels find willing followers and our neighbours take note."
 pp_disaster.1.a: "We must see this through."
 pp_disaster.1.a_tt: "The realm weakens step by step for as long as the [disaster|e] lasts."
 pp_disaster.2.title: "The Crisis Deepens"
 pp_disaster.2.desc: "Still the [disaster|e] drags on, and the realm grows weaker with every season. The court's orders reach the provinces late, the rebels grow bolder and our rivals watch for their chance."
 pp_disaster.2.a: "How much longer?"
 pp_disaster.2.a_tt: "The [disaster|e] weighs heavier on the realm."
 pp_disaster.3.title: "A Weary Realm"
 pp_disaster.3.desc: "The [disaster|e] has lasted so long that even its fiercest partisans are tired of the struggle. If we can hold the realm together, we may now bring it to an end even without the stability it would otherwise take."
 pp_disaster.3.a: "Then let us make an end of it."
 pp_disaster.3.a_tt: "The [disaster|e] can now end with less stability than usual. Once it ends this way, it cannot strike us again for a long time."
