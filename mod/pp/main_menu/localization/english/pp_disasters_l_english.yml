l_english:
 pp_disaster.1.title: "The Crisis Comes to a Head"
 pp_disaster.1.desc: "A generation has passed since this [disaster|e] began, and still there is no end in sight. Children who were born into the crisis now bear arms and pay taxes, and they have never known an ordinary year. The great families grumble that the crown has no answer, and in the provinces men begin to look for one of their own."
 pp_disaster.1.a: "We must hold the realm together."
 pp_disaster.2.title: "The Realm Unravels"
 pp_disaster.2.desc: "The crisis feeds on itself. Every year it lasts, fewer people believe it can be mastered, and the orders of the court reach the provinces late, or not at all. The estates make their own arrangements, and armed bands gather where the crown's officers no longer dare to go."
 pp_disaster.2.a: "Is there no one left who will obey?"
 pp_disaster.3.title: "On the Brink"
 pp_disaster.3.desc: "The realm stands at the edge of the abyss. Unless the crisis is resolved soon, it will be settled for us, and not by peaceful means. Our councillors speak openly of what will happen when the dam breaks."
 pp_disaster.3.a: "Then we have little time."
 pp_disaster.10.title: "The Breaking Point"
 pp_disaster.10.desc.breakaway: "The crisis could not be mastered, and the realm has paid the price. In the provinces where our rule had long been a word on parchment, the local lords and towns have declared that they answer to us no more. They have chosen their own rulers, and we have no strength left to bring them back."
 pp_disaster.10.desc.civil_war: "The crisis could not be mastered, and the estates have lost all patience with the crown. The most powerful among them has raised its banners, and the provinces that were least loyal have gone over to it. The realm is at war with itself."
 pp_disaster.10.desc.collapse: "The crisis could not be mastered, and it has burned itself out in ruin. The court is discredited, the treasury of goodwill is spent, and the people have stopped believing that their rulers can protect them. The crisis is over, but the realm will need many years to recover from it."
 pp_disaster.10.a: "So this is how it ends."
 pp_disaster.10.breakaway_tt: "Our least controlled provinces have broken away as countries of their own."
 pp_disaster.10.civil_war_tt: "The strongest estate has risen against the crown with our least controlled provinces, and a civil war has begun."
 pp_disaster.10.no_restart_tt: "The same [disaster|e] cannot strike us again for a long time."
 pp_disaster_breaking_point_outcome: "The Breaking Point"
 pp_disaster_breaking_point_outcome_desc: "The crisis has lasted for so long without any of its endings in sight that it breaks the realm."
 STATIC_MODIFIER_NAME_pp_disaster_coming_to_head_1: "Crisis Comes to a Head"
 STATIC_MODIFIER_DESC_pp_disaster_coming_to_head_1: "A disaster has lasted a generation. Unrest grows, the estates lose faith in the crown and stability is harder to restore. The pressure rises the longer the disaster lasts."
 STATIC_MODIFIER_NAME_pp_disaster_coming_to_head_2: "The Realm Unravels"
 STATIC_MODIFIER_DESC_pp_disaster_coming_to_head_2: "A disaster has lasted far too long. Unrest spreads, the estates make their own arrangements and stability slips away. If it is not resolved, the disaster will break the realm."
 STATIC_MODIFIER_NAME_pp_disaster_coming_to_head_3: "On the Brink"
 STATIC_MODIFIER_DESC_pp_disaster_coming_to_head_3: "The disaster is about to break the realm: its least controlled land may break away, its strongest estate may rise in a civil war, or the crown's authority may collapse."
