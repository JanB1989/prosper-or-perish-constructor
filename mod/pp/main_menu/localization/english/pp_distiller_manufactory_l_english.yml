l_english:

# >>> eu5-building-pipeline:distiller_manufactory:localization
  distiller_manufactory_slot_0: "[ShowBuildingTypeName('distiller_manufactory')|e] Work"
  pp_distiller_manufactory_sugar_distillery_maintenance: "Distill Sugar"
  pp_distiller_manufactory_sugar_distillery_maintenance_desc: "Molasses and cane juice ferment in vats and run twice through copper pot stills into rum. The sugar estates of the Caribbean and Brazil made it from what their boiling houses left over."
  pp_distiller_manufactory_rice_distillery_maintenance: "Distill Rice"
  pp_distiller_manufactory_rice_distillery_maintenance_desc: "Fermented rice mash is distilled into a clear, strong spirit and bottled. Rice spirits were made across Asia, from the arrack of the Indies to Korean soju and Japanese shochu."
  pp_distiller_manufactory_potato_distillery_maintenance: "Distill Potatoes"
  pp_distiller_manufactory_potato_distillery_maintenance_desc: "Potatoes are boiled, mashed and fermented, and the mash is distilled into a cheap, strong spirit. From the eighteenth century potato schnapps and vodka spread across northern and eastern Europe."
  pp_distiller_manufactory_wheat_distillery_maintenance: "Distill Wheat"
  pp_distiller_manufactory_wheat_distillery_maintenance_desc: "Grain is malted, mashed and run through pot stills into a plain spirit, sometimes flavoured with juniper. Dutch genever and German korn were grain spirits of this kind."
  pp_distiller_manufactory_scottish_whisky_distillery_maintenance: "Scotch Whisky"
  pp_distiller_manufactory_scottish_whisky_distillery_maintenance_desc: "Malted grain, dried over peat smoke, is mashed and distilled twice in copper pot stills. The spirit rests in oak casks, as the Highland and Lowland distillers of Scotland made it."
  pp_distiller_manufactory_market_sales: "Market Sales"
  pp_distiller_manufactory_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  distiller_manufactory_slot_1: "Market"
  pp_distiller_manufactory_legacy_beer_liquor_workshop_maintenance: "$beer_liquor_workshop_maintenance$ (Old Ways)"
  pp_distiller_manufactory_legacy_beer_liquor_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('distillers_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_distiller_manufactory_legacy_wine_liquor_workshop_maintenance: "$wine_liquor_workshop_maintenance$ (Old Ways)"
  pp_distiller_manufactory_legacy_wine_liquor_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('distillers_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
# <<< eu5-building-pipeline:distiller_manufactory:localization
