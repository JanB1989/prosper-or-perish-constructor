l_english:

# >>> eu5-building-pipeline:distiller_mill:localization
  distiller_mill_slot_0: "[ShowBuildingTypeName('distiller_mill')|e] Work"
  pp_distiller_mill_sugar_distillery_mill_maintenance: "Distill Sugar"
  pp_distiller_mill_sugar_distillery_mill_maintenance_desc: "Molasses and sugar are fermented in great vats and run through large copper stills into rum, the spirit of the sugar islands and of the ships that served them."
  pp_distiller_mill_rice_distillery_mill_maintenance: "Distill Rice"
  pp_distiller_mill_rice_distillery_mill_maintenance_desc: "Rice wine is distilled in large stills into a clear, strong spirit, in the manner of the arrack of the Indies and the shochu and soju of East Asia, made here in bulk."
  pp_distiller_mill_potato_distillery_mill_maintenance: "Distill Potatoes"
  pp_distiller_mill_potato_distillery_mill_maintenance_desc: "Cooked potatoes give a cheap mash that large stills turn into schnapps and vodka. Potato spirit became the drink of the poor across northern and eastern Europe."
  pp_distiller_mill_wheat_distillery_mill_maintenance: "Distill Wheat"
  pp_distiller_mill_wheat_distillery_mill_maintenance_desc: "Grain is mashed and fermented by the vat and distilled in large stills into grain spirit and gin, a drink so cheap in eighteenth century London that it alarmed the law."
  pp_distiller_mill_scottish_whisky_distillery_mill_maintenance: "Scotch Whisky"
  pp_distiller_mill_scottish_whisky_distillery_mill_maintenance_desc: "Malted grain, dried over peat fires, is mashed and twice distilled in copper pot stills. The Scots sold their whisky far beyond the Highlands once the trade was licensed."
  pp_distiller_mill_market_sales: "Market Sales"
  pp_distiller_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  distiller_mill_slot_1: "Market"
  pp_distiller_mill_legacy_beer_liquor_workshop_maintenance: "$beer_liquor_workshop_maintenance$ (Old Ways)"
  pp_distiller_mill_legacy_beer_liquor_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('distillers_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_distiller_mill_legacy_wine_liquor_workshop_maintenance: "$wine_liquor_workshop_maintenance$ (Old Ways)"
  pp_distiller_mill_legacy_wine_liquor_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('distillers_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
# <<< eu5-building-pipeline:distiller_mill:localization
