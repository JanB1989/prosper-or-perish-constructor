l_english:

# >>> eu5-building-pipeline:distillers_guild:localization
  pp_distillers_guild_price: "[ShowBuildingTypeName('distillers_guild')|e] Price"
  distillers_guild_slot_0: "[ShowBuildingTypeName('distillers_guild')|e] Work"
  pp_distillers_guild_sugar_liquor_guild_maintenance: "Distill Sugar"
  pp_distillers_guild_sugar_liquor_guild_maintenance_desc: "A small still turns fermented cane juice or molasses into a rough cane spirit. The art of distilling came from the alchemists and apothecaries who made aqua vitae."
  pp_distillers_guild_rice_liquor_guild_maintenance: "Distill Rice"
  pp_distillers_guild_rice_liquor_guild_maintenance_desc: "Rice wine is boiled in a small still and the vapour cooled into a clear spirit. The craft was long known in China, Korea and the ports of the Indies, where it was sold as arrack."
  pp_distillers_guild_potato_liquor_guild_maintenance: "Distill Potatoes"
  pp_distillers_guild_potato_liquor_guild_maintenance_desc: "A small still turns a mash of boiled potatoes into a rough spirit. Distillers took up the potato as soon as it was grown widely, since it gives much starch for little money."
  pp_distillers_guild_wheat_liquor_guild_maintenance: "Distill Wheat"
  pp_distillers_guild_wheat_liquor_guild_maintenance_desc: "Grain is mashed, fermented and boiled in a small copper still into burnt wine, as early spirits were called. Distillers first sold it as a medicine."
  pp_distillers_guild_beer_liquor_guild_maintenance: "Distill Beer"
  pp_distillers_guild_beer_liquor_guild_maintenance_desc: "Beer that will not keep is boiled again in the still and its spirit drawn off. The early grain spirits of the Low Countries and Germany began this way."
  pp_distillers_guild_wine_liquor_guild_maintenance: "Distill Wine"
  pp_distillers_guild_wine_liquor_guild_maintenance_desc: "Wine is boiled in an alembic and the vapour cooled into brandy, from the Dutch for burnt wine. Brandy keeps and travels where the wine itself would sour on the way."
  pp_distillers_guild_market_sales: "Market Sales"
  pp_distillers_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  distillers_guild_slot_1: "Market"
# <<< eu5-building-pipeline:distillers_guild:localization
