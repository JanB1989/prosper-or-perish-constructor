l_english:

# >>> eu5-building-pipeline:distillers_workshop:localization
  distillers_workshop_slot_0: "[ShowBuildingTypeName('distillers_workshop')|e] Work"
  pp_distillers_workshop_sugar_liquor_workshop_maintenance: "Distill Sugar"
  pp_distillers_workshop_sugar_liquor_workshop_maintenance_desc: "The workshop ferments molasses left over from the sugar boiling and distils it into rum. The spirit grew from a planters' drink into a staple of navies and of the Atlantic trade."
  pp_distillers_workshop_rice_liquor_workshop_maintenance: "Distill Rice"
  pp_distillers_workshop_rice_liquor_workshop_maintenance_desc: "Rice is fermented with a mould starter, and the brew is distilled into a clear spirit. It is much like the arrack sold in the ports of the Indies."
  pp_distillers_workshop_potato_liquor_workshop_maintenance: "Distill Potatoes"
  pp_distillers_workshop_potato_liquor_workshop_maintenance_desc: "Potatoes give much starch for little land. The distillers of the north and east turn their mash into a cheap, strong schnapps that country inns sell by the glass."
  pp_distillers_workshop_wheat_liquor_workshop_maintenance: "Distill Wheat"
  pp_distillers_workshop_wheat_liquor_workshop_maintenance_desc: "Grain is mashed, fermented and distilled into a grain spirit, often flavoured with herbs, caraway or juniper. It is sold by the cask to inns and households."
  pp_distillers_workshop_beer_liquor_workshop_maintenance: "Distill Beer"
  pp_distillers_workshop_beer_liquor_workshop_maintenance_desc: "The distillers buy beer and malt wash and run it twice through their stills into malt wine. Flavoured with juniper berries, it became Dutch genever, the forerunner of gin."
  pp_distillers_workshop_wine_liquor_workshop_maintenance: "Distill Wine"
  pp_distillers_workshop_wine_liquor_workshop_maintenance_desc: "Wine from the countryside is distilled into brandy and aged in oak casks. Dutch merchants made the brandies of Cognac and Armagnac a great export."
  pp_distillers_workshop_market_sales: "Market Sales"
  pp_distillers_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  distillers_workshop_slot_1: "Market"
# <<< eu5-building-pipeline:distillers_workshop:localization
