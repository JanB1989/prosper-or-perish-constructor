l_english:

# >>> eu5-building-pipeline:fine_cloth_guild:localization
  pp_fine_cloth_guild_price: "[ShowBuildingTypeName('fine_cloth_guild')|e] Price"
  pp_fine_cloth_guild_fine_cloth_guild_maintenance: "Cloth Finishing"
  pp_fine_cloth_guild_fine_cloth_guild_maintenance_desc: "Plain cloth is fulled, its nap raised with teasels and shorn smooth by the shearmen until it has the even, close face of fine broadcloth."
  pp_fine_cloth_guild_wool_weavers_maintenance: "Wool Weaving"
  pp_fine_cloth_guild_wool_weavers_maintenance_desc: "The guild weaves fine wool into heavy broadcloth on wide looms worked by two weavers. Flemish and Florentine cloth of this kind was sold across Europe."
  pp_fine_cloth_guild_silk_weavers_maintenance: "Silk Weaving"
  pp_fine_cloth_guild_silk_weavers_maintenance_desc: "Silk weavers work velvets, damasks and brocades on draw looms, an assistant lifting the pattern threads. Lucca, Florence and Venice brought the craft to Italy."
  pp_fine_cloth_guild_spanish_cloth_maintenance: "Merino Wool"
  pp_fine_cloth_guild_spanish_cloth_maintenance_desc: "The soft wool of Spanish merino sheep, driven between summer and winter pastures by the Mesta, is woven into the finest woollens of the age."
  pp_fine_cloth_guild_standard_fine_cloth_guild_maintenance: "Standard Dyeing"
  pp_fine_cloth_guild_standard_fine_cloth_guild_maintenance_desc: "Master dyers steep the woven cloth in their vats of madder, woad and weld, the reds, blues and yellows of the guild towns. Without a mordant the colours fade over the years."
  pp_fine_cloth_guild_alum_fine_cloth_guild_maintenance: "Dyes with Alum"
  pp_fine_cloth_guild_alum_fine_cloth_guild_maintenance_desc: "The dyers first boil the cloth with alum, which binds the colour to the fibre, so deep reds and blues stay fast. Only such cloth could fetch the highest prices."
  pp_fine_cloth_guild_fur_trim_guild_maintenance: "Fur Trims"
  pp_fine_cloth_guild_fur_trim_guild_maintenance_desc: "Furriers sew sable, marten, squirrel and ermine onto gowns and cloaks as linings and borders. Sumptuary laws in many lands reserved the finest of these furs for the nobility."
  pp_fine_cloth_guild_market_sales: "Market Sales"
  pp_fine_cloth_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  fine_cloth_guild_slot_2: "Market"
# <<< eu5-building-pipeline:fine_cloth_guild:localization
