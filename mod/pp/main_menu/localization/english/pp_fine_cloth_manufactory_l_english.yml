# >>> eu5-building-pipeline:fine_cloth_manufactory:localization
  pp_fine_cloth_manufactory_silk_cloth_manufactory_maintenance: "Silk Cloth"
  pp_fine_cloth_manufactory_silk_cloth_manufactory_maintenance_desc: "Reeled silk is thrown into thread and woven on drawlooms into damasks, velvets and brocades. Lyon, Venice, Florence and the workshops of Persia and China led the trade."
  pp_fine_cloth_manufactory_fine_cloth_manufactory_maintenance: "Cloth Finishing"
  pp_fine_cloth_manufactory_fine_cloth_manufactory_maintenance_desc: "Plain woollens are raised with teasels, sheared smooth, dyed and pressed until they gleam. Finishing turned ordinary cloth into the fine broadcloth sold in every great town."
  pp_fine_cloth_manufactory_standard_cloth_manufactory_maintenance: "Standard Dyeing"
  pp_fine_cloth_manufactory_standard_cloth_manufactory_maintenance_desc: "The cloth goes through a single dye bath without a mordant, a plain colour for the ordinary trade. It is quick and cheap, but the colour fades sooner."
  pp_fine_cloth_manufactory_alum_fine_cloth_manufactory_maintenance: "Dyes with Alum"
  pp_fine_cloth_manufactory_alum_fine_cloth_manufactory_maintenance_desc: "The cloth is boiled first in alum and then in the dye, so the colour bonds with the fibre and holds. Scarlets and crimsons fixed this way were the pride of the great dyers."
  pp_fine_cloth_manufactory_market_sales: "Market Sales"
  pp_fine_cloth_manufactory_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  fine_cloth_manufactory_slot_2: "Market"
  pp_fine_cloth_manufactory_legacy_fur_trim_workshop_maintenance: "$fur_trim_workshop_maintenance$ (Old Ways)"
  pp_fine_cloth_manufactory_legacy_fur_trim_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('fine_cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_fine_cloth_manufactory_legacy_wool_weavers_workshop_maintenance: "$wool_weavers_workshop_maintenance$ (Old Ways)"
  pp_fine_cloth_manufactory_legacy_wool_weavers_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('fine_cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
# <<< eu5-building-pipeline:fine_cloth_manufactory:localization
