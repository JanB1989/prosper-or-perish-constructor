# >>> eu5-building-pipeline:fine_cloth_mill:localization
  pp_fine_cloth_mill_dyeing_maintenance: "Dyeing"
  pp_fine_cloth_mill_dyeing_maintenance_desc: "Large dyehouses with heated vats, rinsing tanks and drying lofts colour cloth by the bolt. The new chemistry begins to make the recipes exact and repeatable."
  pp_fine_cloth_mill_fine_cloth_mill_maintenance: "Cloth Finishing"
  pp_fine_cloth_mill_fine_cloth_mill_maintenance_desc: "Gig mills raise the nap with rows of teasels, and shearing frames cut it by machine. One mill finishes as much cloth as a whole street of shearmen."
  pp_fine_cloth_mill_silk_cloth_mill_maintenance: "Silk Cloth"
  pp_fine_cloth_mill_silk_cloth_mill_maintenance_desc: "Silk is thrown into thread on water-powered mills and woven on looms whose patterns are set by punched cards. Jacquard perfected this loom in Lyon in the first years of the nineteenth century."
  pp_fine_cloth_mill_market_sales: "Market Sales"
  pp_fine_cloth_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  fine_cloth_mill_slot_2: "Market"
  pp_fine_cloth_mill_legacy_fur_trim_workshop_maintenance: "$fur_trim_workshop_maintenance$ (Old Ways)"
  pp_fine_cloth_mill_legacy_fur_trim_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('fine_cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_fine_cloth_mill_legacy_wool_weavers_workshop_maintenance: "$wool_weavers_workshop_maintenance$ (Old Ways)"
  pp_fine_cloth_mill_legacy_wool_weavers_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('fine_cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
