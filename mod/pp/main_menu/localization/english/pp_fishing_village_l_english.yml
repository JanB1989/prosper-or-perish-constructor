# >>> eu5-building-pipeline:fishing_village:localization
  fishing_village_slot_0: "Fishing grounds"
  fishing_village_slot_1: "Fishing method"
  fishing_village_slot_2: "Freshwater Works"
  fishing_village_slot_3: "Main Catch"
  fishing_village_slot_4: "Provisioning"
  pp_arctic_fishing_village_maintenance: "Arctic Fishing"
  pp_arctic_fishing_village_maintenance_desc: "In the far north fishers work the icy waters with lines and hooks of bone or ivory. The catch dries on racks in the cold wind and keeps with very little salt."
  pp_fishing_village_base_fish: "Fishing Grounds"
  pp_fishing_village_base_fish_desc: "The fishing ground itself: what the water gives before any fisher improves on it."
  pp_fishing_village_clinker_craft: "Clinker boats"
  pp_fishing_village_clinker_craft_desc: "Boats built of overlapping planks riveted together are light, strong and easy to repair on the beach. This clinker building, an old northern tradition, lets fishers reach richer grounds farther out."
  pp_fishing_village_maintenance: "[ShowBuildingTypeName('fishing_village')|e] Maintenance"
  pp_fishing_village_maintenance_desc: "Boats, nets, lines and hooks are kept in repair, and part of the catch is salted to keep. This is the daily round of the fishing village, the work everything else rests on."
  pp_fishing_village_no_freshwater_works: "No Freshwater Works"
  pp_fishing_village_no_freshwater_works_desc: "No ponds or weirs are kept; the fishers work the open water alone."
  pp_fishing_village_no_primary: "No Main Catch"
  pp_fishing_village_no_primary_desc: "The main work stands idle, and the water gives only what a few hands catch."
  pp_fishing_village_provision: "Provision with Fish"
  pp_fishing_village_provision_desc: "The household buys its own catch back and cooks for the province. The lower the province store is, the more food it makes of it."
  pp_fishing_village_strand_line: "Handline fishing"
  pp_fishing_village_strand_line_desc: "Fishers work from the shore and small boats with hooked lines, as every coastal village has always done."
  pp_fishing_village_stew_ponds: "Stew Ponds"
  pp_fishing_village_stew_ponds_desc: "Clay-lined ponds with timber sluices hold carp and other fish until they are needed. Monasteries and manors kept such stew ponds across medieval Europe, especially for the many fast days."
  pp_fishing_village_wattle_weirs: "Wattle Fish Weirs"
  pp_fishing_village_wattle_weirs_desc: "Fences of woven hazel stakes are built across rivers and tidal flats to steer fish into traps and nets. Such weirs were common along medieval rivers and shores."
  pp_distant_water_fishing: "Distant-Water Fishing"
  pp_distant_water_fishing_desc: "Organize provisioned schooner fleets for rich offshore grounds, supported by salt, victuals, and naval supplies."
  pp_herring_buss: "The Herring Buss"
  pp_herring_buss_desc: "Develop broad-beamed herring busses, drift nets, barrels, and salt-curing routines for longer offshore fishing voyages."
  pp_managed_fishponds: "Managed Fishponds"
  pp_managed_fishponds_desc: "Manage local ponds, banks, and timber sluices so village fishers can keep freshwater fish close to market."
  pp_steam_trawling: "Steam Trawling"
  pp_steam_trawling_desc: "Use coal-fired steam trawlers and specialized tools to work deeper fishing grounds at industrial scale."
  pp_wattle_fish_weirs: "Wattle Fish Weirs"
  pp_wattle_fish_weirs_desc: "Build wicker traps, wattle fences, and river weirs that guide local fish into village catches."
  pp_fishing_village_market_sales: "Market Sales"
  pp_fishing_village_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  fishing_village_slot_5: "Market"
# <<< eu5-building-pipeline:fishing_village:localization
