# >>> eu5-building-pipeline:forest_village:localization
  forest_village_slot_0: "Forest Resources"
  forest_village_slot_1: "Forest Work"
  forest_village_slot_2: "Provisioning"
  pp_forest_tannery: "Forest Tanning"
  pp_forest_tannery_desc: "Villagers scrape and soak the hides of the game they take, then dress them with the animals' own fat and brains or with tanning bark. Soft forest leather is sold for clothing, straps and harness."
  pp_forest_village_base_beeswax: "Forest Bloom"
  pp_forest_village_base_beeswax_desc: "The forest bloom itself: what the forest gives before any beekeeper improves on it."
  pp_forest_village_base_fur: "Forest Fur"
  pp_forest_village_base_fur_desc: "The forest fur itself: what the forest gives before any trapper improves on it."
  pp_forest_village_base_leather: "Forest Hides"
  pp_forest_village_base_leather_desc: "The forest hides itself: what the forest gives before any tanner improves on it."
  pp_forest_village_base_wild_game: "Forest Game"
  pp_forest_village_base_wild_game_desc: "The forest game itself: what the forest gives before any hunter improves on it."
  pp_forest_village_forest_apiary: "Forest apiary"
  pp_forest_village_forest_apiary_desc: "Here beekeeping is the principal occupation. Families work the forest bloom, keeping and moving hives through the woods; wax and honey are the foundation of the settlement's livelihood."
  pp_forest_village_provision: "Provision with Game"
  pp_forest_village_provision_desc: "The household buys its own game back and cooks for the province. The lower the province store is, the more food it makes of it."
  pp_fur_trapping: "Fur Trapping"
  pp_fur_trapping_desc: "Trappers set snares and deadfall traps along their lines through the winter, when the pelts are thickest. Marten, sable, fox and beaver furs fetched high prices from Muscovy to the courts of Europe."
  pp_fur_trapping_advance_colonial: "Colonial Fur Trade"
  pp_fur_trapping_advance_colonial_desc: "Establish organized fur trapping through North American colonial trade."
  pp_fur_trapping_advance_general: "Fur Trapping"
  pp_fur_trapping_advance_general_desc: "Adopt organized fur harvesting through trade networks."
  pp_fur_trapping_advance_native: "Fur Trapping"
  pp_fur_trapping_advance_native_desc: "Traditional fur harvesting in boreal and northern forests."
  pp_forest_village_no_primary: "No Forest Work"
  pp_forest_village_no_primary_desc: "The main work stands idle, and the woods give only what a few hands gather."
  pp_hunting_lodges: "Hunting Lodges"
  pp_hunting_lodges_desc: "Hunters work out of simple lodges deep in the woods, taking deer, boar and fowl. The meat feeds the village and the province, and the hides go to the tanners."
  pp_forest_village_market_sales: "Market Sales"
  pp_forest_village_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  forest_village_slot_3: "Market"
# <<< eu5-building-pipeline:forest_village:localization
