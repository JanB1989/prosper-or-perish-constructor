  pp_fruit_orchard_base_fruit_desc: "The trees themselves: what the orchard yields with plain picking before any orchard work."
  pp_fruit_orchard_maintenance: "[ShowBuildingTypeName('fruit_orchard')|e] Maintenance"
  pp_fruit_orchard_maintenance_desc: "Orchard keepers prune the trees in winter, stake the young ones and pick the fruit into wooden crates. A tended orchard bears more evenly than trees left to themselves."
  pp_fruit_orchard_no_primary: "No Orchard Work"
  pp_fruit_orchard_no_primary_desc: "No pruning or staking is done here; the trees bear as they grow."
