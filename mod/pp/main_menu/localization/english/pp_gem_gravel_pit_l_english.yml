# >>> eu5-building-pipeline:gem_gravel_pit:localization
  gem_gravel_pit_slot_0: "Gem Gravel"
  gem_gravel_pit_slot_1: "Placer Byproducts"
  gem_gravel_pit_slot_2: "Gem Washing"
  gem_gravel_pit: "Gem Gravel Pit"
  gem_gravel_pit_desc: "Workers dig alluvial gravel from shallow pits and stream beds, then wash it in baskets and pans. Heavy sand may yield gemstones, gold specks, and clean sand."
  pp_gem_gravel_pit_base_gems: "Gem Gravel Outcrop"
  pp_gem_gravel_pit_base_gems_desc: "The gem gravel itself: what the outcrop gives before any digger improves on it."
  pp_gem_gravel_pit_no_primary: "No Gem Washing"
  pp_gem_gravel_pit_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_gem_gravel_pit_gems: "Hand-Washed Gem Gravel"
  pp_gem_gravel_pit_gems_desc: "Diggers lift gravel from shallow pits and stream beds and wash it in round baskets, swirling the light earth away. Sorters pick the bright stones from what remains, as the gem pits of Ceylon worked for centuries."
  pp_gem_gravel_pit_no_secondary: "No Secondary Output"
  pp_gem_gravel_pit_no_secondary_desc: "No byproduct is taken from this work, the waste goes to the spoil heap."
  pp_gem_gravel_pit_gold: "Gold Speck Washing"
  pp_gem_gravel_pit_gold_desc: "Heavy gold specks gather with the gem stones at the bottom of the pans. Washers work the last of the concentrate in wooden cradles and baskets to save them."
  pp_gem_gravel_pit_sand: "Washed Sand Sorting"
  pp_gem_gravel_pit_sand_desc: "The clean sand left after washing is screened from the gravel and sold to builders and glassmakers, so the washing floors earn a little more."
  pp_gem_gravel_pit_market_sales: "Market Sales"
  pp_gem_gravel_pit_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  gem_gravel_pit_slot_3: "Market"
