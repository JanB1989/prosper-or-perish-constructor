# >>> eu5-building-pipeline:gem_sluice:localization
  gem_sluice_slot_0: "Gem Gravel"
  gem_sluice_slot_1: "Placer Byproducts"
  gem_sluice_slot_2: "Sluice Washing"
  gem_sluice: "Gem Sluice"
  gem_sluice_desc: "Timbered sluices and sorting tables wash larger runs of gem-bearing gravel. The same water channels recover gold specks and clean sand."
  pp_gem_sluice_base_gems: "Surveyed Gem Gravels"
  pp_gem_sluice_base_gems_desc: "The surveyed gem gravels: what the stream bed gives before the works improve on it."
  pp_gem_sluice_no_primary: "No Sluice Washing"
  pp_gem_sluice_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_gem_sluice_gems: "Sluiced Gem Gravels"
  pp_gem_sluice_gems_desc: "Timber flumes bring a steady stream of water over long sluice boxes, and the gravel is shovelled in at the top. Light earth runs off, the heavy stones lodge behind the riffles, and sorters pick them out at the sorting tables."
  pp_gem_sluice_no_secondary: "No Secondary Output"
  pp_gem_sluice_no_secondary_desc: "No byproduct is taken from this work, the waste goes to the spoil heap."
  pp_gem_sluice_gold: "Gold Speck Washing"
  pp_gem_sluice_gold_desc: "Riffles and catch mats in the sluice boxes trap the heavy gold specks that wash down with the gem gravel, and panners clean them out at each change of shift."
  pp_gem_sluice_sand: "Washed Sand Sorting"
  pp_gem_sluice_sand_desc: "Screens at the tail of the sluices catch the clean sand as it washes out, and it is sold to builders and glassmakers. Little of what the water carries goes to waste."
  pp_gem_sluice_market_sales: "Market Sales"
  pp_gem_sluice_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  gem_sluice_slot_3: "Market"
