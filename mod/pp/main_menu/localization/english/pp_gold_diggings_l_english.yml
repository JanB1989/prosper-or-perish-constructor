# >>> eu5-building-pipeline:gold_diggings:localization
  gold_diggings_slot_0: "Gold Deposit"
  gold_diggings_slot_1: "Associated Ores"
  gold_diggings_slot_2: "Gold Workings"
  gold_diggings: "Gold Diggings"
  gold_diggings_desc: "Gold-bearing gravels and shallow lode outcrops are washed by hand. Workers also pick over associated ore for silver-bearing electrum and traces of copper."
  pp_gold_diggings_base_gold: "Native Gold Deposit"
  pp_gold_diggings_base_gold_desc: "The native gold deposit itself: what the ground gives before any digger improves on it."
  pp_gold_diggings_no_primary: "No Gold Washing"
  pp_gold_diggings_no_primary_desc: "No gravel is panned or washed; a few hands only pick nuggets from the outcrop and the stream bed."
  pp_gold_diggings_gold: "Placer Washing"
  pp_gold_diggings_gold_desc: "Water is led along leats into wooden sluices and rocking cradles lined with sheepskins. The fleece traps the fine gold as the gravel washes over it, a practice often thought to lie behind the tale of the Golden Fleece."
  pp_gold_diggings_hand_panning: "Hand Panning"
  pp_gold_diggings_hand_panning_desc: "Diggers swirl gravel and water in wooden pans until the light sand washes away and the heavy gold shows at the bottom. It needs little more than patience, timber and many hands."
  pp_gold_diggings_no_secondary: "No Associated Ore Sorting"
  pp_gold_diggings_no_secondary_desc: "No associated ore is picked out; the diggers keep to the gold."
  pp_gold_diggings_silver: "Electrum Sorting"
  pp_gold_diggings_silver_desc: "Much native gold is alloyed with silver, the pale electrum. Refiners part the two metals in small hearths and recover the silver for the mint."
  pp_gold_diggings_copper: "Copper Ore Picking"
  pp_gold_diggings_copper_desc: "Green-stained copper ore turns up beside the gold in the lode outcrops. The diggers pick it out, smelt it in a small hearth and sell the copper."
  pp_gold_diggings_market_sales: "Market Sales"
  pp_gold_diggings_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  gold_diggings_slot_3: "Market"
# <<< eu5-building-pipeline:gold_diggings:localization
