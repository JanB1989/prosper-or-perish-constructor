# >>> eu5-building-pipeline:gold_stamp_mill:localization
  gold_stamp_mill_slot_0: "Gold Deposit"
  gold_stamp_mill_slot_1: "Assay Sorting"
  gold_stamp_mill_slot_2: "Stamp-Mill Recovery"
  gold_stamp_mill: "Gold Stamp Mill"
  gold_stamp_mill_desc: "Stamp mills crush quartz and lode ore so mercury can collect fine gold. Assayers test the remaining ore for silver and copper values."
  pp_gold_stamp_mill_base_gold: "Surveyed Gold Deposit"
  pp_gold_stamp_mill_base_gold_desc: "The surveyed gold deposit: what the mapped lode gives before the works improve on it."
  pp_gold_stamp_mill_no_primary: "No Stamp Milling"
  pp_gold_stamp_mill_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_gold_stamp_mill_gold: "Stamp-Mill Amalgamation"
  pp_gold_stamp_mill_gold_desc: "Water wheels lift heavy iron-shod stamps that crush the quartz to sand. The slurry runs over blanket strakes and through mercury, which binds the fine gold into an amalgam that is then heated to drive the mercury off."
  pp_gold_stamp_mill_no_secondary: "No Assay Sorting"
  pp_gold_stamp_mill_no_secondary_desc: "No ore is assayed for other metals, the mill keeps to the gold."
  pp_gold_stamp_mill_silver: "Assay Silver Recovery"
  pp_gold_stamp_mill_silver_desc: "Assayers test the crushed ore, and where it carries silver the amalgam is retorted and parted. The silver is sold apart from the gold, and on some lodes it is worth nearly as much."
  pp_gold_stamp_mill_copper: "Copper Sulphide Sorting"
  pp_gold_stamp_mill_copper_desc: "Copper sulphide ore picked from the crushed lode is sorted at the troughs, roasted and smelted into copper beside the gold works. It is a modest trade next to the gold."
  pp_gold_stamp_mill_market_sales: "Market Sales"
  pp_gold_stamp_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  gold_stamp_mill_slot_3: "Market"
# <<< eu5-building-pipeline:gold_stamp_mill:localization
