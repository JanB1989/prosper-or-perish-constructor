l_english:

# >>> eu5-building-pipeline:grange:localization
  grange_desc: "When the province has a lot of food in its [Concept('provincial_food', 'food store')|e], the landowners at its [province_capital|e] pack that [ShowGoodsName('local_food')|e] into [ShowGoodsName('victuals')|e] and sell them on the market. The dearer victuals are, the more of the store they pack."
  grange_slot_0: "Packing"
  grange_slot_1: "Haulage"
  grange_slot_2: "Surplus Sales"
  pp_grange_porters: "Porters and Pack Animals"
  pp_grange_porters_desc: "Porters, mules and donkeys carry the packed stores from the landowners' barns to the roads. It needs many hands and much walking, but almost no gear."
  pp_grange_ox_carts: "Ox Carts"
  pp_grange_ox_carts_desc: "Slow ox carts haul the packed stores along the farm tracks to the roads. The oxen pull heavy loads and need fewer drivers than a line of porters."
  pp_grange_horse_wagons: "Horse Wagons"
  pp_grange_horse_wagons_desc: "Horse-drawn wagons with iron-shod wheels carry the stores faster and farther than oxen could. They need good horses and tools, but only a few drivers."
  pp_grange_surplus_sales: "Sell the Surplus"
  pp_grange_surplus_sales_desc: "When the [Concept('provincial_food', 'food store')|e] runs full, the landowners sell grain to local dealers before it spoils. When the store runs low, they hold it back for the province."
  pp_grange_loose_stores: "Loose Stores"
  pp_grange_loose_stores_desc: "No jars or casks are bought; the food leaves in sacks and heaps, and more of it spoils."
  pp_grange_pottery_jars: "Pottery Jars"
  pp_grange_pottery_jars_desc: "The landowners' servants seal grain, oil and dried food in large earthenware jars. Jars keep out damp and vermin far better than sacks, so less of the food spoils on the way."
  pp_grange_coopered_barrels: "Coopered Barrels"
  pp_grange_coopered_barrels_desc: "Coopers build tight casks for salted meat, flour and grain. A barrel can be rolled, stacked and shipped, and it keeps its contents dry on a long journey."
  pp_grange_tin_cans: "Tin Cans"
  pp_grange_tin_cans_desc: "Food is cooked and sealed in tinned iron cans, a method first used in the early nineteenth century to feed armies and navies. Canned food keeps for years and hardly spoils at all."
  pp_grange_price: "[ShowBuildingTypeName('grange')|e] Price"
  victualling_yard_tin_cans_advance: "Tin Cans"
  victualling_yard_tin_cans_advance_desc: "Develop canning and tinning methods that pack victuals in metal containers for longer transport and storage."
# <<< eu5-building-pipeline:grange:localization
