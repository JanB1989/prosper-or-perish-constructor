l_english:

# >>> eu5-building-pipeline:gun_smith:localization
  pp_gun_smith_price: "[ShowBuildingTypeName('gun_smith')|e] Price"
  pp_gun_smith_guns_guild_lumber_maintenance: "Wooden Barrels"
  pp_gun_smith_guns_guild_lumber_maintenance_desc: "The gun is a hardwood tube bound with iron bands, an expedient as old as the bamboo fire lances of China. It bursts easily and serves only at need."
  pp_gun_smith_guns_guild_bronze_maintenance: "Cast Bronze Barrels"
  pp_gun_smith_guns_guild_bronze_maintenance_desc: "Small gun barrels are cast in bronze by the founders, then bored and fitted to wooden stocks. Bronze does not rust and rarely bursts, though it costs far more than iron."
  pp_gun_smith_guns_guild_iron_maintenance: "Wrought Iron Barrels"
  pp_gun_smith_guns_guild_iron_maintenance_desc: "The gunsmith wraps a strip of iron around a mandrel and welds it in the forge into a barrel. He then bores it smooth and fits the lock and stock."
  pp_gun_smith_guns_guild_ammunition_lead_maintenance: "Lead Shot"
  pp_gun_smith_guns_guild_ammunition_lead_maintenance_desc: "Gunsmiths melt lead and pour it into bullet moulds, and grind saltpeter, sulphur and charcoal into the powder that the hand guns fire. Both are sold to every buyer of a gun."
  pp_gun_smith_guns_guild_ammunition_iron_maintenance: "Iron Shot"
  pp_gun_smith_guns_guild_ammunition_iron_maintenance_desc: "Where lead is scarce the smiths cut and hammer small iron shot and mix powder to go with it. Iron is harder than lead and wears the barrel more, but it serves."
  pp_gun_smith_market_sales: "Market Sales"
  pp_gun_smith_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  gun_smith_slot_2: "Market"
  pp_gun_smith_legacy_hand_cannon_guild_maintenance: "$hand_cannon_guild_maintenance$ (Old Ways)"
  pp_gun_smith_legacy_hand_cannon_guild_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('hand_cannon_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
# <<< eu5-building-pipeline:gun_smith:localization
