# >>> eu5-building-pipeline:guns_workshop:localization
  pp_guns_workshop_guns_workshop_bronze_maintenance: "Cast Bronze Barrels"
  pp_guns_workshop_guns_workshop_bronze_maintenance_desc: "The workshop casts light bronze barrels for hand guns and swivel pieces. Bronze does not rust in the salt air, so ships and coastal forts favour it."
  pp_guns_workshop_guns_workshop_iron_maintenance: "Wrought Iron Barrels"
  pp_guns_workshop_guns_workshop_iron_maintenance_desc: "Welded iron barrels are bored smooth on water-driven benches and fitted with matchlocks or flintlocks. Towns like Suhl, Liege and Brescia lived on this trade."
  pp_guns_workshop_guns_workshop_ammunition_lead_maintenance: "Lead Shot"
  pp_guns_workshop_guns_workshop_ammunition_lead_maintenance_desc: "Lead balls are cast in gang moulds that make many at once. The powder is corned, pressed into grains that burn evenly and keep better on campaign."
  pp_guns_workshop_guns_workshop_ammunition_iron_maintenance: "Iron Shot"
  pp_guns_workshop_guns_workshop_ammunition_iron_maintenance_desc: "The workshop casts small iron shot where lead is short, along with its powder. Iron balls are harder on the barrels than lead, so the smiths make them only at need."
  pp_guns_workshop_market_sales: "Market Sales"
  pp_guns_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  guns_workshop_slot_2: "Market"
  pp_guns_workshop_legacy_guns_guild_lumber_maintenance: "$guns_guild_lumber_maintenance$ (Old Ways)"
  pp_guns_workshop_legacy_guns_guild_lumber_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('gun_smith')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_guns_workshop_legacy_hand_cannon_guild_maintenance: "$hand_cannon_guild_maintenance$ (Old Ways)"
  pp_guns_workshop_legacy_hand_cannon_guild_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('hand_cannon_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
