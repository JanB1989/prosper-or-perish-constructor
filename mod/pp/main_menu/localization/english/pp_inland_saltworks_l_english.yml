  inland_saltworks_slot_0: "Inland Salt"
  inland_saltworks_slot_1: "Brine Working"
  inland_saltworks: "Inland Saltworks"
  inland_saltworks_desc: "Inland saltworks scrape dry salt flats and boil stronger brines from springs, wells, and salt lakes where the salt source is not a hard-rock mine."
  pp_inland_saltworks_base_salt: "Surveyed Inland Brine"
  pp_inland_saltworks_base_salt_desc: "The surveyed inland brine: what the springs and salt flats gives before the works improve on it."
  pp_inland_saltworks_salt_flat_scraping: "Salt-Flat Scraping"
  pp_inland_saltworks_salt_flat_scraping_desc: "Workers scrape the crust that the dry season leaves on the salt flats and pile it to drain."
  pp_inland_saltworks_open_pan_boiling: "Open-Pan Brine Boiling"
  pp_inland_saltworks_open_pan_boiling_desc: "Brine drawn from salt springs and wells is boiled over wood fires in wide shallow pans until the salt falls out. Towns like Luneburg and Droitwich lived for centuries on such panhouses and the wood they burnt."
  pp_inland_saltworks_market_sales: "Market Sales"
  pp_inland_saltworks_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  inland_saltworks_slot_2: "Market"
