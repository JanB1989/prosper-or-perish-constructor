# >>> eu5-building-pipeline:iron_mill:localization
  iron_mill_slot_0: "[ShowBuildingTypeName('iron_mill')|e] Work"
  pp_iron_mill_iron_mill_maintenance: "Iron Tools"
  pp_iron_mill_iron_mill_maintenance_desc: "Rolling and slitting mills turn bar iron into rod and plate. Machine shops cut, stamp and file tools and iron hardware from them in great quantity."
  pp_iron_mill_steel_tools: "Steel Tools"
  pp_iron_mill_steel_tools_desc: "The mill makes its tools of steel, which takes a hard, lasting edge and springs back where iron bends. Sheffield made its name with cutlery and edge tools of crucible steel."
  pp_iron_mill_market_sales: "Market Sales"
  pp_iron_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  iron_mill_slot_1: "Market"
  pp_iron_mill_legacy_bronze_tools_guild_maintenance: "$bronze_tools_guild_maintenance$ (Old Ways)"
  pp_iron_mill_legacy_bronze_tools_guild_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('tools_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_iron_mill_legacy_copper_tools_guild_maintenance: "$copper_tools_guild_maintenance$ (Old Ways)"
  pp_iron_mill_legacy_copper_tools_guild_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('tools_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
