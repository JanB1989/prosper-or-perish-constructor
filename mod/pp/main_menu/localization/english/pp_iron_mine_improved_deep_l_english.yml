# >>> eu5-building-pipeline:iron_mine_deep:localization
  iron_mine_deep_slot_0: "Iron Vein"
  iron_mine_deep_slot_1: "Deep Workings"
  iron_mine_deep: "Deep Iron Mine"
  iron_mine_deep_desc: "Drained shafts, stronger timbering, and regular ore dressing let iron mines work deeper veins with larger crews."
  pp_iron_mine_deep_base_iron: "Surveyed Deep Iron Vein"
  pp_iron_mine_deep_base_iron_desc: "The deep vein itself: what the ground gives before the drained shafts add to it."
  pp_iron_mine_deep_no_primary: "No Deep Iron Mining"
  pp_iron_mine_deep_no_primary_desc: "No deep veins are worked here, the works give only what the vein yields on its own."
  pp_iron_mine_deep_drainage_workings: "Drained Shaft Workings"
  pp_iron_mine_deep_drainage_workings_desc: "Rod pumps driven by water wheels keep the deep shafts dry, and tarred ropes haul the ore up. The miners follow the veins below the water level that stopped the older workings."
  pp_iron_mine_deep_slitting_ore: "Slitting-Mill Ore Supply"
  pp_iron_mine_deep_slitting_ore_desc: "The deep mine roasts and stamps its ore for the ironworks that feed the slitting mills, whose rods go to nail makers and wire drawers. A steady supply of clean ore keeps those forges busy."
  pp_iron_mine_deep_horse_whim_haulage: "Horse-Whim Haulage"
  pp_iron_mine_deep_horse_whim_haulage_desc: "Several horse whims stand over the deep shafts, winding ore from levels far below the first workings. Horses and harness do the lifting that engines would later take over."
  pp_iron_mine_deep_ore_dressing_floors: "Ore Dressing Floors"
  pp_iron_mine_deep_ore_dressing_floors_desc: "Even at a deep mine the oldest way still works: crews crush, wash and sort the ore by hand on wide floors with screens and sacks. It needs few tools and keeps the furnaces fed when tools are scarce."
  pp_iron_mine_deep_market_sales: "Market Sales"
  pp_iron_mine_deep_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  iron_mine_deep_slot_2: "Market"
# <<< eu5-building-pipeline:iron_mine_deep:localization
