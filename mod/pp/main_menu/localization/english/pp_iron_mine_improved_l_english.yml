  iron_mine_improved: "Iron Mine"
  iron_mine_improved_desc: "Timbered workings use dressing floors, haulage, and gangue sorting to prepare cleaner iron ore."
  pp_iron_mine_improved_base_iron: "Surveyed Iron Ore"
  pp_iron_mine_improved_base_iron_desc: "The surveyed ore itself: what the ground gives before the timbered workings add to it."
  pp_iron_mine_improved_no_primary: "No Iron Mining"
  pp_iron_mine_improved_no_primary_desc: "No ore is mined here; the works give only what the surveyed ore yields on its own."
  pp_iron_mine_improved_iron: "Timbered Ore Workings"
  pp_iron_mine_improved_iron_desc: "Timbered shafts and galleries follow the ore beds underground. Stamps break the ore, kilns roast it and the dressing floors sort it, so the ironworks receive steady loads of prepared ore."
  pp_iron_mine_improved_slitting_dressed_ore: "Slitting-Mill Ore Dressing"
  pp_iron_mine_improved_slitting_dressed_ore_desc: "The water-driven slitting mills cut bar iron into rods for nail makers, and their forges want iron of even quality. The miners dress and roast their ore with extra care to supply them."
  pp_iron_mine_improved_horse_whim_haulage: "Horse-Whim Haulage"
  pp_iron_mine_improved_horse_whim_haulage_desc: "Horse whims over the shafts wind ore up from timbered workings too deep for a hand windlass. Teams in harness take turns at the drum through the shift, and few tools are worn out."
  pp_iron_mine_improved_ore_dressing_floors: "Ore Dressing Floors"
  pp_iron_mine_improved_ore_dressing_floors_desc: "Larger dressing floors serve the timbered workings. Women and boys break, wash and pick the ore over screens, throwing out the stony waste so the furnaces get cleaner ore."
  pp_iron_mine_improved_market_sales: "Market Sales"
  pp_iron_mine_improved_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  iron_mine_improved_slot_2: "Market"
