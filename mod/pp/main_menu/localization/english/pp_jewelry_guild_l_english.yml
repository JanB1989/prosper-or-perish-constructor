l_english:

# >>> eu5-building-pipeline:jewelry_guild:localization
  pp_jewelry_guild_price: "[ShowBuildingTypeName('jewelry_guild')|e] Price"
  pp_jewelry_guild_gold_base: "Gold Jewelry"
  pp_jewelry_guild_gold_base_desc: "Goldsmiths hammer, cast and chase gold into rings, chains and plate. They often served as bankers too, since they kept precious metal in their strongrooms."
  pp_jewelry_guild_silver_base: "Silver Jewelry"
  pp_jewelry_guild_silver_base_desc: "Silversmiths raise cups and dishes from sheet silver and make buckles, clasps and filigree. Their work is assayed by the guild and stamped to show its purity."
  pp_jewelry_guild_copper_base: "Copper Jewelry"
  pp_jewelry_guild_copper_base_desc: "Copper and brass are worked into cheaper rings, pins, buckles and ornaments, often gilded to look like gold. They sell to buyers who cannot afford the precious metals."
  pp_jewelry_guild_gems_base: "Gem Cutting"
  pp_jewelry_guild_gems_base_desc: "Lapidaries grind facets into gems on a turning wheel charged with abrasive paste, so they catch the light. Diamond cutting grew into a great trade in Antwerp and later Amsterdam."
  pp_jewelry_guild_ivory_enhancement: "Ivory Enhancements"
  pp_jewelry_guild_ivory_enhancement_desc: "Carvers work elephant ivory from Africa and India into inlays, plaques, combs and handles. The goldsmiths set these into their caskets, crucifixes, brooches and jewellery."
  pp_jewelry_guild_amber_enhancement: "Amber Enhancements"
  pp_jewelry_guild_amber_enhancement_desc: "Baltic amber is cut and polished into beads, rosaries and inlays. The Teutonic Order once held the amber of the Prussian coast as a monopoly."
  pp_jewelry_guild_gems_enhancement: "Gem Enhancements"
  pp_jewelry_guild_gems_enhancement_desc: "The goldsmiths set polished gems into rings, pendants, reliquaries and crowns. The stones came from India, Ceylon and Persia along the long overland and sea trade routes."
  pp_jewelry_guild_pearls_enhancement: "Pearl Enhancements"
  pp_jewelry_guild_pearls_enhancement_desc: "Pearls from the Gulf and the waters of Ceylon are drilled and strung, or set into the metalwork. They were among the most prized jewels of every court."
  pp_jewelry_guild_market_sales: "Market Sales"
  pp_jewelry_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  jewelry_guild_slot_2: "Market"
# <<< eu5-building-pipeline:jewelry_guild:localization
