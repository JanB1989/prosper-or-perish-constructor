  lead_mine_bole_smelting: "Bole Lead Mine"
  lead_mine_bole_smelting_desc: "Wind-fed bole hearths smelt dressed galena on exposed uplands. Better ore handling lets lead works process more mine output and sort minor precious-metal values."
  pp_lead_mine_bole_base_lead: "Open Galena Vein"
  pp_lead_mine_bole_base_lead_desc: "The galena vein itself: what the open vein gives before any miner improves on it."
  pp_lead_mine_bole_no_primary: "No Bole Smelting"
  pp_lead_mine_bole_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_lead_mine_bole_lead: "Bole-Smelted Galena Workings"
  pp_lead_mine_bole_lead_desc: "Dressed galena is piled with wood on a hilltop hearth facing the prevailing wind, which blows the fire hot enough to run the lead out. Bole hills like these smelted the lead of the Peak District and the Pennines."
  pp_lead_mine_bole_no_secondary: "No Precious Metal Recovery"
  pp_lead_mine_bole_no_secondary_desc: "No precious metal is recovered here, the lead goes to market as it is smelted."
  pp_lead_mine_bole_silver: "Bole Silver Picking"
  pp_lead_mine_bole_silver_desc: "Silver hides in much galena. The refiners melt the lead on a bone-ash hearth and blow air over it until the lead turns to litharge and the bright silver remains."
  pp_lead_mine_bole_gold: "Bole Gold Picking"
  pp_lead_mine_bole_gold_desc: "A little gold travels with some lead ores. After cupellation the refiners part it from the silver and keep the few grains apart. It is a rare and small extra for the works."
  pp_lead_mine_bole_smelting_market_sales: "Market Sales"
  pp_lead_mine_bole_smelting_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  lead_mine_bole_smelting_slot_3: "Market"
