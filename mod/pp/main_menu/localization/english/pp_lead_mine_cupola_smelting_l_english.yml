  lead_mine_cupola_smelting: "Cupola Lead Mine"
  lead_mine_cupola_smelting_desc: "Cupola furnaces, stronger haulage, and dressing floors support deeper galena workings. Silver and gold recovery remain minor parts of the trade."
  pp_lead_mine_cupola_base_lead: "Deep Galena Vein"
  pp_lead_mine_cupola_base_lead_desc: "The deep galena vein itself: what the worked vein gives before any miner improves on it."
  pp_lead_mine_cupola_no_primary: "No Cupola Smelting"
  pp_lead_mine_cupola_no_primary_desc: "No cupola furnace is fired; a few hands only work the vein and smelt its ore in small hearths."
  pp_lead_mine_cupola_lead: "Cupola Galena Workings"
  pp_lead_mine_cupola_lead_desc: "The cupola is a reverberatory furnace in which a coal fire heats the ore without touching it, so cheap coal can replace scarce wood. Introduced in Britain in the late seventeenth century, it let deeper and larger mines smelt their lead."
  pp_lead_mine_cupola_no_secondary: "No Precious Metal Recovery"
  pp_lead_mine_cupola_no_secondary_desc: "No precious metal is recovered here; the lead goes to market as it is smelted."
  pp_lead_mine_cupola_silver: "Cupola Silver Dressing"
  pp_lead_mine_cupola_silver_desc: "At the dressing floors the richest silver-bearing galena is set aside. Its lead is cupelled in larger batches, and the bright silver left on the hearth is sold apart."
  pp_lead_mine_cupola_gold: "Cupola Gold Dressing"
  pp_lead_mine_cupola_gold_desc: "The few traces of gold in the ore are parted from the cupelled silver and sold apart. It is a small but steady addition to the lead trade."
  pp_lead_mine_cupola_smelting_market_sales: "Market Sales"
  pp_lead_mine_cupola_smelting_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
