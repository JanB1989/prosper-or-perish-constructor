# >>> eu5-building-pipeline:lead_mine:localization
  lead_mine_slot_0: "Galena Vein"
  lead_mine_slot_1: "Precious Metal Recovery"
  lead_mine_slot_2: "Lead Workings"
  lead_mine: "Lead Mine"
  lead_mine_desc: "Shallow headings and open cuts work galena veins for lead ore. The ore is broken, washed, and sorted near the mine, with silver- and gold-bearing pieces picked out when found."
  pp_lead_mine_base_lead: "Exposed Galena Vein"
  pp_lead_mine_base_lead_desc: "The exposed galena vein itself: what the ground gives before any miner improves on it."
  pp_lead_mine_no_primary: "No Lead Mining"
  pp_lead_mine_no_primary_desc: "No galena is mined here; the mine gives only what its vein yields on its own."
  pp_lead_mine_lead: "Galena Vein Workings"
  pp_lead_mine_lead_desc: "Shallow shafts and open cuts follow the galena vein. The ore is broken, washed and sorted near the mine, then smelted on wood and charcoal hearths into pigs of lead for roofs, pipes and pewter."
  pp_lead_mine_hushing: "Hushing"
  pp_lead_mine_hushing_desc: "The miners dam a stream above the hillside and release the water in one rush. The flood tears away soil and loose rock and lays bare the galena veins below, which are then worked with picks."
  pp_lead_mine_no_secondary: "No Precious Metal Recovery"
  pp_lead_mine_no_secondary_desc: "No silver or gold is drawn from the galena here; the miners keep to the lead."
  pp_lead_mine_silver: "Silver-Galena Picking"
  pp_lead_mine_silver_desc: "Much galena carries silver. The richest ore is smelted to lead, and the lead is burnt away on a hearth of bone ash until only a bright bead of silver is left behind."
  pp_lead_mine_gold: "Auriferous Galena Picking"
  pp_lead_mine_gold_desc: "Now and then a galena vein carries gold. The pickers set those stones aside, and the gold stays with the silver when the lead is burnt off on the hearth, to be parted from it later."
  pp_lead_mine_market_sales: "Market Sales"
  pp_lead_mine_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  lead_mine_slot_3: "Market"
# <<< eu5-building-pipeline:lead_mine:localization
