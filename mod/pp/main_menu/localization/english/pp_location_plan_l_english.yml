l_english:
  # Location Plan (gui/pp_location_plan.gui, the location window's row "Also build here", map mode pp_location_plan):
  # what the player marks in a location; the Construction Plan builds the marked items there (pp_lplan_location_turn)
  PP_LPLAN_TITLE: "Location Plan"
  PP_LPLAN_LOCATION_BUTTON: "Location Plan: mark what the Construction Plan should also build in this location"
  PP_LPLAN_NONE_PICKED: "No location picked. Open a location of yours and click the plan button next to its name."
  PP_LPLAN_SHOW_MAP: "Show on map"
  PP_LPLAN_SHOW_MAP_TT: "Switch to the Location Plan map mode: your marks as icons over your locations"
  PP_LPLAN_CLEAR: "Clear"
  PP_LPLAN_CLEAR_TT: "Remove every mark from this location"
  PP_LPLAN_NOTE: "A mark builds this here, level after level, from the Locations budget of the Construction Plan, whether it pays or not. A marked good gets more levels of a building here that makes it, and a first such building where none stands. To mark one building, hold Ctrl and click it among this location's buildings, or tick its checkbox beside this location in the build panel. The Location Plan map mode shows the marks as icons over your locations: a good green once the location makes it, a building green once it or a newer kind of it stands there, red while not."
  PP_LPLAN_PLANNED: "Also build here"
  PP_LPLAN_COUNTS: "#weak [Location.MakeScope.ScriptValue('pp_lplan_done_n')|0] of [Location.MakeScope.ScriptValue('pp_lplan_goods_n')|0] marked goods made here already#!"
  PP_LPLAN_NOTHING_YET: "#weak Nothing marked yet#!"
  PP_LPLAN_PICK_ON: "#G Marked:#! the Construction Plan builds this here, level after level, from the Locations budget. Click to remove the mark."
  PP_LPLAN_PICK_OFF: "Click to mark it: the Construction Plan then builds this here, level after level, from the Locations budget, whether it pays or not."
  PP_LPLAN_STATE_DONE: "#G Here already:#! this location makes it."
  # a building's own mark (the location window's building tiles, the build panel's checkbox, the tiles of marked buildings)
  PP_LPLAN_BMARK_OFF: "Mark for the Construction Plan: it then builds this building here, level after level, from the Locations budget, whether it pays or not"
  PP_LPLAN_BMARK_ON: "Remove the Construction Plan's mark: it stops building this building here"
  PP_LPLAN_BMARK_ALL: "Mark this building for the Construction Plan in all your locations where it stands, or remove the mark from all of them when every one is marked already"
  PP_LPLAN_BMARK_ICON: "Marked: the Construction Plan builds this building here, level after level, from the Locations budget. Hold Ctrl and click the building to remove the mark."
  PP_LPLAN_BMARK_TILE_TEXT: "#G Marked:#! the Construction Plan builds this building here, level after level, from the Locations budget: a newer kind once you have researched one, and an upgrade where an older kind stands. Click to remove the mark."
  PP_LPLAN_BMARK_DONE: "#G Here already:#! this building, or a newer kind of it, stands in this location."
  PP_LPLAN_STATE_OPEN: "#R Not here yet#!"
  PP_LPLAN_GROUP_FARMING: "Farming"
  PP_LPLAN_GROUP_FORESTRY: "Forestry"
  PP_LPLAN_GROUP_GATHERING: "Gathering"
  PP_LPLAN_GROUP_HUNTING: "Hunting"
  PP_LPLAN_GROUP_MANUFACTURED: "Manufactured goods"
  PP_LPLAN_GROUP_MINING: "Mining"
  PP_LPLAN_GROUP_BUILDINGS: "Buildings"
  # the location window's row under the Profile row
  PP_LPLAN_ALSO_TITLE: "Also build here"
  PP_LPLAN_ALSO_NONE: "Nothing marked"
  PP_LPLAN_ALSO_COUNT: "[Location.MakeScope.ScriptValue('pp_lplan_planned_n')|0] marked, more in the Location Plan"
  PP_LPLAN_ALSO_MORE_TT: "#T Location Plan#!\nOpen this location in the Location Plan window, with every good to mark. To mark one building, hold Ctrl and click it among the buildings below."
  # map mode
  game_concept_pp_location_plan: "Location Plan"
  game_concept_pp_location_plan_desc: "What the Construction Plan should also build in each of your [locations|e], marked in the location window (Also build here) or in the Location Plan window (the plan button next to a location's name). The map mode shows the marks as icons over your locations: a good green once the location makes it, a building green once it or a newer kind of it stands there, red while not."
  mapmode_pp_location_plan_name: "Location Plan"
  MAPMODE_PP_LOCATION_PLAN: "#T $mapmode_pp_location_plan_name$#!\nWhat the Construction Plan should also build in each of your [locations|e], marked in the location window or the Location Plan window, as icons over each location: green once the location makes or has it, red while it does not. Hover an icon to see what it is and how its last check went."
  MAPMODE_PP_LOCATION_PLAN_DONE: "Marked, here already"
  MAPMODE_PP_LOCATION_PLAN_OPEN: "Marked, not here yet"
