l_english:
  # Location Plan (gui/pp_location_plan.gui, the location window's row "Also build here", map mode pp_location_plan):
  # what the player marks in a location; the Construction Plan builds the marked items there (pp_lplan_mark)
  PP_LPLAN_TITLE: "Location Plan"
  PP_LPLAN_LOCATION_BUTTON: "Location Plan: mark what the Construction Plan should also build in this location"
  PP_LPLAN_NONE_PICKED: "No location picked. Open a location of yours and click the plan button next to its name."
  PP_LPLAN_SHOW_MAP: "Show on map"
  PP_LPLAN_SHOW_MAP_TT: "Switch to the Location Plan map mode: your marks as icons over your locations"
  PP_LPLAN_CLEAR: "Clear"
  PP_LPLAN_CLEAR_TT: "Remove every mark from this location"
  PP_LPLAN_NOTE: "Mark what the Construction Plan should also build in this location, on top of its profile and your global settings. A marked good gets more levels of a building that makes it while the next level pays back within your Businesses limit, and a first building where none stands; a marked kind of building works the same way. The Location Plan map mode shows the marks as icons over your locations: green once the location makes or has it, red while it does not."
  PP_LPLAN_PLANNED: "Also build here"
  PP_LPLAN_COUNTS: "#weak [Location.MakeScope.ScriptValue('pp_lplan_done_n')|0] of [Location.MakeScope.ScriptValue('pp_lplan_planned_n')|0] here already#!"
  PP_LPLAN_NOTHING_YET: "#weak Nothing marked yet#!"
  PP_LPLAN_PICK_ON: "#G Marked:#! the Construction Plan also builds this here. Click to remove the mark."
  PP_LPLAN_PICK_OFF: "Click to mark it: the Construction Plan then also builds this here, while it pays back within your Businesses limit."
  PP_LPLAN_STATE_DONE: "#G Here already:#! this location makes it, or has such a building."
  PP_LPLAN_STATE_OPEN: "#R Not here yet#!"
  PP_LPLAN_GROUP_FARMING: "Farming"
  PP_LPLAN_GROUP_FORESTRY: "Forestry"
  PP_LPLAN_GROUP_GATHERING: "Gathering"
  PP_LPLAN_GROUP_HUNTING: "Hunting"
  PP_LPLAN_GROUP_MANUFACTURED: "Manufactured goods"
  PP_LPLAN_GROUP_MINING: "Mining"
  PP_LPLAN_GROUP_BUILDINGS: "Buildings"
  # the location window's row under the Profile row
  PP_LPLAN_ALSO_TITLE: "Also build here"
  PP_LPLAN_ALSO_NONE: "Nothing marked"
  PP_LPLAN_ALSO_COUNT: "[Location.MakeScope.ScriptValue('pp_lplan_planned_n')|0] marked, more in the Location Plan"
  PP_LPLAN_ALSO_MORE_TT: "#T Location Plan#!\nOpen this location in the Location Plan window, with every good and kind of building to mark."
  # map mode
  game_concept_pp_location_plan: "Location Plan"
  game_concept_pp_location_plan_desc: "What the Construction Plan should also build in each of your [locations|e], marked in the location window (Also build here) or in the Location Plan window (the plan button next to a location's name). The map mode shows the marks as icons over your locations: green once the location makes or has it, red while it does not."
  mapmode_pp_location_plan_name: "Location Plan"
  MAPMODE_PP_LOCATION_PLAN: "#T $mapmode_pp_location_plan_name$#!\nWhat the Construction Plan should also build in each of your [locations|e], marked in the location window or the Location Plan window, as icons over each location: green once the location makes or has it, red while it does not. Hover an icon to see what it is and how its last check went."
  MAPMODE_PP_LOCATION_PLAN_DONE: "Marked, here already"
  MAPMODE_PP_LOCATION_PLAN_OPEN: "Marked, not here yet"
