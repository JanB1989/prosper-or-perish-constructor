l_english:
  # Location Plan (gui/pp_location_plan.gui, the location window's Plans row, map mode pp_location_plan): what the
  # player decides a location is for, as plans (markers on the location, pp_tplan_p_<plan>); the Construction Plan
  # builds toward them
  PP_LPLAN_TITLE: "Location Plan"
  PP_LPLAN_LOCATION_BUTTON: "Location Plan: decide what this location is for, and the Construction Plan builds toward it"
  PP_LPLAN_NONE_PICKED: "No location picked. Open a location of yours and click the plan button next to its name."
  PP_LPLAN_SHOW_MAP: "Show on map"
  PP_LPLAN_SHOW_MAP_TT: "Switch to the Location Plan map mode: the plans of your [locations|e] as icons, and the [town_rights|e] they hold"
  PP_LPLAN_CLEAR: "Clear"
  PP_LPLAN_CLEAR_TT: "Take every plan off this location"
  PP_LPLAN_NOTE: "Click what this location is for: goods, Food or Trade, as many as you like. The Construction Plan builds toward every plan."
  PP_LPLAN_OFF: "The Construction Plan is switched off. Your plans are kept, and nothing is built until it runs."
  PP_LPLAN_SWITCH_ON: "Switch on"
  PP_LPLAN_SWITCH_ON_TT: "Switch the Construction Plan on: it builds every month from the gold above its reserve, for your plans and by its other rules. Its window holds the settings."
  PP_LPLAN_NOTHING_YET: "#weak No plan yet#!"
  PP_LPLAN_GROUP_FARMING: "Farming"
  PP_LPLAN_GROUP_FORESTRY: "Forestry"
  PP_LPLAN_GROUP_GATHERING: "Gathering"
  PP_LPLAN_GROUP_HUNTING: "Hunting"
  PP_LPLAN_GROUP_MANUFACTURED: "Manufactured goods"
  PP_LPLAN_GROUP_MINING: "Mining"
  PP_LPLAN_GROUP_PLANS: "Food and trade"
  PP_LPLAN_GROUP_BUILDINGS: "Buildings"
  # a plan's tile (the picker, the location window's Plans row); the plan's name and state are generated
  PP_TPLAN_NAME_FOOD: "[food|e]"
  PP_TPLAN_NAME_TRADE: "[trade|e]"
  PP_TPLAN_WHAT_GOOD: "The Construction Plan builds the buildings that make this good here: more levels where one stands, a first one where none does, a newer kind once you have researched it, and a higher rank for the location where they need one."
  PP_TPLAN_WHAT_FOOD: "The Construction Plan builds the buildings that feed this location's [province|e] here."
  PP_TPLAN_WHAT_TRADE: "The Construction Plan builds the trade buildings here."
  PP_TPLAN_PICK_ON: "#G Planned.#! Click to take the plan off."
  PP_TPLAN_PICK_OFF: "Click to plan it. The plan has no conditions, gives no bonus by itself and stays until you take it off."
  PP_TPLAN_EMPTY: ""
  PP_TPLAN_NONE: "No building makes this good, so nothing can be planned for it."
  # the location window's Plans row (Infrastructure tab)
  PP_TPLAN_ROW_TITLE: "Plans"
  PP_TPLAN_ROW_NONE: "No plan yet"
  PP_TPLAN_ROW_COUNT: "[Location.MakeScope.ScriptValue('pp_tplan_n')|0] plans, all of them in the Location Plan"
  PP_TPLAN_ROW_MORE_TT: "#T Location Plan#!\nOpen this location in the Location Plan window and pick what it is for: the Construction Plan builds toward its plans."
  # the map marker's icons after the plans: the location's town rights (a plan's own tooltip is generated)
  PP_TPLAN_MAP_RIGHT: "#T [TownRights.GetName]#!\nOne of this location's [town_rights|e]."
  # map mode
  game_concept_pp_location_plan: "Location Plan"
  game_concept_pp_location_plan_desc: "What each of your [locations|e] is for: its plans, set in the Location Plan window (the plan button next to a location's name, or the Plans row of the location window). A plan has no conditions and gives no bonus by itself: the Construction Plan builds toward it and, where its settings allow it, grants the plan's charter among the location's [town_rights|e]. The map mode shows the plans of your locations as icons, and the town rights they hold."
  mapmode_pp_location_plan_name: "Location Plan"
  MAPMODE_PP_LOCATION_PLAN: "#T $mapmode_pp_location_plan_name$#!\nThe plans of each of your [locations|e] as icons: what the Construction Plan builds toward there. After them, the [town_rights|e] the location holds. Hover an icon to see which it is."
  # the padlock on each pop type row of the location window's buildings list (plan_closer.py "The row lock")
  PP_ROW_LOCK_CLOSE: "Close this row's producing buildings"
  PP_ROW_LOCK_OPEN: "Open this row's producing buildings"
  PP_ROW_LOCK_TITLE_OPEN: "Producing Buildings Open"
  PP_ROW_LOCK_TITLE_CLOSED: "Producing Buildings Closed"
  PP_ROW_LOCK_DESC: "One click closes every one of our [buildings|e] in this row that has a [production_method|e], so its [pops|e] are free for other work. The next click opens them all again."
