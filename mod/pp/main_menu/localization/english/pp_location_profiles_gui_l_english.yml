l_english:
  # Generated by ppc finalize (location_profiles_gui.py) from [location_profiles]; do not edit by hand.
  PP_LPROF_UI_TITLE: "Location Profiles"
  PP_LPROF_UI_NOTE: "A profile is an icon, a colour and build rules in order. Give it to your locations in the location window, the Location Plan window, with the map's right-click menu, or paint it onto the map in the Location Plan map mode. Where a location has a profile, its rules build there; the global settings still build there what the profile does not name, unless the profile switches them off."
  PP_LPROF_UI_YOURS: "Your profiles"
  PP_LPROF_UI_PAINT_MAP: "Paint on map"
  PP_LPROF_UI_PAINT_MAP_TT: "Switch to the Location Plan map mode: each location shows its profile, and the palette on the left paints profiles onto your locations"
  PP_LPROF_UI_NEW_TT: "#T New profile#!\nMake a new profile and edit it here."
  PP_LPROF_UI_EXAMPLES: "Start with the examples"
  PP_LPROF_UI_EXAMPLES_TT: "#T Example profiles#!\nMake a few ready profiles to look at and change: a breadbasket, a mining town, a lumber camp, a market town, a harbour, and one that keeps the plan out of its locations. Give them to locations like your own."
  PP_LPROF_UI_CLICK_EDIT: "Click to edit this profile."
  PP_LPROF_UI_CLICK_ASSIGN: "Click to give this location this profile."
  PP_LPROF_UI_CLICK_BRUSH: "Click to paint with this profile: then click your locations on the map. Click it again to stop painting."
  PP_LPROF_UI_PICK_SLOT: "Pick a profile above to edit it, or make a new one with the plus."
  PP_LPROF_UI_ICON: "Icon"
  PP_LPROF_UI_ICON_TT: "Click to choose the profile's icon from the list below: a good, a building category or a symbol"
  PP_LPROF_UI_COLOR: "Colour"
  PP_LPROF_UI_COLOR_TT: "Give the profile this colour"
  PP_LPROF_UI_DELETE: "Delete"
  PP_LPROF_UI_DELETE_TT: "#T Delete this profile#!\nEvery location that has it loses it; the Construction Plan's rules apply there again."
  PP_LPROF_UI_RULES: "Build rules"
  PP_LPROF_UI_RULES_NOTE: "Checked from the top each month in every location with this profile, while the Construction Plan is on: the first rule that starts a construction ends the month there. A good expands a producer of it that pays back in time, or starts one where none stands; a building category does the same for its buildings."
  PP_LPROF_UI_GLOBAL: "Global rules here"
  PP_LPROF_UI_GLOBAL_NOTE: "The global rule groups still build in this profile's locations, except what the profile's rules name (a good, a building category, market access). Untick a group to keep it out of these locations. What you mark in a location itself is built there either way."
  PP_LPROF_UI_GLOBAL_FOOD: "Food"
  PP_LPROF_UI_GLOBAL_FOOD_TT: "#T Food rule here#!\nTicked: the food rule builds here too (farms, kitchens, Taverns, Granaries, Granges, Victualling Yards), except staple food makers when a rule here names a staple food. Click to switch."
  PP_LPROF_UI_GLOBAL_LOGISTICS: "Logistics"
  PP_LPROF_UI_GLOBAL_LOGISTICS_TT: "#T Logistics rule here#!\nTicked: the logistics rule builds here too, unless a rule here names market access. Click to switch."
  PP_LPROF_UI_GLOBAL_IMPROVE: "Improvements"
  PP_LPROF_UI_GLOBAL_IMPROVE_TT: "#T Improvements rule here#!\nTicked: the improvements rule builds here too. Click to switch."
  PP_LPROF_UI_GLOBAL_BUSINESS: "Businesses"
  PP_LPROF_UI_GLOBAL_BUSINESS_TT: "#T Businesses rule here#!\nTicked: the businesses rule builds here too (buildings that make goods and pay back in time), except buildings of the goods and building categories a rule here names. Click to switch."
  PP_LPROF_UI_GLOBAL_COUNTRY: "Towns and Buildings"
  PP_LPROF_UI_GLOBAL_COUNTRY_TT: "#T Towns and Buildings rule here#!\nTicked: the towns and buildings rule works here too. Click to switch."
