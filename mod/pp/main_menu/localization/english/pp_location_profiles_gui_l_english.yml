  PP_LPROF_UI_TARGET_TT: "Click to choose what this rule builds from the list below"
  PP_LPROF_UI_EMPTY_RULE: "Empty rule"
  PP_LPROF_UI_MARKET_ACCESS: "Market access"
  PP_LPROF_UI_YEARS: "years"
  PP_LPROF_UI_PB_ANY: "any payback"
  PP_LPROF_UI_PB_TT: "#T Payback limit#!\nA level is expanded only if its build cost pays back from its profit in fewer years than this. A building's first level here has no profit to measure yet and is always allowed."
