  PP_LPROF_UI_TITLE: "Location Profiles"
  PP_LPROF_UI_NOTE: "A profile is an icon, a colour and build rules in order. Give it to your locations in the Location Plan window, with the map's right-click menu, or paint it onto the map in the Location Plan map mode. Where a location has a profile, its rules build there instead of the Construction Plan's rules."
  PP_LPROF_UI_YOURS: "Your profiles"
  PP_LPROF_UI_PAINT_MAP: "Paint on map"
