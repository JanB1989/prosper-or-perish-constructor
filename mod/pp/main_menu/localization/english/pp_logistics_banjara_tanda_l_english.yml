# >>> eu5-building-pipeline:pp_banjara_tanda:localization
  pp_banjara_tanda_slot_0: "Clan Network"
  pp_banjara_tanda_slot_1: "Bullock Trains"
  pp_banjara_tanda: "Banjara Tanda"
  pp_banjara_tanda_desc: "The camp of a Banjara carrying clan, whose great herds of pack bullocks move grain, salt and cloth between the villages and the markets of the subcontinent. Whole families travel with the tanda and settle it wherever the grazing is good."
  pp_banjara_tanda_construction: "[ShowBuildingTypeName('pp_banjara_tanda')|e] Construction"
  pp_banjara_tanda_pack_bullocks: "Pack Bullocks"
  pp_banjara_tanda_pack_bullocks_desc: "The tanda moves its goods on the backs of great herds of pack bullocks that graze as they go. Mughal and later armies relied on the Banjara herds for their grain."
  pp_banjara_tanda_tanda_families: "Tanda Families"
  pp_banjara_tanda_tanda_families_desc: "Whole families walk with the tanda, loading, herding and guarding the animals themselves. Fewer bullocks carry the goods, and the people carry and tend the rest on the long march."
  pp_banjara_tanda_bullock_carts: "Bullock Carts"
  pp_banjara_tanda_bullock_carts_desc: "Where the roads allow, the Banjaras put their bullocks to heavy two-wheeled carts. A cart moves more than a pack animal, but it needs timber, tools and a road."
  pp_banjara_tanda_logistics_network: "Tanda Network"
  pp_banjara_tanda_logistics_network_desc: "Kinship ties between the camps let loads pass from one tanda to the next along the grazing routes, even when the camp's own herds are thin."
# <<< eu5-building-pipeline:pp_banjara_tanda:localization
