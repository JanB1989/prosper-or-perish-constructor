# >>> eu5-building-pipeline:pp_caravanserai:localization
  pp_caravanserai_slot_0: "Caravan Network"
  pp_caravanserai_slot_1: "Caravan Crews"
  pp_caravanserai: "Caravanserai"
  pp_caravanserai_desc: "A walled courtyard of stables, storerooms and lodgings, a day's march from the next along the caravan roads. Camel strings rest and water here, and the merchants' loads move on to the market under one roof."
  pp_caravanserai_construction: "[ShowBuildingTypeName('pp_caravanserai')|e] Construction"
  pp_caravanserai_pack_camels: "Pack Camels"
  pp_caravanserai_pack_camels_desc: "Strings of camels carry bales and sacks from one caravanserai to the next, a day's march apart. Camels bear heavy loads across dry country on little water."
  pp_caravanserai_camel_drivers: "Camel Drivers"
  pp_caravanserai_camel_drivers_desc: "Drivers lead fewer camels and load and carry much by hand, resting at the caravanserai between stages. It takes many hands and much food, but few animals."
  pp_caravanserai_escorted_caravans: "Escorted Caravans"
  pp_caravanserai_escorted_caravans_desc: "Large caravans travel with armed horsemen and written permits, so bandits and toll keepers take less. The caravanserai keeps the ledgers, the passes and the escorts' horses."
  pp_caravanserai_logistics_network: "Caravan Network"
  pp_caravanserai_logistics_network_desc: "Merchants' agents arrange loads from one caravanserai to the next, so some caravans keep moving even when the courtyard's own stables stand empty."
# <<< eu5-building-pipeline:pp_caravanserai:localization
