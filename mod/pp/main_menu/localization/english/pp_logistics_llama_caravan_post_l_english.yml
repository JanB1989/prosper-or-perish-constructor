# >>> eu5-building-pipeline:pp_llama_caravan_post:localization
  pp_llama_caravan_post_slot_0: "Mountain Network"
  pp_llama_caravan_post_slot_1: "Mountain Trains"
  pp_llama_caravan_post: "Llama Caravan Post"
  pp_llama_caravan_post_desc: "Corrals, storehouses and resting places on the mountain roads, where llama trains and porters carry maize, wool and salt. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands in the Andes and needs no road."
  pp_llama_caravan_post_construction: "[ShowBuildingTypeName('pp_llama_caravan_post')|e] Construction"
  pp_llama_caravan_post_llama_trains: "Llama Trains"
  pp_llama_caravan_post_llama_trains_desc: "Herders drive trains of llamas, each with a light load of wool, maize or salt, up and down the mountain roads. Llamas thrive at heights where horses soon tire."
  pp_llama_caravan_post_porters: "Porters"
  pp_llama_caravan_post_porters_desc: "Porters carry the loads on their backs over the high passes, as carriers did on the Inca roads. They eat maize from the post's stores on the way."
  pp_llama_caravan_post_storehouse_relays: "Storehouse Relays"
  pp_llama_caravan_post_storehouse_relays_desc: "Goods move from storehouse to storehouse along the road, each stage handing on to the next, as in the Inca system of qollqa and tambos. Loads keep moving without anyone making the whole journey."
  pp_llama_caravan_post_logistics_network: "Chasqui Relay"
  pp_llama_caravan_post_logistics_network_desc: "Runners and storekeepers of the tambos pass loads along the mountain roads from one post to the next, even when the post's own llama trains are wanting."
# <<< eu5-building-pipeline:pp_llama_caravan_post:localization
