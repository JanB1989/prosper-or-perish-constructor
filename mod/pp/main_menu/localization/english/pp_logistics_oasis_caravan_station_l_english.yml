# >>> eu5-building-pipeline:pp_oasis_caravan_station:localization
  pp_oasis_caravan_station_slot_0: "Desert Network"
  pp_oasis_caravan_station_slot_1: "Desert Crossings"
  pp_oasis_caravan_station: "Oasis Caravan Station"
  pp_oasis_caravan_station_desc: "Wells, palm groves and store rooms mark the stations of the desert roads, where camel trains water before the long crossings. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands in the Sahara and the Sahel and needs no road."
  pp_oasis_caravan_station_construction: "[ShowBuildingTypeName('pp_oasis_caravan_station')|e] Construction"
  pp_oasis_caravan_station_camel_train: "Camel Train"
  pp_oasis_caravan_station_camel_train_desc: "Camel trains cross the desert from well to well, carrying goods between the oases and the towns of the Sahel. The station keeps water and fodder ready."
  pp_oasis_caravan_station_caravan_crews: "Caravan Crews"
  pp_oasis_caravan_station_caravan_crews_desc: "Crews lead fewer camels and load, guard and carry much of the cargo themselves from oasis to oasis. It needs many people and much food for the crossing."
  pp_oasis_caravan_station_azalai: "Azalai"
  pp_oasis_caravan_station_azalai_desc: "The azalai are the great salt caravans that cross the Sahara from the salt mines to Timbuktu and the Sahel. They travel in the cool season and in great numbers for safety."
  pp_oasis_caravan_station_logistics_network: "Well Keepers"
  pp_oasis_caravan_station_logistics_network_desc: "Families who keep the wells clear and the palms watered make the station a sure halt, so some camel trains keep crossing even when its own stores run dry."
# <<< eu5-building-pipeline:pp_oasis_caravan_station:localization
