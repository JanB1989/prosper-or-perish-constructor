l_english:

# >>> eu5-building-pipeline:pp_yam_station:localization
  pp_yam_station_slot_0: "Relay Network"
  pp_yam_station_slot_1: "Relay Stages"
  pp_yam_station: "Yam Station"
  pp_yam_station_desc: "A relay post of the great courier network, with fresh horses, sledges and provisions kept ready for the next stage. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands from Russia to Mongolia and needs no road."
  pp_yam_station_construction: "[ShowBuildingTypeName('pp_yam_station')|e] Construction"
  pp_yam_station_post_horses: "Post Horses"
  pp_yam_station_post_horses_desc: "Fresh horses wait at every station, so riders and carts change mounts and press on. The Mongol yam carried messages and goods across the empire this way."
  pp_yam_station_yamshchik_drivers: "Yamshchik Drivers"
  pp_yam_station_yamshchik_drivers_desc: "The yamshchiks, coachmen settled in post villages along the road, drive the stages themselves with fewer horses and much hard work. Russia kept its long post roads running with such drivers for centuries."
  pp_yam_station_sledge_relays: "Sledge Relays"
  pp_yam_station_sledge_relays_desc: "In winter the stations switch to sledges, which glide over snow and ice with heavy loads. Drivers wrapped in furs change teams at every post."
  pp_yam_station_logistics_network: "Relay Post"
  pp_yam_station_logistics_network_desc: "The station keeps its place in the courier relay, passing news and small loads from stage to stage even when its own horses and sledges are wanting."
# <<< eu5-building-pipeline:pp_yam_station:localization
