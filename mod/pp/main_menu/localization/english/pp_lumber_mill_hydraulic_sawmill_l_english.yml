# >>> eu5-building-pipeline:water_sawmill:localization
  pp_water_sawmill_base_lumber: "Woodland Cutting"
  pp_water_sawmill_base_lumber_desc: "The surveyed woodland: what the forest gives before the works improve on it."
  pp_water_sawmill_no_elephants: "No Forest Elephants"
  pp_water_sawmill_no_elephants_desc: "No elephants work here, the logs move by hand and by draught teams."
  pp_water_sawmill_elephant_skidding: "Elephant Log Hauling"
  pp_water_sawmill_elephant_skidding_desc: "Mahouts and their working elephants haul the heaviest logs down to the log pond. It pays only where the market holds plenty of cheap elephants."
  pp_water_sawmill_extra_rations: "Extra Rations"
  pp_water_sawmill_extra_rations_desc: "The mill feeds its sawyers and fellers through the long working season, so the saw frame never stands idle for want of hands or logs."
  pp_water_sawmill_horse_tools: "Horse Teams"
  pp_water_sawmill_horse_tools_desc: "Harnessed horse teams keep the log pond full, and the mill keeps its blades and gearing in good repair. Water sawmills spread across Europe from the fifteenth century wherever forests met falling water."
  pp_water_sawmill_horse_victuals: "Provisioned Horse Sawyers"
  pp_water_sawmill_horse_victuals_desc: "Horses bring the logs quickly to the mill pond while the sawyers are fed from the mill stores. The water-driven saw frame cuts boards far faster than men at a saw pit."
  pp_water_sawmill_livestock_tools: "Ox Teams"
  pp_water_sawmill_livestock_tools_desc: "Ox teams keep the log pond full, and the mill keeps its blades, gearing and sluices in good repair. Tar seals the wheel and the flume, and the saw frame turns logs into boards all day."
  pp_water_sawmill_livestock_victuals: "Provisioned Ox Sawyers"
  pp_water_sawmill_livestock_victuals_desc: "Oxen drag the logs to the mill pond while the sawyers are fed from the mill stores. A water wheel drives the saw frame up and down, and one mill does the work of many pit sawyers."
  pp_water_sawmill_no_crew_support: "No Crew Support"
  pp_water_sawmill_no_crew_support_desc: "The crews feed and mend themselves, and the camp gives them nothing extra."
  pp_water_sawmill_no_primary: "No Water Sawing"
  pp_water_sawmill_no_primary_desc: "The main work stands idle, and the woods give only what a few hands gather."
  pp_water_sawmill_wound_salves: "Wound Salves"
  pp_water_sawmill_wound_salves_desc: "Saw blades, logs and the mill race injure sawyers and fellers alike. Salves and dressings bought for the mill keep the hurt at work and the saw frame manned."
  water_sawmill: "Water Sawmill"
  water_sawmill_desc: "Water sawmills use millraces and reciprocating saw frames to turn logs into boards. Log ponds and sawn-timber yards move woodland cutting toward regular lumber production."
  water_sawmill_slot_0: "Woodland Cutting"
  water_sawmill_slot_1: "Forest Elephants"
  water_sawmill_slot_2: "Crew Support"
  water_sawmill_slot_3: "Water Sawing"
  pp_water_sawmill_market_sales: "Market Sales"
  pp_water_sawmill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  water_sawmill_slot_4: "Market"
