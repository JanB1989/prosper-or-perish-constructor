# >>> eu5-building-pipeline:lumber_mill_improved:localization
  lumber_mill_improved: "Planned Saw Works"
  lumber_mill_improved_desc: "Planned saw works combine managed timber stands, forest ordinances, log landings, and improved saw frames. Larger crews move more wood through organized yards."
  lumber_mill_improved_slot_0: "Managed Woodland Cutting"
  lumber_mill_improved_slot_1: "Forest Elephants"
  lumber_mill_improved_slot_2: "Crew Support"
  lumber_mill_improved_slot_3: "Saw Works"
  lumber_mill_improved_slot_4: "Market"
  pp_lumber_mill_improved_base_lumber: "Managed Woodland Cutting"
  pp_lumber_mill_improved_base_lumber_desc: "The surveyed managed woodland: what the marked stands gives before the works improve on it."
  pp_lumber_mill_improved_no_elephants: "No Forest Elephants"
  pp_lumber_mill_improved_no_elephants_desc: "No elephants work here, the logs move by hand and by draught teams."
  pp_lumber_mill_improved_elephant_skidding: "Elephant Timber Yards"
  pp_lumber_mill_improved_elephant_skidding_desc: "Mahouts and their working elephants shift and stack the heaviest timber in the yards. It pays only where the market holds plenty of cheap elephants."
  pp_lumber_mill_improved_horse_tools: "Horse Forest Ordinances"
  pp_lumber_mill_improved_horse_tools_desc: "Horse teams in good harness haul the logs from the marked stands along made tracks to the saw frames. Well-kept tools and greased tackle let the yards move timber in steady volume."
  pp_lumber_mill_improved_horse_victuals: "Provisioned Horse Ordinances"
  pp_lumber_mill_improved_horse_victuals_desc: "Provisioned crews cut the marked stands in turn, and horse teams carry the logs quickly to the landings. Planned felling keeps the forest yielding while the saw works run at full pace."
  pp_lumber_mill_improved_livestock_tools: "Ox Forest Ordinances"
  pp_lumber_mill_improved_livestock_tools_desc: "Marked stands are felled by plan, and ox teams drag the trunks to log landings and rafting points. The yards keep saws, ropes and tackle in repair so the wood moves without pause."
  pp_lumber_mill_improved_livestock_victuals: "Provisioned Ox Ordinances"
  pp_lumber_mill_improved_livestock_victuals_desc: "Under a forest ordinance the stands are cut in turn, and provisioned crews with ox teams bring the logs to central landings. Forest laws of the age, such as the French ordinance of 1669, sought to keep timber growing for generations."
  pp_lumber_mill_improved_no_crew_support: "No Crew Support"
  pp_lumber_mill_improved_no_crew_support_desc: "The crews feed and mend themselves, and the camp gives them nothing extra."
  pp_lumber_mill_improved_no_primary: "No Haulage Teams"
  pp_lumber_mill_improved_no_primary_desc: "The main work stands idle, and the woods give only what a few hands gather."
  pp_lumber_mill_improved_wound_salves: "Wound Salves"
  pp_lumber_mill_improved_wound_salves_desc: "The works keep salves and dressings for the many injuries of felling, hauling and sawing, so experienced hands return to work sooner and fewer are lost for good."
  pp_lumber_mill_improved_extra_rations: "Extra Rations"
  pp_lumber_mill_improved_extra_rations_desc: "The saw works buy provisions in bulk for their large crews, so cutting and sawing go on through the whole season at full strength, whatever the weather."
  pp_lumber_mill_improved_market_sales: "Market Sales"
  pp_lumber_mill_improved_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
# <<< eu5-building-pipeline:lumber_mill_improved:localization
