# >>> eu5-building-pipeline:lumber_mill:localization
  lumber_mill_slot_0: "Woodland Cutting"
  lumber_mill_slot_1: "Forest Elephants"
  lumber_mill_slot_2: "Crew Support"
  lumber_mill_slot_3: "Logging Method"
  pp_lumber_mill_base_lumber: "Woodland Cutting"
  pp_lumber_mill_base_lumber_desc: "The woodland itself: what the forest gives before any woodsman improves on it."
  pp_lumber_mill_no_elephants: "No Forest Elephants"
  pp_lumber_mill_no_elephants_desc: "No elephants work here; oxen, horses and men drag the logs from the felling."
  pp_lumber_mill_elephant_skidding: "Elephant Skidding"
  pp_lumber_mill_elephant_skidding_desc: "Mahouts and their working elephants drag the heaviest trunks out of the forest. It pays only where the market holds plenty of cheap elephants."
  pp_lumber_mill_extra_rations: "Extra Rations"
  pp_lumber_mill_extra_rations_desc: "In the busy cutting season the camp buys extra food for its crews. Well-fed men fell and trim longer days, and more logs come in before the snow or the rains."
  pp_lumber_mill_horse_tools: "Horse Logging Teams"
  pp_lumber_mill_horse_tools_desc: "Horse teams in leather harness skid logs along greased tracks to the landing, and the crews keep their axes and saws sharp. Horses haul faster than oxen and need good harness."
  pp_lumber_mill_horse_victuals: "Provisioned Horse Crews"
  pp_lumber_mill_horse_victuals_desc: "Cutting crews are fed from the camp stores while horses drag the felled trunks out of the woods. Horses move logs faster than oxen and need fewer animals for the same work."
  pp_lumber_mill_livestock_tools: "Ox Logging Teams"
  pp_lumber_mill_livestock_tools_desc: "Yoked oxen skid logs on greased runners along cleared tracks, and the crews keep their axes and saws sharp. Rope and tar keep the tackle and the log ends sound until the timber is sold."
  pp_lumber_mill_livestock_victuals: "Provisioned Ox Crews"
  pp_lumber_mill_livestock_victuals_desc: "Cutting crews are fed from the camp stores while oxen drag the felled trunks to the river or the road. Ox teams are slow but strong on soft and broken ground."
  pp_lumber_mill_no_extra_rations: "No Extra Rations"
  pp_lumber_mill_no_extra_rations_desc: "No extra food or salves are bought; the woodsmen live on their own bread and tend their own cuts."
  pp_lumber_mill_no_primary: "No Logging Method"
  pp_lumber_mill_no_primary_desc: "No logging crews or teams are kept; a few woodsmen only fell and drag what they can by hand."
  pp_lumber_mill_wound_salves: "Wound Salves"
  pp_lumber_mill_wound_salves_desc: "Felling and hauling cause cuts, crushed limbs and broken bones. A supply of salves and dressings keeps injured woodsmen at work and on their feet."
  pp_lumber_mill_market_sales: "Market Sales"
  pp_lumber_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  lumber_mill_slot_4: "Market"
