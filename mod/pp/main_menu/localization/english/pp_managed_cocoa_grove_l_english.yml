  pp_managed_cocoa_grove_unmanaged_shade_desc: "No shade trees are planted here; the cacao grows under whatever forest stands."
  pp_managed_cocoa_grove_market_sales: "Market Sales"
  pp_managed_cocoa_grove_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
