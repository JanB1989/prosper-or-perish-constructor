l_english:
  mapmode_pp_manual_labor_market_price_name: "Manual Labor Price"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE: "#T $mapmode_pp_manual_labor_market_price_name$#!\nColors each [market|e] by its [ShowGoodsName('manual_labor')|e] [market_price|e]. Labor usually trades close to its price floor, so the scale starts there: green marks labor at or near the floor, yellow marks labor at half again the floor price, and red marks markets where labor is scarce and costs double the floor or more."
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_VERY_CHEAP: "At the price floor"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_CHEAP: "Slightly above the floor"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_NEUTRAL: "Half again the floor price"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_EXPENSIVE: "Double the floor price"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_SEVERE: "Two and a half times the floor or more"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_TT_LAND: "#T $mapmode_pp_manual_labor_market_price_name$#!\n@market! [Market.GetName]\n[ShowGoodsName('manual_labor')|e] Price: #V [Market.MakeScope.ScriptValue('pp_manual_labor_market_price_map_value')|2]#![gold_i]"
  MAPMODE_PP_MANUAL_LABOR_MARKET_PRICE_TT_WATER: "Sea/Lake Location (No Manual Labor Price)"
