# >>> eu5-building-pipeline:marble_quarry:localization
  marble_quarry_slot_0: "Marble Deposit"
  marble_quarry_slot_1: "Quarry Waste"
  marble_quarry_slot_2: "Marble Face"
  marble_quarry: "Marble Quarry"
  marble_quarry_desc: "Quarrymen cut ornamental marble from exposed faces with drills, wedges, and skids. Rubble and fine stone waste are sorted for lesser uses."
  pp_marble_quarry_base_marble: "Exposed Marble Face"
  pp_marble_quarry_base_marble_desc: "The marble face itself: what the exposed rock gives before any quarryman improves on it."
  pp_marble_quarry_no_primary: "No Marble Quarrying"
  pp_marble_quarry_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_marble_quarry_marble: "Hand-Drilled Marble Face"
  pp_marble_quarry_marble_desc: "Quarrymen drill rows of holes along a line in the marble face and drive in wedges until the block splits free. Sledges then carry it down the slope on greased timbers, as at Carrara."
  pp_marble_quarry_no_secondary: "No Secondary Output"
  pp_marble_quarry_no_secondary_desc: "No byproduct is taken from this work, the waste goes to the spoil heap."
  pp_marble_quarry_stone: "Quarry Rubble Sorting"
  pp_marble_quarry_stone_desc: "Broken pieces and flawed blocks from the face are sorted from the waste and sold as rubble and rough stone for walls, foundations and lime kilns."
  pp_marble_quarry_sand: "Marble Fines Washing"
  pp_marble_quarry_sand_desc: "Fine marble dust and chips from cutting are washed and screened into a white sand. It is sold for mortar, plaster and as a grit for polishing."
  pp_marble_quarry_market_sales: "Market Sales"
  pp_marble_quarry_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  marble_quarry_slot_3: "Market"
