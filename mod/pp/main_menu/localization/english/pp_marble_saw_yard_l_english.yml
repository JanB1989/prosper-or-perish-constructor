# >>> eu5-building-pipeline:marble_saw_yard:localization
  marble_saw_yard_slot_0: "Marble Deposit"
  marble_saw_yard_slot_1: "Quarry Waste"
  marble_saw_yard_slot_2: "Sawed Blocks"
  marble_saw_yard: "Marble Saw Yard"
  marble_saw_yard_desc: "Marble yards saw and square larger blocks for transport to builders and sculptors. Rubble and fine stone waste remain useful secondary products."
  pp_marble_saw_yard_base_marble: "Surveyed Marble Face"
  pp_marble_saw_yard_base_marble_desc: "The surveyed marble face: what the mapped rock gives before the works improve on it."
  pp_marble_saw_yard_no_primary: "No Marble Sawing"
  pp_marble_saw_yard_no_primary_desc: "The main works stand idle, and the site gives only what its deposit yields."
  pp_marble_saw_yard_marble: "Sawed Block Quarrying"
  pp_marble_saw_yard_marble_desc: "Toothless iron blades in a frame are drawn back and forth over the block while sand and water are fed into the cut. Water wheels drive the larger frames, and the yard squares big blocks for builders and sculptors."
  pp_marble_saw_yard_no_secondary: "No Secondary Output"
  pp_marble_saw_yard_no_secondary_desc: "No byproduct is taken from this work, the waste goes to the spoil heap."
  pp_marble_saw_yard_stone: "Quarry Rubble Sorting"
  pp_marble_saw_yard_stone_desc: "Offcuts and flawed blocks from the saw yard are sorted from the waste and sold as rubble and rough stone for walls, foundations and lime kilns."
  pp_marble_saw_yard_sand: "Marble Fines Washing"
  pp_marble_saw_yard_sand_desc: "The wet sludge from the saw frames is washed and screened into fine marble sand, which is sold for mortar, plaster and polishing. Even the waste of fine marble finds buyers."
  pp_marble_saw_yard_market_sales: "Market Sales"
  pp_marble_saw_yard_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  marble_saw_yard_slot_3: "Market"
