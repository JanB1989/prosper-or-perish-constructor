  market_cotton_farm: "Market Cotton Farm"
  market_cotton_farm_desc: "Market cotton farms keep cotton fields, roller gin houses, drying racks, and bale yards close enough for lint to move cleanly into trade."
  pp_market_cotton_farm: "Market Cotton Farms"
  pp_market_cotton_farm_desc: "Roller gin houses, drying racks, and bale yards prepare cotton for larger markets without turning farms into textile mills."
  pp_market_cotton_farm_base_cotton: "Cotton Fields"
  pp_market_cotton_farm_base_cotton_desc: "The fields themselves: what the cotton plants yield with plain picking before any ginning."
  pp_market_cotton_farm_hand_ginning: "Hand Ginning"
  pp_market_cotton_farm_hand_ginning_desc: "No gin house stands here; each household works the seeds out of its lint with a small hand roller."
  pp_market_cotton_farm_roller_gin_house: "Roller Gin House"
  pp_market_cotton_farm_roller_gin_house_desc: "Carpenters build larger roller gins with metal rollers into a gin house, where workers clean the lint of many households in one place. More cotton is ginned at once and the lint comes out more even."
  pp_market_cotton_farm_loose_packing: "Loose Packing"
  pp_market_cotton_farm_loose_packing_desc: "No bale yard is kept here; the lint goes out loose in sacks."
  pp_market_cotton_farm_bale_yard: "Bale Yard"
  pp_market_cotton_farm_bale_yard_desc: "The cleaned lint is trodden or screwed down into tight bales, wrapped in cloth and tied. Far more of it fits into a cart or a ship's hold, and it stays clean on the way."
  pp_market_cotton_farm_market_sales: "Market Sales"
  pp_market_cotton_farm_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
