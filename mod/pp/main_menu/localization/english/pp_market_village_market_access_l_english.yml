# >>> eu5-building-pipeline:market_village:localization
  pp_market_village_rural_blacksmith: "Rural Blacksmith"
  pp_market_village_rural_blacksmith_desc: "A village smith hammers bar iron into hoes, sickles, nails and knives, and mends the tools of the farmers around. Every farming district depended on such a forge."
  pp_market_village_rural_millet_brewery: "Rural Millet Beer"
  pp_market_village_rural_millet_brewery_desc: "Villagers malt millet, mash it in large jars over a wood fire and let it ferment into a thick, sour beer. Millet and sorghum beers were brewed across Africa and Asia for daily drink and feasts."
  pp_market_village_rural_weaponmaker: "Rural Weaponmaker"
  pp_market_village_rural_weaponmaker_desc: "Village craftsmen shape bows, spear shafts, clubs and shields from local wood. Such weapons armed hunters and local militias where smiths were few and iron was dear."
  pp_market_village_rural_jewelry_carver: "Rural Jewelry Carver"
  pp_market_village_rural_jewelry_carver_desc: "Craftsmen carve and polish beads, amulets and ornaments from soft stone. Simple village jewellery was worn every day, traded at fairs and given at weddings and festivals."
  pp_market_village_rural_pottery_maker: "Rural Pottery Maker"
  pp_market_village_rural_pottery_maker_desc: "A village potter shapes local clay into jars, bowls and cooking pots and fires them in a small kiln. Such everyday pottery filled kitchens and market stalls everywhere."
  pp_market_village_market_sales: "Market Sales"
  pp_market_village_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
# <<< eu5-building-pipeline:market_village:localization
