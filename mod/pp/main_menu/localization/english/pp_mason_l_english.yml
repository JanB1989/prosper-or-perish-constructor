  mason_slot_0: "[ShowBuildingTypeName('mason')|e] Work"
  pp_mason_stone_bricks: "Stone Bricks"
  pp_mason_stone_bricks_desc: "Masons dress quarried stone with chisel and mallet into squared blocks, each fitted to its neighbour. Walls, bridges, towers and churches across the age were raised from such dressed stone."
  pp_mason_clay_bricks: "Clay Bricks"
  pp_mason_clay_bricks_desc: "Clay is shaped in wooden moulds, dried and fired in kilns into bricks. Where stone is scarce, whole cities and churches were built of brick, as along the Baltic coast."
  pp_mason_market_sales: "Market Sales"
  pp_mason_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  mason_slot_1: "Market"
