AUTO_MODIFIER_NAME_pp_limited_maritime_reach: "Limited Maritime Reach"
AUTO_MODIFIER_DESC_pp_limited_maritime_reach: "The [colonial_range|e] our [advances|e] give carries only as far as our seafaring. It grows with every [port|e] we hold on the open sea, more with ports in [towns_and_cities|e], and with the shipbuilding there: a [ShowBuildingTypeName('dock')|e], [ShowBuildingTypeName('dry_dock')|e] or [ShowBuildingTypeName('shipyard')|e]. Ports on rivers, lakes, the Black Sea and the Caspian do not count. Land next to our own needs no [colonial_range|e]."
AUTO_MODIFIER_NAME_pp_limited_trade_reach: "Limited Trade Reach"
AUTO_MODIFIER_DESC_pp_limited_trade_reach: "The [trade_range|e] our [advances|e] give carries only as far as our trade reaches, and at least half of it always does. Our trade reaches further with more [ShowPopTypeName('burghers')] among our people, with our seafaring, with the [societal_values|e] [ShowSocietyDirectionName('capital_economy')], [ShowSocietyDirectionName('plutocracy')], [ShowSocietyDirectionName('naval')] and [ShowSocietyDirectionName('free_subjects')], with more of our people in [towns_and_cities|e] and with trade buildings at home, such as the [ShowBuildingTypeName('marketplace')|e] and its successors. Our trade reach also sets how many merchant houses we may keep abroad.\n\nOur trade reach now: [ShowPopTypeName('burghers')] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_burghers')|0], seafaring [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_seafaring')|0], [ShowSocietyDirectionName('capital_economy')] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_capital_economy')|0], [ShowSocietyDirectionName('plutocracy')] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_plutocracy')|0], [ShowSocietyDirectionName('naval')] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_naval')|0], [ShowSocietyDirectionName('free_subjects')] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_free_subjects')|0], [towns_and_cities|e] [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_towns')|0], trade buildings [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_pts_trade_buildings')|0]; together [GetPlayer.MakeScope.ScriptValue('pp_trade_reach_points')|0] points."
