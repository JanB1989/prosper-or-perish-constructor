l_english:

# >>> eu5-building-pipeline:drift_net_fishery:localization
  drift_net_fishery: "Drift-Net Fishery"
  drift_net_fishery_desc: "Drift-net fisheries organize hemp and flax nets, small sailcloth, shore brining, and light boat repairs for seasonal coastal shoals. When the province's [Concept('provincial_food', 'food store')|e] is high, it produces more goods for the market; when the store is low, it produces more [ShowGoodsName('local_food')|e] and fewer goods for the market."
  drift_net_fishery_slot_0: "Coastal Waters"
  drift_net_fishery_slot_1: "Coastal Drift Nets"
  drift_net_fishery_slot_2: "Provisioning"
  pp_coastal_drift_nets: "Coastal Drift Nets"
  pp_coastal_drift_nets_desc: "Coastal crews use hemp nets, simple sailcloth, and shore-side brining to work seasonal shoals before purpose-built herring busses."
  pp_drift_net_fishery_base_catch: "Coastal Waters"
  pp_drift_net_fishery_base_catch_desc: "The waters themselves: what the fishermen take with lines and small nets before any better gear."
  pp_drift_net_fishery_no_coastal_gear: "No Coastal Drift Nets"
  pp_drift_net_fishery_no_coastal_gear_desc: "No drift nets are set here, the crews fish with lines and hand nets alone."
  pp_drift_net_fishery_coastal_drift_nets: "Coastal Drift Nets"
  pp_drift_net_fishery_coastal_drift_nets_desc: "Crews pay out long walls of hemp net at dusk and let them drift with the tide, so that shoals of herring and pilchard swim into the meshes. The catch is brined on the shore before it spoils."
  pp_drift_net_fishery_provision: "Provision with Fish"
  pp_drift_net_fishery_provision_desc: "The household buys its own catch back and cooks for the province. The lower the province store is, the more food it makes of it."
  pp_drift_net_fishery_market_sales: "Market Sales"
  pp_drift_net_fishery_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  drift_net_fishery_slot_3: "Market"
# <<< eu5-building-pipeline:drift_net_fishery:localization
