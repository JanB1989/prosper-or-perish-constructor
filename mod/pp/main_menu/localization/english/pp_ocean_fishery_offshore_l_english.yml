# >>> eu5-building-pipeline:offshore_fishery:localization
  offshore_fishery_slot_0: "Offshore Waters"
  offshore_fishery_slot_1: "Offshore Fleet"
  offshore_fishery_slot_2: "Provisioning"
  offshore_fishery: "Offshore Fishery"
  offshore_fishery_desc: "Offshore fleets use herring busses, bank schooners, and later steam trawlers to reach richer waters. Salt, provisions, and gear keep the catch moving home. When the province's [Concept('provincial_food', 'food store')|e] is high, it produces more goods for the market; when the store is low, it produces more [ShowGoodsName('local_food')|e] and fewer goods for the market."
  pp_offshore_fishery_base_catch: "Offshore Waters"
  pp_offshore_fishery_base_catch_desc: "The waters themselves: what the deep grounds give to plain boats before any larger fleet sails."
  pp_offshore_fishery_no_offshore_fleet: "No Offshore Fleet"
  pp_offshore_fishery_no_offshore_fleet_desc: "No offshore fleet sails from here, the crews keep to the near coast."
  pp_offshore_fishery_herring_busses: "Herring Busses"
  pp_offshore_fishery_herring_busses_desc: "The Dutch herring buss is a decked ship that stays at sea for weeks with long drift nets. The crew guts and salts the herring in barrels on board, which let the fleets follow the shoals far from home."
  pp_offshore_fishery_distant_water_schooners: "Distant-Water Schooners"
  pp_offshore_fishery_distant_water_schooners_desc: "Schooners sail for weeks to distant banks such as those off Newfoundland, carrying their own stores, and the crews fish with hand lines and salt the cod in the hold. The cured catch comes home at the end of the season."
  pp_offshore_fishery_steam_trawlers: "Steam Trawlers"
  pp_offshore_fishery_steam_trawlers_desc: "A steam engine drives the vessel and works the winches that haul a heavy trawl net along the seabed. Steam trawlers no longer wait on the wind and bring in far larger catches from deeper grounds."
  pp_offshore_fishery_provision: "Provision with Fish"
  pp_offshore_fishery_provision_desc: "The household buys its own catch back and cooks for the province. The lower the province store is, the more food it makes of it."
  pp_offshore_fishery_market_sales: "Market Sales"
  pp_offshore_fishery_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  offshore_fishery_slot_3: "Market"
# <<< eu5-building-pipeline:offshore_fishery:localization
