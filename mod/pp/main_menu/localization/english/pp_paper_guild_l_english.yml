# >>> eu5-building-pipeline:paper_guild:localization
  pp_paper_guild_price: "[ShowBuildingTypeName('paper_guild')|e] Price"
  paper_guild_slot_0: "[ShowBuildingTypeName('paper_guild')|e] Work"
  pp_paper_guild_paper_guild_leather_maintenance: "Animal Parchment"
  pp_paper_guild_paper_guild_leather_maintenance_desc: "Animal skins are soaked in lime, scraped and stretched on frames to dry into parchment and vellum. It was the writing material of medieval Europe before paper spread, and charters and fine books still use it."
  pp_paper_guild_paper_guild_fiber_pulp_maintenance: "Fiber Pulp Paper"
  pp_paper_guild_paper_guild_fiber_pulp_maintenance_desc: "Bark and plant fibres are beaten to pulp, and the papermaker lifts a thin sheet on a screen. Paper was invented in China this way and reached the West through the Islamic world."
  pp_paper_guild_paper_guild_cloth_maintenance: "Rag Paper"
  pp_paper_guild_paper_guild_cloth_maintenance_desc: "Old linen rags are rotted, beaten to pulp and formed into sheets on wire moulds, then sized with gelatine. Fabriano in Italy made the craft famous."
  pp_paper_guild_market_sales: "Market Sales"
  pp_paper_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  paper_guild_slot_1: "Market"
