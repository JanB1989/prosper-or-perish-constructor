l_english:

# >>> eu5-building-pipeline:paper_workshop:localization
  paper_workshop_slot_0: "[ShowBuildingTypeName('paper_workshop')|e] Work"
  pp_paper_workshop_paper_workshop_fiber_pulp_maintenance: "Fiber Pulp Paper"
  pp_paper_workshop_paper_workshop_fiber_pulp_maintenance_desc: "The workshop beats plant fibres to pulp in stamping troughs and forms the sheets on screens, making paper in steady quantity for scribes, clerks and merchants."
  pp_paper_workshop_paper_workshop_cloth_maintenance: "Rag Paper"
  pp_paper_workshop_paper_workshop_cloth_maintenance_desc: "Water-driven stampers beat linen rags to pulp, and vatmen form the sheets on moulds that leave a watermark. Printing made rags so sought after that collectors went door to door."
  pp_paper_workshop_market_sales: "Market Sales"
  pp_paper_workshop_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  paper_workshop_slot_1: "Market"
  pp_paper_workshop_legacy_paper_guild_leather_maintenance: "$paper_guild_leather_maintenance$ (Old Ways)"
  pp_paper_workshop_legacy_paper_guild_leather_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('paper_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
