# >>> eu5-building-pipeline:managed_pepper_garden:localization
  managed_pepper_garden_slot_0: "Pepper Vines"
  managed_pepper_garden_slot_1: "Garbling & Sorting"
  managed_pepper_garden_slot_2: "Drying & Blanching"
  managed_pepper_garden: "Managed Pepper Garden"
  managed_pepper_garden_desc: "Managed pepper gardens train vines on living supports and move the harvest through bamboo drying mats, blanching pots, and sorting yards before it reaches market."
  pp_managed_pepper_garden: "Managed Pepper Gardens"
  pp_managed_pepper_garden_desc: "Organized supports, drying mats, and garbling yards let pepper gardens prepare a cleaner harvest without changing where pepper can grow."
  pp_managed_pepper_garden_bamboo_drying_mats: "Bamboo Drying Mats"
  pp_managed_pepper_garden_bamboo_drying_mats_desc: "The picked spikes are dipped briefly in hot water from clay pots and spread on bamboo mats in the sun until the berries turn black and wrinkled. The mats keep the pepper clean and dry it evenly."
  pp_managed_pepper_garden_base_pepper: "Pepper Vines"
  pp_managed_pepper_garden_base_pepper_desc: "The vines themselves: what the pepper gardens yield with plain picking before any sorting."
  pp_managed_pepper_garden_garbling_tables: "Garbling Tables"
  pp_managed_pepper_garden_garbling_tables_desc: "Workers sift and pick over the dried peppercorns at tables and screens, removing stalks, dust and light berries. Garbling was the old trade word for cleaning spices, and graded pepper sold for more."
  pp_managed_pepper_garden_no_drying_yard: "No Drying Yard"
  pp_managed_pepper_garden_no_drying_yard_desc: "No drying yard is kept here; the berries are dried on bare ground."
  pp_managed_pepper_garden_unsorted_harvest: "Unsorted Harvest"
  pp_managed_pepper_garden_unsorted_harvest_desc: "No sorting is done here; the pepper goes out with its stalks and dust."
  pp_managed_pepper_garden_market_sales: "Market Sales"
  pp_managed_pepper_garden_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  managed_pepper_garden_slot_3: "Market"
