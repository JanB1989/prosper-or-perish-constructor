# >>> eu5-building-pipeline:potato_farmstead:localization
  potato_farmstead: "Potato Farmstead"
  potato_farmstead_desc: "Manured ridges grow the crop and earth clamps keep the seed potatoes through winter. When the province's [Concept('provincial_food', 'food store')|e] is high, it produces more goods for the market; when the store is low, it produces more [ShowGoodsName('local_food')|e] and fewer goods for the market."
  potato_farmstead_slot_0: "Fields"
  potato_farmstead_slot_1: "Cultivation"
  potato_farmstead_slot_2: "Provisioning"
  pp_potato_farmstead_base: "Fields"
  pp_potato_farmstead_base_desc: "The fields themselves: what the sown land yields with plain work before any improved husbandry."
  pp_potato_farmstead_no_cultivation: "No Cultivation"
  pp_potato_farmstead_no_cultivation_desc: "No improved husbandry is practised here, the land gives what plain work takes from it."
  pp_potato_farmstead_manured_ridges: "Manured Ridges and Clamps"
  pp_potato_farmstead_manured_ridges_desc: "Manured ridges grow the crop and earth clamps store it."
  pp_potato_farmstead_provision: "Provision with Potatoes"
  pp_potato_farmstead_provision_desc: "The household keeps back a little of its crop and cooks for the province. The lower the province store is, the more food it makes of it."
