  quicksilver_retort_slot_0: "Cinnabar Deposit"
  quicksilver_retort_slot_1: "Gangue Sorting"
  quicksilver_retort_slot_2: "Retort Works"
  quicksilver_retort: "Quicksilver Retort"
  quicksilver_retort_desc: "Timbered shafts feed retort furnaces where cinnabar is roasted into quicksilver. The mercury is stored for precious-metal refining and other trades."
  pp_quicksilver_retort_base_mercury: "Surveyed Cinnabar Seam"
  pp_quicksilver_retort_base_mercury_desc: "The surveyed cinnabar seam: what the mapped vein gives before the works improve on it."
  pp_quicksilver_retort_no_primary: "No Mercury Retorting"
  pp_quicksilver_retort_no_primary_desc: "No retort furnaces are fired; a few hands only roast cinnabar from the seam in small pots."
  pp_quicksilver_retort_mercury: "Retort Furnace Works"
  pp_quicksilver_retort_mercury_desc: "The ore is roasted in furnaces whose fumes pass through long chains of clay pots, the aludels, where the quicksilver cools and gathers. Such furnaces, first built in Peru, served the great mines of Almaden and Huancavelica."
  pp_quicksilver_retort_no_secondary: "No Gangue Sorting"
  pp_quicksilver_retort_no_secondary_desc: "No gangue stone is sold from the shafts; the barren rock goes to the waste heaps by the furnaces."
  pp_quicksilver_retort_stone: "Gangue Stone Sorting"
  pp_quicksilver_retort_stone_desc: "Gangue rock from the deeper shafts is sorted at the pit head and sold to builders as rough stone. The growing waste heaps earn their keep."
  pp_quicksilver_retort_market_sales: "Market Sales"
  pp_quicksilver_retort_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  quicksilver_retort_slot_3: "Market"
