# >>> eu5-building-pipeline:river_boatmen_yard:localization
  river_boatmen_yard_slot_0: "River Network"
  river_boatmen_yard_slot_1: "River Crews"
  pp_river_boatmen_yard_construction: "[ShowBuildingTypeName('river_boatmen_yard')|e] Construction"
  pp_river_boatmen_yard_maintenance: "Boatmen"
  pp_river_boatmen_yard_maintenance_desc: "Boatmen take the barges down with the current and pole them back up the [river|e], patching the hulls with timber and tar. Water was the cheapest road for heavy goods."
  pp_river_boatmen_yard_towpath_crews: "Towpath Crews"
  pp_river_boatmen_yard_towpath_crews_desc: "Gangs of men haul the barges upstream on ropes along the towpath, like the burlaks of the Volga. It takes many hands but little gear."
  pp_river_boatmen_yard_fitted_barges: "Fitted Barges"
  pp_river_boatmen_yard_fitted_barges_desc: "Barges with sails, tow lines and horses on the towpath move larger loads up and down the [river|e]. Better rigging and caulking keep them working longer between repairs."
  river_boatmen_yard: "River Boatmen's Yard"
  river_boatmen_yard_desc: "Boatmen, barges and timber landings turn a riverbank into a working freight yard. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands on a [river|e], and a bigger river takes more levels."
  pp_river_boatmen_yard_logistics_network: "River Pilots"
  pp_river_boatmen_yard_logistics_network_desc: "Pilots who know every shoal, weir and ferry guide passing barges, so some freight keeps moving on the river even when the yard's own boats lie idle."
