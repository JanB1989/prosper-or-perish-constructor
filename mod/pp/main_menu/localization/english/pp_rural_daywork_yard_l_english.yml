# >>> eu5-building-pipeline:rural_daywork_yard:localization
  rural_daywork_yard: "Hiring Fair"
  rural_daywork_yard_desc: "Peasant households come to a village hiring fair to take paid work in the fields, with their oxen, and at ditches and dykes nearby."
  rural_daywork_yard_slot_0: "Day Workers"
  pp_rural_daywork_yard_harvest_gangs: "Harvest Gangs"
  pp_rural_daywork_yard_harvest_gangs_desc: "At harvest time peasants hire out in gangs to reap and bind the grain on larger farms. They are paid partly in harvest beer, an old custom on farms across Europe."
  pp_rural_daywork_yard_ox_teams: "Ox-Team Hire"
  pp_rural_daywork_yard_ox_teams_desc: "Peasants with oxen hire out their teams and themselves for ploughing and carting on other farms. The hirers pay for the harness and the keep of the animals."
  pp_rural_daywork_yard_ditch_gangs: "Ditch-and-Dyke Gangs"
  pp_rural_daywork_yard_ditch_gangs_desc: "Gangs of labourers are hired to dig drainage ditches and raise dykes of clay and timber. Such work kept fields dry and rivers in their beds in the Low Countries and the English fens."
  pp_rural_daywork_yard_price: "[ShowBuildingTypeName('rural_daywork_yard')|e] Price"
  pp_rural_daywork_yard_market_sales: "Market Sales"
  pp_rural_daywork_yard_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  rural_daywork_yard_slot_1: "Market"
