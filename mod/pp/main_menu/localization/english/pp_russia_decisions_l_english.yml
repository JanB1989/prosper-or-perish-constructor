l_english:
 pp_mos_vladimir_patrimony_decision.title: "The Patrimony of Vladimir"
 pp_mos_vladimir_patrimony_decision.desc: "Our prince also sits on the throne of [GetCountry('VLR').GetNameWithNoTooltip], the old seat of the grand princes, which the Khan's patent has kept in our house. Its court, its towns and its tribute already answer to Moscow in all but name. Let the grand principality be counted among our own lands, to be handed down to our heirs with Moscow itself."
 pp_mos_vladimir_patrimony_decision.desc.entry: "[GetCountry('VLR').GetNameWithNoTooltip] already shares our prince. Making it our patrimony joins its lands to ours for good."
 pp_mos_vladimir_patrimony_decision.a: "Vladimir is our patrimony."
