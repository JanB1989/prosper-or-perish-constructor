  saffron_kiln_croft: "Saffron Kiln Croft"
  saffron_kiln_croft_desc: "Saffron kiln crofts keep crocus beds under closer care, enrich the soil with manure, and dry hand-separated stigmas on pottery trays over small braziers."
  pp_saffron_kiln_croft: "Saffron Kiln Crofts"
  pp_saffron_kiln_croft_base_saffron: "Crocus Beds"
  pp_saffron_kiln_croft_base_saffron_desc: "The beds themselves: what the crocus flowers yield with plain picking before any drying."
  pp_saffron_kiln_croft_desc: "Better bed care and controlled drying help saffron growers bring more clean threads to market without changing where saffron can grow."
  pp_saffron_kiln_croft_livestock_manure: "Livestock Manure"
  pp_saffron_kiln_croft_livestock_manure_desc: "Growers dig manure into the beds before planting the corms, because saffron tires the ground within a few years. Richer soil gives more flowers and lets the beds last longer."
  pp_saffron_kiln_croft_pottery_kilns: "Pottery Tray Kilns"
  pp_saffron_kiln_croft_pottery_kilns_desc: "The fresh threads dry on covered pottery trays over a low, steady fire. Even heat keeps their colour and scent better than the sun and spoils fewer threads."
  pp_saffron_kiln_croft_sun_drying: "Sun Drying"
  pp_saffron_kiln_croft_sun_drying_desc: "No kiln is fired here; the threads dry in the sun."
  pp_saffron_kiln_croft_unmanured_beds: "Unmanured Beds"
  pp_saffron_kiln_croft_unmanured_beds_desc: "No manure is spread here; the crocus corms grow on in tired soil."
  pp_saffron_kiln_croft_market_sales: "Market Sales"
  pp_saffron_kiln_croft_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
