l_english:
  pp_village_school: "Village School"
  pp_village_school_desc: "A schoolroom beside the church where the priest or a hired master teaches the children of the village their letters, their prayers and a little sums. It raises the [literacy|e] of the location's [ShowPopTypeName('peasants')], [ShowPopTypeName('laborers')] and [ShowPopTypeName('soldiers')], and gifted children find a way up into the trades and the church. [ShowPopTypeName('peasants')] who can read need less food and work more [population_capacity|e]."
  pp_village_school_maintenance: "[ShowBuildingTypeName('pp_village_school')|e] Upkeep"
  pp_village_school_maintenance_desc: "The school burns candles through the dark months and needs slates and clay tablets for its pupils."
  pp_trade_school: "Trade School"
  pp_trade_school_desc: "A reckoning school where the sons of merchants and craftsmen learn arithmetic, bookkeeping and the writing of letters and contracts. It raises the [literacy|e] of the town's [ShowPopTypeName('burghers')] and makes room for more of them; a town with its own trade [town_rights|e] keeps a larger school. It needs a [ShowBuildingTypeName('pp_village_school')|e] in the town to send it pupils."
  pp_trade_school_maintenance: "[ShowBuildingTypeName('pp_trade_school')|e] Upkeep"
  pp_trade_school_maintenance_desc: "The masters need reckoning books and ledgers for their pupils and candles for the evening lessons."
  pp_village_schools_advance: "Village Schools"
  pp_village_schools_advance_desc: "The new learning of the towns reaches the countryside: parishes and village communities pay a master to teach their children to read. We may build the [ShowBuildingTypeName('pp_village_school')|e]."
  pp_reckoning_schools_advance: "Reckoning Schools"
  pp_reckoning_schools_advance_desc: "Merchant towns open schools of the abacus where boys learn the arithmetic, double-entry bookkeeping and letter writing of the counting house. We may build the [ShowBuildingTypeName('pp_trade_school')|e]."
  pp_common_schooling_advance: "Common Schooling"
  pp_common_schooling_advance_desc: "Churches of every confession want their faithful to read the catechism for themselves, and parish ordinances call for a school in every village. Our [ShowBuildingTypeName('pp_village_school')|e] can grow larger."
  MODIFIER_TYPE_NAME_pp_village_school_levels: "[ShowBuildingTypeName('pp_village_school')|e] Max Level"
  MODIFIER_TYPE_DESC_pp_village_school_levels: "Every [ShowBuildingTypeName('pp_village_school')|e] in our locations can be enlarged by this many more levels."
  PP_BUILDING_LEVEL_PRINTING_PRESS: "From $printing_press_advance$"
  PP_BUILDING_LEVEL_EDUCATION_POLICY: "From the $education_masses_law$ policy"
  PP_BUILDING_LEVEL_SPECIALIZATION_RIGHTS: "From Specialization Town Rights"
  pp_academy_of_sciences: "Society of Sciences"
  pp_academy_of_sciences_desc: "A learned society under the patronage of the state, where scholars meet, write to their peers abroad, repeat each other's experiments and print what they find. It stands in our capital and speeds up the [research|e] of the whole country. It draws its fellows from our [ShowBuildingTypeName('university')|e] buildings: the more of them the country holds, the larger the society can grow."
  pp_academy_of_sciences_maintenance: "[ShowBuildingTypeName('pp_academy_of_sciences')|e] Upkeep"
  pp_academy_of_sciences_maintenance_desc: "The fellows need books and paper for their transactions, glass for lenses and vessels and fine instruments for their experiments."
  pp_academy_of_sciences_advance: "Societies of Sciences"
  pp_academy_of_sciences_advance_desc: "Natural philosophers no longer work alone. Under a charter of the state they form a society that meets, tests and publishes. We may build the [ShowBuildingTypeName('pp_academy_of_sciences')|e] in our capital."
  PP_BUILDING_LEVEL_LOCATION_RANK: "From the Rank of the Location"
  PP_BUILDING_LEVEL_UNIVERSITIES: "From the [ShowBuildingTypeName('university')|e] Buildings of our Country"
  MODIFIER_TYPE_NAME_local_pp_nobles_literacy: "Literacy of the [ShowPopTypeName('nobles')]"
  MODIFIER_TYPE_DESC_local_pp_nobles_literacy: "How well the [ShowPopTypeName('nobles')] of this location read. A new [institution|e] takes hold where the upper classes can read about it."
  MODIFIER_TYPE_NAME_local_pp_clergy_literacy: "Literacy of the [ShowPopTypeName('clergy')]"
  MODIFIER_TYPE_DESC_local_pp_clergy_literacy: "How well the [ShowPopTypeName('clergy')] of this location read. A new [institution|e] takes hold where the upper classes can read about it."
  MODIFIER_TYPE_NAME_local_pp_burghers_literacy: "Literacy of the [ShowPopTypeName('burghers')]"
  MODIFIER_TYPE_DESC_local_pp_burghers_literacy: "How well the [ShowPopTypeName('burghers')] of this location read. A new [institution|e] takes hold where the upper classes can read about it."
  MODIFIER_TYPE_NAME_local_pp_nobles_share: "[ShowPopTypeName('nobles')] among the People"
  MODIFIER_TYPE_DESC_local_pp_nobles_share: "The share of this location's people who are [ShowPopTypeName('nobles')]."
  MODIFIER_TYPE_NAME_local_pp_clergy_share: "[ShowPopTypeName('clergy')] among the People"
  MODIFIER_TYPE_DESC_local_pp_clergy_share: "The share of this location's people who are [ShowPopTypeName('clergy')]."
  MODIFIER_TYPE_NAME_local_pp_burghers_share: "[ShowPopTypeName('burghers')] among the People"
  MODIFIER_TYPE_DESC_local_pp_burghers_share: "The share of this location's people who are [ShowPopTypeName('burghers')]."
  MODIFIER_TYPE_NAME_local_pp_literate_peasant_land: "Land of Literate [ShowPopTypeName('peasants')]"
  MODIFIER_TYPE_DESC_local_pp_literate_peasant_land: "The [population_capacity|e] this location gains because its [ShowPopTypeName('peasants')] can read: they work more land and need less food."
