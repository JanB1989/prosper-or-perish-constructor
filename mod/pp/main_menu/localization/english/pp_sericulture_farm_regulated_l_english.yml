  regulated_sericulture_farm: "Regulated Sericulture Farm"
  regulated_sericulture_farm_desc: "Regulated sericulture farms keep mulberry rows, silkworm trays, cocoon sorting, and hand reeling close together so raw silk leaves the farm in cleaner skeins."
  pp_regulated_sericulture_farm: "Regulated Sericulture Farms"
  pp_regulated_sericulture_farm_desc: "Organized cocoon handling, reeling houses, and steady basin heat improve silk recovery in provinces already suited to sericulture."
  pp_regulated_sericulture_farm_base_silk: "Mulberry Groves"
  pp_regulated_sericulture_farm_base_silk_desc: "The groves themselves: what the silkworms spin on mulberry leaves before any careful reeling."
  pp_regulated_sericulture_farm_household_reeling: "Household Reeling"
  pp_regulated_sericulture_farm_household_reeling_desc: "No reeling house is kept here; each household reels its own cocoons at home."
  pp_regulated_sericulture_farm_reeling_house: "Reeling House"
  pp_regulated_sericulture_farm_reeling_house_desc: "Reelers from many households work side by side in one house at hand-turned reels over warm basins. Shared sorting tables and reeling frames make the raw silk more even."
  pp_regulated_sericulture_farm_loose_skeins: "Loose Skeins"
  pp_regulated_sericulture_farm_loose_skeins_desc: "No filature is kept here; the silk goes out in uneven loose skeins."
  pp_regulated_sericulture_farm_heated_filature: "Heated Filature"
  pp_regulated_sericulture_farm_heated_filature_desc: "Reelers draw the silk from cocoons softened in basins of evenly heated water and wind it onto racks, checking every skein. Steady heat gives a finer, more even thread, the aim of the Italian and French filatures."
  pp_regulated_sericulture_farm_market_sales: "Market Sales"
  pp_regulated_sericulture_farm_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
