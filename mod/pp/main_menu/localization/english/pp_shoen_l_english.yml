l_english:

# >>> eu5-building-pipeline:shoen:localization
  shoen_slot_0: "[ShowBuildingTypeName('shoen')|e] Work"
  pp_shoen_shoen_quarries_maintenance: "Estate Quarries"
  pp_shoen_shoen_quarries_maintenance_desc: "Estate workers split stone from the hillsides with wedges, saw it with sand grit and drag the blocks on sledges and rollers. The stone goes into the walls, terraces and temple foundations of the estate."
  pp_shoen_shoen_lumbermills_maintenance: "Estate Lumber"
  pp_shoen_shoen_lumbermills_maintenance_desc: "Woodcutters fell trees in the estate's mountain forests, haul the logs with oxen and float them down in rafts bound with rope. Timber for temples and castles came down from the mountains this way."
  pp_shoen_shoen_fiber_crops_farm_maintenance: "Estate Fibers"
  pp_shoen_shoen_fiber_crops_farm_maintenance_desc: "Estate peasants grow hemp and ramie on dry fields, cut the stalks with sickles and ret them on frames. These bast fibres clothed most people in medieval Japan before cotton spread."
  pp_shoen_shoen_ironsand_maintenance: "Ironsand Collecting"
  pp_shoen_shoen_ironsand_maintenance_desc: "Workers wash iron sand from streams and hillsides and smelt it with charcoal in a clay tatara furnace, which is broken open after every smelt. The tatara made the steel of Japanese swords and tools."
  pp_shoen_shoen_masonry_maintenance: "Daiku Artisans"
  pp_shoen_shoen_masonry_maintenance_desc: "The daiku, the master carpenters and builders of Japan, work for the estate and dress timber and stone for its halls, gates and storehouses. Their craft passed from master to apprentice."
  pp_shoen_market_sales: "Market Sales"
  pp_shoen_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  shoen_slot_1: "Market"
# <<< eu5-building-pipeline:shoen:localization
