# >>> eu5-building-pipeline:silver_mine_improved:localization
  silver_mine_improved_slot_0: "Silver Vein"
  silver_mine_improved_slot_1: "Associated Ore Recovery"
  silver_mine_improved_slot_2: "Saiger Workings"
  silver_mine_improved: "Saiger Silver Mine"
  silver_mine_improved_desc: "Better timbering and ore dressing prepare silver-lead ores for saiger and cupellation work. Dressed galena and auriferous pieces remain useful secondary recoveries."
  pp_silver_mine_improved_base_silver: "Surveyed Silver Vein"
  pp_silver_mine_improved_base_silver_desc: "The surveyed silver vein itself: what the ground gives before the timbered workings add to it."
  pp_silver_mine_improved_no_primary: "No Saiger Workings"
  pp_silver_mine_improved_no_primary_desc: "No saiger ore is worked here; the mine gives only what its vein yields on its own."
  pp_silver_mine_improved_silver: "Saiger Ore Workings"
  pp_silver_mine_improved_silver_desc: "Timbered galleries, stamps and dressing floors prepare the silver ores for the furnace, where lead collects the silver and the cupel frees it again. Mixed silver and copper ores go through the saiger process, which draws silver out of copper with lead."
  pp_silver_mine_improved_no_secondary: "No Associated Recovery"
  pp_silver_mine_improved_no_secondary_desc: "No galena or gold ore is dressed from the vein here; the miners keep to the silver."
  pp_silver_mine_improved_lead: "Galena Ore Dressing"
  pp_silver_mine_improved_lead_desc: "Galena raised with the silver ore is stamped and washed on the dressing floors until clean, then smelted to lead. Much of that lead goes straight back into refining the silver."
  pp_silver_mine_improved_gold: "Auriferous Ore Dressing"
  pp_silver_mine_improved_gold_desc: "Gold-bearing ore is stamped and washed apart from the rest, so the heavy grains are not lost with the tailings. The gold travels with the silver through the furnaces until it is parted at the end."
  pp_silver_mine_improved_market_sales: "Market Sales"
  pp_silver_mine_improved_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  silver_mine_improved_slot_3: "Market"
