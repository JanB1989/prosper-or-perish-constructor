# >>> eu5-building-pipeline:silver_mine:localization
  silver_mine_slot_0: "Silver Vein"
  silver_mine_slot_1: "Associated Ore Recovery"
  silver_mine_slot_2: "Silver Workings"
  silver_mine: "Silver Mine"
  silver_mine_desc: "Shallow adits and hand-cut veins work silver-bearing stone from the hillside. Ore is broken, washed, and sorted by hand, with lead-bearing galena and auriferous pieces picked out when found."
  pp_silver_mine_base_silver: "Exposed Silver Vein"
  pp_silver_mine_base_silver_desc: "The exposed silver vein itself: what the ground gives before any miner improves on it."
  pp_silver_mine_no_primary: "No Silver Mining"
  pp_silver_mine_no_primary_desc: "No silver is mined here, the mine gives only what its vein yields on its own."
  pp_silver_mine_silver: "Hand-Sorted Silver Veins"
  pp_silver_mine_silver_desc: "Miners follow the silver vein through short adits with picks and wedges, and every piece is broken and sorted by hand on the surface. The best ore is smelted with lead and the silver won on the cupel."
  pp_silver_mine_fire_setting: "Fire-Setting"
  pp_silver_mine_fire_setting_desc: "Where iron tools are scarce, the miners build fires against the vein and let the heat crack the rock overnight. The smoke must clear before work goes on, so the method is slow, yet it opens the hardest silver ground."
  pp_silver_mine_no_secondary: "No Associated Recovery"
  pp_silver_mine_no_secondary_desc: "No lead or gold ore is picked from the vein here, the miners keep to the silver."
  pp_silver_mine_lead: "Argentiferous Galena Picking"
  pp_silver_mine_lead_desc: "Silver veins often run with galena, the heavy grey lead ore. The pickers sort it out and smelt it on simple hearths, and its lead is welcome at the refining hearth and in the market alike."
  pp_silver_mine_gold: "Auriferous Ore Picking"
  pp_silver_mine_gold_desc: "Some silver veins carry a little gold. The richest stones are set aside, and the gold stays with the silver through smelting and refining on the cupel until it is parted at the end."
  pp_silver_mine_market_sales: "Market Sales"
  pp_silver_mine_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  silver_mine_slot_3: "Market"
# <<< eu5-building-pipeline:silver_mine:localization
