l_english:

# >>> eu5-building-pipeline:slave_labor_yard:localization
  slave_labor_yard: "Slave Gang Barracks"
  slave_labor_yard_desc: "Enslaved people are housed and fed in city barracks before being hired out in work gangs. The barracks supply manual labor to the market where the slave trade is established."
  slave_labor_yard_slot_0: "Work Gangs"
  pp_slave_labor_yard_grain_rations: "Grain-Ration Gangs"
  pp_slave_labor_yard_grain_rations_desc: "The gangs receive weekly rations of millet or other grain and a yearly issue of coarse cloth. Grain rations were the rule where food was bought in and the enslaved had no grounds of their own."
  pp_slave_labor_yard_salt_fish_rations: "Salt-Fish Gangs"
  pp_slave_labor_yard_salt_fish_rations_desc: "The gangs are fed on rations of salted fish shipped in barrels from the northern fisheries. Salt cod and herring from Newfoundland and New England fed the enslaved on many Caribbean plantations."
  pp_slave_labor_yard_provision_grounds: "Provision-Ground Gangs"
  pp_slave_labor_yard_provision_grounds_desc: "The enslaved gangs grow much of their own food on provision grounds beside the barracks and are given rough cloth. Planters across the Caribbean pushed the cost of feeding the enslaved onto the enslaved themselves this way."
  pp_slave_labor_yard_price: "[ShowBuildingTypeName('slave_labor_yard')|e] Price"
  pp_slave_labor_yard_market_sales: "Market Sales"
  pp_slave_labor_yard_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  slave_labor_yard_slot_1: "Market"
# <<< eu5-building-pipeline:slave_labor_yard:localization
