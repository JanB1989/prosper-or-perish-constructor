  stone_quarry_improved_slot_0: "Stone Face"
  stone_quarry_improved_slot_1: "Quarry Waste"
  stone_quarry_improved_slot_2: "Block Dressing"
  stone_quarry_improved: "Stone Dressing Yard"
  stone_quarry_improved_desc: "Dressing yards pair worked quarry faces with hoists, skids, and block benches so crews can square larger stones for transport. Waste rubble is broken and sorted for lesser construction uses."
  pp_stone_quarry_improved_base_stone: "Surveyed Stone Face"
  pp_stone_quarry_improved_base_stone_desc: "The surveyed stone face: what the worked rock gives before the works improve on it."
  pp_stone_quarry_improved_no_primary: "No Block Dressing"
  pp_stone_quarry_improved_no_primary_desc: "No blocks are dressed or hauled by teams; a few hands only break stone from the face."
  pp_stone_quarry_improved_crane_winch_quarrying: "Crane-and-Winch Quarrying"
  pp_stone_quarry_improved_crane_winch_quarrying_desc: "Timber cranes with winches and pulleys lift heavy blocks from deep quarry faces onto carts. Treadwheel and winch cranes had served great cathedral and castle building since the Middle Ages."
  pp_stone_quarry_improved_ox_haulage: "Ox-Drawn Block Haulage"
  pp_stone_quarry_improved_ox_haulage_desc: "Dressed blocks are loaded onto sledges and rollers and dragged by yoked oxen from the face to the road. Oxen move very heavy stone slowly but surely."
  pp_stone_quarry_improved_no_secondary: "No Rubble Sorting"
  pp_stone_quarry_improved_no_secondary_desc: "No rubble is broken into sand here; the waste stone is tipped and the crews keep to the blocks."
  pp_stone_quarry_improved_rubble_breaking: "Rubble Breaking"
  pp_stone_quarry_improved_rubble_breaking_desc: "Waste rubble from the face is broken with hammers and sieved into gravel and sand for mortar and roads. Little of the quarry is thrown away."
  pp_stone_quarry_improvements: "Quarry Dressing"
  pp_stone_quarry_improvements_desc: "Better quarry logistics, block hoists, skids, and dressing benches let stone yards square larger blocks before transport."
  pp_stone_quarry_improved_market_sales: "Market Sales"
  pp_stone_quarry_improved_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  stone_quarry_improved_slot_3: "Market"
