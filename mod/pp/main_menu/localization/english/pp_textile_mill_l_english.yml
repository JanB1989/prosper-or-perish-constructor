# >>> eu5-building-pipeline:textile_mill:localization
  pp_textile_mill_cotton_mill_maintenance: "Cotton Cloth"
  pp_textile_mill_cotton_mill_maintenance_desc: "Water frames and spinning mules spin cotton finer and faster than any hand, and the power loom follows. The mills of Lancashire led the change."
  pp_textile_mill_wool_mill_maintenance: "Wool Cloth"
  pp_textile_mill_wool_mill_maintenance_desc: "Carding engines and spinning jennies prepare and spin the wool, and the cloth is woven, fulled and dyed under one roof. Yorkshire's woollen towns moved from the cottage to the mill this way."
  pp_textile_mill_fiber_crops_mill_maintenance: "Linen Cloth"
  pp_textile_mill_fiber_crops_mill_maintenance_desc: "Flax is spun wet on powered spinning frames, which gives a fine, even yarn, and woven into linen by the mile, as in the mills of Ulster and Leeds."
  pp_textile_mill_market_sales: "Market Sales"
  pp_textile_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  pp_textile_mill_legacy_cotton_cloth_workshop_maintenance: "$cotton_cloth_workshop_maintenance$ (Old Ways)"
  pp_textile_mill_legacy_cotton_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_textile_mill_legacy_fiber_crops_cloth_workshop_maintenance: "$fiber_crops_cloth_workshop_maintenance$ (Old Ways)"
  pp_textile_mill_legacy_fiber_crops_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_textile_mill_legacy_wool_cloth_workshop_maintenance: "$wool_cloth_workshop_maintenance$ (Old Ways)"
  pp_textile_mill_legacy_wool_cloth_workshop_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('cloth_workshop')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
