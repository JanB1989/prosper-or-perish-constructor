# >>> eu5-building-pipeline:tin_streamworks:localization
  tin_streamworks_slot_0: "Tin Ground"
  tin_streamworks_slot_1: "Associated Ore Sorting"
  tin_streamworks_slot_2: "Tin Streaming"
  tin_streamworks: "Tin Streamworks"
  tin_streamworks_desc: "Streamworks wash alluvial gravel for dark cassiterite, the chief tin ore. Workers also sort small lots of copper and lead ore from the same ground."
  pp_tin_streamworks_base_tin: "Cassiterite Gravel"
  pp_tin_streamworks_base_tin_desc: "The cassiterite gravel itself: what the stream bed gives before any tinner improves on it."
  pp_tin_streamworks_no_primary: "No Tin Streaming"
  pp_tin_streamworks_no_primary_desc: "No streaming boards are worked; a few hands only pick tin stone from the stream gravel."
  pp_tin_streamworks_tin: "Cassiterite Streaming"
  pp_tin_streamworks_tin_desc: "Leats bring water to streaming boards where the gravel is worked over and over until only the heavy black tin stone is left. It is smelted with charcoal in a blowing house, as on the moors of Cornwall and Devon."
  pp_tin_streamworks_hand_streaming: "Hand Streaming"
  pp_tin_streamworks_hand_streaming_desc: "Tinners shovel the gravel into running water by hand and let the stream carry the light earth away. The heavy black tin stone stays behind for the smelter."
  pp_tin_streamworks_no_secondary: "No Associated Ore Sorting"
  pp_tin_streamworks_no_secondary_desc: "No associated ore is picked out; the tinners keep to the tin."
  pp_tin_streamworks_copper: "Stannite Sorting"
  pp_tin_streamworks_copper_desc: "Some tin grounds carry stannite and other copper ores. The tinners sort them from the gravel and sell the copper smelted from them to the brass and bell founders."
  pp_tin_streamworks_lead: "Galena Picking"
  pp_tin_streamworks_lead_desc: "Lumps of grey galena turn up in the tin gravel. The tinners pick them out and smelt a little lead on the side in the same hearths."
  pp_tin_streamworks_market_sales: "Market Sales"
  pp_tin_streamworks_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  tin_streamworks_slot_3: "Market"
# <<< eu5-building-pipeline:tin_streamworks:localization
