# >>> eu5-building-pipeline:tin_stamping_mill:localization
  tin_stamping_mill_slot_0: "Tin Lode"
  tin_stamping_mill_slot_1: "Sulphide Ore Sorting"
  tin_stamping_mill_slot_2: "Stamped Tin Dressing"
  tin_stamping_mill: "Tin Stamping Mill"
  tin_stamping_mill_desc: "Water-powered stamps crush lode tin for dressing floors and settling troughs. The mill concentrates cassiterite and sorts copper and lead ores from the waste."
  pp_tin_stamping_mill_base_tin: "Surveyed Tin Lode"
  pp_tin_stamping_mill_base_tin_desc: "The surveyed tin lode: what the mapped vein gives before the works improve on it."
  pp_tin_stamping_mill_no_primary: "No Tin Dressing"
  pp_tin_stamping_mill_no_primary_desc: "No stamps crush the lode; a few hands only pick tin stone from the weathered vein."
  pp_tin_stamping_mill_tin: "Stamped Tin Dressing"
  pp_tin_stamping_mill_tin_desc: "Water wheels drive heavy stamps that crush the hard lode tin to sand. Buddles and settling troughs wash the light waste away, and the black tin goes to the blowing house to be smelted."
  pp_tin_stamping_mill_no_secondary: "No Sulphide Sorting"
  pp_tin_stamping_mill_no_secondary_desc: "No sulphide ore is sorted out; the mill keeps to the tin."
  pp_tin_stamping_mill_copper: "Copper Sulphide Sorting"
  pp_tin_stamping_mill_copper_desc: "Copper sulphides often lie in the same lodes as the tin. The dressers sort them out and sell them to the copper smelters, a trade that later grew larger than the tin in parts of Cornwall."
  pp_tin_stamping_mill_lead: "Lead Ore Picking"
  pp_tin_stamping_mill_lead_desc: "Galena broken out with the tin lode is picked from the stamped ore at the dressing floors. It is smelted apart for its lead, a useful extra for the mill."
  pp_tin_stamping_mill_market_sales: "Market Sales"
  pp_tin_stamping_mill_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  tin_stamping_mill_slot_3: "Market"
