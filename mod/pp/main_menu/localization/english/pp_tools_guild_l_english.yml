# >>> eu5-building-pipeline:tools_guild:localization
  pp_tools_guild_price: "[ShowBuildingTypeName('tools_guild')|e] Price"
  tools_guild_slot_0: "[ShowBuildingTypeName('tools_guild')|e] Work"
  pp_tools_guild_metalwork_guild_maintenance: "Iron Tools"
  pp_tools_guild_metalwork_guild_maintenance_desc: "The village and town smiths forge iron at the anvil into ploughshares, sickles, axes and nails, the tools that every farm and every trade depends on."
  pp_tools_guild_stone_tools_guild_maintenance: "Stone Tools"
  pp_tools_guild_stone_tools_guild_maintenance_desc: "Where metal is rare, toolmakers flake and grind hard stone into axes, adzes, knives and blades, a skill that remained central in much of the Americas and the Pacific."
  pp_tools_guild_bronze_tools_guild_maintenance: "Bronze Tools"
  pp_tools_guild_bronze_tools_guild_maintenance_desc: "Copper alloyed with a little tin gives bronze, which is harder and holds an edge. Bronze tools were cast in moulds and finished by hammering."
  pp_tools_guild_copper_tools_guild_maintenance: "Copper Tools"
  pp_tools_guild_copper_tools_guild_maintenance_desc: "Smiths hammer and anneal copper into knives, chisels, needles and axe heads. Copper is soft and blunts quickly, but it is easy to work and to mend."
  pp_tools_guild_market_sales: "Market Sales"
  pp_tools_guild_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  tools_guild_slot_1: "Market"
# <<< eu5-building-pipeline:tools_guild:localization
