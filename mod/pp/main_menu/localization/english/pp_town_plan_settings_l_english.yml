l_english:
  # Generated by ppc finalize (town_plan_settings_gui.py) from the plan list (town_plans.py); do not edit by hand.
  # The Construction Plan window's Plans tab (gui/pp_town_plan_settings_generated.gui)
  PP_TPLAN_SET_PLUS: "+"
  PP_TPLAN_SET_MINUS: "-"
  PP_TPLAN_SET_ON: "On"
  PP_TPLAN_SET_OFF: "Off"
  PP_TPLAN_SET_ANY: "any"
  PP_TPLAN_SET_ALL: "All plans"
  PP_TPLAN_SET_ALL_TT: "#T All plans#!\nHow the Construction Plan builds for the plans you set on your [locations|e]. They start at values that suit most games: change them only if you want a plan to behave differently."
  PP_TPLAN_SET_PB: "Payback limit"
  PP_TPLAN_SET_PB_TT: "#T Payback limit#!\nThe longest a plan's next level may take to pay back its cost. At any, a plan builds whether its buildings pay or not: it is your plan. Each plan below can have its own limit."
  PP_TPLAN_SET_PB_ALL: "[SelectLocalization(EqualTo_CFixedPoint(GetPlayer.MakeScope.ScriptValue('pp_tplan_pb_years_all'), '(CFixedPoint)0'), 'PP_TPLAN_SET_ANY', 'PP_TPLAN_SET_YEARS_ALL')]"
  PP_TPLAN_SET_YEARS_ALL: "[GetPlayer.MakeScope.ScriptValue('pp_tplan_pb_years_all')|0] years"
  PP_TPLAN_SET_SHORTER_TT: "A shorter payback limit for every plan that has none of its own"
  PP_TPLAN_SET_LONGER_TT: "A longer payback limit for every plan that has none of its own; the longest is any"
  PP_TPLAN_SET_LOSS: "Never add a level to a building that loses money"
  PP_TPLAN_SET_LOSS_TT: "#T Buildings that lose money#!\nWhile on, a plan adds no level to a building that loses money in that [location|e]; it waits until the building pays again. Off: it builds the level anyway."
  PP_TPLAN_SET_STAFF: "Wait for free workers"
  PP_TPLAN_SET_STAFF_TT: "#T Workers#!\nWhile on, a plan adds a level only where enough people are free to work it, so new levels do not stand empty. Off: it builds without waiting for them."
  PP_TPLAN_SET_FREE: "Close other businesses for a plan's workers"
  PP_TPLAN_SET_FREE_TT: "#T Workers for a plan#!\nWhile on, where a plan's next level waits only for workers, the plan closes one other [building|e] of yours in that [location|e] whose workers can take the new jobs, the one that earns least per worker first, then gives the people time before it closes the next. It never closes a building of the location's plans, a public building, a logistics building, an improvement or a subsidised building, and it keeps the buildings that feed the [province|e] open while its food store is short. Taking the plan off, or switching this off, opens them again. A building you open yourself stays open."
  PP_TPLAN_SET_ALONE: "Other businesses in planned locations"
  PP_TPLAN_SET_ALONE_TT: "#T Other businesses in planned locations#!\nWhile on, the Businesses rule of the Global Settings tab still builds its own businesses in a [location|e] with a plan, where they pay. A plan's own workers come first: while a plan there waits for workers, the Businesses rule builds nothing there. Off: only the plan's buildings are built there, and the food, logistics, improvement and public buildings of the other rule groups."
  PP_TPLAN_SET_RIGHTS: "Grant a plan's charter and rights"
  PP_TPLAN_SET_RIGHTS_TT: "#T Charter and rights#!\nWhile on, a planned town gets the charter of its good, and later the stronger rights, as soon as it qualifies, for the usual price in [political_influence|e]. The political influence you keep back on the Towns and Buildings tab is never touched. Off: plans only build, and grant no [town_rights|e]."
  PP_TPLAN_SET_ORDER: "Several plans in one location"
  PP_TPLAN_SET_ORDER_TT: "#T Several plans in one location#!\nTake turns: the plans of a [location|e] are served one after the other, so each of them grows. Best payback first: the plan whose next level pays back fastest goes first, and the others wait."
  PP_TPLAN_SET_TURNS: "Take turns"
  PP_TPLAN_SET_BEST: "Best payback first"
  PP_TPLAN_SET_CLOSE: "Close buildings that lose money"
  PP_TPLAN_SET_CLOSE_TT: "#T The game's own automation#!\nThis switches the game's own automation that closes buildings losing money, for your whole country, not only for the plans. A plan never adds a level to a closed building."
  PP_TPLAN_SET_EACH: "Each plan"
  PP_TPLAN_SET_EACH_TT: "#T Each plan#!\nClick a plan to see what it builds and to give it settings of its own. A green dot marks a plan with a setting of its own."
  PP_TPLAN_SET_HINT: "Click a plan to see what it builds and to give it settings of its own."
  PP_TPLAN_SET_SAME: "same as all plans"
  PP_TPLAN_SET_PB_PLAN_TT: "#T Payback limit of this plan#!\nThe longest this plan's next level may take to pay back its cost. Until you change it, the plan follows the limit of all plans."
  PP_TPLAN_SET_SHORTER_PLAN_TT: "A shorter payback limit for this plan alone"
  PP_TPLAN_SET_LONGER_PLAN_TT: "A longer payback limit for this plan alone; the longest is any"
  PP_TPLAN_SET_RESET: "Same as all plans"
  PP_TPLAN_SET_RESET_TT: "Drop this plan's own limit: it follows the limit of all plans again"
  PP_TPLAN_SET_OWN_MARK: " (its own)"
  PP_TPLAN_OPT_RESET_TT: "Drop this plan's own setting: it follows the setting of all plans again"
  PP_TPLAN_OPT_EFF: "Lowest production efficiency"
  PP_TPLAN_OPT_EFF_TT: "#T Lowest production efficiency#!\nA goods plan starts a first level, a further level or a newer tier only where the lasting [production_efficiency|e] of the [location|e] is at least this: what the location and your [country|e] give every [building|e] there. Effects that last only a few years and raised levies are left out, and so is what belongs to one building alone, such as a new building settling in. At none, a plan builds whatever the efficiency. Each goods plan below can have its own line."
  PP_TPLAN_OPT_EFF_S0: "none"
  PP_TPLAN_OPT_EFF_DOWN_TT: "A lower line; below the lowest: none"
  PP_TPLAN_OPT_EFF_UP_TT: "A higher line"
