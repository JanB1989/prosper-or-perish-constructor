  PP_TPLAN_SET_PICK_CAMELS: "#T [ShowGoodsName('camels')|e]#!\nPayback limit: $PP_TPLAN_SET_PB_CAMELS$[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('pp_tplan_pb_own_camels'), '(CFixedPoint)0.5'), 'PP_TPLAN_SET_OWN_MARK', 'PP_TPLAN_SET_EMPTY')]\n$PP_TPLAN_OPT_EFF$: $PP_TPLAN_OPT_EFF_V_CAMELS$[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('pp_tplan_eff_own_camels'), '(CFixedPoint)0.5'), 'PP_TPLAN_SET_OWN_MARK', 'PP_TPLAN_SET_EMPTY')]\n#weak Click to see what it builds#!"
