  PP_TPLAN_OPT_RAISE: "Raise a settlement for its plan"
  PP_TPLAN_OPT_RAISE_TT: "#T Raise a settlement for its plan#!\nWhile on, where none of a plan's buildings can stand on the settlement's [location_rank|e], the plan raises the rank first and saves for it. Off: such a plan waits until you raise the settlement yourself."
  PP_TPLAN_OPT_RAISE_S0: "Off"
  PP_TPLAN_OPT_RAISE_S1: "On"
  PP_TPLAN_OPT_FOOD_FARMS: "Farms and other staple food makers"
  PP_TPLAN_OPT_FOOD_FARMS_TT: "#T Staple food makers#!\nWhile on, the Food plan builds the buildings that make the [pp_staple_foods|e] here, before anything else. Off: it builds none of them and goes straight to the kitchens and Taverns."
  PP_TPLAN_OPT_FOOD_FARMS_S0: "Off"
  PP_TPLAN_OPT_FOOD_FARMS_S1: "On"
  PP_TPLAN_OPT_FOOD_KITCHENS: "Kitchens"
  PP_TPLAN_OPT_FOOD_KITCHENS_TT: "#T Kitchens#!\nWhile on, the Food plan builds the [ShowBuildingTypeName('cookshop')|e] and its newer kinds where the staple food makers have nothing left to build. Off: it builds no kitchens."
  PP_TPLAN_OPT_FOOD_KITCHENS_S0: "Off"
  PP_TPLAN_OPT_FOOD_KITCHENS_S1: "On"
  PP_TPLAN_OPT_FOOD_TAVERNS: "Taverns"
  PP_TPLAN_OPT_FOOD_TAVERNS_TT: "#T Taverns#!\nWhen the Food plan builds the [ShowBuildingTypeName('tavern')|e], always after the staple food makers: never, only while the [provincial_food|e] of the [province|e] is short (a normal year would leave little in store), or whenever one can be built."
  PP_TPLAN_OPT_FOOD_TAVERNS_S0: "Never"
  PP_TPLAN_OPT_FOOD_TAVERNS_S1: "While the store is short"
  PP_TPLAN_OPT_FOOD_TAVERNS_S2: "Always"
  PP_TPLAN_OPT_FOOD_STORE: "Build only while the store lasts less than"
  PP_TPLAN_OPT_FOOD_STORE_TT: "#T A full store#!\nThe Food plan builds nothing while the [provincial_food|e] of the [province|e] lasts this many months or more. At always, it builds however full the store is."
  PP_TPLAN_OPT_FOOD_STORE_S0: "always"
  PP_TPLAN_OPT_FOOD_STORE_DOWN_TT: "Fewer months"
  PP_TPLAN_OPT_FOOD_STORE_UP_TT: "More months; past the longest: always"
  PP_TPLAN_OPT_FOOD_STORE_N: "[GetPlayer.MakeScope.ScriptValue('pp_tplan_food_store_months')|0] months"
  PP_TPLAN_OPT_FOOD_STORE_V: "[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('pp_tplan_food_store_set'), '(CFixedPoint)0.5'), 'PP_TPLAN_OPT_FOOD_STORE_N', 'PP_TPLAN_OPT_FOOD_STORE_S0')]"
  PP_TPLAN_OPT_TRADE_USE: "Build only while our trade capacity is used"
  PP_TPLAN_OPT_TRADE_USE_TT: "#T Trade capacity in use#!\nEvery building of the Trade plan adds [merchant_capacity|e]. The plan builds only where at least this share of the merchant capacity you already have in that location's [market|e] is in use; where you have none there yet, it builds. At always, it builds whether you use your capacity or not."
  PP_TPLAN_OPT_TRADE_USE_S0: "always"
  PP_TPLAN_OPT_TRADE_USE_DOWN_TT: "A lower share; below the lowest: always"
  PP_TPLAN_OPT_TRADE_USE_UP_TT: "A higher share"
  PP_TPLAN_OPT_TRADE_USE_N: "[GetPlayer.MakeScope.ScriptValue('pp_tplan_trade_use_pct')|0]%"
  PP_TPLAN_OPT_TRADE_USE_V: "[SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('pp_tplan_trade_use_set'), '(CFixedPoint)0.5'), 'PP_TPLAN_OPT_TRADE_USE_N', 'PP_TPLAN_OPT_TRADE_USE_S0')]"
  PP_TPLAN_OPT_TRADE_MARKET: "Marketplaces"
  PP_TPLAN_OPT_TRADE_MARKET_TT: "#T Marketplaces#!\nWhile on, the Trade plan builds the [ShowBuildingTypeName('marketplace')|e] and its newer kinds. Off: it builds none of them."
  PP_TPLAN_OPT_TRADE_MARKET_S0: "Off"
  PP_TPLAN_OPT_TRADE_MARKET_S1: "On"
  PP_TPLAN_OPT_TRADE_PORT: "[ShowBuildingTypeName('port_authority')|e]"
  PP_TPLAN_OPT_TRADE_PORT_TT: "#T Port buildings#!\nWhile on, the Trade plan builds the [ShowBuildingTypeName('port_authority')|e]. Off: it does not."
  PP_TPLAN_OPT_TRADE_PORT_S0: "Off"
  PP_TPLAN_OPT_TRADE_PORT_S1: "On"
  PP_TPLAN_OPT_TRADE_CENTRE: "Market centre buildings"
  PP_TPLAN_OPT_TRADE_CENTRE_TT: "#T Market centre buildings#!\nWhile on, the Trade plan builds the buildings of a [market|e] centre. Off: it builds none of them."
  PP_TPLAN_OPT_TRADE_CENTRE_S0: "Off"
  PP_TPLAN_OPT_TRADE_CENTRE_S1: "On"
