# >>> eu5-building-pipeline:transport_office:localization
  transport_office_slot_0: "Dispatch"
  transport_office_slot_1: "Freight Crews"
  pp_transport_office_construction: "[ShowBuildingTypeName('transport_office')|e] Construction"
  pp_transport_office_maintenance: "Clerks and Carts"
  pp_transport_office_maintenance_desc: "Clerks book the loads at the office, and carters take them through the town gates to the warehouses. Carts, harness and paper keep it running."
  pp_transport_office_hand_carts: "Hand Carts"
  pp_transport_office_hand_carts_desc: "Porters push hand carts and barrows through the streets from the warehouses to the gates, and a clerk keeps a simple tally. It needs many hands and little else."
  pp_transport_office_ledgered_dispatch: "Ledgered Dispatch"
  pp_transport_office_ledgered_dispatch_desc: "Every load is weighed, entered in a ledger and sent off with a dispatch note, so the carts leave full and on time. Paperwork takes the place of much running about."
  transport_office: "Transport Office"
  transport_office_desc: "Freight clerks, porters and weighmen turn a town's bulk into ordered dispatches for the market. A [location|e] with more [building|e] levels than its [supported_building_levels|e] loses [market_access|e], and every level of this building gives some of it back. It stands in cities and developed towns."
  pp_transport_office_logistics_network: "Dispatch Network"
  pp_transport_office_logistics_network_desc: "Agents in the neighbouring towns pass consignments along a standing schedule, so some freight keeps moving even when the office's own carts stand idle."
