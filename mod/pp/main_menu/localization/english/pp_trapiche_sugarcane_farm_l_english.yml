# >>> eu5-building-pipeline:trapiche_sugarcane_farm:localization
  trapiche_sugarcane_farm: "Trapiche Sugarcane Farm"
  trapiche_sugarcane_farm_desc: "Trapiche farms press fresh cane with wooden rollers, then boil the juice in pans and clay molds before it spoils."
  trapiche_sugarcane_farm_slot_0: "Cane Fields"
  trapiche_sugarcane_farm_slot_1: "Boiling"
  trapiche_sugarcane_farm_slot_2: "Trapiche Pressing"
  pp_trapiche_sugarcane_farm: "Trapiche Sugar Pressing"
  pp_trapiche_sugarcane_farm_desc: "Wooden trapiches and better boiling gear let cane farms press and finish more sugar close to the fields."
  pp_trapiche_sugarcane_farm_base_sugar: "Cane Fields"
  pp_trapiche_sugarcane_farm_base_sugar_desc: "The fields themselves: what the cane yields with plain cutting before any pressing."
  pp_trapiche_sugarcane_farm_hand_crushing: "Hand Crushing"
  pp_trapiche_sugarcane_farm_hand_crushing_desc: "No trapiche is built here; the cane is crushed by hand with stones and pounders."
  pp_trapiche_sugarcane_farm_no_boiling: "No Boiling House"
  pp_trapiche_sugarcane_farm_no_boiling_desc: "No kettles are fired here; the cane juice is drunk or sold fresh."
  pp_trapiche_sugarcane_farm_open_kettles: "Open Kettles"
  pp_trapiche_sugarcane_farm_open_kettles_desc: "The cane juice is boiled down in open kettles over a fire, skimmed with ladles and poured into clay molds to harden. Small farms made a dark, unrefined sugar this way, the panela of Spanish America."
  pp_trapiche_sugarcane_farm_trapiche_pressing: "Trapiche Pressing"
  pp_trapiche_sugarcane_farm_trapiche_pressing_desc: "A trapiche is a wooden mill of upright rollers, turned by oxen, mules or water, that squeezes the juice out of the cane. Mills of this kind spread through the sugar lands of the Americas in the seventeenth century."
  pp_trapiche_sugarcane_farm_market_sales: "Market Sales"
  pp_trapiche_sugarcane_farm_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  trapiche_sugarcane_farm_slot_3: "Market"
