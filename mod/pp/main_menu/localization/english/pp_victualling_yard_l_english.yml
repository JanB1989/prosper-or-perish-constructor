l_english:

# >>> eu5-building-pipeline:victualling_yard:localization
  victualling_yard: "Victualling Yard"
  victualling_yard_desc: "The best way to make [ShowGoodsName('victuals')|e]: merchants buy [Concept('pp_staple_foods', 'staple foods')|e] on the market and pack them into victuals for shipping, without touching the province's [Concept('provincial_food', 'food store')|e]. It can only be built in a good [Concept('natural_harbor_suitability', 'natural harbour')|e] or a [market_center|e], and harbours hold the most levels."
  victualling_yard_slot_0: "Food Shipments"
  victuals_trade_construction: "Victuals Trade Construction"
  pp_victualling_yard_grain_shipment: "Grain Shipment"
  pp_victualling_yard_grain_shipment_desc: "Merchants buy wheat in bulk, have it milled and baked into hard ship's biscuit, and pack it in sacks and casks. Biscuit was the bread of every navy and long voyage."
  pp_victualling_yard_rice_shipment: "Rice Shipment"
  pp_victualling_yard_rice_shipment_desc: "Merchants buy husked rice and pack it in sacks and baskets for the holds. Dry rice keeps well at sea and fed sailors and soldiers all over Asia."
  pp_victualling_yard_millet_shipment: "Millet Shipment"
  pp_victualling_yard_millet_shipment_desc: "Merchants buy millet and pack the small, hard grain for the road and the sea. It stores longer than most grains and fed caravans and armies across Africa and Asia."
  pp_victualling_yard_maize_shipment: "Maize Shipment"
  pp_victualling_yard_maize_shipment_desc: "Merchants buy dried maize, shelled or ground into meal, and pack it in sacks and barrels for shipping. Maize meal fed crews and settlers all around the Atlantic."
  pp_victualling_yard_legumes_shipment: "Pease Shipment"
  pp_victualling_yard_legumes_shipment_desc: "Dried peas and beans keep for years in the hold and were a fixed part of every ship's rations."
  pp_victualling_yard_fish_shipment: "Salt Fish Shipment"
  pp_victualling_yard_fish_shipment_desc: "Barrels of salted herring, stockfish and salt cod come in from the fishing grounds."
  pp_victualling_yard_salt_beef_shipment: "Salt Beef Shipment"
  pp_victualling_yard_salt_beef_shipment_desc: "Barrels of salted beef and pork and casks of butter come in from the cattle country."
  victualling_yard_rice_shipment_advance: "Rice Shipments"
  victualling_yard_rice_shipment_advance_desc: "The harbours of the rice lands ship husked rice along the coasts and rivers to the markets beyond."
  victualling_yard_maize_shipment_advance: "Maize Shipments"
  victualling_yard_maize_shipment_advance_desc: "The harbours of the maize lands ship dried maize along the coasts and rivers to the markets beyond."
  pp_victualling_yard_price: "[ShowBuildingTypeName('victualling_yard')|e] Price"
  pp_victualling_yard_market_sales: "Market Sales"
  pp_victualling_yard_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  victualling_yard_slot_1: "Market"
# <<< eu5-building-pipeline:victualling_yard:localization
