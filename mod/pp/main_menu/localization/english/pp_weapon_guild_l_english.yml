  pp_weapon_guild_pre_columbian_weapon_smith_maintenance: "Stone Weapons"
  pp_weapon_guild_pre_columbian_weapon_smith_maintenance_desc: "Weaponmakers flake and grind stone into spear points, arrowheads and club heads and haft them in wood, weapons used where metal was unknown or rare."
