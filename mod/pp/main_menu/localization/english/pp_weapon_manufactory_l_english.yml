  pp_weapon_manufactory_legacy_pre_columbian_weapon_smith_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('weapon_guild')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
