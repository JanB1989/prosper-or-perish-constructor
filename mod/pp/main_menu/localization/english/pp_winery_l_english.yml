  pp_winery_fruit_winery_maintenance: "Fruit Wine"
  pp_winery_fruit_winery_maintenance_desc: "Grapes and other fruit are trodden or pressed, and the juice ferments in vats and casks. Every wine country had its local vintners, who sold the year's wine young."
  pp_winery_rice_winery_maintenance: "Rice Wine"
  pp_winery_rice_winery_maintenance_desc: "Steamed rice is brewed with a mould starter in several stages into a strong, clear rice wine. Chinese yellow wine and Japanese sake were made this way."
  pp_winery_honey_winery_maintenance: "Mead"
  pp_winery_honey_winery_maintenance_desc: "Honey is thinned with water, spiced and fermented in casks into mead. The old drink held on in Poland, Russia, Scandinavia and Ethiopia, where vines would not grow."
  pp_winery_market_sales: "Market Sales"
  pp_winery_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
