l_english:

# >>> eu5-building-pipeline:winery_manufactory:localization
  winery_manufactory_slot_0: "[ShowBuildingTypeName('winery_manufactory')|e] Work"
  pp_winery_manufactory_fruit_winery_manufactory_maintenance: "Fruit Wine"
  pp_winery_manufactory_fruit_winery_manufactory_maintenance_desc: "A large wine house presses and ages the wine in its cellars and bottles the best of it in strong glass. Corked bottles let wine age and travel, which made a trade in fine vintages possible."
  pp_winery_manufactory_rice_winery_manufactory_maintenance: "Rice Wine"
  pp_winery_manufactory_rice_winery_manufactory_maintenance_desc: "The brewers work many vats at once through the winter brewing season and store the wine in stoneware jars. The great sake breweries of Itami and Nada grew this way."
  pp_winery_manufactory_honey_winery_manufactory_maintenance: "Mead"
  pp_winery_manufactory_honey_winery_manufactory_maintenance_desc: "The mead house ferments honey by the cask and ages the stronger kinds for years in its cellars. Monasteries and towns in the honey lands of eastern Europe made mead on this scale."
  pp_winery_manufactory_market_sales: "Market Sales"
  pp_winery_manufactory_market_sales_desc: "A few hands carry a small share of the produce straight to market. It pays only while the goods fetch a good price."
  winery_manufactory_slot_1: "Market"
  pp_winery_manufactory_legacy_fruit_winery_maintenance: "$fruit_winery_maintenance$ (Old Ways)"
  pp_winery_manufactory_legacy_fruit_winery_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('winery')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
  pp_winery_manufactory_legacy_rice_winery_maintenance: "$rice_winery_maintenance$ (Old Ways)"
  pp_winery_manufactory_legacy_rice_winery_maintenance_desc: "An older way of working, kept from the [ShowBuildingTypeName('winery')|e]. It still runs on its old materials, but turns out less per level than the methods of this age."
# <<< eu5-building-pipeline:winery_manufactory:localization
