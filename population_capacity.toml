[population_capacity]
generated_label = "Prosper or Perish"
managed_write_mode = "mod_root"

[capacity_scale]
# The accepted absolute estimates are normalized only after model selection.
min = 10
max = 100
# Active compiler mode for inspection.  ``raw`` sends capacity_people_p50
# through the people-to-EU5 conversion below; switch back to ``normalized`` to
# restore the gameplay band.
mode = "raw"
# EU5 stores population in thousands of people: 1000 physical people = 1 game unit.
people_per_game_population_unit = 1000

[calibration]
historical_population_policy = "evidence_registry_only"
land_potential_sources = ["gaez_v5", "gaez_v4", "chelsa_trace21k", "archaeoglobe_technology_only"]
groundwater_registry = "population_capacity_groundwater_registry.toml"

[carrying_capacity]
baseline = "../ProsperOrPerishLabelingPipeline/base_data/locations_with_raw_material.parquet"
geometry = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/location_geometry_candidate.parquet"
calibrated_geometry = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/location_geometry_candidate.parquet"
control_points = "population_capacity_control_points.csv"
geometry_transform = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/coordinate_transform_candidate.json"
geometry_residuals = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/control_point_residuals.parquet"
sample_points = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/full/game_authoritative_physical_samples.parquet"
sample_points_audit = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/full/game_authoritative_sample_acceptance_audit.json"
geometry_resolution_audit = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/full/game_authoritative_coordinate_resolution.json"
physical_raster_hit_audit = "artifacts/data/population_capacity/geometry_land_contract_candidate_v1/full/physical_raster_hit_rate_comparison.json"
source_root = "artifacts/data/population_capacity/sources"
land_potential = "artifacts/data/population_capacity/location_land_potential.parquet"
source_manifest = "artifacts/data/population_capacity/sources/source_manifest.json"
crop_mode_labels = "artifacts/data/population_capacity/crop_mode_labels.parquet"
crop_history_registry = "population_capacity_crop_history_registry.toml"
crop_history_evidence = "population_capacity_crop_history_evidence.csv"
pyaez_yields = "artifacts/data/population_capacity/pyaez_1337_yields.parquet"
pyaez_climate_inputs = "artifacts/data/population_capacity/sources/pyaez_1337/all_samples/climate_inputs_600bp.parquet"
crop_risk_scenarios_root = "artifacts/data/population_capacity/pyaez_1337/crop_risk_scenarios"
physical_parameter_scenarios = "artifacts/data/population_capacity/physical_parameter_scenarios.parquet"
irrigation_physical_inputs = "artifacts/data/population_capacity/irrigation_physical_inputs.parquet"
# Surface hydrology is merged with the cited WHYMAP + pre-1337 groundwater
# technology fallback.  The merge artifact preserves the original surface
# source hash and is regenerated by scripts/build_whymap_groundwater_wave29.py
# whenever the source labels change.
irrigation_feasibility = "artifacts/data/population_capacity/groundwater_whymap_wave29/irrigation_feasibility_with_groundwater.parquet"
historical_yield_source_root = "artifacts/data/population_capacity/historical_yields/raw/bahs"
historical_yield_audit_dir = "artifacts/data/population_capacity/historical_yields"
physical_validation_registry = "research/population_capacity/physical_validation/interannual_yield_skill_registry_wave27.json"
historical_climate_risk_registry = "research/population_capacity/physical_validation/historical_climate_risk_wave29.json"
crop_yield_risk_bridge_registry = "research/population_capacity/physical_validation/isimip_multicrop_bridge_wave30.json"
crop_water_gap_registry = "research/population_capacity/physical_validation/crop_water_gap_wave31.json"
label_audit_dir = "artifacts/data/population_capacity/label_audit"
fisheries_labels = "artifacts/data/population_capacity/fisheries/fisheries_location_labels.parquet"
