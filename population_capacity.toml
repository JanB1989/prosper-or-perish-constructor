tsetse_source_root = "artifacts/data/population_capacity/terrestrial_subsistence_sources/tsetse"
technology_registry = "population_capacity_technology_registry.toml"
benchmarks = "population_capacity_benchmarks.toml"
area_benchmarks = "population_capacity_area_benchmarks.toml"
