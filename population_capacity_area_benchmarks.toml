schema_version = 1

# Bounded islands are geometry QA cases, never demographic observations.  Land
# area is used because lake and sea pixels are not RGO locations.  These values
# do not rescale particular regions; they expose projection/map-design error in
# both the calibrated pixel/Jacobian estimate and the legacy image formula.

[[area_benchmarks]]
benchmark_id = "iceland_land"
label = "Iceland"
actual_area_km2 = 100830
role = "calibration"
include = ["area=iceland_area"]
source = "https://data.worldbank.org/indicator/AG.LND.TOTL.K2?locations=IS"

