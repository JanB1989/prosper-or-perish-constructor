schema_version = 3
target_year = 1337

# This is an evidence registry, not a list of regional population targets.
# Only role="scale_anchor" with review_status="vetted" may calibrate global
# scale. Candidate, validation-only, lower-bound and excluded observations
# remain visible so failed investigations are not silently forgotten.

[[benchmarks]]
anchor_id = "england_1290_1315"
label = "England before the Great Famine"
year_start = 1290
year_end = 1315
population_low = 4400000
population_central = 4800000
population_high = 5200000
saturation_low = 0.85
saturation_central = 0.925
saturation_high = 1.0
pressure_evidence = [
  "cultivation extended onto marginal land",
  "soil exhaustion and low yields",
  "exceptionally low early-fourteenth-century real wages",
  "subsistence pressure before the Great Famine",
]
shock_flags = ["Great Famine begins after the observation window"]
trade_dependence = "low"
food_regime = "rainfed cool cereals, legumes, livestock, and coastal fisheries"
role = "scale_anchor"
source_family = "english_demographic_and_manorial_reconstructions"
source_population_type = "observed_interval"
estimate_method = "spatial_demographic_reconstruction_with_manorial_pressure_evidence"
evidence_role = "scale_candidate"
boundary_confidence = "high"
boundary_overlap_status = "exact"
crosswalk_status = "exact"
benchmark_group = "england_national"
source_family_independence = "independent"
review_status = "vetted"
mapped_boundary = "England within great_britain_region, excluding Wales and all Scottish areas"
local_food_share_low = 0.80
local_food_share_central = 0.90
local_food_share_high = 1.00
local_food_evidence = [
  "cereals supplied about 80 percent of ordinary household calories around 1300",
  "London's exceptional urban cereal demand was supplied by a reconstructable southern-English grain hinterland",
  "the lower bound counts only that domestically supplied cereal calorie share and does not assume that meat, dairy, fish, or ale were imported",
]
local_food_confidence = "medium"
starting_population_test = true
include = ["region=great_britain_region"]
exclude = ["area=hebrides_area|scottish_highlands_area|scottish_lowlands_area|wales_area"]
sources = [
  "https://www.arcgis.com/home/item.html?id=23e944697e0d433cb8622649577fa720",
  "https://warwick.ac.uk/fac/soc/economics/seminars/seminars/conferences/venice3/programme/english_medieval_population.pdf",
  "https://www.cambridge.org/core/journals/continuity-and-change/article/regulation-of-the-rural-market-in-waged-labour-in-fourteenthcentury-england/C7726EC8A2D0C628ACFF49428FDA95A7",
  "https://www.tandfonline.com/doi/full/10.1080/03044181.2023.2250952",
  "https://research.aber.ac.uk/files/70709027/Peasants_and_food_security_in_England_and_Wales_c_1300_1_.pdf",
  "https://archives.history.ac.uk/ihrcms/cmh/projects/research/feeding-the-city2.html",
  "https://wrap.warwick.ac.uk/id/eprint/57581/1/WRAP_35.2010_broadberry.pdf",
]
notes = "Vetted national-scale anchor. The 4.4-5.2m population interval brackets the reconstructed 4.69-4.75m series; the 0.85-1.0 saturation interval reflects convergent marginal-land, wage, underemployment, and food-pressure evidence. Counties remain validation groups until pressure evidence is localized."

