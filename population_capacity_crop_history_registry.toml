schema_version = "crop_history_registry_v2"
reviewed_at = "2026-08-03"
method = "dated point evidence is inverse-mapped to the original EU5 raster: exact containing pixels are accepted directly and non-location pixels may use only the nearest footprint within frozen transform-p95 plus source-record coordinate uncertainty; cited domain/time polygons are applied only within documented scope; no location-centroid, origin-centroid, game-region, coordinate-box, or crop-spread radius expansion"

[policy]
target_year = 1337
# Availability is a Bernoulli feasibility probability.  Dated evidence still
# resolves to 0/1; the central value for an unresolved crop is the explicit
# maximum-entropy prior rather than silently treating every unobserved crop as
# present.  The lower/upper scenarios remain hard 0/1 bounds.
uncertain_p10 = 0
uncertain_p50 = 0.5
uncertain_p90 = 1

