schema_version = 1
target_year = 1337
people_per_game_unit = 1000

# Human-editable draft for the population-capacity fixed-point calibration.
# This file is deliberately separate from population_capacity_benchmarks.toml,
# which is the historical evidence registry.  The current CLI does not consume
# this file yet; it defines the intended contract for the equilibrium solver.
#
# Capacity fill is population / capacity.  Avoid locking a benchmark directly
# on 0.10 or 1.00 because those values are capacity-pressure band boundaries.

[equilibrium_defaults]
population_growth_annual_target = 0.0
population_growth_annual_tolerance = 0.001
development_change_100y_target = 0.0
development_change_100y_tolerance = 2.0
prosperity_change_monthly_target = 0.0
prosperity_change_monthly_tolerance = 0.01
food_residual_share_of_consumption_target = 0.0
food_residual_share_of_consumption_tolerance = 0.01
require_locally_stable_setpoint = true
population_perturbation_fraction = 0.10
development_perturbation_points = 2.0
prosperity_perturbation_points = 5.0

# Editable mechanics used by the equilibrium solver.  For every modifier,
# "current" means its current magnitude in the parsed mod/profile.  Location
# state itself is not summarized here.

