label = "Wuxian dense Jiangnan anchor"
location_tag = "wuxian"
food_scope = "containing_province"
hyde_region = "east_asia"
intent = "Current population, prosperity, and development should be close to a stable dense-rural set point."
mechanic_band = "available_free_land"
target_fill_min = 0.70
target_fill_max = 0.95
lock_mode = "hard"
current_population_is_setpoint = true
current_development_is_setpoint = true
current_prosperity_is_setpoint = true
