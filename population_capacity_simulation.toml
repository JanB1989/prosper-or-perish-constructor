east_africa = ["equatoria_province", "bale_province", "erg_selima_province"]
east_asia = ["suzhou_province", "shimousa_province", "western_gobi_province"]
eastern_europe = ["majar_province", "kozelsk_province", "vorkuta_province"]
middle_east = ["gorgan_province", "hawran_province", "sudair_province"]
