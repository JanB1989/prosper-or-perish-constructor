# Adjustable 1337-1837 population-capacity simulation profile.
# Run only: uv run ppc population-simulation
# The command replaces one Markdown report; it does not write monthly history files.

[simulation]
start_year = 1337
checkpoint_years = [0, 25, 100, 200, 300, 400, 500]
people_per_game_unit = 1000
parser_profile = "constructor"
load_order = "constructor.load_order.toml"
output = "artifacts/data/population_simulation/report.md"

[paths]
location_candidates = "artifacts/data/population_capacity/current_capacity_map/location_candidates.parquet"
location_sample_points = "artifacts/data/population_capacity/location_sample_points.parquet"
hyde_root = "../ProsperOrPerishStaticModifiersV2"
hyde_region_mask = "config/availability/regions.tif"
hyde_population_locations = "data/output_data/hyde_3_5/population_locations_1337.tif"
hyde_cropland = "data/output_data/hyde_3_5/cropland_1337.tif"
hyde_rainfed = "data/output_data/hyde_3_5/total_rainfed_1337.tif"
hyde_irrigated = "data/output_data/hyde_3_5/total_irrigated_1337.tif"
hyde_pasture = "data/output_data/hyde_3_5/pasture_1337.tif"
hyde_urban_population = "data/output_data/hyde_3_5/urban_population_1337.tif"

[deployment]
# One constructor-owned game-facing deployment. The location table is consumed
# by the existing shared location-modifier compiler; setup files make the
# starting development and irrigation values match the simulated year-0 state.
population_capacity_table = "data/population_capacity/population_capacity.csv"
development_setup = "mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/setup/start/14_development.txt"
irrigation_setup = "mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/setup/start/14_pp_population_irrigation.txt"
manifest = "artifacts/data/population_simulation/deployment.json"
development_decimals = 2

[capacity]
# Independent GAEZ/fisheries/terrestrial potential. Historical irrigation is
# excluded here and enters only through HYDE-driven irrigation-system levels.
physical_capacity_columns = [
  "rainfed_crop_capacity_people_p50",
  "livestock_capacity_people_p50",
  "marine_capacity_people_p50",
  "freshwater_capacity_people_p50",
  "wild_capacity_people_p50",
]
# At zero development, only this fraction of GAEZ's optimally allocated
# rainfed/foraging/fisheries carrying capacity is available. HYDE provides a
# second, historical rainfed viability estimate; the stronger source wins per
# location after the starting development effect has been backed out.
gaez_zero_development_fraction = 0.25
gaez_zero_development_density_cap = 15.0
hyde_rainfed_capacity_multiplier = 4.0

# EU5 capacity units per point/level, then relative modifier per point/level.
development_absolute = 1.0
development_relative = 0.05
irrigation_absolute = 50.0
irrigation_relative = 0.0
development_min = 0.0
development_max = 100.0
minimum_capacity = 11.0

[development]
# Development is the share of GAEZ-manageable cropland that HYDE shows under
# management in 1337. Zero means none of that land is managed; 100 means all of
# it could be managed optimally if enough people were present. Pasture is a
# small secondary land-management signal, not a population proxy.
base = 0.0
manageable_cropland_column = "allocated_crop_fraction"
minimum_manageable_cropland_fraction = 0.02
cropland_utilization_points = 100.0
pasture_full_share_points = 10.0
start_min = 0.0
start_max = 100.0

[irrigation]
enabled = true
# Estimated HYDE 1300 irrigated km² required for levels 1..5.
level_thresholds_km2 = [1.0, 5.0, 15.0, 40.0, 100.0]

# Existing irrigant_cap structure: base + 0.1 development + lake + river size + owner.
base_legal_levels = 1.0
development_legal_levels_per_point = 0.10
lake_legal_levels = 1.0
owner_legal_levels = 0.0
require_river_or_lake = true

# Explicitly documented qanat/well/oasis exceptions may be added by location tag.
exceptions = []

[food_pressure]
# Keep the absolute small-location food mechanism. These values may be reduced
# modestly during tuning, but zero is not the default experiment.
abundant_monthly_food = 8.0
available_monthly_food = 3.0
abundant_peasant_food_consumption = -0.50
available_peasant_food_consumption = -0.32
overpopulation_peasant_food_consumption = 1.00

[population_growth]
# Tribesmen have zero parsed food consumption, so they cannot acquire the food-
# storage growth that normally offsets negative location-rank growth. Exempt only
# that negative rank term; all other growth effects still apply normally.
rank_degrowth_exempt_pop_types = ["tribesmen"]
# Tribesmen consume no simulated food, so province food storage should not grant
# them the consumption-derived population-growth buff.
food_storage_growth_exempt_pop_types = ["tribesmen"]

[targets]
# Ratios use HYDE 3.5 population totals normalized to the 1300 slice. The
# checkpoint comparison uses the nearest available slices: 1400, 1500, 1600,
# 1740, and 1840 for simulation years 100, 200, 300, 400, and 500.
global_tolerance = 0.15
regional_tolerance = 0.25
required_regional_pass_fraction = 0.75
# Game-start calibration is primary. Later HYDE rows remain in the report but do
# not make the profile fail while technology, migration, and transitions are absent.
primary_scored_through_year = 200
# The 1400 global contraction is retained as a reference but is not scored in
# capacity-only mode because the simulator does not currently model plague shocks.
global_excluded_years = [100]
global_ratios = { "0" = 1.0, "100" = 0.9698, "200" = 1.1037, "300" = 1.1329, "400" = 1.5446, "500" = 2.6632 }

