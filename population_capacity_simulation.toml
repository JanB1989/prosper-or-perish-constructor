# Adjustable 1337-1837 population-capacity simulation profile.
# Run only: uv run ppc population-simulation
# The command replaces one Markdown report; it does not write monthly history files.

[simulation]
start_year = 1337
checkpoint_years = [0, 25, 100, 200, 300, 400, 500]
people_per_game_unit = 1000
parser_profile = "constructor"
load_order = "constructor.load_order.toml"
output = "artifacts/data/population_simulation/report.md"

[paths]
# Regenerate manually from any save:
# uv run eu5parse savegame population-snapshot --save /path/to/save.eu5 --load-order constructor.load_order.toml --profile constructor --output artifacts/data/population_simulation/baseline_population.parquet
population_snapshot = "artifacts/data/population_simulation/baseline_population.parquet"
# Parsed from the same game-start save; reused as non-population evidence for
# infrastructure already present at the simulation baseline.
starting_buildings = "artifacts/data/savegame/buildings.parquet"
preparation_cache = "artifacts/data/population_simulation/prepared_sources.parquet"
location_candidates = "artifacts/data/population_capacity/current_capacity_map/location_candidates.parquet"
location_sample_points = "artifacts/data/population_capacity/location_sample_points.parquet"
landcover_capacity = "artifacts/data/population_capacity/location_landcover_capacity.parquet"
hyde_root = "../ProsperOrPerishStaticModifiersV2"
hyde_region_mask = "config/availability/regions.tif"
hyde_population_locations = "data/output_data/hyde_3_5/population_locations_1337.tif"
hyde_cropland = "data/output_data/hyde_3_5/cropland_1337.tif"
hyde_rainfed = "data/output_data/hyde_3_5/total_rainfed_1337.tif"
hyde_irrigated = "data/output_data/hyde_3_5/total_irrigated_1337.tif"
hyde_pasture = "data/output_data/hyde_3_5/pasture_1337.tif"
hyde_urban_population = "data/output_data/hyde_3_5/urban_population_1337.tif"

[deployment]
# One constructor-owned game-facing deployment. The location table is consumed
# by the existing shared location-modifier compiler; setup files make the
# starting development and irrigation values match the simulated year-0 state.
population_capacity_table = "data/population_capacity/population_capacity.csv"
development_setup = "mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/setup/start/14_development.txt"
irrigation_setup = "mod/Prosper or Perish (Population Growth & Food Rework)/main_menu/setup/start/14_pp_population_irrigation.txt"
manifest = "artifacts/data/population_simulation/deployment.json"
development_decimals = 2

[capacity]
# Independent GAEZ/fisheries/terrestrial potential. Historical irrigation is
# excluded here and enters only through HYDE-driven irrigation-system levels.
physical_capacity_columns = [
  "rainfed_crop_capacity_people_p50",
  "livestock_capacity_people_p50",
  "marine_capacity_people_p50",
  "freshwater_capacity_people_p50",
  "wild_capacity_people_p50",
  "open_rainfed_capacity_people_p50",
  "extensive_livestock_capacity_people_p50",
  "retained_wild_capacity_people_p50",
]
# Global, population-independent location-potential transform. The exponent is
# the only location-size term and deliberately makes area sub-linear.
gaez_zero_development_fraction = 1.0
physical_density_reference_people_per_km2 = 20.0
physical_density_elasticity = 0.35
location_area_exponent = 0.72
location_area_reference_km2 = 1000.0
location_potential_minimum = 4.0
location_potential_maximum_spread = 100.0
# Population-independent fallback from GAEZ-manageable land. Zero preserves the
# previous model; calibration may raise it globally when crop-yield rasters have
# an implausible local zero despite physically manageable land.
manageable_land_density_people_per_km2 = 0.0

regime_model_enabled = true
regime_model_potential_artifact = "artifacts/data/population_simulation/calibrated_location_potential.parquet"

# Development is multiplicative only. At development 80 this contributes 10%.
development_relative = 0.00125
global_relative = 0.0
development_min = 0.0
development_max = 80.0
minimum_capacity = 0.0

[capacity.source_weights]
rainfed_crop_capacity_people_p50 = 1.0
livestock_capacity_people_p50 = 0.20
marine_capacity_people_p50 = 0.20
freshwater_capacity_people_p50 = 0.50
wild_capacity_people_p50 = 0.05
open_rainfed_capacity_people_p50 = 1.0
extensive_livestock_capacity_people_p50 = 0.20
retained_wild_capacity_people_p50 = 0.05

[infrastructure.capacity_per_level]
# Flat EU5 population-capacity units (1 unit = 1,000 people) per building level.
irrigation_systems = 9.81
bund = 9.49
terraces = 2.0
polders = 6.23
land_clearance = 7.65
field_drainage = 6.23
irrigation_reservoirs = 9.81
qanats = 9.81
irrigated_rice_paddies = 9.49
pound_lock_canal_infrastructure = 0.0
farming_village = 7.65

[infrastructure.area_per_level_km2]
bund = 25.0
terraces = 50.0
polders = 30.0
farming_village = 100.0

[infrastructure.placement]
# LUH2/PNV land-clearing increment needed to justify one generated farming
# village level. This is physical land-cover evidence, never population.
clearing_increment_people_per_level = 25000.0
farming_cropland_fraction_per_level = 0.04
farming_minimum_cropland_fraction = 0.05

[infrastructure.max_levels]
bund = 5
terraces = 5
polders = 5
farming_village = 5

[development]
# Development is a bounded infrastructure score ranked by HYDE land use against
# GAEZ-manageable cropland. The exponential curve requires exceptional repeated
# land-management evidence to approach the historical ceiling; ordinary full
# cropland use is not equivalent to optimal infrastructure. Pasture remains a
# small secondary signal rather than a population proxy.
base = 0.0
manageable_cropland_column = "feasible_cultivated_fraction"
minimum_manageable_cropland_fraction = 0.02
cropland_utilization_points = 42.0
cropland_saturation_rate = 1.5
pasture_full_share_points = 5.0
landcover_cropland_points = 20.0
landcover_managed_points = 10.0
start_min = 0.0
start_max = 80.0

[irrigation]
enabled = true
# Estimated HYDE 1300 irrigated km² required for levels 1..5.
level_thresholds_km2 = [1.0, 5.0, 15.0, 40.0, 100.0]

# Existing irrigant_cap structure: base + 0.1 development + lake + river size + owner.
base_legal_levels = 1.0
development_legal_levels_per_point = 0.10
lake_legal_levels = 1.0
owner_legal_levels = 0.0
require_river_or_lake = true
# A fraction of mapped river size may directly justify historical irrigation
# or flood-control levels even where HYDE's irrigated-area cell is zero.
river_level_fraction = 0.0
# Existing market-village levels in arid, source-poor settlements are evidence
# for wells, qanats, cisterns, or oasis irrigation. This never reads population.
arid_settlement_level_fraction = 1.0

# Explicitly documented qanat/well/oasis exceptions may be added by location tag.
exceptions = []

[food_pressure]
# Absolute free-land food is fixed at zero and is not a calibration parameter.
abundant_monthly_food = 0.0
available_monthly_food = 0.0
abundant_peasant_food_consumption = -0.50
available_peasant_food_consumption = -0.32
overpopulation_peasant_food_consumption = 1.00

[population_growth]
# Tribesmen have zero parsed food consumption, so they cannot acquire the food-
# storage growth that normally offsets negative location-rank growth. Exempt only
# that negative rank term; all other growth effects still apply normally.
rank_degrowth_exempt_pop_types = ["tribesmen"]
# Tribesmen consume no simulated food, so province food storage should not grant
# them the consumption-derived population-growth buff.
food_storage_growth_exempt_pop_types = ["tribesmen"]

[acceptance]
ordinary_maximum_fill = 1.15
supercity_province_maximum_fill = 1.15
global_capacity_maximum_people = 1200000000
location_potential_maximum_spread = 100.0
development_maximum = 80.0
development_maximum_capacity_contribution = 0.10
global_modifier_minimum = -0.50
global_100y_growth_minimum = 0.90
global_100y_growth_maximum = 1.10
macro_region_100y_growth_minimum = 0.80
macro_region_100y_growth_maximum = 1.25
ranking_top_count = 20

[optimization]
algorithm = "regime_tree_lp"
study_name = "population_capacity_physical_tpe_lp_v16"
storage = "artifacts/data/population_simulation/calibration_trials.sqlite3"
report = "artifacts/data/population_simulation/calibration_report.md"
best_parameters = "artifacts/data/population_simulation/calibration_best.json"
regime_model = "artifacts/data/population_simulation/capacity_regime_model.json"
regime_potential = "artifacts/data/population_simulation/calibrated_location_potential.parquet"
seed = 1337
startup_trials = 64
solve_infrastructure_effects = true
regime_min_samples_leaf = 7
regime_max_leaf_nodes = 2310
global_capacity_safety_margin_people = 10000000
minimum_infrastructure_share = 0.35
regime_features = [
  "area_km2",
  "feasible_cultivated_fraction",
  "cropland_fraction_1300",
  "managed_land_fraction_1300",
  "hyde_cropland_area_km2",
  "hyde_irrigated_area_km2",
  "hyde_pasture_area_km2",
  "river_level",
  "is_coastal",
  "is_adjacent_to_lake",
  "existing_market_village_levels",
  "rainfed_crop_capacity_people_p50",
  "livestock_capacity_people_p50",
  "marine_capacity_people_p50",
  "freshwater_capacity_people_p50",
  "wild_capacity_people_p50",
  "open_rainfed_capacity_people_p50",
  "extensive_livestock_capacity_people_p50",
  "retained_wild_capacity_people_p50",
  "infrastructure_irrigation_systems_levels",
  "infrastructure_bund_levels",
  "infrastructure_terraces_levels",
  "infrastructure_polders_levels",
  "infrastructure_pound_lock_canal_infrastructure_levels",
  "infrastructure_farming_village_levels",
]

# Mixed continuous/integer search space consumed by multivariate TPE. Keys are
# the same typed dotted overrides accepted by population-simulation.
[optimization.search_space]
"capacity.physical_density_reference_people_per_km2" = { type = "float", low = 1.0, high = 200.0, log = true }
"capacity.physical_density_elasticity" = { type = "float", low = 0.1, high = 0.8 }
"capacity.location_area_exponent" = { type = "float", low = 0.45, high = 1.5 }
"capacity.global_relative" = { type = "float", low = -0.5, high = 0.0 }
"irrigation.river_level_fraction" = { type = "float", low = 0.0, high = 1.5 }
"irrigation.arid_settlement_level_fraction" = { type = "float", low = 0.25, high = 2.0 }
"infrastructure.placement.clearing_increment_people_per_level" = { type = "float", low = 5000.0, high = 100000.0, log = true }
"infrastructure.placement.farming_cropland_fraction_per_level" = { type = "float", low = 0.005, high = 0.20, log = true }
"infrastructure.placement.farming_minimum_cropland_fraction" = { type = "float", low = 0.0, high = 0.20 }
"infrastructure.area_per_level_km2.farming_village" = { type = "float", low = 5.0, high = 200.0, log = true }
"infrastructure.capacity_per_level.irrigation_systems" = { type = "float", low = 4.0, high = 120.0 }
"infrastructure.capacity_per_level.bund" = { type = "float", low = 2.0, high = 100.0 }
"infrastructure.capacity_per_level.terraces" = { type = "float", low = 2.0, high = 100.0 }
"infrastructure.capacity_per_level.polders" = { type = "float", low = 2.0, high = 120.0 }
"infrastructure.capacity_per_level.pound_lock_canal_infrastructure" = { type = "float", low = 0.0, high = 60.0 }
"infrastructure.capacity_per_level.farming_village" = { type = "float", low = 2.0, high = 100.0 }
"infrastructure.max_levels.farming_village" = { type = "int", low = 1, high = 60 }

[tracking]
supercity_exceptions = []
excluded_macro_regions = [
  "north_atlantic_ocean_sub_continent",
  "south_atlantic_sub_continent",
]
expected_high_capacity_provinces = ["suzhou_province", "cairo_province"]

# Each ordered triple is high-capacity breadbasket, representative middle, and
# constrained low-capacity province. Calibration updates these only with a
# written reason; ordinary runs merely monitor them.
[tracking.provinces]
australasia = ["umbindhamu_province", "dadi_dadi_province", "motu_maha_province"]
central_africa = ["bomokandi_province", "kinhasa_province", "kouilou_province"]
