[sanity]
max_report_locations = 8
spot_check_locations = [
  "wuxian",
  "changshu",
  "chongde",
  "delhi",
  "bijnot",
  "cairo",
  "alexandria",
  "london",
  "stockholm",
  "fanxian",
]
min_location_capacity = 11.0
max_location_capacity = 20000.0
# Game population units: 10,000 = ten million people in one location.
max_location_population = 10000.0
min_global_start_capacity_ratio = 1.0
min_start_population_within_capacity_fraction = 0.95
start_capacity_scored_regions = [
  "europe",
  "north_africa",
  "west_africa",
  "central_africa",
  "east_africa",
  "southern_africa",
  "near_east",
  "central_asia",
  "south_asia",
  "east_asia",
  "southeast_asia",
]
min_region_start_population_within_capacity_fraction = 0.90
established_population_threshold = 100.0
max_established_start_capacity_fill = 2.0
# Small locations deliberately retain the dominant absolute-food behavior; keep
# the extreme visible, but only fail on truly unbounded early overshoot.
max_location_capacity_fill = 5.0
min_location_25y_growth_factor = 0.80
max_location_25y_growth_factor = 2.0
min_location_100y_growth_factor = 0.50
max_location_100y_growth_factor = 4.5
max_development = 100.0
# Explicit game-start stability gates. Regional bounds are intentionally wider
# because HYDE, plague timing, and small-region denominators are approximate.
max_global_25y_deviation = 0.05
max_global_100y_deviation = 0.10
min_region_25y_ratio = 0.80
max_region_25y_ratio = 1.25
min_region_100y_ratio = 0.60
max_region_100y_ratio = 1.50
min_irrigation_river_or_lake_fraction = 0.85
min_irrigation_river_supported_level_fraction = 0.50
max_irrigation_cap_violations = 0
