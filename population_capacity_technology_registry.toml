schema_version = 2
target_year = 1337
policy = "Technology evidence can establish whether a premodern technique existed; it cannot supply a regional capacity multiplier or observed cropland share."

# Numeric fields are physical/engineering uncertainty envelopes, not fitted
# regional multipliers.  P10/P50/P90 denote conservative/central/permissive
# scenarios because the cited engineering sources do not provide a historical
# probability distribution.  The model never narrows these envelopes using EU5
# population or modern irrigated-area observations.
[surface_water_policy]
unmapped_resolution = "physical_fallback"
physical_fallback_parameter_set = "generic_gravity_surface_irrigation"
source_search_ceiling_km = 100.0

[[technology_parameter_sets]]
parameter_set_id = "generic_gravity_surface_irrigation"
water_modes = ["river", "lake"]
availability = "generic_physical_fallback"
max_conveyance_km_p10 = 2.0
max_conveyance_km_p50 = 9.487
max_conveyance_km_p90 = 45.0
max_lift_m_p10 = 0.0
max_lift_m_p50 = 0.0
max_lift_m_p90 = 0.0
max_slope_degrees_p10 = 0.573
max_slope_degrees_p50 = 1.718
max_slope_degrees_p90 = 6.843
conveyance_efficiency_p10 = 0.30
conveyance_efficiency_p50 = 0.40
conveyance_efficiency_p90 = 0.57
parameter_role = "universal 1337-toolkit physical fallback; no pumping, no mapped historical infrastructure"
derivation = "Reach P10 is FAO's >2 km long-canal boundary; P90 is the documented 45 km Roman Al-Arrub gravity aqueduct and P50 is their geometric midpoint. Slopes are atan(1%), atan(3%), and atan(12%), using FAO basin/bench-terrace guidance and the reported upper rarity threshold for gravity irrigation. Efficiency spans FAO poor schemes (30%), reasonable schemes (40%), and 95% lined conveyance times 60% surface application (57%)."
sources = [
  "https://www.fao.org/4/t7202e/t7202e08.htm",
  "https://www.fao.org/4/x5648e/x5648e07.htm",
  "https://www.fao.org/4/x5648e/x5648e0g.htm",
  "https://whc.unesco.org/en/tentativelists/6958/",
]

