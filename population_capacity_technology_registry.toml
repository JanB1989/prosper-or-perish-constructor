conveyance_efficiency_p50 = 0.48
conveyance_efficiency_p90 = 0.57
parameter_role = "vetted large gravity/canal tradition with no water lifting"
derivation = "FAO long earthen-canal conveyance values of 60-80% multiplied by 60% surface application give 36-48%; 95% lined conveyance times 60% gives 57%. Reach and slope bounds match the generic gravity envelope."
