]

[[technology_parameter_sets]]
parameter_set_id = "nile_gravity_basin_with_traditional_low_lift"
water_modes = ["river", "lake"]
availability = "vetted_system_only"
max_conveyance_km_p10 = 2.0
max_conveyance_km_p50 = 9.487
max_conveyance_km_p90 = 45.0
max_lift_m_p10 = 0.3
max_lift_m_p50 = 0.9
max_lift_m_p90 = 1.8
max_slope_degrees_p10 = 0.573
max_slope_degrees_p50 = 1.718
max_slope_degrees_p90 = 6.843
conveyance_efficiency_p10 = 0.30
conveyance_efficiency_p50 = 0.48
conveyance_efficiency_p90 = 0.57
parameter_role = "vetted Nile gravity/basin system plus traditional low-lift device"
derivation = "Traditional sakia measurements give 0.3, 0.9, and 1.8 m lifts for 2, 3, and 5 m wheels. The Metropolitan Museum documents the shaduf in Egypt around 1250 BCE; these bounds do not assume modern pumps. Efficiency, reach, and slope follow the surface-gravity evidence envelope."
sources = [
  "https://www.fao.org/4/ah810e/ah810e05.htm",
  "https://resources.metmuseum.org/resources/metpublications/pdf/The_Daily_Life_of_the_Ancient_Egyptians_The_Metropolitan_Museum_of_Art_Bulletin_v_31_no_3_Spring_1973.pdf",
  "https://www.fao.org/4/t7202e/t7202e08.htm",
]

[[technology_parameter_sets]]
parameter_set_id = "nile_basin_flood_basin_and_low_lift"
water_modes = ["river", "lake"]
availability = "vetted_system_only"
max_conveyance_km_p10 = 2.0
max_conveyance_km_p50 = 9.487
max_conveyance_km_p90 = 45.0
max_lift_m_p10 = 1.8
max_lift_m_p50 = 6.4
max_lift_m_p90 = 8.0
max_slope_degrees_p10 = 0.573
max_slope_degrees_p50 = 1.718
max_slope_degrees_p90 = 6.843
conveyance_efficiency_p10 = 0.30
conveyance_efficiency_p50 = 0.48
conveyance_efficiency_p90 = 0.57
parameter_role = "Nile flood-basin head plus pre-1337 low-lift access; not a modern pump assumption"
derivation = "Borsch documents an average Nile rise of 6.4 m and canal-fed basin irrigation in the Mamluk-era system; the historical Egyptian agriculture text reports a 7-8 m high/low Nile difference in Upper Egypt and about 1 m in Lower Egypt. The envelope therefore uses 1.8 m as a conservative manual-lift floor, 6.4 m as the observed mean flood head, and 8.0 m as the Upper-Egypt high-side case. It is used only for the explicitly mapped Nile basin system."
sources = [
  "https://knowledge.uchicago.edu/nanna/record/1009/files/MSR_IV_2000-Borsch.pdf?registerDownload=1&version=1&withMetadata=0&withWatermark=0",
  "https://upload.wikimedia.org/wikipedia/commons/4/44/Text-book_of_Egyptian_agriculture_%28IA_textbookofegypti00foadrich%29.pdf",
  "https://www.fao.org/4/ah810e/ah810e05.htm",
]

